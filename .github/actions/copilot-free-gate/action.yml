name: Copilot Free budget gate
description: Reserve one bounded Copilot Free session under the project-wide monthly protection cap.
inputs:
  github-token:
    description: GitHub token with contents:write on the repository
    required: true
  first-release-utc:
    description: First UTC instant at which the project reserve may be consumed
    required: false
    default: "2026-10-01T00:00:00Z"
runs:
  using: composite
  steps:
    - name: Reserve one protected Copilot Free session
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FIRST_RELEASE_UTC: ${{ inputs.first-release-utc }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import base64, json, os, subprocess
        from datetime import datetime, timezone

        repo = os.environ["GITHUB_REPOSITORY"]
        token = os.environ["GH_TOKEN"]
        path = "ops/copilot_free_budget_state.json"
        first_release = datetime.fromisoformat(os.environ["FIRST_RELEASE_UTC"].replace("Z", "+00:00"))
        now = datetime.now(timezone.utc)
        if now < first_release:
            print("COPILOT_FREE_GATE=CLOSED")
            raise SystemExit(2)

        month = now.strftime("%Y-%m")
        api = f"/repos/{repo}/contents/{path}?ref=master"
        current_sha = ""
        state = None
        try:
            raw = subprocess.check_output(
                ["gh", "api", api, "--jq", ".content + \":\" + .sha"],
                text=True, env={**os.environ, "GH_TOKEN": token}
            ).strip()
            encoded, current_sha = raw.rsplit(":", 1)
            state = json.loads(base64.b64decode(encoded).decode("utf-8"))
        except subprocess.CalledProcessError as exc:
            print("COPILOT_FREE_GATE=STATE_READ_FAILED")
            print(exc.output or "unable to read protected Copilot budget state")
            raise SystemExit(4) from exc

        if not isinstance(state, dict) or state.get("month") != month:
            state = {"schema_version": 1, "month": month, "reserved_sessions": 0, "max_reserved_sessions": 4}

        limit = int(state.get("max_reserved_sessions", 4))
        used = int(state.get("reserved_sessions", 0))
        if used >= limit:
            print(f"COPILOT_FREE_GATE=EXHAUSTED {used}/{limit}")
            raise SystemExit(3)

        state["reserved_sessions"] = used + 1
        state["reservation_policy"] = {
            "max_reserved_sessions_per_month": 4,
            "max_ai_credits_per_session": 30,
            "max_parallel_copilot_workers": 1,
            "paid_fallback_allowed": False,
            "overages_allowed": False,
        }
        state["last_reservation_utc"] = now.isoformat()
        state["last_reserving_workflow"] = os.environ.get("GITHUB_WORKFLOW", "")
        state["last_reserving_run_id"] = os.environ.get("GITHUB_RUN_ID", "")

        def encoded_payload(obj):
            return base64.b64encode((json.dumps(obj, ensure_ascii=False, indent=2) + "\n").encode()).decode()

        for attempt in range(1, 6):
            args = [
                "gh", "api", "--method", "PUT", f"/repos/{repo}/contents/{path}",
                "-f", "message=OPS: reserve protected Copilot Free worker budget",
                "-f", f"content={encoded_payload(state)}", "-f", "branch=master",
            ]
            if current_sha:
                args += ["-f", f"sha={current_sha}"]
            try:
                subprocess.check_output(args, text=True, stderr=subprocess.STDOUT, env={**os.environ, "GH_TOKEN": token})
                print(f"COPILOT_FREE_GATE=RESERVED session={state['reserved_sessions']}/{limit} credits_cap=30")
                break
            except subprocess.CalledProcessError as exc:
                if attempt == 5:
                    print(exc.output or "reservation failed")
                    raise
                try:
                    raw = subprocess.check_output(["gh", "api", api, "--jq", ".content + \":\" + .sha"], text=True, env={**os.environ, "GH_TOKEN": token}).strip()
                    encoded, current_sha = raw.rsplit(":", 1)
                    latest = json.loads(base64.b64decode(encoded).decode("utf-8"))
                    latest_month = latest.get("month")
                    latest_used = int(latest.get("reserved_sessions", 0)) if latest_month == month else 0
                    if latest_used >= limit:
                        raise SystemExit(3)
                    state["month"] = month
                    state["reserved_sessions"] = latest_used + 1
                except subprocess.CalledProcessError:
                    pass
        with open(os.environ["GITHUB_STEP_SUMMARY"], "w", encoding="utf-8") as fh:
            fh.write(f"Copilot Free reservation: {state['reserved_sessions']}/{limit}; max 30 AI credits; paid fallback disabled.\n")
        PY
