name: Self-hosted Runner Probe

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/self-hosted-runner-probe.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-self-hosted-runner-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 10
    steps:
      - name: Verify runner execution
        shell: cmd
        run: |
          @echo off
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          if /I not "%GITHUB_REF%"=="refs/heads/master" exit /b 1
          if not defined GITHUB_SHA exit /b 1
          echo RUNNER_PROBE=SUCCESS
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo GITHUB_SHA=%GITHUB_SHA%
          echo GITHUB_RUN_ID=%GITHUB_RUN_ID%
          whoami
          hostname
