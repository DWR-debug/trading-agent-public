name: Q113 13F Q107 Universe Coverage Feasibility

on:
  push:
    branches: [master]
    paths:
      - "automation/q113_13f_q107_coverage.py"
      - "tests/test_q113_13f_q107_coverage.py"
      - "research/preregistrations/q113_13f_q107_coverage_2026_10_01.json"
      - ".github/workflows/q113-13f-q107-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q113-13f-q107-coverage
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print(\"SAFETY INVARIANTS OK\")"
      - name: Contract tests
        run: python -m pytest -q tests/test_q113_13f_q107_coverage.py
      - name: Fixed SEC archive scan
        if: matrix.runner == 'ubuntu-24.04'
        run: python -m automation.q113_13f_q107_coverage

      - name: Validate Q113 receipt
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/runs/q113_13f_q107_coverage/result.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status'] == '13F_COVERAGE_FEASIBILITY_ONLY'
          assert all(v['coverage_status'] == 'FOUND' for v in r['coverage'].values())
          assert all(v['matched_rows'] > 0 and len(v['manager_ciks']) > 0 and len(v['cusips']) > 0 for v in r['coverage'].values())
          assert r['governance']['performance_authorized'] is False
          assert r['safety'] == {'paper_only': True, 'live_trading_enabled': False, 'orders_enabled': False, 'automatic_promotion': False}
          print('Q113 RECEIPT CONTRACT OK')
          PY

      - name: Publish immutable Q113 receipt
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$BASE_SHA"
          cmd=(python automation/github_contents_publish.py
            --repository "$GITHUB_REPOSITORY"
            --branch master
            --base-sha "$BASE_SHA"
            --file "research/evidence/q113_13f_q107_coverage_result.json=research/runs/q113_13f_q107_coverage/result.json")
          "${cmd[@]}"

      - name: Upload Q113 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q113-13f-q107-coverage-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q113_13f_q107_coverage/
          if-no-files-found: warn
          retention-days: 30
