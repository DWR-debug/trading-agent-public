name: Q043 Fresh Disjoint Alpha Replication Coverage

on:
  push:
    branches: [master]
    paths:
      - "research/asset_universes.py"
      - "research/preregistrations/q043_fresh_alpha_replication_coverage_2026_09_27.json"
      - "research/authorizations/q043_fresh_alpha_replication_coverage_2026_09_27.json"
      - "tests/test_q043_fresh_alpha_replication_coverage.py"
      - ".github/workflows/q043-fresh-disjoint-alpha-replication-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Safety and authorization guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q043_fresh_alpha_replication_coverage_2026_09_27.json").read_text())
          a=json.loads(Path("research/authorizations/q043_fresh_alpha_replication_coverage_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          assert a["authorized"] is True and a["execution_scope"]=="COVERAGE_ONLY"
          assert a["performance_execution_authorized"] is False
          assert p["governance"]["performance_trial_authorized"] is False
          print('Q043 SAFETY/AUTH OK')
          PY
      - name: Q043 contract tests
        run: python -m pytest -q tests/test_q043_fresh_alpha_replication_coverage.py
      - name: Q043 coverage
        run: python -m automation.q043_fresh_disjoint_alpha_replication --preregistration research/preregistrations/q043_fresh_alpha_replication_coverage_2026_09_27.json --output-root research/runs/q043_coverage
      - name: Validate Q043 receipt
        run: |
          python - <<'PY'
          import json,glob
          p=glob.glob('research/runs/q043_coverage/T-2026-09-27-063/coverage_preflight_*.json')
          assert len(p)==1
          d=json.load(open(p[0]))
          assert d["status"]=="coverage_passed"
          assert d["common_calendar_count"]>=3500
          assert d["selected_snapshot_count"]==3500
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          print('Q043 COVERAGE PASS',d['common_calendar_count'])
          print('COVERAGE_FINGERPRINT',d['coverage_fingerprint'])
          print('SNAPSHOT_FINGERPRINT',d['snapshot_fingerprint'])
          PY
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q043-fresh-alpha-replication-coverage-${{ github.run_id }}
          path: research/runs/q043_coverage/
          if-no-files-found: error
          retention-days: 30
