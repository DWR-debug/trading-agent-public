name: Q218 Event Pair PIT Gate
on:
  pull_request:
    branches: [master]
    paths:
      - "automation/q218_event_pair_pit_gate.py"
      - "tests/test_q218_event_pair_pit_gate.py"
      - "research/preregistrations/q218_event_pair_pit_gate_2026_10_06.json"
      - ".github/workflows/q218-event-pair-pit-gate.yml"
      - "automation/q218_q221_historical_source_census.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-agent-q218-event-pair-pit-gate
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: Contract tests
        run: python -m pytest -q tests/test_q218_event_pair_pit_gate.py
      - name: Rebuild Q218 historical source census
        run: |
          mkdir -p research/runs/q218_event_pair_pit_gate/${{ github.run_id }}
          python -m automation.q218_q221_historical_source_census --output research/runs/q218_event_pair_pit_gate/${{ github.run_id }}/historical_source_census.json
      - name: Run deterministic Q218 event-pair gate
        run: |
          python -m automation.q218_event_pair_pit_gate --census research/runs/q218_event_pair_pit_gate/${{ github.run_id }}/historical_source_census.json --output research/runs/q218_event_pair_pit_gate/${{ github.run_id }}/event_pair_gate.json
      - name: Validate non-authorizing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q218_event_pair_pit_gate/${{ github.run_id }}/event_pair_gate.json").read_text())
          assert p["issuer_count"] == 8
          for k in ("scientific_evidence","performance_authorization","holdout_selection","ranking","tuning","promotion","live_execution"):
              assert p[k] is False
          assert p["paper_only"] is True
          print("Q218_EVENT_PAIR_BOUNDARY=PASS")
          print("Q218_EVENT_PAIR_TARGETS=",p["target_10k_count"])
          print("Q218_EVENT_PAIR_PAIRED=",p["paired_10k_count"])
          print("Q218_EVENT_PAIR_UNPAIRED=",p["unpaired_10k_count"])
          print("Q218_EVENT_PAIR_RECEIPT=",p["receipt_fingerprint"])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q218-event-pair-pit-gate-${{ github.run_id }}
          path: research/runs/q218_event_pair_pit_gate/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
