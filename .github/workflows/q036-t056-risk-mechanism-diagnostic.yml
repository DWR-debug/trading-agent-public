name: Q036 T056 Risk Mechanism Diagnostic
run-name: Q036 T056 diagnostic ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths:
      - research/preregistrations/q036_t056_risk_mechanism_diagnostic_2026_09_27.json
      - research/authorizations/q036_t056_risk_mechanism_diagnostic_2026_09_27.json
      - automation/q036_t056_risk_mechanism_diagnostic.py
      - tests/test_q036_t056_risk_mechanism_diagnostic.py
      - portfolio/q030_risk_mechanisms.py
      - automation/q035_risk_stability_performance.py
      - .github/workflows/q036-t056-risk-mechanism-diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnostic:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0

      - name: Safety and diagnostic authorization guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q036_t056_risk_mechanism_diagnostic_2026_09_27.json").read_text())
          auth=json.loads(Path("research/authorizations/q036_t056_risk_mechanism_diagnostic_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True
          assert auth["execution_scope"]=="FIXED_RESULT_DIAGNOSTIC_ONLY"
          assert auth["performance_execution_authorized"] is False
          assert spec["governance"]["performance_evaluation"] is False
          assert spec["governance"]["holdout_evaluation"] is False
          assert spec["methodology"]["no_parameter_search"] is True
          assert spec["methodology"]["no_family_ranking"] is True
          print("Q036 SAFETY/AUTH OK")
          PY

      - name: Download exact T056 artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/t056_artifact.zip \
            "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/10939680447/zip"
          mkdir -p /tmp/t056_artifact
          unzip -q /tmp/t056_artifact.zip -d /tmp/t056_artifact
          test -f /tmp/t056_artifact/q035_performance/T-2026-09-27-056/performance_report.json
          test -n "$(find /tmp/t056_artifact/q035_coverage/T-2026-09-27-053-COVERAGE -name 'coverage_preflight_*.json' -print -quit)"

      - name: Bind exact T056 performance runner source
        run: |
          test "$(git hash-object automation/q035_risk_stability_performance.py)" = "33be8c29281ed7da2d109baad641d28fb91802e3"
          cp automation/q035_risk_stability_performance.py /tmp/q035_exact.py
          test -s /tmp/q035_exact.py

      - name: Run Q036 diagnostic
        run: |
          python -m automation.q036_t056_risk_mechanism_diagnostic \
            --report /tmp/t056_artifact/q035_performance/T-2026-09-27-056/performance_report.json \
            --exact-runner /tmp/q035_exact.py \
            --output research/runs/q036_diagnostic/T-2026-09-27-057/diagnostic_report.json

      - name: Validate Q036 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q036_diagnostic/T-2026-09-27-057/diagnostic_report.json").read_text())
          assert d["status"]=="DIAGNOSTIC_COMPLETED"
          assert d["source_head_sha"]=="23e09d478ef4d7c9f866b8fc123b1842c9953ad8"
          assert d["source_report_fingerprint"]=="56feed52b6c8321e3b4cfcf7914b87d2d54ad4cf7d1cf66b095a62db0453943f"
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["family_ranking"] is False
          assert d["governance"]["selection_used"] is False
          assert d["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("Q036 DIAGNOSTIC GOVERNANCE PASS")
          print("DIAGNOSTIC_FINGERPRINT:",d["diagnostic_fingerprint"])
          PY

      - name: Focused tests
        run: python -m pytest -q tests/test_q036_t056_risk_mechanism_diagnostic.py

      - name: Publish Q036 run summary
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          import urllib.request
          p=Path("research/runs/q036_diagnostic/T-2026-09-27-057/diagnostic_report.json")
          summary={"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"job_status":os.environ["JOB_STATUS"]}
          if p.exists():
              d=json.loads(p.read_text())
              summary.update({"trial_id":d.get("trial_id"),"status":d.get("status"),"diagnostic_fingerprint":d.get("diagnostic_fingerprint"),"performance_evaluation":d.get("governance",{}).get("performance_evaluation"),"family_ranking":d.get("governance",{}).get("family_ranking")})
          body="Q036 run summary\n\n"+"\n".join(f"- {k}: {v}" for k,v in summary.items())
          payload=json.dumps({"body":body}).encode()
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/343/comments"
          req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response: response.read()
          print("Q036 RUN SUMMARY PUBLISHED")

      - name: Publish Q036 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q036-t056-risk-mechanism-diagnostic-${{ github.run_id }}
          path: research/runs/q036_diagnostic/
          if-no-files-found: error
          retention-days: 30
