name: Q104 I19 Receipt-Gated Targeted Acceptance Repair Request

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q104_i19_targeted_acceptance_repair.trigger"

permissions:
  actions: read
  contents: write

concurrency:
  group: trading-agent-q104-i19-targeted-acceptance-repair-request
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      shard_recovery_run_id: ${{ steps.request.outputs.shard_recovery_run_id }}
      recovered_shards: ${{ steps.request.outputs.recovered_shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate explicit repair request and frozen artifact availability
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="research/run_requests/q104_i19_targeted_acceptance_repair.trigger"
          test -s "$request" || { echo "Q104_I19_REPAIR_REQUEST_FILE_MISSING"; exit 2; }

          while IFS= read -r line; do
            [[ "$line" =~ ^[A-Z_]+=[A-Za-z0-9._,:-]*$ ]] || {
              echo "Q104_I19_REPAIR_REQUEST_INVALID_LINE"; exit 2;
            }
            key="\${line%%=*}"
            case "$key" in
              RUN_Q104_I19_TARGETED_REPAIR|REASON|SOURCE_RUN_ID|SHARD_RECOVERY_RUN_ID|RECOVERED_SHARDS|CENSUS_RESTART|SOURCE_SNAPSHOT_REUSE|PERFORMANCE|HOLDOUT_SELECTION|RANKING|TUNING|PROMOTION|LIVE_EXECUTION|REQUEST_SEQUENCE) ;;
              *) echo "Q104_I19_REPAIR_REQUEST_UNKNOWN_KEY:$key"; exit 2 ;;
            esac
          done < "$request"

          value() {
            local key="$1"
            local count
            count="$(grep -c "^\${key}=" "$request" || true)"
            [[ "$count" == "1" ]] || { echo "Q104_I19_REPAIR_REQUEST_KEY_COUNT:$key" >&2; return 2; }
            sed -n "s/^\${key}=//p" "$request"
          }

          grep -Fxq "RUN_Q104_I19_TARGETED_REPAIR=true" "$request"
          grep -Fxq "CENSUS_RESTART=false" "$request"
          grep -Fxq "SOURCE_SNAPSHOT_REUSE=true" "$request"
          for flag in \
            "PERFORMANCE=false" \
            "HOLDOUT_SELECTION=false" \
            "RANKING=false" \
            "TUNING=false" \
            "PROMOTION=false" \
            "LIVE_EXECUTION=false"; do
            grep -Fxq "$flag" "$request" || {
              echo "Q104_I19_REPAIR_SAFETY_FLAG_MISSING:$flag"; exit 2;
            }
          done

          source_run_id="$(value SOURCE_RUN_ID)"
          recovery_run_id="$(value SHARD_RECOVERY_RUN_ID)"
          recovered_shards="$(value RECOVERED_SHARDS)"
          request_sequence="$(value REQUEST_SEQUENCE)"
          [[ "$source_run_id" =~ ^[0-9]+$ ]] || { echo "INVALID_I19_SOURCE_RUN_ID"; exit 2; }
          [[ "$recovery_run_id" =~ ^[0-9]+$ ]] || { echo "INVALID_I19_RECOVERY_RUN_ID"; exit 2; }
          [[ "$request_sequence" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "Q104_I19_REQUEST_SEQUENCE_INVALID"; exit 2;
          }

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > "$RUNNER_TEMP/i19-source-run.json"
          jq -e '
            .name == "Q104 I19 Historical 13F Identity Census"
            and .status == "completed"
            and .conclusion == "failure"
            and .head_branch == "master"
          ' "$RUNNER_TEMP/i19-source-run.json" >/dev/null || {
            echo "Q104_I19_SOURCE_RUN_NOT_COMPLETED_FAILED_MASTER_CENSUS"; exit 2;
          }

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id" > "$RUNNER_TEMP/i19-recovery-run.json"
          jq -e '
            .status == "completed"
            and .head_branch == "master"
            and (
              .name == "Q104 I19 Historical 13F Identity Census"
              or .name == "Q104 I19 Missing Shard Receipt Recovery"
            )
          ' "$RUNNER_TEMP/i19-recovery-run.json" >/dev/null || {
            echo "Q104_I19_RECOVERY_RUN_NOT_COMPLETED_ALLOWED_MASTER_RUN"; exit 2;
          }

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" > "$RUNNER_TEMP/i19-source-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id/artifacts?per_page=100" > "$RUNNER_TEMP/i19-recovery-artifacts.json"
          jq -e --arg n "q104-i19-sec-source-snapshot-$source_run_id" \
            '[.artifacts[]? | select(.name == $n and .expired == false)] | length == 1' \
            "$RUNNER_TEMP/i19-source-artifacts.json" >/dev/null || {
              echo "Q104_I19_FROZEN_SOURCE_SNAPSHOT_MISSING_OR_EXPIRED"; exit 2;
            }

          IFS=',' read -r -a recovered <<< "$recovered_shards"
          allowed=",2013-2016,2017-2018,2019-2020,2021-2022,2023,2024-2025-09,"
          for shard in "\${recovered[@]}"; do
            [[ -z "$shard" ]] && continue
            case "$allowed" in *,"$shard",*) ;; *) echo "INVALID_I19_RECOVERED_SHARD:$shard"; exit 2 ;; esac
          done

          for shard in 2013-2016 2017-2018 2019-2020 2021-2022 2023 2024-2025-09; do
            artifact="q104-i19-census-$shard-$source_run_id"
            artifact_json="$RUNNER_TEMP/i19-source-artifacts.json"
            case ",$recovered_shards," in
              *,"$shard",*) artifact="q104-i19-census-$shard-$recovery_run_id"; artifact_json="$RUNNER_TEMP/i19-recovery-artifacts.json" ;;
            esac
            jq -e --arg n "$artifact" \
              '[.artifacts[]? | select(.name == $n and .expired == false)] | length == 1' \
              "$artifact_json" >/dev/null || {
                echo "Q104_I19_REQUIRED_SHARD_RECEIPT_MISSING_OR_EXPIRED:$artifact"; exit 2;
              }
          done

          {
            echo "source_run_id=$source_run_id"
            echo "shard_recovery_run_id=$recovery_run_id"
            echo "recovered_shards=$recovered_shards"
          } >> "$GITHUB_OUTPUT"
          echo "Q104_I19_TARGETED_REPAIR_REQUEST_VALIDATED=true"
          echo "Q104_I19_SOURCE_RUN_ID=$source_run_id"
          echo "Q104_I19_REQUEST_SEQUENCE=$request_sequence"

  repair:
    needs: [validate]
    if: github.repository == 'DWR-debug/trading-agent-public'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/q104-i19-targeted-acceptance-repair.yml
    with:
      source_run_id: ${{ needs.validate.outputs.source_run_id }}
      shard_recovery_run_id: ${{ needs.validate.outputs.shard_recovery_run_id }}
      recovered_shards: ${{ needs.validate.outputs.recovered_shards }}
