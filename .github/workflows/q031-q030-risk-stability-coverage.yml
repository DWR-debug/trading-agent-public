name: Q031 Q030 Risk Stability Coverage Preflight

on:
  push:
    branches:
      - master
      - research/q031-q030-mechanism-coverage-20260927
    paths:
      - research/asset_universes.py
      - research/preregistrations/q031_q030_risk_stability_coverage_2026_09_27.json
      - research/authorizations/q031_q030_risk_stability_coverage_2026_09_27.json
      - tests/test_q031_q030_risk_stability_coverage.py
      - .github/workflows/q031-q030-risk-stability-coverage.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q031-risk-stability-coverage
  cancel-in-progress: false

jobs:
  coverage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest statsmodels==0.15.0
      - name: Safety and authorization guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          auth=json.loads(Path("research/authorizations/q031_q030_risk_stability_coverage_2026_09_27.json").read_text())
          assert auth["authorized"] is True
          assert auth["execution_scope"] == "COVERAGE_ONLY"
          assert auth["performance_execution_authorized"] is False
          print("Q031 SAFETY/AUTH OK")
          PY
      - name: Contract tests
        run: python -m pytest -q tests/test_q031_q030_risk_stability_coverage.py tests/test_coverage_preflight.py
      - name: Coverage preflight
        run: |
          set -euo pipefail
          python -m automation.coverage_preflight --preregistration research/preregistrations/q031_q030_risk_stability_coverage_2026_09_27.json --output-root research/runs/q031_q030_risk_stability_coverage
      - name: Enforce coverage-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/runs/q031_q030_risk_stability_coverage")
          candidates=list(root.rglob("*.json"))
          assert candidates
          d=json.loads(candidates[-1].read_text())
          assert d["performance_evaluation"] is False
          assert d["oos_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("Q031 COVERAGE-ONLY CONTRACT OK")
          print("STATUS:", d["status"])
          PY
      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q031-q030-risk-stability-coverage-${{ github.run_id }}
          path: research/runs/q031_q030_risk_stability_coverage/
          if-no-files-found: warn
          retention-days: 30
