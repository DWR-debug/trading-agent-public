name: Q120 Independent Reproduction

on:
  schedule:
    - cron: "55 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q120_cftc_source_feasibility.py"
      - "tests/test_q120_cftc_source_feasibility.py"
      - ".github/workflows/q120-independent-reproduction.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q120-independent-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Independent Q120 source/PIT reproduction
        run: python -m automation.q120_cftc_source_feasibility --output research/runs/q120_cftc/q120_independent_reproduction.json

      - name: Validate reproduction boundary
        run: python -c "import json; from pathlib import Path; p=json.loads(Path('research/runs/q120_cftc/q120_independent_reproduction.json').read_text()); assert p['status']=='Q120_SOURCE_ARCHIVE_AND_RELEASE_SCHEDULE_FEASIBILITY_COMPLETED'; assert p['validation']['contract_code']=='13874A'; assert p['validation']['required_fields_complete'] is True; assert p['release_dates_recovered'] is False; assert p['governance']['performance'] is False; assert p['governance']['performance_authorized'] is False; assert p['safety']['paper_only'] is True; print('Q120_INDEPENDENT_REPRODUCTION=PASS'); print('Q120_ROWS=', p['validation']['row_count']); print('Q120_FIRST=', p['validation']['first_report_date']); print('Q120_LAST=', p['validation']['last_report_date']); print('Q120_NAMES=', p['validation']['observed_market_names'][:10]); print('Q120_RECEIPT=', p['receipt_fingerprint'])"

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q120-independent-reproduction-${{ github.run_id }}
          path: research/runs/q120_cftc/q120_independent_reproduction.json
          if-no-files-found: error
          retention-days: 30
