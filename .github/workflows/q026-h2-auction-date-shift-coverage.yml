name: Q026 H2 Treasury Auction-Date Shift Coverage

# Trigger refresh after syntax-gate repair.

on:
  push:
    branches:
      - research/q026-h2-auction-date-shift-performance-2026-09-27
    paths:
      - research/preregistrations/q026_h2_treasury_auction_date_shift_performance_2026_09_27.json
      - research/authorizations/q026_h2_treasury_auction_date_shift_coverage_2026_09_27.json
      - research/asset_universes.py
      - automation/coverage_preflight.py
      - data/canonical_snapshot.py
      - tests/test_q026_h2_treasury_auction_date_shift_design.py
      - .github/workflows/q026-h2-auction-date-shift-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q026-h2-auction-date-shift-coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Governance and regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          PY
          python -m pytest -q tests/test_q026_h2_treasury_auction_date_shift_design.py tests/test_coverage_preflight.py

      - name: Fresh Q026 coverage
        run: |
          set -euo pipefail
          python -m automation.coverage_preflight \
            --preregistration research/preregistrations/q026_h2_treasury_auction_date_shift_performance_2026_09_27.json \
            --output-root research/runs/q026_h2_coverage

      - name: Coverage gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json
          paths=glob.glob("research/runs/q026_h2_coverage/T-2026-09-27-048/*.json")
          assert paths, "coverage report missing"
          d=json.load(open(paths[-1],encoding="utf-8"))
          assert d["status"] == "coverage_passed", d["status"]
          assert len(d["symbols"]) == 12
          assert d["snapshot_fingerprint"]
          print(json.dumps({
              "status":d["status"],
              "symbols":len(d["symbols"]),
              "common_calendar_count":d["common_calendar_count"],
              "snapshot_fingerprint":d["snapshot_fingerprint"],
              "coverage_fingerprint":d["coverage_fingerprint"]
          }, sort_keys=True))
          PY

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q026-h2-auction-date-shift-coverage-\${{ github.run_id }}
          path: research/runs/q026_h2_coverage/
          if-no-files-found: warn
          retention-days: 30
