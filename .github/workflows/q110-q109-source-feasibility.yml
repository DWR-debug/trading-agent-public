name: Q110 Q109 Source Feasibility

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q110_q109_source_feasibility_2026_10_01.json"
      - "automation/q110_q109_source_feasibility.py"
      - "tests/test_q110_q109_source_feasibility.py"
      - ".github/workflows/q110-q109-source-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q110-q109-source-feasibility
  cancel-in-progress: false

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Q109 design contract
        run: python -m pytest -q tests/test_q109_candidate_wave_contract.py

      - name: Q110 source feasibility contract
        run: python -m pytest -q tests/test_q110_q109_source_feasibility.py

      - name: Q110 live source audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m automation.q110_q109_source_feasibility

      - name: Validate non-authorizing output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q110_q109_source_feasibility/result.json").read_text(encoding="utf-8"))
          assert d["status"] == "SOURCE_FEASIBILITY_ONLY"
          assert d["governance"]["performance_authorization"] is False
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["candidate_selection"] is False
          assert d["governance"]["parameter_search"] is False
          assert d["safety"]["paper_only"] is True
          print("Q110 SOURCE CONTRACT OK")
          print("Q110_VERIFIABLE="+str(d["summary"]["verifiable_probes"]))
          print("Q110_SCHEMA_MISMATCH="+str(d["summary"]["schema_mismatch_probes"]))
          print("Q110_BLOCKED="+str(d["summary"]["blocked_probes"]))
          print("Q110_FP="+d["receipt_fingerprint"])
          PY

      - name: Publish immutable Q110 receipt
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$BASE_SHA"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$BASE_SHA"             --file research/evidence/q110_q109_source_feasibility_2026_10_01.json=research/runs/q110_q109_source_feasibility/result.json
