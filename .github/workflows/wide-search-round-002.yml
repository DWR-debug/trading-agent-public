name: Wide Search Round 002 - Volatility Regime

on:
  workflow_dispatch:
  push:
    branches:
      - research/wide-search-round-002-volatility-regime

permissions:
  contents: read

concurrency:
  group: trading-agent-wide-search-round-002
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install statsmodels==0.15.0 pytest
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("ROUND 002 SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_round_002_volatility_regime.py
      - name: Volatility-Regime Diagnostic
        run: |
          set -euo pipefail
          python -m automation.wide_search_round_002_volatility_regime
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-round-002-${{ github.run_id }}
          path: research/runs/wide_search/
          if-no-files-found: warn
          retention-days: 30
