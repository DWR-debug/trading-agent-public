name: Q091 Persist Verified Coverage Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/ops/q091_persist_coverage.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q091-persist-coverage
  cancel-in-progress: false

jobs:
  persist:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Check whether Q091 coverage is already persisted
        id: prior
        shell: bash
        run: |
          if test -f research/evidence/q091_coverage_result.json && test -f research/evidence/q091_pit_result.json && test -f research/runs/q091_coverage/T-2026-09-29-091-COVERAGE/snapshot_manifest.json; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified Q091 coverage artifact
        if: steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 36554470057             --repo "$GITHUB_REPOSITORY"             --name q091-portfolio-architecture-36554470057-1             --dir "$RUNNER_TEMP/q091_verified"

      - name: Persist artifact contents
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/q091_verified/evidence/q091_coverage_result.json"
          test -f "$RUNNER_TEMP/q091_verified/evidence/q091_pit_result.json"
          test -f "$RUNNER_TEMP/q091_verified/runs/q091_coverage/T-2026-09-29-091-COVERAGE/snapshot_manifest.json"
          cp -R "$RUNNER_TEMP/q091_verified/evidence/." research/evidence/
          mkdir -p research/runs/q091_coverage
          cp -R "$RUNNER_TEMP/q091_verified/runs/q091_coverage/." research/runs/q091_coverage/

      - name: Verify receipts before commit
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q091_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q091_pit_result.json").read_text())
          assert c["trial_id"] == "T-2026-09-29-091-COVERAGE"
          assert c["status"] == "COVERAGE_PASSED"
          assert c["performance_evaluation"] is False
          assert p["trial_id"] == "T-2026-09-29-091-PIT"
          assert p["status"] == "PIT_PASSED"
          assert p["performance_evaluation"] is False
          print("Q091 VERIFIED ARTIFACT CONTENT OK")
          PY

      - name: Commit immutable preparation pack
        if: steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/evidence/q091_coverage_result.json research/evidence/q091_asset_freeze.json research/evidence/q091_pit_result.json research/runs/q091_coverage
          # The immutable CSV snapshot is written with canonical CSV line endings.
          # Git's whitespace checker treats the CR in CRLF rows as trailing whitespace,
          # so a repository-wide diff --check would reject valid snapshot bytes.
          git commit -m "EVIDENCE: persist Q091 coverage and PIT snapshot"
          git push origin master
