name: Literature Frontier Scout

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-literature-frontier-scout
  cancel-in-progress: false

jobs:
  scout:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bounded test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Validate literature discovery policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/governance/literature_research_policy.json").read_text())
          assert p["status"] == "ACTIVE"
          assert p["discovery_boundary"]["performance_authorized"] is False
          assert p["discovery_boundary"]["holdout_selection_allowed"] is False
          assert p["discovery_boundary"]["promotion_allowed"] is False
          assert p["selection_rule"]["shortlist_maximum"] <= 4
          print("LITERATURE_POLICY_OK")
          PY
          python -m pytest -q tests/test_literature_frontier_scout.py

      - name: Run public literature metadata scout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cat > "$OUT/query_manifest.json" <<'JSON'
          {
            "schema_version": 1,
            "record_type": "public_literature_query_manifest",
            "discovery_only": true,
            "queries": [
              ["information_diffusion","information diffusion firms limited attention stock returns"],
              ["disclosure_novelty","corporate disclosure novelty semantic change 10-K investor response"],
              ["network_risk","risk network disclosures return comovement forward beta"],
              ["market_microstructure","public information arrival price discovery liquidity news"],
              ["data_revisions","real-time data revisions vintage asset returns predictability"],
              ["innovation_networks","patent innovation network information diffusion asset pricing"],
              ["disagreement","investor disagreement public news heterogeneous beliefs trading volume volatility"],
              ["unexpected_channels","employee disclosure public signals firm prospects information diffusion"]
            ]
          }
          JSON
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "research/runs/literature_frontier" / os.environ["GITHUB_RUN_ID"]
          manifest = json.loads((root / "query_manifest.json").read_text())
          results, errors = [], []
          for axis, query in manifest["queries"]:
              params = urlencode({
                  "search": query,
                  "filter": "from_publication_date:2021-01-01",
                  "per-page": 6,
                  "mailto": "research@trading-agent.invalid",
              })
              url = "https://api.openalex.org/works?" + params
              try:
                  req = Request(url, headers={"User-Agent":"TradingAgent-Public-Literature-Scout/1.0"})
                  with urlopen(req, timeout=20) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  for work in data.get("results", []):
                      loc = work.get("primary_location") or {}
                      src = loc.get("source") or {}
                      results.append({
                          "axis": axis,
                          "openalex_id": work.get("id"),
                          "title": work.get("display_name"),
                          "publication_date": work.get("publication_date"),
                          "type": work.get("type"),
                          "doi": work.get("doi"),
                          "venue": src.get("display_name"),
                          "cited_by_count": work.get("cited_by_count"),
                          "open_access": (work.get("open_access") or {}).get("is_oa"),
                          "landing_page": loc.get("landing_page_url"),
                          "source_url": url,
                          "discovery_only": True
                      })
              except Exception as exc:
                  errors.append({"axis":axis,"error":f"{type(exc).__name__}:{exc}"})
          dedup = {}
          for item in results:
              dedup[str(item.get("doi") or item.get("openalex_id") or item.get("title"))] = item
          payload = {
              "schema_version":1,
              "record_type":"literature_frontier_scout",
              "status":"DISCOVERY_METADATA_ONLY",
              "source":"OpenAlex public works API",
              "generated_at_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "query_count":len(manifest["queries"]),
              "result_count":len(dedup),
              "errors":errors,
              "results":list(dedup.values()),
              "governance":{
                  "performance_authorized":False,
                  "holdout_selection_allowed":False,
                  "ranking_for_scientific_selection":False,
                  "parameter_search_allowed":False,
                  "asset_search_allowed":False,
                  "threshold_search_allowed":False,
                  "horizon_search_allowed":False,
                  "promotion_allowed":False,
                  "live_execution_allowed":False,
                  "source_claims_are_not_project_evidence":True
              }
          }
          raw=json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",",":"))
          payload["bundle_fingerprint"]=hashlib.sha256(raw.encode()).hexdigest()
          (root/"scout.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print("LITERATURE_SCOUT_STATUS="+payload["status"])
          print("LITERATURE_SCOUT_RESULTS="+str(payload["result_count"]))
          print("LITERATURE_SCOUT_ERRORS="+str(len(errors)))
          print("LITERATURE_SCOUT_FINGERPRINT="+payload["bundle_fingerprint"])
          PY

      - name: Scan free public repositories and web-linked research/blog sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"]) / "research/runs/literature_frontier" / os.environ["GITHUB_RUN_ID"]
          manifest=json.loads((root/"query_manifest.json").read_text())
          repo_results=[]; web_results=[]; errors=[]
          headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ.get('GH_TOKEN','')}","User-Agent":"TradingAgent-Public-Literature-Scout/1.0"}
          for axis, query in manifest["queries"]:
              try:
                  gh_url="https://api.github.com/search/repositories?"+urllib.parse.urlencode({"q": f"({query}) in:name,description,readme", "per_page": 5, "sort": "stars", "order": "desc"})
                  req=urllib.request.Request(gh_url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as resp: data=json.loads(resp.read().decode("utf-8"))
                  for repo in data.get("items",[]):
                      repo_results.append({"axis":axis,"source_kind":"public_github_repository","repository":repo.get("full_name"),"description":repo.get("description"),"html_url":repo.get("html_url"),"topics":repo.get("topics",[]),"stargazers_count":repo.get("stargazers_count"),"updated_at":repo.get("updated_at"),"discovery_only":True})
              except Exception as exc:
                  errors.append({"axis":axis,"source_kind":"public_github_repository","error":f"{type(exc).__name__}:{exc}"})
              try:
                  hn_url="https://hn.algolia.com/api/v1/search?"+urllib.parse.urlencode({"query":query,"tags":"story","hitsPerPage":5})
                  req=urllib.request.Request(hn_url,headers={"User-Agent":"TradingAgent-Public-Literature-Scout/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as resp: data=json.loads(resp.read().decode("utf-8"))
                  for hit in data.get("hits",[]):
                      if hit.get("url"): web_results.append({"axis":axis,"source_kind":"public_web_link_blog_research","title":hit.get("title"),"url":hit.get("url"),"hn_url":(f"https://news.ycombinator.com/item?id={hit.get('objectID')}" if hit.get("objectID") else None),"created_at":hit.get("created_at"),"points":hit.get("points"),"discovery_only":True})
              except Exception as exc:
                  errors.append({"axis":axis,"source_kind":"public_web_link_blog_research","error":f"{type(exc).__name__}:{exc}"})
          dedup_repo={x.get("repository"):x for x in repo_results if x.get("repository")}
          dedup_web={x.get("url"):x for x in web_results if x.get("url")}
          payload={"schema_version":1,"record_type":"free_public_source_discovery","status":"DISCOVERY_METADATA_ONLY","generated_at_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),"source_classes":["public_github_repository","public_web_link_blog_research"],"repository_result_count":len(dedup_repo),"web_link_result_count":len(dedup_web),"errors":errors,"repositories":list(dedup_repo.values()),"web_links":list(dedup_web.values()),"governance":{"performance_authorized":False,"holdout_selection_allowed":False,"ranking_for_scientific_selection":False,"parameter_search_allowed":False,"asset_search_allowed":False,"threshold_search_allowed":False,"horizon_search_allowed":False,"promotion_allowed":False,"live_execution_allowed":False,"source_claims_are_not_project_evidence":True,"free_access_scope_is_broad_not_exhaustive":True}}
          (root/"free_public_sources.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print("FREE_PUBLIC_SOURCE_DISCOVERY="+payload["status"])
          print("FREE_PUBLIC_REPOSITORIES="+str(payload["repository_result_count"]))
          print("FREE_PUBLIC_WEB_LINKS="+str(payload["web_link_result_count"]))
          print("FREE_PUBLIC_SOURCE_ERRORS="+str(len(errors)))
          PY

      - name: Upload discovery receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: literature-frontier-scout-${{ github.run_id }}
          path: research/runs/literature_frontier/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
