name: T050 Fixed Candidate Batch 02 Coverage Preflight

on:
  push:
    branches: [master]
    paths:
      - research/asset_universes.py
      - research/preregistrations/trial_050_fixed_candidate_batch_02_coverage_2026_09_27.json
      - research/run_requests/t050_fixed_candidate_batch_02_coverage.trigger
      - automation/coverage_preflight.py
      - data/canonical_snapshot.py
      - data/yahoo_loader.py
      - .github/workflows/t050-fixed-candidate-batch-02-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t050-fixed-candidate-batch-02-coverage
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic data-contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest

      - name: Safety and preregistration guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          from research.asset_universes import get_universe, list_universes

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          spec = json.loads(Path(
              "research/preregistrations/trial_050_fixed_candidate_batch_02_coverage_2026_09_27.json"
          ).read_text(encoding="utf-8"))
          universe = get_universe(spec["universe"])
          assert tuple(universe.symbols) == tuple(spec["symbols"])
          assert universe.target_count == spec["requested_candles"] == 3520
          assert spec["governance"]["performance_trial_authorized"] is False
          assert spec["governance"]["performance_evaluation"] is False
          assert spec["governance"]["holdout_evaluation"] is False
          assert spec["governance"]["asset_selection_by_performance"] is False
          assert spec["point_in_time"]["price_timestamp_contract"] is True
          assert spec["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          assert set(spec["symbols"]).isdisjoint(get_universe(
              "validation_2026_09_27_fixed_candidate_batch"
          ).symbols)
          for other in list_universes():
              if other.name in {
                  universe.name,
                  "validation_2026_09_27_fixed_candidate_batch",
              }:
                  continue
              assert set(spec["symbols"]).isdisjoint(other.symbols), other.name
          print("T050 PREREGISTRATION SAFETY OK")
          PY

      - name: Execute coverage preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.coverage_preflight \
            --preregistration research/preregistrations/trial_050_fixed_candidate_batch_02_coverage_2026_09_27.json \
            --output-root research/runs/t050_fixed_candidate_batch_02_coverage

      - name: Validate coverage and governance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/runs/t050_fixed_candidate_batch_02_coverage/T-2026-09-27-050")
          outputs = sorted(root.glob("coverage_preflight_*.json"))
          if not outputs:
              raise SystemExit("T050_COVERAGE_ARTIFACT_MISSING")
          d = json.loads(outputs[-1].read_text(encoding="utf-8"))
          assert d["status"] == "coverage_passed"
          assert d["trial_id"] == "T-2026-09-27-050"
          assert d["target_common_calendar"] == 3500
          assert d["common_calendar_count"] >= 3500
          assert d["minimum_in_window_candles"] == 3500
          assert d["insufficient_symbols"] == {}
          assert d["missing_symbols"] == []
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          print("T050 COVERAGE PASS")
          print("COMMON_CALENDAR_COUNT:", d["common_calendar_count"])
          print("COVERAGE_FINGERPRINT:", d["coverage_fingerprint"])
          PY

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t050-fixed-candidate-batch-02-coverage-${{ github.run_id }}
          path: research/runs/t050_fixed_candidate_batch_02_coverage/
          if-no-files-found: warn
          retention-days: 30
