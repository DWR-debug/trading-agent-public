name: Q104 I22 SEC Filing Arrival Compiler

on:
  schedule:
    - cron: "5 */6 * * *"
  push:
    paths:
      - "automation/q104_i22_filing_arrival_compiler.py"
      - "tests/test_q104_i22_filing_arrival_compiler.py"
      - "research/preregistrations/q104_i22_filing_arrival_2026_10_01.json"
      - ".github/workflows/q104-i22-filing-arrival.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q104-i22-compiler
  cancel-in-progress: false

jobs:
  reconcile:
    needs: [compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download x64 and ARM64 compiler receipts
        uses: actions/download-artifact@v6
        with:
          pattern: q104-i22-*
          path: /tmp/q104-i22-artifacts
          merge-multiple: false
      - name: Reconcile independent architecture outputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          x64=(/tmp/q104-i22-artifacts/q104-i22-x64-*/*result.json)
          arm=(/tmp/q104-i22-artifacts/q104-i22-arm64-*/*result.json)
          test "${#x64[@]}" -eq 1
          test "${#arm[@]}" -eq 1
          python - <<'PY' "${x64[0]}" "${arm[0]}"
          import json,sys,hashlib
          a=json.load(open(sys.argv[1],encoding="utf-8"))
          b=json.load(open(sys.argv[2],encoding="utf-8"))
          assert a == b, "Q104_I22_ARCHITECTURE_REPRODUCTION_MISMATCH"
          assert a["status"] == "I22_PIT_COMPILER_COMPLETED"
          assert all(a["mutation_tests"].values())
          assert a["governance"]["performance_authorized"] is False
          assert a["safety"]["paper_only"] is True
          payload={
            "schema_version":"1.0",
            "record_type":"q104_i22_cross_arch_reconciliation",
            "task_id":"Q-2026-10-01-104-I22-CROSS-ARCH-RECONCILIATION",
            "candidate_id":"Q104:I22",
            "status":"I22_PIT_COMPILER_RECONCILED_X64_ARM64_NO_PERFORMANCE",
            "source_workflow_run_id":int(__import__("os").environ["GITHUB_RUN_ID"]),
            "source_master_sha":__import__("os").environ["GITHUB_SHA"],
            "x64_receipt_fingerprint":a["receipt_fingerprint"],
            "arm64_receipt_fingerprint":b["receipt_fingerprint"],
            "source_response_fingerprint":a["source_response_fingerprint"],
            "summary":a["summary"],
            "mutation_tests":a["mutation_tests"],
            "architecture_equality":True,
            "scientific_boundary":{
              "performance":False,"holdout_selection":False,"ranking":False,
              "parameter_search":False,"threshold_search":False,
              "horizon_search":False,"promotion":False,"live_execution":False
            },
            "safety":{
              "paper_only":True,"live_trading_enabled":False,
              "orders_enabled":False,"automatic_promotion":False
            },
            "next_gate":"Q104:I22 candidate-specific non-overlap audit + independent PIT reproduction against frozen Q107/Q108 inputs"
          }
          payload["receipt_fingerprint"]=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          open("/tmp/q104-i22-reconciliation.json","w",encoding="utf-8").write(json.dumps(payload,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(payload,sort_keys=True))
          PY
      - name: Publish immutable reconciliation receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file "research/evidence/q104_i22_cross_arch_reconciliation_latest.json=/tmp/q104-i22-reconciliation.json"

  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: x64
          - runner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Safety invariants
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY
      - name: Contract tests
        run: python -m pytest -q tests/test_q104_i22_filing_arrival_compiler.py
      - name: Compile deterministic SEC population
        run: python -m automation.q104_i22_filing_arrival_compiler --output "research/runs/q104_i22/${{ matrix.name }}/result.json"
      - name: Upload compiler receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i22-${{ matrix.name }}-${{ github.run_id }}
          path: research/runs/q104_i22/${{ matrix.name }}/result.json
          if-no-files-found: warn
          retention-days: 30
