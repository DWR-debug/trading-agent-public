name: Q091 Fixed Portfolio Architecture Coverage and PIT

on:
  push:
    branches:
      - research/q091-fixed-portfolio-architecture
    paths:
      - "portfolio/q091_fixed_ensemble.py"
      - "automation/q091_coverage_pit.py"
      - "research/preregistrations/q091_fixed_portfolio_architecture_2026_09_29.json"
      - "tests/test_q091_fixed_ensemble.py"
      - ".github/workflows/q091-portfolio-architecture-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q091-fixed-portfolio-architecture
  cancel-in-progress: false

jobs:
  coverage_pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0

      - name: Safety and governance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q091_fixed_portfolio_architecture_2026_09_29.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert p["status"] == "PREREGISTERED_DESIGN_ONLY"
          assert p["governance"]["performance_trial_authorized"] is False
          assert p["governance"]["holdout_used_for_selection"] is False
          print("Q091 SAFETY/GOVERNANCE OK")
          PY

      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q091_fixed_ensemble.py tests/test_q089_validation.py tests/test_q089_performance_envelope.py

      - name: Verify frozen parent signal source
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum automation/q069_candidate_bank.py | cut -d" " -f1)
          test "$actual" = "84e008a6152cbea128e5e5f2ac0dfdde0b0172310fe4c510241c60edfd3ff617"

      - name: Execute coverage and PIT only
        shell: bash
        env:
          PYTHONPATH: .
        run: python -m automation.q091_coverage_pit --mode all

      - name: Validate receipts are non-performance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name, expected in (("q091_coverage_result.json","COVERAGE_PASSED"),("q091_pit_result.json","PIT_PASSED")):
              d=json.loads((Path("research/evidence")/name).read_text())
              assert d["status"] == expected
              assert d["performance_evaluation"] is False
              assert d["selection_used"] is False
          print("Q091 COVERAGE/PIT PASS")
          PY

      - name: Upload preparation pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q091-portfolio-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q091_coverage_result.json
            research/evidence/q091_asset_freeze.json
            research/evidence/q091_pit_result.json
            research/runs/q091_coverage/**
          if-no-files-found: warn
          retention-days: 30
