name: Q084 Candidate Feasibility (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q084_feasibility.trigger"
      - "research/preregistrations/q084_design_2026_09_28.json"
      - "automation/q084_candidate_feasibility.py"
      - "tests/test_q084_candidate_feasibility.py"
      - ".github/workflows/q084-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-q084-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - name: Download exact source snapshot
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q084-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-q084-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          cd /d "%REPO_SRC%" || exit /b 1
          echo Q084_SOURCE=%GITHUB_SHA%
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q084"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q084.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Run Q084 governance and PIT tests
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q084-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q084"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          "%PY_EXE%" -m pytest -q tests/test_q084_candidate_feasibility.py || exit /b 1
          "%PY_EXE%" automation/q084_candidate_feasibility.py || exit /b 1
          endlocal

      - name: Publish feasibility files
        if: always()
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q084-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "TARGET=%GITHUB_WORKSPACE%\research\runs\q084_feasibility"
          if exist "%TARGET%" rmdir /s /q "%TARGET%"
          mkdir "%TARGET%" || exit /b 1
          copy /Y "%REPO_SRC%\research\runs\q084_feasibility\result.json" "%TARGET%\result.json" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -Command "$p='%TARGET%/runner_manifest.json'; [ordered]@{schema_version=1;task_id='Q-2026-09-28-084-FEASIBILITY';run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;source_commit=$env:GITHUB_SHA;runner_name=$env:RUNNER_NAME;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH;paper_only=$true;live_trading_enabled=$false;orders_enabled=$false;automatic_promotion=$false;formal_scientific_evidence=$false} | ConvertTo-Json | Set-Content -Encoding UTF8 $p"
          if not exist "%TARGET%\result.json" exit /b 1
          if not exist "%TARGET%\runner_manifest.json" exit /b 1
          endlocal

      - name: Dispatch Q081 preflight fallback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q084"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/q081-preflight-fallback.yml/dispatches'; req=urllib.request.Request(u,data=json.dumps({'ref':'master'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}); urllib.request.urlopen(req,timeout=30).read(); print('Q081_PREFLIGHT_FALLBACK_DISPATCHED')"
          endlocal

      - name: Upload Q084 feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q084-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q084_feasibility/
          if-no-files-found: error
          retention-days: 14
