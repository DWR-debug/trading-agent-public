name: Micro Trading Turn of the Candle 5m — 2026-09-23 — Public

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/microtrading_turn_candle_5m_2026_09_23.py"
      - "tests/test_microtrading_turn_candle_5m_2026_09_23.py"
      - ".github/workflows/microtrading-turn-candle-5m-2026-09-23.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/microtrading_turn_candle_5m_2026_09_23.py"
      - "tests/test_microtrading_turn_candle_5m_2026_09_23.py"
      - ".github/workflows/microtrading-turn-candle-5m-2026-09-23.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-public-microtrading-turn-candle-5m
  cancel-in-progress: true

jobs:
  micro_turn_candle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit und Protokoll prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          from automation.microtrading_turn_candle_5m_2026_09_23 import (
              COST_MULTIPLIERS, EXPOSURE_LEVELS, SYMBOLS, TURN_MINUTES,
          )

          prior = {
              "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT",
              "DOGEUSDT", "LTCUSDT", "LINKUSDT", "AVAXUSDT",
              "DOTUSDT", "ATOMUSDT", "UNIUSDT", "NEARUSDT",
          }

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert set(SYMBOLS).isdisjoint(prior)
          assert TURN_MINUTES == (0, 15, 30, 45)
          assert EXPOSURE_LEVELS == (1.0, 2.0, 3.0)
          assert max(EXPOSURE_LEVELS) <= float(settings.MAX_LEVERAGE)
          assert COST_MULTIPLIERS == (0.0, 0.25, 0.5, 1.0, 2.0, 4.0)

          print("PAPER-ONLY SAFETY OK")
          print("SYMBOL DISJOINTNESS OK:", SYMBOLS)
          print("TURN-MINUTE PROTOCOL OK:", TURN_MINUTES)
          print("EXPOSURE GRID OK:", EXPOSURE_LEVELS)
          PY
      - name: Turn-of-the-Candle Micro Sidecar ausführen
        run: |
          set -euo pipefail
          python -m automation.microtrading_turn_candle_5m_2026_09_23 \
            --data-dir data/micro_turn_candle_5m_market_data \
            --output research/microtrading_turn_candle_5m_2026_09_23.json
      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("research/microtrading_turn_candle_5m_2026_09_23.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          stored = result.pop("result_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["interval"] == "5m"
          assert result["scope"]["target_count_per_asset"] == 100000
          assert result["scope"]["symbol_disjoint_from_prior_micro_controls"] is True
          assert result["scope"]["turn_minutes_utc"] == [0, 15, 30, 45]
          assert result["scope"]["exposure_levels"] == [1.0, 2.0, 3.0]
          assert result["hypotheses"]["selection_between_directions"] is False
          assert result["hypotheses"]["parameter_search"] is False
          assert result["modeling_limits"]["production_candidate"] is False
          assert result["modeling_limits"]["production_integration"] is False
          assert result["modeling_limits"]["funding_cost_modeled"] is False
          assert result["modeling_limits"]["borrow_cost_modeled"] is False
          assert result["modeling_limits"]["spread_cost_modeled"] is False
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "max_research_exposure": 3.0,
          }

          print("MICRO_TURN_CANDLE_INTEGRITY_OK")
          print("RESULT_FINGERPRINT:", stored)
          PY
      - name: Research-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microtrading-turn-candle-5m-2026-09-23-${{ github.run_id }}
          path: |
            research/microtrading_turn_candle_5m_2026_09_23.json
            data/micro_turn_candle_5m_market_data/
          if-no-files-found: error
          retention-days: 30
