name: Copilot CLI CI Repair Worker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Trusted same-repository PR number to repair"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: trading-agent-copilot-cli-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'failure' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0].number != null &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.actor.login == github.repository_owner)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve trusted PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pr="$MANUAL_PR"
          else
            pr="$EVENT_PR"
          fi
          test -n "$pr"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path(os.environ["RUNNER_TEMP"], "pr.json").read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          if p["head"]["repo"]["full_name"] != repo:
              raise SystemExit("CI repair refuses fork PRs")
          if p["head"]["user"]["login"] != owner:
              raise SystemExit("CI repair is restricted to the repository owner branch")
          print(f'number={p["number"]}')
          print(f'branch={p["head"]["ref"]}')
          print(f'head_sha={p["head"]["sha"]}')
          PY
          echo "number=$(jq -r .number "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .head.ref "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Guard repair loop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          message="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')"
          case "$message" in
            "FIX: autonomous CI repair"*) echo "Automatic repair already attempted for this head; stopping."; exit 0 ;;
          esac

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0

      - name: Capture failed CI log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run view "$RUN_ID" --log-failed > "$RUNNER_TEMP/ci_failure.log" || true
          else
            printf '%s\n' 'Manual repair request: inspect the current PR checks in GitHub.' > "$RUNNER_TEMP/ci_failure.log"
          fi
          test -s "$RUNNER_TEMP/ci_failure.log"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Require Copilot token
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: test -n "$COPILOT_GITHUB_TOKEN"

      - name: Run bounded Copilot repair
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          FAILURE_LOG: ${{ runner.temp }}/ci_failure.log
        run: |
          set -euo pipefail
          cp "$FAILURE_LOG" ./ci_failure.log
          prompt="$(cat <<'EOF'
          You are a bounded engineering repair worker for trading-agent-public.
          Repair ONLY the current PR's mechanical CI failure. Read ci_failure.log first.
          Make the smallest deterministic engineering change required.

          Hard constraints:
          - Do not change research/evidence/*, research/preregistrations/*, research/authorizations/*,
            config safety flags, research gates, holdout logic, strategy parameters, asset universes,
            promotion rules, or live-trading controls.
          - Do not perform research selection, tuning, backtesting, or scientific interpretation.
          - Do not modify historical trial evidence.
          - Do not use network tools or external URLs.
          - You may read/write repository files and use git and pytest only.
          - Do not push.
          - If the failure is scientific/governance state rather than a bounded engineering defect,
            make no change and report that it requires supervisor review.
          - Run the most relevant targeted tests available before finishing.
          EOF
          )"
          copilot \
            --autopilot \
            --no-ask-user \
            --max-ai-credits=60 \
            --max-autopilot-continues=2 \
            -p "$prompt" \
            --available-tools='read,write,shell(git:*),shell(pytest)' \
            --allow-tool=write \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(pytest)' \
            --deny-tool='shell(git push)'
          rm -f ./ci_failure.log

      - name: Final regression gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q

      - name: Commit repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "FIX: autonomous CI repair"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push repaired PR branch
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          test -n "$PUSH_TOKEN"
          git push "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"

      - name: Publish repair log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: copilot-cli-ci-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/ci_failure.log
          if-no-files-found: ignore
          retention-days: 14
