name: Q121 SEC Beneficial-Ownership Timing Discovery

on:
  schedule:
    - cron: "20 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q121_sec_beneficial_ownership_timing.py"
      - "tests/test_q121_sec_beneficial_ownership_timing.py"
      - "research/preregistrations/q121_sec_beneficial_ownership_timing_2026_10_03.json"
      - ".github/workflows/q121-sec-beneficial-ownership-timing.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q121-sec-beneficial-ownership-timing
  cancel-in-progress: true

jobs:
  discover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Contract tests
        run: python -m pytest -q tests/test_q121_sec_beneficial_ownership_timing.py
      - name: Compile discovery receipt
        run: python -m automation.q121_sec_beneficial_ownership_timing --output research/runs/q121_sec_beneficial_ownership_timing/result.json
      - name: Validate governance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q121_sec_beneficial_ownership_timing/result.json").read_text())
          assert p["status"] == "Q121_DISCOVERY_PIT_COMPLETED"
          assert p["governance"]["performance"] is False
          assert p["governance"]["performance_authorized"] is False
          assert p["governance"]["holdout"] is False
          assert p["governance"]["selection"] is False
          assert p["safety"]["paper_only"] is True
          print("Q121_DISCOVERY_BOUNDARY=PASS")
          print("Q121_EVENT_COUNT=", p["summary"]["event_count"])
          print("Q121_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload discovery receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q121-sec-beneficial-ownership-timing-${{ github.run_id }}
          path: research/runs/q121_sec_beneficial_ownership_timing/result.json
          if-no-files-found: error
          retention-days: 30
