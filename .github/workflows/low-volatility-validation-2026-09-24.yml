name: Low Volatility Validation 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/low_volatility_validation_2026_09_24.py"
      - "research/fixed_low_volatility.py"
      - "research/asset_universes.py"
      - "execution/cost_contract.py"
      - "tests/test_fixed_low_volatility.py"
      - "docs/trial_024_low_volatility_preregistration_2026_09_24.md"
      - "research/checkpoints/trial_024_low_volatility_preregistration_2026_09_24.json"
      - ".github/workflows/low-volatility-validation-2026-09-24.yml"
  push:
    branches:
      - research/low-volatility-validation-2026-09-24
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-low-volatility-validation
  cancel-in-progress: true

jobs:
  prereq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Low-Vol-Universum-Disjointness
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.asset_universes import get_universe, list_universes
          expected = ("INTC", "QCOM", "AVGO", "HON", "LMT", "RTX", "CSX", "NSC")
          target = get_universe("validation_2026_09_24_low_volatility_us_stocks")
          assert tuple(target.symbols) == expected
          assert target.target_count == 3500
          for item in list_universes():
              if item.name == target.name:
                  continue
              assert set(expected).isdisjoint(item.symbols), item.name
          print("LOW_VOL_UNIVERSE_DISJOINT_OK")
          PY
      - name: Präregistrierung prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc = Path("docs/trial_024_low_volatility_preregistration_2026_09_24.md").read_text(encoding="utf-8")
          required = (
              "T-2026-09-24-024",
              "INTC", "QCOM", "AVGO", "HON", "LMT", "RTX", "CSX", "NSC",
              "3.500", "3.498", "2.798", "700",
              "252", "vier Assets mit der niedrigsten Volatilität",
              "15 bps One-Way", "1,5x", "2,0x",
              "PAPER_ONLY = True", "LIVE_TRADING_ENABLED = False",
              "holdout_selection = false",
          )
          missing = [item for item in required if item not in doc]
          assert not missing, missing
          checkpoint = json.loads(Path("research/checkpoints/trial_024_low_volatility_preregistration_2026_09_24.json").read_text(encoding="utf-8"))
          assert checkpoint["trial_id"] == "T-2026-09-24-024"
          assert checkpoint["lookback_sessions"] == 252
          assert checkpoint["select_count"] == 4
          assert checkpoint["strategy_variants"] == 1
          assert checkpoint["parameter_search"] is False
          assert checkpoint["threshold_search"] is False
          assert checkpoint["holdout_selection"] is False
          print("LOW_VOL_PREREGISTRATION_OK")
          PY
      - name: Kostenvertrag prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from execution.cost_contract import ResearchExecutionCostContract
          contract = ResearchExecutionCostContract()
          contract.validate()
          assert contract.fee_bps == 10.0
          assert contract.slippage_bps == 5.0
          assert contract.total_one_way_bps == 15.0
          print("LOW_VOL_COST_CONTRACT_OK")
          PY

  research:
    needs: prereq
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Research-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_2026_09_24_low_volatility_us_stocks             --output research/low_volatility_validation_2026_09_24/manifest.json
      - name: Low-Vol-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.low_volatility_validation_2026_09_24             --data-dir data/market_data             --manifest research/low_volatility_validation_2026_09_24/manifest.json             --output research/low_volatility_validation_2026_09_24/report.json
      - name: Ergebnisintegrität prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("research/low_volatility_validation_2026_09_24/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          fingerprint = report.pop("report_fingerprint")
          actual = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(",", ":"), ensure_ascii=True, allow_nan=False).encode("utf-8")).hexdigest()
          assert fingerprint == actual
          assert report["trial_id"] == "T-2026-09-24-024"
          assert report["research_only"] is True
          assert report["preregistration"]["strategy_variants"] == 1
          assert report["preregistration"]["parameter_search"] is False
          assert report["preregistration"]["threshold_search"] is False
          assert report["preregistration"]["holdout_selection"] is False
          assert report["source"]["target_candles"] == 3500
          assert report["source"]["common_returns"] == 3498
          assert report["source"]["research_count"] == 2798
          assert report["source"]["holdout_count"] == 700
          assert report["safety"] == {"paper_only": True, "live_trading_enabled": False, "orders_enabled": False}
          print("LOW_VOL_RESULT_INTEGRITY_OK")
          print("LOW_VOL_DECISION:", json.dumps(report["decision"], sort_keys=True))
          print("LOW_VOL_REPORT_FINGERPRINT:", fingerprint)
          PY
      - name: Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: low-volatility-validation-2026-09-24-${{ github.run_id }}
          path: |
            research/low_volatility_validation_2026_09_24/report.json
            research/low_volatility_validation_2026_09_24/manifest.json
          if-no-files-found: error
          retention-days: 30
