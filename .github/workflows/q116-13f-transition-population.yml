name: Q116 Two-Quarter 13F Transition Population

on:
  push:
    branches: [master]
    paths:
      - "automation/q116_13f_transition_population.py"
      - "automation/q114_13f_manager_transitions.py"
      - "tests/test_q116_13f_transition_population.py"
      - "research/preregistrations/q116_13f_transition_population_2026_10_01.json"
      - ".github/workflows/q116-13f-transition-population.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q116-13f-transition-population
  cancel-in-progress: false

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False"
      - name: Contract tests
        run: python -m pytest -q tests/test_q116_13f_transition_population.py
      - name: Fixed two-quarter SEC population
        if: matrix.runner == 'ubuntu-24.04'
        run: python -m automation.q116_13f_transition_population
      - name: Validate Q116 receipt
        if: matrix.runner == 'ubuntu-24.04'
        run: python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/runs/q116_13f_transition_population/result.json').read_text())
          assert all(v['rows']>0 for v in r['prior']['coverage'].values())
          assert all(v['rows']>0 for v in r['current']['coverage'].values())
          assert r['synthetic'] and all(r['synthetic'].values())
          assert r['governance']['performance_authorized'] is False
          print('Q116 RECEIPT CONTRACT OK')
          PY
      - name: Publish immutable Q116 receipt
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          cmd=(python automation/github_contents_publish.py
            --repository "$GITHUB_REPOSITORY"
            --branch master
            --base-sha "$BASE_SHA"
            --file "research/evidence/q116_13f_transition_population_result.json=research/runs/q116_13f_transition_population/result.json")
          "${cmd[@]}"
