name: Autonomous Agent Request Queue

on:
  push:
    branches: [master]
    paths:
      - "agent_requests/**"
  issue_comment:
    types: [created]
  # The queue is idle-safe before the protected Copilot release date and
  # automatically resumes on schedule once the reserve becomes eligible.
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: trading-agent-agent-cli-queue
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  worker:
    if: >-
      ${{
        github.event_name != 'issue_comment' ||
        (
          github.actor == github.repository_owner &&
          github.event.issue.pull_request == null &&
          github.event.comment.body == '/trading-agent copilot-queue-once'
        )
      }}
    strategy:
      fail-fast: false
      matrix:
        # Keep both queue lanes; the scarce Copilot Free pool serializes actual sessions below.
        lane: [0, 1]
    concurrency:
      group: trading-agent-copilot-free-scarce-pool
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Copilot reserve date preflight
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          release = datetime.fromisoformat("2026-10-01T00:00:00+00:00")
          now = datetime.now(timezone.utc)
          print(f"now_utc={now.isoformat()}")
          print(f"release_utc={release.isoformat()}")
          eligible = now >= release
          print(f"COPILOT_QUEUE={'ELIGIBLE' if eligible else 'WAITING_FOR_PROTECTED_RELEASE'}")
          PY
          if python - <<'PY'
          from datetime import datetime, timezone
          raise SystemExit(0 if datetime.now(timezone.utc) >= datetime.fromisoformat("2026-10-01T00:00:00+00:00") else 1)
          PY
          then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout master
        if: steps.release.outputs.eligible == 'true'
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest statsmodels==0.15.0

      - name: Resolve next queued request
        if: steps.release.outputs.eligible == 'true'
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/queue_requests"
          shopt -s nullglob
          files=(agent_requests/lane${{ matrix.lane }}/*.request)
          selected=""
          for request_file in "${files[@]}"; do
            issue_number="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["issue_number"])' "$request_file")"
            task_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["task_id"])' "$request_file")"
            branch="agent/${task_id}-copilot-cli"
            if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}" >/dev/null 2>&1; then
              continue
            fi
            selected="$request_file"
            {
              echo "issue_number=$issue_number"
              echo "request_file=$request_file"
              echo "task_id=$task_id"
              echo "run=true"
            } >> "$GITHUB_OUTPUT"
            break
          done
          if [ -z "$selected" ]; then
            echo "No unclaimed queued request for lane ${{ matrix.lane }}."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/issues/${issue_number}" > "$RUNNER_TEMP/issue.json"
          issue_state="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["state"])' "$RUNNER_TEMP/issue.json")"
          if [ "$issue_state" != "open" ]; then
            echo "Issue #$issue_number is closed; retiring stale queue request $selected."
            rm -f "$selected"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          issue=json.loads(Path(os.environ["RUNNER_TEMP"],"issue.json").read_text(encoding="utf-8"))
          assert issue["user"]["login"] == os.environ["GITHUB_REPOSITORY_OWNER"]
          assert any(label["name"] in {"agent", "agent-ready", "agent-cli-ready"} for label in issue.get("labels", []))
          Path(os.environ["RUNNER_TEMP"],"event.json").write_text(json.dumps({"issue":issue}),encoding="utf-8")
          PY
          python -m automation.agent_dispatch --event-json "$RUNNER_TEMP/event.json" --master-sha "$GITHUB_SHA" --active-agent-count 0 --output "$RUNNER_TEMP/agent_task_manifest.json"
          cp "$RUNNER_TEMP/agent_task_manifest.json" "$RUNNER_TEMP/task_contract.json"

      - name: Stop idle lane
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run != 'true'
        run: |
          echo "Lane idle; no agent session consumed."
          echo "No Copilot session or paid usage is claimed."

      - name: Prepare isolated branch
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true'
        id: branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          task_id="$(python -c 'import json,os; body=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "issue.json"), encoding="utf-8"))["body"]; start=body.find("<!-- TRADING_AGENT_TASK_V1"); end=body.find("-->", start); print(json.loads(body[start + len("<!-- TRADING_AGENT_TASK_V1"):end].strip())["task_id"])')"
          branch="agent/${task_id}-copilot-cli"
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}" >/dev/null 2>&1; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments" \
              -f body="Agent queue skipped: task branch ${branch} already exists. Duplicate execution is fail-closed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check personal Copilot token
        id: copilot_token
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true'
        shell: bash
        env:
          PERSONAL_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PERSONAL_COPILOT_TOKEN:-}" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments" -f body="Agent queue paused: COPILOT_GITHUB_TOKEN is not configured. No Copilot request was sent."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api --silent "/repos/${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "pat_repo_access=true" >> "$GITHUB_OUTPUT"
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments" -f body="Agent queue paused: COPILOT_GITHUB_TOKEN is present but cannot access this repository. No Copilot request was sent."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "pat_repo_access=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reserve protected Copilot Free session
        id: copilot_budget
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true' && steps.copilot_token.outputs.configured == 'true'
        continue-on-error: true
        uses: ./.github/actions/copilot-free-gate
        with:
          github-token: ${{ github.token }}

      - name: Reconcile Copilot budget gate result
        id: copilot_budget_reconcile
        if: steps.copilot_budget.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "/repos/${GITHUB_REPOSITORY}/contents/ops/copilot_free_budget_state.json?ref=master" > "${RUNNER_TEMP}/copilot_budget_state.json" && test -s "${RUNNER_TEMP}/copilot_budget_state.json"; then
            python - <<'PY'
          import base64, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          raw = Path(os.environ["RUNNER_TEMP"], "copilot_budget_state.json").read_text(encoding="utf-8")
          if not raw.strip():
              raise RuntimeError("Copilot budget state response was empty")
          payload = json.loads(raw)
          state = json.loads(base64.b64decode(payload["content"]).decode("utf-8"))
          month = datetime.now(timezone.utc).strftime("%Y-%m")
          used = int(state.get("reserved_sessions", 0)) if state.get("month") == month else 0
          limit = int(state.get("max_reserved_sessions", 4))
          if used >= limit:
              print(f"COPILOT_FREE_GATE_RECONCILE=EXHAUSTED {used}/{limit}")
              Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("status=exhausted\n")
          else:
              print(f"COPILOT_FREE_GATE_RECONCILE=ERROR state not exhausted ({used}/{limit})")
              Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write("status=error\n")
          PY
          else
            echo "status=error" >> "${GITHUB_OUTPUT}"
            echo "COPILOT_FREE_GATE_RECONCILE=ERROR unable to read budget state"
            exit 0
          fi

      - name: Stop on unreconciled Copilot gate error
        if: steps.copilot_budget_reconcile.outputs.status == 'error'
        shell: bash
        run: |
          set -euo pipefail
          echo "Copilot Free gate failed and the protected budget is not provably exhausted; fail closed."
          exit 1

      - name: Report exhausted Copilot Free budget
        if: steps.copilot_budget_reconcile.outputs.status == 'exhausted'
        shell: bash
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments"             -f body="Agent queue paused: protected Copilot Free budget is exhausted for the current month. No Copilot request was sent."

      - name: Run bounded Copilot CLI
        id: copilot_cli
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true' && steps.copilot_token.outputs.configured == 'true' && steps.copilot_budget.outcome == 'success'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          set -euo pipefail
          case "$COPILOT_GITHUB_TOKEN" in
            github_pat_*|gho_*|ghu_*) ;;
            *) gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments" -f body="Agent queue paused: COPILOT_GITHUB_TOKEN has an unsupported token class; expected github_pat_*, gho_*, or ghu_*. No Copilot request was sent."; exit 0 ;;
          esac
          npm install -g @github/copilot
          task_body="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "issue.json"), encoding="utf-8"))["body"])')"
          prompt="$(cat <<EOF
          You are the bounded engineering worker for trading-agent-public.
          Work ONLY on issue #${ISSUE_NUMBER} and its TRADING_AGENT_TASK_V1 contract.
          Use the repository custom agent trading-agent-engineer.
          Read AGENTS.md, docs/TRADING_AGENT_CHAT_ENTRYPOINT.md, docs/GITHUB_FREE_RESOURCE_OPERATING_MODEL.md, and relevant files first.
          Hard constraints: PAPER_ONLY=True; LIVE_TRADING_ENABLED=False; orders_enabled=False; automatic_promotion=False.
          Do not change research/evidence historical records, authorizations, gates, holdout logic, strategy parameters, asset universes, promotion rules, or live execution.
          Do not perform deterministic research computation or scientific selection.
          Stay within the task's explicit allowed_paths.
          Do not push yourself and do not create a pull request.
          Add focused regression tests when code changes are requested.
          Finish with a concise engineering handoff.

          Exact issue body:
          ${task_body}
          EOF
          )"
          set +e
          copilot --agent=trading-agent-engineer --autopilot --no-ask-user --max-ai-credits=30 --max-autopilot-continues=1 -p "$prompt" --allow-tool='read' --allow-tool='search' --allow-tool='write' --allow-tool='shell(git:*)' --allow-tool='shell(python:*)' --allow-tool='shell(pytest:*)' 2>&1 | tee "$RUNNER_TEMP/copilot_cli.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eqi "Authentication failed|token may be invalid|lacking the required permissions|Copilot Requests" "$RUNNER_TEMP/copilot_cli.log"; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${{ steps.request.outputs.issue_number }}/comments" -f body="Agent queue paused: COPILOT_GITHUB_TOKEN is valid for repository access but Copilot CLI rejected authentication or Copilot access. No engineering task was executed or published."
            echo "status=auth_paused" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Enforce task-scoped file scope
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true' && steps.copilot_token.outputs.configured == 'true' && steps.copilot_cli.outputs.status == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.agent_scope_guard --contract "$RUNNER_TEMP/task_contract.json"
      - name: Final bounded regression gate
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true' && steps.copilot_token.outputs.configured == 'true' && steps.copilot_cli.outputs.status == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m pytest -q tests/test_agent_dispatch.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("trading_agent_settings", Path("config/settings.py"))
          settings = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(settings)
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY

      - name: Commit and publish
        if: steps.release.outputs.eligible == 'true' && steps.request.outputs.run == 'true' && steps.branch.outputs.skip != 'true' && steps.copilot_token.outputs.configured == 'true' && steps.copilot_cli.outputs.status == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Agent completed without repository changes; no PR was created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          staged_protected="$(git diff --cached --name-only -- .github/ research/evidence/ research/authorizations/ gates/)"
          if [ -n "$staged_protected" ]; then
            echo "::error::AGENT_SCOPE_PROTECTED_INDEX_VIOLATION"
            printf "%s\n" "$staged_protected"
            exit 1
          fi
          python -m automation.agent_scope_guard --contract "$RUNNER_TEMP/task_contract.json"
          git commit -m "AGENT: issue #${ISSUE_NUMBER} bounded engineering"
          BRANCH="${BRANCH:-$(git branch --show-current)}"
          test -n "$BRANCH"
          test "$BRANCH" != "master"
          echo "Publishing agent branch: $BRANCH"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          if pr_url="$(gh pr create --base master --head "${BRANCH}" --title "AGENT: Issue #${ISSUE_NUMBER} bounded engineering task" --body "Bounded agent task completed and regression-tested." 2>/dev/null)"; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Agent task completed and published as ${pr_url}."
            echo "PR_URL=${pr_url}"
          else
            branch_url="https://github.com/${GITHUB_REPOSITORY}/tree/${BRANCH}"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Agent task completed, tests/safety passed, and changes were pushed to ${branch_url}. Automatic PR creation is unavailable; the top-level orchestrator must create the PR."
            echo "PR_CREATE_UNAVAILABLE branch=${branch_url}"
          fi
