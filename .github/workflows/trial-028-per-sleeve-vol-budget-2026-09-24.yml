name: Trial 028 Per-Sleeve Volatility Budget 2026-09-24

on:
  push:
    branches: ["research/trial-028-per-sleeve-vol-budget-2026-09-24"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-trial-028-per-sleeve-vol-budget
  cancel-in-progress: false

jobs:
  prereq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Universe Disjointness
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.asset_universes import get_universe, list_universes
          expected=("SPLV","SPHQ","SPYG","SPYV","FXI","GDX","PFF","CWB","XSD","IBB","ITA","XAR","XES")
          target=get_universe("validation_2026_09_24_per_sleeve_vol_budget")
          assert tuple(target.symbols)==expected
          assert target.target_count==3500
          for item in list_universes():
              if item.name!=target.name:
                  assert set(expected).isdisjoint(item.symbols), item.name
          print("TRIAL_028_UNIVERSE_DISJOINT_OK")
          PY
      - name: Präregistrierung prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc=Path("docs/trial_028_per_sleeve_vol_budget_preregistration_2026_09_24.md").read_text(encoding="utf-8")
          required=("T-2026-09-24-028","SPLV","SPHQ","SPYG","SPYV","FXI","GDX","PFF","CWB","XSD","IBB","ITA","XAR","XES","3.500","3.498","2.798","700","63","10%-Volatilitätsbegrenzung","PAPER_ONLY=True","LIVE_TRADING_ENABLED=False")
          missing=[x for x in required if x not in doc]
          assert not missing,missing
          c=json.loads(Path("research/checkpoints/trial_028_per_sleeve_vol_budget_preregistration_2026_09_24.json").read_text(encoding="utf-8"))
          assert c["trial_id"]=="T-2026-09-24-028"
          assert c["risk_budget_window_sessions"]==63
          assert c["target_annualized_volatility"]==0.10
          assert c["strategy_variants"]==1
          assert c["parameter_search"] is False
          assert c["holdout_used_for_selection"] is False
          assert c["orders_enabled"] is False
          print("TRIAL_028_PREREGISTRATION_OK")
          PY
      - name: Kostenvertrag prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from execution.cost_contract import ResearchExecutionCostContract
          c=ResearchExecutionCostContract(); c.validate()
          assert c.fee_bps==10.0 and c.slippage_bps==5.0 and c.total_one_way_bps==15.0
          print("TRIAL_028_COST_CONTRACT_OK")
          PY

  research:
    needs: prereq
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Forschungsdaten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data \
            --target-count 3500 \
            --universe validation_2026_09_24_per_sleeve_vol_budget \
            --output research/trial_028_per_sleeve_vol_budget_2026_09_24/manifest.json
      - name: Trial-028-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.trial_028_per_sleeve_vol_budget_2026_09_24 \
            --data-dir data/market_data \
            --manifest research/trial_028_per_sleeve_vol_budget_2026_09_24/manifest.json \
            --output research/trial_028_per_sleeve_vol_budget_2026_09_24/report.json
      - name: Ergebnisintegrität prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/trial_028_per_sleeve_vol_budget_2026_09_24/report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          stored=r.pop("report_fingerprint")
          actual=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert stored==actual
          assert r["trial_id"]=="T-2026-09-24-028"
          assert r["status"]=="COMPLETED"
          assert r["research_only"] is True
          assert r["methodology"]["holdout_used_for_selection"] is False
          assert r["source"]["common_returns"]==3498
          assert r["source"]["research_count"]==2798
          assert r["source"]["holdout_count"]==700
          assert r["source"]["fully_symbol_disjoint"] is True
          assert r["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False}
          print("TRIAL_028_RESULT_INTEGRITY_OK")
          print("TRIAL_028_REPORT_FINGERPRINT:",stored)
          print("TRIAL_028_CANDIDATE_STATUS:",r["candidate_status"])
          print("TRIAL_028_CHECKS:",json.dumps(r["gate_contract"],sort_keys=True))
          PY
      - name: Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trial-028-per-sleeve-vol-budget
          path: |
            research/trial_028_per_sleeve_vol_budget_2026_09_24/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
