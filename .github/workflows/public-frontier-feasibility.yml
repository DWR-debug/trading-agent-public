name: Public Frontier Feasibility

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [master]
    paths:
      - "automation/q096_frontier_source_pit_audit.py"
      - "automation/q097_public_short_flow_feasibility.py"
      - "automation/q098_historical_archive_depth.py"
      - "automation/q100_frontier_feasibility_synthesis.py"
      - "automation/q101_negative_evidence_atlas.py"
      - "tests/test_q101_negative_evidence_atlas.py"
      - "tests/test_q096_frontier_source_pit_audit.py"
      - "tests/test_q097_public_short_flow_candidates.py"
      - "tests/test_q097_public_short_flow_feasibility.py"
      - "tests/test_q098_historical_archive_depth.py"
      - "tests/test_q100_frontier_feasibility_synthesis.py"
      - "research/frontier/candidate_inventory_2026_09_29.json"
      - "research/frontier/q097_public_short_flow_candidates.json"
      - "research/run_requests/frontier_cycle_2026_09_30.trigger"
      - ".github/workflows/public-frontier-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-frontier-feasibility
  cancel-in-progress: true

jobs:
  frontier_feasibility:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Frontier contract tests
        run: |
          python -m pytest -q             tests/test_q096_frontier_source_pit_audit.py             tests/test_q097_public_short_flow_candidates.py             tests/test_q097_public_short_flow_feasibility.py             tests/test_q098_historical_archive_depth.py

      - name: Q096 live public-source audit
        run: python -m automation.q096_frontier_source_pit_audit

      - name: Q098 historical archive depth audit
        run: python -m automation.q098_historical_archive_depth
      - name: Q100 frontier feasibility synthesis
        run: python -m automation.q100_frontier_feasibility_synthesis
      - name: Q101 negative-evidence atlas
        run: python -m automation.q101_negative_evidence_atlas --output-dir research/runs/q101_negative_evidence_atlas

      - name: Architecture receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/q100_frontier_feasibility_synthesis") / "architecture_receipt.json"
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({"runner":"${{ matrix.runner }}","runner_arch":"${{ runner.arch }}","source_commit":"${{ github.sha }}","formal_evidence_allowed":False}, indent=2)+"\\n", encoding="utf-8")
          PY

      - name: Upload feasibility result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-frontier-feasibility-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            research/runs/q096_frontier_source_pit_audit/result.json
            research/runs/q098_historical_archive_depth/result.json
            research/runs/q100_frontier_feasibility_synthesis/result.json
            research/runs/q101_negative_evidence_atlas/result.json
            research/runs/q101_negative_evidence_atlas/result.md
          if-no-files-found: warn
          retention-days: 14
