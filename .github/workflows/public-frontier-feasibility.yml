name: Public Frontier Feasibility

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [master]
    paths:
      - "automation/q096_frontier_source_pit_audit.py"
      - "automation/q097_public_short_flow_feasibility.py"
      - "tests/test_q096_frontier_source_pit_audit.py"
      - "tests/test_q097_public_short_flow_candidates.py"
      - "tests/test_q097_public_short_flow_feasibility.py"
      - "research/frontier/candidate_inventory_2026_09_29.json"
      - "research/frontier/q097_public_short_flow_candidates.json"
      - ".github/workflows/public-frontier-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-frontier-feasibility
  cancel-in-progress: true

jobs:
  frontier_feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Frontier contract tests
        run: |
          python -m pytest -q             tests/test_q096_frontier_source_pit_audit.py             tests/test_q097_public_short_flow_candidates.py             tests/test_q097_public_short_flow_feasibility.py

      - name: Q096 live public-source audit
        run: python -m automation.q096_frontier_source_pit_audit

      - name: Upload feasibility result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-frontier-feasibility-${{ github.run_id }}
          path: research/runs/q096_frontier_source_pit_audit/result.json
          if-no-files-found: warn
          retention-days: 14
