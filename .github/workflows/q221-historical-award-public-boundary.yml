name: Q221 Historical Award Public Boundary Falsification

on:
  push:
    branches: [master]
    paths:
      - "automation/q221_historical_award_public_boundary.py"
      - "tests/test_q221_historical_award_public_boundary.py"
      - ".github/workflows/q221-historical-award-public-boundary.yml"
      - "research/evidence/q221_historical_source_vintages_latest.json"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

concurrency:
  group: trading-agent-q221-historical-award-public-boundary
  cancel-in-progress: false

jobs:
  census:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test fixed Q221 source contract
        run: python -m pytest -q tests/test_q221_historical_award_public_boundary.py tests/test_q221_historical_source_vintage_gate.py

      - name: Capture fixed-window USAspending transaction sample
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q221/historical_award_boundary/$GITHUB_RUN_ID"
          python -m automation.q221_historical_award_public_boundary \
            --policy-receipt research/evidence/q221_historical_source_vintages_latest.json \
            --output "research/runs/q221/historical_award_boundary/$GITHUB_RUN_ID/receipt.json"

      - name: Publish bounded Q221 receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="research/runs/q221/historical_award_boundary/$GITHUB_RUN_ID/receipt.json"
          if [[ ! -s "$receipt" ]]; then
            echo "No receipt created; publication intentionally skipped."
            exit 0
          fi
          current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test -n "$current_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$current_sha" \
            --file "research/evidence/q221_historical_public_boundary_latest.json=$receipt"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q221-historical-award-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q221/historical_award_boundary/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
