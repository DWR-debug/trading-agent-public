name: Rolling Geometry Control

on:
  push:
    branches:
      - diagnostics/rolling-geometry-control-2026-09-22
      - diagnostics/rolling-geometry-archive-2026-09-22
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rolling-geometry-control
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Rolling-Geometrie-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.rolling_geometry_control \
            --universe benchmark \
            --target-count 5000 \
            --output-dir research/rolling_geometry_control
      - name: Rohdatenarchiv verifizieren
        run: |
          set -euo pipefail
          python -m automation.verify_rolling_raw_archive \
            --manifest research/rolling_geometry_control/data_manifest.json \
            --data-dir data/market_data \
            --expected-count 5000 \
            --output research/rolling_geometry_control/raw_archive_manifest.json
      - name: Kontroll- und Rohdatenartefakte sichern
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-geometry-control
          path: |
            research/rolling_geometry_control/
            data/market_data/**/*.csv
          if-no-files-found: error
          retention-days: 30
