name: Governed Champion Challenger Accounting 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "research/champion_challenger.py"
      - "research/evidence_contract.py"
      - "tests/test_champion_challenger.py"
      - "tests/test_evidence_contract.py"
      - "docs/GOVERNED_CHAMPION_CHALLENGER_ACCOUNTING.md"
      - "research/checkpoints/governed_champion_challenger_accounting_2026_09_24.json"
      - ".github/workflows/governed-champion-challenger-accounting-2026-09-24.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pytest installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Governance-Safety prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
