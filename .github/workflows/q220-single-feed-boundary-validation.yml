name: Q220 Single SEC Feed Boundary Validation

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q220_single_feed_boundary_validation.trigger"

permissions:
  contents: read

jobs:
  validate-one-frozen-feed:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: q220-single-feed-boundary-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Validate frozen pins and scan exactly one SEC daily Feed archive
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q220_single_feed_boundary_validation \
            --request research/run_requests/q220_single_feed_boundary_validation.trigger \
            --source-receipt research/fixtures/q220_historical_representation_pit_2026-10-12T071514Z.json \
            --output research/runs/q220-single-feed-boundary-validation/${{ github.run_id }}/receipt.json
      - name: Upload single-feed receipt even on incomplete results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q220-single-feed-boundary-validation-${{ github.run_id }}-1
          path: research/runs/q220-single-feed-boundary-validation/${{ github.run_id }}/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail only if bounded source identity/extraction comparison was incomplete
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/q220-single-feed-boundary-validation/${{ github.run_id }}/receipt.json")
          receipt = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "status": receipt.get("status"),
              "frozen_expected_sha256_match_count": (receipt.get("comparison") or {}).get("feed", {}).get("frozen_expected_sha256_match_count"),
              "source_download_bytes": receipt.get("source_download_bytes"),
              "max_total_download_bytes": receipt.get("max_total_download_bytes"),
              "gate_positive": False,
              "performance_authorization": False,
              "live_execution": False,
          }, sort_keys=True))
          if receipt.get("status") != "SINGLE_FEED_BOUNDARY_COMPARISON_COMPLETE":
              raise SystemExit("Single-feed source comparison incomplete; Q220 remains blocked.")
          PY
