name: C29 Performance Dispatch Repair

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/c29_performance_dispatch_repair.trigger"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: c29-performance-dispatch-repair
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Verify dispatch repair request and authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f research/run_requests/c29_performance_dispatch_repair.trigger
          grep -Fx "DISPATCH_C29_PERFORMANCE=true" research/run_requests/c29_performance_dispatch_repair.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-C29-PERFORMANCE-01" research/run_requests/c29_performance_dispatch_repair.trigger
          python - <<'PY'
          import json
          from pathlib import Path
          auth=json.loads(Path("research/authorizations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          assert auth["trial_id"]=="T-2026-09-30-C29-PERFORMANCE-01"
          assert auth["authorized"] is True
          assert auth["performance_execution_authorized"] is True
          assert auth["one_shot"] is True
          print("C29 AUTHORIZATION STILL ACTIVE")
          PY

      - name: Dispatch already-authorized C29 performance workflow once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run c29-performance-once.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "C29 PERFORMANCE WORKFLOW DISPATCHED"
          printf 'trial_id=T-2026-09-30-C29-PERFORMANCE-01\ndispatch_workflow=c29-performance-once.yml\n' > /tmp/c29_dispatch_receipt.txt

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-dispatch-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/c29_dispatch_receipt.txt
          if-no-files-found: warn
