name: Q169 NOAA SWPC PIT Readiness R3

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q169_noaa_swpc_archive_pit_probe.py"
      - "tests/test_q169_noaa_swpc_archive_pit_probe.py"
      - "docs/research_design/Q169_NOAA_SWPC_PIT_ARCHIVE_CONTRACT_2026-10-03.md"
      - "research/governance/q169_noaa_swpc_archive_contract_2026_10_03.json"
      - ".github/workflows/q169-noaa-swpc-pit-readiness.yml"

permissions:
  contents: write

concurrency:
  group: trading-agent-q169-noaa-swpc-pit-readiness
  cancel-in-progress: true

jobs:
  pit_readiness:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run bounded Q169 NOAA PIT archive probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q169_noaa_swpc_pit_readiness"
          python -m automation.q169_noaa_swpc_archive_pit_probe \
            --output "research/runs/q169_noaa_swpc_pit_readiness/${GITHUB_RUN_ID}.json"

      - name: Validate PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("research/runs/q169_noaa_swpc_pit_readiness") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "Q169_NOAA_ARCHIVE_SAMPLE_VERIFIED_PENDING_EXPOSURE_REVISION_JOIN"
          assert d["pit_boundary"]["issue_time_available"] is True
          assert d["pit_boundary"]["historical_archive_sample_reconstructable"] is True
          assert d["pit_boundary"]["provider_revision_and_cancellation_semantics_documented"] is True
          assert d["pit_boundary"]["candidate_specific_exposure_map_frozen"] is False
          assert d["pit_boundary"]["candidate_specific_revision_lineage_reconstructed"] is False
          assert d["pit_boundary"]["candidate_pit_validated"] is False
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          assert all(d["mutation_checks"].values())
          print("Q169_NOAA_SWPC_PIT_ARCHIVE_R3_OK")
          PY

      - name: Persist material Q169 R3 PIT receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "OPS: persist latest Q169 R3 NOAA PIT archive receipt"
        run: |
          set -euo pipefail
          input="research/runs/q169_noaa_swpc_pit_readiness/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q169_noaa_swpc_archive_pit_r3_latest.json"
          test -f "$input"
          for attempt in 1 2 3; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if git show "origin/master:${latest}" > "$RUNNER_TEMP/q169_current_receipt.json" 2>/dev/null; then
              if cmp -s "$latest" "$RUNNER_TEMP/q169_current_receipt.json"; then
                echo "Q169_NOAA_PIT_RECEIPT_UNCHANGED"
                exit 0
              fi
            fi
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$base_sha" \
              --file "$latest=$input"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Q169 NOAA PIT receipt publication failed after retries"
          exit 1

      - name: Upload Q169 PIT-readiness receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q169-noaa-swpc-pit-readiness-r3-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q169_noaa_swpc_pit_readiness/
          if-no-files-found: error
          retention-days: 30
