name: Temporal Identity State Spine Waves

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - research/governance/temporal_identity_state_spine_contract_2026_10_06.json
      - research/governance/knowledge_relation_graph_contract_2026_10_06.json
      - research/candidates/orthogonal_candidate_specs_2026-10-05.json
      - research/governance/research_os_source_registry_2026_09_30.json
      - automation/temporal_identity_state_spine.py
      - tests/test_temporal_identity_state_spine.py
      - research/run_requests/temporal_identity_state_spine_waves_2026_10_06.json
      - automation/project_integrity_check.py
      - .github/workflows/temporal-identity-state-spine-waves.yml
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-temporal-identity-state-spine
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        wave: [W-TEMPORAL,W-IDENTITY,W-STATE]
    concurrency:
      group: trading-agent-spine-${{ matrix.wave }}
      cancel-in-progress: false
    steps:
      - name: Download exact source without checkout action
        shell: cmd
        env:
          TARGET_REF: ${{ github.sha }}
          WORK_DIR: ${{ runner.temp }}\spine-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.wave }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if exist "%WORK_DIR%" rmdir /s /q "%WORK_DIR%"
          mkdir "%WORK_DIR%" || exit /b 1
          set "ARCHIVE=%RUNNER_TEMP%\spine-source-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-%GITHUB_JOB%-%RUNNER_NAME%.tar.gz"
          curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%ARCHIVE%" "https://codeload.github.com/%GITHUB_REPOSITORY%/tar.gz/%TARGET_REF%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK_DIR%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK_DIR%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          echo REPO_SRC=!REPO_SRC!>>"%GITHUB_ENV%"
          endlocal

      - name: Bootstrap pinned Python without PowerShell installer
        shell: cmd
        env:
          PY_ROOT: ${{ runner.temp }}\python-3.13.15-nuget-spine
          PY_EXE: ${{ runner.temp }}\python-3.13.15-nuget-spine\tools\python.exe
          PY_PKG: ${{ runner.temp }}\python.3.13.15-spine.nupkg
        run: |
          @echo off
          setlocal
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          set "PIP_OK="
          for /l %%I in (1,1,4) do if not defined PIP_OK (
            "%PY_EXE%" -m pip install --disable-pip-version-check pytest >"%RUNNER_TEMP%\spine-pip-%%I.log" 2>&1 && set "PIP_OK=1" || timeout /t %%I >nul
          )
          if not defined PIP_OK exit /b 1
          echo SPINE_PY_EXE=%PY_EXE%>>"%GITHUB_ENV%"
          endlocal

      - name: Run deterministic spine wave
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          if not exist "research\runs\spine\${{ matrix.wave }}\%GITHUB_RUN_ID%" mkdir "research\runs\spine\${{ matrix.wave }}\%GITHUB_RUN_ID%"
          "%SPINE_PY_EXE%" -m automation.temporal_identity_state_spine --output "research\runs\spine\${{ matrix.wave }}\%GITHUB_RUN_ID%\spine.json"
          "%SPINE_PY_EXE%" -m pytest -q tests/test_temporal_identity_state_spine.py tests/test_spine_evidence_adapter.py
          endlocal
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spine-windows-${{ matrix.wave }}-${{ github.run_id }}
          path: research/runs/spine/${{ matrix.wave }}/${{ github.run_id }}/
          retention-days: 14

  hosted_x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run integration/reuse wave
        run: |
          mkdir -p research/runs/spine/W-INTEGRATION/${{ github.run_id }}
          python -m automation.temporal_identity_state_spine --output research/runs/spine/W-INTEGRATION/${{ github.run_id }}/spine.json
          python -m pytest -q tests/test_temporal_identity_state_spine.py tests/test_spine_evidence_adapter.py tests/test_knowledge_relation_index.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spine-hosted-x64-${{ github.run_id }}
          path: research/runs/spine/W-INTEGRATION/${{ github.run_id }}/
          retention-days: 14

  hosted_arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Independent reproduction wave
        run: |
          mkdir -p research/runs/spine/W-REPRO/${{ github.run_id }}
          python -m automation.temporal_identity_state_spine --output research/runs/spine/W-REPRO/${{ github.run_id }}/spine.json
          python -m pytest -q tests/test_temporal_identity_state_spine.py tests/test_knowledge_relation_index.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spine-hosted-arm64-${{ github.run_id }}
          path: research/runs/spine/W-REPRO/${{ github.run_id }}/
          retention-days: 14
