name: Q179-Q184 PIT Readiness R1

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths:
      - "automation/q179_q184_pit_readiness.py"
      - "research/frontier/q179_q184_candidate_wave_2026_10_04.json"
      - ".github/workflows/q179-q184-pit-readiness.yml"
      - "tests/test_q179_q184_pit_readiness.py"

permissions:
  contents: read

concurrency:
  group: trading-agent-q179-q184-pit-readiness
  cancel-in-progress: true

jobs:
  pit_readiness:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run Q179-Q184 PIT readiness R1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q179_q184_pit_readiness
          python -m automation.q179_q184_pit_readiness \
            --output "research/runs/q179_q184_pit_readiness/${GITHUB_RUN_ID}.json"
      - name: Validate non-authorizing PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("research/runs/q179_q184_pit_readiness") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PIT_READINESS_R1_COMPLETED_NO_PERFORMANCE"
          assert len(d["candidate_results"])==6
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          assert all(d["synthetic_mutation_checks"].values())
          print("Q179_Q184_PIT_READINESS_R1_OK")
          PY
      - name: Upload PIT readiness receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q179-q184-pit-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q179_q184_pit_readiness/
          if-no-files-found: error
          retention-days: 30
