name: Current Operational Status Synchronizer

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/CURRENT_STATUS.md
      - research/evidence/current_operational_state.json
      - research/evidence/trading_agent_chat_handoff.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: write

concurrency:
  group: trading-agent-current-status-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 20

      - name: Collect live GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/status"
          gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "${RUNNER_TEMP}/status/open_prs_raw.json"
          gh api "/repos/${GITHUB_REPOSITORY}/issues?state=open&labels=agent-cli-ready&per_page=100" > "${RUNNER_TEMP}/status/agent_ready_issues_raw.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "status")
          prs = json.loads((root / "open_prs_raw.json").read_text(encoding="utf-8"))
          issues = json.loads((root / "agent_ready_issues_raw.json").read_text(encoding="utf-8"))
          payload = {
              "open_prs": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "headRefName": item["head"]["ref"],
                      "baseRefName": item["base"]["ref"],
                      "updatedAt": item["updated_at"],
                  }
                  for item in prs
              ],
              "agent_ready_issues": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "updatedAt": item["updated_at"],
                  }
                  for item in issues
                  if "pull_request" not in item
              ],
          }
          (root / "github_state.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
      - name: Resolve checked-out master source SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_master_sha="$(git rev-parse HEAD)"
          echo "STATUS_SOURCE_SHA=${checked_out_master_sha}" >> "${GITHUB_ENV}"
          test -n "$checked_out_master_sha"
      - name: Record master race-tolerant source
        shell: bash
        run: |
          set -euo pipefail
          echo "STATUS_SYNC_RACE_TOLERANT_SOURCE"
          echo "initial_checked_out_master=${STATUS_SOURCE_SHA}"
          remote_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "$remote_master_sha" != "$STATUS_SOURCE_SHA" ]; then
            echo "STATUS_SYNC_MASTER_MOVED_BEFORE_GENERATION remote=${remote_master_sha}"
          else
            echo "STATUS_SYNC_MASTER_STABLE_AT_CHECK"
          fi
      - name: Generate and publish synchronized status atomically
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          export PUBLISH_MESSAGE='OPS: synchronize current operational status'
          published=false

          # Master can advance in the short interval between our final SHA check
          # and the contents/ref publish. On that race, regenerate from the new
          # master; never rebase stale status output onto a newer source commit.
          for attempt in 1 2 3 4 5; do
            echo "STATUS_SYNC_ATTEMPT=\${attempt}/5"
            git fetch origin master
            git reset --hard origin/master
            source_master_sha="$(git rev-parse HEAD)"
            export STATUS_SOURCE_SHA="\${source_master_sha}"

            # Refresh the mutable GitHub metadata on each attempt as well.
            gh api "/repos/\${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "\${RUNNER_TEMP}/status/open_prs_raw.json"
            gh api "/repos/\${GITHUB_REPOSITORY}/issues?state=open&labels=agent-cli-ready&per_page=100" > "\${RUNNER_TEMP}/status/agent_ready_issues_raw.json"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"], "status")
          prs = json.loads((root / "open_prs_raw.json").read_text(encoding="utf-8"))
          issues = json.loads((root / "agent_ready_issues_raw.json").read_text(encoding="utf-8"))
          payload = {
              "open_prs": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "headRefName": item["head"]["ref"],
                      "baseRefName": item["base"]["ref"],
                      "updatedAt": item["updated_at"],
                  }
                  for item in prs
              ],
              "agent_ready_issues": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "updatedAt": item["updated_at"],
                  }
                  for item in issues
                  if "pull_request" not in item
              ],
          }
          (root / "github_state.json").write_text(
              json.dumps(payload, ensure_ascii=False), encoding="utf-8"
          )
          PY

            python -m automation.sync_current_operational_status \
              --source-master-sha "\${source_master_sha}" \
              --workflow-run-id "\${GITHUB_RUN_ID}" \
              --github-state "\${RUNNER_TEMP}/status/github_state.json"
            git diff --check

            # Do not publish if the branch changed during generation.
            latest_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            if [ "\${latest_master_sha}" != "\${source_master_sha}" ]; then
              echo "STATUS_SYNC_RETRY_STALE_GENERATION attempt=\${attempt} source=\${source_master_sha} latest=\${latest_master_sha}"
              sleep "\${attempt}"
              continue
            fi

            python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(
              Path("research/evidence/current_operational_state.json").read_text(encoding="utf-8")
          )
          assert d["repository"] == "DWR-debug/trading-agent-public"
          assert d["source_master_sha"] == os.environ["STATUS_SOURCE_SHA"]
          assert d["safety"]["status"] == "SAFE"
          assert d["status_commit_is_documentation_only"] is True
          print("CURRENT_STATUS_SYNC_OK")
          PY

            publish_args=(
              --repository "\${GITHUB_REPOSITORY}"
              --branch master
              --base-sha "\${source_master_sha}"
              --file "docs/CURRENT_STATUS.md=docs/CURRENT_STATUS.md"
              --file "research/evidence/current_operational_state.json=research/evidence/current_operational_state.json"
              --file "research/evidence/trading_agent_chat_handoff.json=research/evidence/trading_agent_chat_handoff.json"
            )
            if python -m automation.github_contents_publish "\${publish_args[@]}"; then
              echo "CURRENT_STATUS_SYNC_PUBLISH_OK source=\${source_master_sha}"
              published=true
              break
            fi

            # The publisher intentionally refuses to rebase a stale payload.
            # Retry only when master actually moved; otherwise surface a real error.
            latest_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            if [ "\${latest_master_sha}" = "\${source_master_sha}" ]; then
              echo "::error::Status publish failed without a concurrent master move."
              exit 1
            fi
            echo "STATUS_SYNC_RETRY_PUBLISH_RACE attempt=\${attempt} source=\${source_master_sha} latest=\${latest_master_sha}"
            sleep "\${attempt}"
          done

          if [ "\${published}" != "true" ]; then
            echo "::error::Master kept moving; status sync exhausted five bounded regeneration attempts."
            exit 1
          fi
      # Historical Q077/Q081 trigger files are intentionally not auto-dispatched.
      # Their research paths are closed/superseded; current research progression
      # is driven by the priority/next-gate dispatchers and current candidate DAG.
