name: Current Operational Status Synchronizer

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/CURRENT_STATUS.md
      - research/evidence/current_operational_state.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: trading-agent-current-status-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 20

      - name: Collect live GitHub state
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "\${RUNNER_TEMP}/status"
          gh pr list --state open --json number,title,url,headRefName,baseRefName,updatedAt > "\${RUNNER_TEMP}/status/open_prs.json"
          gh issue list --state open --label agent-cli-ready --json number,title,url,updatedAt > "\${RUNNER_TEMP}/status/agent_ready_issues.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "status")
          payload = {
              "open_prs": json.loads((root / "open_prs.json").read_text(encoding="utf-8")),
              "agent_ready_issues": json.loads(
                  (root / "agent_ready_issues.json").read_text(encoding="utf-8")
              ),
          }
          (root / "github_state.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Generate canonical current status
        run: |
          set -euo pipefail
          python -m automation.sync_current_operational_status \
            --source-master-sha "\${GITHUB_SHA}" \
            --workflow-run-id "\${GITHUB_RUN_ID}" \
            --github-state "\${RUNNER_TEMP}/status/github_state.json"
          git diff --check

      - name: Verify synchronized source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d = json.loads(
              Path("research/evidence/current_operational_state.json").read_text(
                  encoding="utf-8"
              )
          )
          assert d["repository"] == "DWR-debug/trading-agent-public"
          assert d["source_master_sha"] == os.environ["GITHUB_SHA"]
          assert d["safety"]["status"] == "SAFE"
          assert d["status_commit_is_documentation_only"] is True
          print("CURRENT_STATUS_SYNC_OK")
          PY

      - name: Commit synchronized status
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CURRENT_STATUS.md research/evidence/current_operational_state.json; then
            echo "Current operational status already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATUS.md research/evidence/current_operational_state.json
          git commit -m "OPS: synchronize current operational status"
          git pull --rebase origin master
          git push origin HEAD:master
