name: Current Operational Status Synchronizer

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/CURRENT_STATUS.md
      - research/evidence/current_operational_state.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: write

concurrency:
  group: trading-agent-current-status-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 20

      - name: Collect live GitHub state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/status"
          gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "${RUNNER_TEMP}/status/open_prs_raw.json"
          gh api "/repos/${GITHUB_REPOSITORY}/issues?state=open&labels=agent-cli-ready&per_page=100" > "${RUNNER_TEMP}/status/agent_ready_issues_raw.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "status")
          prs = json.loads((root / "open_prs_raw.json").read_text(encoding="utf-8"))
          issues = json.loads((root / "agent_ready_issues_raw.json").read_text(encoding="utf-8"))
          payload = {
              "open_prs": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "headRefName": item["head"]["ref"],
                      "baseRefName": item["base"]["ref"],
                      "updatedAt": item["updated_at"],
                  }
                  for item in prs
              ],
              "agent_ready_issues": [
                  {
                      "number": item["number"],
                      "title": item["title"],
                      "url": item.get("html_url"),
                      "updatedAt": item["updated_at"],
                  }
                  for item in issues
                  if "pull_request" not in item
              ],
          }
          (root / "github_state.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
      - name: Resolve checked-out master source SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_master_sha="$(git rev-parse HEAD)"
          echo "STATUS_SOURCE_SHA=${checked_out_master_sha}" >> "${GITHUB_ENV}"
          test -n "$checked_out_master_sha"
      - name: Record master race-tolerant source
        shell: bash
        run: |
          set -euo pipefail
          echo "STATUS_SYNC_RACE_TOLERANT_SOURCE"
          echo "initial_checked_out_master=${STATUS_SOURCE_SHA}"
          remote_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "$remote_master_sha" != "$STATUS_SOURCE_SHA" ]; then
            echo "STATUS_SYNC_MASTER_MOVED_BEFORE_GENERATION remote=${remote_master_sha}"
          else
            echo "STATUS_SYNC_MASTER_STABLE_AT_CHECK"
          fi
      - name: Generate and publish synchronized status atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          source_master_sha="$(git rev-parse HEAD)"
          export STATUS_SOURCE_SHA="${source_master_sha}"
          python -m automation.sync_current_operational_status \
            --source-master-sha "${source_master_sha}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --github-state "${RUNNER_TEMP}/status/github_state.json"
          git diff --check

          # Never publish a snapshot that was generated from an older master.
          # A newer push will cancel/restart this workflow; exiting here keeps
          # the status files from being overwritten by a stale run.
          latest_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "$latest_master_sha" != "$source_master_sha" ]; then
            echo "STATUS_SYNC_ABORT_STALE_SOURCE latest_master=$latest_master_sha source=$source_master_sha"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d = json.loads(
              Path("research/evidence/current_operational_state.json").read_text(
                  encoding="utf-8"
              )
          )
          assert d["repository"] == "DWR-debug/trading-agent-public"
          assert d["source_master_sha"] == os.environ["STATUS_SOURCE_SHA"]
          assert d["safety"]["status"] == "SAFE"
          assert d["status_commit_is_documentation_only"] is True
          print("CURRENT_STATUS_SYNC_OK")
          PY

          export PUBLISH_MESSAGE='OPS: synchronize current operational status'
          publish_args=(
            --repository "$GITHUB_REPOSITORY"
            --branch master
            --base-sha "$source_master_sha"
            --file "docs/CURRENT_STATUS.md=docs/CURRENT_STATUS.md"
            --file "research/evidence/current_operational_state.json=research/evidence/current_operational_state.json"
          )
          python -m automation.github_contents_publish "${publish_args[@]}"

          echo "CURRENT_STATUS_SYNC_PUBLISH_OK"


      - name: Dispatch explicit Q077 discovery trigger
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -Fxq "research/run_requests/q077_discovery.trigger"; then
            python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/actions/workflows/q077-fresh-e1-e2-discovery.yml/dispatches"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "master"}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          print("Q077_DISCOVERY_DISPATCHED")
          PY
          else
            echo "No explicit Q077 discovery trigger in this push."
          fi

      - name: Dispatch explicit Q081 self-hosted reproduction
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -Fxq "research/run_requests/q081_selfhosted_reproduction.trigger"; then
            python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/actions/workflows/q081-selfhosted-reproduction.yml/dispatches"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "master"}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          print("Q081_SELF_HOSTED_REPRODUCTION_DISPATCHED")
          PY
          else
            echo "No explicit Q081 self-hosted reproduction trigger in this push."
          fi

      - name: Dispatch explicit Q081-R1 preflight
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -Eq "^research/run_requests/q081r1_preflight(_final)?\\.trigger$"; then
            python - <<'PY'
          import json
          import os
          import urllib.request
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/q081r1-preflight.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "master"}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          print("Q081R1_PREFLIGHT_DISPATCHED")
          PY
          else
            echo "No explicit Q081-R1 preflight trigger in this push."
          fi

      - name: Dispatch explicit Q081-R1 self-hosted reproduction
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep -Fxq "research/run_requests/q081r1_selfhosted_reproduction.trigger"; then
            python - <<'PY'
          import json
          import os
          import urllib.request
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/q081r1-selfhosted-reproduction.yml/dispatches"
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "master"}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req, timeout=30).read()
          print("Q081R1_SELF_HOSTED_REPRODUCTION_DISPATCHED")
          PY
          else
            echo "No explicit Q081-R1 self-hosted reproduction trigger in this push."
          fi
