name: Q089 Contract Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [master]
    paths:
      - "automation/q089_contract_audit.py"
      - "tests/test_q089_contract_audit.py"
      - "automation/q089_performance.py"
      - "automation/q089_coverage_pit.py"
      - "research/preregistrations/q089_performance_2026_09_28.json"
      - "research/governance/active_research_registry.json"
      - ".github/workflows/q089-contract-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu
            runs_on: ubuntu-latest
          - lane: self_hosted
            runs_on: '["self-hosted","trading-agent-research"]'
    runs-on: ${{ contains(matrix.lane, 'self') && fromJSON(matrix.runs_on) || matrix.runs_on }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python (hosted)
        if: matrix.lane == 'ubuntu'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bootstrap pinned Python (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q089-audit"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q089-audit.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          echo %PY_ROOT%\tools>>"%GITHUB_PATH%"
          endlocal

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run unit test
        run: python -m pytest -q tests/test_q089_contract_audit.py
      - name: Run read-only audit
        run: |
          python -m automation.q089_contract_audit > q089-contract-audit.json
          cat q089-contract-audit.json
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q089-contract-audit-${{ matrix.lane }}-${{ github.run_id }}
          path: q089-contract-audit.json
          retention-days: 14
