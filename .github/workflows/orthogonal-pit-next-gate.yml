name: Orthogonal PIT Next-Gate Compiler

on:
  workflow_run:
    workflows:
      - Q193-Q196 Source Feasibility
      - Q197-Q198 Source Feasibility
      - Q199-Q201 Source Feasibility
      - Q202-Q204 Information Timing Feasibility
      - Q185-Q186 Source Feasibility
      - Q188-Q192 PIT Census R2
    types: [completed]
  push:
    branches: [master]
    paths:
      - "research/candidates/orthogonal_candidate_specs_2026-10-04.json"
      - "research/candidates/orthogonal_candidate_specs_2026-10-05.json"
      - "research/evidence/q193_q196_source_feasibility_latest.json"
      - "research/evidence/q197_q198_source_feasibility_latest.json"
      - "research/evidence/q198_pit_clock_census_latest.json"
      - "research/evidence/q199_q201_source_feasibility_latest.json"
      - "research/evidence/q202_q204_information_timing_feasibility_latest.json"
      - "research/evidence/q186_pit_readiness_r2_latest.json"
      - "research/evidence/q187_q192_source_feasibility_latest.json"
      - "research/evidence/q187_q192_pit_readiness_r1_latest.json"
      - "research/evidence/q188_q192_pit_census_r2_latest.json"
      - "automation/orthogonal_pit_next_gate.py"
      - "docs/TRADING_AGENT_OS_ORCHESTRATION.md"
      - "research/governance/persistent_research_acceleration_contract.json"
      - "ops/trading_agent_os_state.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-orthogonal-next-gate
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Run deterministic next-gate compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m automation.orthogonal_pit_next_gate \
            --output research/runs/orthogonal_next_gate_latest.json

      - name: Publish next-gate receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research/evidence
          cp research/runs/orthogonal_next_gate_latest.json research/evidence/orthogonal_next_gate_latest.json
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python3 automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$current_sha" \
              --file "research/evidence/orthogonal_next_gate_latest.json=research/evidence/orthogonal_next_gate_latest.json"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload compiler receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orthogonal-next-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/orthogonal_next_gate_latest.json
          if-no-files-found: error
          retention-days: 30
