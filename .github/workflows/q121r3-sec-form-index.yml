name: Q121-R3 SEC Form Index Reverse Issuer Feasibility

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "automation/q121r3_sec_form_index_reverse_issuer.py"
      - "tests/test_q121r3_sec_form_index_reverse_issuer.py"
      - "research/preregistrations/q121r3_sec_form_index_reverse_issuer_2026_10_03.json"
      - ".github/workflows/q121r3-sec-form-index.yml"
  push:
    branches: [master]
    paths:
      - "automation/q121r3_sec_form_index_reverse_issuer.py"
      - "tests/test_q121r3_sec_form_index_reverse_issuer.py"
      - "research/preregistrations/q121r3_sec_form_index_reverse_issuer_2026_10_03.json"
      - ".github/workflows/q121r3-sec-form-index.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q121r3_sec_form_index_reverse_issuer.py
      - name: Run Q121-R3
        run: python -m automation.q121r3_sec_form_index_reverse_issuer --output research/runs/q121r3_sec_form_index_reverse_issuer/result.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q121r3_sec_form_index_reverse_issuer/result.json").read_text())
          assert p["status"] == "Q121R3_FORM_INDEX_ROUTE_FEASIBILITY_COMPLETED"
          assert p["quarters_checked"] == 7
          assert p["frozen_controls_checked"] == 3
          assert p["interpretation"]["quarterly_index_coverage_for_fixed_window"] is True
          assert p["interpretation"]["full_subject_issuer_population_compiled"] is False
          assert p["interpretation"]["same_day_pit_safe"] is False
          for key in ("performance","holdout","selection","ranking","parameter_search","threshold_search","horizon_search","asset_search","variant_search","performance_authorized","automatic_promotion"):
              assert p["governance"][key] is False
          assert p["safety"]["paper_only"] is True
          assert p["safety"]["live_trading_enabled"] is False
          assert p["safety"]["orders_enabled"] is False
          print("Q121R3_BOUNDARY=PASS")
          print("Q121R3_ROWS=", p["filtered_form_rows"])
          print("Q121R3_CONTROLS=", p["frozen_controls_checked"])
          print("Q121R3_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q121r3-sec-form-index-${{ github.run_id }}
          path: research/runs/q121r3_sec_form_index_reverse_issuer/result.json
          if-no-files-found: error
          retention-days: 30
