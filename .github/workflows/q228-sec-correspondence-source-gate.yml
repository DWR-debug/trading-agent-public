name: Q228 SEC Correspondence Source Gate

on:
  push:
    branches: [master]
    paths:
      - research/candidates/orthogonal_candidate_specs_2026-10-05.json
      - automation/q228_sec_correspondence_source_gate.py
      - tests/test_q228_sec_correspondence_source_gate.py
      - .github/workflows/q228-sec-correspondence-source-gate.yml
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q228-sec-correspondence
  cancel-in-progress: true

jobs:
  source_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m automation.q228_sec_correspondence_source_gate --output research_q228.json
      - run: python -m pytest -q tests/test_q228_sec_correspondence_source_gate.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q228-sec-correspondence-source-gate-${{ github.run_id }}
          path: research_q228.json
          retention-days: 14
