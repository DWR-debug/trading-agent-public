name: Q089 Revision 7 Fingerprint Probe

on:
  push:
    branches: [auth/q089-revision6-one-shot-03]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Compute exact Q089 revision 7 fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          runner=Path("automation/q089_performance.py").read_bytes()
          runner_sha=hashlib.sha256(runner).hexdigest()
          p=Path("research/preregistrations/q089_performance_2026_09_28.json")
          o=json.loads(p.read_text(encoding="utf-8"))
          o["governance"]["performance_trial_authorized"]=True
          o["source_contract"]["performance_runner_sha256"]=runner_sha
          o["revision"]=7
          o["supersedes"]="q089_performance_2026_09_28.json@revision-6"
          o["revision_reason"]="Governance authorization revision after Q089 revision 6 passed fresh dual-lane contract audit, master CI, exact master gate, and Self-Hosted Research Governance Audit. This revision only transitions the already-frozen trial to one-shot authorized execution and records the exact authorization binding. No signal, universe, split, data value, cost, gate, holdout, parameter, threshold, asset, horizon, variant, candidate-selection, or performance rule changed."
          canonical=json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)
          print("Q089_REV7_RUNNER_SHA="+runner_sha)
          print("Q089_REV7_PREREG_FP="+hashlib.sha256(canonical.encode()).hexdigest())
          PY
