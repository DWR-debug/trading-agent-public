name: Q066 Alpha Failure Mechanism Diagnosis

on:
  push:
    branches:
      - research/q066-alpha-failure-diagnosis
    paths:
      - "research/preregistrations/q066_alpha_failure_mechanism_diagnosis_2026_09_28.json"
      - "automation/q066_alpha_failure_diagnosis.py"
      - "tests/test_q066_alpha_failure_diagnosis.py"
      - ".github/workflows/q066-alpha-failure-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q066-alpha-failure-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety and governance guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings

          p = json.loads(Path("research/preregistrations/q066_alpha_failure_mechanism_diagnosis_2026_09_28.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert p["status"] == "PREREGISTERED_DIAGNOSTIC_ONLY"
          assert p["governance"]["diagnostic_evaluation"] is True
          assert p["governance"]["new_performance_evaluation"] is False
          assert p["governance"]["selection"] is False
          assert p["governance"]["promotion_decision"] is False
          assert p["data_and_reproducibility"]["no_new_market_data"] is True
          print("Q066 SAFETY/GOVERNANCE OK")
          PY

      - name: Contract tests
        run: python -m pytest -q tests/test_q066_alpha_failure_diagnosis.py

      - name: Verify historical runner source blobs
        run: |
          set -euo pipefail
          q041_sha=$(git hash-object automation/q041_alpha_multiarm_performance.py)
          q045_sha=$(git hash-object automation/q045_fixed_alpha_replication_performance.py)
          test "$q041_sha" = "cc9e76a1748db85db23b76cba209d7faf147847b"
          test "$q045_sha" = "a27fa60a892d31ae62cf9a85fa3d9b33b538670b"
          echo "Q041_RUNNER_BLOB_SHA=$q041_sha"
          echo "Q045_RUNNER_BLOB_SHA=$q045_sha"

      - name: Download immutable Q041 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research/evidence_inputs/q041
          gh run download 36346986793 --name q041-alpha-multiarm-performance-36346986793 --dir research/evidence_inputs/q041

      - name: Download immutable Q045 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research/evidence_inputs/q045
          gh run download 36348015321 --name q045-fixed-alpha-replication-36348015321 --dir research/evidence_inputs/q045

      - name: Execute fixed-result diagnosis
        run: |
          set -euo pipefail
          python -m automation.q066_alpha_failure_diagnosis             --q041-root research/evidence_inputs/q041             --q045-root research/evidence_inputs/q045             --preregistration research/preregistrations/q066_alpha_failure_mechanism_diagnosis_2026_09_28.json             --output research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_result.json             --markdown research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_report.md

      - name: Validate deterministic reconstruction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_result.json")
          d = json.loads(p.read_text())
          assert d["status"] == "COMPLETED_DIAGNOSTIC_ONLY"
          assert d["reconstruction"]["q041"]["aggregate_reconstruction_exact"] is True
          assert d["reconstruction"]["q045"]["aggregate_reconstruction_exact"] is True
          assert d["governance"]["new_performance_evaluation"] is False
          assert d["governance"]["selection"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["safety"]["paper_only"] is True
          print("Q066 RECONSTRUCTION/GOVERNANCE PASS")
          print("Q066_DIAGNOSTIC_FINGERPRINT:", d["diagnostic_fingerprint"])
          PY

      - name: Publish canonical diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_result.json
          git add research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_report.md
          git commit -m "EVIDENCE: record Q066 alpha failure mechanism diagnosis"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Print diagnosis summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/q066_alpha_failure_diagnosis/T-2026-09-28-066/q066_result.json")
          if not p.exists():
              print("Q066_RESULT_NOT_AVAILABLE")
              raise SystemExit(0)
          d = json.loads(p.read_text())
          print(json.dumps(d["executive_summary"], indent=2))
          PY
