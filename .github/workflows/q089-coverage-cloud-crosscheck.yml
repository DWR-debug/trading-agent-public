name: Q089 Coverage Cross-Check (cloud)

on:
  push:
    branches: [master]
    paths:
      - "automation/q089_coverage_pit.py"
      - "automation/fixed_window_candidate_discovery.py"
      - "research/run_requests/q089_coverage_pit.trigger"
      - "tests/test_q089_validation.py"
      - ".github/workflows/q089-coverage-cloud-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q089-coverage-cloud-crosscheck
  cancel-in-progress: true

jobs:
  coverage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Structural Q089 tests
        run: python -m pytest -q tests/test_q089_validation.py tests/test_q089_input_freeze.py tests/test_q089_performance_envelope.py
      - name: Coverage-only cross-check
        run: python automation/q089_coverage_pit.py coverage
