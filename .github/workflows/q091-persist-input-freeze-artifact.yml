name: Q091 Persist Verified Input Freeze Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/ops/q091_input_bundle_persist.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q091-persist-input-freeze
  cancel-in-progress: false

jobs:
  persist:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check whether bundle is already persisted
        id: prior
        shell: bash
        run: |
          if test -f research/evidence/q091_input_freeze_result.json && test -f research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/input_bundle_manifest.json; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact verified artifact
        if: steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 36555492153             --repo "$GITHUB_REPOSITORY"             --name q091-input-freeze-36555492153-1             --dir "$RUNNER_TEMP/q091_verified"

      - name: Verify exact artifact
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"q091_verified"
          receipt=json.loads((base/"evidence/q091_input_freeze_result.json").read_text())
          manifest=json.loads((base/"runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/input_bundle_manifest.json").read_text())
          assert receipt["status"]=="INPUT_BUNDLE_FROZEN"
          assert receipt["trial_id"]=="T-2026-09-29-091-INPUT-FREEZE"
          assert receipt["performance_evaluation"] is False
          assert receipt["selection_used"] is False
          assert manifest["bundle_fingerprint"]==receipt["bundle_fingerprint"]
          assert len(receipt["datasets"])==8
          assert all(int(x["row_count"])==3500 for x in receipt["datasets"])
          print("Q091 EXACT INPUT ARTIFACT VERIFIED")
          print("bundle_fingerprint="+receipt["bundle_fingerprint"])
          PY

      - name: Publish exact artifact with fast-forward retry
        if: steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist Q091 verified adjusted-close input bundle"
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q091_input_freeze_result.json="$RUNNER_TEMP/q091_verified/evidence/q091_input_freeze_result.json"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/input_bundle_manifest.json="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/input_bundle_manifest.json"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/ACGL/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/ACGL/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/APA/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/APA/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/BXP/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/BXP/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CE/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CE/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CF/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CF/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CPRT/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/CPRT/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/GLW/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/GLW/adjusted_close.csv"             --file research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/GPN/adjusted_close.csv="$RUNNER_TEMP/q091_verified/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/GPN/adjusted_close.csv"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q091-input-freeze-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q091_input_freeze_result.json
            research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/**
          if-no-files-found: warn
          retention-days: 30
