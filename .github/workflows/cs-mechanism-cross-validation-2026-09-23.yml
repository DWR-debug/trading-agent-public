name: Cross-Validation Cross-Sectional Mechanism 2026-09-23

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/cs_mechanism_cross_validation_2026_09_23.py"
      - "tests/test_cs_mechanism_cross_validation_2026_09_23.py"
      - ".github/workflows/cs-mechanism-cross-validation-2026-09-23.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cross_validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Erste unabhängige CS-Replikation laden
        uses: actions/download-artifact@v5
        with:
          name: cs-momentum-replication-35840185031
          path: first_artifact
          run-id: 35840185031
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Zweite unabhängige Validation laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/10740188093/zip"             --output second_artifact.zip
          echo "eed3ec6105dec7bc8616ab989ce6f086107b249f7fa087f6e851709af6e47354  second_artifact.zip" | sha256sum -c -
          mkdir -p second_artifact
          unzip -q second_artifact.zip -d second_artifact

      - name: Cross-Validation ausführen
        run: |
          set -euo pipefail
          python -m automation.cs_mechanism_cross_validation_2026_09_23             --first-root first_artifact             --second-root second_artifact             --output cs_mechanism_cross_validation_2026_09_23.json

      - name: Konsistenz prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("cs_mechanism_cross_validation_2026_09_23.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          stored = document.pop("consensus_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  document,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert document["status"] == "COMPLETED"
          assert document["consensus"]["holdout_used_for_selection"] is False
          assert document["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          print("CS_CROSS_VALIDATION_INTEGRITY_VALID")
          print("SELECTION_SPREAD_DIRECTION:", document["consensus"]["selection_spread_direction"])
          print(
              "WEAK_SCORE_PREDICTION_BOTH:",
              document["consensus"]["formation_score_forward_prediction_non_positive_both"],
          )
          print("CONSENSUS_FINGERPRINT:", stored)
          PY

      - name: Cross-Validation-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: cs-mechanism-cross-validation-2026-09-23-${{ github.run_id }}
          path: cs_mechanism_cross_validation_2026_09_23.json
          if-no-files-found: error
          retention-days: 30
