name: Q117 Treasury Demand State Population Validation

on:
  push:
    branches: [master]
    paths:
      - "automation/q117_treasury_demand_population.py"
      - "automation/q115_treasury_demand_state.py"
      - "tests/test_q117_treasury_demand_population.py"
      - "research/preregistrations/q117_treasury_demand_population_2026_10_01.json"
      - ".github/workflows/q117-treasury-demand-population.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q117-treasury-demand-population
  cancel-in-progress: true

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False"
      - name: Contract tests
        run: python -m pytest -q tests/test_q117_treasury_demand_population.py
      - name: Live Treasury population
        if: matrix.runner == 'ubuntu-24.04'
        run: python -m automation.q117_treasury_demand_population
      - name: Validate receipt
        if: matrix.runner == 'ubuntu-24.04'
        run: python -c "import json; from pathlib import Path; r=json.loads(Path('research/runs/q117_treasury_demand_population/result.json').read_text()); assert r['validation']['raw_events'] > 0; assert sum(r['validation']['state_counts'].values()) == r['validation']['compiled_events']; assert r['governance']['performance_authorized'] is False; print('Q117 RECEIPT CONTRACT OK')"
      - name: Publish immutable receipt
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          cmd=(python automation/github_contents_publish.py
            --repository "$GITHUB_REPOSITORY"
            --branch master
            --base-sha "$BASE_SHA"
            --file "research/evidence/q117_treasury_demand_population_result.json=research/runs/q117_treasury_demand_population/result.json")
          "${cmd[@]}"
