name: Portfolio Risk-Parity Failure Diagnosis 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "research/diagnostics/portfolio_risk_parity_failure.py"
      - "research/diagnostics/__init__.py"
      - "tests/test_portfolio_risk_parity_failure.py"
      - "docs/portfolio_risk_parity_trial022_failure_diagnosis.md"
      - "research/checkpoints/portfolio_risk_parity_trial022_failure_diagnosis.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pytest installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Diagnose-Safety prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
