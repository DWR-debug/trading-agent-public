name: Q119 Treasury Auction Demand-Shape Feasibility

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q119_treasury_demand_shape.py"
      - "automation/q119_treasury_source_feasibility.py"
      - "tests/test_q119_treasury_demand_shape.py"
      - "tests/test_q119_treasury_source_feasibility.py"
      - ".github/workflows/q119-treasury-source-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q119-treasury-source-feasibility
  cancel-in-progress: true

jobs:
  q119_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Structural Q119 tests
        run: python -m pytest -q tests/test_q119_treasury_demand_shape.py tests/test_q119_treasury_source_feasibility.py

      - name: Fetch and validate live Treasury population
        run: python -m automation.q119_treasury_source_feasibility --output "research/runs/q119_treasury/q119_source_pit_result.json"

      - name: Verify governance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q119_treasury/q119_source_pit_result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q119_SOURCE_PIT_FEASIBILITY_COMPLETED"
          assert all(v is False for v in p["governance"].values())
          assert p["safety"]["paper_only"] is True
          assert p["safety"]["live_trading_enabled"] is False
          print("Q119_GOVERNANCE_BOUNDARY=PASS")
          PY

      - name: Upload Q119 feasibility receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q119-treasury-source-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q119_treasury/q119_source_pit_result.json
          if-no-files-found: error
          retention-days: 30
