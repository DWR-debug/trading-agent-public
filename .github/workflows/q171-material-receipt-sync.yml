name: Q171 Material Receipt Sync

on:
  workflow_run:
    workflows: ["Deep Frontier Public Source Feasibility"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: trading-agent-q171-material-receipt-sync
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      ${{
        github.event.workflow_run.repository.full_name == 'DWR-debug/trading-agent-public' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download Deep Frontier artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: research/runs/q171_receipt_sync/${{ github.event.workflow_run.id }}

      - name: Locate WARC material receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find "research/runs/q171_receipt_sync/${{ github.event.workflow_run.id }}" -name q171_warc_reconstruction.json -print -quit)"
          test -n "$receipt"
          echo "Q171_RECEIPT_INPUT=$receipt" >> "$GITHUB_ENV"

      - name: Build stable material receipt
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python -m automation.q171_warc_persist \
            --input "$Q171_RECEIPT_INPUT" \
            --output "research/evidence/q171_warc_reconstruction_latest.json" \
            --source-commit "$SOURCE_COMMIT"

      - name: Publish material receipt with fast-forward retries
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "OPS: persist latest Q171 WARC material receipt"
        shell: bash
        run: |
          set -euo pipefail
          latest="research/evidence/q171_warc_reconstruction_latest.json"
          for attempt in 1 2 3; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if git show "origin/master:${latest}" > "$RUNNER_TEMP/q171_current_receipt.json" 2>/dev/null; then
              if cmp -s "$latest" "$RUNNER_TEMP/q171_current_receipt.json"; then
                echo "Q171_MATERIAL_RECEIPT_UNCHANGED"
                exit 0
              fi
            fi
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$base_sha" \
              --file "$latest=$latest"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Q171 material receipt publication failed after retries"
          exit 1