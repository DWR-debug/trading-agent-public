name: Q089 Clean Fresh Q069 Coverage and PIT (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q089_coverage_pit.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q089-coverage-pit
  cancel-in-progress: false

jobs:
  research:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 120
    steps:
      - name: Download exact trigger source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q089-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-q089-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q089"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q089.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Validate Q089 scaffold
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q089-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m pytest -q tests/test_q089_validation.py || exit /b 1
          endlocal

      - name: Coverage discovery and Q089 snapshot
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q089-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" automation/q089_coverage_pit.py coverage || exit /b 1
          endlocal

      - name: Persist Q089 snapshot bundle before PIT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q089-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "BASE_SHA_FILE=%RUNNER_TEMP%\q089_base_sha.txt"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%BASE_SHA_FILE%" || exit /b 1
          set /p BASE_SHA=<"%BASE_SHA_FILE%"
          "%PY_EXE%" -c "import json,subprocess,sys,os; freeze=json.load(open('research/evidence/q089_asset_freeze.json',encoding='utf-8')); root='research/runs/q089_coverage/T-2026-09-28-089-COVERAGE'; files=['research/runs/q089_discovery/discovery.json','research/evidence/q089_coverage_result.json','research/evidence/q089_asset_freeze.json',f'{root}/snapshot_manifest.json']+[f'{root}/datasets/{s}/1d.csv' for s in freeze['symbols']]; cmd=[sys.executable,'automation/github_contents_publish.py','--repository',os.environ['GITHUB_REPOSITORY'],'--branch','master','--base-sha','%BASE_SHA%']; [cmd.extend(['--file',f+'='+f]) for f in files]; subprocess.check_call(cmd)"
          endlocal

      - name: Download newly persisted master for PIT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PIT_WORK=%RUNNER_TEMP%\trading-agent-q089-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "PIT_ARCHIVE=%RUNNER_TEMP%\trading-agent-q089-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          if exist "%PIT_WORK%" rmdir /s /q "%PIT_WORK%"
          mkdir "%PIT_WORK%" || exit /b 1
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%RUNNER_TEMP%\q089_persisted_master_sha.txt" || exit /b 1
          set /p MASTER_SHA=<"%RUNNER_TEMP%\q089_persisted_master_sha.txt"
          curl.exe -L --fail --silent --show-error -o "%PIT_ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%MASTER_SHA%" || exit /b 1
          tar.exe -xzf "%PIT_ARCHIVE%" -C "%PIT_WORK%" || exit /b 1
          endlocal

      - name: Freeze adjusted-close input bundle, run PIT and generate final preregistration
        shell: cmd
        run: |
          @echo off
          setlocal
          for /d %%D in ("%RUNNER_TEMP%\trading-agent-q089-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" automation/q089_input_freeze.py --coverage-root "research/runs/q089_coverage/T-2026-09-28-089-COVERAGE" --output-root "research/runs/q089_input_bundle/T-2026-09-28-089-INPUT-FREEZE" --result "research/evidence/q089_input_freeze_result.json" || exit /b 1
          "%PY_EXE%" automation/q089_coverage_pit.py pit || exit /b 1
          "%PY_EXE%" automation/q089_coverage_pit.py preregister || exit /b 1
          "%PY_EXE%" automation/research_governance_audit.py || exit /b 1
          endlocal

      - name: Persist Q089 immutable input bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          for /d %%D in ("%RUNNER_TEMP%\trading-agent-q089-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" automation/publish_q089_input_bundle.py --bundle-root "research/runs/q089_input_bundle/T-2026-09-28-089-INPUT-FREEZE" --result "research/evidence/q089_input_freeze_result.json" --repository "%GITHUB_REPOSITORY%" || exit /b 1


      - name: Persist Q089 PIT, preregistration and registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          for /d %%D in ("%RUNNER_TEMP%\trading-agent-q089-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q089\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "BASE_SHA_FILE=%RUNNER_TEMP%\q089_final_base_sha.txt"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%BASE_SHA_FILE%" || exit /b 1
          set /p BASE_SHA=<"%BASE_SHA_FILE%"
          "%PY_EXE%" automation/github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/evidence/q089_pit_result.json=research\evidence\q089_pit_result.json --file research/preregistrations/q089_performance_2026_09_28.json=research\preregistrations\q089_performance_2026_09_28.json --file research/governance/active_research_registry.json=research\governance\active_research_registry.json || exit /b 1
          endlocal

      - name: Upload Q089 provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q089-coverage-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/q089_coverage/
            research/evidence/q089_coverage_result.json
            research/evidence/q089_asset_freeze.json
            research/evidence/q089_input_freeze_result.json
            research/evidence/q089_pit_result.json
            research/preregistrations/q089_performance_2026_09_28.json
            research/governance/active_research_registry.json
          if-no-files-found: warn
          retention-days: 30
