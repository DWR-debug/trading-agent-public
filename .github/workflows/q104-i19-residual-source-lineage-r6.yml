name: Q104 I19 Residual Source-Lineage Diagnostic R6

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q104_i19_residual_source_lineage_r6.trigger"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: trading-agent-q104-i19-residual-source-lineage-r6
  cancel-in-progress: false

jobs:
  lineage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate frozen census and recovery artifact lineage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="research/run_requests/q104_i19_residual_source_lineage_r6.trigger"
          test -s "$request"
          source_run_id="$(sed -n 's/^SOURCE_RUN_ID=//p' "$request")"
          recovery_run_id="$(sed -n 's/^RECOVERY_RUN_ID=//p' "$request")"
          recovery_artifact_id="$(sed -n 's/^RECOVERY_ARTIFACT_ID=//p' "$request")"
          [[ "$source_run_id" =~ ^[0-9]+$ && "$recovery_run_id" =~ ^[0-9]+$ && "$recovery_artifact_id" =~ ^[0-9]+$ ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id" > "$RUNNER_TEMP/q104-lineage-r6-source-run.json"
          jq -e '
            .name == "Q104 I19 Historical 13F Identity Census"
            and .status == "completed"
            and .head_branch == "master"
            and (.conclusion == "failure" or .conclusion == "cancelled")
          ' "$RUNNER_TEMP/q104-lineage-r6-source-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100" > "$RUNNER_TEMP/q104-lineage-r6-source-artifacts.json"
          for artifact in \
            "q104-i19-sec-source-snapshot-$source_run_id" \
            "q104-i19-census-2013-2016-$source_run_id"; do
            jq -e --arg n "$artifact" '[.artifacts[]? | select(.name == $n and .expired == false)] | length == 1' \
              "$RUNNER_TEMP/q104-lineage-r6-source-artifacts.json" >/dev/null
          done
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id" > "$RUNNER_TEMP/q104-lineage-r6-recovery-run.json"
          jq -e '
            .name == "Q104 I19 Targeted Acceptance Header Repair"
            and .status == "completed"
            and .head_branch == "master"
            and (.conclusion == "failure" or .conclusion == "cancelled")
          ' "$RUNNER_TEMP/q104-lineage-r6-recovery-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id/artifacts?per_page=100" > "$RUNNER_TEMP/q104-lineage-r6-recovery-artifacts.json"
          jq -e --argjson id "$recovery_artifact_id" --arg n "q104-i19-targeted-acceptance-repair-38168441086-38250105408-2" \
            '[.artifacts[]? | select(.id == $id and .name == $n and .expired == false)] | length == 1' \
            "$RUNNER_TEMP/q104-lineage-r6-recovery-artifacts.json" >/dev/null
          echo "Q104_LINEAGE_R6_SOURCE_RUN_ID=$source_run_id"
          echo "Q104_LINEAGE_R6_RECOVERY_RUN_ID=$recovery_run_id"

      - name: Download the pinned recovery bundle with original and recovered receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_run_id="$(sed -n 's/^RECOVERY_RUN_ID=//p' research/run_requests/q104_i19_residual_source_lineage_r6.trigger)"
          recovery_artifact_name="q104-i19-targeted-acceptance-repair-38168441086-38250105408-2"
          root="research/runs/q104_i19_residual_source_lineage_r6/$GITHUB_RUN_ID"
          mkdir -p "$root"
          gh run download "$recovery_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$recovery_artifact_name" --dir "$root/recovery"
          test -s "$root/recovery/38168441086/source_snapshot/source_page.html"
          test -s "$root/recovery/38168441086/input/2013-2016/shard_receipt.json"
          test -s "$root/recovery/38168441086/repaired/2013-2016/shard_receipt.json"
          test -s "$root/recovery/38168441086/targeted_recovery_receipt.json"
          echo "Q104_LINEAGE_R6_ROOT=$root" >> "$GITHUB_ENV"

      - name: Capture bounded cross-vintage source-lineage observations
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q104_i19_residual_source_lineage_diagnostic_r6 \
            --request research/run_requests/q104_i19_residual_source_lineage_r6.trigger \
            --source-snapshot-dir "$Q104_LINEAGE_R6_ROOT/recovery/38168441086/source_snapshot" \
            --input-dir "$Q104_LINEAGE_R6_ROOT/recovery/38168441086" \
            --output "$Q104_LINEAGE_R6_ROOT/receipt.json"

      - name: Upload immutable R6 diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-residual-lineage-r6-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_residual_source_lineage_r6/*/receipt.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Fail closed when observations are incomplete
        if: steps.probe.outcome != 'success'
        run: |
          echo "Q104 R6 observations incomplete; all acceptance-time and research gates remain closed."
          exit 1
