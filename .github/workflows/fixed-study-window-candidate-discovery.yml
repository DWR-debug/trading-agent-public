name: Fixed Study-Window Candidate Discovery

on:
  push:
    branches:
      - master
    paths:
      - automation/fixed_window_candidate_discovery.py
      - research/asset_universes.py
      - data/yahoo_loader.py
      - data/canonical_snapshot.py
      - .github/workflows/fixed-study-window-candidate-discovery.yml
      - research/run_requests/fixed_window_candidate_discovery.trigger
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-study-window-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Execute deterministic coverage discovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY OK")
          PY
          python -m automation.fixed_window_candidate_discovery \
            --output research/runs/fixed_window_candidate_discovery/discovery.json \
            --symbol-limit 48 \
            --workers 8

      - name: Validate discovery contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/fixed_window_candidate_discovery/discovery.json")
          if not p.exists():
              raise SystemExit("DISCOVERY_ARTIFACT_MISSING")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["asset_selection_by_performance"] is False
          assert d["study_window"]["start"] == "2011-01-01"
          assert d["study_window"]["end"] == "2025-09-24"
          assert d["study_window"]["target_common_count"] == 3500
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("FIXED_WINDOW_DISCOVERY_CONTRACT_OK")
          print("SELECTED_COVERAGE_BATCH:", d["selected_coverage_batch"])
          print("SELECTED_COMMON_COUNT:", d["selected_common_count"])
          print("FINGERPRINT:", d["fingerprint"])
          PY

      - name: Publish discovery artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fixed-study-window-candidate-discovery-${{ github.run_id }}
          path: research/runs/fixed_window_candidate_discovery/
          if-no-files-found: warn
          retention-days: 30
