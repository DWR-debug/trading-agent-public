name: H06-P2 Immutable Adjusted-Close Input Freeze

on:
  push:
    branches: [master]
    paths:
      - ".github/ops/h06_p2_input_bundle_persist.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-h06-p2-input-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check whether final bundle is already persisted
        id: prior
        shell: bash
        run: |
          if test -f research/evidence/h06_p2_input_freeze_result.json &&              test -f research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/input_bundle_manifest.json; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact immutable H06 coverage artifact
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run download 36842998210             --repo "$GITHUB_REPOSITORY"             --name h06-master-coverage-36842998210             --dir "$RUNNER_TEMP/h06_coverage"

      - name: Freeze adjusted-close bundle
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_h06_p2_input_freeze.py
          python -m automation.h06_p2_input_freeze             --coverage-root "$RUNNER_TEMP/h06_coverage/h06_repair_datasets"             --output-root "$RUNNER_TEMP/h06_p2_bundle"             --result "$RUNNER_TEMP/h06_p2_bundle/evidence.json"

      - name: Verify final bundle identity
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"h06_p2_bundle"
          manifest=json.loads((root/"input_bundle_manifest.json").read_text())
          result=json.loads((root/"evidence.json").read_text())
          assert result["status"]=="INPUT_BUNDLE_FROZEN"
          assert result["performance_evaluation"] is False
          assert result["holdout_evaluation"] is False
          assert result["performance_authorized"] is False
          assert result["bundle_fingerprint"]==manifest["bundle_fingerprint"]
          assert len(result["datasets"])==15
          assert all(int(x["row_count"])==3500 for x in result["datasets"])
          print("H06-P2 ADJUSTED-CLOSE INPUT FREEZE VERIFIED")
          print("bundle_fingerprint="+result["bundle_fingerprint"])
          PY

      - name: Publish verified bundle to master
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/h06_p2_input_freeze_result.json="$RUNNER_TEMP/h06_p2_bundle/evidence.json"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/input_bundle_manifest.json="$RUNNER_TEMP/h06_p2_bundle/input_bundle_manifest.json"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/TXN/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/TXN/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/ADI/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/ADI/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/AMAT/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/AMAT/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/MDT/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/MDT/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/SYK/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/SYK/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/BDX/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/BDX/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/ETN/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/ETN/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/ITW/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/ITW/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/GD/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/GD/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/CL/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/CL/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/KMB/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/KMB/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/GIS/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/GIS/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/AEP/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/AEP/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/XEL/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/XEL/adjusted_close.csv"             --file research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/DTE/adjusted_close.csv="$RUNNER_TEMP/h06_p2_bundle/DTE/adjusted_close.csv"

      - name: Upload freeze evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h06-p2-input-freeze-artifact
          path: |
            research/evidence/h06_p2_input_freeze_result.json
            research/runs/h06_p2_input_bundle/T-2026-10-01-H06P2-INPUT-FREEZE/**
          if-no-files-found: warn
          retention-days: 30
