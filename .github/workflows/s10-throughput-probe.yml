name: S10 Throughput Probe (manual diagnostics)

on:
  push:
    branches: [master]
    paths:
      - "automation/s10_throughput_probe.py"
      - ".github/workflows/s10-throughput-probe.yml"
      - "tests/test_s10_throughput_probe.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trading-agent-s10-throughput
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: [self-hosted, s10-phone, linux, ARM64]
    timeout-minutes: 25
    env:
      S10_SEED: "271828"
    steps:
      - name: Download exact master snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s10-throughput-source"
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2             -o "$RUNNER_TEMP/s10-throughput-source/repo.tar.gz"             "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/s10-throughput-source/repo.tar.gz" -C "$RUNNER_TEMP/s10-throughput-source"
          echo "REPO_SRC=$(find "$RUNNER_TEMP/s10-throughput-source" -maxdepth 1 -type d -name 'trading-agent-public-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Recover canonical S10 stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          python3 -m automation.s10_local_stack             --repo-root "$REPO_SRC"             --descriptor "$HOME/.trading-agent/s10_interface.json"             --work-root "$HOME/.cache/trading-agent/s10/runs"

      - name: Verify canonical endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 5 http://127.0.0.1:8765/health >/dev/null

      - name: Run isolated throughput probe
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/s10_throughput/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          python3 -m automation.s10_throughput_probe --output "$OUT/throughput.json"
          cat "$OUT/throughput.json"

      - name: Upload throughput receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: s10-throughput-${{ github.run_id }}
          path: research/runs/s10_throughput/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
