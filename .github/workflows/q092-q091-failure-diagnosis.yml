name: Q092 Q091 Failure Mechanism Diagnosis

on:
  push:
    branches:
      - master
    paths:
      - "research/preregistrations/q092_q091_failure_mechanism_diagnosis_2026_09_29.json"
      - "automation/q092_q091_failure_diagnosis.py"
      - "tests/test_q092_q091_failure_diagnosis.py"
      - ".github/workflows/q092-q091-failure-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q092-q091-failure-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars

      - name: Safety and governance guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q092_q091_failure_mechanism_diagnosis_2026_09_29.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert p["trial_id"] == "T-2026-09-29-092"
          assert p["status"] == "PREREGISTERED_DIAGNOSTIC_ONLY"
          assert p["parent_trial_id"] == "T-2026-09-29-091"
          assert p["governance"]["diagnostic_evaluation"] is True
          assert p["governance"]["new_performance_evaluation"] is False
          assert p["governance"]["selection"] is False
          assert p["governance"]["holdout_used_for_selection"] is False
          assert p["governance"]["family_ranking"] is False
          print("Q092 SAFETY/GOVERNANCE OK")
          PY

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q092_q091_failure_diagnosis.py tests/test_q092_post_performance_diagnosis.py

      - name: Verify immutable Q091 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum automation/q069_candidate_bank.py | cut -d" " -f1)" = "84e008a6152cbea128e5e5f2ac0dfdde0b0172310fe4c510241c60edfd3ff617"
          test "$(sha256sum portfolio/q091_fixed_ensemble.py | cut -d" " -f1)" = "4f53c46844d56ddc2469fbeaa539dc054e11af777f25b4c318c456b792251de0"
          test "$(python - <<'PY'
          import json,hashlib
          d=json.load(open("research/evidence/q091_performance_result.json",encoding="utf-8"))
          print(d["report_fingerprint"])
          PY
          )" = "0816e49774ff901438e046e162e428884f3f67b305cf26e0ebff2451ce38195d"
          test "$(python - <<'PY'
          import json
          d=json.load(open("research/runs/q091_coverage/T-2026-09-29-091-COVERAGE/snapshot_manifest.json",encoding="utf-8"))
          print(d["snapshot_fingerprint"])
          PY
          )" = "4f89d5fa954139b0b88d916ce307b1b1a93b61b020dc8b1b4b4296d70df2f4e2"
          echo "Q092 SOURCE CONTRACT OK"

      - name: Execute deterministic Q092 diagnosis
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m automation.q092_q091_failure_diagnosis             --repo-root .             --output research/evidence/q092_q091_failure_diagnosis_result.json             --markdown research/runs/q092_q091_failure_diagnosis/T-2026-09-29-092/q092_report.md

      - name: Validate Q092 result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q092_q091_failure_diagnosis_result.json").read_text())
          assert d["status"] == "COMPLETED_DIAGNOSTIC_ONLY"
          assert d["parent_trial_id"] == "T-2026-09-29-091"
          assert d["reconstruction"]["aggregate_reconstruction_exact"] is True
          assert d["reconstruction"]["no_new_market_data"] is True
          assert d["reconstruction"]["no_new_performance_trial"] is True
          assert d["governance"]["new_performance_evaluation"] is False
          assert d["governance"]["selection"] is False
          assert d["governance"]["holdout_used_for_selection"] is False
          assert d["governance"]["family_ranking"] is False
          assert d["safety"]["paper_only"] is True
          print("Q092 VALIDATION PASS")
          print("Q092_DIAGNOSTIC_FINGERPRINT:", d["diagnostic_fingerprint"])
          PY

      - name: Append Q092 to diagnostic ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          ledger_path=Path("research/evidence/trial_ledger.json")
          data=json.loads(ledger_path.read_text())
          key="entries" if "entries" in data else "trials"
          entries=data.get(key,[])
          if any(x.get("trial_id")=="T-2026-09-29-092" for x in entries):
              raise SystemExit("Q092 ledger entry already exists")
          d=json.loads(Path("research/evidence/q092_q091_failure_diagnosis_result.json").read_text())
          entries.append({
            "trial_id":"T-2026-09-29-092",
            "recorded_at":datetime.now(timezone.utc).isoformat(),
            "status":"diagnostic_completed_only",
            "research_family":"q092_q091_failure_mechanism_diagnosis",
            "parent_trial_id":"T-2026-09-29-091",
            "parent_report_fingerprint":d["source"]["parent_report_fingerprint"],
            "diagnostic_fingerprint":d["diagnostic_fingerprint"],
            "reconstruction_exact":True,
            "no_new_market_data":True,
            "selection":{"selected":False,"holdout_used_for_selection":False},
            "governance":d["governance"],
            "safety":d["safety"]
          })
          data[key]=entries
          ledger_path.write_text(json.dumps(data,ensure_ascii=False,indent=2,allow_nan=False)+"
",encoding="utf-8")
          PY

      - name: Publish canonical Q092 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q092_q091_failure_diagnosis_result.json=research/evidence/q092_q091_failure_diagnosis_result.json             --file research/runs/q092_q091_failure_diagnosis/T-2026-09-29-092/q092_report.md=research/runs/q092_q091_failure_diagnosis/T-2026-09-29-092/q092_report.md             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json

      - name: Upload Q092 diagnostic pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q092-q091-failure-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q092_q091_failure_diagnosis_result.json
            research/runs/q092_q091_failure_diagnosis/T-2026-09-29-092/q092_report.md
          if-no-files-found: warn
          retention-days: 30
