name: Strategy Architecture Control

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/strategy_architecture_control.py"
      - "tests/test_strategy_architecture_control.py"
      - ".github/workflows/strategy-architecture-control.yml"
      - "backtesting/**"
      - "strategies/**"
      - "config/parameter_space.py"
      - "config/parameters.py"
      - "config/settings.py"
      - "data/csv_loader.py"
      - "research/protocol.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-strategy-architecture-control
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "35766606233"
  SOURCE_ARTIFACT_NAME: "rolling-geometry-archive-replay-exact"

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Immutable Rolling-Control-Artifact laden
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source_artifact
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Source-Artifact und Datenidentität prüfen
        run: |
          set -euo pipefail
          test -f source_artifact/research/rolling_geometry_control/data_manifest.json
          test -f source_artifact/research/rolling_geometry_control/rolling_geometry_control.json
          test -d source_artifact/data/market_data
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("source_artifact/research/rolling_geometry_control")
          manifest = json.loads((root / "data_manifest.json").read_text(encoding="utf-8"))
          rolling = json.loads((root / "rolling_geometry_control.json").read_text(encoding="utf-8"))

          print("SOURCE_RUN_ID:", manifest.get("provenance", {}).get("run_id"))
          print("SOURCE_COMMIT_SHA:", manifest.get("provenance", {}).get("commit_sha"))
          print("MANIFEST_FINGERPRINT:", manifest.get("manifest_fingerprint"))
          print("ROLLING_TARGET_COUNT:", rolling.get("target_count"))
          print("ROLLING_RESEARCH_COUNT:", rolling.get("research_candle_count"))
          PY

      - name: Strategie-Architektur-Ablation ausführen
        run: |
          set -euo pipefail
          python -m automation.strategy_architecture_control             --data-dir source_artifact/data/market_data             --manifest source_artifact/research/rolling_geometry_control/data_manifest.json             --output research/strategy_architecture_control/report.json

      - name: Ergebnis-Fingerprint prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/strategy_architecture_control/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          stored = report.pop("report_fingerprint")

          canonical = json.dumps(
              report,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
              allow_nan=False,
          ).encode("utf-8")
          actual = hashlib.sha256(canonical).hexdigest()

          assert stored == actual
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Diagnose-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-architecture-control-${{ github.run_id }}
          path: research/strategy_architecture_control/
          if-no-files-found: error
          retention-days: 30
