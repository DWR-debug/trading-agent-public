name: Q182 FERC Self-Hosted Access Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "automation/q182_ferc_self_hosted_access_probe.py"
      - "tests/test_q182_ferc_self_hosted_access_probe.py"
      - ".github/workflows/q182-ferc-self-hosted-access-probe.yml"
  push:
    branches: [master]
    paths:
      - "automation/q182_ferc_self_hosted_access_probe.py"
      - ".github/workflows/q182-ferc-self-hosted-access-probe.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q182-ferc-self-hosted-access-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == "DWR-debug/trading-agent-public"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [local_reproduction, data_qa]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Run FERC access probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "research/runs/q182_ferc_access_probe/${{ matrix.lane }}-${{ github.run_id }}.json"
          New-Item -ItemType Directory -Force (Split-Path $output) | Out-Null
          python -m automation.q182_ferc_self_hosted_access_probe --output $output
      - name: Validate bounded receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "research/runs/q182_ferc_access_probe/${{ matrix.lane }}-${{ github.run_id }}.json"
          $d = Get-Content $output -Raw | ConvertFrom-Json
          if ($d.status -ne "Q182_ACCESS_PROBE_COMPLETED_NO_SCIENTIFIC_EVIDENCE") { throw "bad status" }
          foreach ($p in $d.probes) {
            if ($p.classification -notin @("PASS","RUNNER_ACCESS_BLOCKED","REACHABLE_MARKER_MISMATCH","UNREACHABLE")) { throw "bad classification" }
          }
          foreach ($v in $d.scientific_boundary.PSObject.Properties) { if ($v.Value -ne $false) { throw "scientific boundary widened" } }
          if ($d.safety.PAPER_ONLY -ne $true -or $d.safety.LIVE_TRADING_ENABLED -ne $false -or $d.safety.ORDERS_ENABLED -ne $false -or $d.safety.AUTOMATIC_PROMOTION -ne $false) { throw "safety invariant failed" }
          Write-Host "Q182_ACCESS_PROBE_OK lane=${{ matrix.lane }}"
      - name: Upload bounded receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q182-ferc-access-probe-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q182_ferc_access_probe/
          if-no-files-found: error
          retention-days: 14