name: CS Dispersion Budget Sixth Validation 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ci-disabled]
    paths:
      - "automation/cs_dispersion_budget_sixth_validation_2026_09_24.py"
      - "tests/test_cs_dispersion_budget_sixth_validation_2026_09_24.py"
      - "research/asset_universes.py"
      - "docs/cs_dispersion_budget_sixth_validation_2026_09_24_preregistration.md"
      - ".github/workflows/cs-dispersion-budget-sixth-validation-2026-09-24.yml"
      - "automation/prepare_research_data.py"
      - "automation/candidate_validation_50_50_vol_budget.py"
      - "data/**"
      - "research/**"
      - "validation/**"
      - "config/**"
  push:
    branches:
      - research/cs-dispersion-budget-sixth-validation-2026-09-24
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-cs-dispersion-budget-sixth-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Sechste Trend-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data \
            --target-count 3500 \
            --universe validation_2026_09_24_sixth_trend \
            --output research/cs_dispersion_budget_sixth_validation_2026_09_24/data_trend_manifest.json
      - name: Sechste CS-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data \
            --target-count 3500 \
            --universe validation_2026_09_24_sixth_cs \
            --output research/cs_dispersion_budget_sixth_validation_2026_09_24/data_cs_manifest.json
      - name: Vollständige Symbol-Disjunktheit fail-closed prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.asset_universes import get_universe, list_universes

          names = (
              "validation_2026_09_24_sixth_trend",
              "validation_2026_09_24_sixth_cs",
          )
          sets = [set(get_universe(name).symbols) for name in names]
          assert sets[0].isdisjoint(sets[1])
          combined = sets[0] | sets[1]
          for universe in list_universes():
              if universe.name in names:
                  continue
              assert combined.isdisjoint(universe.symbols), f'Overlap with {universe.name}'
          for path, name in (
              ("research/cs_dispersion_budget_sixth_validation_2026_09_24/data_trend_manifest.json", names[0]),
              ("research/cs_dispersion_budget_sixth_validation_2026_09_24/data_cs_manifest.json", names[1]),
          ):
              manifest = json.loads(Path(path).read_text(encoding='utf-8'))
              assert manifest['target_count'] == 3500
              assert tuple(item['symbol'] for item in manifest['datasets']) == get_universe(name).symbols
          print("SIXTH_VALIDATION_FULLY_DISJOINT_OK")
          PY
      - name: Präregistrierung fail-closed prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.cs_dispersion_budget_sixth_validation_2026_09_24 import (
              CS_DISPERSION_LOOKBACK, CS_REBALANCE, CS_SKIP, CS_TOP_N,
              DISPERSION_REFERENCE_WINDOW, HOLDOUT_COUNT, RESEARCH_COUNT, TARGET_COUNT,
          )
          assert (TARGET_COUNT, RESEARCH_COUNT, HOLDOUT_COUNT) == (3500, 2798, 700)
          assert (CS_DISPERSION_LOOKBACK, CS_REBALANCE, CS_SKIP, CS_TOP_N) == (21, 21, 21, 2)
          assert DISPERSION_REFERENCE_WINDOW == 63
          text = Path('docs/cs_dispersion_budget_sixth_validation_2026_09_24_preregistration.md').read_text(encoding='utf-8')
          for token in ('CS-Dispersion-Risikobudget','63','21-Session','2798','700','Holdout','T-2026-09-24-010','PAPER_ONLY=True'):
              assert token in text
          print("PREREGISTRATION_VERIFIED")
          PY
      - name: Sechste Validierung ausführen
        run: |
          set -euo pipefail
          python -m automation.cs_dispersion_budget_sixth_validation_2026_09_24 \
            --trend-data-dir data/market_data \
            --trend-manifest research/cs_dispersion_budget_sixth_validation_2026_09_24/data_trend_manifest.json \
            --cs-data-dir data/market_data \
            --cs-manifest research/cs_dispersion_budget_sixth_validation_2026_09_24/data_cs_manifest.json \
            --output research/cs_dispersion_budget_sixth_validation_2026_09_24/report.json
      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('research/cs_dispersion_budget_sixth_validation_2026_09_24/report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          stored = report.pop('report_fingerprint')
          actual = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':'), ensure_ascii=True, allow_nan=False).encode('utf-8')).hexdigest()
          assert stored == actual
          assert report['source']['portfolio_return_count'] == 3498
          assert report['source']['fully_symbol_disjoint_validation_set'] is True
          assert report['methodology']['parameter_search'] is False
          assert report['methodology']['threshold_search'] is False
          assert report['methodology']['variant_search'] is False
          assert report['methodology']['holdout_used_for_selection'] is False
          assert report['safety'] == {'paper_only': True, 'live_trading_enabled': False, 'orders_enabled': False}
          print("CS_DISPERSION_BUDGET_RESULT_INTEGRITY_OK")
          print('RESEARCH_HYPOTHESIS_STATUS:', report['research_hypothesis_status'])
          print('HOLDOUT_CONFIRMATION_STATUS:', report['holdout_confirmation_status'])
          print('RESEARCH_VALIDATION_STATUS:', report['research_validation_status'])
          print('REPORT_FINGERPRINT:', stored)
          print('DISPERSION_DIAGNOSTICS:', report['dispersion_diagnostics'])
          PY
      - name: Validierungsartefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-dispersion-budget-sixth-validation-2026-09-24-${{ github.run_id }}
          path: research/cs_dispersion_budget_sixth_validation_2026_09_24/
          if-no-files-found: error
          retention-days: 30
