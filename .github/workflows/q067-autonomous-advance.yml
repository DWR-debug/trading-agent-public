name: Q067 Autonomous Advance to Performance

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q067_coverage_result.json"
      - "research/evidence/q067_pit_result.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-q067-auto-advance
  cancel-in-progress: false

jobs:
  advance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Verify preflight and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q067_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q067_pit_result.json").read_text())
          assert c["trial_id"]=="T-2026-09-28-067-COVERAGE"
          assert c["status"]=="COVERAGE_PASSED"
          assert c["performance_trial_authorized"] is False
          assert c["selection_used"] is False
          assert p["trial_id"]=="T-2026-09-28-067-PIT"
          assert p["status"]=="PIT_PASSED"
          assert p["performance_trial_authorized"] is False
          assert p["selection_used"] is False
          for payload in (c,p):
              assert payload["safety"] == {
                  "paper_only": True,
                  "live_trading_enabled": False,
                  "orders_enabled": False,
                  "automatic_promotion": False,
              }
          print("Q067 PREFLIGHT PASS")
          PY
      - name: Create one-shot performance authorization
        run: |
          set -euo pipefail
          test ! -e research/authorizations/q067_performance_2026_09_28.json
          cat > research/authorizations/q067_performance_2026_09_28.json <<'JSON'
          {
            "schema_version": "1.0",
            "authorization_id": "Q067-PERFORMANCE-AUTO-ONE-SHOT-2026-09-28",
            "authorized": true,
            "authorization_basis": "Both immutable Q067 coverage and PIT receipts passed their fail-closed prerequisites.",
            "execution_scope": "Q067_FIXED_RULE_PERFORMANCE_ONLY",
            "performance_execution_authorized": true,
            "required_prerequisites": [
              "T-2026-09-28-067-COVERAGE status=COVERAGE_PASSED",
              "T-2026-09-28-067-PIT status=PIT_PASSED"
            ],
            "prohibited": [
              "parameter selection",
              "threshold selection",
              "asset selection",
              "family ranking",
              "holdout selection",
              "promotion",
              "live execution"
            ],
            "safety": {
              "PAPER_ONLY": true,
              "LIVE_TRADING_ENABLED": false,
              "ORDERS_ENABLED": false,
              "AUTOMATIC_PROMOTION": false
            }
          }
          JSON
          git diff --check
          git add research/authorizations/q067_performance_2026_09_28.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "OPS: authorize Q067 performance after preflight pass"
          git push origin HEAD:master
