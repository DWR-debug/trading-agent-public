name: Q067 Autonomous Evidence Reconciliation

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q067_performance_result.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-q067-evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Reconcile immutable trial ledger
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          result_path=Path("research/evidence/q067_performance_result.json")
          ledger_path=Path("research/evidence/trial_ledger.json")
          result=json.loads(result_path.read_text(encoding="utf-8"))
          ledger=json.loads(ledger_path.read_text(encoding="utf-8"))

          expected="T-2026-09-28-067-PERFORMANCE"
          assert result["trial_id"]==expected
          assert result["status"]=="COMPLETED"
          assert result["performance_evaluation"] is True
          assert result["selection_used"] is False
          assert result["holdout_used_for_selection"] is False
          assert result["governance"]["promotion_decision"] is False
          assert result["governance"]["automatic_promotion"] is False
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }

          trials=ledger.get("trials")
          assert isinstance(trials,list)
          existing=[t for t in trials if t.get("trial_id")==expected]
          assert not existing, "Q067 performance trial already exists; refusing duplicate ledger mutation"

          passed={name:arm["all_gates_passed"] for name,arm in result["arms"].items()}
          any_passed=any(passed.values())
          trial_status=(
              "performance_completed_arm_passed_all_gates"
              if any_passed
              else "performance_completed_no_arm_passed_all_gates"
          )

          entry={
            "trial_id": expected,
            "recorded_at": datetime.now(timezone.utc).isoformat(),
            "status": trial_status,
            "research_family": result["universe"],
            "hypothesis": {
              "text": "Evaluate the frozen Q067 alpha common-mode throttle and turnover hysteresis mechanisms against the unchanged six-sleeve ensemble under the fixed 13-gate contract."
            },
            "data_scope": {
              "research_count": result["research_periods"],
              "holdout_count": result["holdout_periods"],
              "holdout_used_for_selection": False,
              "symbols": result["symbols"],
              "requested_candles": result["requested_candles"],
              "target_common_candles": result["target_common_candles"],
              "coverage_prerequisite": result["coverage_prerequisite"],
              "pit_prerequisite": result["pit_prerequisite"]
            },
            "search_scope": {
              "raw_trial_count": len(result["arms"]),
              "independent_trial_count": 1,
              "parameter_search": False,
              "threshold_search": False,
              "variant_search": False,
              "asset_search": False,
              "horizon_search": False,
              "family_ranking": False
            },
            "selection": {
              "selected": False,
              "selection_method": "none; all preregistered Q067 arms evaluated symmetrically",
              "selection_metric": None,
              "holdout_used_for_selection": False
            },
            "statistical_evidence": {
              "psr_probability": None,
              "dsr_probability": None,
              "pbo_probability": None,
              "trial_sharpes": None,
              "independent_trial_count": 1,
              "ready": False
            },
            "outcome": {
              "validation_status": trial_status,
              "scientific_outcome": trial_status,
              "performance_result_fingerprint": result["report_fingerprint"],
              "arms": result["arms"],
              "performance_evaluation": True,
              "oos_evaluation": True,
              "holdout_evaluation": True,
              "holdout_selection_used": False,
              "promotion": False
            },
            "safety": result["safety"]
          }
          trials.append(entry)
          ledger["generated_at"]=datetime.now(timezone.utc).isoformat()
          ledger_path.write_text(json.dumps(ledger,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          print("Q067 LEDGER RECONCILED:", trial_status)
          PY
          git diff --check
          git add research/evidence/trial_ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EVIDENCE: reconcile Q067 performance trial ledger entry"
          git push origin HEAD:master
