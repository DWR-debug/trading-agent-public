name: Continuous QA (trusted self-hosted Windows)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/self_hosted_continuous_qa.trigger"
      - ".github/workflows/self-hosted-continuous-qa.yml"
      - "automation/self_hosted_research_worker.py"
      - "tests/**"
      - "automation/**"
      - "data/**"
      - "research/**"
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-self-hosted-continuous-qa
  cancel-in-progress: false

jobs:
  qa_lane:
    name: QA lane (${{ matrix.lane }})
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [repo_qa, data_qa, design_qa, local_reproduction]

    steps:
      - name: Run exact snapshot lane
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          if not defined GITHUB_SHA exit /b 1
          if not defined GITHUB_RUN_ID exit /b 1
          if not defined GITHUB_RUN_ATTEMPT exit /b 1
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1

          set "RUN_KEY=%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "LANE=${{ matrix.lane }}"
          set "WORK=%RUNNER_TEMP%\trading-agent-continuous-%RUN_KEY%-%LANE%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-continuous-%RUN_KEY%-%LANE%.tar.gz"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-%RUN_KEY%-%LANE%"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-%RUN_KEY%-%LANE%.nupkg"
          set "SITE=%RUNNER_TEMP%\python-site-continuous-%RUN_KEY%-%LANE%"
          set "PROV_ROOT=%GITHUB_WORKSPACE%\research\runs\self_hosted"
          set "OUT=%PROV_ROOT%\continuous_%LANE%_%RUN_KEY%"

          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1

          echo [1/8] Downloading exact master snapshot
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%"
          if errorlevel 1 exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          cd /d "%REPO_SRC%" || exit /b 1

          echo [2/8] Bootstrapping pinned Python 3.13.15
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip --version || exit /b 1

          echo [3/8] Installing minimal QA dependencies
          if exist "%SITE%" rmdir /s /q "%SITE%"
          mkdir "%SITE%" || exit /b 1
          "%PY_EXE%" -m pip install --disable-pip-version-check --target "%SITE%" pytest pandas exchange-calendars statsmodels==0.15.0 pypdf || exit /b 1
          set "PYTHONPATH=%SITE%;%REPO_SRC%"

          echo [4/8] Runner capacity telemetry
          powershell.exe -NoProfile -NonInteractive -Command "$cs = Get-CimInstance Win32_ComputerSystem; $os = Get-CimInstance Win32_OperatingSystem; $payload = [ordered]@{schema_version=1; lane=$env:LANE; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; source_commit=$env:GITHUB_SHA; runner_name=$env:RUNNER_NAME; runner_os=$env:RUNNER_OS; runner_arch=$env:RUNNER_ARCH; logical_processors=[int]$env:NUMBER_OF_PROCESSORS; physical_memory_bytes=$cs.TotalPhysicalMemory; os_caption=$os.Caption}; New-Item -ItemType Directory -Force -Path '%PROV_ROOT%' | Out-Null; $payload | ConvertTo-Json | Set-Content -Encoding UTF8 '%PROV_ROOT%\runner_capacity_%LANE%_%RUN_KEY%.json'" || exit /b 1

          echo [5/8] Safety invariants
          "%PY_EXE%" -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')" || exit /b 1

          echo [6/8] Run bounded lane %LANE%
          "%PY_EXE%" -m automation.self_hosted_research_worker --lane "%LANE%" --output-dir "%OUT%"
          set "FAIL=%ERRORLEVEL%"

          echo [7/8] Validate lane provenance
          if not exist "%PROV_ROOT%\runner_capacity_%LANE%_%RUN_KEY%.json" exit /b 1
          if not exist "%OUT%\summary.json" exit /b 1
          if not exist "%OUT%\run_manifest.json" exit /b 1
          "%PY_EXE%" -c "import json; from pathlib import Path; s=json.loads(Path(r'%OUT%\summary.json').read_text(encoding='utf-8')); m=json.loads(Path(r'%OUT%\run_manifest.json').read_text(encoding='utf-8')); c=json.loads(Path(r'%PROV_ROOT%\runner_capacity_%LANE%_%RUN_KEY%.json').read_text(encoding='utf-8-sig')); assert s['lane']==r'%LANE%'; assert s['formal_evidence_allowed'] is False; assert m['lane']==r'%LANE%'; assert m['source_commit']==r'%GITHUB_SHA%'; assert m['paper_only'] is True; assert m['live_trading_enabled'] is False; assert m['orders_enabled'] is False; assert m['automatic_promotion'] is False; assert m['formal_research_evidence'] is False; assert c['lane']==r'%LANE%'; assert str(c['run_id'])==r'%GITHUB_RUN_ID%'; assert str(c['run_attempt'])==r'%GITHUB_RUN_ATTEMPT%'; assert c['source_commit']==r'%GITHUB_SHA%'; assert c['runner_name']==r'%RUNNER_NAME%'; assert c['runner_os']==r'%RUNNER_OS%'; assert c['runner_arch']==r'%RUNNER_ARCH%'; assert int(c['logical_processors'])>0; assert int(c['physical_memory_bytes'])>0" || exit /b 1
          echo RUNNER_CAPACITY_AND_PROVENANCE_OK lane=%LANE%

          echo [8/8] Lane result
          echo RUN_ID=%GITHUB_RUN_ID%
          echo SHA=%GITHUB_SHA%
          echo LANE=%LANE%
          if "%FAIL%"=="0" (
            echo CONTINUOUS_QA_LANE=SUCCESS
            endlocal
            exit /b 0
          )
          echo CONTINUOUS_QA_LANE=FAILURE
          endlocal
          exit /b %FAIL%

      - name: Publish lane provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-hosted-continuous-qa-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/self_hosted/continuous_${{ matrix.lane }}_${{ github.run_id }}-${{ github.run_attempt }}/
            research/runs/self_hosted/runner_capacity_${{ matrix.lane }}_${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate QA gate
    if: always()
    needs: qa_lane
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 10
    steps:
      - name: Require all four lanes
        env:
          MATRIX_RESULT: ${{ needs.qa_lane.result }}
        shell: cmd
        run: |
          @echo off
          if /I not "%MATRIX_RESULT%"=="success" exit /b 1
          echo AGGREGATE_QA=SUCCESS