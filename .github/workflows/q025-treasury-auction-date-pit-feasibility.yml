name: Q025 Treasury Auction Date PIT Feasibility

on:
  pull_request:
    branches: [master]
    paths:
      - "automation/q025_treasury_auction_date_pit_feasibility.py"
      - "tests/test_q025_treasury_auction_date_pit_feasibility.py"
      - "research/preregistrations/q025_treasury_auction_date_pit_feasibility_2026_09_27.json"
      - ".github/workflows/q025-treasury-auction-date-pit-feasibility.yml"
  push:
    branches:
      - research/q025-auction-date-pit-feasibility-2026-09-27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q025-auction-date-pit
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_q025_treasury_auction_date_pit_feasibility.py
      - name: Q025 date-level PIT feasibility
        run: |
          set -euo pipefail
          python -m automation.q025_treasury_auction_date_pit_feasibility             --output research/runs/source_feasibility/q025_treasury_auction_date_pit_feasibility.json
      - name: Governance and safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/source_feasibility/q025_treasury_auction_date_pit_feasibility.json").read_text())
          assert d["governance"]["source_feasibility_only"] is True
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["pnl_evaluation"] is False
          assert d["governance"]["holdout_used"] is False
          assert d["governance"]["research_gate_changes"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          assert d["status"] == "DATE_PIT_VALIDATED"
          print(json.dumps({
            "status":d["status"],
            "events":d["population"]["events"],
            "min_lag_days":d["date_validation"]["minimum_lag_days"],
            "max_lag_days":d["date_validation"]["maximum_lag_days"],
            "fingerprint":d["fingerprint"]
          }, sort_keys=True))
          PY
      - name: Evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: q025-auction-date-pit-${{ github.run_id }}
          path: research/runs/source_feasibility/q025_treasury_auction_date_pit_feasibility.json
          if-no-files-found: error
          retention-days: 30
