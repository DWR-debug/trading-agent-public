name: Risk Layer Timing Concentration — 2026-09-23 — Public

on:
  push:
    branches: [master]
    paths:
      - "automation/risk_layer_timing_concentration_2026_09_23.py"
      - "tests/test_risk_layer_timing_concentration_2026_09_23.py"
      - ".github/workflows/risk-layer-timing-concentration-2026-09-23.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/risk_layer_timing_concentration_2026_09_23.py"
      - "tests/test_risk_layer_timing_concentration_2026_09_23.py"
      - ".github/workflows/risk-layer-timing-concentration-2026-09-23.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Zweites Artifact laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/10740188093/zip" --output second.zip
          actual=$(sha256sum second.zip | awk '{print $1}')
          test "${actual}" = "eed3ec6105dec7bc8616ab989ce6f086107b249f7fa087f6e851709af6e47354"
          mkdir -p artifact_root
          unzip -q second.zip -d artifact_root
      - name: Drittes Artifact laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/10745697729/zip" --output third.zip
          actual=$(sha256sum third.zip | awk '{print $1}')
          test "${actual}" = "b6a408b41abb218d285e06af4b91f66da3ed4ce431aef72907ca5873ffa2c731"
          unzip -q third.zip -d artifact_root
      - name: Timing-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.risk_layer_timing_concentration_2026_09_23             --artifact-root artifact_root             --output research/risk_layer_timing_concentration_2026_09_23.json
      - name: Integrity und Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("research/risk_layer_timing_concentration_2026_09_23.json")
          result=json.loads(p.read_text(encoding="utf-8"))
          stored=result.pop("diagnostic_fingerprint")
          actual=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert stored==actual
          assert result["status"]=="COMPLETED"
          assert result["methodology"]["vol_window_sessions"]==63
          assert result["methodology"]["no_parameter_search"] is True
          assert result["safety"]["paper_only"] is True
          assert result["safety"]["live_trading_enabled"] is False
          assert result["safety"]["orders_enabled"] is False
          assert set(result["cases"])=={"second_validation","third_validation"}
          print("RISK_LAYER_TIMING_CONCENTRATION_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: risk-layer-timing-concentration-2026-09-23-${{ github.run_id }}
          path: research/risk_layer_timing_concentration_2026_09_23.json
          if-no-files-found: error
          retention-days: 30
