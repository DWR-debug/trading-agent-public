name: Q077-R1 Fresh E1 E2 Coverage Repair

on:
  push:
    branches: [master]
    paths:
      - "automation/fixed_window_candidate_discovery.py"
      - "research/preregistrations/q077r1_discovery_2026_09_28.json"
      - "research/run_requests/q077r1_discovery.trigger"
      - ".github/workflows/q077r1-fresh-e1-e2-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q077r1-fresh-e1-e2-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify repair preregistration and safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q077r1_discovery_2026_09_28.json").read_text())
          assert p["status"]=="PREREGISTERED_COVERAGE_ONLY"
          assert p["performance_evaluation"] is False
          assert p["holdout_selection"] is False
          assert p["parameter_search"] is False
          assert p["asset_search"] is False
          assert len(p["candidate_pool"]) >= 32
          assert len(p["candidate_pool"]) == len(set(p["candidate_pool"]))
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q077R1 PREREG/SAFETY OK")
          PY

      - name: Coverage-only discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from automation.fixed_window_candidate_discovery import run_discovery
          p=json.loads(Path("research/preregistrations/q077r1_discovery_2026_09_28.json").read_text())
          d=run_discovery(output="research/runs/q077r1_discovery/discovery.json", symbol_limit=len(p["candidate_pool"]), workers=16, candidate_pool=tuple(p["candidate_pool"]))
          print("Q077R1_SELECTED:",d["selected_coverage_batch"])
          print("Q077R1_COMMON:",d["selected_common_count"])
          print("Q077R1_FINGERPRINT:",d["fingerprint"])
          if not d["selected_coverage_batch"] or d["selected_common_count"] < 3500: raise SystemExit("Q077R1_NO_VALID_COVERAGE_BATCH")
          PY

      - name: Validate coverage-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q077r1_discovery/discovery.json").read_text())
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["asset_selection_by_performance"] is False
          assert d["selected_common_count"] >= 3500
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("Q077R1 COVERAGE CONTRACT OK")
          PY

      - name: Upload repair discovery
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q077r1-discovery-${{ github.run_id }}
          path: research/runs/q077r1_discovery/discovery.json
          if-no-files-found: error
          retention-days: 30
