name: Self-hosted Research Worker

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Bounded worker lane"
        required: true
        type: choice
        options:
          - repo_qa
          - data_qa
          - local_reproduction
      ref:
        description: "Trusted branch/ref to execute"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

concurrency:
  group: trading-agent-self-hosted-research-worker
  cancel-in-progress: false

jobs:
  worker:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 120
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Detect existing Python
        id: python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $py = Get-Command py -ErrorAction SilentlyContinue
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($py) {
            & py -3 --version
            "PYTHON_CMD=py -3" >> $env:GITHUB_ENV
          } elseif ($python) {
            & python --version
            "PYTHON_CMD=python" >> $env:GITHUB_ENV
          } else {
            throw "No usable Python launcher is available on the self-hosted Windows runner."
          }

      - name: Install minimal research dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmd = [scriptblock]::Create("& $env:PYTHON_CMD -m pip install --user --upgrade pip")
          & $cmd
          $cmd = [scriptblock]::Create("& $env:PYTHON_CMD -m pip install --user pytest pandas exchange-calendars")
          & $cmd

      - name: Safety and provenance guard
        shell: powershell
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          if (($env:REQUESTED_REF -ne "master") -and ($env:REQUESTED_REF -notlike "research/*")) {
            throw "Untrusted ref requested: $env:REQUESTED_REF"
          }
          $cmd = [scriptblock]::Create("& $env:PYTHON_CMD -c ""from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; print('SAFETY INVARIANTS OK')""")
          & $cmd

      - name: Execute bounded worker lane
        shell: powershell
        env:
          LANE: ${{ inputs.lane }}
        run: |
          $ErrorActionPreference = "Stop"
          $output = "research/runs/self_hosted/$env:GITHUB_RUN_ID"
          $cmd = [scriptblock]::Create("& $env:PYTHON_CMD -m automation.self_hosted_research_worker --lane $env:LANE --output-dir $output")
          & $cmd

      - name: Publish worker evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-hosted-research-${{ inputs.lane }}-${{ github.run_id }}
          path: research/runs/self_hosted/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
