name: Self-hosted Research Worker

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Bounded worker lane"
        required: true
        type: choice
        options:
          - repo_qa
          - data_qa
          - local_reproduction
      ref:
        description: "Trusted branch/ref to execute"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

concurrency:
  group: trading-agent-self-hosted-research-worker
  cancel-in-progress: false

jobs:
  worker:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 120
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Detect existing Python
        id: python
        shell: cmd
        run: |
          @echo off
          set "PYTHON_CMD=py -3"
          py -3 --version >nul 2>&1
          if errorlevel 1 (
            set "PYTHON_CMD=python"
            python --version
          ) else (
            py -3 --version
          )
          echo PYTHON_CMD=%PYTHON_CMD%>>"%GITHUB_ENV%"

      - name: Install minimal research dependencies
        shell: cmd
        run: |
          @echo off
          set "PIP_CMD=%PYTHON_CMD% -m pip"
          %PIP_CMD% install --user --upgrade pip
          %PIP_CMD% install --user pytest pandas exchange-calendars

      - name: Safety and provenance guard
        shell: cmd
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          @echo off
          if /I not "%REQUESTED_REF%"=="master" if /I not "%REQUESTED_REF:~0,9%"=="research/" exit /b 1
          %PYTHON_CMD% -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; print('SAFETY INVARIANTS OK')"

      - name: Execute bounded worker lane
        shell: cmd
        env:
          LANE: ${{ inputs.lane }}
        run: |
          @echo off
          %PYTHON_CMD% -m automation.self_hosted_research_worker --lane "%LANE%" --output-dir "research/runs/self_hosted/%GITHUB_RUN_ID%"

      - name: Publish worker evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-hosted-research-${{ inputs.lane }}-${{ github.run_id }}
          path: research/runs/self_hosted/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
