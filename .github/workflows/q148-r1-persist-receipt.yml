name: Q148-R1 Persist WPSR Source Clock Receipt

on:
  push:
    branches: [master]
    paths:
      - automation/q148_r1_wpsr_source_clock.py
      - research/preregistrations/q148_r1_wpsr_source_clock_2026_10_04.json
      - .github/workflows/q148-r1-persist-receipt.yml
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

# Receipt persistence must not be cancelled by a later repository push.
# Push-triggered runs share a stable branch group and supersede older push runs.
# One-shot/manual runs stay isolated so a later push cannot cancel them.
concurrency:
  group: q148-r1-persist-receipt-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  persist:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.issue.number == 997 &&
            github.event.comment.body == '/trading-agent q148-r1-once'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q148_r1_wpsr_source_clock.py
      - name: Compile Q148-R1 receipt
        run: python -m automation.q148_r1_wpsr_source_clock --output "research/evidence/q148_r1_wpsr_source_clock_run_${{ github.run_id }}.json"
      - name: Persist latest pointer
        run: |
          set -euo pipefail
          cp "research/evidence/q148_r1_wpsr_source_clock_run_${{ github.run_id }}.json"              research/evidence/q148_r1_wpsr_source_clock_latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/evidence/q148_r1_wpsr_source_clock_latest.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q148R1_WPSR_SOURCE_CLOCK_CONTRACT_COMPLETED"
          assert all(v is False for v in p["scientific_boundary"].values())
          assert all(v is False for v in p["governance"].values())
          assert p["safety"]["PAPER_ONLY"] is True
          assert p["safety"]["LIVE_TRADING_ENABLED"] is False
          assert p["safety"]["ORDERS_ENABLED"] is False
          assert p["safety"]["AUTOMATIC_PROMOTION"] is False
          print("Q148R1_PERSIST_BOUNDARY=PASS")
          print("Q148R1_RECEIPT=" + p["receipt_fingerprint"])
          PY
      - name: Publish validated evidence with race-safe fast-forward retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist Q148-R1 WPSR source clock receipt"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py               --repository "${GITHUB_REPOSITORY}"               --branch master               --base-sha "${base_sha}"               --file "research/evidence/q148_r1_wpsr_source_clock_run_${GITHUB_RUN_ID}.json=research/evidence/q148_r1_wpsr_source_clock_run_${GITHUB_RUN_ID}.json"               --file "research/evidence/q148_r1_wpsr_source_clock_latest.json=research/evidence/q148_r1_wpsr_source_clock_latest.json"; then
              exit 0
            fi
            sleep "${attempt}"
          done
          echo "::error::Q148-R1 evidence publication failed after retries"
          exit 1
