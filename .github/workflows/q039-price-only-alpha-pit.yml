name: Q039 Price-Only Alpha PIT

on:
  push:
    branches: [master]
    paths:
      - "automation/q039_price_only_alpha_pit.py"
      - "tests/test_q039_price_only_alpha_pit.py"
      - "research/preregistrations/q039_price_only_alpha_pit_2026_09_27.json"
      - "research/authorizations/q039_price_only_alpha_pit_2026_09_27.json"
      - ".github/workflows/q039-price-only-alpha-pit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q039-price-only-alpha-pit
  cancel-in-progress: false

jobs:
  pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Safety and preregistration guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q039_price_only_alpha_pit_2026_09_27.json").read_text(encoding="utf-8"))
          auth=json.loads(Path("research/authorizations/q039_price_only_alpha_pit_2026_09_27.json").read_text(encoding="utf-8"))
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True
          assert auth["execution_scope"] == "PIT_ONLY"
          assert auth["performance_execution_authorized"] is False
          assert spec["governance"]["performance_trial_authorized"] is False
          assert spec["governance"]["performance_evaluation"] is False
          assert spec["governance"]["holdout_evaluation"] is False
          print("Q039 SAFETY/AUTH OK")
          PY

      - name: Q039 PIT contract tests
        run: python -m pytest -q tests/test_q039_price_only_alpha_pit.py

      - name: Fresh Q038-backed snapshot for PIT
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q039_price_only_alpha_pit_2026_09_27.json --output-root research/runs/q039_coverage

      - name: PIT mutation validation
        run: python -m automation.q039_price_only_alpha_pit --universe-root research/runs/q039_coverage/T-2026-09-27-059/datasets --output research/runs/q039_pit/T-2026-09-27-059/pit_report.json

      - name: Validate Q039 PIT governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q039_pit/T-2026-09-27-059/pit_report.json").read_text(encoding="utf-8"))
          assert d["status"] == "PIT_PASSED"
          assert d["performance_evaluation"] is False
          assert d["oos_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["governance"]["performance_trial_authorized"] is False
          assert d["governance"]["automatic_promotion"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("Q039 PIT GOVERNANCE PASS")
          print("REPORT_FINGERPRINT:", d["report_fingerprint"])
          PY

      - name: Publish Q039 PIT artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q039-price-only-alpha-pit-${{ github.run_id }}
          path: |
            research/runs/q039_coverage/
            research/runs/q039_pit/
          if-no-files-found: error
          retention-days: 30
