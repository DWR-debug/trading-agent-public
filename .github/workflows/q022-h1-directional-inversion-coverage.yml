name: Q022 H1 Directional Inversion Coverage
# Execution branch for immutable Trial 047 coverage/PIT preflight.

on:
  push:
    branches:
      - research/execute-q022-h1-coverage
    paths:
      - research/preregistrations/q022_h1_directional_inversion_performance_2026_09_26.json
      - research/authorizations/q022_h1_directional_inversion_coverage_2026_09_26.json
      - research/asset_universes.py
      - automation/coverage_preflight.py
      - data/canonical_snapshot.py
      - tests/test_q022_h1_directional_inversion_design.py
      - tests/test_coverage_preflight.py
      - .github/workflows/q022-h1-directional-inversion-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q022-h1-directional-inversion-coverage-v3
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Coverage preflight
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("SAFETY OK")
          PY
          python -m pytest -q tests/test_q022_h1_directional_inversion_design.py tests/test_coverage_preflight.py
          python -m automation.coverage_preflight             --preregistration research/preregistrations/q022_h1_directional_inversion_performance_2026_09_26.json             --output-root research/runs/q022_h1_coverage
          echo Q022_H1_COVERAGE_COMPLETE


      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q022-h1-directional-inversion-coverage-${{ github.run_id }}
          path: research/runs/q022_h1_coverage/
          if-no-files-found: warn
          retention-days: 30
