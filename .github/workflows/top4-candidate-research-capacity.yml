name: Top-4 Candidate Research Capacity

on:
  push:
    branches: [master]
    paths:
      - "automation/top4_candidate_capacity.py"
      - ".github/workflows/top4-candidate-research-capacity.yml"
      - "research/candidates/orthogonal_candidate_specs_2026-10-05.json"
      - "research/evidence/orthogonal_next_gate_latest.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-top4-capacity
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Top-4 ${{ matrix.candidate }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate: [Q218,Q219,Q220,Q221]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-top4"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-top4.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf || exit /b 1
          endlocal
      - name: Run bounded candidate workpack
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-top4\tools\python.exe"
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          set "PYTHONPATH=%GITHUB_WORKSPACE%"
          if not exist "%GITHUB_WORKSPACE%\research\runs\top4\${{ matrix.candidate }}\%GITHUB_RUN_ID%" mkdir "%GITHUB_WORKSPACE%\research\runs\top4\${{ matrix.candidate }}\%GITHUB_RUN_ID%"
          "%PY_EXE%" -m automation.top4_candidate_capacity --candidate "${{ matrix.candidate }}" --output-dir "%GITHUB_WORKSPACE%\research\runs\top4\${{ matrix.candidate }}\%GITHUB_RUN_ID%"
          endlocal
      - name: Upload candidate receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: top4-windows-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

  hosted_x64:
    name: Hosted x64 Top-4 ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        candidate: [Q218,Q219,Q220,Q221]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf
      - run: |
          mkdir -p "research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}"
          python -m automation.top4_candidate_capacity --candidate "${{ matrix.candidate }}" --output-dir "research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: top4-hosted-x64-${{ matrix.candidate }}-${{ github.run_id }}
          path: research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

  hosted_arm64:
    name: Hosted ARM64 Top-4 independent ${{ matrix.candidate }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        candidate: [Q218,Q219,Q220,Q221]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf
      - run: |
          mkdir -p "research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}"
          python -m automation.top4_candidate_capacity --candidate "${{ matrix.candidate }}" --output-dir "research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: top4-hosted-arm64-${{ matrix.candidate }}-${{ github.run_id }}
          path: research/runs/top4/${{ matrix.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30