name: Q068 Autonomous Evidence Reconciliation

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q068_performance_result.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-q068-evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-reconcile"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q068-reconcile.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Reconcile immutable Q068 ledger entry
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-reconcile"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          "%PY_EXE%" -m automation.q068_reconcile --repo-root . || exit /b 1
          git diff --check || exit /b 1
          git add research\evidence\trial_ledger.json || exit /b 1
          git diff --cached --quiet
          if not errorlevel 1 (
            echo No Q068 ledger changes
            exit /b 0
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EVIDENCE: reconcile Q068 performance trial ledger entry" || exit /b 1
          git push origin HEAD:master || exit /b 1
