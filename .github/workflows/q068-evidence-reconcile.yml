name: Q068 Autonomous Evidence Reconciliation

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q068_performance_result.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-q068-evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-reconcile"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q068-reconcile.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Reconcile immutable Q068 ledger entry
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-reconcile"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          "%PY_EXE%" -m automation.q068_reconcile --repo-root . || exit /b 1
          set "PUBLISH_MESSAGE=EVIDENCE: reconcile Q068 performance trial ledger entry"
          for /f %%H in ('"%PY_EXE%" -c "import os,urllib.request,json; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])"') do set "BASE_SHA=%%H"
          "%PY_EXE%" "%GITHUB_WORKSPACE%\automation\github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/evidence/trial_ledger.json=research\evidence\trial_ledger.json
          if errorlevel 1 exit /b 1
