name: Signal Reversal Rebound Diagnosis 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ci-disabled]
    paths:
      - "automation/signal_reversal_rebound_diagnosis_2026_09_24.py"
      - "tests/test_signal_reversal_rebound_diagnosis_2026_09_24.py"
      - "docs/signal_reversal_rebound_diagnosis_2026_09_24_preregistration.md"
      - ".github/workflows/signal-reversal-rebound-diagnosis-2026-09-24.yml"
      - "automation/candidate_validation_50_50_vol_budget.py"
      - "data/**"
      - "research/**"
      - "validation/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-signal-reversal-rebound-diagnosis-2026-09-24
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Vier immutable Validierungsartefakte laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/reversal_rebound_sources
          declare -A artifacts=(
            [10751817990]=candidate-validation-50-50-vol-budget-2026-09-23.zip
            [10740188093]=second-validation-2026-09-23.zip
            [10745697729]=third-validation-2026-09-23.zip
            [10753545703]=fourth-independent-validation-2026-09-23.zip
          )
          for artifact_id in "${!artifacts[@]}"; do
            file="/tmp/${artifacts[$artifact_id]}"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$file"
            unzip -q "$file" -d /tmp/reversal_rebound_sources
          done
          test -f /tmp/reversal_rebound_sources/research/candidate_validation/report.json
          test -f /tmp/reversal_rebound_sources/research/independent_validation_2026_09_23/report.json
          test -f /tmp/reversal_rebound_sources/research/third_independent_validation_2026_09_23/report.json
          test -f /tmp/reversal_rebound_sources/research/fourth_independent_validation_2026_09_23/report.json
          echo "IMMUTABLE_VALIDATION_ARTIFACTS_READY"

      - name: Präregistrierung fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.signal_reversal_rebound_diagnosis_2026_09_24 import (
              CASES,
              PRIOR_DECLINE_SESSIONS,
              RESEARCH_COUNT,
              WORST_DAY_BUCKET_PERCENT,
          )
          assert len(CASES) == 4
          assert RESEARCH_COUNT == 2798
          assert PRIOR_DECLINE_SESSIONS == 20
          assert WORST_DAY_BUCKET_PERCENT == 5
          assert [case["artifact_id"] for case in CASES] == [
              10751817990,
              10740188093,
              10745697729,
              10753545703,
          ]
          prereg = Path(
              "docs/signal_reversal_rebound_diagnosis_2026_09_24_preregistration.md"
          )
          prereg_text = prereg.read_text(encoding="utf-8")
          for token in (
              "Rebound-after-decline",
              "Cross-Sectional-Winner-Reversal",
              "20-Session",
              "schlechtesten 5%",
              ">=3/4",
              "Holdout",
              "PAPER_ONLY=True",
          ):
              assert token in prereg_text
          print("PREREGISTRATION_VERIFIED")
          PY

      - name: Reversal-/Rebound-Diagnose ausführen
        run: |
          set -euo pipefail
          python -m automation.signal_reversal_rebound_diagnosis_2026_09_24 \
            --source-root /tmp/reversal_rebound_sources \
            --output research/signal_reversal_rebound_diagnosis_2026_09_24/report.json

      - name: Ergebnisintegrität und Research-only-Scope prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/signal_reversal_rebound_diagnosis_2026_09_24/report.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          scope = result["scope"]
          assert scope["datasets"] == 4
          assert scope["research_return_count_per_dataset"] == 2798
          assert scope["holdout_used_for_decision"] is False
          assert scope["holdout_metrics_reported"] is False
          assert scope["new_data_downloads"] is False
          assert scope["parameter_search"] is False
          assert scope["asset_selection"] is False
          assert scope["strategy_mutation"] is False
          assert scope["gate_changes"] is False
          assert scope["production_mutation"] is False

          methodology = result["methodology"]
          assert methodology["cs_lookback_sessions"] == 252
          assert methodology["cs_skip_sessions"] == 21
          assert methodology["cs_rebalance_sessions"] == 21
          assert methodology["cs_top_n"] == 2
          assert scope["prior_decline_sessions"] == 20
          assert methodology["worst_bucket_percent"] == 5
          assert methodology["replication_threshold"] == ">=3/4 validations"
          assert methodology["descriptive_not_causal"] is True

          assert len(result["cases"]) == 4
          assert all(
              "max_drawdown_onset" in case["analysis"]
              for case in result["cases"].values()
          )

          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          print("REVERSAL_REBOUND_RESULT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          print("CONSENSUS:", result["consensus"])
          PY

      - name: Diagnoseartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-reversal-rebound-diagnosis-2026-09-24-${{ github.run_id }}
          path: research/signal_reversal_rebound_diagnosis_2026_09_24/
          if-no-files-found: error
          retention-days: 30
