name: Q094 Monthly Rebalance Performance Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q094_performance_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q094-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore exact frozen Q094 preparation artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11031779886
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36568067970
          path: _q094_prep

      - name: Materialize frozen Q094 artifact into canonical research paths
        shell: bash
        run: |
          set -euo pipefail
          test -d _q094_prep/runs/q094_coverage/T-2026-09-29-094-COVERAGE/datasets
          test -d _q094_prep/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE
          mkdir -p research
          mkdir -p research/evidence research/runs
          cp -a _q094_prep/evidence/. research/evidence/
          cp -a _q094_prep/runs/. research/runs/

      - name: Verify restored frozen Q094 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f research/evidence/q094_coverage_result.json
          test -f research/evidence/q094_pit_result.json
          test -f research/evidence/q094_input_freeze_result.json
          test -f research/runs/q094_coverage/T-2026-09-29-094-COVERAGE/snapshot_manifest.json
          test -f research/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE/input_bundle_manifest.json
          for symbol in VRSK SNPS WAB TT ODFL URI DECK LEN; do
            test -s "research/runs/q094_coverage/T-2026-09-29-094-COVERAGE/datasets/$symbol/1d.csv"
            test -s "research/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE/$symbol/adjusted_close.csv"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          cov=json.loads(Path("research/evidence/q094_coverage_result.json").read_text())
          pit=json.loads(Path("research/evidence/q094_pit_result.json").read_text())
          inp=json.loads(Path("research/evidence/q094_input_freeze_result.json").read_text())
          snap=json.loads(Path("research/runs/q094_coverage/T-2026-09-29-094-COVERAGE/snapshot_manifest.json").read_text())
          bundle=json.loads(Path("research/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE/input_bundle_manifest.json").read_text())
          assert cov["result_fingerprint"]=="3530fe97e0b9532a5b15880ed2c1910c1637a879f1fda3fce1b92736ced56265"
          assert cov["snapshot_fingerprint"]=="b491e96fe871d6f45f9c1278fa597b06bd77ea59efa1d7bde30afd05f66b72bb"
          assert pit["result_fingerprint"]=="7ff59ed08dfda4f93d25528cec218a36437ab8608e5ff1bf9a082980367199be"
          assert inp["bundle_fingerprint"]=="6d29965db98bc77e22e59fea9f158aca3531afaf1b66ec97ed2996f2b2a94dac"
          assert snap["snapshot_fingerprint"]==cov["snapshot_fingerprint"]
          assert bundle["bundle_fingerprint"]==inp["bundle_fingerprint"]
          print("Q094 FROZEN PREPARATION ARTIFACT VERIFIED")
          PY

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Verify exact Q094 trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q094_performance_once.trigger
          grep -Fx "RUN_Q094_MONTHLY_REBALANCE_PERFORMANCE_ONCE=true" research/run_requests/q094_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-29-094" research/run_requests/q094_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q094_performance_once.trigger
          echo "Q094 PERFORMANCE TRIGGER VERIFIED"

      - name: Fail-closed active registry guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path("research/governance/active_research_registry.json").read_text())
          entry=next((x for x in reg.get("active_trials",[]) if x.get("code")=="094"),None)
          assert entry is not None
          assert entry["trial_id"]=="T-2026-09-29-094"
          assert entry["performance_authorization_allowed"] is True
          assert entry["state"]=="PERFORMANCE_AUTHORIZED"
          print("Q094 ACTIVE AUTHORIZATION GUARD PASSED")
          PY

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q094 SAFETY INVARIANTS OK")
          PY

      - name: Governance preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json").read_text())
          auth=json.loads(Path("research/authorizations/q094_performance_2026_09_29.json").read_text())
          assert p["status"]=="PREREGISTERED_PERFORMANCE"
          assert p["governance"]["performance_trial_authorized"] is True
          assert p["data_contract"]["symbols"]==["VRSK","SNPS","WAB","TT","ODFL","URI","DECK","LEN"]
          assert auth["trial_id"]=="T-2026-09-29-094"
          assert auth["authorized"] is True and auth["performance_execution_authorized"] is True and auth["one_shot"] is True
          canonical=json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)
          prereg_fp=hashlib.sha256(canonical.encode()).hexdigest()
          assert auth["preregistration_fingerprint"]==prereg_fp
          assert auth["input_bundle_fingerprint"]==p["data_contract"]["input_bundle_fingerprint"]
          print("Q094 GOVERNANCE PREFLIGHT PASS")
          print("PREREGISTRATION_FINGERPRINT:",prereg_fp)
          PY

      - name: Source-contract verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json").read_text())
          checks={
            "performance_runner_sha256":"automation/q094_performance.py",
            "monthly_overlay_sha256":"portfolio/q094_monthly_rebalance.py",
            "candidate_bank_sha256":"automation/q069_candidate_bank.py",
            "cost_contract_sha256":"execution/cost_contract.py",
            "settings_sha256":"config/settings.py",
            "input_freeze_sha256":"automation/q094_coverage_pit.py",
          }
          for key,path in checks.items():
            assert p["source_contract"][key]==hashlib.sha256(Path(path).read_bytes()).hexdigest(), key
          print("Q094 SOURCE CONTRACT PASS")
          PY

      - name: Structural regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q094_monthly_rebalance.py

      - name: Execute Q094 fixed monthly-rebalance performance exactly once
        shell: bash
        env:
          Q094_PERFORMANCE_ONCE: "true"
        run: |
          set -euo pipefail
          python -m automation.q094_performance --repo-root . --output research/evidence/q094_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q094_reconcile --repo-root . --workflow-run-id "$Q094_WORKFLOW_RUN_ID"

      - name: Publish Q094 result, ledger and retired authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q094_performance_result.json=research/evidence/q094_performance_result.json             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json             --file research/governance/active_research_registry.json=research/governance/active_research_registry.json             --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload Q094 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q094-monthly-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q094_performance_result.json
          if-no-files-found: warn
          retention-days: 30
