name: Research Governance Audit (trusted self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/**"
      - "research/authorizations/**"
      - "research/evidence/**"
      - "automation/research_governance_audit.py"
      - "tests/test_research_governance_audit.py"
      - ".github/workflows/research-governance-audit.yml"
      - "research/run_requests/research_governance_audit.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-research-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25

    steps:
      - name: Download exact source snapshot
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          if not defined GITHUB_SHA exit /b 1
          set "ROOT=%RUNNER_TEMP%\trading-agent-governance-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-governance-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%ROOT%" rmdir /s /q "%ROOT%"
          mkdir "%ROOT%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%ROOT%" || exit /b 1
          set "REPO_ROOT="
          for /d %%D in ("%ROOT%\trading-agent-public-*") do set "REPO_ROOT=%%~fD"
          if not defined REPO_ROOT exit /b 1
          echo REPO_ROOT=%REPO_ROOT%>>"%GITHUB_ENV%"
          echo SELF_HOSTED_EXACT_SNAPSHOT_OK %GITHUB_SHA%
          endlocal
      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-governance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-governance.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          echo PY_EXE=%PY_EXE%>>"%GITHUB_ENV%"
          echo PYTHONPATH=%REPO_ROOT%>>"%GITHUB_ENV%"

      - name: Run governance unit tests
        shell: cmd
        run: |
          @echo off
          cd /d "%REPO_ROOT%" || exit /b 1
          "%PY_EXE%" -m pytest -q tests/test_research_governance_audit.py || exit /b 1

      - name: Run fail-closed repository audit
        shell: cmd
        run: |
          @echo off
          cd /d "%REPO_ROOT%" || exit /b 1
          "%PY_EXE%" automation\research_governance_audit.py > "%GITHUB_WORKSPACE%\governance_audit.json"
          if errorlevel 1 exit /b 1
          type "%GITHUB_WORKSPACE%\governance_audit.json"

      - name: Publish governance audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: research-governance-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: governance_audit.json
          if-no-files-found: error
          retention-days: 30
