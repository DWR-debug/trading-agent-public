name: Sleeve Co-Movement Diagnostic 2026-09-23 — Public

on:
  push:
    branches:
      - research/sleeve-comovement-2026-09-23-public
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - research/risk-timing-control-2026-09-23-public
      - master
    paths:
      - "automation/sleeve_comovement_diagnostic_2026_09_23.py"
      - "tests/test_sleeve_comovement_diagnostic_2026_09_23.py"
      - ".github/workflows/sleeve-comovement-diagnostic-2026-09-23.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "35839443616"
      SOURCE_ARTIFACT_ID: "10740188093"
      SOURCE_ARTIFACT_DIGEST: "eed3ec6105dec7bc8616ab989ce6f086107b249f7fa087f6e851709af6e47354"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Immutable Public Validation Artifact laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"             --output validation-artifact.zip
          echo "${SOURCE_ARTIFACT_DIGEST}  validation-artifact.zip" | sha256sum -c -
          mkdir -p source_artifact
          unzip -q validation-artifact.zip -d source_artifact

      - name: Source Contract verifizieren
        run: |
          set -euo pipefail
          test -f source_artifact/research/independent_validation_2026_09_23/report.json
          test -f source_artifact/research/independent_validation_2026_09_23/adjusted_close_archive.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("source_artifact/research/independent_validation_2026_09_23")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          assert report["source"]["fully_disjoint_from_prior_universes"] is True
          assert report["source"]["out_of_time_validation"] is False
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["orders_enabled"] is False
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False
          print("SOURCE_CONTRACT_OK")
          print("SOURCE_REPORT_FINGERPRINT:", report["report_fingerprint"])
          PY

      - name: Sleeve-Co-Movement-Diagnose ausführen
        run: |
          set -euo pipefail
          python -m automation.sleeve_comovement_diagnostic_2026_09_23             --artifact-root source_artifact             --output research/sleeve_comovement/sleeve_comovement_diagnostic.json

      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("research/sleeve_comovement/sleeve_comovement_diagnostic.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["interpretation_scope"]["descriptive_not_causal"] is True
          assert result["interpretation_scope"]["no_counterfactual"] is True
          assert result["methodology"]["parameters_searched"] is False
          assert result["methodology"]["production_mutated"] is False
          assert result["safety"]["paper_only"] is True
          assert result["safety"]["live_trading_enabled"] is False
          assert result["safety"]["orders_enabled"] is False
          print("SLEEVE_COMOVEMENT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          print("RESEARCH_CORRELATION:", result["research_overall"]["interaction"]["correlation"])
          print("RESEARCH_BOTH_NEGATIVE_RATE:", result["research_overall"]["interaction"]["both_negative_rate"])
          print("HOLDOUT_CORRELATION:", result["holdout_overall"]["interaction"]["correlation"])
          print("HOLDOUT_BOTH_NEGATIVE_RATE:", result["holdout_overall"]["interaction"]["both_negative_rate"])
          PY

      - name: Diagnose-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleeve-comovement-diagnostic-2026-09-23-public
          path: research/sleeve_comovement/
          if-no-files-found: error
          retention-days: 30
