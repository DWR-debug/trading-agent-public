name: S10 Runtime Health
on:
  push:
    branches: [master]
    paths:
      - "automation/s10_probe.py"
      - "automation/s10_runtime.py"
      - "automation/s10_worker.py"
      - "tests/test_s10_probe.py"
      - "tests/test_s10_runtime.py"
      - ".github/workflows/s10-runtime-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-s10-runtime-health
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slot: [a]
    runs-on: [self-hosted, s10-phone, linux, ARM64]
    timeout-minutes: 6
    steps:
      - name: Download exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/s10-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE="$RUNNER_TEMP/s10-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 -o "$ARCHIVE" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/$GITHUB_SHA"
          tar -xzf "$ARCHIVE" -C "$WORK"
          echo "REPO_SRC=$(find "$WORK" -maxdepth 1 -type d -name 'trading-agent-public-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Bootstrap Python
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 ca-certificates curl tar
          python3 --version
          echo "PY_EXE=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Run S10 phone runtime probe
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/s10-probe-${{ matrix.slot }}.json"
          cd "$REPO_SRC"
          "$PY_EXE" -m automation.s10_probe > "$OUT"
          cat "$OUT"

      - name: Create provenance receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["GITHUB_WORKSPACE"])/"s10-probe-${{ matrix.slot }}.json"
          out=Path(os.environ["GITHUB_WORKSPACE"])/"s10-receipt-${{ matrix.slot }}.json"
          if not p.exists():
              raise SystemExit(0)
          raw=json.loads(p.read_text(encoding="utf-8"))
          receipt={
              "schema_version":1,
              "receipt_type":"s10_runtime_probe",
              "source_commit":os.environ.get("GITHUB_SHA"),
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_arch":os.environ.get("RUNNER_ARCH"),
              "matrix_slot":"${{ matrix.slot }}",
              "s10_status":raw.get("status"),
              "identity":raw.get("identity"),
              "paper_only":raw.get("paper_only"),
              "live_trading_enabled":raw.get("live_trading_enabled"),
              "orders_enabled":raw.get("orders_enabled"),
              "automatic_promotion":raw.get("automatic_promotion"),
              "formal_evidence_allowed":raw.get("formal_evidence_allowed"),
              "secrets_collected":raw.get("secrets_collected"),
              "cli":raw.get("cli"),
              "processes":raw.get("processes"),
              "listeners":raw.get("listeners"),
              "local_interfaces":raw.get("local_interfaces"),
              "memory":raw.get("memory"),
          }
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Upload S10 receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: s10-runtime-${{ matrix.slot }}-${{ github.run_id }}
          path: |
            s10-probe-${{ matrix.slot }}.json
            s10-receipt-${{ matrix.slot }}.json
          if-no-files-found: warn
          retention-days: 30
