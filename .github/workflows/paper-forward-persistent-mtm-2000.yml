# Operational trigger heartbeat - paper-only path.
name: Paper Forward Persistent MTM 2000 EUR

on:
  schedule:
    - cron: "*/15 * * * *"
  issue_comment:
    types: [created]
  push:
    branches: [master]
    paths:
      - ops/paper_forward_2000/operational_candidate.json
      - automation/paper_forward_shadow.py
      - automation/paper_forward_market_feed.py
      - automation/paper_forward_loop.py
      - .github/workflows/paper-forward-persistent-mtm-2000.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-paper-forward-persistent-mtm-2000
  cancel-in-progress: false

jobs:
  shadow:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.comment.body == '/trading-agent paper-forward-2000-once'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("PAPER FORWARD 2000 SAFETY OK")
          PY

      - name: Run one bounded paper-forward MTM update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/paper_forward_2000/state
          python -m automation.paper_forward_loop             --candidate ops/paper_forward_2000/operational_candidate.json             --state ops/paper_forward_2000/state/shadow.json             --receipt ops/paper_forward_2000/state/feed_receipt.json             --warmup-candles 500             --fetch-limit 1000             --max-iterations 1

      - name: Validate persisted MTM state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("ops/paper_forward_2000/state/shadow.json")
          if not p.exists():
              raise SystemExit("PAPER_FORWARD_2000_STATE_MISSING")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema_version"] == 2
          assert d["mode"] == "PAPER_FORWARD_SHADOW"
          assert d["safety"] == {
              "PAPER_ONLY": True,
              "LIVE_TRADING_ENABLED": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          portfolio = d["portfolio"]
          for key in ("final_equity_eur","realized_pnl_eur","unrealized_pnl_eur",
                      "total_pnl_eur","maximum_mtm_drawdown_percent",
                      "cumulative_fees_eur","current_position_exposure_eur"):
              # Some values are inside portfolio or ledger depending on schema evolution.
              if key not in portfolio and key != "cumulative_fees_eur":
                  raise SystemExit("PAPER_FORWARD_2000_MTM_FIELD_MISSING:"+key)
          assert isinstance(portfolio["ledger"], list) and portfolio["ledger"]
          print("PAPER_FORWARD_2000_MTM_OK")
          print("LAST_MARKET_TIMESTAMP_UTC:", d["last_market_timestamp_utc"])
          print("MTM_2000_EQUITY_EUR:", portfolio["final_equity_eur"])
          print("REALIZED_PNL_EUR:", portfolio["realized_pnl_eur"])
          print("UNREALIZED_PNL_EUR:", portfolio["unrealized_pnl_eur"])
          print("MTM_DRAWDOWN_PERCENT:", portfolio["maximum_mtm_drawdown_percent"])
          print("TRADE_COUNT:", portfolio["trade_count"])
          print("STATE_INPUT_FINGERPRINT:", d["input_fingerprint"])
          PY

      - name: Commit persistent state and receipt
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git fetch origin master
          git merge --ff-only origin/master
          git add -A ops/paper_forward_2000/state/
          if git diff --cached --quiet; then
            echo "PAPER_FORWARD_2000_NO_STATE_CHANGE"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "OPS: advance 2000 EUR paper-forward MTM state"
          git push origin HEAD:master

      - name: Publish compact operational receipt
        if: always()
        shell: bash
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "MASTER_SHA=$GITHUB_SHA"
          echo "PAPER_ONLY=True"
          echo "LIVE_TRADING_ENABLED=False"
          echo "ORDERS_ENABLED=False"
          echo "AUTOMATIC_PROMOTION=False"
