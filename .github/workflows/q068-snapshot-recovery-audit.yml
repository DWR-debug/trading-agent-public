name: Q068 Frozen Snapshot Recovery Audit

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q068_snapshot_audit.trigger"
      - "automation/q068_snapshot_recovery_audit.py"
      - ".github/workflows/q068-snapshot-recovery-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q068-snapshot-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run non-authorizing snapshot audit
        run: |
          set -euo pipefail
          python automation/q068_snapshot_recovery_audit.py
      - name: Publish audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python -c 'import json,os,urllib.request; u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"; r=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}); print(json.load(urllib.request.urlopen(r,timeout=30))["object"]["sha"])')"
          test -n "$BASE_SHA"
          export PUBLISH_MESSAGE="AUDIT: record Q068 snapshot recovery outcome"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$BASE_SHA"             --file research/evidence/q068_snapshot_recovery_audit.json=research/evidence/q068_snapshot_recovery_audit.json
