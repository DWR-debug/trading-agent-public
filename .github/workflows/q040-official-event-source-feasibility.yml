name: Q040 Official Event Source Feasibility

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q040_official_event_source_feasibility_2026_09_27.json"
      - "research/authorizations/q040_official_event_source_feasibility_2026_09_27.json"
      - "automation/q040_official_event_source_feasibility.py"
      - "tests/test_q040_official_event_source_feasibility.py"
      - ".github/workflows/q040-official-event-source-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Q040 tests
        run: python -m pytest -q tests/test_q040_official_event_source_feasibility.py
      - name: Fixed official source probes
        run: python -m automation.q040_official_event_source_feasibility --output research/runs/q040/q040_source_feasibility.json
      - name: Validate Q040 governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q040/q040_source_feasibility.json").read_text())
          assert d["status"]=="COMPLETED_SOURCE_FEASIBILITY"
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["governance"]["performance_trial_authorized"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print('Q040 GOVERNANCE PASS')
          PY
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q040-official-source-feasibility-${{ github.run_id }}
          path: research/runs/q040/q040_source_feasibility.json
          if-no-files-found: error
          retention-days: 30
