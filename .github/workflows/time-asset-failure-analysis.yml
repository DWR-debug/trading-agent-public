name: Time Asset Failure Analysis

on:
  pull_request:
    branches:
      - ci-disabled
  workflow_run:
    workflows:
      - Candidate Migration Analysis
    types:
      - completed
    branches:
      - diagnostics/candidate-migration-2026-09-22
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pull_request_verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Diagnose-Regressionstests
        run: python -m pytest -q tests/test_time_asset_failure_analysis.py
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

  analyze:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ROLLING_SOURCE_RUN_ID: "35747170025"
      MIGRATION_SOURCE_RUN_ID: "${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '35748407706' }}"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Rolling-Control laden
        uses: actions/download-artifact@v5
        with:
          name: rolling-geometry-control
          path: rolling_source
          run-id: ${{ env.ROLLING_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Kandidaten-Migration laden
        uses: actions/download-artifact@v5
        with:
          name: candidate-migration-analysis
          path: migration_source
          run-id: ${{ env.MIGRATION_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Quellreports verifizieren
        run: |
          set -euo pipefail
          test -f rolling_source/rolling_geometry_control.json
          test -f migration_source/candidate_migration_analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          rolling = json.loads(Path("rolling_source/rolling_geometry_control.json").read_text(encoding="utf-8"))
          migration = json.loads(Path("migration_source/candidate_migration_analysis.json").read_text(encoding="utf-8"))
          assert rolling["diagnostic_type"] == "rolling_geometry_time_phase_control"
          assert migration["diagnostic_type"] == "candidate_migration_failure_analysis"
          assert migration["source_diagnostic_fingerprint"] == rolling["diagnostic_fingerprint"]
          assert migration["transition_count_total"] == 216
          print("SOURCE_REPORTS OK")
          PY
      - name: Zeit-/Asset-Failure-Analyse ausführen
        run: |
          set -euo pipefail
          python -m automation.time_asset_failure_analysis             --rolling-json rolling_source/rolling_geometry_control.json             --migration-json migration_source/candidate_migration_analysis.json             --output-dir research/time_asset_failure
      - name: Analyse-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: time-asset-failure-analysis
          path: research/time_asset_failure/
          if-no-files-found: error
          retention-days: 30
