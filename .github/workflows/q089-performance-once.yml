name: Q089 Fixed Rule Performance Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q089_performance_once.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q089-fixed-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0 pypdf

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q089 SAFETY INVARIANTS OK")
          PY

      - name: Governance preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.research_governance_audit --repo-root .

      - name: Q089 structural tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q089_validation.py tests/test_q089_input_freeze.py tests/test_q089_performance_envelope.py tests/test_q089_contract_audit.py

      - name: Execute fixed-rule performance exactly once
        shell: bash
        run: |
          set -euo pipefail
          test -f research/authorizations/q089_performance_2026_09_28.json
          python -m automation.q089_performance --repo-root . --output research/evidence/q089_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        env:
          Q089_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m automation.q089_reconcile --repo-root . --workflow-run-id "$Q089_WORKFLOW_RUN_ID"

      - name: Publish deterministic evidence and ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha=$(python -c 'import json,os,urllib.request; u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"; req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}); print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])')
          test -n "$base_sha"
          export PUBLISH_MESSAGE="EVIDENCE: reconcile Q089 fixed-rule performance"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$base_sha" \
            --file research/evidence/q089_performance_result.json=research/evidence/q089_performance_result.json \
            --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload Q089 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q089-fixed-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q089_performance_result.json
          if-no-files-found: warn
          retention-days: 30
