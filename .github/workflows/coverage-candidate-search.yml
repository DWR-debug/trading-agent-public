name: Q038 Fresh Disjoint Coverage

on:
  push:
    branches: [master]
    paths:
      - "automation/q038_fresh_disjoint_coverage.py"
      - "tests/test_q038_fresh_disjoint_coverage.py"
      - "research/preregistrations/q038_fresh_disjoint_coverage_2026_09_27.json"
      - "research/authorizations/q038_fresh_disjoint_coverage_2026_09_27.json"
      - ".github/workflows/coverage-candidate-search.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q038-coverage
  cancel-in-progress: false

jobs:
  q038_coverage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety guard
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q038 SAFETY OK")
          PY

      - name: Q038 contract tests
        run: python -m pytest -q tests/test_q038_fresh_disjoint_coverage.py

      - name: Q038 coverage-only search
        run: |
          set -euo pipefail
          mkdir -p research/runs/q038
          python -m automation.q038_fresh_disjoint_coverage \
            --output research/runs/q038/q038_coverage.json

      - name: Q038 contract verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q038/q038_coverage.json").read_text(encoding="utf-8"))
          assert d["candidate_pool"] == ["IVE","IWL","DLN","DHS","DON","DES","USRT","ITB"]
          assert d["requested_candles"] == 4000
          assert d["target_common_candles"] == 3500
          assert d["target_universe_size"] == 8
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["governance"]["performance_trial_authorized"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("Q038 CONTRACT OK")
          print("STATUS:", d["status"])
          print("ACCEPTED:", ",".join(d["accepted_symbols"]))
          print("COMMON_CALENDAR:", d["common_calendar_count"])
          print("FINGERPRINT:", d["fingerprint"])
          PY

      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q038-fresh-disjoint-coverage-${{ github.run_id }}
          path: research/runs/q038/q038_coverage.json
          if-no-files-found: error
          retention-days: 30
