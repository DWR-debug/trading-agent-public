name: Windows Runner C Long Research Workpack
# CAPACITY-REACTIVATION 2026-10-05: explicit Runner-C utilization; no scientific semantics changed.

on:
  # Automatic research capacity is owned by the dedicated Top-4 dispatcher.
  # Legacy broad workpacks remain available for explicit manual recovery only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-windows-long-runner-c
  cancel-in-progress: false

jobs:
  long_workpack:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research, trading-agent-long]
    timeout-minutes: 240
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-runner-c.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip install --disable-pip-version-check --no-cache-dir pytest exchange-calendars tzdata==2026.5 || exit /b 1
          endlocal

      - name: Structural contract and snapshot-guard tests
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_orthogonal_pit_next_gate.py tests/test_source_readiness_snapshot_guard.py tests/test_long_run_capacity_policy.py
          if errorlevel 1 exit /b 1

      - name: Compile next logical gates
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c\tools\python.exe"
          if not exist research\runs\windows_runner_c mkdir research\runs\windows_runner_c
          "%PY_EXE%" -m automation.orthogonal_pit_next_gate --output research\runs\windows_runner_c\next_logical_gates.json
          if errorlevel 1 exit /b 1

      - name: Audit source-readiness durability
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c\tools\python.exe"
          "%PY_EXE%" -m automation.source_readiness_snapshot_guard --output research\runs\windows_runner_c\source_readiness_guard.json
          if errorlevel 1 exit /b 1

      - name: Run current orthogonal source and PIT readiness tests
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_q185_q186_frontier.py tests/test_q186_pit_readiness_r2.py tests/test_q187_q192_source_feasibility.py tests/test_q188_q192_pit_census_r2.py tests/test_q193_q196_source_feasibility.py tests/test_q197_q198_source_feasibility.py tests/test_q198_pit_clock_census.py tests/test_q199_q201_source_feasibility.py
          if errorlevel 1 exit /b 1

      - name: Write run manifest
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-runner-c\tools\python.exe"
          "%PY_EXE%" -c "import json,os; from pathlib import Path; root=Path(r'research/runs/windows_runner_c'); files=[{'path':str(p.relative_to(root)).replace('\\\\','/'),'bytes':p.stat().st_size} for p in root.rglob('*') if p.is_file() and p.name!='run_manifest.json']; out={'schema_version':1,'runner_role':'long_deterministic_research','runner_name':os.environ.get('RUNNER_NAME'),'source_commit':os.environ.get('GITHUB_SHA'),'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False,'formal_evidence_allowed':False,'generated_at_utc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'files':files}; (root/'run_manifest.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\\n',encoding='utf-8')"
          if errorlevel 1 exit /b 1

      - name: Upload long-run workpack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-runner-c-long-workpack-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/windows_runner_c/
          if-no-files-found: warn
          retention-days: 30
