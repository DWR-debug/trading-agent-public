name: Simulation Capital Focused QA

on:
  pull_request:
    branches: [master]
    paths:
      - config/settings.py
      - portfolio/capital_account.py
      - portfolio/income_simulation.py
      - portfolio/income_validation.py
      - tests/test_capital_account.py
      - tests/test_income_simulation.py
      - tests/test_income_validation.py
      - .github/workflows/simulation-capital-focused-qa.yml
  push:
    branches: [master]
    paths:
      - config/settings.py
      - portfolio/capital_account.py
      - portfolio/income_simulation.py
      - portfolio/income_validation.py
      - tests/test_capital_account.py
      - tests/test_income_simulation.py
      - tests/test_income_validation.py
      - .github/workflows/simulation-capital-focused-qa.yml

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Safety and capital reference
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert settings.HYPOTHETICAL_STARTING_CAPITAL_EUR == 2000.0
          print("CAPITAL_REFERENCE_2000_OK")
          PY
      - name: Focused accounting tests
        run: python -m pytest -q tests/test_capital_account.py tests/test_income_simulation.py tests/test_income_validation.py
      - name: Capital scaling invariant
        run: |
          set -euo pipefail
          python - <<'PY'
          from portfolio.income_simulation import IncomePolicy, simulate_income
          returns = (0.05, 0.02, -0.03, 0.04, 0.01, -0.02, 0.03, 0.0, 0.02, -0.01)
          low = simulate_income(returns, IncomePolicy(protected_capital_eur=500.0, payout_fraction=0.5, payout_interval_periods=2))
          high = simulate_income(returns, IncomePolicy(protected_capital_eur=2000.0, payout_fraction=0.5, payout_interval_periods=2))
          assert high.final_equity_eur == low.final_equity_eur * 4.0
          assert high.total_payout_eur == low.total_payout_eur * 4.0
          assert high.minimum_equity_eur == low.minimum_equity_eur * 4.0
          assert high.maximum_drawdown_percent == low.maximum_drawdown_percent
          assert high.payout_count == low.payout_count
          print("CAPITAL_SCALING_INVARIANT_OK")
          print("LOW_FINAL_EQUITY_EUR:", low.final_equity_eur)
          print("HIGH_FINAL_EQUITY_EUR:", high.final_equity_eur)
          print("LOW_TOTAL_PAYOUT_EUR:", low.total_payout_eur)
          print("HIGH_TOTAL_PAYOUT_EUR:", high.total_payout_eur)
          print("MAX_DD_PERCENT:", high.maximum_drawdown_percent)
          PY
