name: T052 Evidence Reconcile Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/t052_evidence_reconcile_once.trigger"
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: trading-agent-t052-evidence-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'issues' &&
          github.event.issue.user.login == github.repository_owner &&
          github.event.issue.title == 'OPS: one-shot T052 evidence reconcile'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Download immutable T052 execution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/t052_artifact
          mkdir -p /tmp/t052_artifact
          gh run download 36338219883             --repo "${GITHUB_REPOSITORY}"             --name "t052-formal-once-36338219883-1"             --dir /tmp/t052_artifact
          test -f /tmp/t052_artifact/t052_performance/t052_result.json
          test -f /tmp/t052_artifact/t052_performance/t052_result.md

      - name: Verify original T052 execution identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/t052_artifact/t052_performance/t052_result.json").read_text(encoding="utf-8"))
          assert d["trial_id"] == "T-2026-09-27-052"
          assert d["status"] == "COMPLETED"
          assert d["code_version"] == "40d2c5d36790cab2608730154d330f65fc150d40"
          assert d["governance"] == {
              "selection_used": False,
              "parameter_search": False,
              "asset_search": False,
              "threshold_search": False,
              "horizon_search": False,
              "variant_search": False,
              "holdout_used_for_selection": False,
              "automatic_promotion": False,
          }
          assert d["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          assert all(not u["trend_sma_50_200"]["all_gates_passed"] and not u["cs_momentum_12_1_top2"]["all_gates_passed"] for u in d["universes"].values())
          print("T052 ORIGINAL ARTIFACT VERIFIED")
          print("REPORT_FINGERPRINT", d["report_fingerprint"])
          PY

      - name: Install deterministic publisher dependencies
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Reconcile immutable T052 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/t052_performance
          cp /tmp/t052_artifact/t052_performance/t052_result.json research/runs/t052_performance/t052_result.json
          cp /tmp/t052_artifact/t052_performance/t052_result.md research/runs/t052_performance/t052_result.md
          python -m automation.publish_t052_result             --result research/runs/t052_performance/t052_result.json             --ledger research/evidence/trial_ledger.json             --result-doc research/runs/t052_performance/t052_result.md             --checkpoint research/checkpoints/t052_fixed_core_sleeve_performance_2026_09_27.json             --state research/evidence/project_state.json             --decision research/evidence/decision_basis_latest.json             --source-code-sha 40d2c5d36790cab2608730154d330f65fc150d40             --workflow-run-id 36338219883             --workflow-run-attempt 1
          cp research/runs/t052_performance/t052_result.md             docs/trial_052_fixed_core_sleeve_performance_result_2026_09_27.md

      - name: Commit canonical T052 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge --ff-only origin/master
          git add             research/evidence/trial_ledger.json             research/checkpoints/t052_fixed_core_sleeve_performance_2026_09_27.json             research/evidence/project_state.json             research/evidence/decision_basis_latest.json             docs/trial_052_fixed_core_sleeve_performance_result_2026_09_27.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EVIDENCE: reconcile T052 fixed-core sleeve performance"

          for _ in 1 2 3; do
            if git push origin HEAD:master; then
              echo "T052_CANONICAL_EVIDENCE_PUSHED"
              exit 0
            fi
            git fetch origin master
            if git show origin/master:research/evidence/trial_ledger.json | grep -q '"T-2026-09-27-052"'; then
              echo "T052_CANONICAL_EVIDENCE_ALREADY_PUBLISHED"
              exit 0
            fi
            git rebase origin/master
          done
          echo "::error::T052 evidence push failed after three race-safe retries."
          exit 1

      - name: Close one-shot reconciliation issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}" --reason completed --comment "T052 evidence reconciliation completed from immutable workflow 36338219883."

      - name: Evidence receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t052-evidence-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/t052_performance/
            research/checkpoints/t052_fixed_core_sleeve_performance_2026_09_27.json
          if-no-files-found: warn
          retention-days: 30
