name: Q022 Treasury Failure Follow-up Design Guard

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q022_treasury_failure_followup_design_2026_09_26.json"
      - "research/research_queue.json"
      - "research/evidence/trial_ledger.json"
      - "automation/q022_design_guard.py"
      - "tests/test_q022_design_guard.py"
      - ".github/workflows/q022-design-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Safety guard
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('Q022 SAFETY OK')"
      - name: Guard regression tests
        run: python -m pytest -q tests/test_q022_design_guard.py
      - name: Execute design-only guard
        run: python -m automation.q022_design_guard
