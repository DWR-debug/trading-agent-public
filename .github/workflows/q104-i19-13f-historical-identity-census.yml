name: Q104 I19 Historical 13F Identity Census
on:
  push:
    branches: [master]
    paths:
      - "automation/q104_i19_13f_historical_identity_census.py"
      - "automation/q104_i19_13f_historical_identity_census_merge.py"
      - "research/preregistrations/q104_i19_13f_historical_identity_census_2026_10_06.json"
      - "research/evidence/q113_13f_q107_coverage_result.json"
      - "tests/test_q104_i19_13f_historical_identity_census.py"
      - ".github/workflows/q104-i19-13f-historical-identity-census.yml"
      - "research/run_requests/q104_i19_census_recovery.trigger"
  workflow_dispatch: {}
permissions:
  actions: write
  contents: write
concurrency:
  group: trading-agent-q104-i19-13f-historical-identity-census
  cancel-in-progress: false
jobs:
  recovery_guard:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Suppress duplicate push-triggered census
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Q104_CENSUS_DISPATCH=WORKFLOW_DISPATCH"
            exit 0
          fi
          for status in in_progress queued pending; do
            if gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" |
              jq -e --arg workflow "$GITHUB_WORKFLOW" --arg run_id "$GITHUB_RUN_ID" '
                .workflow_runs[]?
                | select(.name == $workflow)
                | select((.id | tostring) != $run_id)
              ' >/dev/null; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Q104_CENSUS_DUPLICATE_RUN_SUPPRESSED=true"
              exit 0
            fi
          done
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Q104_CENSUS_DISPATCH=ELIGIBLE"
  source_snapshot:
    needs: [recovery_guard]
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.recovery_guard.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Freeze SEC source page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q104_i19_13f_census/source_snapshot
          python - <<'PY'
          import hashlib,json,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          url="https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets"
          ua="DWR-debug/trading-agent-public Q104-I19 historical 13F census/1.0"
          req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"text/html,*/*","Accept-Encoding":"identity"})
          with urllib.request.urlopen(req,timeout=60) as r: body=r.read()
          root=Path("research/runs/q104_i19_13f_census/source_snapshot")
          root.joinpath("source_page.html").write_bytes(body)
          receipt={"schema_version":"1.0","official_source":url,"captured_at_utc":datetime.now(timezone.utc).isoformat(),"bytes":len(body),"source_page_sha256":hashlib.sha256(body).hexdigest()}
          root.joinpath("source_page_receipt.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload frozen SEC source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-sec-source-snapshot-${{ github.run_id }}
          path: research/runs/q104_i19_13f_census/source_snapshot
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  census:
    concurrency:
      group: ${{ matrix.platform == 'hosted' && format('trading-agent-research-hosted-{0}-slot-{1}', matrix.runner, matrix.slot) || format('trading-agent-research-windows-slot-{0}', matrix.slot) }}
      cancel-in-progress: false
    needs: [source_snapshot]
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: "2013-2016"
            runs_on: '["self-hosted","trading-agent-research"]'
            platform: "windows"
            runner: "windows"
            slot: "A"
          - shard: "2017-2018"
            runs_on: '["self-hosted","trading-agent-research"]'
            platform: "windows"
            runner: "windows"
            slot: "B"
          - shard: "2019-2020"
            runs_on: '["self-hosted","trading-agent-research"]'
            platform: "windows"
            runner: "windows"
            slot: "C"
          - shard: "2021-2022"
            runs_on: '["ubuntu-24.04"]'
            platform: "hosted"
            runner: "ubuntu-24.04"
            slot: "1"
          - shard: "2023"
            runs_on: '["ubuntu-24.04"]'
            platform: "hosted"
            runner: "ubuntu-24.04"
            slot: "2"
          - shard: "2024-2025-09"
            runs_on: '["ubuntu-24.04-arm"]'
            platform: "hosted"
            runner: "ubuntu-24.04-arm"
            slot: "1"
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python 3.13 on hosted runner
        if: matrix.platform == 'hosted'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Python 3.13 on Windows self-hosted runner
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v6
        env:
          # Restrict this bypass to the setup process; never alter machine or user policy.
          PSExecutionPolicyPreference: Bypass
        with:
          python-version: "3.13.15"
          architecture: "x64"
      - name: Download frozen SEC source snapshot
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-sec-source-snapshot-${{ github.run_id }}
          path: research/runs/q104_i19_13f_census/source_snapshot
      - name: Run historical shard on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          if not exist "research\runs\q104_i19_13f_census\${{ matrix.shard }}" mkdir "research\runs\q104_i19_13f_census\${{ matrix.shard }}"
          python.exe -m automation.q104_i19_13f_historical_identity_census --shard "${{ matrix.shard }}" --output "research/runs/q104_i19_13f_census/${{ matrix.shard }}/shard_receipt.json" --page-file "research/runs/q104_i19_13f_census/source_snapshot/source_page.html"
      - name: Run historical shard on hosted runner
        if: matrix.platform == 'hosted'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q104_i19_13f_census/${{ matrix.shard }}"
          python -m automation.q104_i19_13f_historical_identity_census \
            --shard "${{ matrix.shard }}" \
            --output "research/runs/q104_i19_13f_census/${{ matrix.shard }}/shard_receipt.json" \
            --page-file "research/runs/q104_i19_13f_census/source_snapshot/source_page.html"
      - name: Upload shard receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-census-${{ matrix.shard }}-${{ github.run_id }}
          path: research/runs/q104_i19_13f_census/${{ matrix.shard }}/shard_receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  merge:
    needs: [census]
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.census.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q104_i19_13f_census/merged
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "q104-i19-census-*" --dir research/runs/q104_i19_13f_census/merged
      - name: Merge and publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python automation/q104_i19_13f_historical_identity_census_merge.py \
            --input-dir research/runs/q104_i19_13f_census/merged \
            --output research/evidence/q104_i19_13f_historical_identity_census_latest.json
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python3 automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file "research/evidence/q104_i19_13f_historical_identity_census_latest.json=research/evidence/q104_i19_13f_historical_identity_census_latest.json"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1



  completion_relay:
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    needs: [merge]
    uses: ./.github/workflows/research-completion-relay.yml
    with:
      source_workflow: "Q104 I19 Historical 13F Identity Census"

  retry_failed:
    # Rerun only failed jobs once; the second attempt is deliberately terminal.
    # The active matrix remains single-flight and receipt merging stays fail-closed.
    needs: [census, merge]
    if: ${{ always() && github.run_attempt == 1 && (needs.census.result != 'success' || needs.merge.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun only failed jobs from this census attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run rerun "$GITHUB_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
