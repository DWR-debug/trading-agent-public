name: Q104 I19 Historical 13F Identity Census
on:
  push:
    branches: [master]
    paths:
      - "automation/q104_i19_13f_historical_identity_census.py"
      - "automation/q104_i19_13f_historical_identity_census_merge.py"
      - "research/preregistrations/q104_i19_13f_historical_identity_census_2026_10_06.json"
      - "research/evidence/q113_13f_q107_coverage_result.json"
      - "tests/test_q104_i19_13f_historical_identity_census.py"
      - ".github/workflows/q104-i19-13f-historical-identity-census.yml"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trading-agent-q104-i19-13f-historical-identity-census
  cancel-in-progress: true
jobs:
  source_snapshot:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Freeze SEC source page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q104_i19_13f_census/source_snapshot
          python - <<'PY'
          import hashlib,json,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          url="https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets"
          ua="DWR-debug/trading-agent-public Q104-I19 historical 13F census/1.0"
          req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"text/html,*/*","Accept-Encoding":"identity"})
          with urllib.request.urlopen(req,timeout=60) as r: body=r.read()
          root=Path("research/runs/q104_i19_13f_census/source_snapshot")
          root.joinpath("source_page.html").write_bytes(body)
          receipt={"schema_version":"1.0","official_source":url,"captured_at_utc":datetime.now(timezone.utc).isoformat(),"bytes":len(body),"source_page_sha256":hashlib.sha256(body).hexdigest()}
          root.joinpath("source_page_receipt.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload frozen SEC source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-sec-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_13f_census/source_snapshot
          if-no-files-found: error
          retention-days: 30

  windows_census:
    needs: [source_snapshot]
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bootstrap Python
        shell: cmd
        run: |
          setlocal EnableExtensions EnableDelayedExpansion
          set "PY_ROOT=%RUNNER_TEMP%\q104-python-${{ github.run_id }}-${{ github.run_attempt }}"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-${{ github.run_id }}-${{ github.run_attempt }}.nupkg"
          mkdir "!PY_ROOT!"
          curl.exe -L --fail --silent --show-error --retry 3 --retry-delay 2 -o "!PY_PKG!" https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg
          tar.exe -xf "!PY_PKG!" -C "!PY_ROOT!"
          echo !PY_ROOT!>>"%GITHUB_PATH%"
          echo !PY_ROOT!\tools>>"%GITHUB_PATH%"
          endlocal
      - name: Download frozen SEC source snapshot
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-sec-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_13f_census/source_snapshot
      - name: Run 2013-2017 shard
        shell: cmd
        run: |
          if not exist "research\runs\q104_i19_13f_census\2013-2017" mkdir "research\runs\q104_i19_13f_census\2013-2017"
          python.exe -m automation.q104_i19_13f_historical_identity_census --shard "2013-2017" --output "research\runs\q104_i19_13f_census\2013-2017\shard_receipt.json" --page-file "research\runs\q104_i19_13f_census\source_snapshot\source_page.html"
      - name: Upload shard receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-census-2013-2017-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_13f_census/2013-2017/shard_receipt.json
          if-no-files-found: error
          retention-days: 30

  hosted_census:
    concurrency:
      group: trading-agent-research-hosted-${{ matrix.runner }}
      cancel-in-progress: false
    needs: [source_snapshot]
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - shard: "2018-2021"
            runner: "ubuntu-24.04"
          - shard: "2022-2025-09"
            runner: "ubuntu-24.04-arm"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download frozen SEC source snapshot
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-sec-source-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_13f_census/source_snapshot
      - name: Run historical shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q104_i19_13f_census/${{ matrix.shard }}"
          python -m automation.q104_i19_13f_historical_identity_census \
            --shard "${{ matrix.shard }}" \
            --output "research/runs/q104_i19_13f_census/${{ matrix.shard }}/shard_receipt.json" --page-file "research/runs/q104_i19_13f_census/source_snapshot/source_page.html"
      - name: Upload shard receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-census-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_13f_census/${{ matrix.shard }}/shard_receipt.json
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [windows_census, hosted_census]
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.windows_census.result == 'success' && needs.hosted_census.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q104_i19_13f_census/merged
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "q104-i19-census-*" --dir research/runs/q104_i19_13f_census/merged
      - name: Merge and publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path("research/runs/q104_i19_13f_census/merged")
          payloads=[json.loads(p.read_text(encoding="utf-8")) for p in root.rglob("shard_receipt.json")]
          expected={"2013-2017","2018-2021","2022-2025-09"}
          shards={p["shard"] for p in payloads}
          if shards!=expected: raise SystemExit("Q104_I19_MISSING_OR_DUPLICATE_SHARDS")
          urls=[]; source_hashes=set(); frozen=None; archives=[]; conflicts=set(); acceptance_failures={}; acceptance_records=0; target_accessions=0
          for p in payloads:
              source_hashes.add(p["source_page_sha256"])
              if frozen is None: frozen=p["frozen_cusips"]
              elif frozen!=p["frozen_cusips"]: raise SystemExit("Q104_I19_FROZEN_CUSIP_MISMATCH")
              for a in p["archives"]:
                  acceptance_failures.update(a.get("acceptance_failures",{}))
                  acceptance_records += int(a.get("acceptance_record_count",0))
                  target_accessions += int(a.get("target_unique_accession_count",0))
                  for symbol,h in a.get("target_hits",{}).items():
                      if h.get("row_count",0) and not h.get("acceptance_complete",False):
                          raise SystemExit(f"Q104_I19_TARGET_ACCEPTANCE_INCOMPLETE:{symbol}")
                  u=a["archive"]["url"]
                  if u in urls: raise SystemExit("Q104_I19_DUPLICATE_ARCHIVE")
                  urls.append(u); archives.append(a); conflicts.update(a.get("security_identity_conflicts",[]))
          if len(source_hashes)!=1: raise SystemExit("Q104_I19_SOURCE_PAGE_HASH_MISMATCH")
          if acceptance_failures: raise SystemExit("Q104_I19_ACCEPTANCE_TIME_JOIN_FAILED:"+json.dumps(acceptance_failures,sort_keys=True,separators=(",",":")))
          if acceptance_records!=target_accessions: raise SystemExit(f"Q104_I19_ACCEPTANCE_RECORD_COUNT_MISMATCH:{acceptance_records}:{target_accessions}")
          archives.sort(key=lambda x:(x["archive"]["period_start"],x["archive"]["url"]))
          summary={}
          for symbol in sorted(frozen):
              matched=sum(1 for a in archives if a["target_hits"].get(symbol,{}).get("row_count",0)>0)
              summary[symbol]={"archives_with_match":matched,"archives_without_match":len(archives)-matched}
          receipt={"schema_version":"1.0","task_id":"Q-2026-10-06-104-I19-13F-HISTORICAL-ID-CENSUS","candidate_id":"Q104:I19",
                   "status":"13F_HISTORICAL_CUSIP_IDENTITY_CENSUS_COMPLETED_SOURCE_PIT_CLOCK_ONLY","generated_at_utc":datetime.now(timezone.utc).isoformat(),
                   "official_source":"https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets","source_page_sha256":next(iter(source_hashes)),
                   "completed_shards":sorted(shards),"archive_count":len(archives),"frozen_cusips":frozen,"archives":archives,"coverage_summary":summary,"identity_conflicts":sorted(conflicts),
                   "acceptance_time_join":{"target_unique_accessions":target_accessions,"records_checked":acceptance_records,"failures":len(acceptance_failures),"complete":True,"timezone_inference":False},
                   "scientific_boundary":{"performance_authorized":False,"holdout_selection_allowed":False,"ranking_allowed":False,"parameter_search_allowed":False,"threshold_search_allowed":False,"horizon_search_allowed":False,"promotion_allowed":False,"live_execution_allowed":False},
                   "safety":{"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False},
                   "next_gate":"concept-specific PIT compiler + independent reproduction"}
          receipt["receipt_fingerprint"]=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          Path("research/evidence").mkdir(exist_ok=True)
          Path("research/evidence/q104_i19_13f_historical_identity_census_latest.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python3 automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file "research/evidence/q104_i19_13f_historical_identity_census_latest.json=research/evidence/q104_i19_13f_historical_identity_census_latest.json"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

