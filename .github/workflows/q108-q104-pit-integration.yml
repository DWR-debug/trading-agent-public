name: Q108 Q104 PIT Integration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: q108-q104-pit-integration
  cancel-in-progress: false

jobs:
  pit:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Contract tests
        run: python -m pytest -q tests/test_q108_q104_pit_integration.py tests/test_q106_q104_pit_join.py

      - name: Verify Q107 immutable coverage input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/evidence/q107_coverage_result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "coverage_passed"
          assert d["common_calendar_count"] >= 3500
          assert d["scientific_outcome"] == "COVERAGE_PASSED_NO_PERFORMANCE_EVIDENCE"
          assert d["selection_used"] is False
          assert d["holdout_evaluation"] is False
          assert d["performance_evaluation"] is False
          print("Q107 IMMUTABLE INPUT VERIFIED")
          PY

      - name: Q108 real PIT integration audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m automation.q108_q104_pit_integration

      - name: Validate non-authorizing Q108 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/q108_q104_pit_integration/result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "PIT_INTEGRATION_AUDIT_ONLY"
          assert d["governance"]["performance_authorization"] is False
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["candidate_selection"] is False
          print("Q108 NON-AUTHORIZING CONTRACT OK")
          PY

      - name: Publish immutable Q108 receipt
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$BASE_SHA"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$BASE_SHA"             --file research/evidence/q108_pit_integration_2026_10_01.json=research/runs/q108_q104_pit_integration/result.json
