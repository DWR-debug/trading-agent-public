          assert state["engineering_notes"]["q018_candidate_c_status"] == "COVERAGE_VALIDATED"
          assert state["engineering_notes"]["q019_status"] == "COVERAGE_VALIDATED"
          assert state["engineering_notes"]["q019_workflow_run"] == 36238205065
          assert state["engineering_notes"]["q019_artifact_id"] == 10905325799
          assert state["engineering_notes"]["q019_performance_authorized"] is False
          assert state["engineering_notes"]["q020_preregistered"] is True
          assert state["engineering_notes"]["q020_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q018_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q018_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q011_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q011_workflow_run"] == 36121684164
          assert state["engineering_notes"]["q011_artifact_id"] == 10857762336
          assert state["engineering_notes"]["q011_report_fingerprint"] == "08664ed668b61a2e149067cbe10c281f73d27b0b94ed50372877ab1203e97da8"
          assert state["engineering_notes"]["q011_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q012_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q013_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q013_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q014_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q016_execution_status"] == "COMPLETED"
          assert state["engineering_notes"]["q016_scientific_status"] == "DATA_INSUFFICIENT"
          assert state["engineering_notes"]["q016_workflow_run"] == 36172112861
          assert state["engineering_notes"]["q016_result_fingerprint"] == "42250f4c34f3d6ed6a14014fc1c01adf00fadd7427429b783d5fda4de39d48fc"
          assert state["engineering_notes"]["q016_observations"] == 0
          assert state["engineering_notes"]["q016_event_windows"] == 0
          assert state["engineering_notes"]["q016_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q014_workflow_run"] == 36158184847
          assert state["engineering_notes"]["q014_final_artifact_id"] == 10874472512
          assert state["engineering_notes"]["q014_result_fingerprint"] == "ab617984b57cf20ea2ac9e2458ac8a519b139abf8587dab751bd63e1d5d39d6d"
          assert state["engineering_notes"]["q014_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q010_status"] == "COMPLETED"
          assert state["engineering_notes"]["q010_diagnosis_status"] == "DIAGNOSTIC_ONLY"
          assert state["engineering_notes"]["q010_workflow_run"] == 36119705793
          assert state["engineering_notes"]["q010_artifact_id"] == 10856102739
          assert state["engineering_notes"]["q010_diagnosis_fingerprint"] == "c11a4a2340bf4f7a9f132f53835465d57d0b12ab97770a24f3fd98492e7f9549"
          assert state["engineering_notes"]["t043_coverage_status"] == "DATA_INVALID"
          assert state["engineering_notes"]["t043_formal_performance_allowed"] is False
          assert state["engineering_notes"]["t043_scientific_outcome"] == "NO_SCIENTIFIC_OUTCOME"
          assert state["engineering_notes"]["t044_preregistered"] is True
          assert state["engineering_notes"]["t044_coverage_status"] == "PASSED"
          assert state["engineering_notes"]["t044_formal_performance_allowed"] is True
          assert state["engineering_notes"]["t044_formal_completed"] is True
          assert state["engineering_notes"]["t044_scientific_outcome"] == "NO_PROMOTION_EVIDENCE"
          assert state["engineering_notes"]["t045_preregistered"] is True
          assert state["engineering_notes"]["t045_coverage_status"] == "PASSED"
          assert state["engineering_notes"]["t045_formal_performance_allowed"] is True
          assert state["engineering_notes"]["t045_formal_completed"] is True
          assert state["engineering_notes"]["t045_scientific_outcome"] == "NO_PROMOTION_EVIDENCE"
          assert state["engineering_notes"]["t045_universe"] == "validation_2026_09_25_position_lifecycle_exit"
          assert state["engineering_notes"]["t045_requested_candles"] == 3520
          assert state["engineering_notes"]["t045_target_common_calendar"] == 3500

          t043 = next(item for item in ledger["trials"] if item["trial_id"] == "T-2026-09-25-043")
          t044 = next(item for item in ledger["trials"] if item["trial_id"] == "T-2026-09-25-044")
          assert t043["status"] == "data_invalid"
          assert t043["outcome"]["scientific_outcome"] == "NO_SCIENTIFIC_OUTCOME"
          assert t044["status"] == "archived_rejected"
          assert t044["outcome"]["scientific_outcome"] == "NO_PROMOTION_EVIDENCE"

