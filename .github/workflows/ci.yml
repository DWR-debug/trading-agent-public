name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Projektintegrität
        run: python automation/project_integrity_check.py
      - name: Project-State Freshness Guard
        run: python automation/project_state_freshness_check.py
      - name: Research-Governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.asset_universes import get_universe, list_universes
          from research.research_queue import default_research_queue

          prereg = json.loads(Path(
              "research/preregistrations/trial_045_position_lifecycle_exit_2026_09_25.json"
          ).read_text(encoding="utf-8"))

          assert prereg["trial_id"] == "T-2026-09-25-045"
          assert prereg["trial_type"] == "position_lifecycle_exit"
          assert prereg["universe"] == "validation_2026_09_25_position_lifecycle_exit"
          assert prereg["symbols"] == [
              "WFC", "DUK", "AXP", "BLK", "DHR", "INTU", "MAR", "COP",
              "SO", "NEE", "AMGN", "BSX", "CMCSA",
          ]
          universe = get_universe(prereg["universe"])
          assert tuple(universe.symbols) == tuple(prereg["symbols"])
          assert universe.interval == prereg["interval"]
          assert universe.target_count == prereg["requested_candles"] == 3520
          assert prereg["target_candles"] == 3500
          assert prereg["mechanism"]["atr_window_sessions"] == 20
          assert prereg["mechanism"]["atr_multiple"] == 3.0

          assert all(value is False for key, value in prereg["search_scope"].items() if key != "asset_selection_by_performance")
          assert prereg["coverage_gate"]["performance_allowed_before_coverage_pass"] is False
          assert prereg["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }

          task = default_research_queue().next_task()
          assert task is not None
          assert task.task_id == "Q-019-TREASURY-AUCTION-SIGNAL-CONTRACT"
          assert task.research_family == "official_event_signal_contract"

          q015 = json.loads(Path(
              "research/preregistrations/q015_information_alpha_mechanism_discrimination_2026_09_25.json"
          ).read_text(encoding="utf-8"))
          assert q015["task_id"] == "Q-015-INFORMATION-ALPHA-MECHANISM-DISCRIMINATION-DIAGNOSTIC"
          assert q015["source_artifacts"]["workflow_run_id"] == 36158184847
          assert q015["fixed_assets"] == ["SPY", "TLT", "GLD"]
          assert q015["fixed_features"] == [
              "event_count", "attention_score", "source_breadth",
              "article_count", "negative_goldstein", "mean_tone",
          ]
          assert q015["fixed_mechanism_groups"] == {
              "intensity_breadth": ["event_count", "attention_score", "source_breadth", "article_count"],
              "severity": ["negative_goldstein"],
              "tone": ["mean_tone"],
          }
          assert q015["diagnostic_method"]["group_decomposition"].startswith("Exact three-group Shapley decomposition")
          assert q015["minimum_data_contract"]["complete_event_observations_per_asset_horizon"] == 40
          assert q015["performance_trial_authorized"] is False
          assert all(value is False for value in q015["selection"].values())

          expected = set(prereg["symbols"])
          for existing in list_universes():
              if existing.name == prereg["universe"]:
                  continue
              assert not expected.intersection(existing.symbols), existing.name

          print("RESEARCH GOVERNANCE OK")
          PY
      - name: Project-State validieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("research/evidence/project_state.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("research/evidence/trial_ledger.json").read_text(encoding="utf-8"))

          assert state["repository"] == "DWR-debug/trading-agent-public"
          assert state["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          assert state["agent_usage"]["paid_api_budget_usd"] == 0.0
          assert state["agent_usage"]["auto_paid_api_calls"] is False
          assert state["current_preregistered_trial"] == "T-2026-09-25-045"
          assert state["latest_formal_trial"] == "T-2026-09-25-045"
          assert state["latest_trial_status"] == "BLOCKED"
          assert state["current_trial_status"] == "ARCHIVED_REJECTED"
          assert state["engineering_notes"]["current_queue_task"] == "Q-019-TREASURY-AUCTION-SIGNAL-CONTRACT"
          assert state["engineering_notes"]["last_completed_queue_task"] == "Q-018-SOURCE-FEASIBILITY-PREFLIGHT"
          assert state["engineering_notes"]["q017_g3_scientific_status"] == "DATA_INSUFFICIENT"
          assert state["engineering_notes"]["q017_g3_workflow_run"] == 36186285814
          assert state["engineering_notes"]["q017_g3_artifact_id"] == 10887025099
          assert state["engineering_notes"]["q017_g3_performance_authorized"] is False
          assert state["engineering_notes"]["h06_status"] == "MECHANISM_REPLICATED"
          assert state["engineering_notes"]["h06_mechanism_workflow_run"] == 36236202675
          assert state["engineering_notes"]["h06_mechanism_artifact_id"] == 10903879100
          assert state["engineering_notes"]["h06_mechanism_result_fingerprint"] == "45546b7a2b69c39f961cab85f9ab091d165f5e9a711777fb23dd717f82fc9fbd"
          assert state["engineering_notes"]["q018_preregistered"] is True
          assert state["engineering_notes"]["q018_status"] == "SOURCE_FEASIBILITY_COMPLETE"
          assert state["engineering_notes"]["q018_overall_status"] == "DATA_INSUFFICIENT"
          assert state["engineering_notes"]["q018_candidate_c_status"] == "COVERAGE_VALIDATED"
          assert state["engineering_notes"]["q018_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q018_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q011_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q011_workflow_run"] == 36121684164
          assert state["engineering_notes"]["q011_artifact_id"] == 10857762336
          assert state["engineering_notes"]["q011_report_fingerprint"] == "08664ed668b61a2e149067cbe10c281f73d27b0b94ed50372877ab1203e97da8"
          assert state["engineering_notes"]["q011_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q012_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q013_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q013_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q014_status"] == "COMPLETED_DISCOVERY_ONLY"
          assert state["engineering_notes"]["q016_execution_status"] == "COMPLETED"
          assert state["engineering_notes"]["q016_scientific_status"] == "DATA_INSUFFICIENT"
          assert state["engineering_notes"]["q016_workflow_run"] == 36172112861
          assert state["engineering_notes"]["q016_result_fingerprint"] == "42250f4c34f3d6ed6a14014fc1c01adf00fadd7427429b783d5fda4de39d48fc"
          assert state["engineering_notes"]["q016_observations"] == 0
          assert state["engineering_notes"]["q016_event_windows"] == 0
          assert state["engineering_notes"]["q016_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q014_workflow_run"] == 36158184847
          assert state["engineering_notes"]["q014_final_artifact_id"] == 10874472512
          assert state["engineering_notes"]["q014_result_fingerprint"] == "ab617984b57cf20ea2ac9e2458ac8a519b139abf8587dab751bd63e1d5d39d6d"
          assert state["engineering_notes"]["q014_performance_trial_authorized"] is False
          assert state["engineering_notes"]["q010_status"] == "COMPLETED"
          assert state["engineering_notes"]["q010_diagnosis_status"] == "DIAGNOSTIC_ONLY"
          assert state["engineering_notes"]["q010_workflow_run"] == 36119705793
          assert state["engineering_notes"]["q010_artifact_id"] == 10856102739
          assert state["engineering_notes"]["q010_diagnosis_fingerprint"] == "c11a4a2340bf4f7a9f132f53835465d57d0b12ab97770a24f3fd98492e7f9549"
          assert state["engineering_notes"]["t043_coverage_status"] == "DATA_INVALID"
          assert state["engineering_notes"]["t043_formal_performance_allowed"] is False
          assert state["engineering_notes"]["t043_scientific_outcome"] == "NO_SCIENTIFIC_OUTCOME"
          assert state["engineering_notes"]["t044_preregistered"] is True
          assert state["engineering_notes"]["t044_coverage_status"] == "PASSED"
          assert state["engineering_notes"]["t044_formal_performance_allowed"] is True
          assert state["engineering_notes"]["t044_formal_completed"] is True
          assert state["engineering_notes"]["t044_scientific_outcome"] == "NO_PROMOTION_EVIDENCE"
          assert state["engineering_notes"]["t045_preregistered"] is True
          assert state["engineering_notes"]["t045_coverage_status"] == "PASSED"
          assert state["engineering_notes"]["t045_formal_performance_allowed"] is True
          assert state["engineering_notes"]["t045_formal_completed"] is True
          assert state["engineering_notes"]["t045_scientific_outcome"] == "NO_PROMOTION_EVIDENCE"
          assert state["engineering_notes"]["t045_universe"] == "validation_2026_09_25_position_lifecycle_exit"
          assert state["engineering_notes"]["t045_requested_candles"] == 3520
          assert state["engineering_notes"]["t045_target_common_calendar"] == 3500

          t043 = next(item for item in ledger["trials"] if item["trial_id"] == "T-2026-09-25-043")
          t044 = next(item for item in ledger["trials"] if item["trial_id"] == "T-2026-09-25-044")
          assert t043["status"] == "data_invalid"
          assert t043["outcome"]["scientific_outcome"] == "NO_SCIENTIFIC_OUTCOME"
          assert t044["status"] == "archived_rejected"
          assert t044["outcome"]["scientific_outcome"] == "NO_PROMOTION_EVIDENCE"

          print("PROJECT STATE OK")
          PY
