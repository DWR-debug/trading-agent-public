name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Projektintegrität
        run: python automation/project_integrity_check.py
      - name: Research-Governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.asset_universes import get_universe
          from research.research_queue import default_research_queue

          prereg = json.loads(Path(
              "research/preregistrations/trial_039_network_momentum_2026_09_24.json"
          ).read_text(encoding="utf-8"))
          universe = get_universe(prereg["universe"])
          assert tuple(universe.symbols) == tuple(prereg["symbols"])
          assert universe.interval == prereg["interval"]
          assert universe.target_count == prereg["requested_candles"]

          task = default_research_queue().next_task()
          assert task is not None
          assert task.task_id == "Q-001-T040-NETWORK-MOMENTUM-REPAIR"
          assert task.research_family == "cross_asset_network_momentum"

          assert prereg["search_scope"]["holdout_used_for_selection"] is False
          assert prereg["coverage_gate"]["performance_allowed_before_coverage_pass"] is False
          assert prereg["target_candles"] == 3500
          assert prereg["research_candles"] == 2800
          assert prereg["holdout_candles"] == 700
          assert prereg["split"]["pit_research_return_periods"] == 2798
          assert prereg["split"]["pit_return_periods_total"] == 3498
          assert prereg["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          print("RESEARCH GOVERNANCE OK")
          PY
      - name: Project-State validieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('research/evidence/project_state.json').read_text(encoding='utf-8'))
          assert state['repository'] == 'DWR-debug/trading-agent-public'
          assert state['safety'] == {'paper_only': True, 'live_trading_enabled': False, 'orders_enabled': False}
          assert state['agent_usage']['paid_api_budget_usd'] == 0.0
          assert state['agent_usage']['auto_paid_api_calls'] is False
          assert state['agent_usage']['free_credit_only'] is True
          print('PROJECT STATE OK')
          PY
