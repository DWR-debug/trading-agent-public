name: Q022 H1 Directional Inversion Performance

on:
  push:
    branches:
      - research/execute-q022-h1-performance
    paths:
      - automation/q022_h1_directional_inversion_performance.py
      - research/preregistrations/q022_h1_directional_inversion_performance_2026_09_26.json
      - research/authorizations/q022_h1_directional_inversion_performance_2026_09_26.json
      - tests/test_q022_h1_directional_inversion_performance.py
      - .github/workflows/q022-h1-directional-inversion-performance.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q022-h1-directional-inversion-performance
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Execute authorized performance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY OK")
          PY
          python -m pytest -q tests/test_q022_h1_directional_inversion_design.py tests/test_q022_h1_directional_inversion_performance.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("research/authorizations/q022_h1_directional_inversion_performance_2026_09_26.json").read_text(encoding="utf-8"))
          assert a["authorized"] is True
          assert a["performance_execution_authorized"] is True
          assert a["execution_scope"] == "PERFORMANCE"
          assert a["coverage_workflow_run_id"] > 0
          assert a["coverage_artifact_id"] > 0
          assert a["snapshot_fingerprint"]
          assert a["signal_events_fingerprint"]
          print("PERFORMANCE AUTHORIZATION OK")
          PY
          mkdir -p "${RUNNER_TEMP}/q022-h1-download"
          COVERAGE_RUN="$(python -c 'import json; print(json.load(open("research/authorizations/q022_h1_directional_inversion_performance_2026_09_26.json"))["coverage_workflow_run_id"])')"
          gh run download "$COVERAGE_RUN" --repo "$GITHUB_REPOSITORY" --dir "${RUNNER_TEMP}/q022-h1-download/q022"
          gh run download 36238205065 --repo "$GITHUB_REPOSITORY" --name q019-treasury-contract --dir "${RUNNER_TEMP}/q022-h1-download/q019"
          MANIFEST="$(find "${RUNNER_TEMP}/q022-h1-download/q022" -name 'coverage_preflight_*.json' -print -quit)"
          test -n "$MANIFEST"
          DATA_DIR="$(find "${RUNNER_TEMP}/q022-h1-download/q022" -type d -name datasets -print -quit)"
          test -n "$DATA_DIR"
          mkdir -p research/runs/q022_h1_directional_inversion/T-2026-09-26-047-PERFORMANCE
          python -m automation.q022_h1_directional_inversion_performance \
            --manifest "$MANIFEST" \
            --data-dir "$DATA_DIR" \
            --signal-contract "${RUNNER_TEMP}/q022-h1-download/q019/q019_treasury_signal_contract.json" \
            --authorization "research/authorizations/q022_h1_directional_inversion_performance_2026_09_26.json" \
            --output "research/runs/q022_h1_directional_inversion/T-2026-09-26-047-PERFORMANCE/result.json"
          echo Q022_H1_PERFORMANCE_COMPLETE

      - name: Publish performance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q022-h1-directional-inversion-performance-${{ github.run_id }}
          path: research/runs/q022_h1_directional_inversion/
          if-no-files-found: warn
          retention-days: 30
