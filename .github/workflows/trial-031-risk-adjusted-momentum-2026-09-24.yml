name: Trial 031 Risk Adjusted Momentum 2026-09-24

on:
  push:
    branches:
      - "research/trial-031-risk-adjusted-momentum-2026-09-24"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-trial-031-risk-adjusted-momentum
  cancel-in-progress: false

jobs:
  prereq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Trial-031-Universe prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.asset_universes import get_universe, list_universes
          expected=("EIS","EPU","ECH","EWS","EWM","EZA","TUR","THD","VDC","VCR","VOX","IAT","XTN")
          target=get_universe("validation_2026_09_24_risk_adjusted_momentum_candidate")
          assert tuple(target.symbols)==expected
          assert target.target_count==3500
          for item in list_universes():
              if item.name!=target.name:
                  assert set(expected).isdisjoint(item.symbols), item.name
          print("TRIAL_031_UNIVERSE_DISJOINT_OK")
          PY
      - name: Coverage-Preflight prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/checkpoints/trial_031_coverage_preflight_2026_09_24.json").read_text(encoding="utf-8")) if Path("research/checkpoints/trial_031_coverage_preflight_2026_09_24.json").exists() else None
          assert c is not None, "Coverage-Preflight-Checkpoint fehlt im Branch"
          assert c["trial_id"]=="T-2026-09-24-031"
          assert c["status"]=="coverage_passed"
          assert c["common_calendar_count"]>=3500
          assert c["performance_selection_used"] is False
          print("TRIAL_031_COVERAGE_CHECKPOINT_OK:",c["common_calendar_count"])
          PY
      - name: Kostenvertrag prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from execution.cost_contract import ResearchExecutionCostContract
          c=ResearchExecutionCostContract()
          c.validate()
          assert c.fee_bps==10.0 and c.slippage_bps==5.0 and c.total_one_way_bps==15.0
          print("TRIAL_031_COST_CONTRACT_OK")
          PY

  research:
    needs: prereq
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Forschungsdaten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_2026_09_24_risk_adjusted_momentum_candidate             --output research/trial_031_risk_adjusted_momentum_2026_09_24/manifest.json
      - name: Trial-031-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.trial_031_risk_adjusted_momentum_2026_09_24             --data-dir data/market_data             --manifest research/trial_031_risk_adjusted_momentum_2026_09_24/manifest.json             --output research/trial_031_risk_adjusted_momentum_2026_09_24/report.json
      - name: Ergebnisintegrität prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("research/trial_031_risk_adjusted_momentum_2026_09_24/report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          stored=r.pop("report_fingerprint")
          actual=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert stored==actual
          assert r["trial_id"]=="T-2026-09-24-031"
          assert r["status"]=="COMPLETED"
          assert r["research_only"] is True
          assert r["source"]["common_returns"]==3498
          assert r["source"]["research_count"]==2798
          assert r["source"]["holdout_count"]==700
          assert r["source"]["fully_symbol_disjoint"] is True
          assert r["methodology"]["parameter_search"] is False
          assert r["methodology"]["holdout_used_for_selection"] is False
          assert r["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False}
          print("TRIAL_031_RESULT_INTEGRITY_OK")
          print("TRIAL_031_REPORT_FINGERPRINT:",stored)
          print("TRIAL_031_CANDIDATE_STATUS:",r["candidate_status"])
          print("TRIAL_031_CHECKS:",json.dumps(r["gate_contract"],sort_keys=True))
          PY
      - name: Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trial-031-risk-adjusted-momentum
          path: |
            research/trial_031_risk_adjusted_momentum_2026_09_24/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
