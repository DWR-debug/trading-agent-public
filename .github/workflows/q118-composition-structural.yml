name: Q118 Composition Structural Validation

on:
  schedule:
    - cron: "35 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/candidate_composition_structural.py"
      - "tests/test_candidate_composition_structural.py"
      - "docs/research_design/CANDIDATE_COMPOSITION_CONTRACT_2026-10-01.md"
      - ".github/workflows/q118-composition-structural.yml"

permissions:
  contents: read

jobs:
  structural:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m pip install --disable-pip-version-check pytest && python -m pytest -q tests/test_candidate_composition_structural.py
      - name: Synthetic structural validation
        run: python -m automation.candidate_composition_structural --output research/runs/q118_composition_structural/result.json
      - name: Boundary guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q118_composition_structural/result.json").read_text())
          assert p["status"]=="COMPOSITION_STRUCTURAL_VALIDATION_COMPLETED"
          assert p["order_invariance"] is True
          assert p["governance"]["performance"] is False
          assert p["governance"]["holdout"] is False
          assert p["safety"]["paper_only"] is True
          print("Q118_STRUCTURAL_BOUNDARY=PASS")
          print("Q118_RECEIPT=",p["receipt_fingerprint"])
          PY
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q118-composition-structural-${{ github.run_id }}
          path: research/runs/q118_composition_structural/result.json
          if-no-files-found: error
          retention-days: 30
