name: Self-hosted Research Dispatch Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 10
    steps:
      - name: Dispatch registration probe
        shell: cmd
        run: |
          @echo off
          echo SELF-HOSTED DISPATCH PROBE
          echo event=%GITHUB_EVENT_NAME%
          echo ref=%GITHUB_REF%
