name: Q114 13F Manager Position Transition Contract

on:
  push:
    branches: [master]
    paths:
      - "automation/q114_13f_manager_transitions.py"
      - "tests/test_q114_13f_manager_transitions.py"
      - "research/preregistrations/q114_13f_manager_transitions_2026_10_01.json"
      - ".github/workflows/q114-13f-manager-transitions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q114-13f-manager-transitions
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False"
      - name: Contract tests
        run: python -m pytest -q tests/test_q114_13f_manager_transitions.py
