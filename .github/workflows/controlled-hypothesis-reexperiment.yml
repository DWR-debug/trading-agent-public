name: Controlled Hypothesis Re-Experiment

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPLAY_RUN_ID: "35766606233"
  REPLAY_ARTIFACT_NAME: "rolling-geometry-archive-replay-exact"
  REFERENCE_RUN_ID: "35747170025"
  REFERENCE_DATA_FINGERPRINTS: "IWM=51a385563ebd0a3a659d844bcbeccab354f79fd52c1d521633865ff0de476821,QQQ=7923245473b99e9f9f32dafe58d48c3ba101454048eba04a9c14508aacc3b52f,SPY=8c62c32b84fa68b7633670302f90a7f935dc047a1a7ae33cc0e561e79f8266a3"

jobs:
  verify:
    if: ${{ github.head_ref == 'research/controlled-hypothesis-reexperiment-2026-09-22' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Gegenexperiment-Regressionstests
        run: python -m pytest -q tests/test_controlled_hypothesis_reexperiment.py
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

  reexperiment:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'research/controlled-hypothesis-reexperiment-2026-09-22') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Verifiziertes Replay-Artifact laden
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.REPLAY_ARTIFACT_NAME }}
          path: source_replay
          run-id: ${{ env.REPLAY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay-Quelle und Roharchiv laden
        run: |
          set -euo pipefail
          find source_replay -maxdepth 6 -type f -print | sort
          test -d source_replay
          echo "EXACT REPLAY ARTIFACT DOWNLOADED"
      - name: Gepaarte kontrollierte Gegenanalyse
        run: |
          set -euo pipefail
          python -m automation.controlled_hypothesis_reexperiment \
            --rolling-json source_replay/research/rolling_geometry_control/rolling_geometry_control.json \
            --manifest-json source_replay/research/rolling_geometry_control/data_manifest.json \
            --data-dir source_replay/data/market_data \
            --output-dir research/controlled_hypothesis_reexperiment
      - name: Gegenexperiment-Artifact sichern
        uses: actions/upload-artifact@v4
        with:
          name: controlled-hypothesis-reexperiment
          path: research/controlled_hypothesis_reexperiment/
          if-no-files-found: error
          retention-days: 30

  sixth_dispersion_validation:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/cs-dispersion-budget-sixth-validation-2026-09-24' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Sechste Trend-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_2026_09_24_sixth_trend             --output research/cs_dispersion_budget_sixth_validation_2026_09_24/data_trend_manifest.json
      - name: Sechste CS-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_2026_09_24_sixth_cs             --output research/cs_dispersion_budget_sixth_validation_2026_09_24/data_cs_manifest.json
      - name: Disjunktheit fail-closed prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.asset_universes import get_universe, list_universes
          names = (
              "validation_2026_09_24_sixth_trend",
              "validation_2026_09_24_sixth_cs",
          )
          sets = [set(get_universe(name).symbols) for name in names]
          assert sets[0].isdisjoint(sets[1])
          combined = sets[0] | sets[1]
          for universe in list_universes():
              if universe.name in names:
                  continue
              assert combined.isdisjoint(universe.symbols), (
                  f"Overlap with {universe.name}"
              )
          print("SIXTH_VALIDATION_FULLY_DISJOINT_OK")
          PY
      - name: Präregistrierung fail-closed prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.cs_dispersion_budget_sixth_validation_2026_09_24 import (
              CS_DISPERSION_LOOKBACK, CS_REBALANCE, CS_SKIP, CS_TOP_N,
              DISPERSION_REFERENCE_WINDOW,
          )
          assert (CS_DISPERSION_LOOKBACK, CS_REBALANCE, CS_SKIP, CS_TOP_N) == (21, 21, 21, 2)
          assert DISPERSION_REFERENCE_WINDOW == 63
          text = Path(
              "docs/cs_dispersion_budget_sixth_validation_2026_09_24_preregistration.md"
          ).read_text(encoding="utf-8")
          for token in (
              "CS-Dispersion-Risikobudget",
              "21-Session",
              "63",
              "2798",
              "700",
              "T-2026-09-24-010",
              "PAPER_ONLY=True",
          ):
              assert token in text
          print("PREREGISTRATION_VERIFIED")
          PY
      - name: Sechste Validierung ausführen
        run: |
          set -euo pipefail
          python -m automation.cs_dispersion_budget_sixth_validation_2026_09_24             --trend-data-dir data/market_data             --trend-manifest research/cs_dispersion_budget_sixth_validation_2026_09_24/data_trend_manifest.json             --cs-data-dir data/market_data             --cs-manifest research/cs_dispersion_budget_sixth_validation_2026_09_24/data_cs_manifest.json             --output research/cs_dispersion_budget_sixth_validation_2026_09_24/report.json
      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("research/cs_dispersion_budget_sixth_validation_2026_09_24/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(report, sort_keys=True, separators=(",", ":"), ensure_ascii=True, allow_nan=False).encode("utf-8")
          ).hexdigest()
          assert stored == actual
          assert report["source"]["portfolio_return_count"] == 3498
          assert report["source"]["fully_symbol_disjoint_validation_set"] is True
          assert report["methodology"]["parameter_search"] is False
          assert report["methodology"]["threshold_search"] is False
          assert report["methodology"]["variant_search"] is False
          assert report["methodology"]["holdout_used_for_selection"] is False
          assert report["safety"] == {"paper_only": True, "live_trading_enabled": False, "orders_enabled": False}
          print("CS_DISPERSION_BUDGET_RESULT_INTEGRITY_OK")
          print("RESEARCH_HYPOTHESIS_STATUS:", report["research_hypothesis_status"])
          print("HOLDOUT_CONFIRMATION_STATUS:", report["holdout_confirmation_status"])
          print("RESEARCH_VALIDATION_STATUS:", report["research_validation_status"])
          print("REPORT_FINGERPRINT:", stored)
          print("DISPERSION_DIAGNOSTICS:", report["dispersion_diagnostics"])
          PY
      - name: Validierungsartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-dispersion-budget-sixth-validation-controlled-${{ github.run_id }}
          path: research/cs_dispersion_budget_sixth_validation_2026_09_24/
          if-no-files-found: error
          retention-days: 30
