name: Free AI Worker Fabric

on:
  push:
    branches: [master]
    paths:
      - "ai_requests/AI-2026-09-29-Q091-ADVERSARIAL.json"
      - ".github/workflows/ai-worker-fabric.yml"
      - "automation/ai_worker_fabric.py"
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  worker:
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      matrix:
        provider: [gemini_cli, mistral_api, openrouter_free, claude_cli]
        task:
          - AI-2026-09-29-Q091-ADVERSARIAL
          - AI-2026-09-28-Q089-ADVERSARIAL
          - AI-2026-09-28-UNUSUAL-FRONTIER
    concurrency:
      group: trading-agent-ai-${{ matrix.provider }}-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gemini CLI
        if: matrix.provider == 'gemini_cli'
        shell: bash
        run: npm install -g @google/gemini-cli@latest

      - name: Resolve task file
        id: task
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.task }}' in
            AI-2026-09-29-Q091-ADVERSARIAL) echo 'path=ai_requests/AI-2026-09-29-Q091-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-28-Q089-ADVERSARIAL) echo 'path=ai_requests/AI-2026-09-28-Q089-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-28-UNUSUAL-FRONTIER) echo 'path=ai_requests/AI-2026-09-28-UNUSUAL-FRONTIER.json' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Run free-only AI worker
        id: worker
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FREE_MODE_CONFIRMED: ${{ secrets.GEMINI_FREE_MODE_CONFIRMED }}
          CLAUDE_FREE_MODE_CONFIRMED: ${{ secrets.CLAUDE_FREE_MODE_CONFIRMED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_FREE_MODE_CONFIRMED: ${{ secrets.MISTRAL_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-worker-output"
          set +e
          python -m automation.ai_worker_fabric --run --provider '${{ matrix.provider }}' --task '${{ steps.task.outputs.path }}' --output "$RUNNER_TEMP/ai-worker-output/${{ matrix.task }}-${{ matrix.provider }}.json"
          rc=$?
          set -e
          test "$rc" -ne 1

      - name: Publish operational state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir='ops/ai_worker_state'
          mkdir -p "$state_dir"
          state_file="$state_dir/${{ matrix.task }}__${{ matrix.provider }}.json"
          output="$RUNNER_TEMP/ai-worker-output/${{ matrix.task }}-${{ matrix.provider }}.json"
          if [ -f "$output" ]; then
            cp "$output" "$state_file"
          else
            printf '%s\n' '{"schema_version":1,"task_id":"${{ matrix.task }}","provider":"${{ matrix.provider }}","status":"NO_OUTPUT","worker_output_is_scientific_evidence":false}' > "$state_file"
          fi
          payload="$(base64 -w 0 "$state_file")"
          for _ in 1 2 3 4 5; do
            current_sha=""
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/${state_file}?ref=master" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$current_sha" ]; then
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record AI worker state' -f content="$payload" -f branch='master' -f sha="$current_sha" >/dev/null; then
                exit 0
              fi
            else
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record AI worker state' -f content="$payload" -f branch='master' >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Unable to publish operational AI-worker state after retries.' >&2
          exit 1

      - name: Assert OpenRouter free route
        if: matrix.provider == 'openrouter_free'
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"openrouter/free"' automation/openrouter_free.py
          grep -q 'FREE_MODEL = "openrouter/free"' automation/openrouter_free.py

      - name: Upload AI worker output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-worker-${{ matrix.task }}-${{ matrix.provider }}-${{ github.run_id }}
          path: "$RUNNER_TEMP/ai-worker-output/"
          if-no-files-found: warn
          retention-days: 14
