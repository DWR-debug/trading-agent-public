name: Free AI Worker Fabric

# AI reviews are routed only from the active three-candidate pipeline or explicit manual dispatch.
# No broad workflow_run/push fan-out is allowed while the focus lock is active.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Bounded review for one of the three active candidates"
        required: true
        type: choice
        options:
          - AI-2026-10-08-Q104-I19-CENSUS-COMPILER-ADVERSARIAL
          - AI-2026-10-10-Q220-ASFILED-MAPPING-ADVERSARIAL
          - AI-2026-10-06-Q218-TOP4-ADVERSARIAL
      run_secondary_provider:
        description: "Also run the manual Gemini/Mistral secondary review rotation"
        required: true
        default: false
        type: boolean
      use_litellm_transport:
        description: "Use the optional fail-closed LiteLLM transport for the OpenRouter worker"
        required: true
        default: false
        type: boolean
permissions:
  actions: write
  contents: write

jobs:
  plan_openrouter:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - name: Checkout changed commits
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate focused review task
        id: plan
        shell: bash
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          allowed = {
              "AI-2026-10-08-Q104-I19-CENSUS-COMPILER-ADVERSARIAL",
              "AI-2026-10-10-Q220-ASFILED-MAPPING-ADVERSARIAL",
              "AI-2026-10-06-Q218-TOP4-ADVERSARIAL",
          }
          task = os.environ.get("TASK_ID", "").strip()
          if task not in allowed:
              raise SystemExit(f"AI_TASK_OUTSIDE_ACTIVE_FOCUS:{task}")
          path = Path("ai_requests") / f"{task}.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("task_id") != task:
              raise SystemExit("AI_TASK_ID_FILE_MISMATCH")
          for flag in ("holdout_selection", "parameter_selection", "asset_selection", "threshold_selection",
                       "horizon_selection", "research_gate_changes", "promotion_decision", "live_execution",
                       "paid_usage", "research_decision", "allow_workspace_writes"):
              if payload.get(flag, False) is not False:
                  raise SystemExit(f"AI_TASK_UNSAFE_FLAG:{flag}")
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              "tasks=" + json.dumps([task]) + "\\n"
          )
          print(f"FOCUSED_AI_TASK_ACCEPTED={task}")
          PY

  worker:
    needs: plan_openrouter
    if: ${{ needs.plan_openrouter.outputs.tasks != '["__none__"]' }}

    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan_openrouter.outputs.tasks) }}
    concurrency:
      group: trading-agent-ai-openrouter-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Optional LiteLLM transport
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_litellm_transport == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ai.txt

      - name: Resolve task file
        id: task
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.task }}' in
            AI-2026-09-29-Q091-ADVERSARIAL) echo 'path=ai_requests/AI-2026-09-29-Q091-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-28-Q089-ADVERSARIAL) echo 'path=ai_requests/AI-2026-09-28-Q089-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-28-UNUSUAL-FRONTIER) echo 'path=ai_requests/AI-2026-09-28-UNUSUAL-FRONTIER.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-30-Q100-FRONTIER-FEASIBILITY) echo 'path=ai_requests/AI-2026-09-30-Q100-FRONTIER-FEASIBILITY.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-30-Q101-NEGATIVE-EVIDENCE) echo 'path=ai_requests/AI-2026-09-30-Q101-NEGATIVE-EVIDENCE.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-09-30-Q102-REGIME-STATE-DESIGN) echo 'path=ai_requests/AI-2026-09-30-Q102-REGIME-STATE-DESIGN.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-02-AGENT-027-ORCHESTRATION-AUDIT) echo 'path=ai_requests/AI-2026-10-02-AGENT-027-ORCHESTRATION-AUDIT.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-04-Q187-Q192-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-04-Q187-Q192-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT) echo 'path=ai_requests/AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-06-Q218-TOP4-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-06-Q218-TOP4-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-06-Q219-TOP4-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-06-Q219-TOP4-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-06-Q220-TOP4-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-06-Q220-TOP4-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-06-Q221-TOP4-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-06-Q221-TOP4-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            AI-2026-10-08-Q104-I19-CENSUS-COMPILER-ADVERSARIAL) echo 'path=ai_requests/AI-2026-10-08-Q104-I19-CENSUS-COMPILER-ADVERSARIAL.json' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Run free-only AI worker
        id: worker
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRADING_AGENT_LITELLM_TRANSPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_litellm_transport == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-worker-output"
          set +e
          python -m automation.ai_worker_fabric --run --provider 'openrouter_free' --task '${{ steps.task.outputs.path }}' --output "$RUNNER_TEMP/ai-worker-output/${{ matrix.task }}-openrouter_free.json"
          rc=$?
          set -e
          test "$rc" -ne 1

      - name: Publish operational state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir='ops/ai_worker_state'
          mkdir -p "$state_dir"
          state_file="$state_dir/${{ matrix.task }}__openrouter_free.json"
          output="$RUNNER_TEMP/ai-worker-output/${{ matrix.task }}-openrouter_free.json"
          if [ -f "$output" ]; then
            cp "$output" "$state_file"
          else
            printf '%s\n' '{"schema_version":1,"task_id":"${{ matrix.task }}","provider":"openrouter_free","status":"NO_OUTPUT","worker_output_is_scientific_evidence":false}' > "$state_file"
          fi
          payload="$(base64 -w 0 "$state_file")"
          for _ in 1 2 3 4 5; do
            current_sha=""
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/${state_file}?ref=master" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$current_sha" ]; then
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record AI worker state' -f content="$payload" -f branch='master' -f sha="$current_sha" >/dev/null; then
                exit 0
              fi
            else
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record AI worker state' -f content="$payload" -f branch='master' >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Unable to publish operational AI-worker state after retries.' >&2
          exit 1

      - name: Assert OpenRouter free route
        if: matrix.task != '__none__'
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"openrouter/free"' automation/openrouter_free.py
          grep -q 'FREE_MODEL = "openrouter/free"' automation/openrouter_free.py

      - name: Upload AI worker output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-worker-${{ matrix.task }}-openrouter_free-${{ github.run_id }}
          path: "$RUNNER_TEMP/ai-worker-output/"
          if-no-files-found: warn
          retention-days: 14

  gemini_worker:
    # Individual-account Gemini CLI traffic moved to Antigravity; keep this
    # legacy API-key worker manual-only to avoid scheduled 503 churn.
    if: >-
      ${{ github.repository == 'DWR-debug/trading-agent-public' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_secondary_provider == 'true' }}
    concurrency:
      group: trading-agent-ai-gemini-free
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Gemini CLI
        shell: bash
        run: npm install -g @google/gemini-cli@latest

      - name: Select deterministic Gemini rotation slot
        id: task
        shell: bash
        run: |
          set -euo pipefail
          slot=$(( $(date -u +%s) / 21600 % 7 ))
          case "$slot" in
            0) task_id='AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT' ;;
            1) task_id='AI-2026-09-29-Q091-ADVERSARIAL' ;;
            2) task_id='AI-2026-09-28-Q089-ADVERSARIAL' ;;
            3) task_id='AI-2026-09-28-UNUSUAL-FRONTIER' ;;
            4) task_id='AI-2026-09-30-Q100-FRONTIER-FEASIBILITY' ;;
            5) task_id='AI-2026-09-30-Q101-NEGATIVE-EVIDENCE' ;;
            6) task_id='AI-2026-09-30-Q102-REGIME-STATE-DESIGN' ;;
            *) exit 1 ;;
          esac
          path="ai_requests/$task_id.json"
          test -f "$path"
          {
            echo "slot=$slot"
            echo "task_id=$task_id"
            echo "path=$path"
          } >> "$GITHUB_OUTPUT"
          echo "GEMINI_ROTATION slot=$slot task=$task_id"

      - name: Run Gemini free-only worker
        id: worker
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FREE_MODE_CONFIRMED: ${{ secrets.GEMINI_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-worker-output"
          set +e
          python -m automation.ai_worker_fabric --run --provider 'gemini_cli' --task "${{ steps.task.outputs.path }}" --output "$RUNNER_TEMP/ai-worker-output/${{ steps.task.outputs.task_id }}-gemini_cli.json"
          rc=$?
          set -e
          test "$rc" -ne 1

      - name: Publish Gemini operational state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir='ops/ai_worker_state'
          mkdir -p "$state_dir"
          state_file="$state_dir/${{ steps.task.outputs.task_id }}__gemini_cli.json"
          output="$RUNNER_TEMP/ai-worker-output/${{ steps.task.outputs.task_id }}-gemini_cli.json"
          if [ -f "$output" ]; then
            cp "$output" "$state_file"
          else
            printf '%s\n' '{"schema_version":1,"task_id":"${{ steps.task.outputs.task_id }}","provider":"gemini_cli","status":"NO_OUTPUT","worker_output_is_scientific_evidence":false}' > "$state_file"
          fi
          payload="$(base64 -w 0 "$state_file")"
          for _ in 1 2 3 4 5; do
            current_sha=""
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/${state_file}?ref=master" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$current_sha" ]; then
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Gemini worker state' -f content="$payload" -f branch='master' -f sha="$current_sha" >/dev/null; then
                exit 0
              fi
            else
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Gemini worker state' -f content="$payload" -f branch='master' >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Unable to publish Gemini operational state after retries.' >&2
          exit 1

      - name: Assert Gemini fixed free-mode route
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'gemini-3.7-flash' automation/ai_worker_fabric.py

      - name: Upload Gemini worker output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-worker-${{ steps.task.outputs.task_id }}-gemini_cli-${{ github.run_id }}
          path: "$RUNNER_TEMP/ai-worker-output/"
          if-no-files-found: warn
          retention-days: 14
  mistral_worker:
    # Mistral is retained as an opportunistic manual worker while the observed
    # hosted endpoint is rate-limited; OpenRouter + local Antigravity remain
    # the scheduled free paths.
    if: >-
      ${{ github.repository == 'DWR-debug/trading-agent-public' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.run_secondary_provider == 'true' }}
    concurrency:
      group: trading-agent-ai-mistral-free
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Select deterministic Mistral rotation slot
        id: task
        shell: bash
        run: |
          set -euo pipefail
          slot=$(( $(date -u +%s) / 21600 % 7 ))
          case "$slot" in
            0) task_id='AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT' ;;
            1) task_id='AI-2026-09-29-Q091-ADVERSARIAL' ;;
            2) task_id='AI-2026-09-28-Q089-ADVERSARIAL' ;;
            3) task_id='AI-2026-09-28-UNUSUAL-FRONTIER' ;;
            4) task_id='AI-2026-09-30-Q100-FRONTIER-FEASIBILITY' ;;
            5) task_id='AI-2026-09-30-Q101-NEGATIVE-EVIDENCE' ;;
            6) task_id='AI-2026-09-30-Q102-REGIME-STATE-DESIGN' ;;
            *) exit 1 ;;
          esac
          case "$task_id" in
            AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT) path='ai_requests/AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT.json' ;;
            AI-2026-09-29-Q091-ADVERSARIAL) path='ai_requests/AI-2026-09-29-Q091-ADVERSARIAL.json' ;;
            AI-2026-09-28-Q089-ADVERSARIAL) path='ai_requests/AI-2026-09-28-Q089-ADVERSARIAL.json' ;;
            AI-2026-09-28-UNUSUAL-FRONTIER) path='ai_requests/AI-2026-09-28-UNUSUAL-FRONTIER.json' ;;
            AI-2026-09-30-Q100-FRONTIER-FEASIBILITY) path='ai_requests/AI-2026-09-30-Q100-FRONTIER-FEASIBILITY.json' ;;
            AI-2026-09-30-Q101-NEGATIVE-EVIDENCE) path='ai_requests/AI-2026-09-30-Q101-NEGATIVE-EVIDENCE.json' ;;
            AI-2026-09-30-Q102-REGIME-STATE-DESIGN) path='ai_requests/AI-2026-09-30-Q102-REGIME-STATE-DESIGN.json' ;;
            *) exit 1 ;;
          esac
          {
            echo "slot=$slot"
            echo "task_id=$task_id"
            echo "path=$path"
          } >> "$GITHUB_OUTPUT"
          echo "MISTRAL_ROTATION slot=$slot task=$task_id"

      - name: Run Mistral free-only worker
        id: worker
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_FREE_MODE_CONFIRMED: ${{ secrets.MISTRAL_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-worker-output"
          set +e
          python -m automation.ai_worker_fabric --run --provider 'mistral_api' --task "${{ steps.task.outputs.path }}" --output "$RUNNER_TEMP/ai-worker-output/${{ steps.task.outputs.task_id }}-mistral_api.json"
          rc=$?
          set -e
          test "$rc" -ne 1

      - name: Publish Mistral operational state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir='ops/ai_worker_state'
          mkdir -p "$state_dir"
          state_file="$state_dir/${{ steps.task.outputs.task_id }}__mistral_api.json"
          output="$RUNNER_TEMP/ai-worker-output/${{ steps.task.outputs.task_id }}-mistral_api.json"
          if [ -f "$output" ]; then
            cp "$output" "$state_file"
          else
            printf '%s\n' '{"schema_version":1,"task_id":"${{ steps.task.outputs.task_id }}","provider":"mistral_api","status":"NO_OUTPUT","worker_output_is_scientific_evidence":false}' > "$state_file"
          fi
          payload="$(base64 -w 0 "$state_file")"
          for _ in 1 2 3 4 5; do
            current_sha=""
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/${state_file}?ref=master" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$current_sha" ]; then
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Mistral worker state' -f content="$payload" -f branch='master' -f sha="$current_sha" >/dev/null; then
                exit 0
              fi
            else
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Mistral worker state' -f content="$payload" -f branch='master' >/dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Unable to publish Mistral operational state after retries.' >&2
          exit 1

      - name: Assert Mistral fixed free-mode route
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FREE_MODEL="mistral-small-latest"' automation/mistral_free.py

      - name: Upload Mistral worker output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-worker-${{ steps.task.outputs.task_id }}-mistral_api-${{ github.run_id }}
          path: "$RUNNER_TEMP/ai-worker-output/"
          if-no-files-found: warn
          retention-days: 14


  completion_relay:
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    needs: [plan_openrouter, worker, gemini_worker, mistral_worker]
    uses: ./.github/workflows/research-completion-relay.yml
    with:
      source_workflow: "Free AI Worker Fabric"
