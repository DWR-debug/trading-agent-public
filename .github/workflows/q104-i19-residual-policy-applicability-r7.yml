name: Q104 I19 Residual Filing-Date Policy Applicability R7

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q104_i19_residual_policy_applicability_r7.trigger"

permissions:
  actions: read
  contents: read

concurrency:
  group: q104-i19-residual-policy-applicability-r7
  cancel-in-progress: false

jobs:
  capture-x64:
    name: Ubuntu x64 — capture 19 frozen residual headers
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      analysis_fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Install bounded test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused preregistration, provenance and workflow tests
        run: >-
          python -m pytest -q
          tests/test_q104_i19_residual_policy_applicability_review_r7.py

      - name: Validate exact immutable upstream runs and artifacts before any source request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_source() {
            local run_id="$1" expected_name="$2" expected_conclusion="$3" expected_sha="$4" artifact_id="$5" artifact_name="$6"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/r7-run.json"
            jq -e --arg name "$expected_name" --arg conclusion "$expected_conclusion" --arg sha "$expected_sha" --argjson id "$run_id" '
              .id == $id and .name == $name and .head_branch == "master" and
              .head_sha == $sha and .status == "completed" and .conclusion == $conclusion
            ' "$RUNNER_TEMP/r7-run.json" >/dev/null
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$RUNNER_TEMP/r7-artifacts.json"
            jq -e --arg name "$artifact_name" --argjson id "$artifact_id" '
              [.artifacts[]? | select(.id == $id and .name == $name and .expired == false)] | length == 1
            ' "$RUNNER_TEMP/r7-artifacts.json" >/dev/null
          }

          # The failed recovery run is itself the frozen 53-case evidence source.
          check_source "38250105408" "Q104 I19 Receipt-Gated Targeted Acceptance Repair Request" "failure" "e8b6bbfa1fc707686ddc56340209e0219b0b0e16" "11747003791" "q104-i19-targeted-acceptance-repair-38168441086-38250105408-2"
          check_source "38557631541" "Candidate Next-Gate Wave — Six Runner Pool" "success" "b7d7d6ec2692a320b05e93adc87db39d35d4539b" "11890995910" "q104-cross-vintage-38557631541-1"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/38557631541/artifacts?per_page=100" > "$RUNNER_TEMP/r7-artifacts.json"
          jq -e '[.artifacts[]? | select(.id == 11891525016 and .name == "q104-cross-vintage-ubuntu-arm-38557631541-1" and .expired == false)] | length == 1' "$RUNNER_TEMP/r7-artifacts.json" >/dev/null
          check_source "38574180245" "Q104 I19 Residual Source-Lineage Diagnostic R4" "success" "6d6f35197adc8851431496e696e6d392502bddb0" "11899236364" "q104-i19-residual-lineage-r4-38574180245-1"
          check_source "38582684174" "Q104 I19 Residual Source-Lineage Diagnostic R5" "success" "1ba78a10889ea4ecf4fbe68dea84cc2835482bbd" "11902804060" "q104-i19-residual-lineage-r5-38582684174-1"
          check_source "38588100012" "Q104 I19 Residual Source-Lineage Diagnostic R6" "success" "41f985b03544c261560ad52b63324fcff155e696" "11905763813" "q104-i19-residual-lineage-r6-38588100012-1"

      - name: Download exact frozen 53-row recovery artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-targeted-acceptance-repair-38168441086-38250105408-2
          path: q104-r7-input/recovery
          run-id: 38250105408
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact cross-vintage x64 artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-cross-vintage-38557631541-1
          path: q104-r7-input/x64
          run-id: 38557631541
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact cross-vintage ARM64 artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-cross-vintage-ubuntu-arm-38557631541-1
          path: q104-r7-input/arm64
          run-id: 38557631541
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact R4 lineage receipt
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-lineage-r4-38574180245-1
          path: q104-r7-input/r4
          run-id: 38574180245
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact R5 lineage receipt
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-lineage-r5-38582684174-1
          path: q104-r7-input/r5
          run-id: 38582684174
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download exact R6 lineage receipt
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-lineage-r6-38588100012-1
          path: q104-r7-input/r6
          run-id: 38588100012
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Capture only three exact quarterly archives and 57 bounded header routes (no-new-primary-document requests)
        run: |
          set -euo pipefail
          mkdir -p q104-r7-capture
          python -m automation.q104_i19_residual_policy_applicability_review_r7 capture \
            --request research/run_requests/q104_i19_residual_policy_applicability_r7.trigger \
            --recovery-artifact q104-r7-input/recovery \
            --x64-artifact q104-r7-input/x64 \
            --arm64-artifact q104-r7-input/arm64 \
            --r4-artifact q104-r7-input/r4 \
            --r5-artifact q104-r7-input/r5 \
            --r6-artifact q104-r7-input/r6 \
            --output-dir q104-r7-capture

      - name: Freeze the deterministic analysis fingerprint
        id: fingerprint
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("q104-r7-capture/analysis.json")
          if not path.is_file():
              raise SystemExit("Q104_R7_ANALYSIS_RECEIPT_MISSING")
          row = json.loads(path.read_text(encoding="utf-8"))
          if row["analysis"].get("status") != "Q104_I19_RESIDUAL_POLICY_APPLICABILITY_REVIEW_COMPLETE_PROPOSAL_NOT_APPLIED":
              raise SystemExit("Q104_R7_ANALYSIS_NOT_COMPLETE")
          print("value=" + row["analysis_fingerprint"])
          PY

      - name: Preserve bounded capture plus immutable source fingerprints, not downloaded source bodies
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: q104-r7-capture/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  replay-arm64:
    name: Ubuntu ARM64 — independent offline reproduction
    needs: [capture-x64]
    if: needs.capture-x64.result == 'success' && github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      analysis_fingerprint: ${{ steps.replay.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Install bounded test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Re-run frozen-contract tests on ARM64
        run: >-
          python -m pytest -q
          tests/test_q104_i19_residual_policy_applicability_review_r7.py

      - name: Download x64 bundle containing only receipts and header metadata
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: q104-r7-capture
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Independently reproduce from saved metadata with zero network requests
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q104_i19_residual_policy_applicability_review_r7 replay \
            --request research/run_requests/q104_i19_residual_policy_applicability_r7.trigger \
            --capture-dir q104-r7-capture \
            --output-dir q104-r7-arm64 \
            --expected-analysis-fingerprint "${{ needs.capture-x64.outputs.analysis_fingerprint }}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          value = json.loads(Path("q104-r7-arm64/analysis.json").read_text(encoding="utf-8"))
          print("value=" + value["analysis_fingerprint"])
          PY

      - name: Preserve ARM64 deterministic review receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: q104-r7-arm64/analysis.json
          if-no-files-found: error
          retention-days: 30

  publish-receipt:
    name: Verify cross-architecture agreement and publish review-only receipt
    needs: [capture-x64, replay-arm64]
    if: needs.capture-x64.result == 'success' && needs.replay-arm64.result == 'success' && github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Download x64 analysis receipt
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: q104-r7-x64
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download ARM64 analysis receipt
        uses: actions/download-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: q104-r7-arm64
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Build final cross-architecture receipt with all scientific gates closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m automation.q104_i19_residual_policy_applicability_review_r7 publish \
            --x64-dir q104-r7-x64 \
            --arm64-dir q104-r7-arm64 \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --output research/evidence/q104_i19_residual_policy_applicability_latest.json
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha latest \
            --file "research/evidence/q104_i19_residual_policy_applicability_latest.json=research/evidence/q104_i19_residual_policy_applicability_latest.json"

      - name: Preserve immutable final review receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-residual-policy-r7-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q104_i19_residual_policy_applicability_latest.json
          if-no-files-found: warn
          retention-days: 30
