name: Q104 I19 As-Filed XBRL Source Probe

on:
  push:
    branches: [master]
    paths:
      - "automation/q104_i19_asfiled_xbrl_source_probe.py"
      - "tests/test_q104_i19_asfiled_xbrl_source_probe.py"
      - ".github/workflows/q104-i19-asfiled-xbrl-source-probe.yml"
      - "research/evidence/q108_pit_integration_2026_10_01.json"
      - "research/preregistrations/q104_i19_xbrl_concept_freeze_2026_10_03.json"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q104-i19-asfiled-xbrl-source-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: A
            symbols: "SPGI NDAQ AMP RJF"
          - group: B
            symbols: "WMB VLO DVN EMN"
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap Python
        shell: cmd
        run: |
          setlocal EnableExtensions EnableDelayedExpansion
          set "PY_ROOT=%RUNNER_TEMP%\q104-xbrl-python-${{ github.run_id }}-${{ matrix.group }}"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-${{ github.run_id }}-${{ matrix.group }}.nupkg"
          mkdir "!PY_ROOT!"
          curl.exe -L --fail --silent --show-error --retry 3 --retry-delay 2 -o "!PY_PKG!" https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg
          tar.exe -xf "!PY_PKG!" -C "!PY_ROOT!"
          echo !PY_ROOT!>>"%GITHUB_PATH%"
          echo !PY_ROOT!\tools>>"%GITHUB_PATH%"
          endlocal

      - name: Run bounded as-filed XBRL source probe
        shell: cmd
        run: |
          mkdir "research\runs\q104_i19_asfiled_xbrl_source_probe"
          python.exe automation\q104_i19_asfiled_xbrl_source_probe.py --symbols ${{ matrix.symbols }} --output "research\runs\q104_i19_asfiled_xbrl_source_probe\group-${{ matrix.group }}.json"

      - name: Upload source probe receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-asfiled-xbrl-probe-group-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_asfiled_xbrl_source_probe/group-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [probe]
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.probe.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download probe receipts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q104_i19_asfiled_xbrl_source_probe/merged
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "q104-i19-asfiled-xbrl-probe-group-*" --dir research/runs/q104_i19_asfiled_xbrl_source_probe/merged

      - name: Merge and publish source probe receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("research/runs/q104_i19_asfiled_xbrl_source_probe/merged")
          payloads=[json.loads(p.read_text(encoding="utf-8")) for p in root.rglob("*.json")]
          expected={"SPGI","NDAQ","AMP","RJF","WMB","VLO","DVN","EMN"}
          results={}
          for p in payloads:
              for symbol, item in p.get("issuer_results", {}).items():
                  if symbol in results:
                      raise SystemExit("Q104_I19_XBRL_PROBE_DUPLICATE_SYMBOL:"+symbol)
                  results[symbol]=item
          if set(results) != expected:
              raise SystemExit("Q104_I19_XBRL_PROBE_SYMBOL_SET_MISMATCH")
          if not all(item.get("status") == "PASS_SOURCE_ROUTE" for item in results.values()):
              raise SystemExit("Q104_I19_XBRL_PROBE_CONTROL_FAILURE")
          source = json.loads(Path("research/evidence/q108_pit_integration_2026_10_01.json").read_text(encoding="utf-8"))
          receipt={
            "schema_version":"1.0",
            "record_type":"q104_i19_asfiled_xbrl_source_probe_merged",
            "candidate_id":"Q104:I19",
            "status":"HISTORICAL_AS_FILED_XBRL_SOURCE_PROBE_COMPLETED",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "frozen_universe_source":"research/evidence/q108_pit_integration_2026_10_01.json",
            "concept_freeze_source":"research/preregistrations/q104_i19_xbrl_concept_freeze_2026_10_03.json",
            "symbols":sorted(results),
            "window":{"start":"2013-07-01","cutoff":"2025-09-24"},
            "exact_concepts":[
              "NetIncomeLoss",
              "NetCashProvidedByUsedInOperatingActivities",
              "Assets"
            ],
            "issuer_results":results,
            "frozen_ciks":source.get("sec_ticker_mapping",{}).get("ciks",{}),
            "scientific_boundary":{
              "performance_authorized":False,
              "holdout_selection_allowed":False,
              "ranking_allowed":False,
              "parameter_search_allowed":False,
              "threshold_search_allowed":False,
              "horizon_search_allowed":False,
              "promotion_allowed":False,
              "live_execution_allowed":False
            },
            "safety":{
              "paper_only":True,
              "live_trading_enabled":False,
              "orders_enabled":False,
              "automatic_promotion":False
            },
            "next_gate":"historical as-filed XBRL fact extraction + concept-specific PIT compiler"
          }
          receipt["receipt_fingerprint"]=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          out=Path("research/evidence/q104_i19_asfiled_xbrl_source_probe_latest.json")
          out.write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          base_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          python3 automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q104_i19_asfiled_xbrl_source_probe_latest.json=research/evidence/q104_i19_asfiled_xbrl_source_probe_latest.json

      - name: Upload merged source probe receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-asfiled-xbrl-probe-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q104_i19_asfiled_xbrl_source_probe_latest.json
          if-no-files-found: error
          retention-days: 30
