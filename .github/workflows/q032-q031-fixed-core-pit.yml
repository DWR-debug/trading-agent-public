name: Q032 Q031 Fixed Core PIT Preflight

on:
  push:
    branches:
      - master
    paths:
      - research/preregistrations/q032_q031_fixed_core_pit_2026_09_27.json
      - research/authorizations/q032_q031_fixed_core_pit_2026_09_27.json
      - automation/strategy_pit_preflight.py
      - automation/coverage_preflight.py
      - automation/candidate_validation_50_50_vol_budget.py
      - automation/cross_asset_trend_replication.py
      - research/asset_universes.py
      - tests/test_q032_q031_fixed_core_pit.py
      - .github/workflows/q032-q031-fixed-core-pit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trading-agent-q032-q031-fixed-core-pit
  cancel-in-progress: false

jobs:
  pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0

      - name: Safety and preregistration guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q032_q031_fixed_core_pit_2026_09_27.json").read_text(encoding="utf-8"))
          auth=json.loads(Path("research/authorizations/q032_q031_fixed_core_pit_2026_09_27.json").read_text(encoding="utf-8"))
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True
          assert auth["execution_scope"] == "PIT_ONLY"
          assert auth["performance_execution_authorized"] is False
          assert spec["governance"]["performance_trial_authorized"] is False
          assert spec["governance"]["performance_evaluation"] is False
          assert spec["governance"]["holdout_evaluation"] is False
          assert spec["governance"]["asset_selection_by_performance"] is False
          print("Q032 SAFETY/AUTH OK")
          PY

      - name: Coverage preflight Q031 universe
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q031_q030_risk_stability_coverage_2026_09_27.json --output-root research/runs/q032_coverage

      - name: PIT validate Q031 universe
        run: python -m automation.strategy_pit_preflight --universe-root research/runs/q032_coverage/T-2026-09-27-053-COVERAGE/datasets --output research/runs/q032_pit/T-2026-09-27-054/pit_report.json --universe validation_2026_09_27_q030_risk_stability_coverage --trial-id T-2026-09-27-054 --expected-assets 7

      - name: Validate PIT governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/q032_pit/T-2026-09-27-054/pit_report.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "PIT_PASSED"
          assert d["performance_evaluation"] is False
          assert d["oos_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["governance"]["performance_trial_authorized"] is False
          assert d["governance"]["automatic_promotion"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("Q032 PIT GOVERNANCE PASS")
          print("REPORT_FINGERPRINT:", d["report_fingerprint"])
          PY

      - name: Publish Q032 run summary
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request
          root = Path("research/runs/q032_pit")
          files = sorted(root.rglob("*.json")) if root.exists() else []
          summary = {"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"job_status":os.environ["JOB_STATUS"]}
          if files:
              d=json.loads(files[-1].read_text(encoding="utf-8"))
              summary.update({"trial_id":d.get("trial_id"),"status":d.get("status"),"report_fingerprint":d.get("report_fingerprint"),"performance_evaluation":d.get("performance_evaluation"),"selection_used":d.get("selection_used"),"safety":d.get("safety")})
          body="Q032 run summary\\n\\n"+"\\n".join(f"- {k}: {v}" for k,v in summary.items())
          payload=json.dumps({"body":body}).encode("utf-8")
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/343/comments"
          req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              response.read()
          print("Q032 RUN SUMMARY PUBLISHED")

      - name: Publish PIT evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q032-q031-fixed-core-pit-${{ github.run_id }}
          path: |
            research/runs/q032_coverage/
            research/runs/q032_pit/
          if-no-files-found: error
          retention-days: 30
