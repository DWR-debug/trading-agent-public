name: Q067 Coverage and PIT

on:
  push:
    branches:
      - master
    paths:
      - "research/authorizations/q067_coverage_pit_2026_09_28.json"
      - ".github/workflows/q067-coverage-pit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q067-coverage-pit
  cancel-in-progress: false

jobs:
  q067:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 75
    steps:
      - name: Checkout authorized master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Bootstrap pinned Python 3.13.15
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q067"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q067.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Runner identity and safety gate
        shell: cmd
        run: |
          @echo off
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          if /I not "%GITHUB_REF%"=="refs/heads/master" exit /b 1
          if not defined GITHUB_SHA exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q067\tools\python.exe" -c "import json; from pathlib import Path; p=json.loads(Path('research/preregistrations/q067_fixed_mechanism_freeze_2026_09_28.json').read_text(encoding='utf-8')); assert p['governance']['performance_trial_authorized'] is False; assert p['governance']['holdout_used_for_selection'] is False; assert p['safety']=={'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}; from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('Q067 SELF-HOSTED SAFETY OK')"

      - name: Q067 unit contract tests
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q067\tools\python.exe" -m pytest -q tests/test_q067_alpha_mechanisms.py tests/test_q067_fresh_coverage.py tests/test_q067_pipeline_state.py || exit /b 1

      - name: Fresh coverage and PIT
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q067\tools\python.exe" -m automation.q067_fresh_coverage --preregistration research/preregistrations/q067_fixed_mechanism_freeze_2026_09_28.json --output-root research/runs/q067_coverage --result research/evidence/q067_coverage_result.json || exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q067\tools\python.exe" -m automation.q067_pit --coverage-root research/runs/q067_coverage/T-2026-09-28-067-COVERAGE --result research/evidence/q067_pit_result.json || exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q067\tools\python.exe" -c "import json; from pathlib import Path; c=json.loads(Path('research/evidence/q067_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q067_pit_result.json').read_text(encoding='utf-8')); assert c['status']=='COVERAGE_PASSED'; assert c['performance_trial_authorized'] is False; assert p['status']=='PIT_PASSED'; assert p['performance_trial_authorized'] is False; print('Q067 PREFLIGHT PASSED')"

      - name: Persist preflight receipts
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          git diff --check || exit /b 1
          git add research/runs/q067_coverage research/evidence/q067_coverage_result.json research/evidence/q067_pit_result.json || exit /b 1
          git diff --cached --quiet
          if not errorlevel 1 (
            echo No receipt changes
            exit /b 0
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EVIDENCE: record Q067 coverage and PIT preflight" || exit /b 1
          git push origin HEAD:master || exit /b 1

      - name: Publish summary
        if: always()
        shell: cmd
        run: |
          @echo off
          if exist research\evidence\q067_coverage_result.json type research\evidence\q067_coverage_result.json
          if exist research\evidence\q067_pit_result.json type research\evidence\q067_pit_result.json
          echo Q067_RUNNER=%RUNNER_NAME%
          echo Q067_SHA=%GITHUB_SHA%
          echo Q067_RUN_ID=%GITHUB_RUN_ID%
