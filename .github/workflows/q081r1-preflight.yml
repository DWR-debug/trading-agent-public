name: Q081-R1 Preflight (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q081r1_preflight.trigger"
      - "research/preregistrations/q081r1_performance_2026_09_28.json"
      - "automation/q081r1_corrected_e1_e2_performance.py"
      - ".github/workflows/q081r1-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q081r1-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q081r1.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pandas pytest || exit /b 1

      - name: Verify Q081-R1 preregistration and source contract
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1\tools\python.exe"
          "%PY_EXE%" -c "import hashlib,json; from pathlib import Path; from config import settings; p=json.loads(Path('research/preregistrations/q081r1_performance_2026_09_28.json').read_text(encoding='utf-8')); assert p['trial_id']=='T-2026-09-28-081R1-PERFORMANCE' and p['status']=='PREREGISTERED_PERFORMANCE'; assert p['governance']['performance_trial_authorized'] is False; expected=p['source_contract']; actual={path:hashlib.sha1(('blob '+str(len(Path(path).read_bytes()))).encode()+bytes([0])+Path(path).read_bytes()).hexdigest() for path in expected}; assert actual==expected; assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False; print('Q081R1 SOURCE/SAFETY OK')"

      - name: Verify unchanged Q079 frozen prerequisites
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1\tools\python.exe"
          "%PY_EXE%" -c "import json; from pathlib import Path; p=json.loads(Path('research/preregistrations/q081r1_performance_2026_09_28.json').read_text()); c=json.loads(Path('research/evidence/q079_coverage_result.json').read_text()); h=json.loads(Path('research/evidence/q079_pit_result.json').read_text()); b=json.loads(Path('research/evidence/q079_input_freeze_result.json').read_text()); i=json.loads(Path('research/evidence/q079_performance_execution_incident.json').read_text()); dc=p['data_contract']; assert c['status']=='COVERAGE_PASSED' and c['result_fingerprint']==dc['coverage_result_fingerprint'] and c['snapshot_fingerprint']==dc['snapshot_fingerprint']; assert h['status']=='PIT_PASSED' and h['result_fingerprint']==dc['pit_result_fingerprint']; assert b['status']=='INPUT_BUNDLE_FROZEN' and b['bundle_fingerprint']==dc['input_bundle_fingerprint']; assert i['status']=='IMPLEMENTATION_INVALID_NO_SCIENTIFIC_OUTCOME'; print('Q081R1 FROZEN Q079 OK')"

      - name: Run execution-envelope regression
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_q081_execution_envelope.py

      - name: Run research governance unit tests
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_research_governance_audit.py

      - name: Run fail-closed governance audit
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081r1\tools\python.exe"
          "%PY_EXE%" automation\research_governance_audit.py

      - name: Upload Q081-R1 preflight artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q081r1-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/preregistrations/q081r1_performance_2026_09_28.json
            research/evidence/q079_performance_execution_incident.json
          if-no-files-found: error
          retention-days: 30
