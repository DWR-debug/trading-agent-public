name: C29 Coverage Repair Discovery

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/c29_coverage_repair_discovery_2026_09_30.json"
      - "automation/c29_coverage_repair_discovery.py"
      - "tests/test_c29_coverage_repair_discovery.py"
      - "research/evidence/c29_coverage_execution_incident_2026_09_30.json"
      - ".github/workflows/c29-coverage-repair-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c29-coverage-repair-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Repair discovery contract tests
        run: python -m pytest -q tests/test_c29_coverage_repair_discovery.py

      - name: Coverage-only replacement discovery
        run: python -m automation.c29_coverage_repair_discovery --output research/runs/c29_repair_discovery/result.json

      - name: Validate coverage-only result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/c29_repair_discovery/result.json").read_text(encoding="utf-8"))
          assert d["scientific_outcome"] == "NO_SCIENTIFIC_OUTCOME"
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["candidate_ranking"] is False
          assert d["candidate_selection"] is False
          assert d["performance_authorized"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("C29 REPAIR DISCOVERY CONTRACT OK")
          print("SELECTED_REPLACEMENT:", d["selected_replacement"])
          print("FINGERPRINT:", d["fingerprint"])
          PY

      - name: Upload repair discovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-coverage-repair-discovery-${{ github.run_id }}
          path: research/runs/c29_repair_discovery/result.json
          if-no-files-found: error
          retention-days: 30
