# Trial 027 workflow; run only from the public repository.
name: Trial 027 TSM Ensemble Trend Sleeve 2026-09-24
on:
  push:
    branches: ["research/trial-027-tsm-ensemble-trend-sleeve-2026-09-24"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: trading-agent-trial-027-tsm-ensemble-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  prereq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Sicherheit
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Universe Disjointness
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.asset_universes import get_universe, list_universes
          expected=("IVV","ITOT","SCHX","SCHF","SPAB","IEI","MBB","VCSH","IYJ","IYC","IYM","IYK","IYW")
          target=get_universe("validation_2026_09_24_tsm_ensemble_candidate")
          assert tuple(target.symbols)==expected
          assert target.target_count==3500
          for item in list_universes():
              if item.name!=target.name:
                  assert set(expected).isdisjoint(item.symbols), item.name
          print("TRIAL_027_UNIVERSE_DISJOINT_OK")
          PY
      - name: Präregistrierung prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          doc=Path("docs/trial_027_tsm_ensemble_trend_sleeve_preregistration_2026_09_24.md").read_text(encoding="utf-8")
          required=("T-2026-09-24-027","IVV","ITOT","SCHX","SCHF","SPAB","IEI","MBB","VCSH","IYJ","IYC","IYM","IYK","IYW","3.500","3.498","2.798","700","63","126","252","PAPER_ONLY=True","LIVE_TRADING_ENABLED=False")
          missing=[item for item in required if item not in doc]
          assert not missing,missing
          c=json.loads(Path("research/checkpoints/trial_027_tsm_ensemble_trend_sleeve_preregistration_2026_09_24.json").read_text(encoding="utf-8"))
          assert c["trial_id"]=="T-2026-09-24-027"
          assert c["tsm_lookbacks"]==[63,126,252]
          assert c["strategy_variants"]==1
          assert c["parameter_search"] is False
          assert c["holdout_used_for_selection"] is False
          assert c["orders_enabled"] is False
          print("TRIAL_027_PREREGISTRATION_OK")
          PY
      - name: Kostenvertrag prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from execution.cost_contract import ResearchExecutionCostContract
          c=ResearchExecutionCostContract(); c.validate()
          assert c.fee_bps==10.0 and c.slippage_bps==5.0 and c.total_one_way_bps==15.0
          print("TRIAL_027_COST_CONTRACT_OK")
          PY
  research:
    needs: prereq
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Forschungsdaten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data --target-count 3500 --universe validation_2026_09_24_tsm_ensemble_candidate --output research/trial_027_tsm_ensemble_trend_sleeve_2026_09_24/manifest.json
      - name: Trial-027-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.trial_027_tsm_ensemble_trend_sleeve_2026_09_24 --data-dir data/market_data --manifest research/trial_027_tsm_ensemble_trend_sleeve_2026_09_24/manifest.json --output research/trial_027_tsm_ensemble_trend_sleeve_2026_09_24/report.json
      - name: Ergebnisintegrität prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/trial_027_tsm_ensemble_trend_sleeve_2026_09_24/report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          stored=r.pop("report_fingerprint")
          actual=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert stored==actual
          assert r["trial_id"]=="T-2026-09-24-027"
          assert r["status"]=="COMPLETED"
          assert r["research_only"] is True
          assert r["methodology"]["optimization_used"] is False
          assert r["methodology"]["holdout_used_for_selection"] is False
          assert r["source"]["common_returns"]==3498
          assert r["source"]["research_count"]==2798
          assert r["source"]["holdout_count"]==700
          assert r["source"]["fully_symbol_disjoint"] is True
          assert r["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False}
          print("TRIAL_027_RESULT_INTEGRITY_OK")
          print("TRIAL_027_REPORT_FINGERPRINT:",stored)
          print("TRIAL_027_CANDIDATE_STATUS:",r["candidate_status"])
          print("TRIAL_027_CHECKS:",json.dumps(r["gate_contract"],sort_keys=True))
          PY
      - name: Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trial-027-tsm-ensemble-trend-sleeve
          path: |
            research/trial_027_tsm_ensemble_trend_sleeve_2026_09_24/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
