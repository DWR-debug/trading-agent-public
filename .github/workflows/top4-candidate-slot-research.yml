name: Top-4 Candidate Slot Research
run-name: Top-4 Slot ${{ inputs.resource }} ${{ inputs.candidate }} ${{ inputs.gate }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "One independent bounded active Top-3 candidate workpack"
        required: true
        type: choice
        options:
          - Q220
          - Q221
      resource:
        description: "Exact capacity class to fill"
        required: true
        type: choice
        options:
          - windows
          - ubuntu_x64
          - ubuntu_arm64
      focus_wave:
        description: "Legacy compatibility input; keep false for active Q220/Q221 workpacks"
        required: true
        default: false
        type: boolean
      gate:
        description: "Legacy gate selector; active Top-3 workpacks use all"
        required: true
        default: all
        type: choice
        options:
          - all
          - source
          - event_pair

permissions:
  actions: write
  contents: write

concurrency:
  group: trading-agent-top4-${{ inputs.resource }}-${{ inputs.candidate }}-${{ inputs.gate }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ inputs.resource == 'windows' }}
    name: Top-4 slot Windows ${{ inputs.candidate }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Check completed Q218 focus gate
        id: q218_focus_gate
        if: ${{ inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "Q218_GATE=${{ inputs.gate }}"
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ^
            "$gate = $env:Q218_GATE; $path = if ($gate -eq 'source') { 'automation/q218_sec_multichannel_source_gate.py' } else { 'automation/q218_sec_event_pair_lineage_gate.py' }; $skip = $false; if (Test-Path 'research/evidence/q218_focus_gate_receipt_index_latest.json') { $d = Get-Content -Raw 'research/evidence/q218_focus_gate_receipt_index_latest.json' | ConvertFrom-Json; $rec = if ($gate -eq 'source') { $d.source_gate } else { $d.event_pair_gate }; $expected = [string]$rec.gate_code_blob_sha; $bytes = [System.IO.File]::ReadAllBytes($path); $prefix = [System.Text.Encoding]::UTF8.GetBytes(('blob ' + $bytes.Length + [char]0)); $all = New-Object byte[] ($prefix.Length + $bytes.Length); [Array]::Copy($prefix,0,$all,0,$prefix.Length); [Array]::Copy($bytes,0,$all,$prefix.Length,$bytes.Length); $sha = ([System.Security.Cryptography.SHA1]::Create()).ComputeHash($all); $actual = ([BitConverter]::ToString($sha) -replace '-','').ToLowerInvariant(); $skip = ($rec.verified_positive_complete -eq $true -and $expected -and $expected -eq $actual) }; Add-Content -Path $env:GITHUB_OUTPUT -Value ('skip=' + $skip.ToString().ToLowerInvariant()); Write-Output ('Q218_COMPLETED_FOCUS_GATE_NOOP=' + $skip.ToString().ToLowerInvariant())"
          if errorlevel 1 exit /b 1
          endlocal
      - name: Run bounded candidate workpack
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-top4-slot"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-top4-slot.nupkg"
          if not exist "%PY_EXE%" (
          	curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
          	if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
          	tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf || exit /b 1
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          set "PYTHONPATH=%GITHUB_WORKSPACE%"
          if not exist "%GITHUB_WORKSPACE%\research\runs\top4\${{ inputs.candidate }}\%GITHUB_RUN_ID%" mkdir "%GITHUB_WORKSPACE%\research\runs\top4\${{ inputs.candidate }}\%GITHUB_RUN_ID%"
          if /I "${{ inputs.gate }}"=="all" (
            "%PY_EXE%" -m automation.top4_candidate_capacity --candidate "${{ inputs.candidate }}" --output-dir "%GITHUB_WORKSPACE%\research\runs\top4\${{ inputs.candidate }}\%GITHUB_RUN_ID%"
            if errorlevel 1 exit /b 1
          ) else if /I "${{ inputs.gate }}"=="source" (
            if /I not "${{ inputs.candidate }}"=="Q218" exit /b 1
            "%PY_EXE%" -m automation.q218_sec_multichannel_source_gate --output "%GITHUB_WORKSPACE%\research\runs\top4\Q218\%GITHUB_RUN_ID%\source\receipt.json"
            if errorlevel 1 exit /b 1
            "%PY_EXE%" -m pytest -q tests/test_q218_sec_multichannel_source_gate.py tests/test_q218_q221_candidate_gate_compiler.py
            if errorlevel 1 exit /b 1
          ) else if /I "${{ inputs.gate }}"=="event_pair" (
            if /I not "${{ inputs.candidate }}"=="Q218" exit /b 1
            "%PY_EXE%" -m automation.q218_sec_event_pair_lineage_gate --output "%GITHUB_WORKSPACE%\research\runs\top4\Q218\%GITHUB_RUN_ID%\event_pair\receipt.json"
            if errorlevel 1 exit /b 1
            "%PY_EXE%" -m pytest -q tests/test_q218_sec_event_pair_lineage_gate.py tests/test_q218_q221_candidate_gate_compiler.py
            if errorlevel 1 exit /b 1
          )
          endlocal
      - name: Enforce scientific boundary
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' }}
        shell: cmd
        run: echo SLOT_RESEARCH_BOUNDARY=PAPER_ONLY_NO_PERFORMANCE_NO_HOLDOUT_NO_RANKING_NO_TUNING_NO_PROMOTION_NO_LIVE_EXECUTION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: top4-slot-windows-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/top4/${{ inputs.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish current Q218 focus-gate receipt index
        if: ${{ success() && inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-top4-slot\tools\python.exe"
          if /I "${{ inputs.gate }}"=="source" (
            set "RECEIPT=research\runs\top4\Q218\%GITHUB_RUN_ID%\source\receipt.json"
          ) else (
            set "RECEIPT=research\runs\top4\Q218\%GITHUB_RUN_ID%\event_pair\receipt.json"
          )
          "%PY_EXE%" automation/q218_publish_focus_gate_receipt.py --gate "${{ inputs.gate }}" --receipt "%RECEIPT%" --run-id ${{ github.run_id }}
          if errorlevel 1 exit /b 1
          for /f "delims=" %%S in ('C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "(gh api '/repos/$env:GITHUB_REPOSITORY/git/ref/heads/master' --jq '.object.sha')"') do set "CURRENT_SHA=%%S"
          if not defined CURRENT_SHA exit /b 1
          "%PY_EXE%" automation/github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%CURRENT_SHA%" --file "research/evidence/q218_focus_gate_receipt_index_latest.json=research/evidence/q218_focus_gate_receipt_index_latest.json"
          if errorlevel 1 exit /b 1
          endlocal


  ubuntu_x64:
    if: ${{ inputs.resource == 'ubuntu_x64' }}
    name: Top-4 slot Ubuntu x64 ${{ inputs.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf
      - name: Validate focused-gate inputs
        env:
          Q218_CANDIDATE: ${{ inputs.candidate }}
          Q218_FOCUS_WAVE: ${{ inputs.focus_wave }}
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" != "all" ]] && { [[ "$Q218_CANDIDATE" != "Q218" ]] || [[ "$Q218_FOCUS_WAVE" != "true" ]]; }; then
            echo "Focused source/event_pair gates require candidate=Q218 and focus_wave=true" >&2
            exit 2
          fi
      - name: Check completed Q218 focus gate
        id: q218_focus_gate
        if: ${{ inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" == "source" ]]; then
            code_path="automation/q218_sec_multichannel_source_gate.py"
            receipt_key="source_gate"
          else
            code_path="automation/q218_sec_event_pair_lineage_gate.py"
            receipt_key="event_pair_gate"
          fi
          skip=false
          index_path="research/evidence/q218_focus_gate_receipt_index_latest.json"
          if [[ -s "$index_path" ]]; then
            verified="$(jq -r --arg key "$receipt_key" '.[$key].verified_positive_complete // false' "$index_path")"
            expected="$(jq -r --arg key "$receipt_key" '.[$key].gate_code_blob_sha // ""' "$index_path")"
            actual="$(git rev-parse "HEAD:$code_path")"
            if [[ "$verified" == "true" && -n "$expected" && "$expected" == "$actual" ]]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Q218_COMPLETED_FOCUS_GATE_NOOP=$skip"
      - name: Run bounded candidate workpack
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' && inputs.gate == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/top4/${{ inputs.candidate }}/${GITHUB_RUN_ID}"
          python -m automation.top4_candidate_capacity --candidate "${{ inputs.candidate }}" --output-dir "research/runs/top4/${{ inputs.candidate }}/${GITHUB_RUN_ID}"
      - name: Run focused Q218 source or event-pair gate
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' && inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          run_root="research/runs/top4/Q218/${GITHUB_RUN_ID}"
          if [[ "$Q218_GATE" == "source" ]]; then
            mkdir -p "$run_root/source"
            python -m automation.q218_sec_multichannel_source_gate --output "$run_root/source/receipt.json"
            python -m pytest -q tests/test_q218_sec_multichannel_source_gate.py tests/test_q218_q221_candidate_gate_compiler.py
          elif [[ "$Q218_GATE" == "event_pair" ]]; then
            mkdir -p "$run_root/event_pair"
            python -m automation.q218_sec_event_pair_lineage_gate --output "$run_root/event_pair/receipt.json"
            python -m pytest -q tests/test_q218_sec_event_pair_lineage_gate.py tests/test_q218_q221_candidate_gate_compiler.py
          else
            echo "Unsupported focused Q218 gate: $Q218_GATE" >&2
            exit 2
          fi
      - name: Enforce scientific boundary
        run: echo SLOT_RESEARCH_BOUNDARY=PAPER_ONLY_NO_PERFORMANCE_NO_HOLDOUT_NO_RANKING_NO_TUNING_NO_PROMOTION_NO_LIVE_EXECUTION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: top4-slot-ubuntu-x64-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/top4/${{ inputs.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish current Q218 focus-gate receipt index
        if: ${{ success() && inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          GH_TOKEN: ${{ github.token }}
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" == "source" ]]; then
            receipt="research/runs/top4/Q218/${GITHUB_RUN_ID}/source/receipt.json"
          else
            receipt="research/runs/top4/Q218/${GITHUB_RUN_ID}/event_pair/receipt.json"
          fi
          python automation/q218_publish_focus_gate_receipt.py --gate "$Q218_GATE" --receipt "$receipt" --run-id "$GITHUB_RUN_ID"
          current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test -n "$current_sha"
          python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file research/evidence/q218_focus_gate_receipt_index_latest.json=research/evidence/q218_focus_gate_receipt_index_latest.json


  ubuntu_arm64:
    if: ${{ inputs.resource == 'ubuntu_arm64' }}
    name: Top-4 slot ARM64 ${{ inputs.candidate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf
      - name: Validate focused-gate inputs
        env:
          Q218_CANDIDATE: ${{ inputs.candidate }}
          Q218_FOCUS_WAVE: ${{ inputs.focus_wave }}
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" != "all" ]] && { [[ "$Q218_CANDIDATE" != "Q218" ]] || [[ "$Q218_FOCUS_WAVE" != "true" ]]; }; then
            echo "Focused source/event_pair gates require candidate=Q218 and focus_wave=true" >&2
            exit 2
          fi
      - name: Check completed Q218 focus gate
        id: q218_focus_gate
        if: ${{ inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" == "source" ]]; then
            code_path="automation/q218_sec_multichannel_source_gate.py"
            receipt_key="source_gate"
          else
            code_path="automation/q218_sec_event_pair_lineage_gate.py"
            receipt_key="event_pair_gate"
          fi
          skip=false
          index_path="research/evidence/q218_focus_gate_receipt_index_latest.json"
          if [[ -s "$index_path" ]]; then
            verified="$(jq -r --arg key "$receipt_key" '.[$key].verified_positive_complete // false' "$index_path")"
            expected="$(jq -r --arg key "$receipt_key" '.[$key].gate_code_blob_sha // ""' "$index_path")"
            actual="$(git rev-parse "HEAD:$code_path")"
            if [[ "$verified" == "true" && -n "$expected" && "$expected" == "$actual" ]]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Q218_COMPLETED_FOCUS_GATE_NOOP=$skip"
      - name: Run bounded candidate workpack
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' && inputs.gate == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/top4/${{ inputs.candidate }}/${GITHUB_RUN_ID}"
          python -m automation.top4_candidate_capacity --candidate "${{ inputs.candidate }}" --output-dir "research/runs/top4/${{ inputs.candidate }}/${GITHUB_RUN_ID}"
      - name: Run focused Q218 source or event-pair gate
        if: ${{ steps.q218_focus_gate.outputs.skip != 'true' && inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          run_root="research/runs/top4/Q218/${GITHUB_RUN_ID}"
          if [[ "$Q218_GATE" == "source" ]]; then
            mkdir -p "$run_root/source"
            python -m automation.q218_sec_multichannel_source_gate --output "$run_root/source/receipt.json"
            python -m pytest -q tests/test_q218_sec_multichannel_source_gate.py tests/test_q218_q221_candidate_gate_compiler.py
          elif [[ "$Q218_GATE" == "event_pair" ]]; then
            mkdir -p "$run_root/event_pair"
            python -m automation.q218_sec_event_pair_lineage_gate --output "$run_root/event_pair/receipt.json"
            python -m pytest -q tests/test_q218_sec_event_pair_lineage_gate.py tests/test_q218_q221_candidate_gate_compiler.py
          else
            echo "Unsupported focused Q218 gate: $Q218_GATE" >&2
            exit 2
          fi
      - name: Enforce scientific boundary
        run: echo SLOT_RESEARCH_BOUNDARY=PAPER_ONLY_NO_PERFORMANCE_NO_HOLDOUT_NO_RANKING_NO_TUNING_NO_PROMOTION_NO_LIVE_EXECUTION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: top4-slot-ubuntu-arm64-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/top4/${{ inputs.candidate }}/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish current Q218 focus-gate receipt index
        if: ${{ success() && inputs.candidate == 'Q218' && inputs.focus_wave && (inputs.gate == 'source' || inputs.gate == 'event_pair') }}
        env:
          GH_TOKEN: ${{ github.token }}
          Q218_GATE: ${{ inputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$Q218_GATE" == "source" ]]; then
            receipt="research/runs/top4/Q218/${GITHUB_RUN_ID}/source/receipt.json"
          else
            receipt="research/runs/top4/Q218/${GITHUB_RUN_ID}/event_pair/receipt.json"
          fi
          python automation/q218_publish_focus_gate_receipt.py --gate "$Q218_GATE" --receipt "$receipt" --run-id "$GITHUB_RUN_ID"
          current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test -n "$current_sha"
          python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file research/evidence/q218_focus_gate_receipt_index_latest.json=research/evidence/q218_focus_gate_receipt_index_latest.json



  completion_relay:
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    needs: [windows, ubuntu_x64, ubuntu_arm64]
    uses: ./.github/workflows/research-completion-relay.yml
    with:
      source_workflow: "Top-4 Candidate Slot Research"
