name: Isolated Evidence-Critic Lab
on:
  push:
    branches: [master]
    paths:
      - "research/benchmarks/evidence_critic_pilot_2026_10_01.jsonl"
      - "research/benchmarks/evidence_critic_pilot_2026_10_01.manifest.json"
      - "automation/evidence_critic_benchmark.py"
      - "tests/test_evidence_critic_benchmark.py"
      - "docs/research_design/EVIDENCE_CRITIC_LAB_2026-10-01.md"
      - "research/run_requests/evidence_critic_lab.trigger"
      - ".github/workflows/evidence-critic-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trading-agent-evidence-critic-lab
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: jeff
            min_memory_gb: 10
            endpoint: http://127.0.0.1:8079
            install: jeff
          - model: laya-typed-decisions
            min_memory_gb: 4
            endpoint: http://127.0.0.1:8090
            install: laya
          - model: kev-0.8b
            min_memory_gb: 6
            endpoint: http://127.0.0.1:8009
            install: kev
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 90
    steps:
      - name: Download exact repository snapshot
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\ecl-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-${{ matrix.install }}"
          set "ARCHIVE=%RUNNER_TEMP%\ecl-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-${{ matrix.install }}.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          for /d %%D in ("%WORK%\trading-agent-public-*") do echo REPO_SRC=%%~fD>>"%GITHUB_ENV%"
          endlocal
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-ecl"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-ecl.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal
      - name: Resource preflight
        id: resources
        shell: cmd
        run: |
          @echo off
          setlocal
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$total=(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory; $need=[int]'${{ matrix.min_memory_gb }}'; $bytesPerGb=1073741824; $totalGb=[int]($total/$bytesPerGb); if($total -ge ($need*$bytesPerGb)){ Add-Content -Path $env:GITHUB_OUTPUT -Value 'eligible=true'; } else { Add-Content -Path $env:GITHUB_OUTPUT -Value 'eligible=false'; }; Write-Output ('{""schema_version"":1,""model"":""${{ matrix.model }}"",""runner_name"":""' + $env:RUNNER_NAME + '"",""total_memory_gb"":' + $totalGb + ',""minimum_memory_gb"":' + $need + ',""source_commit"":""' + $env:GITHUB_SHA + '""}') | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'ecl-resource.json')"
          endlocal
      - name: Install model runtime
        if: steps.resources.outputs.eligible == 'true'
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-ecl\tools\python.exe"
          "%PY_EXE%" -m venv "%RUNNER_TEMP%\ecl-venv-${{ matrix.install }}" || exit /b 1
          set "VENV_PY=%RUNNER_TEMP%\ecl-venv-${{ matrix.install }}\Scripts\python.exe"
          "%VENV_PY%" -m pip install --disable-pip-version-check --upgrade pip pytest || exit /b 1
          if /I "${{ matrix.install }}"=="laya" "%VENV_PY%" -m pip install --disable-pip-version-check "laya[serve]" || exit /b 1
          if /I "${{ matrix.install }}"=="jeff" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o "%RUNNER_TEMP%\jeff.tgz" "https://codeload.github.com/Gestalt-Lab/jeff/tar.gz/refs/heads/main" || exit /b 1
            tar.exe -xzf "%RUNNER_TEMP%\jeff.tgz" -C "%RUNNER_TEMP%" || exit /b 1
            for /d %%D in ("%RUNNER_TEMP%\jeff-*") do set "D=%%~fD"
            "%VENV_PY%" -m pip install --disable-pip-version-check "%D%" || exit /b 1
          )
          if /I "${{ matrix.install }}"=="kev" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o "%RUNNER_TEMP%\kev.tgz" "https://codeload.github.com/jaredpalmer/kev/tar.gz/refs/heads/main" || exit /b 1
            tar.exe -xzf "%RUNNER_TEMP%\kev.tgz" -C "%RUNNER_TEMP%" || exit /b 1
            for /d %%D in ("%RUNNER_TEMP%\kev-*") do set "D=%%~fD"
            "%VENV_PY%" -m pip install --disable-pip-version-check "%D%" || exit /b 1
          )
          endlocal
      - name: Start local model server
        if: steps.resources.outputs.eligible == 'true'
        shell: powershell
        run: |
          $py="$env:RUNNER_TEMP\ecl-venv-${{ matrix.install }}\Scripts\python.exe"
          $stdout="$env:RUNNER_TEMP\ecl-${{ matrix.install }}-server.out"
          $stderr="$env:RUNNER_TEMP\ecl-${{ matrix.install }}-server.err"
          if('${{ matrix.install }}' -eq 'laya'){
            $env:LAYA_DEVICE='cpu'; $env:LAYA_MODELS='typed-decisions'; $env:LAYA_PORT='8090'
            $p=Start-Process -FilePath "$env:RUNNER_TEMP\ecl-venv-laya\Scripts\laya-serve.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } elseif('${{ matrix.install }}' -eq 'kev'){
            $p=Start-Process -FilePath $py -ArgumentList '-m','kev.serve','--run','jaredpalmer/kev-0.8b','--port','8009' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } else {
            $jeffRoot=Get-ChildItem "$env:RUNNER_TEMP\jeff-*" -Directory | Select-Object -First 1
            $p=Start-Process -FilePath $py -ArgumentList '-m','scripts.jev_clf_server' -WorkingDirectory $jeffRoot.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }
          $p.Id | Set-Content "$env:RUNNER_TEMP\ecl-server.pid"
      - name: Run isolated benchmark
        if: steps.resources.outputs.eligible == 'true'
        shell: cmd
        run: |
          @echo off
          setlocal
          set "VENV_PY=%RUNNER_TEMP%\ecl-venv-${{ matrix.install }}\Scripts\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%VENV_PY%" -m automation.evidence_critic_benchmark --endpoint "${{ matrix.endpoint }}" --model "${{ matrix.model }}" --output "%RUNNER_TEMP%\ecl-${{ matrix.install }}-result.json" || exit /b 1
          endlocal
      - name: Write skipped resource receipt
        if: steps.resources.outputs.eligible != 'true'
        shell: powershell
        run: |
          $resource=Get-Content "$env:RUNNER_TEMP\ecl-resource.json" -Raw | ConvertFrom-Json
          [ordered]@{schema_version=1;task_id='ECL-2026-10-01-001';status='RESOURCE_INSUFFICIENT';model='${{ matrix.model }}';resource_preflight=$resource;worker_output_is_scientific_evidence=$false;governance=@{performance_evaluation=$false;holdout_selection=$false;candidate_selection=$false;candidate_ranking=$false;promotion=$false;live_execution=$false}} | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\ecl-${{ matrix.install }}-result.json"
      - name: Stop local model server
        if: always() && steps.resources.outputs.eligible == 'true'
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$path=Join-Path $env:RUNNER_TEMP 'ecl-server.pid'; if(Test-Path $path){$serverPid=[int](Get-Content $path);Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue}"
      - name: Upload isolated receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: evidence-critic-${{ matrix.install }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ecl-${{ matrix.install }}-result.json
            ${{ runner.temp }}\ecl-${{ matrix.install }}-server.out
            ${{ runner.temp }}\ecl-${{ matrix.install }}-server.err
            ${{ runner.temp }}\ecl-resource.json
          if-no-files-found: warn
          retention-days: 30
