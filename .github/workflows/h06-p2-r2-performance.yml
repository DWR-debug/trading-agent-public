name: H06-P2-R2 Corrective One-Shot Performance

on:
  push:
    branches: [master]
    paths:
      - research/run_requests/h06_p2_r2_performance_once.trigger
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: h06-p2-r2-performance-once
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authorized master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify exact one-shot trigger and safety
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "RUN_H06_P2_R2_PERFORMANCE_ONCE=true" research/run_requests/h06_p2_r2_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-10-01-H06P2R2-PERFORMANCE-01" research/run_requests/h06_p2_r2_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/h06_p2_r2_performance_once.trigger
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          p=json.loads(Path("research/preregistrations/h06_p2_r2_performance_2026_10_01.json").read_text())
          a=json.loads(Path("research/authorizations/h06_p2_r2_performance_2026_10_01.json").read_text())
          r=json.loads(Path("research/governance/active_research_registry.json").read_text())
          assert p["status"]=="PREREGISTERED_PERFORMANCE" and p["governance"]["performance_trial_authorized"] is True
          assert a["authorized"] is True and a["performance_execution_authorized"] is True and a["one_shot"] is True
          e=next(x for x in r["active_trials"] if x.get("code")=="H06-P2-R2")
          assert e["state"]=="PERFORMANCE_AUTHORIZED" and e["performance_authorization_allowed"] is True
          print("H06P2R2 AUTHORIZATION/Safety guard PASS")
          PY

      - name: Contract tests
        run: python -m pytest -q tests/test_h06_p2_readiness.py tests/test_h06_p2_r2_performance.py

      - name: Verify frozen upstream market artifact digest
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/11152741031" --jq .digest)"
          test "$actual" = "sha256:9de9019c33cf4a9300bcf4e901ab015ff4b8b6585bbb70d1c848e5a69e76d1bd"
          echo "H06P2R2_UPSTREAM_ARTIFACT_DIGEST=$actual"

      - name: Download immutable H06 coverage artifact
        uses: actions/download-artifact@v6
        with:
          name: h06-master-coverage-36842998210
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36842998210
          path: ${{ runner.temp }}/h06_market

      - name: Normalize frozen H06 coverage receipt schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]) / "h06_market" / "h06_sector_neutral_residual_momentum_repair_coverage.json"
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m.get("coverage",{}).get("status")=="COVERAGE_READY"
          assert m.get("snapshot_fingerprint")=="e80e63eebbc94a32043dcf9c38aa86d2f7dc88eb7c2a172de24dfd9b269e55c6"
          assert m.get("fingerprint")=="cd130e0cccf264680bf306ec58d162ddbd09f4b00b96613039f056b80c609936"
          m["status"]="COVERAGE_PASSED"
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("H06 coverage schema adapter PASS")
          PY
      - name: Execute fixed H06-P2-R2 13-gate performance once
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.h06_p2_r2_performance \
            --repo-root "$GITHUB_WORKSPACE" \
            --market-root "$RUNNER_TEMP/h06_market" \
            --output research/evidence/h06_p2_r2_performance_result.json

      - name: Reconcile result into ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.h06_p2_r2_reconcile --repo-root "$GITHUB_WORKSPACE" --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish immutable result and ledger
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" \
            --file research/evidence/h06_p2_r2_performance_result.json=research/evidence/h06_p2_r2_performance_result.json \
            --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h06-p2-r2-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/h06_p2_r2_performance_result.json
          if-no-files-found: warn
          retention-days: 30
