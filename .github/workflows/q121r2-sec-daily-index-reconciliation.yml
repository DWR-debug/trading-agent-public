name: Q121-R2 SEC Daily Index Reconciliation

on:
  schedule:
    - cron: "05 */12 * * *"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "automation/q121r2_sec_daily_index_reconciliation.py"
      - "tests/test_q121r2_sec_daily_index_reconciliation.py"
      - "research/preregistrations/q121r2_sec_daily_index_reconciliation_2026_10_03.json"
      - ".github/workflows/q121r2-sec-daily-index-reconciliation.yml"
  push:
    branches: [master]
    paths:
      - "automation/q121r2_sec_daily_index_reconciliation.py"
      - "tests/test_q121r2_sec_daily_index_reconciliation.py"
      - "research/preregistrations/q121r2_sec_daily_index_reconciliation_2026_10_03.json"
      - ".github/workflows/q121r2-sec-daily-index-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q121r2-sec-daily-index-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q121r2_sec_daily_index_reconciliation.py
      - name: Run independent daily-index reconciliation
        run: python -m automation.q121r2_sec_daily_index_reconciliation --output research/runs/q121r2_sec_daily_index_reconciliation/result.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q121r2_sec_daily_index_reconciliation/result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q121R2_INDEPENDENT_DAILY_INDEX_RECONCILIATION_COMPLETED"
          assert p["anchors_checked"] > 0
          assert p["interpretation"]["independent_anchor_reconciliation"] is True
          assert p["interpretation"]["full_window_population_exhaustiveness"] is False
          for key in ("performance","holdout","selection","ranking","parameter_search","threshold_search","horizon_search","asset_search","variant_search","performance_authorized","automatic_promotion"):
              assert p["governance"][key] is False
          assert p["pit"]["same_day_pit_safe"] is False
          assert p["safety"]["paper_only"] is True
          assert p["safety"]["live_trading_enabled"] is False
          assert p["safety"]["orders_enabled"] is False
          print("Q121R2_BOUNDARY=PASS")
          print("Q121R2_ANCHORS=", p["anchors_checked"])
          print("Q121R2_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q121r2-sec-daily-index-reconciliation-${{ github.run_id }}
          path: research/runs/q121r2_sec_daily_index_reconciliation/result.json
          if-no-files-found: error
          retention-days: 30
