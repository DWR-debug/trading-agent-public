name: Q104 I22 SEC Filing Arrival Feasibility

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q104_i22_filing_arrival_compiler.py"
      - "tests/test_q104_i22_filing_arrival_compiler.py"
      - ".github/workflows/q104-i22-source-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q104-i22-source-feasibility
  cancel-in-progress: true

jobs:
  i22_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q104-i22"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q104-i22.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest exchange-calendars || exit /b 1
          endlocal

      - name: Structural I22 tests
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q104-i22\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_q104_i22_filing_arrival_compiler.py || exit /b 1

      - name: Compile live SEC filing-arrival feasibility
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q104-i22\tools\python.exe"
          if not exist "research\runs\q104_i22" mkdir "research\runs\q104_i22"
          "%PY_EXE%" -m automation.q104_i22_filing_arrival_compiler --output "research\runs\q104_i22\q104_i22_filing_arrival_result.json"
          if errorlevel 1 exit /b 1
          endlocal

      - name: Verify feasibility governance boundary
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q104-i22\tools\python.exe"
          "%PY_EXE%" -c "import json; from pathlib import Path; p=json.loads(Path(r'research\runs\q104_i22\q104_i22_filing_arrival_result.json').read_text(encoding='utf-8')); assert p['governance']['performance'] is False; assert p['governance']['holdout'] is False; assert p['governance']['selection'] is False; assert p['governance']['ranking'] is False; assert p['governance']['parameter_search'] is False; assert p['governance']['performance_authorized'] is False; assert p['safety']['paper_only'] is True; assert p['safety']['live_trading_enabled'] is False; print('I22_GOVERNANCE_BOUNDARY=PASS'); print('I22_STATUS='+str(p['status'])); print('I22_RECEIPT_FINGERPRINT='+str(p['receipt_fingerprint']))" || exit /b 1

      - name: Upload I22 feasibility receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i22-sec-filing-arrival-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i22/q104_i22_filing_arrival_result.json
          if-no-files-found: error
          retention-days: 30
