name: Trial 017 Historical Pilot Execution

on:
  push:
    branches:
      - trial-017-execution-2026-09-24

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Only-Safety
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Trial 017 — historischer Pilot
        run: |
          python -m automation.trial_017_political_event_intelligence \
            --start "2025-01-01" \
            --end "2025-01-31"
      - name: Rohdaten manifestieren
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          raw = Path("research/trial_017_political_event_intelligence/raw")
          files = []
          for path in sorted(raw.glob("*.zip")):
              files.append({"name": path.name, "size_bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          Path("research/trial_017_political_event_intelligence/raw_manifest.json").write_text(json.dumps({"schema_version": 1, "source": "GDELT 2.0 daily event exports", "files": files, "file_count": len(files)}, indent=2, ensure_ascii=False), encoding="utf-8")
          print("RAW_FILES:", len(files))
          PY
      - name: Ergebnisvertrag prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("research/trial_017_political_event_intelligence/report.json").read_text(encoding="utf-8"))
          assert report["trial_id"] == "017"
          assert report["research_only"] is True
          assert report["selection_used"] is False
          assert report["parameter_search_used"] is False
          assert report["data_scope"]["event_filter"] == "international actors, num_articles >= 3"
          assert report["point_in_time_contract"]["same_day_performance_used_for_selection"] is False
          assert report["safety"] == {"paper_only": True, "live_trading_enabled": False, "orders_enabled": False}
          assert report["summary"]["all_market_days"]
          print("TRIAL_017_PILOT_REPORT_OK")
          print("EVENT_OBSERVATIONS:", len(report["observations"]))
          PY
      - name: Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-017-historical-pilot-${{ github.sha }}
          path: research/trial_017_political_event_intelligence/
          if-no-files-found: warn
          retention-days: 30