name: H06 Master Coverage Repair

on:
  schedule:
    - cron: "27 */6 * * *"
  push:
    branches: [master]
    paths:
      - "automation/wide_search_h06_sector_neutral_residual_momentum_repair_coverage.py"
      - "tests/test_wide_search_h06_sector_neutral_residual_momentum_repair_coverage.py"
      - "research/preregistrations/h06_sector_neutral_residual_momentum_repair_2026_09_25.json"
      - "research/asset_universes.py"
      - "data/canonical_snapshot.py"
      - "data/yahoo_loader.py"
      - "automation/h06_sector_neutral_residual_momentum_pit.py"
      - "tests/test_h06_sector_neutral_residual_momentum_pit.py"
      - "research/authorizations/h06_sector_neutral_residual_momentum_pit_2026_10_01.json"
      - "docs/research_design/H06_PIT_GATE_2026-10-01.md"
      - ".github/workflows/h06-master-coverage-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-h06-master-coverage
  cancel-in-progress: true

jobs:
  coverage:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact master snapshot
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"
      - name: Coverage contract tests
        run: python -m pytest -q tests/test_wide_search_h06_sector_neutral_residual_momentum_repair_coverage.py

      - name: PIT contract tests
        run: python -m pytest -q tests/test_h06_sector_neutral_residual_momentum_pit.py
      - name: H06 coverage repair
        run: python -m automation.wide_search_h06_sector_neutral_residual_momentum_repair_coverage --output research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json
      - name: H06 PIT mutation validation
        run: python -m automation.h06_sector_neutral_residual_momentum_pit --universe-root research/runs/wide_search/h06_repair_datasets --coverage-result research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json --authorization research/authorizations/h06_sector_neutral_residual_momentum_pit_2026_10_01.json --output research/runs/wide_search/h06_sector_neutral_residual_momentum_pit.json

      - name: Upload H06 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h06-master-coverage-${{ github.run_id }}
          path: |
            research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json
            research/runs/wide_search/h06_sector_neutral_residual_momentum_pit.json
            research/runs/wide_search/h06_repair_datasets/
          if-no-files-found: error
          retention-days: 30
