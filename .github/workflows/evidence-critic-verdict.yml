name: Evidence-Critic Verdict CPU Benchmark
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "research/benchmarks/evidence_critic_pilot_2026_10_01.jsonl"
      - "automation/evidence_critic_verdict.py"
      - ".github/workflows/evidence-critic-verdict.yml"

permissions:
  contents: read

jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy onnxruntime transformers
      - name: Download pinned Verdict v1.4 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verdict
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/verdict/model.onnx https://huggingface.co/heman10x/rlcd-modernbert-151m/resolve/main/model.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/verdict/tokenizer.json https://huggingface.co/heman10x/rlcd-modernbert-151m/resolve/main/tokenizer.json
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/verdict/tokenizer_config.json https://huggingface.co/heman10x/rlcd-modernbert-151m/resolve/main/tokenizer_config.json
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/verdict/config.json https://huggingface.co/heman10x/rlcd-modernbert-151m/resolve/main/config.json
          test "$(sha256sum /tmp/verdict/model.onnx | cut -d' ' -f1)" = "4ae01f822538b000fa0e55859d4b3e6b40871d860149397e8784428b2a42ee5e"
          test "$(sha256sum /tmp/verdict/tokenizer.json | cut -d' ' -f1)" = "8bb449eb0c037aae44115b65905bb339b8f3f74eb37067c19127feb3c0755723"
          test "$(sha256sum /tmp/verdict/tokenizer_config.json | cut -d' ' -f1)" = "fb54f027372062b2ca52282efb04d178a8b57167a00cd8f4e816515823a2c016"
          test "$(sha256sum /tmp/verdict/config.json | cut -d' ' -f1)" = "303f8eef1009cfdcb0cfba3e653247e625f16a4501e2351bad1a633f1f644695"

      - name: Run isolated benchmark
        run: |
          python -m automation.evidence_critic_verdict --model-dir /tmp/verdict --output /tmp/verdict/result.json
      - name: Safety invariants
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          PY
      - name: Upload shadow receipt
        uses: actions/upload-artifact@v6
        with:
          name: evidence-critic-verdict-1.4-${{ github.run_id }}
          path: /tmp/verdict/result.json
          retention-days: 30
