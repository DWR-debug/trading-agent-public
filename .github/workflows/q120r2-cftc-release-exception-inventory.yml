name: Q120-R2 CFTC Release Exception Inventory

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q120r2_cftc_release_exception_inventory.trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-q120r2-release-exception-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Offline request and parser contract tests
        run: python -m pytest -q tests/test_q120r2_cftc_release_exception_inventory.py tests/test_q120_cftc_source_feasibility.py tests/test_q120_cftc_positioning_state.py
      - name: Download and validate frozen Q120-R1 upstream receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q120r1"
          gh run download 38456880720 --repo "$GITHUB_REPOSITORY" --name q120-independent-reproduction-38456880720 --dir "$RUNNER_TEMP/q120r1"
          mapfile -t files < <(find "$RUNNER_TEMP/q120r1" -type f -name q120_independent_reproduction.json)
          [[ "${#files[@]}" == "1" ]] || { echo "Q120R1_RECEIPT_COUNT_INVALID"; exit 2; }
          cp "${files[0]}" "$RUNNER_TEMP/q120r1.json"
      - name: Parse bounded official CFTC exception metadata
        run: |
          python -m automation.q120r2_cftc_release_exception_inventory --request research/run_requests/q120r2_cftc_release_exception_inventory.trigger --upstream-receipt "$RUNNER_TEMP/q120r1.json" --output "research/runs/q120r2_cftc_release_exception_inventory/$GITHUB_RUN_ID/receipt.json"
      - name: Validate non-authorizing receipt
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(f"research/runs/q120r2_cftc_release_exception_inventory/{os.environ['GITHUB_RUN_ID']}/receipt.json")
          if not p.exists():
              raise SystemExit("Q120R2_RECEIPT_MISSING")
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] in {"Q120R2_CFTC_RELEASE_EXCEPTION_INVENTORY_COMPLETED","Q120R2_CFTC_RELEASE_EXCEPTION_INVENTORY_INCOMPLETE"}
          assert r["upstream"]["receipt_fingerprint"] == "9e79abc9fac1b9d1599b35e111e82e19f8b365d99e06a447638d0c0135321445"
          assert r["summary"]["request_count"] <= 2
          assert r["summary"]["download_bytes"] <= 700000
          assert r["pit_interpretation"]["complete_historical_release_calendar_recovered"] is False
          assert r["pit_interpretation"]["exact_first_publication_time_proven"] is False
          assert r["governance"]["performance_authorized"] is False
          assert r["safety"]["paper_only"] is True
          print(json.dumps({"status":r["status"],"exception_rows":r["summary"]["official_exception_rows_parsed"],"changed_dates":r["summary"]["rows_with_changed_publish_date"],"receipt_fingerprint":r["receipt_fingerprint"]},sort_keys=True))
          PY
      - name: Upload immutable Q120-R2 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q120r2-cftc-release-exception-inventory-${{ github.run_id }}
          path: research/runs/q120r2_cftc_release_exception_inventory/${{ github.run_id }}/receipt.json
          if-no-files-found: error
          retention-days: 30
