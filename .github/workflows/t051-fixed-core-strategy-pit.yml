name: T051 Fixed Core Strategy PIT Preflight

on:
  push:
    branches: [master]
    paths:
      - research/preregistrations/trial_051_fixed_core_strategy_pit_2026_09_27.json
      - automation/strategy_pit_preflight.py
      - automation/coverage_preflight.py
      - automation/candidate_validation_50_50_vol_budget.py
      - automation/cross_asset_trend_replication.py
      - research/asset_universes.py
      - research/run_requests/t051_fixed_core_strategy_pit.trigger
      - .github/workflows/t051-fixed-core-strategy-pit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t051-fixed-core-strategy-pit
  cancel-in-progress: false

jobs:
  pit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic data-contract dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0
      - name: Safety and preregistration guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path('research/preregistrations/trial_051_fixed_core_strategy_pit_2026_09_27.json').read_text(encoding='utf-8'))
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert spec['governance']['performance_trial_authorized'] is False
          assert spec['governance']['performance_evaluation'] is False
          assert spec['governance']['holdout_evaluation'] is False
          assert spec['governance']['asset_selection_by_performance'] is False
          assert spec['signal_contracts']['trend_sma_50_200']['future_information_forbidden'] is True
          assert spec['signal_contracts']['cs_momentum_12_1_top2']['future_information_forbidden'] is True
          print('T051 PREREGISTRATION SAFETY OK')
          PY
      - name: Coverage preflight T049
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/trial_049_fixed_candidate_batch_coverage_2026_09_27.json --output-root research/runs/t051_coverage
      - name: Coverage preflight T050
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/trial_050_fixed_candidate_batch_02_coverage_2026_09_27.json --output-root research/runs/t051_coverage
      - name: PIT validate T049
        run: python -m automation.strategy_pit_preflight --universe-root research/runs/t051_coverage/T-2026-09-27-049/datasets --output research/runs/t051_pit/T-2026-09-27-049/pit_report.json --universe validation_2026_09_27_fixed_candidate_batch --trial-id T-2026-09-27-051
      - name: PIT validate T050
        run: python -m automation.strategy_pit_preflight --universe-root research/runs/t051_coverage/T-2026-09-27-050/datasets --output research/runs/t051_pit/T-2026-09-27-050/pit_report.json --universe validation_2026_09_27_fixed_candidate_batch_02 --trial-id T-2026-09-27-051
      - name: Validate PIT governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for u in ['T-2026-09-27-049','T-2026-09-27-050']:
              p=Path('research/runs/t051_pit')/u/'pit_report.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['status']=='PIT_PASSED'
              assert d['performance_evaluation'] is False
              assert d['oos_evaluation'] is False
              assert d['holdout_evaluation'] is False
              assert d['selection_used'] is False
              assert d['holdout_used_for_selection'] is False
              assert d['governance']['performance_trial_authorized'] is False
              assert d['governance']['automatic_promotion'] is False
              assert d['safety']=={'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}
          print('T051 PIT GOVERNANCE PASS')
          PY
      - name: Publish PIT evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t051-fixed-core-strategy-pit-${{ github.run_id }}
          path: |
            research/runs/t051_coverage/
            research/runs/t051_pit/
          if-no-files-found: error
          retention-days: 30
