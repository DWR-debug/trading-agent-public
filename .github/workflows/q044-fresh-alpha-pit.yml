name: Q044 Fresh Alpha PIT

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q044_fresh_alpha_pit_2026_09_27.json"
      - "research/authorizations/q044_fresh_alpha_pit_2026_09_27.json"
      - "automation/q044_fresh_alpha_pit.py"
      - "tests/test_q044_fresh_alpha_pit.py"
      - "automation/coverage_preflight.py"
      - ".github/workflows/q044-fresh-alpha-pit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Safety and authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q044_fresh_alpha_pit_2026_09_27.json").read_text())
          a=json.loads(Path("research/authorizations/q044_fresh_alpha_pit_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          assert a["authorized"] is True and a["execution_scope"]=="PIT_ONLY"
          assert a["performance_execution_authorized"] is False
          assert p["governance"]["performance_trial_authorized"] is False
          PY
      - name: Contract tests
        run: python -m pytest -q tests/test_q044_fresh_alpha_pit.py
      - name: Fresh Q043-backed coverage
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q044_fresh_alpha_pit_2026_09_27.json --output-root research/runs/q044_coverage
      - name: PIT mutation validation
        run: python -m automation.q044_fresh_alpha_pit --universe-root research/runs/q044_coverage/T-2026-09-27-064/datasets --output research/runs/q044_pit/T-2026-09-27-064/pit_report.json
      - name: Governance validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q044_pit/T-2026-09-27-064/pit_report.json").read_text())
          assert d["status"]=="PIT_PASSED"
          assert d["performance_evaluation"] is False
          assert d["selection_used"] is False
          assert d["future_mutation_checks_passed"] is True
          assert d["next_session_mutation_checks_passed"] is True
          print('Q044 PIT GOVERNANCE PASS',d['checked_decision_points'])
          print('REPORT_FINGERPRINT',d['report_fingerprint'])
          PY
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q044-fresh-alpha-pit-${{ github.run_id }}
          path: |
            research/runs/q044_coverage/
            research/runs/q044_pit/
          if-no-files-found: error
          retention-days: 30
