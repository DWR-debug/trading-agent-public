name: Research Completion Relay

on:
  workflow_call:
    inputs:
      source_workflow:
        description: "Parent research workflow that has finished its substantive jobs"
        required: false
        type: string
        default: "research workflow"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  relay:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Wake only the completion paths not already owned by an event listener
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "RESEARCH_COMPLETION_RELAY_SOURCE=$SOURCE_WORKFLOW"
          echo "RESEARCH_COMPLETION_RELAY_EVENT=$SOURCE_EVENT"
          echo "RESEARCH_COMPLETION_RELAY_RUN=${{ github.run_id }}"

          # These source workflows already have a direct workflow_run trigger in
          # planned-capacity-fast-dispatch.yml. That trigger owns their wake for
          # every event type; the relay must not create a second workflow_dispatch.
          case "$SOURCE_WORKFLOW" in
            "Top-4 Candidate Slot Research"|"Top-4 Candidate Research Capacity"|"Q104 I19 Historical 13F Identity Census"|"Q089 Contract Audit"|"Q185-Q186 Windows Bounded Reproduction"|"H06 PIT Independent Reproduction (self-hosted)"|"Free AI Worker Fabric")
              echo "CAPACITY_DISPATCH_WAKE=DIRECT_WORKFLOW_RUN_OWNER"
              ;;
            *)
              # Monitor A handles push/schedule/API-completed research runs.
              # Only manual research completions need the relay bypass because
              # Monitor A intentionally excludes workflow_dispatch events.
              if [[ "$SOURCE_EVENT" == "workflow_dispatch" ]]; then
                gh workflow run planned-capacity-fast-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref master
                echo "CAPACITY_DISPATCH_WAKE=MANUAL_COMPLETION_RELAY"
              else
                echo "CAPACITY_DISPATCH_WAKE=COMPLETION_MONITOR_A_OWNER"
              fi
              ;;
          esac

          # The dashboard has its own workflow_run subscription for these names.
          # Avoid a second manual dispatch when its direct subscription will run.
          case "$SOURCE_WORKFLOW" in
            "Q104 I19 Historical 13F Identity Census"|"Q104 I19 Historical PIT Compilation"|"Q104 I19 Independent PIT Reproduction"|"Q220 As-Filed SEC-XBRL Population Repair"|"Q220 Historical Representation PIT Compiler"|"Q220 Independent Historical PIT Reproduction"|"Q220 TextBlock Differential Diagnostic"|"Q221 Monthly Archive Inventory Probe"|"Q221 Historical Award Public Boundary Falsification"|"Current Operational Status Synchronizer")
              echo "DASHBOARD_REFRESH_WAKE=DIRECT_WORKFLOW_RUN_OWNER"
              ;;
            *)
              gh workflow run resource-dashboard-update.yml --repo "$GITHUB_REPOSITORY" --ref master
              echo "DASHBOARD_REFRESH_WAKE=RELAY"
              ;;
          esac
