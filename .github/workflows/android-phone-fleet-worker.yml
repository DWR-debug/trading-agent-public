          echo "REPO_SRC=$(find "$RUNNER_TEMP/android-phone-source" -maxdepth 1 -type d -name 'trading-agent-public-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
