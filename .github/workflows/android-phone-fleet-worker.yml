          OUT="$GITHUB_WORKSPACE/research/runs/android_phone/$GITHUB_RUN_ID/SAMSUNG-PHONE-04"
          mkdir -p "$OUT"
          BASE_URL="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig"))["base_url"])')"
          PROTOCOL_PATH="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig")).get("protocol_path","/v1/systemone"))')"
          MODEL="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig"))["model"])')"
          curl -fsS --max-time 10 "$BASE_URL/health" >/dev/null
          python3 -m automation.evidence_critic_benchmark \
            --endpoint "$BASE_URL" \
            --protocol-path "$PROTOCOL_PATH" \
            --model "$MODEL" \
            --corpus "$REPO_SRC/research/benchmarks/evidence_critic_pilot_2026_10_01.jsonl" \
            --option-order-checks 6 \
            --output "$OUT/evidence_critic.json"
          python3 -m automation.android_phone_acceptance \
            --result "$OUT/evidence_critic.json" \
            --output "$OUT/android_phone_acceptance_receipt.json" \
            --resource-id "SAMSUNG-PHONE-04" \
            --runner-name "SAMSUNG-PHONE-04-TERMUX"

      - name: Build provenance receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/research/runs/android_phone/$GITHUB_RUN_ID/SAMSUNG-PHONE-04"
          mkdir -p "$OUT"
          export OUT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  files.append({"path":str(p.relative_to(root)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size})
          receipt={"schema_version":1,"receipt_type":"android_phone_run","resource_id":"SAMSUNG-PHONE-04","runner_name":os.environ.get("RUNNER_NAME"),"runner_arch":os.environ.get("RUNNER_ARCH"),"source_commit":os.environ.get("GITHUB_SHA"),"files":files,"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False,"scientific_evidence":False,"performance_authorization":False}
          (root/"provenance_receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload Android phone receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-phone-${{ github.run_id }}-SAMSUNG-PHONE-04
          path: research/runs/android_phone/${{ github.run_id }}/SAMSUNG-PHONE-04/
          if-no-files-found: warn
          retention-days: 30

  phone_05:
