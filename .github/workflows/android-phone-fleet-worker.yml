name: Android Phone Fleet Worker

# Reserve-only workflow. No automatic fleet scheduling.

on:
  # Scheduled routing intentionally removed: Android fleet is reserve-only.
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      phone_01: ${{ steps.plan.outputs.phone_01 }}
      phone_01_mode: ${{ steps.plan.outputs.phone_01_mode }}
      phone_02: ${{ steps.plan.outputs.phone_02 }}
      phone_02_mode: ${{ steps.plan.outputs.phone_02_mode }}
      phone_03: ${{ steps.plan.outputs.phone_03 }}
      phone_03_mode: ${{ steps.plan.outputs.phone_03_mode }}
      phone_04: ${{ steps.plan.outputs.phone_04 }}
      phone_04_mode: ${{ steps.plan.outputs.phone_04_mode }}
      phone_05: ${{ steps.plan.outputs.phone_05 }}
      phone_05_mode: ${{ steps.plan.outputs.phone_05_mode }}
    steps:
      - name: Checkout phone registry
        uses: actions/checkout@v5

      - name: Select enabled online Samsung phone slots
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "research/runs/android_phone/$GITHUB_RUN_ID/fleet_plan"
          python3 -m automation.android_phone_fleet_planner \
            --registry ops/android_phone_resources.json \
            --output-json "research/runs/android_phone/$GITHUB_RUN_ID/fleet_plan/plan.json" \
            --github-output "$GITHUB_OUTPUT"
          cat "research/runs/android_phone/$GITHUB_RUN_ID/fleet_plan/plan.json"

      - name: Upload fleet planning receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-phone-fleet-plan-${{ github.run_id }}
          path: research/runs/android_phone/${{ github.run_id }}/fleet_plan/
          if-no-files-found: warn
          retention-days: 14

  phone_01:
    needs: plan
    if: ${{ needs.plan.outputs.phone_01 == 'true' }}
    runs-on: [self-hosted, linux, ARM64, samsung-phone-01]
    timeout-minutes: 45
    env:
      PHONE_RESOURCE_ID: SAMSUNG-PHONE-01
      PHONE_MODE: ${{ needs.plan.outputs.phone_01_mode }}
      PHONE_RUNNER_NAME: SAMSUNG-PHONE-01-TERMUX
      PHONE_INTERFACE_PATH: ~/.trading-agent/phone_interface.json
      S10_SEED: "271828"
      S10_INTERFACE_PATH: ~/.trading-agent/phone_interface.json
      S10_BRIDGE_PORT: "8765"
      S10_LLAMA_BASE_URL: "http://127.0.0.1:8080"
    steps:
      - name: Download exact master snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-phone-source"
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/android-phone-source/repo.tar.gz" \
            "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/android-phone-source/repo.tar.gz" -C "$RUNNER_TEMP/android-phone-source"
          echo "REPO_SRC=$(find "$RUNNER_TEMP/android-phone-source" -maxdepth 1 -type d -name 'trading-agent-public-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in aarch64|arm64) ;; *) echo "Unexpected architecture: $arch" >&2; exit 3 ;; esac

      - name: Recover bounded local AI stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          python3 -m automation.s10_local_stack \
            --repo-root "$REPO_SRC" \
            --descriptor "$HOME/.trading-agent/phone_interface.json" \
            --work-root "$HOME/.cache/trading-agent/android-phone/SAMSUNG-PHONE-01/runs"

      - name: Verify bounded loopback interface
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          python3 -c 'import json; from pathlib import Path; from urllib.parse import urlparse; p=Path.home()/".trading-agent"/"phone_interface.json"; d=json.loads(p.read_text(encoding="utf-8-sig")); u=urlparse(str(d.get("base_url",""))); assert u.hostname in {"127.0.0.1","localhost","::1"}, "PHONE_ENDPOINT_NOT_LOOPBACK"; assert d.get("model"), "PHONE_MODEL_MISSING"; print(json.dumps({"model":d["model"],"base_url":d["base_url"]},sort_keys=True))'


      - name: Run bounded utility review on accepted phone
        if: env.PHONE_MODE == 'utility'
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/android_phone/$GITHUB_RUN_ID/$PHONE_RESOURCE_ID"
          mkdir -p "$OUT"
          python3 -m automation.s10_utility_task \
            --repo-root "$REPO_SRC" \
            --output "$OUT/utility_task.json"
          cat "$OUT/utility_task.json"

      - name: Run bounded 36-case Evidence-Critic benchmark
        if: env.PHONE_MODE == 'acceptance'
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/android_phone/$GITHUB_RUN_ID/SAMSUNG-PHONE-01"
          mkdir -p "$OUT"
          BASE_URL="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig"))["base_url"])')"
          PROTOCOL_PATH="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig")).get("protocol_path","/v1/systemone"))')"
          MODEL="$(python3 -c 'import json; from pathlib import Path; print(json.loads((Path.home()/".trading-agent"/"phone_interface.json").read_text(encoding="utf-8-sig"))["model"])')"
          curl -fsS --max-time 10 "$BASE_URL/health" >/dev/null
          python3 -m automation.evidence_critic_benchmark \
            --endpoint "$BASE_URL" \
            --protocol-path "$PROTOCOL_PATH" \
            --model "$MODEL" \
            --corpus "$REPO_SRC/research/benchmarks/evidence_critic_pilot_2026_10_01.jsonl" \
            --option-order-checks 6 \
            --output "$OUT/evidence_critic.json"
          python3 -m automation.android_phone_acceptance \
            --result "$OUT/evidence_critic.json" \
            --output "$OUT/android_phone_acceptance_receipt.json" \
            --resource-id "SAMSUNG-PHONE-01" \
            --runner-name "SAMSUNG-PHONE-01-TERMUX"

      - name: Build provenance receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/research/runs/android_phone/$GITHUB_RUN_ID/SAMSUNG-PHONE-01"
          mkdir -p "$OUT"
          export OUT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  files.append({"path":str(p.relative_to(root)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size})
          receipt={"schema_version":1,"receipt_type":"android_phone_run","resource_id":"SAMSUNG-PHONE-01","runner_name":os.environ.get("RUNNER_NAME"),"runner_arch":os.environ.get("RUNNER_ARCH"),"source_commit":os.environ.get("GITHUB_SHA"),"files":files,"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False,"scientific_evidence":False,"performance_authorization":False}
          (root/"provenance_receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Upload Android phone receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-phone-${{ github.run_id }}-SAMSUNG-PHONE-01
          path: research/runs/android_phone/${{ github.run_id }}/SAMSUNG-PHONE-01/
          if-no-files-found: warn
          retention-days: 30

