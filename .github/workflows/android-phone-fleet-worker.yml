      S10_BRIDGE_PORT: "8765"
      S10_LLAMA_BASE_URL: "http://127.0.0.1:8080"
    steps:
      - name: Download exact master snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-phone-source"
