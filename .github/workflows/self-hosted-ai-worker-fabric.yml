name: Local Free AI Worker Fabric

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-local-ai-fabric
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [gemini_cli, claude_cli]
        task:
          - AI-2026-09-28-Q089-ADVERSARIAL
          - AI-2026-09-28-UNUSUAL-FRONTIER
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Local AI setup and no-credit-fallback hardening
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\enable_local_ai_worker.ps1"
          if errorlevel 1 exit /b 1

      - name: Resolve task
        id: task
        shell: cmd
        run: |
          @echo off
          if /I "${{ matrix.task }}"=="AI-2026-09-28-Q089-ADVERSARIAL" echo path=ai_requests/AI-2026-09-28-Q089-ADVERSARIAL.json>>"%GITHUB_OUTPUT%"
          if /I "${{ matrix.task }}"=="AI-2026-09-28-UNUSUAL-FRONTIER" echo path=ai_requests/AI-2026-09-28-UNUSUAL-FRONTIER.json>>"%GITHUB_OUTPUT%"

      - name: Check for already-satisfied task
        id: prior
        shell: cmd
        run: |
          @echo off
          python -c "import json,os; from pathlib import Path; p=Path(r'ops/ai_worker_state/${{ matrix.task }}__${{ matrix.provider }}.json'); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; run=not (d.get('status')=='SUCCESS' and bool(d.get('task_fingerprint'))); open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write('run='+str(run).lower()+'\\n')"

      - name: Run local provider worker
        if: steps.prior.outputs.run == 'true'
        shell: cmd
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: "true"
          TRADING_AGENT_LOCAL_AI_MODE: "true"
        run: |
          @echo off
          python -m automation.ai_worker_fabric --run --provider "${{ matrix.provider }}" --task "${{ steps.task.outputs.path }}" --output "%RUNNER_TEMP%\ai-${{ matrix.task }}-${{ matrix.provider }}.json"

      - name: Publish local worker state
        if: always() && steps.prior.outputs.run == 'true'
        shell: cmd
        env:
          AI_WORKER_TASK_ID: "${{ matrix.task }}"
          AI_WORKER_PROVIDER: "${{ matrix.provider }}"
          GH_TOKEN: ${{ github.token }}
          AI_WORKER_STATE_PATH: "ops/ai_worker_state/${{ matrix.task }}__${{ matrix.provider }}.json"
          AI_WORKER_OUTPUT_PATH: "%RUNNER_TEMP%\ai-${{ matrix.task }}-${{ matrix.provider }}.json"
        run: |
          @echo off
          python -m automation.publish_ai_worker_state
      - name: Publish local worker artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ai-worker-${{ matrix.task }}-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}\ai-${{ matrix.task }}-${{ matrix.provider }}.json
          if-no-files-found: warn
          retention-days: 14
