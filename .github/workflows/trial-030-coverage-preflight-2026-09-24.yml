name: Trial 030 Coverage Preflight 2026-09-24
on:
  push:
    branches: ["research/preflight-trial-030-coverage-2026-09-24"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Run coverage-only preflight
        run: python -m automation.preflight_trial_030_coverage_2026_09_24
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trial-030-coverage-preflight
          path: research/preflight_trial_030_coverage_2026_09_24/report.json
          if-no-files-found: error
          retention-days: 30
