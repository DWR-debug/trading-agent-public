name: C29 Fresh Coverage and PIT Repair Successor

on:
  push:
    branches: [master]
    paths:
      - "research/asset_universes.py"
      - "research/preregistrations/c29_fresh_coverage_pit_repair_2026_09_30.json"
      - "automation/coverage_preflight.py"
      - "automation/c29_fresh_pit.py"
      - "automation/frontier_feasibility.py"
      - "tests/test_c29_fresh_pit.py"
      - ".github/workflows/c29-fresh-coverage-pit-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c29-fresh-coverage-pit-repair
  cancel-in-progress: true

jobs:
  repair_coverage_and_pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"
      - name: Contract tests
        run: python -m pytest -q tests/test_frontier_feasibility.py tests/test_c29_fresh_pit.py
      - name: Fresh C29 repair coverage preflight
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/c29_fresh_coverage_pit_repair_2026_09_30.json --output-root research/runs/c29_coverage_r1
      - name: C29 PIT mutation validation
      - name: Persist coverage receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/evidence
          report="$(find research/runs/c29_coverage_r1/T-2026-09-30-C29-COVERAGE-PIT-R1 -type f -name 'coverage_preflight_*.json' | sort | tail -n 1 || true)"
          if [ -z "$report" ]; then
            echo "No C29 R1 coverage report produced."
            exit 0
          fi
          cp "$report" research/evidence/c29_coverage_pit_r1_result.json

      - name: Publish coverage receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist C29 R1 coverage receipt"
        shell: bash
        run: |
          set -euo pipefail
          test -s research/evidence/c29_coverage_pit_r1_result.json || exit 0
          for attempt in 1 2 3 4 5; do
            base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test -n "$base_sha"
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$base_sha" \
              --file research/evidence/c29_coverage_pit_r1_result.json=research/evidence/c29_coverage_pit_r1_result.json; then
              echo "C29 R1 coverage receipt persisted."
              exit 0
            fi
            echo "Coverage receipt publish race/failure; retry ${attempt}."
          done
          exit 1
        run: python -m automation.c29_fresh_pit --universe-root research/runs/c29_coverage_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/datasets --preregistration research/preregistrations/c29_fresh_coverage_pit_repair_2026_09_30.json --output research/runs/c29_pit_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/pit_report.json
      - name: Persist PIT receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/evidence
          if [ ! -s research/runs/c29_pit_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/pit_report.json ]; then
            echo "No C29 R1 PIT report produced."
            exit 0
          fi
          cp research/runs/c29_pit_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/pit_report.json research/evidence/c29_pit_r1_result.json

      - name: Publish PIT receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist C29 R1 PIT receipt"
        shell: bash
        run: |
          set -euo pipefail
          test -s research/evidence/c29_pit_r1_result.json || exit 0
          for attempt in 1 2 3 4 5; do
            base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test -n "$base_sha"
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$base_sha" \
              --file research/evidence/c29_pit_r1_result.json=research/evidence/c29_pit_r1_result.json; then
              echo "C29 R1 PIT receipt persisted."
              exit 0
            fi
            echo "PIT receipt publish race/failure; retry ${attempt}."
          done
          exit 1
      - name: Validate no-performance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/c29_pit_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/pit_report.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["trial_id"] == "T-2026-09-30-C29-COVERAGE-PIT-R1"
          assert d["universe"] == "validation_2026_09_30_c29_fresh_input_repair"
          assert d["symbols"] == ["ROP", "NVR", "ODFL", "CPRT", "FICO", "AOS", "ECL", "VRSN"]
          assert d["status"] == "PIT_PASSED_NO_PERFORMANCE_EVIDENCE"
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["candidate_selection"] is False
          assert d["candidate_ranking"] is False
          assert d["performance_authorized"] is False
          print("C29 R1 PIT NO-PERFORMANCE CONTRACT OK")
          PY
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-fresh-coverage-pit-r1-${{ github.run_id }}
          path: |
            research/runs/c29_coverage_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/
            research/runs/c29_pit_r1/T-2026-09-30-C29-COVERAGE-PIT-R1/pit_report.json
          if-no-files-found: warn
          retention-days: 30
