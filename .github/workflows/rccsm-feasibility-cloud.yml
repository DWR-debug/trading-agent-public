name: RCCSM-0 Feasibility (cloud cross-check)

on:
  push:
    branches: [master]
    paths:
      - "automation/rccsm_feasibility.py"
      - "tests/test_rccsm_feasibility.py"
      - "automation/rccsm_synthetic.py"
      - "tests/test_rccsm_synthetic.py"
      - "docs/research_design/RCCSM_REGIME_CONDITIONAL_CAUSAL_SIGNAL_MESH_2026-09-28.md"
      - ".github/workflows/rccsm-feasibility-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rccsm-feasibility-cloud
  cancel-in-progress: true

jobs:
  cross-check:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run RCCSM structural tests
        run: python -m pytest -q tests/test_rccsm_feasibility.py tests/test_rccsm_synthetic.py

      - name: Cross-environment determinism probe
        run: python -c "import json; from automation.rccsm_feasibility import feasibility_manifest, route_mesh; from automation.rccsm_synthetic import synthetic_validation; state={'trend_coherence':0.8,'breadth':0.7,'dispersion':0.3,'event_density':0.1}; print(json.dumps({'manifest':feasibility_manifest(),'routing':route_mesh('RCCSM-SYNTHETIC-001',state),'synthetic_validation':synthetic_validation()},sort_keys=True))"
