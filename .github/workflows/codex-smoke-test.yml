name: Codex Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Codex Smoke Test
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/agent_tasks/codex_smoke_test.md
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"

      - name: Prüfen, dass keine versionierten Dateien verändert wurden
        run: |
          if ! git diff --quiet; then
            echo "FEHLER: Codex hat versionierte Dateien verändert."
            git status --short
            git diff --stat
            exit 1
          fi
          echo "CODEX SMOKE TEST: keine versionierten Änderungen."

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
