name: Spine Next-Gate Autonomous Router

on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [master]
    paths:
      - automation/spine_next_gate_router.py
      - tests/test_spine_next_gate_router.py
      - research/evidence/temporal_identity_state_spine_latest.json
      - research/evidence/spine_candidate_readiness_matrix_latest.json
      - .github/workflows/spine-next-gate-autonomous-router.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Temporal Identity State Spine Waves"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-spine-next-gate-router
  cancel-in-progress: true

jobs:
  route:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Temporal Identity State Spine Waves' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Test router
        run: python -m pytest -q tests/test_spine_next_gate_router.py
      - name: Plan and dispatch next waves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/spine/router/${GITHUB_RUN_ID}
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=200" > research/runs/spine/router/${GITHUB_RUN_ID}/runs.json
          python -m automation.spine_next_gate_router --runs research/runs/spine/router/${GITHUB_RUN_ID}/runs.json --output research/runs/spine/router/${GITHUB_RUN_ID}/dispatch_plan.json --max-dispatches 5
          export ROUTER_RUN_ID="${GITHUB_RUN_ID}"
          export ROUTER_RUNS_PATH="research/runs/spine/router/${GITHUB_RUN_ID}/runs.json"
          export ROUTER_PLAN_PATH="research/runs/spine/router/${GITHUB_RUN_ID}/dispatch_plan.json"
          spine_ready="$(python - <<'PY'
          import json, os
          path=os.environ['ROUTER_RUNS_PATH']
          d=json.load(open(path,encoding='utf-8'))
          runs=[r for r in d.get('workflow_runs',[]) if r.get('name')=='Temporal Identity State Spine Waves']
          runs.sort(key=lambda r:r.get('created_at',''),reverse=True)
          print('true' if runs and runs[0].get('status')=='completed' and runs[0].get('conclusion')=='success' else 'false')
          PY
          )"
          echo "SPINE_READY=${spine_ready}"
          if [[ "${spine_ready}" != 'true' ]]; then
            echo 'SPINE_NOT_READY=NO_DOWNSTREAM_DISPATCH'
            exit 0
          fi
          jq -r '.dispatches[]?' research/runs/spine/router/${GITHUB_RUN_ID}/dispatch_plan.json | while IFS= read -r workflow; do
            [[ -n "${workflow}" ]] || continue
            echo "DISPATCH ${workflow}"
            gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" --ref master || echo "DISPATCH_FAILED_NONBLOCKING ${workflow}"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spine-next-gate-router-${{ github.run_id }}
          path: research/runs/spine/router/${{ github.run_id }}/
          retention-days: 14
