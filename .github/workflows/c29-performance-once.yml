name: C29 One-Shot Performance Evaluation

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/c29_performance_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c29-one-shot-performance
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Verify exact C29 performance trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/c29_performance_once.trigger
          grep -Fx "RUN_C29_PERFORMANCE_ONCE=true" research/run_requests/c29_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-C29-PERFORMANCE-01" research/run_requests/c29_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/c29_performance_once.trigger
          echo "C29 PERFORMANCE TRIGGER VERIFIED"

      - name: Download exact frozen C29R1 input bundle
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11109809098
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36742254954
          path: _c29r1_input
          merge-multiple: true

      - name: Locate frozen input bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_manifest="$(find _c29r1_input -type f -name input_bundle_manifest.json | head -n1)"
          receipt="$(find _c29r1_input -type f -name c29r1_input_freeze_result.json | head -n1)"
          test -n "$bundle_manifest"
          test -n "$receipt"
          bundle_root="$(dirname "$bundle_manifest")"
          echo "C29_BUNDLE_ROOT=$bundle_root" >> "$GITHUB_ENV"
          echo "C29_FREEZE_RECEIPT=$receipt" >> "$GITHUB_ENV"
          echo "C29_BUNDLE_ROOT=$bundle_root"
          echo "C29_FREEZE_RECEIPT=$receipt"

      - name: Verify frozen input identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prereg=json.loads(Path("research/preregistrations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          manifest=json.loads(Path(os.environ["C29_BUNDLE_ROOT"],"input_bundle_manifest.json").read_text(encoding="utf-8"))
          receipt=json.loads(Path(os.environ["C29_FREEZE_RECEIPT"]).read_text(encoding="utf-8"))
          copy=dict(manifest); got=copy.pop("bundle_fingerprint")
          calc=hashlib.sha256(json.dumps(copy,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert got==calc
          assert got==prereg["data_contract"]["input_bundle_fingerprint"]
          assert receipt["status"]=="INPUT_BUNDLE_FROZEN"
          assert receipt["bundle_fingerprint"]==got
          assert receipt["performance_evaluation"] is False and receipt["performance_authorized"] is False
          assert prereg["data_contract"]["coverage_fingerprint"]==manifest["source_coverage_fingerprint"]
          assert prereg["data_contract"]["snapshot_fingerprint"]==manifest["source_snapshot_fingerprint"]
          print("C29 FROZEN INPUT IDENTITY VERIFIED")
          print("BUNDLE_FINGERPRINT="+got)
          PY

      - name: Fail-closed authorization and registry guard
        shell: bash
        run: |
          set -euo pipefail
          test -f research/authorizations/c29_performance_2026_09_30.json
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          p=json.loads(Path("research/preregistrations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          a=json.loads(Path("research/authorizations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          assert p["trial_id"]=="T-2026-09-30-C29-PERFORMANCE-01"
          assert p["status"]=="PREREGISTERED_PERFORMANCE"
          assert p["governance"]["performance_trial_authorized"] is True
          assert a["trial_id"]==p["trial_id"]
          assert a["authorized"] is True and a["performance_execution_authorized"] is True and a["one_shot"] is True
          entry=next(x for x in reg["active_trials"] if x.get("code")=="C29P1")
          assert entry["trial_id"]==p["trial_id"]
          assert entry["state"]=="PERFORMANCE_AUTHORIZED"
          assert entry["performance_authorization_allowed"] is True
          print("C29 AUTHORIZATION GUARD PASSED")
          PY

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("C29 SAFETY INVARIANTS OK")
          PY

      - name: Source contract verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          c=p["source_contract"]
          paths={
            "performance_runner_git_blob_sha":"automation/c29_performance.py",
            "frontier_feasibility_git_blob_sha":"automation/frontier_feasibility.py",
            "cost_contract_git_blob_sha":"execution/cost_contract.py",
            "settings_git_blob_sha":"config/settings.py",
            "input_freeze_git_blob_sha":"automation/c29r1_input_freeze.py",
          }
          for key,path in paths.items():
              actual=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual==c[key],(key,actual,c[key])
          print("C29 SOURCE CONTRACT VERIFIED")
          PY

      - name: Structural C29 tests
        run: python -m pytest -q tests/test_c29_performance.py

      - name: Execute C29 fixed performance exactly once
        env:
          C29_PERFORMANCE_ONCE: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.c29_performance             --preregistration research/preregistrations/c29_performance_2026_09_30.json             --repo-root .             --bundle-root "$C29_BUNDLE_ROOT"             --output research/evidence/c29_performance_result.json

      - name: Reconcile immutable C29 result and consume authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.c29_performance_reconcile --repo-root . --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish C29 result and ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/c29_performance_result.json=research/evidence/c29_performance_result.json             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json             --file research/governance/active_research_registry.json=research/governance/active_research_registry.json             --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload immutable C29 result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/c29_performance_result.json
          if-no-files-found: warn
          retention-days: 30
