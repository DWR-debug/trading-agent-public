name: Priority Research Wave Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-priority-wave-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Manual emergency dispatch guard
        run: |
          set -euo pipefail
          echo "MANUAL_PRIORITY_DISPATCH_ONLY=TRUE"
          echo "AUTOMATIC_DISPATCH_AUTHORITY=.github/workflows/capacity-saturation-rolling-waves.yml"
          echo "No automatic push/schedule trigger exists for this workflow."
