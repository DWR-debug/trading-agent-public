name: Fourset Portfolio Regime Sleeve Interaction 2026-09-23

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/fourset_portfolio_regime_sleeve_interaction_2026_09_23.py"
      - "tests/test_fourset_portfolio_regime_sleeve_interaction_2026_09_23.py"
      - "docs/fourset_portfolio_regime_sleeve_interaction_2026_09_23_preregistration.md"
      - ".github/workflows/fourset-portfolio-regime-sleeve-interaction-2026-09-23.yml"
      - "automation/candidate_validation_50_50_vol_budget.py"
      - "automation/risk_layer_drawdown_onset_2026_09_23.py"
      - "config/**"
      - "data/**"
      - "research/**"
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-fourset-regime-sleeve-interaction-2026-09-23
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Vier immutable Validierungsartefakte laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/fourset_interaction_sources
          declare -A artifacts=(
            [10751817990]=candidate-validation-50-50-vol-budget-2026-09-23.zip
            [10740188093]=second-validation-2026-09-23.zip
            [10745697729]=third-validation-2026-09-23.zip
            [10753545703]=fourth-independent-validation-2026-09-23.zip
          )
          for artifact_id in "${!artifacts[@]}"; do
            file="/tmp/${artifacts[$artifact_id]}"
            gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               > "$file"
            unzip -q "$file" -d /tmp/fourset_interaction_sources
          done

          test -f /tmp/fourset_interaction_sources/research/candidate_validation/report.json
          test -f /tmp/fourset_interaction_sources/research/independent_validation_2026_09_23/report.json
          test -f /tmp/fourset_interaction_sources/research/third_independent_validation_2026_09_23/report.json
          test -f /tmp/fourset_interaction_sources/research/fourth_independent_validation_2026_09_23/report.json
          echo "IMMUTABLE_VALIDATION_ARTIFACTS_READY"

      - name: Preregistration fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.fourset_portfolio_regime_sleeve_interaction_2026_09_23 import (
              CASES,
              RESEARCH_COUNT,
              WINDOW_COUNT,
          )

          assert len(CASES) == 4
          assert RESEARCH_COUNT == 2798
          assert WINDOW_COUNT == 5
          assert [case["artifact_id"] for case in CASES] == [
              10751817990,
              10740188093,
              10745697729,
              10753545703,
          ]
          prereg = Path(
              "docs/fourset_portfolio_regime_sleeve_interaction_2026_09_23_preregistration.md"
          )
          text = prereg.read_text(encoding="utf-8")
          for token in (
              "20 Research-Fenster",
              "Portfolio-Negativfenster",
              "gemeinsame Schwäche",
              "Holdout",
              "PAPER_ONLY=True",
          ):
              assert token in text
          print("FOURSET_INTERACTION_PREREGISTRATION_VERIFIED")
          PY

      - name: Vierfach-Regime-/Sleeve-Diagnose ausführen
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.fourset_portfolio_regime_sleeve_interaction_2026_09_23 import analyze

          result = analyze(Path("/tmp/fourset_interaction_sources"))
          output = Path(
              "research/fourset_portfolio_regime_sleeve_interaction_2026_09_23/report.json"
          )
          output.parent.mkdir(parents=True, exist_ok=True)
          import json
          output.write_text(
              json.dumps(result, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          print("FOURSET_INTERACTION_STATUS:", result["status"])
          print("AGGREGATE:", result["aggregate"])
          print("DIAGNOSTIC_FINGERPRINT:", result["diagnostic_fingerprint"])
          PY

      - name: Ergebnisintegrität und Research-only-Scope prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/fourset_portfolio_regime_sleeve_interaction_2026_09_23/report.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["research_windows"] == 20
          assert result["scope"]["holdout_used_for_decision"] is False
          assert result["scope"]["holdout_metrics_reported"] is False
          assert result["scope"]["parameter_search"] is False
          assert result["scope"]["asset_selection"] is False
          assert result["scope"]["gate_changes"] is False
          assert result["scope"]["production_mutation"] is False
          assert result["methodology"]["candidate_architecture_fixed"] is True
          assert result["methodology"]["de_risk_metrics_descriptive_only"] is True
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          assert len(result["cases"]) == 4
          assert all(len(case["analysis"]["windows"]) == 5 for case in result["cases"].values())
          print("FOURSET_INTERACTION_RESULT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          PY

      - name: Diagnoseartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourset-portfolio-regime-sleeve-interaction-2026-09-23-${{ github.run_id }}
          path: research/fourset_portfolio_regime_sleeve_interaction_2026_09_23/
          if-no-files-found: error
          retention-days: 30
