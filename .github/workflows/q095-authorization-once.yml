name: Q095 One-Shot Authorization

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q095_authorize_and_execute_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q095-authorization-once
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorization request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify explicit one-shot authorization request
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q095_authorize_and_execute_once.trigger
          grep -Fx "AUTHORIZE_Q095=true" research/run_requests/q095_authorize_and_execute_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-29-095" research/run_requests/q095_authorize_and_execute_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q095_authorize_and_execute_once.trigger

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Re-run Q095 contract audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/q095_contract_audit.py automation/q095_performance.py automation/q095_reconcile.py
          python -m pytest -q tests/test_q094_monthly_rebalance.py
          python -m automation.q095_contract_audit | tee q095-contract-audit.json
          python - <<'PY'
          import json
          d=json.load(open("q095-contract-audit.json",encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert d["trial_id"]=="T-2026-09-29-095"
          assert d["performance_authorization_changed"] is False
          assert d["performance_executed"] is False
          PY

      - name: Wait for exact Master CI Gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          for attempt in $(seq 1 90); do
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "T052 run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "Q095_MASTER_CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "::error::T052 Exact Master CI Gate did not complete successfully within the authorization window."
          exit 1

      - name: Build Q095 authorization and performance trigger atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prereg_path=Path("research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json")
          registry_path=Path("research/governance/active_research_registry.json")
          auth_path=Path("research/authorizations/q095_performance_2026_09_29.json")
          trigger_path=Path("research/run_requests/q095_performance_once.trigger")
          prereg=json.loads(prereg_path.read_text(encoding="utf-8"))
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          audit=json.loads(Path("q095-contract-audit.json").read_text(encoding="utf-8"))
          assert prereg["trial_id"]=="T-2026-09-29-095"
          assert prereg["status"]=="PREREGISTERED_PERFORMANCE"
          assert prereg["governance"]["performance_trial_authorized"] is False
          entry=next(x for x in registry["active_trials"] if x.get("code")=="095")
          assert entry["trial_id"]=="T-2026-09-29-095"
          assert entry["performance_authorization_allowed"] is False
          assert audit["status"]=="PASS"
          prereg["governance"]["performance_trial_authorized"]=True
          prereg_fp=hashlib.sha256(json.dumps(prereg,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          auth={
            "schema_version":"1.0",
            "authorization_id":"AUTH-Q095-2026-09-29-01",
            "trial_id":"T-2026-09-29-095",
            "authorized":True,
            "performance_execution_authorized":True,
            "one_shot":True,
            "preregistration_fingerprint":prereg_fp,
            "input_bundle_fingerprint":prereg["data_contract"]["input_bundle_fingerprint"],
            "authorization_basis":{
              "q095_contract_audit_workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "q095_contract_audit_fingerprint":audit["audit_fingerprint"],
              "master_ci_run_id":int(os.environ["Q095_MASTER_CI_RUN_ID"]),
              "requested_by_user":True
            },
            "selection_used":False,
            "holdout_used_for_selection":False,
            "parameter_search":False,
            "threshold_search":False,
            "asset_search":False,
            "horizon_search":False,
            "variant_search":False,
            "family_ranking":False,
            "promotion_decision":False,
            "safety":{
              "paper_only":True,
              "live_trading_enabled":False,
              "orders_enabled":False,
              "automatic_promotion":False
            }
          }
          entry["performance_authorization_allowed"]=True
          entry["state"]="PERFORMANCE_AUTHORIZED"
          entry["authorization_id"]=auth["authorization_id"]
          auth_path.parent.mkdir(parents=True,exist_ok=True)
          auth_path.write_text(json.dumps(auth,ensure_ascii=False,indent=2,allow_nan=False)+chr(10),encoding="utf-8")
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2,allow_nan=False)+chr(10),encoding="utf-8")
          prereg_path.write_text(json.dumps(prereg,ensure_ascii=False,indent=2,allow_nan=False)+chr(10),encoding="utf-8")
          trigger_path.write_text("RUN_Q095_MONTHLY_REBALANCE_PERFORMANCE_ONCE=true\nTRIAL_ID=T-2026-09-29-095\nONE_SHOT=true\n",encoding="utf-8")
          print("Q095 AUTHORIZATION PREPARED")
          print("Q095_PREREG_FP="+prereg_fp)
          PY
          export GH_TOKEN="$GITHUB_TOKEN"
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$base_sha" \
            --file research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json=research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json \
            --file research/authorizations/q095_performance_2026_09_29.json=research/authorizations/q095_performance_2026_09_29.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/run_requests/q095_performance_once.trigger=research/run_requests/q095_performance_once.trigger

      - name: Upload authorization receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q095-authorization
          path: q095-contract-audit.json
          if-no-files-found: warn
          retention-days: 30
