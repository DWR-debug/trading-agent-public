name: Q115 Treasury Auction Demand State Contract

on:
  push:
    branches: [master]
    paths:
      - "automation/q115_treasury_demand_state.py"
      - "tests/test_q115_treasury_demand_state.py"
      - "research/preregistrations/q115_treasury_demand_state_2026_10_01.json"
      - ".github/workflows/q115-treasury-demand-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q115-treasury-demand-state
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False"
      - name: Contract tests
        run: python -m pytest -q tests/test_q115_treasury_demand_state.py
