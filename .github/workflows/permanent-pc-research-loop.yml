name: Permanent Self-Hosted Research Loop

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [master]
    paths:
      - "automation/self_hosted_research_worker.py"
      - "automation/rccsm_feasibility.py"
      - "automation/rccsm_synthetic.py"
      - "tests/test_rccsm_feasibility.py"
      - "tests/test_rccsm_synthetic.py"
      - "tests/test_frontier_feasibility.py"
      - "tests/test_q089_validation.py"
      - "tests/test_q089_input_freeze.py"
      - "tests/test_q089_performance_envelope.py"
      - "tests/test_research_governance_audit.py"
      - "automation/local_ai_smoke.py"
      - "automation/ai_worker_fabric.py"
      - "scripts/enable_local_ai_worker.ps1"
      - ".github/workflows/permanent-pc-research-loop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-permanent-pc-loop-v2
  cancel-in-progress: true

jobs:
  autonomous_pc:
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [autonomous_frontier_qa, local_reproduction]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - name: Download current master
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-autonomous.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Run autonomous bounded research/QA lane
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous\tools\python.exe"
          set "LANE=${{ matrix.lane }}"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m automation.self_hosted_research_worker --lane "%LANE%" --output-dir "research/runs/self_hosted/autonomous/%GITHUB_RUN_ID%/%LANE%" || exit /b 1
          endlocal

      - name: Stage autonomous evidence for upload
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "LANE=${{ matrix.lane }}"
          if not exist "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%" mkdir "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $s=Join-Path $env:REPO_SRC 'research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%'; $d=Join-Path $env:GITHUB_WORKSPACE 'research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%'; if(-not (Test-Path -LiteralPath $s)){throw ('Evidence source missing: '+$s)}; Get-ChildItem -LiteralPath $s -Force | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $d -Recurse -Force }"
          if errorlevel 1 exit /b 1
          endlocal

      - name: Upload autonomous evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: permanent-pc-loop-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            research/runs/self_hosted/autonomous/${{ github.run_id }}/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 14

  local_ai_smoke:
    needs: autonomous_pc
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 8
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-ai-smoke-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-ai-smoke-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          for /d %%D in ("%WORK%\trading-agent-public-*") do echo REPO_SRC=%%~fD>>"%GITHUB_ENV%"
          endlocal

      - name: Ensure Antigravity CLI
        shell: cmd
        run: |
          @echo off
          setlocal
          if not exist "%LOCALAPPDATA%\agy\bin\agy.exe" (
            echo Antigravity CLI missing; installing for current Windows user...
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "irm https://antigravity.google/cli/install.ps1 | iex"
            if errorlevel 1 exit /b 1
          )
          if not exist "%LOCALAPPDATA%\agy\bin\agy.exe" (
            echo ::error::Antigravity CLI installation did not produce %LOCALAPPDATA%\agy\bin\agy.exe
            exit /b 1
          )
          echo %LOCALAPPDATA%\agy\bin>>"%GITHUB_PATH%"
          "%LOCALAPPDATA%\agy\bin\agy.exe" --version
          endlocal

      - name: Bootstrap local AI policy
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%REPO_SRC%\scripts\enable_local_ai_worker.ps1"
          if errorlevel 1 exit /b 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-ai-smoke"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-ai-smoke.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Run local AI readiness check
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $agy=Get-Command agy -ErrorAction SilentlyContinue; if(-not $agy){$agy=Get-Command gemini -ErrorAction SilentlyContinue}; if(-not $agy){throw 'No Gemini/Antigravity CLI found.'}; $settings=Join-Path $env:USERPROFILE '.gemini\antigravity-cli\settings.json'; if(-not (Test-Path $settings)){throw ('Local AI settings missing: '+$settings)}; $raw=Get-Content $settings -Raw; if($raw -notmatch '(?i)' + [regex]::Escape('"UseG1Credits"') + '\s*:\s*false' -and $raw -notmatch '(?i)' + [regex]::Escape('"useG1Credits"') + '\s*:\s*false'){throw 'Personal G1 credit fallback is not explicitly disabled.'}; Write-Output 'LOCAL_AI_READINESS=READY'; Write-Output ('LOCAL_AI_PROVIDER_BINARY='+$agy.Source); Write-Output 'PERSONAL_G1_CREDITS_DISABLED=True'"

      - name: Execute real local AI smoke test
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-ai-smoke\tools\python.exe"
          "%PY_EXE%" "%REPO_SRC%\automation\local_ai_smoke.py" > "%RUNNER_TEMP%\local-ai-smoke.json"
          if errorlevel 1 exit /b 1
          type "%RUNNER_TEMP%\local-ai-smoke.json"
          endlocal

      - name: Upload local AI receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ai-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\local-ai-smoke.json
          if-no-files-found: warn
          retention-days: 14

  local_ai_worker:
    needs: [autonomous_pc, local_ai_smoke]
    if: ${{ always() && needs.local_ai_smoke.result == 'success' && github.repository == 'DWR-debug/trading-agent-public' }}
    strategy:
      fail-fast: false
      # Gemini/Antigravity quota is account-wide; serialize provider calls and prioritize the newest Q091 review.
      max-parallel: 1
      matrix:
        task:
          - AI-2026-09-29-Q091-ADVERSARIAL
          - AI-2026-09-28-Q089-ADVERSARIAL
          - AI-2026-09-28-UNUSUAL-FRONTIER
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 20
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-ai-worker-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-ai-worker-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          for /d %%D in ("%WORK%\trading-agent-public-*") do echo REPO_SRC=%%~fD>>"%GITHUB_ENV%"
          endlocal

      - name: Ensure Antigravity CLI
        shell: cmd
        run: |
          @echo off
          setlocal
          if not exist "%LOCALAPPDATA%\agy\bin\agy.exe" (
            echo Antigravity CLI missing; installing for current Windows user...
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "irm https://antigravity.google/cli/install.ps1 | iex"
            if errorlevel 1 exit /b 1
          )
          if not exist "%LOCALAPPDATA%\agy\bin\agy.exe" (
            echo ::error::Antigravity CLI installation did not produce %LOCALAPPDATA%\agy\bin\agy.exe
            exit /b 1
          )
          echo %LOCALAPPDATA%\agy\bin>>"%GITHUB_PATH%"
          "%LOCALAPPDATA%\agy\bin\agy.exe" --version
          endlocal

      - name: Bootstrap local AI policy
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "%REPO_SRC%\scripts\enable_local_ai_worker.ps1"
          if errorlevel 1 exit /b 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-ai-worker"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-ai-worker.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Run bounded Gemini worker
        shell: cmd
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: "true"
          TRADING_AGENT_LOCAL_AI_MODE: "true"
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-ai-worker\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m automation.ai_worker_fabric --run --provider "gemini_cli" --task "ai_requests\${{ matrix.task }}.json" --output "%RUNNER_TEMP%\ai-${{ matrix.task }}-gemini_cli.json"
          type "%RUNNER_TEMP%\ai-${{ matrix.task }}-gemini_cli.json"

      - name: Publish Gemini worker state
        if: always()
        shell: cmd
        env:
          AI_WORKER_TASK_ID: "${{ matrix.task }}"
          AI_WORKER_PROVIDER: "gemini_cli"
          GH_TOKEN: ${{ github.token }}
          AI_WORKER_STATE_PATH: "ops/ai_worker_state/${{ matrix.task }}__gemini_cli.json"
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-ai-worker\tools\python.exe"
          set "AI_WORKER_OUTPUT_PATH=%RUNNER_TEMP%\ai-${{ matrix.task }}-gemini_cli.json"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m automation.publish_ai_worker_state

      - name: Upload bounded AI receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ai-worker-${{ matrix.task }}-gemini-${{ github.run_id }}
          path: ${{ runner.temp }}\ai-${{ matrix.task }}-gemini_cli.json
          if-no-files-found: warn
          retention-days: 14
