name: Permanent Windows Local Research Loop

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
    paths:
      - "automation/self_hosted_research_worker.py"
      - "research/preregistrations/q109_n7_graph_integrity_2026_10_02.json"
      - "tests/test_self_hosted_research_worker.py"
      - "tests/test_persistent_research_acceleration_contract.py"
      - "research/governance/persistent_research_acceleration_contract.json"
      - "research/frontier/q185_q186_candidate_wave_2026_10_04.json"
      - "research/frontier/q187_q192_candidate_wave_2026_10_04.json"
      - "research/frontier/q193_q196_candidate_wave_2026_10_04.json"
      - "research/frontier/q197_q198_candidate_wave_2026_10_04.json"
      - "docs/research_design/Q197_Q198_DEEP_LITERATURE_AND_CANDIDATE_WAVE_2026-10-04.md"
      - "automation/q197_q198_source_feasibility.py"
      - "automation/q198_pit_clock_census.py"
      - "research/frontier/q199_q201_candidate_wave_2026_10_04.json"
      - "research/frontier/q202_q204_candidate_wave_2026_10_04.json"
      - "research/candidates/orthogonal_candidate_specs_2026-10-05.json"
      - "research/frontier/q206_q210_information_dissemination_wave_2026_10_05.json"
      - "docs/research_design/INFORMATION_DISSEMINATION_LITERATURE_2026-10-05.md"
      - "docs/research_design/TRADINGAGENTS_ARCHITECTURE_REPLICATION_2026-10-05.md"
      - "research/frontier/q205_nlrb_union_certification_candidate_2026_10_05.json"
      - "research/frontier/q211_q213_literature_frontier_2026_10_05.json"
      - "research/frontier/q214_disclosure_risk_state_2026_10_05.json"
      - "docs/research_design/LITERATURE_FRONTIER_EXPANSION_2026-10-05.md"
      - "automation/q211_q213_literature_source_feasibility.py"
      - "tests/test_q211_q213_literature_frontier.py"

      - "tests/test_q198_pit_clock_census.py"
      - "agent_runtime/**"
      - "tests/test_paper_intent.py"
      - "tests/test_decision_adapter.py"
      - "tests/test_shadow_replay.py"
      - "tests/test_signal_adapter.py"
      - "automation/q179_q184_source_feasibility.py"
      - "automation/q185_q186_source_feasibility.py"
      - "automation/q187_q192_source_feasibility.py"
      - "automation/q193_q196_source_feasibility.py"
      - ".github/workflows/permanent-pc-research-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous_pc:
    if: github.repository == 'DWR-debug/trading-agent-public'
    concurrency:
      # Windows A = Formal Readiness / local reproduction.
      # Windows B = Frontier Discovery / data QA.
      group: ${{ matrix.concurrency_group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: local_reproduction
            concurrency_group: trading-agent-windows-research-capacity-v1
          - lane: data_qa
            concurrency_group: trading-agent-windows-research-data-qa-v1
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - name: Download current master
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-autonomous.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas exchange-calendars || exit /b 1
          endlocal

      - name: Run autonomous bounded research/QA lane
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous\tools\python.exe"
          set "LANE=${{ matrix.lane }}"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          set "EXIT_CODE=0"
          "%PY_EXE%" -m automation.self_hosted_research_worker --lane "%LANE%" --rotation-index "%GITHUB_RUN_NUMBER%" --output-dir "research/runs/self_hosted/autonomous/%GITHUB_RUN_ID%/%LANE%"
          if errorlevel 1 (
            set "RC=!ERRORLEVEL!"
            if "!EXIT_CODE!"=="0" set "EXIT_CODE=!RC!"
          )
          endlocal & exit /b %EXIT_CODE%

      - name: Run Q211-Q213 literature source feasibility
        if: matrix.lane == 'data_qa'
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\\python-3.13.15-nuget-autonomous\\tools\\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" automation\\q211_q213_literature_source_feasibility.py --output-dir "research\\runs\\self_hosted\\autonomous\\%GITHUB_RUN_ID%\\${{ matrix.lane }}\\q211_q213"
          endlocal

      - name: Stage autonomous evidence for upload
        if: always()
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "LANE=${{ matrix.lane }}"
          if not exist "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%" mkdir "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $s=Join-Path $env:REPO_SRC 'research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%'; $d=Join-Path $env:GITHUB_WORKSPACE 'research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%'; $s10=Join-Path $env:REPO_SRC 'research\runs\self_hosted\autonomous\s10_evidence_critic.json'; if(Test-Path -LiteralPath $s10){ Copy-Item -LiteralPath $s10 -Destination (Join-Path $d 's10_evidence_critic.json') -Force }; $s10a=Join-Path $env:REPO_SRC 'research\runs\self_hosted\autonomous\s10_acceptance_receipt.json'; if(Test-Path -LiteralPath $s10a){ Copy-Item -LiteralPath $s10a -Destination (Join-Path $d 's10_acceptance_receipt.json') -Force }; if(-not (Test-Path -LiteralPath $s)){throw ('Lane output missing: '+$s)}; Get-ChildItem -LiteralPath $s -Force | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $d -Recurse -Force }; if('%LANE%' -eq 'autonomous_frontier_qa'){ $support=Join-Path $d 'supporting'; New-Item -ItemType Directory -Force -Path $support | Out-Null; foreach($item in @('research\runs\q099_q081r4_failure_diagnosis','research\runs\q100_frontier_feasibility_synthesis','research\runs\q101_negative_evidence_atlas','research\runs\q102_regime_negative_evidence','research\runs\self_hosted\q092_q091_failure_diagnosis.json','research\runs\self_hosted\q092_q091_failure_diagnosis.md')){ $src=Join-Path $env:REPO_SRC $item; if(Test-Path -LiteralPath $src){ $leaf=Split-Path -Leaf $item.TrimEnd('\'); $dest=Join-Path $support $leaf; Copy-Item -LiteralPath $src -Destination $dest -Recurse -Force } } }; $entries=@(); Get-ChildItem -LiteralPath $d -File -Recurse | ForEach-Object { $h=Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName; $entries += [ordered]@{path=$_.FullName.Substring($d.Length+1).Replace('\','/'); sha256=$h.Hash.ToLowerInvariant(); bytes=$_.Length} }; [ordered]@{schema_version=1; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; source_commit=$env:GITHUB_SHA; runner_name=$env:RUNNER_NAME; lane='%LANE%'; generated_at_utc=[DateTimeOffset]::UtcNow.ToString('o'); files=$entries} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $d 'provenance_index.json') -Encoding utf8"
          if errorlevel 1 exit /b 1
          endlocal

      - name: Upload autonomous evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: permanent-pc-loop-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            research/runs/self_hosted/autonomous/${{ github.run_id }}/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 14
