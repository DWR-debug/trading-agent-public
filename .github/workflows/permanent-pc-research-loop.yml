name: Permanent Self-Hosted Research Loop

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [master]
    paths:
      - "automation/self_hosted_research_worker.py"
      - "automation/rccsm_feasibility.py"
      - "automation/rccsm_synthetic.py"
      - "tests/test_rccsm_feasibility.py"
      - "tests/test_rccsm_synthetic.py"
      - "tests/test_frontier_feasibility.py"
      - "tests/test_q089_validation.py"
      - "tests/test_q089_input_freeze.py"
      - "tests/test_q089_performance_envelope.py"
      - "tests/test_research_governance_audit.py"
      - "automation/local_ai_smoke.py"
      - "scripts/enable_local_ai_worker.ps1"
      - ".github/workflows/permanent-pc-research-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-permanent-pc-loop
  cancel-in-progress: true

jobs:
  autonomous_pc:
    if: github.repository == 'DWR-debug/trading-agent-public'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [autonomous_frontier_qa, local_reproduction]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    steps:
      - name: Download current master
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-autonomous.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Run autonomous bounded research/QA lane
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-autonomous\tools\python.exe"
          set "LANE=${{ matrix.lane }}"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m automation.self_hosted_research_worker --lane "%LANE%" --output-dir "research/runs/self_hosted/autonomous/%GITHUB_RUN_ID%/%LANE%" || exit /b 1
          endlocal

      - name: Stage autonomous evidence for upload
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-auto-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "LANE=${{ matrix.lane }}"
          if not exist "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%" mkdir "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%"
          xcopy /E /I /Y "%REPO_SRC%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%" "%GITHUB_WORKSPACE%\research\runs\self_hosted\autonomous\%GITHUB_RUN_ID%\%LANE%" >nul || exit /b 1
          endlocal

      - name: Upload autonomous evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: permanent-pc-loop-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            research/runs/self_hosted/autonomous/${{ github.run_id }}/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 14

  local_ai_smoke:
    needs: autonomous_pc
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 8
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Bootstrap local AI policy
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\enable_local_ai_worker.ps1"
          if errorlevel 1 exit /b 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-ai-smoke"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-ai-smoke.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Run local Gemini smoke test
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-ai-smoke\tools\python.exe"
          "%PY_EXE%" -m automation.local_ai_smoke > "%RUNNER_TEMP%\local-ai-smoke.json"
          type "%RUNNER_TEMP%\local-ai-smoke.json"

      - name: Upload local AI receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ai-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}\local-ai-smoke.json
          if-no-files-found: warn
          retention-days: 14
