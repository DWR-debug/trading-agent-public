name: F2 SEC Source Accessibility Probe (cloud)

on:
  push:
    branches: [master]
    paths:
      - "automation/f1_profitability_feasibility.py"
      - "automation/f2_quality_acceleration.py"
      - "docs/research_design/F2_QUALITY_ACCELERATION_FEASIBILITY_2026-09-28.md"
      - ".github/workflows/f2-sec-cloud-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-f2-sec-cloud-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        endpoint: ["submissions", "companyfacts"]
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Probe official SEC endpoint
        env:
          ENDPOINT: ${{ matrix.endpoint }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          urls = {
              "submissions": "https://data.sec.gov/submissions/CIK0001091987.json",
              "companyfacts": "https://data.sec.gov/api/xbrl/companyfacts/CIK0001091987.json",
          }
          url = urls[os.environ["ENDPOINT"]]
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "trading-agent-public research https://github.com/DWR-debug/trading-agent-public"},
          )
          result = {"endpoint": os.environ["ENDPOINT"], "url": url}
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read()
                  result.update({"status": "ACCESSIBLE", "http_status": response.status, "bytes": len(payload)})
          except urllib.error.HTTPError as exc:
              result.update({"status": "DATA_INSUFFICIENT", "http_status": exc.code, "error": str(exc)})
          except Exception as exc:
              result.update({"status": "DATA_INSUFFICIENT", "error": str(exc)})
          from pathlib import Path
          out = Path("research/runs/f2_sec_cloud_source_probe") / (os.environ["ENDPOINT"] + ".json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          if result["status"] == "ACCESSIBLE":
              assert result["bytes"] > 100
          PY

      - name: Upload SEC source probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f2-sec-cloud-probe-${{ matrix.endpoint }}-${{ github.run_id }}
          path: research/runs/f2_sec_cloud_source_probe/${{ matrix.endpoint }}.json
          if-no-files-found: error
          retention-days: 30
