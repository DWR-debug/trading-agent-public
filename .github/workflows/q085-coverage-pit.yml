name: Q085 Fresh Coverage and PIT (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q085_coverage_pit.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q085-coverage-pit
  cancel-in-progress: false

jobs:
  research:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 100
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q085"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q085.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Coverage discovery and snapshot build
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q085"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m pytest -q tests/test_q085_validation.py || exit /b 1
          "%PY_EXE%" automation/q085_coverage_pit.py coverage || exit /b 1
          endlocal

      - name: Persist complete Q085 snapshot before PIT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q085"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          set "BASE_SHA_FILE=%RUNNER_TEMP%\q085_base_sha.txt"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%BASE_SHA_FILE%" || exit /b 1
          set /p BASE_SHA=<"%BASE_SHA_FILE%"
          "%PY_EXE%" -c "import json,os,subprocess,sys; p=json.load(open('research/preregistrations/q085_performance_2026_09_28.json',encoding='utf-8')); syms=p['symbols']; files=['research/runs/q085_discovery/discovery.json','research/evidence/q085_coverage_result.json','research/evidence/q085_asset_freeze.json','research/preregistrations/q085_performance_2026_09_28.json','research/runs/q085_coverage/T-2026-09-28-085-COVERAGE/snapshot_manifest.json'] + [f'research/runs/q085_coverage/T-2026-09-28-085-COVERAGE/datasets/{s}/1d.csv' for s in syms]; cmd=[sys.executable,'automation/github_contents_publish.py','--repository',os.environ['GITHUB_REPOSITORY'],'--branch','master','--base-sha',open(r'%BASE_SHA_FILE%').read().strip()]; [cmd.extend(['--file',f+'='+f]) for f in files]; subprocess.check_call(cmd,env=os.environ)"
          endlocal

      - name: PIT against persisted bundle
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q085"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" automation/q085_coverage_pit.py pit || exit /b 1
          endlocal

      - name: Persist PIT receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q085-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q085"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "BASE_SHA_FILE=%RUNNER_TEMP%\q085_pit_base_sha.txt"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%BASE_SHA_FILE%" || exit /b 1
          set /p BASE_SHA=<"%BASE_SHA_FILE%"
          "%PY_EXE%" automation/github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/evidence/q085_pit_result.json=research\evidence\q085_pit_result.json || exit /b 1
          endlocal

      - name: Upload Q085 provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q085-coverage-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/q085_coverage/
            research/evidence/q085_coverage_result.json
            research/evidence/q085_asset_freeze.json
            research/evidence/q085_pit_result.json
          if-no-files-found: warn
          retention-days: 14
