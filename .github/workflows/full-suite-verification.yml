name: Full Suite Verification

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - docs/CURRENT_STATUS.md
      - research/evidence/current_operational_state.json
      - research/evidence/trading_agent_chat_handoff.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-full-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pandas exchange-calendars statsmodels==0.15.0 pypdf

      - name: Run full pytest suite
        id: pytest
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Diagnose pytest result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Pytest diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 "$RUNNER_TEMP/pytest.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pytest failure diagnosis to PR
        if: github.event_name == 'pull_request' && steps.pytest.outputs.exit_code != '0'
        uses: actions/github-script@v8
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync(process.env.PYTEST_LOG, 'utf8');
            const tail = log.split('\n').slice(-220).join('\n');
            const body = '## Hosted pytest failure diagnosis\n\n```text\n' + tail.slice(-18000) + '\n```\n\nRun: ' + context.runId + '\nCommit: ' + context.sha;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Run project integrity
        if: steps.pytest.outputs.exit_code == '0'
        shell: bash
        run: python automation/project_integrity_check.py

      - name: Run project-state freshness
        if: steps.pytest.outputs.exit_code == '0'
        shell: bash
        run: python automation/project_state_freshness_check.py

      - name: Verify safety invariants
        if: steps.pytest.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY

      - name: Fail job on pytest failure
        if: steps.pytest.outputs.exit_code != '0'
        shell: bash
        run: exit 1

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-suite-verification-${{ github.run_id }}
          path: |
            .pytest_cache/
          if-no-files-found: warn
          retention-days: 14
