name: Q079 Persist Frozen Input Bundle

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q079_persist_frozen_bundle.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q079-persist-frozen-bundle
  cancel-in-progress: false

jobs:
  persist:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download immutable successful Q079 artifact
        uses: actions/download-artifact@v5
        with:
          name: q079-coverage-pit
          path: ${{ runner.temp }}/q079-artifact
          repository: ${{ github.repository }}
          run-id: 36413173886
          github-token: ${{ github.token }}

      - name: Verify artifact identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("${{ runner.temp }}/q079-artifact")
          c=json.loads((root/"evidence/q079_coverage_result.json").read_text())
          p=json.loads((root/"evidence/q079_pit_result.json").read_text())
          assert c["trial_id"]=="T-2026-09-28-079-COVERAGE"
          assert c["status"]=="COVERAGE_PASSED"
          assert c["symbols"]==["HAL","LRCX","OXY","COF","FIS","FISV","GM","LHX"]
          assert c["performance_trial_authorized"] is False
          assert p["trial_id"]=="T-2026-09-28-079-PIT"
          assert p["status"]=="PIT_PASSED"
          assert p["symbols"]==c["symbols"]
          assert p["performance_trial_authorized"] is False
          assert (root/"runs/q079_coverage/T-2026-09-28-079-COVERAGE/snapshot_manifest.json").exists()
          print("Q079 ARTIFACT IDENTITY OK")
          print("SNAPSHOT",c["snapshot_fingerprint"])
          print("COVERAGE",c["result_fingerprint"])
          print("PIT",p["result_fingerprint"])
          PY

      - name: Restore exact successful snapshot
        run: |
          rm -rf research/runs/q079_coverage/T-2026-09-28-079-COVERAGE
          mkdir -p research/runs/q079_coverage
          cp -a "${{ runner.temp }}/q079-artifact/runs/q079_coverage/T-2026-09-28-079-COVERAGE" research/runs/q079_coverage/T-2026-09-28-079-COVERAGE
          cp "${{ runner.temp }}/q079-artifact/evidence/q079_coverage_result.json" research/evidence/q079_coverage_result.json
          cp "${{ runner.temp }}/q079-artifact/evidence/q079_pit_result.json" research/evidence/q079_pit_result.json

      - name: Freeze exact adjusted-close input bundle
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python automation/q079_input_freeze.py             --coverage-root research/runs/q079_coverage/T-2026-09-28-079-COVERAGE             --output-root research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE             --result research/evidence/q079_input_freeze_result.json

      - name: Validate complete immutable bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q079_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q079_pit_result.json").read_text())
          b=json.loads(Path("research/evidence/q079_input_freeze_result.json").read_text())
          assert c["status"]=="COVERAGE_PASSED"
          assert p["status"]=="PIT_PASSED"
          assert b["status"]=="INPUT_BUNDLE_FROZEN"
          assert len(b["datasets"])==8
          assert all(x["row_count"]==3500 for x in b["datasets"])
          assert b["performance_network_access"] is False
          print("Q079 COMPLETE INPUT BUNDLE OK")
          print("BUNDLE",b["bundle_fingerprint"])
          PY

      - name: Persist immutable Q079 evidence and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          export PUBLISH_MESSAGE="EVIDENCE: persist Q079 immutable coverage PIT input bundle"
          python automation/github_contents_publish.py             --repository "${GITHUB_REPOSITORY}"             --branch master             --base-sha "${BASE_SHA}"             --file research/evidence/q079_coverage_result.json=research/evidence/q079_coverage_result.json             --file research/evidence/q079_pit_result.json=research/evidence/q079_pit_result.json             --file research/evidence/q079_input_freeze_result.json=research/evidence/q079_input_freeze_result.json             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/snapshot_manifest.json=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/snapshot_manifest.json             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/HAL/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/HAL/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/LRCX/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/LRCX/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/OXY/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/OXY/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/COF/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/COF/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/FIS/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/FIS/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/FISV/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/FISV/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/GM/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/GM/1d.csv             --file research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/LHX/1d.csv=research/runs/q079_coverage/T-2026-09-28-079-COVERAGE/datasets/LHX/1d.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/input_bundle_manifest.json=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/input_bundle_manifest.json             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/HAL/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/HAL/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/LRCX/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/LRCX/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/OXY/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/OXY/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/COF/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/COF/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/FIS/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/FIS/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/FISV/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/FISV/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/GM/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/GM/adjusted_close.csv             --file research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/LHX/adjusted_close.csv=research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE/LHX/adjusted_close.csv

      - name: Upload persisted bundle artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q079-persisted-input-bundle
          path: |
            research/evidence/q079_coverage_result.json
            research/evidence/q079_pit_result.json
            research/evidence/q079_input_freeze_result.json
            research/runs/q079_coverage/T-2026-09-28-079-COVERAGE
            research/runs/q079_input_bundle/T-2026-09-28-079-INPUT-FREEZE
          retention-days: 30
