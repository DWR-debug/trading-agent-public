name: Cross Sectional Momentum Control

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/cross_sectional_momentum_control.py"
      - "tests/test_cross_sectional_momentum_control.py"
      - ".github/workflows/cross-sectional-momentum-control.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-cross-sectional-momentum-control
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "35778876546"
  SOURCE_ARTIFACT_NAME: "autonomous-research-small_cap_high_volatility-35778876546"

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Frisches Small-Cap-Archiv laden
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source_artifact
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Quelle und Datenidentität verifizieren
        run: |
          set -euo pipefail
          test -f source_artifact/research/runs/small_cap_high_volatility/data_manifest.json
          test -d source_artifact/data/market_data

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "source_artifact/research/runs/small_cap_high_volatility"
          )
          manifest = json.loads(
              (root / "data_manifest.json").read_text(encoding="utf-8")
          )

          assert manifest["universe"] == "small_cap_high_volatility"
          assert manifest["target_count"] == 1000
          assert manifest["provenance"]["run_id"] == "35778876546"
          assert len(manifest["datasets"]) == 5
          assert all(
              item["candle_count"] == 1000
              for item in manifest["datasets"]
          )

          print("SOURCE_ARCHIVE VERIFIED")
          print("MANIFEST_FINGERPRINT:", manifest["manifest_fingerprint"])
          for item in manifest["datasets"]:
              print(
                  item["symbol"],
                  item["candle_count"],
                  item["data_start"],
                  item["data_end"],
              )
          PY

      - name: Cross-Sectional-Momentum-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.cross_sectional_momentum_control             --data-dir source_artifact/data/market_data             --manifest source_artifact/research/runs/small_cap_high_volatility/data_manifest.json             --output research/cross_sectional_momentum_control/report.json

      - name: Ergebnis-Fingerprint prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/cross_sectional_momentum_control/report.json"
          )
          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["holdout_is_blind_to_selection"] is True
          assert report["methodology"]["exploratory_small_sample"] is True
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Cross-Sectional-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-momentum-control-${{ github.run_id }}
          path: research/cross_sectional_momentum_control/
          if-no-files-found: error
          retention-days: 30
