name: Risk Layer Attribution — 2026-09-23 — Public

on:
  push:
    branches:
      - master
    paths:
      - "automation/risk_layer_attribution_2026_09_23.py"
      - "tests/test_risk_layer_attribution_2026_09_23.py"
      - ".github/workflows/risk-layer-attribution-2026-09-23.yml"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/risk_layer_attribution_2026_09_23.py"
      - "tests/test_risk_layer_attribution_2026_09_23.py"
      - ".github/workflows/risk-layer-attribution-2026-09-23.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-public-risk-layer-attribution
  cancel-in-progress: true

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SECOND_ARTIFACT_ID: "10740188093"
      SECOND_ARTIFACT_DIGEST: "eed3ec6105dc7bc8616ab989ce6f086107b249f7fa087f6e851709af6e47354"
      THIRD_ARTIFACT_ID: "10745697729"
      THIRD_ARTIFACT_DIGEST: "b6a408b41abb218d285e06af4b91f66da3ed4ce431aef72907ca5873ffa2c731"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Zweites Validation-Artifact laden und prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/${SECOND_ARTIFACT_ID}/zip"             --output second.zip
          echo "${SECOND_ARTIFACT_DIGEST}  second.zip" | sha256sum -c -
          mkdir -p artifact_root
          unzip -q second.zip -d artifact_root

      - name: Drittes Validation-Artifact laden und prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/DWR-debug/trading-agent-public/actions/artifacts/${THIRD_ARTIFACT_ID}/zip"             --output third.zip
          echo "${THIRD_ARTIFACT_DIGEST}  third.zip" | sha256sum -c -
          unzip -q third.zip -d artifact_root

      - name: Risk-Layer-Attribution ausführen
        run: |
          set -euo pipefail
          python -m automation.risk_layer_attribution_2026_09_23             --artifact-root artifact_root             --output research/risk_layer_attribution_2026_09_23.json

      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/risk_layer_attribution_2026_09_23.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(result, sort_keys=True, separators=(",", ":"), ensure_ascii=True, allow_nan=False).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["parameter_search"] is False
          assert result["scope"]["selection"] is False
          assert result["scope"]["gate_changes"] is False
          assert result["scope"]["production_mutation"] is False
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          assert set(result["cases"]) == {"second_validation", "third_validation"}
          print("RISK_LAYER_ATTRIBUTION_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          PY

      - name: Attribution-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: risk-layer-attribution-2026-09-23-${{ github.run_id }}
          path: research/risk_layer_attribution_2026_09_23.json
          if-no-files-found: error
          retention-days: 30
