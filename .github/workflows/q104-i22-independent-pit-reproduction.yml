name: Q104 I22 Independent PIT Reproduction

on:
  pull_request:
    branches: [master]
    paths:
      - "automation/q104_i22_independent_pit_reproduction.py"
      - "tests/test_q104_i22_independent_pit_reproduction.py"
      - ".github/workflows/q104-i22-independent-pit-reproduction.yml"
  workflow_run:
    workflows: ["Full Suite Verification"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: q104-i22-independent-pit-reproduction
  cancel-in-progress: false

jobs:
  dispatch_gate:
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.decision.outputs.eligible }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Gate SEC work on a successful master full-suite run and material inputs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        shell: bash
        run: |
          set -euo pipefail
          eligible=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            eligible=true
          elif [ "$EVENT_NAME" = "workflow_run" ] &&
               [ "$WORKFLOW_NAME" = "Full Suite Verification" ] &&
               [ "$WORKFLOW_CONCLUSION" = "success" ] &&
               [ "$HEAD_BRANCH" = "master" ]; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^(automation/q104_i22_independent_pit_reproduction\.py|tests/test_q104_i22_independent_pit_reproduction\.py|\.github/workflows/q104-i22-independent-pit-reproduction\.yml|automation/project_integrity_check\.py|research/evidence/q104_i22_cross_arch_reconciliation_latest\.json|research/evidence/q107_coverage_result\.json|research/runs/q107_coverage/T-2026-10-01-107-Q104-COVERAGE/snapshot_manifest\.json|research/evidence/q108_pit_integration_2026_10_01\.json|research/preregistrations/q104_i22_filing_arrival_2026_10_01\.json|research/asset_universes\.py|research/governance/knowledge_relation_graph_contract_2026_10_06\.json|research/candidates/.*\.json|research/frontier/.*\.json)    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Paper-only invariants
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY
      - name: Independent compiler contract tests (offline)
        run: python -m pytest -q tests/test_q104_i22_independent_pit_reproduction.py

  independent_pit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Full Suite Verification' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       needs.dispatch_gate.outputs.eligible == 'true')
    needs: [contracts, dispatch_gate]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Download frozen Q104:I22 x64 compiler artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-i22-x64-38274043682
          path: /tmp/q104-i22-frozen/x64
          repository: ${{ github.repository }}
          run-id: 38274043682
          github-token: ${{ github.token }}
      - name: Download frozen Q104:I22 ARM64 compiler artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-i22-arm64-38274043682
          path: /tmp/q104-i22-frozen/arm64
          repository: ${{ github.repository }}
          run-id: 38274043682
          github-token: ${{ github.token }}
      - name: Independently reproduce SEC filing-arrival states
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m automation.q104_i22_independent_pit_reproduction \
            --x64-result /tmp/q104-i22-frozen/x64/result.json \
            --arm64-result /tmp/q104-i22-frozen/arm64/result.json \
            --output research/runs/q104_i22/independent_pit/result.json
      - name: Validate fail-closed non-authorizing receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/q104_i22/independent_pit/result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["validation_outcome"] == "INDEPENDENT_PIT_REPRODUCED"
          assert d["status"] in {
              "Q104_I22_INDEPENDENT_PIT_REPRODUCED_NON_OVERLAP_REVIEW_REQUIRED",
              "Q104_I22_INDEPENDENT_PIT_REPRODUCED_REVIEW_ONLY",
          }
          assert d["governance"]["performance_authorized"] is False
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["holdout_selection"] is False
          assert d["governance"]["candidate_ranking"] is False
          assert d["governance"]["automatic_promotion"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          print("I22 PIT receipt valid; mechanism non-overlap remains:", d["mechanism_non_overlap"]["status"])
          PY
      - name: Upload independent PIT receipt or blocked diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i22-independent-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i22/independent_pit/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish successful non-authorizing receipt
        if: >-
          success() &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
           (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$BASE_SHA"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$BASE_SHA" \
            --file "research/evidence/q104_i22_independent_pit_reproduction_latest.json=research/runs/q104_i22/independent_pit/result.json"
; then
              eligible=true
            fi
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  contracts:
    needs: [dispatch_gate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.dispatch_gate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Paper-only invariants
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY
      - name: Independent compiler contract tests (offline)
        run: python -m pytest -q tests/test_q104_i22_independent_pit_reproduction.py

  independent_pit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Full Suite Verification' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    needs: [contracts]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest exchange-calendars
      - name: Download frozen Q104:I22 x64 compiler artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-i22-x64-38274043682
          path: /tmp/q104-i22-frozen/x64
          repository: ${{ github.repository }}
          run-id: 38274043682
          github-token: ${{ github.token }}
      - name: Download frozen Q104:I22 ARM64 compiler artifact
        uses: actions/download-artifact@v6
        with:
          name: q104-i22-arm64-38274043682
          path: /tmp/q104-i22-frozen/arm64
          repository: ${{ github.repository }}
          run-id: 38274043682
          github-token: ${{ github.token }}
      - name: Independently reproduce SEC filing-arrival states
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m automation.q104_i22_independent_pit_reproduction \
            --x64-result /tmp/q104-i22-frozen/x64/result.json \
            --arm64-result /tmp/q104-i22-frozen/arm64/result.json \
            --output research/runs/q104_i22/independent_pit/result.json
      - name: Validate fail-closed non-authorizing receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/q104_i22/independent_pit/result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["validation_outcome"] == "INDEPENDENT_PIT_REPRODUCED"
          assert d["status"] in {
              "Q104_I22_INDEPENDENT_PIT_REPRODUCED_NON_OVERLAP_REVIEW_REQUIRED",
              "Q104_I22_INDEPENDENT_PIT_REPRODUCED_REVIEW_ONLY",
          }
          assert d["governance"]["performance_authorized"] is False
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["holdout_selection"] is False
          assert d["governance"]["candidate_ranking"] is False
          assert d["governance"]["automatic_promotion"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          print("I22 PIT receipt valid; mechanism non-overlap remains:", d["mechanism_non_overlap"]["status"])
          PY
      - name: Upload independent PIT receipt or blocked diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i22-independent-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i22/independent_pit/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish successful non-authorizing receipt
        if: >-
          success() &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
           (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$BASE_SHA"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$BASE_SHA" \
            --file "research/evidence/q104_i22_independent_pit_reproduction_latest.json=research/runs/q104_i22/independent_pit/result.json"
