name: Q077-R1 PIT Validation

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q077r1_pit_2026_09_28.json"
      - "automation/q077r1_pit.py"
      - "automation/q077r1_input_freeze.py"
      - "automation/q077r1_prepare_performance.py"
      - "research/preregistrations/q077r1_performance_2026_09_30.json"
      - "research/run_requests/q077r1_pit.trigger"
      - ".github/workflows/q077r1-pit.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  pit:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable Q077-R1 discovery receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q077r1_pit_2026_09_28.json").read_text())
          r=json.loads(Path("research/evidence/q077r1_discovery_result.json").read_text())
          assert r["source_workflow_run_id"]==36474584151
          assert r["source_artifact_id"]==10992758932
          assert r["discovery_fingerprint"]==p["discovery_fingerprint"]
          assert r["selected_coverage_batch"]==p["symbols"]
          assert r["selected_common_count"]>=3500
          assert r["performance_evaluation"] is False
          assert r["holdout_evaluation"] is False
          assert r["selection_used"] is False
          print("Q077R1 DISCOVERY RECEIPT OK")
          PY

      - name: Build frozen PIT snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from data.canonical_snapshot import SnapshotSpec, build_frozen_snapshot
          p=json.loads(Path("research/preregistrations/q077r1_pit_2026_09_28.json").read_text())
          out=Path('research/runs/q077r1_pit/T-2026-09-28-077R1-PIT')
          r=build_frozen_snapshot(SnapshotSpec(universe='validation_2026_09_28_q077r1_pit',symbols=tuple(p['symbols']),interval='1d',requested_candles=5000,target_common_candles=3500,raw_fetch_candles=5000,study_start=date(2011,1,1),study_end=date(2025,9,24),output_dir=out))
          assert r['status']=='COVERAGE_PASSED'
          print('Q077R1 SNAPSHOT READY',r['snapshot_fingerprint'])
          PY

      - name: Run PIT mutation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q077r1_pit --snapshot-root research/runs/q077r1_pit/T-2026-09-28-077R1-PIT --symbols-json <(python -c 'import json; print(json.dumps(json.load(open("research/preregistrations/q077r1_pit_2026_09_28.json"))["symbols"]))' ) --result research/evidence/q077r1_pit_result.json

      - name: Validate PIT safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/evidence/q077r1_pit_result.json').read_text())
          assert d["status"]=="PIT_PASSED" and d["performance_evaluation"] is False and d["holdout_evaluation"] is False
          assert d["selection_used"] is False and d["performance_trial_authorized"] is False
          assert d["future_mutation_checks_passed"] is True and d["next_session_mutation_checks_passed"] is True
          print('Q077R1 PIT CONTRACT OK',d['result_fingerprint'])
          PY

      - name: Create durable Q077-R1 coverage receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          discovery=json.loads(Path("research/evidence/q077r1_discovery_result.json").read_text(encoding="utf-8"))
          prereg=json.loads(Path("research/preregistrations/q077r1_pit_2026_09_28.json").read_text(encoding="utf-8"))
          manifest=json.loads(Path("research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/snapshot_manifest.json").read_text(encoding="utf-8"))
          assert discovery["discovery_fingerprint"]==prereg["discovery_fingerprint"]
          assert discovery["selected_coverage_batch"]==prereg["symbols"]
          assert manifest["symbols"]==prereg["symbols"]
          assert manifest["target_common_candles"]==3500
          receipt={
            "schema_version":"1.0",
            "trial_id":"T-2026-09-28-077R1-COVERAGE",
            "research_family":"q077_r1_fresh_e1_e2_replication_coverage",
            "status":"COVERAGE_PASSED",
            "symbols":list(prereg["symbols"]),
            "common_calendar_count":manifest["coverage"]["common_calendar_count"],
            "snapshot_fingerprint":manifest["snapshot_fingerprint"],
            "discovery_trial_id":"Q-2026-09-28-077R1-DISCOVERY",
            "discovery_fingerprint":discovery["discovery_fingerprint"],
            "performance_evaluation":False,
            "holdout_evaluation":False,
            "selection_used":False,
            "asset_selection_by_performance":False,
            "performance_trial_authorized":False,
            "safety":{"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          }
          payload=json.dumps(receipt,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()
          receipt["result_fingerprint"]=hashlib.sha256(payload).hexdigest()
          Path("research/evidence/q077r1_coverage_result.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("Q077R1 COVERAGE RECEIPT",receipt["result_fingerprint"])
          PY
      - name: Validate Q077-R1 freeze helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/q077r1_input_freeze.py automation/q077r1_prepare_performance.py

      - name: Freeze exact Q077-R1 adjusted-close input bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q077r1_input_freeze \
            --coverage-root research/runs/q077r1_pit/T-2026-09-28-077R1-PIT \
            --output-root research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE \
            --result research/evidence/q077r1_input_freeze_result.json

      - name: Validate immutable Q077-R1 input bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q077r1_input_freeze_result.json").read_text(encoding="utf-8"))
          assert d["trial_id"]=="T-2026-09-28-077R1-INPUT-FREEZE"
          assert d["status"]=="INPUT_BUNDLE_FROZEN"
          assert d["performance_evaluation"] is False
          assert d["selection_used"] is False
          assert d["performance_network_access"] is False
          assert len(d["datasets"])==12
          assert all(x["row_count"]==3500 for x in d["datasets"])
          assert Path("research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/input_bundle_manifest.json").exists()
          print("Q077R1 INPUT FREEZE CONTRACT OK",d["bundle_fingerprint"])
          PY

      - name: Freeze Q077-R1 performance preregistration metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q077r1_prepare_performance
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q077r1_performance_2026_09_30.json").read_text(encoding="utf-8"))
          assert p["status"]=="PREREGISTERED_PERFORMANCE"
          assert p["governance"]["performance_trial_authorized"] is False
          assert p["data_contract"]["coverage_result_fingerprint"]
          assert p["data_contract"]["snapshot_fingerprint"]
          assert p["data_contract"]["pit_result_fingerprint"]
          assert p["data_contract"]["input_bundle_fingerprint"]
          assert all(p["source_contract"][k] for k in ("performance_runner_sha256","alpha_mechanism_sha256","cost_contract_sha256","settings_sha256","input_freeze_sha256"))
          print("Q077R1 PERFORMANCE PREREGISTRATION FROZEN")
          PY
      - name: Persist Q077-R1 immutable coverage, PIT and input bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --branch master
            --file research/evidence/q077r1_discovery_result.json=research/evidence/q077r1_discovery_result.json
            --file research/evidence/q077r1_coverage_result.json=research/evidence/q077r1_coverage_result.json
            --file research/evidence/q077r1_pit_result.json=research/evidence/q077r1_pit_result.json
            --file research/evidence/q077r1_input_freeze_result.json=research/evidence/q077r1_input_freeze_result.json
            --file research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/snapshot_manifest.json=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/snapshot_manifest.json
            --file research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/input_bundle_manifest.json=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/input_bundle_manifest.json
            --file research/preregistrations/q077r1_performance_2026_09_30.json=research/preregistrations/q077r1_performance_2026_09_30.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json
          )
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AJG/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AJG/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AJG/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AJG/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/ALGN/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/ALGN/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/ALGN/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/ALGN/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AME/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AME/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AME/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AME/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AOS/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AOS/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AOS/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AOS/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/APH/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/APH/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/APH/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/APH/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AXON/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/AXON/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AXON/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/AXON/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BAH/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BAH/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BAH/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BAH/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BALL/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BALL/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BALL/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BALL/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BBWI/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BBWI/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BBWI/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BBWI/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BRO/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BRO/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BRO/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BRO/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BWA/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/BWA/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BWA/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/BWA/adjusted_close.csv")
          args+=(--file "research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/CDNS/1d.csv=research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/datasets/CDNS/1d.csv")
          args+=(--file "research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/CDNS/adjusted_close.csv=research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/CDNS/adjusted_close.csv")
          for attempt in 1 2 3 4 5; do
            base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test -n "$base_sha"
            if python automation/github_contents_publish.py "${args[@]}" --base-sha "$base_sha"; then
              echo "Q077R1 persistence succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Q077R1 persistence failed after 5 attempts" >&2
              exit 1
            fi
            echo "Q077R1 persistence raced with another master update; retrying attempt $((attempt+1))"
            sleep $((attempt * 2))
          done
      - name: Upload Q077-R1 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q077r1-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q077r1_discovery_result.json
            research/evidence/q077r1_coverage_result.json
            research/evidence/q077r1_pit_result.json
            research/evidence/q077r1_input_freeze_result.json
            research/preregistrations/q077r1_performance_2026_09_30.json
            research/runs/q077r1_pit/T-2026-09-28-077R1-PIT/
            research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/
          if-no-files-found: error
          retention-days: 30
