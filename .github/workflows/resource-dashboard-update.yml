name: Resource Dashboard Update

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [master]
    paths:
      - "research/run_requests/dashboard_refresh.trigger"
      - ".github/workflows/resource-dashboard-update.yml"
      - "automation/generate_resource_dashboard.py"
      - "docs/dashboard/index.html"
      - "docs/dashboard/dashboard.js"
      - "ops/trading_agent_os_state.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trading-agent-resource-dashboard
  cancel-in-progress: true

jobs:
  update_and_deploy:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Generate current live dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py

      - name: Validate dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/dashboard/dashboard_data.json
          test -s docs/dashboard/dashboard_bootstrap.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy current dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload refresh snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-dashboard-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/dashboard/dashboard_data.json
            docs/dashboard/dashboard_bootstrap.js
          if-no-files-found: error
          retention-days: 7
