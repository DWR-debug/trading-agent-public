name: Resource Dashboard Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "Q104 I19 Historical 13F Identity Census"
      - "Q104 I19 Historical PIT Compilation"
      - "Q104 I19 Independent PIT Reproduction"
      - "Top-4 Candidate Slot Research"
      - "Q218 Independent Architecture PIT Reproduction"
      - "Q218 Independent Fresh-Symbol Replication"
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths:
      - "research/run_requests/dashboard_refresh.trigger"
      - ".github/workflows/resource-dashboard-update.yml"
      - "automation/generate_resource_dashboard.py"
      - "docs/CURRENT_STATUS.md"
      - "research/evidence/current_operational_state.json"
      - "docs/dashboard/index.html"
      - "docs/dashboard/dashboard.js"
      - "ops/trading_agent_os_state.json"
      - "research/evidence/q104_i19_13f_historical_identity_census_latest.json"
      - "research/evidence/q104_i19_historical_pit_compilation_latest.json"
      - "research/evidence/q104_i19_independent_pit_reproduction_latest.json"
      - "research/evidence/q218_focus_gate_receipt_index_latest.json"
      - "research/evidence/q218_independent_architecture_pit_reproduction_latest.json"
      - "research/evidence/q218_prereg_authorization_reconcile_latest.json"
      - "research/evidence/q218_deterministic_performance_result_latest.json"
      - "research/evidence/q218_independent_replication_event_pair_latest.json"
      - "research/evidence/q218_independent_replication_input_bundle_latest.json"
      - "research/evidence/q218_independent_replication_robustness_latest.json"
      - "research/evidence/q218_independent_replication_performance_latest.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trading-agent-resource-dashboard
  cancel-in-progress: true

jobs:
  update_and_deploy:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'master' &&
        (contains(github.event.workflow_run.display_title, 'Q218') ||
         contains(github.event.workflow_run.display_title, 'Q104 I19'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Generate current live dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py

      - name: Validate dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/dashboard/dashboard_data.json
          test -s docs/dashboard/dashboard_bootstrap.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy current dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload refresh snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-dashboard-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/dashboard/dashboard_data.json
            docs/dashboard/dashboard_bootstrap.js
          if-no-files-found: error
          retention-days: 7
