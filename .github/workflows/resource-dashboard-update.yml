name: Resource Dashboard Update

on:
  schedule:
    - cron: "35 3 * * *"
  push:
    branches: [master]
    paths:
      - "research/run_requests/dashboard_refresh.trigger"
      - ".github/workflows/resource-dashboard-update.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read
  administration: read
  pages: write
  id-token: write

concurrency:
  group: trading-agent-resource-dashboard
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Generate dashboard snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py

      - name: Persist changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- docs/dashboard/dashboard_data.json; then
              echo "DASHBOARD_UPDATE=UNCHANGED"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/dashboard/dashboard_data.json
            git commit -m "OPS: refresh resource dashboard snapshot"
            if git push origin HEAD:master; then
              echo "DASHBOARD_UPDATE=PERSISTED attempt=$attempt"
              exit 0
            fi
            echo "Dashboard snapshot push raced with another master update on attempt $attempt; rebasing snapshot onto current master."
            git fetch origin master
            git reset --hard origin/master
            python3 automation/generate_resource_dashboard.py
            sleep "$attempt"
          done
          echo "Unable to persist dashboard snapshot after retries." >&2
          exit 1

  deploy_pages:
    needs: update
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.update.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy current dashboard
        id: deployment
        uses: actions/deploy-pages@v4
