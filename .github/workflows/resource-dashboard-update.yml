name: Resource Dashboard Update

on:
  schedule:
    - cron: "35 3 * * *"
  push:
    branches: [master]
    paths:
      - "research/run_requests/dashboard_refresh.trigger"
      - ".github/workflows/resource-dashboard-update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-resource-dashboard
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Generate dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py

      - name: Commit changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/dashboard/dashboard_data.json; then
            echo "DASHBOARD_UPDATE=UNCHANGED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/dashboard_data.json
          git commit -m "OPS: refresh resource dashboard snapshot"
          git push origin HEAD:master
