name: Q095 Independent Monthly Rebalance Performance Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q095_performance_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q095-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact Q095 trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q095_performance_once.trigger
          grep -Fx "RUN_Q095_MONTHLY_REBALANCE_PERFORMANCE_ONCE=true" research/run_requests/q095_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-29-095" research/run_requests/q095_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q095_performance_once.trigger
          echo "Q095 PERFORMANCE TRIGGER VERIFIED"

      - name: Restore exact frozen Q095 preparation artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11033673918
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36571149602
          path: _q095_prep
          merge-multiple: true

      - name: Materialize frozen Q095 preparation artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d _q095_prep/runs/q095_coverage/T-2026-09-29-095-COVERAGE/datasets
          test -d _q095_prep/runs/q095_input_bundle/T-2026-09-29-095-INPUT-FREEZE
          mkdir -p research/evidence research/runs
          cp -a _q095_prep/evidence/. research/evidence/
          cp -a _q095_prep/runs/. research/runs/

      - name: Verify restored frozen Q095 preparation
        shell: bash
        run: |
          set -euo pipefail
          for symbol in ALB BR CNP EFX EXPD GEN IFF IT; do
            test -s "research/runs/q095_coverage/T-2026-09-29-095-COVERAGE/datasets/$symbol/1d.csv"
            test -s "research/runs/q095_input_bundle/T-2026-09-29-095-INPUT-FREEZE/$symbol/adjusted_close.csv"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          cov=json.loads(Path("research/evidence/q095_coverage_result.json").read_text())
          pit=json.loads(Path("research/evidence/q095_pit_result.json").read_text())
          inp=json.loads(Path("research/evidence/q095_input_freeze_result.json").read_text())
          snap=json.loads(Path("research/runs/q095_coverage/T-2026-09-29-095-COVERAGE/snapshot_manifest.json").read_text())
          bundle=json.loads(Path("research/runs/q095_input_bundle/T-2026-09-29-095-INPUT-FREEZE/input_bundle_manifest.json").read_text())
          assert cov["result_fingerprint"]=="9d03dc1c4b01ff8713a25a35b3551ab9ef059b3a0f8f2dc77671a0ba3bc60c53"
          assert cov["snapshot_fingerprint"]=="d796e11c069e7dd4fb036a9dda804136da8703dbdbc2f64a46f787f32c61130c"
          assert pit["result_fingerprint"]=="34b83403d86cda4a4b68382a860bf11d5ba1c7c6eba197add23c924094baae9"
          assert inp["bundle_fingerprint"]=="7a16c2b1c91d9194c9a8e450c8009f3030b28a59d70f7c354c6d6dac56a3e705"
          assert snap["snapshot_fingerprint"]==cov["snapshot_fingerprint"]
          assert bundle["bundle_fingerprint"]==inp["bundle_fingerprint"]
          print("Q095 FROZEN PREPARATION RESTORE VERIFIED")
          PY
      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Fail-closed active registry guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          entry=next((x for x in reg.get("active_trials",[]) if x.get("code")=="095"),None)
          assert entry is not None
          assert entry["trial_id"]=="T-2026-09-29-095"
          assert entry["performance_authorization_allowed"] is True
          assert entry["state"]=="PERFORMANCE_AUTHORIZED"
          print("Q095 ACTIVE AUTHORIZATION GUARD PASSED")
          PY

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q095 SAFETY INVARIANTS OK")
          PY

      - name: Governance and source-contract preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json").read_text(encoding="utf-8"))
          auth=json.loads(Path("research/authorizations/q095_performance_2026_09_29.json").read_text(encoding="utf-8"))
          assert p["status"]=="PREREGISTERED_PERFORMANCE"
          assert p["governance"]["performance_trial_authorized"] is True
          assert p["data_contract"]["symbols"]==["ALB","BR","CNP","EFX","EXPD","GEN","IFF","IT"]
          assert auth["trial_id"]=="T-2026-09-29-095"
          assert auth["authorized"] is True and auth["performance_execution_authorized"] is True and auth["one_shot"] is True
          prereg_fp=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert auth["preregistration_fingerprint"]==prereg_fp
          assert auth["input_bundle_fingerprint"]==p["data_contract"]["input_bundle_fingerprint"]
          checks={
            "performance_runner_sha256":"automation/q095_performance.py",
            "monthly_overlay_sha256":"portfolio/q094_monthly_rebalance.py",
            "candidate_bank_sha256":"automation/q069_candidate_bank.py",
            "cost_contract_sha256":"execution/cost_contract.py",
            "settings_sha256":"config/settings.py",
            "input_freeze_sha256":"automation/q095_coverage_pit.py",
          }
          for key,path in checks.items():
              assert p["source_contract"][key]==hashlib.sha256(Path(path).read_bytes()).hexdigest(), key
          print("Q095 GOVERNANCE/SOURCE CONTRACT PASS")
          print("PREREGISTRATION_FINGERPRINT="+prereg_fp)
          PY

      - name: Verify frozen Q095 preparation
        shell: bash
        run: |
          set -euo pipefail
          test -f research/evidence/q095_coverage_result.json
          test -f research/evidence/q095_pit_result.json
          test -f research/evidence/q095_input_freeze_result.json
          test -f research/runs/q095_coverage/T-2026-09-29-095-COVERAGE/snapshot_manifest.json
          test -f research/runs/q095_input_bundle/T-2026-09-29-095-INPUT-FREEZE/input_bundle_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          cov=json.loads(Path("research/evidence/q095_coverage_result.json").read_text())
          pit=json.loads(Path("research/evidence/q095_pit_result.json").read_text())
          inp=json.loads(Path("research/evidence/q095_input_freeze_result.json").read_text())
          assert cov["status"]=="COVERAGE_PASSED" and cov["performance_evaluation"] is False
          assert pit["status"]=="PIT_PASSED" and pit["performance_evaluation"] is False
          assert inp["status"]=="INPUT_BUNDLE_FROZEN" and inp["performance_evaluation"] is False
          print("Q095 FROZEN PREPARATION VERIFIED")
          PY

      - name: Structural regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q094_monthly_rebalance.py
          python -m py_compile automation/q095_performance.py automation/q095_reconcile.py

      - name: Execute Q095 fixed monthly-rebalance performance exactly once
        shell: bash
        env:
          Q095_PERFORMANCE_ONCE: "true"
        run: |
          set -euo pipefail
          python -m automation.q095_performance --repo-root . --output research/evidence/q095_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q095_reconcile --repo-root . --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish Q095 result, ledger and retired authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$base_sha" \
            --file research/evidence/q095_performance_result.json=research/evidence/q095_performance_result.json \
            --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload Q095 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q095-independent-replication-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q095_performance_result.json
          if-no-files-found: warn
          retention-days: 30
