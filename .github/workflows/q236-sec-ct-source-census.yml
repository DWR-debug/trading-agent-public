name: Q236 SEC Confidential-Treatment Source Census

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "automation/q236_sec_ct_source_census.py"
      - "tests/test_q236_sec_ct_source_census.py"
      - "research/preregistrations/q236_sec_confidential_treatment_source_census_2026_10_06.json"
      - ".github/workflows/q236-sec-ct-source-census.yml"

permissions:
  contents: read

jobs:
  census:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q236_sec_ct_source_census.py
      - name: Run Q236 source census
        run: |
          python -m automation.q236_sec_ct_source_census \
            --output research/runs/q236_sec_ct_source_census/result.json
      - name: Validate non-authorizing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q236_sec_ct_source_census/result.json").read_text())
          assert p["status"] == "Q236_SEC_CT_SOURCE_CENSUS_COMPLETED"
          assert p["quarters_checked"] == 44
          assert p["sample_size"] > 0
          assert p["interpretation"]["public_observation_time_proven"] is False
          assert p["interpretation"]["same_day_pit_safe"] is False
          assert p["interpretation"]["approval_extension_unredacted_lineage_compiled"] is False
          assert p["interpretation"]["full_linked_exhibit_lineage_compiled"] is False
          for key in (
              "performance","holdout_selection","ranking","parameter_search",
              "threshold_search","horizon_search","asset_search","variant_search",
              "promotion","performance_authorized","automatic_promotion","live_execution"
          ):
              assert p["governance"][key] is False
          assert p["safety"]["PAPER_ONLY"] is True
          assert p["safety"]["LIVE_TRADING_ENABLED"] is False
          assert p["safety"]["ORDERS_ENABLED"] is False
          assert p["safety"]["AUTOMATIC_PROMOTION"] is False
          print("Q236_BOUNDARY=PASS")
          print("Q236_ROWS=", p["filtered_ct_order_rows"])
          print("Q236_SAMPLE=", p["sample_size"])
          print("Q236_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload Q236 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q236-sec-ct-source-census-${{ github.run_id }}
          path: research/runs/q236_sec_ct_source_census/result.json
          if-no-files-found: error
          retention-days: 30
