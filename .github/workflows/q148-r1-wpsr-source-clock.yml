name: Q148-R1 EIA WPSR Source Clock Feasibility

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - automation/q148_r1_wpsr_source_clock.py
      - tests/test_q148_r1_wpsr_source_clock.py
      - research/preregistrations/q148_r1_wpsr_source_clock_2026_10_04.json
      - .github/workflows/q148-r1-wpsr-source-clock.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q148_r1_wpsr_source_clock.py
      - name: Run Q148-R1
        run: python -m automation.q148_r1_wpsr_source_clock --output research/runs/q148_r1_wpsr_source_clock/result.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/runs/q148_r1_wpsr_source_clock/result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q148R1_WPSR_SOURCE_CLOCK_CONTRACT_COMPLETED"
          assert len(p["controls"]) == 3
          assert all(c["issue_http_status"] == 200 for c in p["controls"])
          assert all(c["table4_http_status"] == 200 for c in p["controls"])
          assert all(c["rendered_metadata_contains_table_4_title"] for c in p["controls"])
          assert p["pit_boundary"]["exact_first_public_availability_timestamp_proven"] is False
          assert p["pit_boundary"]["candidate_specific_revision_lineage_proven"] is False
          assert p["pit_boundary"]["same_day_pit_safe"] is False
          assert all(v is False for v in p["scientific_boundary"].values())
          assert all(v is False for v in p["governance"].values())
          assert p["safety"]["PAPER_ONLY"] is True
          assert p["safety"]["LIVE_TRADING_ENABLED"] is False
          assert p["safety"]["ORDERS_ENABLED"] is False
          assert p["safety"]["AUTOMATIC_PROMOTION"] is False
          print("Q148R1_BOUNDARY=PASS")
          print("Q148R1_RECEIPT=" + p["receipt_fingerprint"])
          PY
      - name: Upload Q148-R1 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q148-r1-wpsr-source-clock-${{ github.run_id }}
          path: research/runs/q148_r1_wpsr_source_clock/result.json
          if-no-files-found: error
          retention-days: 30
