name: Capacity Saturation & Rolling Research Waves

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
    paths:
      - "research/run_requests/rolling_capacity_window_2026-10-05.json"
      - ".github/workflows/capacity-saturation-rolling-waves.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-capacity-saturation-waves
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Validate rolling capacity contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          p=json.load(open("research/run_requests/rolling_capacity_window_2026-10-05.json",encoding="utf-8"))
          s=datetime.fromisoformat(p["start_utc"].replace("Z","+00:00"))
          e=datetime.fromisoformat(p["end_utc"].replace("Z","+00:00"))
          assert (e-s).total_seconds()==7200
          assert p["cadence_minutes"]==10
          assert p["safety"]["PAPER_ONLY"] is True
          assert all(p["safety"][k] is False for k in ("performance","holdout_selection","ranking","tuning","promotion","live_execution"))
          assert [w["start_after_minutes"] for w in p["phases"]] == [0,30,60,90]
          print("ROLLING_CAPACITY_CONTRACT_OK")
          PY
          python -m pytest -q tests/test_rolling_capacity_window.py

      - name: Dispatch ready cumulative rolling waves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          start_iso="$(jq -r .start_utc research/run_requests/rolling_capacity_window_2026-10-05.json)"
          end_iso="$(jq -r .end_utc research/run_requests/rolling_capacity_window_2026-10-05.json)"
          start_epoch="$(date -d "$start_iso" +%s)"
          end_epoch="$(date -d "$end_iso" +%s)"
          if (( now_epoch < start_epoch || now_epoch >= end_epoch )); then
            echo "ROLLING_CAPACITY_WINDOW=INACTIVE"
            exit 0
          fi

          elapsed=$(( (now_epoch - start_epoch) / 60 ))
          current_sha="$GITHUB_SHA"
          declare -a workflows=()

          add_phase() {
            local offset="$1"
            shift
            if (( elapsed >= offset )); then
              for workflow in "$@"; do workflows+=("$workflow"); done
            fi
          }

          add_phase 0             q121r6-sec-acceptance-time-compilation.yml             q185-q186-source-feasibility.yml             q187-q192-source-feasibility.yml             q187-q192-pit-readiness-r1.yml             q188-q192-pit-census-r2.yml             q197-q198-source-feasibility.yml             q198-pit-clock-census.yml             q199-q201-source-feasibility.yml             q214-disclosure-risk-feasibility.yml             windows-runner-c-long-research.yml

          add_phase 30             q193-q196-source-feasibility.yml             orthogonal-candidate-development.yml             q202-q204-information-timing-feasibility.yml             q205-nlrb-source-feasibility.yml             q119-treasury-source-feasibility.yml

          add_phase 60             orthogonal-pit-next-gate.yml             windows-runner-c-long-research.yml

          add_phase 90             literature-frontier-scout.yml             research-orchestrator.yml             orthogonal-pit-next-gate.yml

          mapfile -t workflows < <(printf '%s
' "${workflows[@]}" | awk 'NF && !seen[$0]++')
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
          dispatch_limit="$(jq -r '.max_dispatch_per_tick' research/run_requests/rolling_capacity_window_2026-10-05.json)"
          dispatch_count=0

          for workflow in "${workflows[@]}"; do
            if (( dispatch_count >= dispatch_limit )); then
              echo "SKIP_DISPATCH_LIMIT workflow=$workflow"
              continue
            fi

            wf_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/$workflow"
            workflow_runs="$(printf '%s' "$runs" | jq --arg wf "$wf_url" '[.workflow_runs[] | select(.workflow_url == $wf)]')"
            active="$(printf '%s' "$workflow_runs" | jq '[.[] | select(.status != "completed")] | length')"
            if (( active > 0 )); then
              echo "SKIP_ACTIVE $workflow"
              continue
            fi

            current_success="$(printf '%s' "$workflow_runs" | jq --arg sha "$current_sha" '[.[] | select(.head_sha == $sha) | select(.conclusion == "success")] | length')"
            current_failed="$(printf '%s' "$workflow_runs" | jq --arg sha "$current_sha" --argjson start_epoch "$start_epoch" '[.[] | select(.head_sha == $sha) | select((.created_at | fromdateiso8601) >= $start_epoch) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')"

            if (( current_success > 0 )); then
              echo "SKIP_CURRENT_SHA_SUCCESS $workflow"
              continue
            fi
            if (( current_failed > 1 )); then
              echo "SKIP_RETRY_LIMIT $workflow"
              continue
            fi

            if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref master; then
              echo "DISPATCHED $workflow"
              dispatch_count=$((dispatch_count + 1))
            else
              echo "DISPATCH_FAILED $workflow"
              exit 1
            fi
          done
