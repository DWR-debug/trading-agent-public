name: Capacity Saturation and Rolling Research Waves

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
    paths:
      - research/run_requests/rolling_capacity_window_2026-10-05.json
      - .github/workflows/capacity-saturation-rolling-waves.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-capacity-saturation-waves
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Validate and dispatch bounded cumulative waves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ready_workflows.txt
          import json,datetime
          p=json.load(open('research/run_requests/rolling_capacity_window_2026-10-05.json',encoding='utf-8'))
          s=datetime.datetime.fromisoformat(p['start_utc'].replace('Z','+00:00'))
          e=datetime.datetime.fromisoformat(p['end_utc'].replace('Z','+00:00'))
          now=datetime.datetime.now(datetime.timezone.utc)
          assert (e-s).total_seconds()==7200
          assert p['cadence_minutes']==10
          assert p['safety']['PAPER_ONLY'] is True
          assert all(p['safety'][k] is False for k in ('performance','holdout_selection','ranking','tuning','promotion','live_execution'))
          if not (s <= now < e): print('WINDOW_INACTIVE'); raise SystemExit(0)
          elapsed=(now-s).total_seconds()/60
          seen=set(); ready=[]
          for phase in p['phases']:
              if elapsed >= phase['start_after_minutes']:
                  for wf in phase['workflows']:
                      if wf not in seen: seen.add(wf); ready.append(wf)
          for wf in ready: print(wf)
          PY
          if [[ "$(head -1 /tmp/ready_workflows.txt)" == "WINDOW_INACTIVE" ]]; then echo "ROLLING_CAPACITY_WINDOW=INACTIVE"; exit 0; fi
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=200")"
          limit="$(jq -r .max_dispatch_per_tick research/run_requests/rolling_capacity_window_2026-10-05.json)"
          count=0
          while IFS= read -r workflow; do
            [[ -n "$workflow" ]] || continue
            if (( count >= limit )); then echo "SKIP_DISPATCH_LIMIT ${workflow}"; continue; fi
            [[ -f ".github/workflows/${workflow}" ]] || { echo "SKIP_MISSING ${workflow}"; continue; }
            active="$(printf '%s' "$runs" | jq --arg wf "https://github.com/$GITHUB_REPOSITORY/actions/workflows/$workflow" '[.workflow_runs[] | select(.status != "completed") | select(.workflow_url == $wf)] | length')"
            if (( active > 0 )); then echo "SKIP_ACTIVE ${workflow} active=${active}"; continue; fi
            if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref master; then echo "DISPATCHED ${workflow}"; count=$((count+1)); else echo "DISPATCH_FAILED_NONBLOCKING ${workflow}"; fi
          done < /tmp/ready_workflows.txt
