name: Capacity Saturation and Rolling Research Waves

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
    paths:
      - research/run_requests/rolling_capacity_window_2026-10-05.json
      - .github/workflows/capacity-saturation-rolling-waves.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-capacity-saturation-waves
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Validate and dispatch bounded cumulative waves
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ready_workflows.txt
          import json,datetime
          p=json.load(open('research/run_requests/rolling_capacity_window_2026-10-05.json',encoding='utf-8'))
          s=datetime.datetime.fromisoformat(p['start_utc'].replace('Z','+00:00'))
          e=datetime.datetime.fromisoformat(p['end_utc'].replace('Z','+00:00'))
          now=datetime.datetime.now(datetime.timezone.utc)
          assert (e-s).total_seconds()==7200
          assert p['cadence_minutes']==10
          assert p['safety']['PAPER_ONLY'] is True
          assert all(p['safety'][k] is False for k in ('performance','holdout_selection','ranking','tuning','promotion','live_execution'))
          if not (s <= now < e): print('WINDOW_INACTIVE'); raise SystemExit(0)
          elapsed=(now-s).total_seconds()/60
          seen=set(); ready=[]
          for phase in p['phases']:
              if elapsed >= phase['start_after_minutes']:
                  phase_start=s+datetime.timedelta(minutes=phase['start_after_minutes'])
                  phase_start_epoch=int(phase_start.timestamp())
                  for wf in phase['workflows']:
                      key=(phase['id'],wf)
                      if key not in seen:
                          seen.add(key)
                          ready.append((phase['id'],phase_start_epoch,wf))
          for phase_id,phase_start_epoch,wf in ready:
              print(f"{phase_id}|{phase_start_epoch}|{wf}")
          PY
          if [[ "$(head -1 /tmp/ready_workflows.txt)" == "WINDOW_INACTIVE" ]]; then echo "ROLLING_CAPACITY_WINDOW=INACTIVE"; exit 0; fi
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=200")"
          limit="$(jq -r .max_dispatch_per_tick research/run_requests/rolling_capacity_window_2026-10-05.json)"
          cooldown_minutes="$(jq -r '.recent_success_cooldown_minutes // 360' research/run_requests/rolling_capacity_window_2026-10-05.json)"
          cooldown_epoch="$(( $(date +%s) - cooldown_minutes*60 ))"
          count=0
          while IFS='|' read -r phase_id phase_start_epoch workflow; do
            [[ -n "$workflow" ]] || continue
            if (( count >= limit )); then echo "SKIP_DISPATCH_LIMIT ${phase_id} ${workflow}"; continue; fi
            [[ -f ".github/workflows/${workflow}" ]] || { echo "SKIP_MISSING ${phase_id} ${workflow}"; continue; }
            active="$(printf '%s' "$runs" | jq --arg wf "https://github.com/$GITHUB_REPOSITORY/actions/workflows/${workflow}" '[.workflow_runs[] | select(.status != "completed") | select(.workflow_url == $wf) | select(.head_branch == "master")] | length')"
            if (( active > 0 )); then echo "SKIP_ACTIVE ${phase_id} ${workflow} active=${active}"; continue; fi
            recent_success="$(printf '%s' "$runs" | jq --arg wf "https://github.com/$GITHUB_REPOSITORY/actions/workflows/${workflow}" --argjson cooldown_epoch "${cooldown_epoch}" '[.workflow_runs[] | select(.conclusion == "success") | select(.workflow_url == $wf) | select(.head_branch == "master") | select((.created_at | fromdateiso8601) >= $cooldown_epoch)] | length')"
            if (( recent_success > 0 )); then echo "SKIP_RECENT_SUCCESS ${phase_id} ${workflow} cooldown=${cooldown_minutes}m"; continue; fi
            phase_attempts="$(printf '%s' "$runs" | jq --arg wf "https://github.com/$GITHUB_REPOSITORY/actions/workflows/${workflow}" --argjson phase_start_epoch "${phase_start_epoch}" '[.workflow_runs[] | select(.workflow_url == $wf) | select(.head_branch == "master") | select((.created_at | fromdateiso8601) >= $phase_start_epoch)] | length')"
            if (( phase_attempts >= 2 )); then echo "SKIP_RETRY_LIMIT ${phase_id} ${workflow} attempts=${phase_attempts}"; continue; fi
            if gh workflow run "${workflow}" --repo "$GITHUB_REPOSITORY" --ref master; then echo "DISPATCHED ${phase_id} ${workflow}"; count=$((count+1)); else echo "DISPATCH_FAILED_NONBLOCKING ${phase_id} ${workflow}"; fi
          done < /tmp/ready_workflows.txt
