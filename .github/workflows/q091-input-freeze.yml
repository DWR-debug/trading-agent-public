name: Q091 Immutable Adjusted-Close Input Freeze

on:
  push:
    branches: [master]
    paths:
      - ".github/ops/q091_input_freeze.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q091-input-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pypdf

      - name: Safety and non-performance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q091 INPUT FREEZE SAFETY OK")
          PY

      - name: Check whether bundle is already persisted
        id: prior
        shell: bash
        run: |
          if test -f research/evidence/q091_input_freeze_result.json && test -f research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/input_bundle_manifest.json; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze adjusted-close bundle
        if: steps.prior.outputs.already != 'true'
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m automation.q091_input_freeze \
            --repo-root . \
            --output-root research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE \
            --result research/evidence/q091_input_freeze_result.json

      - name: Validate immutable bundle
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q091_input_freeze_result.json").read_text())
          assert d["status"] == "INPUT_BUNDLE_FROZEN"
          assert d["performance_evaluation"] is False
          assert d["selection_used"] is False
          assert len(d["symbols"]) == 8
          assert all(int(x["row_count"]) == 3500 for x in d["datasets"])
          print("Q091 INPUT BUNDLE VERIFIED")
          PY

      - name: Persist immutable bundle
        if: steps.prior.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/evidence/q091_input_freeze_result.json research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE
          git commit -m "EVIDENCE: persist Q091 adjusted-close input bundle"
          git push origin master

      - name: Upload input-freeze evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q091-input-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q091_input_freeze_result.json
            research/runs/q091_input_bundle/T-2026-09-29-091-INPUT-FREEZE/**
          if-no-files-found: warn
          retention-days: 30
