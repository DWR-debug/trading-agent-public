name: Q023 Treasury Release Timestamp PIT Feasibility

on:
  pull_request:
    branches:
      - master
    paths:
      - "automation/q023_treasury_release_timestamp_pit_feasibility.py"
      - "tests/test_q023_treasury_release_timestamp_pit_feasibility.py"
      - "research/preregistrations/q023_treasury_release_timestamp_pit_feasibility_2026_09_27.json"
      - ".github/workflows/q023-treasury-release-timestamp-pit-feasibility.yml"
  push:
    branches:
      - research/q023-treasury-pit-feasibility-2026-09-27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q023-pit-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest exchange_calendars pypdf

      - name: Regression tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q023_treasury_release_timestamp_pit_feasibility.py

      - name: Q023 source/PIT feasibility
        run: |
          set -euo pipefail
          python -m automation.q023_treasury_release_timestamp_pit_feasibility             --output research/runs/source_feasibility/q023_treasury_release_timestamp_pit_feasibility.json

      - name: Governance and safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/source_feasibility/q023_treasury_release_timestamp_pit_feasibility.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["governance"]["source_feasibility_only"] is True
          assert data["governance"]["performance_evaluation"] is False
          assert data["governance"]["pnl_evaluation"] is False
          assert data["governance"]["holdout_used"] is False
          assert data["governance"]["candidate_ranking"] is False
          assert data["governance"]["parameter_search"] is False
          assert data["governance"]["asset_search"] is False
          assert data["governance"]["threshold_search"] is False
          assert data["governance"]["horizon_search"] is False
          assert data["governance"]["variant_search"] is False
          assert data["governance"]["promotion_decision"] is False
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["safety"]["orders_enabled"] is False
          assert data["safety"]["automatic_promotion"] is False
          print(json.dumps({
              "status": data["status"],
              "events": data["event_population"]["total_events"],
              "timestamp_validated_events": data["event_population"]["timestamp_validated_events"],
              "coverage_ratio": data["event_population"]["timestamp_coverage_ratio"],
              "fingerprint": data["fingerprint"],
          }, sort_keys=True))
          PY

      - name: Evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: q023-treasury-pit-feasibility-${{ github.run_id }}
          path: research/runs/source_feasibility/q023_treasury_release_timestamp_pit_feasibility.json
          if-no-files-found: error
          retention-days: 30
