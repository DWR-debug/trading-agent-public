name: Q119 Independent Reproduction

on:
  schedule:
    - cron: "45 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q119_treasury_demand_shape.py"
      - "automation/q119_treasury_source_feasibility.py"
      - "tests/test_q119_treasury_demand_shape.py"
      - "tests/test_q119_treasury_source_feasibility.py"
      - ".github/workflows/q119-independent-reproduction.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q119-independent-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Structural tests
        run: python -m pytest -q tests/test_q119_treasury_demand_shape.py tests/test_q119_treasury_source_feasibility.py

      - name: Independent live source reproduction
        run: python -m automation.q119_treasury_source_feasibility --output research/runs/q119_treasury/q119_independent_reproduction.json

      - name: Validate reproduction boundary
        run: python -c "import json; from pathlib import Path; p=json.loads(Path('research/runs/q119_treasury/q119_independent_reproduction.json').read_text()); assert p['status']=='Q119_SOURCE_PIT_FEASIBILITY_COMPLETED'; assert p['validation']['future_mutation_invariance'] is True; assert p['governance']['performance'] is False; assert p['governance']['performance_authorized'] is False; assert p['safety']['paper_only'] is True; print('Q119_INDEPENDENT_REPRODUCTION=PASS'); print('Q119_ROWS=', p['validation']['raw_row_count']); print('Q119_RECEIPT=', p['receipt_fingerprint'])"

      - name: Upload independent receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q119-independent-reproduction-${{ github.run_id }}
          path: research/runs/q119_treasury/q119_independent_reproduction.json
          if-no-files-found: error
          retention-days: 30
