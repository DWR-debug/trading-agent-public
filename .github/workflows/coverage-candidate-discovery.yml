name: Coverage Candidate Discovery (hosted Python)

on:
  push:
    branches: [master]
    paths:
      - "automation/coverage_candidate_discovery.py"
      - "research/asset_universes.py"
      - "data/yahoo_loader.py"
      - "data/**"
      - "config/**"
      - "automation/q077_fixed_candidate_discovery.py"
      - "research/preregistrations/q077_discovery_2026_09_28.json"
      - "research/run_requests/q077_discovery.trigger"
      - ".github/workflows/coverage-candidate-discovery.yml"
      - "automation/coverage_candidate_discovery_repair.py"
      - "tests/test_coverage_candidate_discovery_repair.py"
      - "docs/research_design/T040R1_COVERAGE_REPAIR_2026-10-01.md"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-coverage-candidate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Safety and coverage discovery
        id: historical_discovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY
          python -m automation.coverage_candidate_discovery             --output research/runs/coverage_discovery/t040_candidates.json

      - name: Validate discovery contract
        if: steps.historical_discovery.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/coverage_discovery/t040_candidates.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("DISCOVERY_CONTRACT_OK")
          print("COVERAGE_VALID:", d["coverage_valid_candidates"])
          print("NEXT_DETERMINISTIC_CANDIDATE:", d["next_deterministic_candidate"])
          print("FINGERPRINT:", d["fingerprint"])
          PY

      - name: Publish discovery artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-candidate-discovery-${{ github.run_id }}
          path: research/runs/coverage_discovery/t040_candidates.json
          if-no-files-found: warn
          retention-days: 30

  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Hosted Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Validate repair implementation
        run: python -m pytest -q tests/test_coverage_candidate_discovery_repair.py

      - name: Run disjoint coverage repair discovery
        run: |
          set -euo pipefail
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"
          python -m automation.coverage_candidate_discovery_repair --output research/runs/coverage_discovery/t040r1_candidates.json

      - name: Validate repair contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/coverage_discovery/t040r1_candidates.json").read_text(encoding="utf-8"))
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["parameter_search"] is False
          assert d["asset_search"] is False
          assert d["threshold_search"] is False
          assert d["horizon_search"] is False
          assert d["governance"]["performance_authorized"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("T040R1 DISCOVERY CONTRACT OK")
          print("T040R1 VALID:", d["coverage_valid_candidates"])
          print("T040R1 NEXT:", d["next_deterministic_candidate"])
          print("T040R1 FINGERPRINT:", d["fingerprint"])
          PY

      - name: Upload repair artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-candidate-discovery-repair
          path: research/runs/coverage_discovery/t040r1_candidates.json
          if-no-files-found: error
          retention-days: 30


  q077-discover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Q077 source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Q077 coverage-only discovery
        run: python automation/q077_fixed_candidate_discovery.py --output research/runs/q077_discovery/discovery.json --workers 12

      - name: Validate Q077 discovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q077_discovery/discovery.json").read_text())
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["asset_selection_by_performance"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          assert len(d["selected_coverage_batch"]) >= 8
          assert d["selected_common_count"] >= 3500
          print("Q077 DISCOVERY CONTRACT OK")
          print("Q077 SELECTED:",d["selected_coverage_batch"])
          print("Q077 COMMON:",d["selected_common_count"])
          print("Q077 FINGERPRINT:",d["fingerprint"])
          PY

      - name: Upload Q077 discovery artifact
        uses: actions/upload-artifact@v6
        with:
          name: q077-discovery
          path: research/runs/q077_discovery/discovery.json
          if-no-files-found: error
          retention-days: 30
