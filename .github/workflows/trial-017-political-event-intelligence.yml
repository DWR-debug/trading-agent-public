name: Trial 017 Political Event Intelligence

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum UTC"
        required: true
        default: "2025-01-01"
      end:
        description: "Enddatum UTC"
        required: true
        default: "2025-03-31"

permissions:
  contents: read

jobs:
  trial-017:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Only-Safety
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Trial 017 ausführen
        run: |
          python -m automation.trial_017_political_event_intelligence             --start "${{ inputs.start }}"             --end "${{ inputs.end }}"
      - name: Ergebnisvertrag prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("research/trial_017_political_event_intelligence/report.json").read_text(encoding="utf-8"))
          assert report["research_only"] is True
          assert report["selection_used"] is False
          assert report["parameter_search_used"] is False
          assert report["point_in_time_contract"]["same_day_performance_used_for_selection"] is False
          assert report["safety"] == {"paper_only": True, "live_trading_enabled": False, "orders_enabled": False}
          print("TRIAL_017_REPORT_OK")
          PY
      - name: Trial-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-017-political-event-intelligence-${{ github.run_id }}
          path: research/trial_017_political_event_intelligence/
          if-no-files-found: warn
          retention-days: 30
