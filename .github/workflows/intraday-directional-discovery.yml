name: Intraday Directional Discovery

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/microtrading_directional_discovery.trigger"
      - "automation/microtrading_directional_leverage_15m_2026_09_23.py"
      - ".github/workflows/intraday-directional-discovery.yml"
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-intraday-directional-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert float(settings.MAX_LEVERAGE) >= 3.0
          print("INTRADAY DIRECTIONAL DISCOVERY SAFETY OK")
          PY

      - name: Execute fixed directional simulation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/intraday_directional_discovery/data
          python -m automation.microtrading_directional_leverage_15m_2026_09_23             --data-dir research/runs/intraday_directional_discovery/data             --output research/runs/intraday_directional_discovery/result.json

      - name: Assert discovery-only contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/intraday_directional_discovery/result.json").read_text(encoding="utf-8"))
          assert d["status"] == "COMPLETED"
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["max_research_leverage"] == 3.0
          assert d["modeling_limits"]["production_candidate"] is False
          assert d["modeling_limits"]["production_integration"] is False
          assert d["hypotheses"]["selection_between_hypotheses"] is False
          assert d["hypotheses"]["parameter_search"] is False
          print("DISCOVERY_ONLY_CONTRACT_OK")
          print("RESULT_FINGERPRINT:", d["result_fingerprint"])
          PY

      - name: Upload exploratory result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intraday-directional-discovery-${{ github.run_id }}
          path: research/runs/intraday_directional_discovery/
          if-no-files-found: warn
          retention-days: 30
