name: Q074 Extended SEC Cboe Source Feasibility

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q074_extended_source_feasibility_2026_09_28.json"
      - "automation/q074_extended_source_feasibility.py"
      - ".github/workflows/q074-extended-source-feasibility.yml"
      - "research/run_requests/q074_source_feasibility.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Source feasibility
        run: python automation/q074_extended_source_feasibility.py

      - name: Publish source-feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q074-extended-source-feasibility
          path: research/runs/q074_extended_source_feasibility/source_feasibility.json
          if-no-files-found: error
          retention-days: 30
