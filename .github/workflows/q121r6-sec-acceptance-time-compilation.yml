# Q121-R6 execution bootstrap refreshed after canonical accession-parser repair.
name: Q121-R6 SEC Acceptance-Time Compilation

on:
  push:
    branches: [master]
    paths:
      - automation/q121r6_sec_acceptance_time_compiler.py
      - automation/q121r3_sec_form_index_reverse_issuer.py
      - automation/q121r6_sec_acceptance_time_aggregate.py
      - tests/test_q121r6_sec_acceptance_time_compiler.py
      - research/preregistrations/q121r6_sec_acceptance_time_compilation_2026_10_03.json
      - .github/workflows/q121r6-sec-acceptance-time-compilation.yml
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Push-triggered and one-shot issue-comment runs are isolated from each other.
# Duplicate owner issue-comment requests collapse to the newest request.
concurrency:
  group: q121r6-sec-acceptance-time-compilation
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.issue.number == 882 &&
            github.event.comment.body == '/trading-agent q121-r6-once'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Cancel stale Q121-R6 issue-comment runs on new master push
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/q121r6-sec-acceptance-time-compilation.yml/runs?per_page=100")"
          echo "$runs_json" | jq -r --arg current_sha "$GITHUB_SHA" '
            .[] | .workflow_runs[] |
            select((.status == "queued" or .status == "in_progress")
              and (.event == "push" or .event == "issue_comment")
              and .head_sha != $current_sha) |
            .id
          ' | while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "Cancelling superseded Q121-R6 issue-comment run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
          done
      - name: Setup pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir             pytest exchange-calendars tzdata==2026.5
          python -c 'from zoneinfo import ZoneInfo; print(ZoneInfo("America/New_York"))'

      - name: Prepare frozen Q121-R5 population
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q121r6-prepared
          python -m automation.q121r6_sec_acceptance_time_compiler             --prepare-population             --output q121r6-prepared/population.json
          test -s q121r6-prepared/population.json

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q121r6_sec_acceptance_time_compiler.py

      - name: Upload frozen population
        uses: actions/upload-artifact@v6
        with:
          name: q121r6-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: q121r6-prepared/population.json
          if-no-files-found: error
          retention-days: 30

  compile:
    needs: prepare
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.issue.number == 882 &&
            github.event.comment.body == '/trading-agent q121-r6-once'
          )
        )
      }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir             exchange-calendars tzdata==2026.5
          python -c 'from zoneinfo import ZoneInfo; print(ZoneInfo("America/New_York"))'

      - name: Download frozen population
        uses: actions/download-artifact@v6
        with:
          name: q121r6-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: q121r6-input

      - name: Run header shard
        shell: bash
        run: |
          set -euo pipefail
          test -s q121r6-input/population.json
          mkdir -p q121r6-shard
          python -m automation.q121r6_sec_acceptance_time_compiler             --population q121r6-input/population.json             --output q121r6-shard/result.json             --shard-index ${{ matrix.shard_index }}             --shard-count 4             --workers 8             --request-gap-seconds 0.25
          test -s q121r6-shard/result.json

      - name: Upload shard
        uses: actions/upload-artifact@v6
        with:
          name: q121r6-shard-${{ matrix.shard_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: q121r6-shard/result.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: compile
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.issue.number == 882 &&
            github.event.comment.body == '/trading-agent q121-r6-once'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir             exchange-calendars tzdata==2026.5

      - name: Download all shards
        uses: actions/download-artifact@v6
        with:
          pattern: q121r6-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: q121r6-shards
          merge-multiple: true

      - name: Aggregate and enforce boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s q121r6-shards/shard-0.json
          test -s q121r6-shards/shard-1.json
          test -s q121r6-shards/shard-2.json
          test -s q121r6-shards/shard-3.json
          mkdir -p q121r6-final
          python -m automation.q121r6_sec_acceptance_time_aggregate             --shards q121r6-shards             --output q121r6-final/result.json
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("q121r6-final/result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q121R6_SEC_ACCEPTANCE_TIME_COMPILATION_COMPLETED"
          assert p["population"]["row_count"] == 61818
          assert p["population"]["all_header_rows_fetched"] == 61818
          assert p["population"]["all_header_rows_validated"] is True
          assert p["target_subject_population"]["acceptance_timestamp_compiled"] is True
          assert p["interpretation"]["full_subject_issuer_population_compiled"] is True
          assert p["interpretation"]["acceptance_timestamps_compiled"] is True
          assert p["interpretation"]["revision_lineage_established"] is False
          assert p["interpretation"]["same_day_pit_safe"] is False
          assert all(v is False for v in p["governance"].values())
          assert p["safety"]["paper_only"] is True
          assert p["safety"]["live_trading_enabled"] is False
          assert p["safety"]["orders_enabled"] is False
          print("Q121R6_BOUNDARY=PASS")
          print("Q121R6_RECEIPT=" + p["receipt_fingerprint"])
          PY

      - name: Build compact immutable receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = json.loads(Path("q121r6-final/result.json").read_text(encoding="utf-8"))
          out = Path("research/evidence") / f"q121r6_compact_execution_{os.environ['GITHUB_RUN_ID']}.json"
          receipt = {
              "schema_version": "1.0",
              "receipt_type": "q121r6_compact_execution",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_sha": os.environ["GITHUB_SHA"],
              "status": p["status"],
              "population": p["population"],
              "target_subject_population": p["target_subject_population"],
              "interpretation": p["interpretation"],
              "governance": p["governance"],
              "safety": p["safety"],
              "receipt_fingerprint": p["receipt_fingerprint"],
          }
          out.write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("research/evidence/q121r6_compact_execution_latest.json").write_text(
              out.read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          print(out)
          PY

      - name: Persist compact immutable R6 receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist Q121-R6 compact execution receipt"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py               --repository "${GITHUB_REPOSITORY}"               --branch master               --base-sha "${base_sha}"               --file "research/evidence/q121r6_compact_execution_${GITHUB_RUN_ID}.json=research/evidence/q121r6_compact_execution_${GITHUB_RUN_ID}.json"               --file "research/evidence/q121r6_compact_execution_latest.json=research/evidence/q121r6_compact_execution_latest.json"; then
              exit 0
            fi
            sleep "${attempt}"
          done
          exit 1

      - name: Upload final receipt
        uses: actions/upload-artifact@v6
        with:
          name: q121r6-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: q121r6-final/result.json
          if-no-files-found: error
          retention-days: 30
