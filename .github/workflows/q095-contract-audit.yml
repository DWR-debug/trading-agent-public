name: Q095 Contract Audit

on:
  push:
    branches: [master]
    paths:
      - "automation/q095_contract_audit.py"
      - "automation/q095_performance.py"
      - "portfolio/q094_monthly_rebalance.py"
      - "execution/cost_contract.py"
      - "config/settings.py"
      - "automation/q095_coverage_pit.py"
      - "research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json"
      - ".github/workflows/q095-contract-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q095-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Finalize Q095 source contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          checks={
            "performance_runner_sha256":"automation/q095_performance.py",
            "monthly_overlay_sha256":"portfolio/q094_monthly_rebalance.py",
            "candidate_bank_sha256":"automation/q069_candidate_bank.py",
            "cost_contract_sha256":"execution/cost_contract.py",
            "settings_sha256":"config/settings.py",
            "input_freeze_sha256":"automation/q095_coverage_pit.py",
          }
          changed=False
          for key,path in checks.items():
              value=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if d["source_contract"].get(key)!=value:
                  d["source_contract"][key]=value
                  changed=True
          if changed:
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2,allow_nan=False)+chr(10),encoding="utf-8")
              print("Q095_SOURCE_CONTRACT_CHANGED")
          else:
              print("Q095_SOURCE_CONTRACT_ALREADY_FINAL")
          PY
          if git diff --quiet -- research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json; then
            exit 0
          fi
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch master \
            --base-sha "$base_sha" \
            --file research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json=research/preregistrations/q095_monthly_rebalance_independent_replication_2026_09_29.json

      - name: Read-only Q095 contract audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/q095_contract_audit.py automation/q095_performance.py automation/q095_reconcile.py
          python -m pytest -q tests/test_q094_monthly_rebalance.py
          python -m automation.q095_contract_audit | tee q095-contract-audit.json
          python - <<'PY'
          import json
          d=json.load(open("q095-contract-audit.json",encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert d["trial_id"]=="T-2026-09-29-095"
          assert d["performance_authorization_changed"] is False
          assert d["performance_executed"] is False
          print("Q095 CONTRACT AUDIT PASS")
          print("Q095_AUDIT_FP="+d["audit_fingerprint"])
          PY

      - name: Verify no performance authorization has been created
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/authorizations/q095_performance_2026_09_29.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          e=next(x for x in r["active_trials"] if x.get("code")=="095")
          assert e["trial_id"]=="T-2026-09-29-095"
          assert e["performance_authorization_allowed"] is False
          print("Q095 AUTHORIZATION REMAINS BLOCKED")
          PY

      - name: Upload Q095 audit receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q095-contract-audit-${{ github.run_id }}
          path: q095-contract-audit.json
          if-no-files-found: warn
          retention-days: 30
