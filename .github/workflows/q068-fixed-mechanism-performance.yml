name: Q068 Fixed Mechanism Performance

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-q068-performance
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 240
    steps:
      - name: Checkout authorized master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap pinned Python 3.13.15
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q068.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pandas pytest || exit /b 1
          endlocal

      - name: Authorization and safety gate
        shell: cmd
        run: |
          @echo off
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          if /I not "%GITHUB_REF%"=="refs/heads/master" exit /b 1
          if not defined GITHUB_SHA exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; from config import settings; p=json.loads(Path('research/preregistrations/q068_performance_2026_09_28.json').read_text(encoding='utf-8')); a=json.loads(Path('research/authorizations/q068_performance_2026_09_28.json').read_text(encoding='utf-8')); assert a['source_contract']['automation/q067_alpha_mechanisms.py']=='344343f9910f1ea5eaa9a2d2c295a6f87a520bdc'; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; assert p['status']=='PREREGISTERED_PERFORMANCE'; assert a['authorized'] is True; assert a['performance_execution_authorized'] is True; assert a['execution_scope']=='Q068_FIXED_RULE_PERFORMANCE_ONLY'; assert p['selection_used'] is False; assert p['holdout_used_for_selection'] is False; print('Q068 AUTH/SAFETY OK')"

      - name: Verify frozen Q068 source contract
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          "%PY_EXE%" -c "import json; from pathlib import Path; expected={'automation/q067_alpha_mechanisms.py':'344343f9910f1ea5eaa9a2d2c295a6f87a520bdc','automation/q068_performance.py':'d85e17885ff56353ca677a3aa47d8a5e7b6ec056','data/canonical_snapshot.py':'18c7c051b1b4d3f7f67bc395baf5ef3787e1b028','execution/cost_contract.py':'21b54b45dbe708f3102851fd368ad1b64226b0ad','config/settings.py':'9c7b5199ed09d11ca17eb72493aebf7a7666fd28'}; a=json.loads(Path('research/authorizations/q068_performance_2026_09_28.json').read_text(encoding='utf-8')); assert a['source_contract']==expected; print('Q068 AUTH SOURCE CONTRACT OK')"

      - name: Performance prerequisites
        shell: cmd
        run: |
          @echo off
          if not exist research\evidence\q068_coverage_result.json exit /b 1
          if not exist research\evidence\q068_pit_result.json exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; c=json.loads(Path('research/evidence/q068_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q068_pit_result.json').read_text(encoding='utf-8')); assert c['trial_id']=='T-2026-09-28-068-COVERAGE'; assert c['status']=='COVERAGE_PASSED'; assert c['performance_trial_authorized'] is False; assert c['selection_used'] is False; assert p['trial_id']=='T-2026-09-28-068-PIT'; assert p['status']=='PIT_PASSED'; assert p['performance_trial_authorized'] is False; assert p['selection_used'] is False; print('Q068 PREREQUISITES OK')"

      - name: Verify checked-out Q068 source files
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import subprocess; expected={'automation/q067_alpha_mechanisms.py':'344343f9910f1ea5eaa9a2d2c295a6f87a520bdc','automation/q068_performance.py':'d85e17885ff56353ca677a3aa47d8a5e7b6ec056','data/canonical_snapshot.py':'18c7c051b1b4d3f7f67bc395baf5ef3787e1b028','execution/cost_contract.py':'21b54b45dbe708f3102851fd368ad1b64226b0ad','config/settings.py':'9c7b5199ed09d11ca17eb72493aebf7a7666fd28'}; actual={p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in expected}; assert actual==expected; print('Q068 CHECKED-OUT SOURCE CONTRACT OK')"

      - name: Q068 fixed-rule performance
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -m automation.q068_performance --preregistration research/preregistrations/q068_performance_2026_09_28.json --repo-root . --output research/evidence/q068_performance_result.json || exit /b 1

      - name: Validate fixed result
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; d=json.loads(Path('research/evidence/q068_performance_result.json').read_text(encoding='utf-8')); assert d['status']=='COMPLETED'; assert d['performance_evaluation'] is True; assert d['oos_evaluation'] is True; assert d['holdout_evaluation'] is True; assert d['selection_used'] is False; assert d['holdout_used_for_selection'] is False; assert d['governance']['promotion_decision'] is False; assert d['governance']['automatic_promotion'] is False; assert d['symbols']==['ETR','PPL','WEC','FE','D','EXR','PSA','O']; assert set(d['arms'])=={'CONTROL_6SLEEVE_ENSEMBLE','E1_ALPHA_COMMON_MODE_THROTTLE','E2_TURNOVER_HYSTERESIS'}; assert all(0 <= arm['gates_passed'] <= 13 for arm in d['arms'].values()); print('Q068 RESULT GOVERNANCE OK'); [print(k, str(v['gates_passed'])+'/'+str(v['gates_total'])) for k,v in d['arms'].items()]; print('Q068_REPORT_FINGERPRINT:',d['report_fingerprint'])"

      - name: Persist performance evidence
        if: success()
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          set "PUBLISH_MESSAGE=EVIDENCE: record Q068 fixed mechanism performance"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])" > "%RUNNER_TEMP%\\q068_base_sha.txt" || exit /b 1
          set /p BASE_SHA=<"%RUNNER_TEMP%\\q068_base_sha.txt"
          if not defined BASE_SHA exit /b 1
          "%PY_EXE%" "%GITHUB_WORKSPACE%\automation\github_contents_publish.py" --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/evidence/q068_performance_result.json=research\evidence\q068_performance_result.json
          if errorlevel 1 exit /b 1
          endlocal

      - name: Publish performance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q068-fixed-mechanism-performance
          path: research/evidence/q068_performance_result.json
          if-no-files-found: error
          retention-days: 30


      - name: Q068_DISPATCH_RECONCILE
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-dispatch"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-nuget-dispatch.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          set "DISPATCH_URL=https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/q068-evidence-reconcile.yml/dispatches"
          "%PY_EXE%" -c "import json,os,urllib.request; u=os.environ['DISPATCH_URL']; req=urllib.request.Request(u,data=json.dumps({'ref':'master'}).encode('utf-8'),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}); urllib.request.urlopen(req,timeout=30).read(); print('Q068_DISPATCH_RECONCILE OK')" || exit /b 1
