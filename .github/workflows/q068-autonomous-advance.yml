name: Q068 Autonomous Advance to Performance

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q068_coverage_result.json"
      - "research/evidence/q068_pit_result.json"
      - "research/run_requests/q068_auto_advance.trigger"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-q068-auto-advance
  cancel-in-progress: false

jobs:
  advance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 15
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify preflight and safety
        shell: cmd
        run: |
          @echo off
          if not exist research\evidence\q068_coverage_result.json exit /b 1
          if not exist research\evidence\q068_pit_result.json exit /b 1
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-advance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q068-advance.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -c "import json; from pathlib import Path; from config import settings; c=json.loads(Path('research/evidence/q068_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q068_pit_result.json').read_text(encoding='utf-8')); assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; assert c['trial_id']=='T-2026-09-28-068-COVERAGE'; assert c['status']=='COVERAGE_PASSED'; assert c['performance_trial_authorized'] is False; assert c['selection_used'] is False; assert p['trial_id']=='T-2026-09-28-068-PIT'; assert p['status']=='PIT_PASSED'; assert p['performance_trial_authorized'] is False; assert p['selection_used'] is False; assert c['safety']=={'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}; assert p['safety']==c['safety']; print('Q068 PREFLIGHT PASS')"

      - name: Verify frozen Q068 source contract
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-advance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          "%PY_EXE%" -c "import hashlib; from pathlib import Path; expected={'automation/q067_alpha_mechanisms.py':'344343f9910f1ea5eaa9a2d2c295a6f87a520bdc','automation/q068_performance.py':'d85e17885ff56353ca677a3aa47d8a5e7b6ec056','data/canonical_snapshot.py':'18c7c051b1b4d3f7f67bc395baf5ef3787e1b028','execution/cost_contract.py':'21b54b45dbe708f3102851fd368ad1b64226b0ad','config/settings.py':'9c7b5199ed09d11ca17eb72493aebf7a7666fd28'}; blob=lambda p: hashlib.sha1(b'blob '+str(len(Path(p).read_bytes())).encode()+b'\\0'+Path(p).read_bytes()).hexdigest(); actual={p:blob(p) for p in expected}; assert actual==expected; print('Q068 SOURCE CONTRACT OK'); print(actual)"

      - name: Create one-shot Q068 authorization
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068-advance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          if exist research\authorizations\q068_performance_2026_09_28.json exit /b 0
          "%PY_EXE%" -c "import json; from pathlib import Path; c=json.loads(Path('research/evidence/q068_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q068_pit_result.json').read_text(encoding='utf-8')); auth={'schema_version':'1.0','authorization_id':'Q068-PERFORMANCE-AUTO-ONE-SHOT-2026-09-28','authorized':True,'source_contract':{'automation/q067_alpha_mechanisms.py':'344343f9910f1ea5eaa9a2d2c295a6f87a520bdc','automation/q068_performance.py':'d85e17885ff56353ca677a3aa47d8a5e7b6ec056','data/canonical_snapshot.py':'18c7c051b1b4d3f7f67bc395baf5ef3787e1b028','execution/cost_contract.py':'21b54b45dbe708f3102851fd368ad1b64226b0ad','config/settings.py':'9c7b5199ed09d11ca17eb72493aebf7a7666fd28'},'authorization_basis':'Both immutable Q068 coverage and PIT receipts passed their fail-closed prerequisites.','execution_scope':'Q068_FIXED_RULE_PERFORMANCE_ONLY','performance_execution_authorized':True,'required_prerequisites':['T-2026-09-28-068-COVERAGE status=COVERAGE_PASSED','T-2026-09-28-068-PIT status=PIT_PASSED'],'source_receipts':{'coverage_result_fingerprint':c['result_fingerprint'],'pit_result_fingerprint':p['result_fingerprint']},'prohibited':['parameter selection','threshold selection','asset selection','family ranking','holdout selection','promotion','live execution'],'safety':{'PAPER_ONLY':True,'LIVE_TRADING_ENABLED':False,'ORDERS_ENABLED':False,'AUTOMATIC_PROMOTION':False}}; Path('research/authorizations').mkdir(parents=True,exist_ok=True); Path('research/authorizations/q068_performance_2026_09_28.json').write_text(json.dumps(auth,indent=2)+'\n',encoding='utf-8')"
          set "PUBLISH_MESSAGE=OPS: authorize Q068 performance after preflight pass"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])" > "%RUNNER_TEMP%\\q068_base_sha.txt" || exit /b 1
          set /p BASE_SHA=<"%RUNNER_TEMP%\\q068_base_sha.txt"
          if not defined BASE_SHA exit /b 1
          "%PY_EXE%" "%GITHUB_WORKSPACE%\automation\github_contents_publish.py" --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/authorizations/q068_performance_2026_09_28.json=research\authorizations\q068_performance_2026_09_28.json


      - name: Q068_DISPATCH_PERFORMANCE
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-dispatch"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-nuget-dispatch.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          set "DISPATCH_URL=https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/q068-fixed-mechanism-performance.yml/dispatches"
          "%PY_EXE%" -c "import json,os,urllib.request; u=os.environ['DISPATCH_URL']; req=urllib.request.Request(u,data=json.dumps({'ref':'master'}).encode('utf-8'),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}); urllib.request.urlopen(req,timeout=30).read(); print('Q068_DISPATCH_PERFORMANCE OK')" || exit /b 1
