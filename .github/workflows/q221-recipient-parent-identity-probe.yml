name: Q221 Recipient Parent Identity Feasibility Probe

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q221_recipient_parent_identity_probe.trigger"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trading-agent-q221-recipient-parent-identity-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate request and frozen sample
        id: guard
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.q221_recipient_parent_identity_probe import read_request, validate_source
          read_request(Path("research/run_requests/q221_recipient_parent_identity_probe.trigger"))
          validate_source(Path("research/evidence/q221_historical_public_boundary_latest.json"))
          print("Q221_RECIPIENT_PROBE_FROZEN_INPUTS_VALID=true")
          PY
      - name: Probe current recipient profiles with fixed bounded requests
        id: probe
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m automation.q221_recipient_parent_identity_probe \
            --request research/run_requests/q221_recipient_parent_identity_probe.trigger \
            --source research/evidence/q221_historical_public_boundary_latest.json \
            --output "$RUNNER_TEMP/q221-recipient-parent-identity-receipt.json"
      - name: Upload immutable diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q221-recipient-parent-identity-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/q221-recipient-parent-identity-receipt.json"
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Fail closed on incomplete profile observations
        if: steps.guard.outcome != 'success' || steps.probe.outcome != 'success'
        run: |
          echo "Q221 recipient profile observations incomplete; historical mapping and public-clock gates remain closed."
          exit 1
