name: Q079 Fresh E1 E2 Coverage Discovery

on:
  push:
    branches: [master]
    paths:
      - "automation/q079_fixed_candidate_discovery.py"
      - "research/preregistrations/q079_discovery_2026_09_28.json"
      - "research/run_requests/q079_discovery.trigger"
      - ".github/workflows/q079-fresh-e1-e2-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Discovery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q079_discovery_2026_09_28.json").read_text())
          assert p["status"]=="PREREGISTERED_COVERAGE_ONLY"
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q079 DESIGN/SAFETY OK")
          PY
      - name: Coverage-only discovery
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python automation/q079_fixed_candidate_discovery.py --output research/runs/q079_discovery/discovery.json --workers 12
      - name: Validate discovery
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q079_discovery/discovery.json").read_text())
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["asset_selection_by_performance"] is False
          assert len(d["selected_coverage_batch"]) >= 8
          assert d["selected_common_count"] >= 3500
          assert d["safety"]["paper_only"] is True
          print("Q079 DISCOVERY CONTRACT OK")
          print("Q079 SELECTED:",d["selected_coverage_batch"])
          print("Q079 COMMON:",d["selected_common_count"])
          print("Q079 FINGERPRINT:",d["fingerprint"])
          PY
      - name: Publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: q079-discovery
          path: research/runs/q079_discovery/discovery.json
          if-no-files-found: error
          retention-days: 30
