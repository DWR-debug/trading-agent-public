name: Paper 30-Day Experiment Harness

on:
  pull_request:
    branches: [master]
    paths:
      - "automation/paper_30_day_experiment.py"
      - "tests/test_paper_30_day_experiment.py"
      - "docs/PAPER_30_DAY_EXPERIMENT.md"
      - "automation/checkpoint.py"
      - "research/evidence_contract.py"
      - ".github/workflows/paper-30-day-experiment-harness.yml"
  push:
    branches:
      - dev/paper-30-day-experiment-harness-2026-09-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Synthetischen Evidence-Testfall erstellen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("ci/paper_30_day")
          root.mkdir(parents=True, exist_ok=True)
          evidence = {
              "trial_id": "CI-30D-001",
              "strategy_id": "ci-fixed-pass-strategy",
              "status": "VALIDATED_PASS",
              "artifact_id": 1,
              "artifact_digest_sha256": "a" * 64,
              "report_fingerprint_sha256": "b" * 64,
              "manifest_fingerprint_sha256": "c" * 64,
              "code_commit_sha": "1234567",
              "research_count": 1000,
              "holdout_count": 300,
              "holdout_used_for_selection": False,
              "gates": [{"name": "synthetic_gate", "passed": True}],
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          returns = {
              "strategy_id": "ci-fixed-pass-strategy",
              "daily_returns": [0.001] * 30,
              "net_of_costs": True,
              "source": "synthetic-ci",
          }
          (root / "evidence.json").write_text(json.dumps(evidence), encoding="utf-8")
          (root / "returns.json").write_text(json.dumps(returns), encoding="utf-8")
          PY
      - name: 30-Tage-Paper-Harness
        run: |
          set -euo pipefail
          python -m automation.paper_30_day_experiment \
            --evidence ci/paper_30_day/evidence.json \
            --returns ci/paper_30_day/returns.json \
            --output ci/paper_30_day/report.json \
            --checkpoint ci/paper_30_day/checkpoint.json \
            --initial-capital-eur 10
      - name: Ergebnisvertrag prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ci/paper_30_day/report.json").read_text(encoding="utf-8"))
          assert report["status"] == "COMPLETED"
          assert report["processed_days"] == 30
          assert report["initial_capital_eur"] == 10.0
          assert report["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          assert report["evidence_eligibility"]["status"] == "VALIDATED_PASS"
          assert report["evidence_eligibility"]["holdout_used_for_selection"] is False
          assert report["evidence_eligibility"]["orders_enabled"] is False
          assert report["report_fingerprint"]
          print("PAPER_30_DAY_HARNESS_OK")
          print("FINAL_EQUITY:", report["final_equity_eur"])
          print("REPORT_FINGERPRINT:", report["report_fingerprint"])
          PY
