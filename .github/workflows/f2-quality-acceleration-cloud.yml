name: F2 Quality Acceleration Structural Cross-Check

on:
  push:
    branches: [master]
    paths:
      - "automation/f2_quality_acceleration.py"
      - "tests/test_f2_quality_acceleration.py"
      - "docs/research_design/F2_QUALITY_ACCELERATION_FEASIBILITY_2026-09-28.md"
      - ".github/workflows/f2-quality-acceleration-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-f2-quality-acceleration-cloud
  cancel-in-progress: true

jobs:
  cross-check:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run F2 structural tests
        run: python -m pytest -q tests/test_f2_quality_acceleration.py

      - name: Formula replay probe
        run: python -c "levels=[0.10,0.14,0.11,0.17]; growth=[levels[i]-levels[i-1] for i in range(1,len(levels))]; acceleration=[growth[i]-growth[i-1] for i in range(1,len(growth))]; assert growth==[0.04,-0.03,0.06] and acceleration==[-0.07,0.09]; print('F2_FORMULA_REPLAY_OK')"
