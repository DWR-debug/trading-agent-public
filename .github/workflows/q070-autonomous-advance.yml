name: Q070 Autonomous Advance

on:
  push:
    branches: [master]
    paths:
      - "research/evidence/q070_coverage_result.json"
      - "research/evidence/q070_pit_result.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-q070-auto-advance
  cancel-in-progress: false

jobs:
  advance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q070-advance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q070-advance.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1

      - name: Verify preflight and safety
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q070-advance\tools\python.exe"
          "%PY_EXE%" -c "import json; from pathlib import Path; from config import settings; c=json.loads(Path('research/evidence/q070_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q070_pit_result.json').read_text(encoding='utf-8')); assert c['trial_id']=='T-2026-09-28-070-COVERAGE' and c['status']=='COVERAGE_PASSED'; assert p['trial_id']=='T-2026-09-28-070-PIT' and p['status']=='PIT_PASSED'; assert c['performance_trial_authorized'] is False and p['performance_trial_authorized'] is False; assert c['selection_used'] is False and p['selection_used'] is False; assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False; print('Q070 PREFLIGHT PASS')"

      - name: Create one-shot authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q070-advance"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          if exist research\authorizations\q070_performance_2026_09_28.json exit /b 0
          "%PY_EXE%" -c "import json; from pathlib import Path; c=json.loads(Path('research/evidence/q070_coverage_result.json').read_text(encoding='utf-8')); p=json.loads(Path('research/evidence/q070_pit_result.json').read_text(encoding='utf-8')); auth={'schema_version':'1.0','authorization_id':'Q070-PERFORMANCE-AUTO-ONE-SHOT-2026-09-28','authorized':True,'performance_execution_authorized':True,'execution_scope':'Q070_FIXED_CANDIDATE_PERFORMANCE_ONLY','required_prerequisites':['T-2026-09-28-070-COVERAGE status=COVERAGE_PASSED','T-2026-09-28-070-PIT status=PIT_PASSED'],'source_receipts':{'coverage_result_fingerprint':c['result_fingerprint'],'pit_result_fingerprint':p['result_fingerprint']},'prohibited':['parameter selection','threshold selection','asset selection after coverage','family ranking','holdout selection','promotion','live execution'],'safety':{'PAPER_ONLY':True,'LIVE_TRADING_ENABLED':False,'ORDERS_ENABLED':False,'AUTOMATIC_PROMOTION':False}}; Path('research/authorizations').mkdir(exist_ok=True); Path('research/authorizations/q070_performance_2026_09_28.json').write_text(json.dumps(auth,indent=2)+'\n',encoding='utf-8')"
          if errorlevel 1 exit /b 1
          set "PUBLISH_MESSAGE=OPS: authorize Q070 fixed candidate performance after preflight pass"
          "%PY_EXE%" -c "import os,urllib.request,json; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])" > "%RUNNER_TEMP%\\q070_base_sha.txt" || exit /b 1
          set /p BASE_SHA=<"%RUNNER_TEMP%\\q070_base_sha.txt"
          if not defined BASE_SHA exit /b 1
          "%PY_EXE%" "%GITHUB_WORKSPACE%\\automation\\github_contents_publish.py" --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/authorizations/q070_performance_2026_09_28.json=research\authorizations\q070_performance_2026_09_28.json || exit /b 1
