name: Q042 Additional Price Alpha PIT

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q042_additional_price_alpha_pit_2026_09_27.json"
      - "research/authorizations/q042_additional_price_alpha_pit_2026_09_27.json"
      - "automation/q042_additional_price_alpha_pit.py"
      - "tests/test_q042_additional_price_alpha_pit.py"
      - ".github/workflows/q042-additional-price-alpha-pit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Safety and authorization guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q042_additional_price_alpha_pit_2026_09_27.json").read_text())
          auth=json.loads(Path("research/authorizations/q042_additional_price_alpha_pit_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True and auth["execution_scope"]=="PIT_ONLY"
          assert auth["performance_execution_authorized"] is False
          assert spec["governance"]["performance_trial_authorized"] is False
          print('Q042 SAFETY/AUTH OK')
          PY
      - name: Q042 tests
        run: python -m pytest -q tests/test_q042_additional_price_alpha_pit.py
      - name: Q042 coverage-backed dataset
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q042_additional_price_alpha_pit_2026_09_27.json --output-root research/runs/q042_coverage
      - name: Q042 PIT mutation validation
        run: python -m automation.q042_additional_price_alpha_pit --universe-root research/runs/q042_coverage/T-2026-09-27-061/datasets --output research/runs/q042_pit/T-2026-09-27-061/pit_report.json
      - name: Validate Q042 PIT governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q042_pit/T-2026-09-27-061/pit_report.json").read_text())
          assert d["status"]=="PIT_PASSED" and d["performance_evaluation"] is False
          assert d["selection_used"] is False and d["future_mutation_checks_passed"] is True
          print('Q042 PIT GOVERNANCE PASS')
          PY
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q042-additional-price-alpha-pit-${{ github.run_id }}
          path: |
            research/runs/q042_coverage/
            research/runs/q042_pit/
          if-no-files-found: error
          retention-days: 30
