name: Rolling Candidate Migration Aftereffect Analysis

on:
  push:
    branches:
      - diagnostics/candidate-migration-aftereffect-2026-09-22
  workflow_run:
    workflows:
      - Rolling Geometry Control
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ROLLING_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '35750723097' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Rolling-Control laden
        uses: actions/download-artifact@v5
        with:
          name: rolling-geometry-control
          path: source_artifact
          run-id: ${{ env.ROLLING_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Quellartifact verifizieren
        run: |
          set -euo pipefail
          test -f source_artifact/research/rolling_geometry_control/rolling_geometry_control.json
          test -f source_artifact/research/rolling_geometry_control/raw_archive_manifest.json
          test -f source_artifact/research/rolling_geometry_control/data_manifest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("source_artifact/research/rolling_geometry_control")
          rolling = json.loads((root / "rolling_geometry_control.json").read_text(encoding="utf-8"))
          archive = json.loads((root / "raw_archive_manifest.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "data_manifest.json").read_text(encoding="utf-8"))
          assert rolling["diagnostic_type"] == "rolling_geometry_time_phase_control"
          assert rolling["target_count"] == 5000
          assert rolling["research_candle_count"] == 4500
          assert manifest["provenance"]["run_id"] == os.environ["ROLLING_SOURCE_RUN_ID"]
          assert archive["manifest_fingerprint"] == manifest["manifest_fingerprint"]
          assert archive["safety"]["paper_only"] is True
          assert archive["safety"]["live_trading_enabled"] is False
          assert archive["safety"]["orders_enabled"] is False
          print("SOURCE_ARTIFACT VERIFIED:", os.environ["ROLLING_SOURCE_RUN_ID"])
          PY
      - name: Kandidaten-Migrations-Nachwirkung analysieren
        run: |
          set -euo pipefail
          python -m automation.candidate_migration_aftereffect_analysis             --rolling-json source_artifact/research/rolling_geometry_control/rolling_geometry_control.json             --archive-manifest source_artifact/research/rolling_geometry_control/raw_archive_manifest.json             --output-dir research/candidate_migration_aftereffect
      - name: Analyse-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: candidate-migration-aftereffect-analysis
          path: research/candidate_migration_aftereffect/
          if-no-files-found: error
          retention-days: 30
