name: Q077 Fresh E1 E2 Coverage Discovery

on:
  push:
    branches: [master]
    paths:
      - "automation/q077_fixed_candidate_discovery.py"
      - "research/run_requests/q077_discovery.trigger"
      - "research/preregistrations/q077_discovery_2026_09_28.json"
      - ".github/workflows/q077-fresh-e1-e2-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify design and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q077_discovery_2026_09_28.json").read_text())
          assert p["status"]=="PREREGISTERED_COVERAGE_ONLY"
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          print("Q077 DESIGN/SAFETY OK")
          PY
      - name: Coverage-only discovery
        run: python automation/q077_fixed_candidate_discovery.py --output research/runs/q077_discovery/discovery.json --workers 12
      - name: Validate discovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q077_discovery/discovery.json").read_text())
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["asset_selection_by_performance"] is False
          assert d["safety"]["paper_only"] is True
          assert len(d["selected_coverage_batch"])>=8
          assert d["selected_common_count"]>=3500
          print("Q077 DISCOVERY CONTRACT OK")
          print("Q077 SELECTED:",d["selected_coverage_batch"])
          print("Q077 COMMON:",d["selected_common_count"])
          print("Q077 FINGERPRINT:",d["fingerprint"])
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v6
        with:
          name: q077-discovery
          path: research/runs/q077_discovery/discovery.json
          if-no-files-found: error
          retention-days: 30
