name: Q016 Mechanism Discrimination Replication

on:
  push:
    branches:
      - research/execute-q016-mechanism-discrimination-replication
    paths:
      - "automation/information_alpha_mechanism_discrimination_replication.py"
      - "tests/test_information_alpha_mechanism_discrimination_replication.py"
      - "research/preregistrations/q016_information_alpha_mechanism_discrimination_replication_2026_09_25.json"
      - "research/authorizations/q016_mechanism_discrimination_replication_2026_09_25.json"
      - ".github/workflows/q016-mechanism-discrimination-replication.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-q016-mechanism-discrimination-replication
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Full test suite
        run: python -m pytest -q
      - name: Safety and authorization
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          git merge-base --is-ancestor 9eae6a32e60c97ec964caf6fdf67573ad2d370fb HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p = json.loads(Path("research/preregistrations/q016_information_alpha_mechanism_discrimination_replication_2026_09_25.json").read_text(encoding="utf-8"))
          a = json.loads(Path("research/authorizations/q016_mechanism_discrimination_replication_2026_09_25.json").read_text(encoding="utf-8"))
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert p["performance_trial_authorized"] is False
          assert a["execution_authorized"] is True
          assert a["authorization_scope"] == "diagnostic_only"
          assert all(value is False for value in p["selection"].values())
          assert all(value is False for value in a["selection"].values())
          assert p["window"] == {"start": "2024-09-25", "end": "2025-09-24", "calendar_days": 365, "strictly_temporally_disjoint_from_q015": True}
          assert p["q015_reference_window"] == {"start": "2025-09-25", "end": "2026-09-24", "calendar_days": 365}
          PY
      - name: Safety preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/authorizations/q016_mechanism_discrimination_replication_2026_09_25.json").read_text(encoding="utf-8"))
          assert p["safety"]["paper_only"] is True
          assert p["safety"]["live_trading_enabled"] is False
          assert p["safety"]["orders_enabled"] is False
          assert p["safety"]["automatic_promotion"] is False
          PY

  collect:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "01"
          - id: "02"
          - id: "03"
          - id: "04"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install statsmodels==0.15.0
      - name: Collect fixed Q016 chunk
        run: |
          set -euo pipefail
          mkdir -p research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks
          python -m automation.information_alpha_mechanism_discrimination_replication \
            --mode collect_chunk \
            --chunk-id "${{ matrix.id }}" \
            --chunk-dir research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks
          test -s "research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks/q016_chunk_${{ matrix.id }}.json"
      - name: Upload chunk checkpoint
        uses: actions/upload-artifact@v6
        with:
          name: q016-chunk-${{ matrix.id }}-${{ github.run_id }}
          path: research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks/q016_chunk_${{ matrix.id }}.json
          retention-days: 30

  aggregate:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install statsmodels==0.15.0
      - name: Download chunk checkpoints
        uses: actions/download-artifact@v7
        with:
          pattern: q016-chunk-*-${{ github.run_id }}
          path: research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks
          merge-multiple: true
      - name: Freeze Q016 input
        run: |
          set -euo pipefail
          python -m automation.information_alpha_mechanism_discrimination_replication \
            --mode freeze \
            --chunk-dir research/runs/information_alpha_mechanism_discrimination_replication/q016_chunks \
            --input-path research/runs/information_alpha_mechanism_discrimination_replication/q016_frozen_input/q016_frozen_input.json
          test -s research/runs/information_alpha_mechanism_discrimination_replication/q016_frozen_input/q016_frozen_input.json
      - name: Execute Q016 diagnostic
        run: |
          set -euo pipefail
          python -m automation.information_alpha_mechanism_discrimination_replication \
            --mode analyze \
            --input-path research/runs/information_alpha_mechanism_discrimination_replication/q016_frozen_input/q016_frozen_input.json \
            --output-dir research/runs/information_alpha_mechanism_discrimination_replication/q016
          test -s research/runs/information_alpha_mechanism_discrimination_replication/q016/q016_mechanism_discrimination_replication.json
      - name: Validate output contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/runs/information_alpha_mechanism_discrimination_replication/q016/q016_mechanism_discrimination_replication.json").read_text(encoding="utf-8"))
          assert p["task_id"] == "Q-016-INFORMATION-ALPHA-MECHANISM-DISCRIMINATION-REPLICATION"
          assert p["replication_only"] is True
          assert p["performance_trial_authorized"] is False
          assert p["selection_used"] is False
          assert p["holdout_used"] is False
          assert p["parameter_search_used"] is False
          assert p["feature_selection_used"] is False
          assert p["asset_selection_used"] is False
          assert p["horizon_selection_used"] is False
          assert p["paper_only"] is True
          assert p["live_trading_enabled"] is False
          assert p["orders_enabled"] is False
          assert p["automatic_promotion"] is False
          assert p["window"]["strictly_temporally_disjoint_from_q015"] is True
          assert len(p["cells"]) in (0, 6)
          PY
      - name: Upload final Q016 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q016-mechanism-discrimination-replication-${{ github.run_id }}
          path: research/runs/information_alpha_mechanism_discrimination_replication/
          retention-days: 30
