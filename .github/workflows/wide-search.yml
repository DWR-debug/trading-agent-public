name: Wide Search Research Lane

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ausführungsmodus"
        required: true
        default: triage
        type: choice
        options:
          - triage
          - round_002
  push:
    branches:
      - research/wide-search-lane
      - research/wide-search-round-002-volatility-regime-v2
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

concurrency:
  group: trading-agent-wide-search
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-lane') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'triage') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("WIDE SEARCH SAFETY OK")
          PY
      - name: Wide-search Triage
        run: |
          set -euo pipefail
          python -m automation.wide_search_triage
      - name: Wide-search Probe
        run: |
          set -euo pipefail
          python -m automation.wide_search_probe
      - name: Triage- und Probe-Tests
        run: python -m pytest -q tests/test_wide_search_triage.py tests/test_wide_search_probe.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-${{ github.run_id }}
          path: research/runs/wide_search/
          if-no-files-found: warn
          retention-days: 30

  round_002:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-round-002-volatility-regime-v2') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'round_002') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install statsmodels==0.15.0 pytest
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("ROUND 002 SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_round_002_volatility_regime.py
      - name: Volatility-Regime Diagnostic
        run: |
          set -euo pipefail
          python -m automation.wide_search_round_002_volatility_regime
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-round-002-${{ github.run_id }}
          path: research/runs/wide_search/
          if-no-files-found: warn
          retention-days: 30

  h06_sector_neutral:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-h06-residual-momentum-v1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("H06 SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_h06_sector_neutral_residual_momentum_coverage.py
      - name: H06 Coverage Preflight
        run: |
          set -euo pipefail
          python -m automation.wide_search_h06_sector_neutral_residual_momentum_coverage
      - name: Evidence-Datei prüfen
        if: always()
        run: |
          set -euo pipefail
          test -s research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
          sha256sum research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-h06-${{ github.run_id }}
          path: research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
          if-no-files-found: error
          retention-days: 30
