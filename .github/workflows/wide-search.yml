name: Wide Search Research Lane

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ausführungsmodus"
        required: true
        default: triage
        type: choice
        options:
          - triage
          - round_002
  push:
    branches:
      - research/wide-search-lane
      - research/wide-search-round-002-volatility-regime-v2
      - research/wide-search-h06-residual-momentum-v1
      - research/wide-search-h06-residual-momentum-repair-v1
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

concurrency:
  group: trading-agent-wide-search
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-lane') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'triage') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("WIDE SEARCH SAFETY OK")
          PY
      - name: Wide-search Triage
        run: |
          set -euo pipefail
          python -m automation.wide_search_triage
      - name: Wide-search Probe
        run: |
          set -euo pipefail
          python -m automation.wide_search_probe
      - name: Triage- und Probe-Tests
        run: python -m pytest -q tests/test_wide_search_triage.py tests/test_wide_search_probe.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-${{ github.run_id }}
          path: research/runs/wide_search/
          if-no-files-found: warn
          retention-days: 30

  round_002:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-round-002-volatility-regime-v2') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'round_002') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install statsmodels==0.15.0 pytest
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("ROUND 002 SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_round_002_volatility_regime.py
      - name: Volatility-Regime Diagnostic
        run: |
          set -euo pipefail
          python -m automation.wide_search_round_002_volatility_regime
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-round-002-${{ github.run_id }}
          path: research/runs/wide_search/
          if-no-files-found: warn
          retention-days: 30

  h06_sector_neutral:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-h06-residual-momentum-v1') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/wide-search-h06-residual-momentum-v1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("H06 SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_h06_sector_neutral_residual_momentum_coverage.py
      - name: H06 Coverage Preflight
        run: |
          set -euo pipefail
          python -m automation.wide_search_h06_sector_neutral_residual_momentum_coverage
      - name: Evidence-Datei prüfen
        if: always()
        run: |
          set -euo pipefail
          test -s research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
          sha256sum research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-h06-${{ github.run_id }}
          path: research/runs/wide_search/h06_sector_neutral_residual_momentum_coverage.json
          if-no-files-found: error
          retention-days: 30

  h06_sector_neutral_repair:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-h06-residual-momentum-repair-v1') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/wide-search-h06-residual-momentum-repair-v1') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          print("H06 REPAIR SAFETY OK")
          PY
      - name: Unit Tests
        run: python -m pytest -q tests/test_wide_search_h06_sector_neutral_residual_momentum_repair_coverage.py
      - name: H06 Coverage Repair Preflight
        run: |
          set -euo pipefail
          python -m automation.wide_search_h06_sector_neutral_residual_momentum_repair_coverage
      - name: Evidence-Datei prüfen
        if: always()
        run: |
          set -euo pipefail
          test -s research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json
          sha256sum research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wide-search-h06-repair-${{ github.run_id }}
          path: |
            research/runs/wide_search/h06_sector_neutral_residual_momentum_repair_coverage.json
            research/runs/wide_search/h06_repair_datasets/
          if-no-files-found: error
          retention-days: 30


  h06_project_quality:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/wide-search-h06-residual-momentum-repair-v1' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Projektintegrität
        run: python automation/project_integrity_check.py
      - name: Project-State Freshness
        run: python automation/project_state_freshness_check.py
      - name: Paper-only-Safety und H06-State
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False

          state = json.loads(Path("research/evidence/project_state.json").read_text(encoding="utf-8"))
          assert state["repository"] == "DWR-debug/trading-agent-public"
          assert state["engineering_notes"]["current_queue_task"] == "WIDE-SEARCH-H06-SECTOR-NEUTRAL-RESIDUAL-MOMENTUM"
          assert state["engineering_notes"]["last_completed_queue_task"] == "WIDE-SEARCH-ROUND-002"
          assert state["engineering_notes"]["h06_status"] == "COVERAGE_IN_PROGRESS_REPAIR"
          assert state["engineering_notes"]["h06_performance_trial_authorized"] is False
          assert state["wide_search_round_002_scientific_result_status"] == "PRUNED"
          assert state["wide_search_round_002_classification"] == "PRUNE_NO_RISK_REGIME_SUPPORT"
          assert state["agent_usage"]["paid_api_budget_usd"] == 0.0
          assert state["agent_usage"]["auto_paid_api_calls"] is False
          print("H06 PROJECT QUALITY OK")
          PY