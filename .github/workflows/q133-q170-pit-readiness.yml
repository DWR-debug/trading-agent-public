name: Q133-Q170 PIT Readiness R1

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths:
      - "automation/q133_q170_pit_readiness.py"
      - "research/frontier/q133_q170_pit_readiness_wave_2026_10_03.json"
      - "research/frontier/q133_q145_candidate_wave_2026_10_03.json"
      - "research/frontier/q146_q151_candidate_wave_2026_10_03.json"
      - "research/frontier/q152_q165_candidate_wave_2026_10_03.json"
      - "research/frontier/q166_q170_candidate_wave_2026_10_03.json"
      - "research/evidence/q133_q170_source_feasibility_2026_10_03.json"
      - "tests/test_q133_q170_pit_readiness.py"
      - "automation/q137_q144_micro_pit.py"
      - "tests/test_q137_q144_micro_pit.py"
      - "research/governance/q144_q107_wikipedia_page_map_2026_10_03.json"
      - ".github/workflows/q133-q170-pit-readiness.yml"

permissions:
  contents: write

concurrency:
  group: trading-agent-q133-q170-pit-readiness
  cancel-in-progress: true

jobs:
  pit_readiness:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Q133-Q170 PIT readiness R1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q133_q170_pit_readiness"
          python -m automation.q133_q170_pit_readiness \
            --output "research/runs/q133_q170_pit_readiness/${GITHUB_RUN_ID}.json"

      - name: Validate PIT-readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("research/runs/q133_q170_pit_readiness") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "PIT_READINESS_COMPLETED_NO_PERFORMANCE"
          assert d["source_receipt"]["source_probe_pass_count"] == 25
          assert d["source_receipt"]["source_feasible_candidate_count"] == 21
          for key in (
              "performance", "holdout_selection", "asset_selection",
              "parameter_search", "threshold_search", "horizon_search",
              "variant_search", "candidate_ranking", "promotion", "live_execution"
          ):
              assert d["scientific_boundary"][key] is False
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          assert d["synthetic_mutation_checks"]["future_row_prefix_invariant"] is True
          assert d["synthetic_mutation_checks"]["no_search_dimension_present"] is True
          print("Q133_Q170_PIT_READINESS_R1_OK")
          PY

      - name: Run Q137/Q144 historical micro PIT sample
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q137_q144_micro_pit \
            --output "research/runs/q133_q170_pit_readiness/${GITHUB_RUN_ID}_q137_q144.json"

      - name: Validate Q137/Q144 micro PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,os; from pathlib import Path; p=Path('research/runs/q133_q170_pit_readiness')/(os.environ['GITHUB_RUN_ID']+'_q137_q144.json'); d=json.loads(p.read_text()); assert d['status']=='MICRO_PIT_SAMPLE_COMPLETED_NO_PERFORMANCE'; assert isinstance(d['q137_sec_submission_sample']['all_symbols_reconstructable'],bool); assert isinstance(d['q144_wikimedia_pageview_sample']['all_symbols_reconstructable'],bool); assert all(v is False for v in d['scientific_boundary'].values()); assert d['safety']['PAPER_ONLY'] is True and d['safety']['LIVE_TRADING_ENABLED'] is False and d['safety']['ORDERS_ENABLED'] is False and d['safety']['AUTOMATIC_PROMOTION'] is False; assert all(d['mutation_tests'].values()); print('Q137_Q144_MICRO_PIT_OK')"
      - name: Persist validated Q137/Q144 micro PIT receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist Q137-Q144 micro PIT receipt"
        run: |
          set -euo pipefail
          input="research/runs/q133_q170_pit_readiness/${GITHUB_RUN_ID}_q137_q144.json"
          latest="research/evidence/q137_q144_micro_pit_latest.json"
          test -f "$input"
          python automation/github_contents_publish.py             --repository "${GITHUB_REPOSITORY}"             --branch master             --file "$latest=$input"
      - name: Persist validated Q133-Q170 material receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "OPS: persist latest Q133-Q170 PIT-readiness material receipt"
        run: |
          set -euo pipefail
          input="research/runs/q133_q170_pit_readiness/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q133_q170_pit_readiness_latest.json"
          test -f "$input"
          code_sha="$(sha256sum automation/q133_q170_pit_readiness.py | awk '{print $1}')"
          python -m automation.q133_q170_pit_receipt_persist --input "$input" --output "$latest" --source-code-sha256 "$code_sha"
          for attempt in 1 2 3; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if git show "origin/master:${latest}" > "$RUNNER_TEMP/q133_current_receipt.json" 2>/dev/null; then
              if cmp -s "$latest" "$RUNNER_TEMP/q133_current_receipt.json"; then
                echo "Q133_Q170_MATERIAL_RECEIPT_UNCHANGED"
                exit 0
              fi
            fi
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$base_sha" \
              --file "$latest=$latest"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::Q133-Q170 material receipt publication failed after retries"
          exit 1
      - name: Upload PIT-readiness receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q133-q170-pit-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q133_q170_pit_readiness/
          if-no-files-found: error
          retention-days: 30
