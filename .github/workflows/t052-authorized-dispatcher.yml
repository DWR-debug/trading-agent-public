name: T052 Authorized Exact-CI Dispatcher

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/t052_exact_ci_once.trigger"

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-t052-authorized-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Verify T052 authorization and dispatch exact gate once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f research/authorizations/t052_fixed_core_sleeve_performance_2026_09_27.json
          python - <<'PY'
          import json
          from pathlib import Path

          auth = json.loads(Path(
              "research/authorizations/t052_fixed_core_sleeve_performance_2026_09_27.json"
          ).read_text(encoding="utf-8"))
          assert auth["trial_id"] == "T-2026-09-27-052"
          assert auth["authorized"] is True
          assert auth["performance_execution_authorized"] is True
          assert auth["governance"]["parameter_search"] is False
          assert auth["governance"]["holdout_used_for_selection"] is False
          assert auth["governance"]["promotion_decision"] is False
          assert auth["governance"]["live_execution"] is False
          assert auth["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }
          PY

          if grep -q '"T-2026-09-27-052"' research/evidence/trial_ledger.json; then
            echo "T052_ALREADY_RECORDED_NO_DISPATCH"
            exit 0
          fi

          gh workflow run t052-exact-master-ci-gate.yml --repo "${GITHUB_REPOSITORY}" --ref master
          echo "T052_EXACT_CI_DISPATCH_REQUESTED"
