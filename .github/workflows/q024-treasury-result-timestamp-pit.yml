name: Q024 Treasury Auction Result Timestamp PIT Feasibility

on:
  push:
    branches: [master]
    paths:
      - "automation/q024_treasury_auction_result_timestamp_pit_feasibility.py"
      - "tests/test_q024_treasury_auction_result_timestamp_pit_feasibility.py"
      - "research/preregistrations/q024_treasury_auction_result_timestamp_pit_feasibility_2026_09_27.json"
      - "docs/research_design/Q024-treasury-auction-result-publication-timestamp-pit-feasibility-2026-09-27.md"
      - "research/run_requests/q024_treasury_result_timestamp_pit.trigger"
      - ".github/workflows/q024-treasury-result-timestamp-pit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q024-timestamp-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded feasibility dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf exchange_calendars
      - name: Safety guard
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('Q024 SAFETY OK')"
      - name: Focused Q024 regression tests
        run: python -m pytest -q tests/test_q024_treasury_auction_result_timestamp_pit_feasibility.py
      - name: Execute fixed Q024 feasibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/source_feasibility/q024
          set +e
          python -m automation.q024_treasury_auction_result_timestamp_pit_feasibility --output research/runs/source_feasibility/q024/result.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
      - name: Enforce feasibility-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/runs/source_feasibility/q024/result.json').read_text(encoding='utf-8'))
          assert d['task_id'] == 'Q-024-TREASURY-AUCTION-RESULT-TIMESTAMP-PIT-FEASIBILITY'
          assert d['status'] in {'COVERAGE_VALIDATED', 'DATA_INSUFFICIENT'}
          assert d['fixed_population']['total_events'] == 89
          assert d['coverage']['minimum_required_ratio'] == 1.0
          g=d['governance']
          for key in ['source_feasibility_only']:
              assert g[key] is True
          for key in ['performance_evaluation','pnl_evaluation','holdout_used','candidate_ranking','parameter_search','asset_search','threshold_search','horizon_search','variant_search','research_gate_changes','promotion_decision']:
              assert g[key] is False
          assert d['safety'] == {'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}
          assert d['fingerprint']
          print('Q024 FEASIBILITY CONTRACT OK')
          print('STATUS:', d['status'])
          print('TIMESTAMP_VALIDATED_EVENTS:', d['coverage']['timestamp_validated_events'])
          print('RESULT_FINGERPRINT:', d['fingerprint'])
          PY
      - name: Publish feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q024-timestamp-feasibility-${{ github.run_id }}
          path: research/runs/source_feasibility/q024/
          if-no-files-found: error
          retention-days: 30
