name: Android Phone Fleet Receipt Sync

on:
  workflow_run:
    workflows: ["Android Phone Fleet Worker"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.repository.full_name == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Materialize latest phone receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/android-phone-artifacts"
          mkdir -p "$RUNNER_TEMP/android-phone-artifacts"
          gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/android-phone-artifacts/index.json"
          python3 - <<'PY'
          import json, os, re, subprocess, zipfile
          from pathlib import Path
          index = json.loads(Path(os.environ["RUNNER_TEMP"]+"/android-phone-artifacts/index.json").read_text(encoding="utf-8"))
          root = Path(os.environ["RUNNER_TEMP"]) / "android-phone-artifacts"
          statuses = []
          for artifact in index.get("artifacts", []):
              name = str(artifact.get("name",""))
              if not name.startswith("android-phone-"):
                  continue
              aid = str(artifact.get("id"))
              zip_path = root / (re.sub(r"[^A-Za-z0-9_.-]", "_", name)+".zip")
              out = root / (re.sub(r"[^A-Za-z0-9_.-]", "_", name))
              out.mkdir(parents=True, exist_ok=True)
              with zip_path.open("wb") as f:
                  subprocess.run(["gh","api","-H","Accept: application/vnd.github+json",f"/repos/{os.environ[\"REPO\"]}/actions/artifacts/{aid}/zip"], stdout=f, check=True)
              try:
                  with zipfile.ZipFile(zip_path) as z:
                      z.extractall(out)
              except zipfile.BadZipFile:
                  continue
              receipt = next(out.rglob("android_phone_acceptance_receipt.json"), None)
              m = re.match(r"android-phone-[0-9]+-(.+)$", name)
              resource_id = m.group(1) if m else name
              if receipt and receipt.is_file():
                  data = json.loads(receipt.read_text(encoding="utf-8"))
                  status = str(data.get("status","ANDROID_PHONE_UTILITY_NOT_ACCEPTED"))
                  eligible = status == "ANDROID_PHONE_UTILITY_ACCEPTED"
                  runner_name = data.get("runner_name")
                  model = data.get("model")
                  endpoint = data.get("endpoint")
              else:
                  status = "ANDROID_PHONE_UTILITY_NOT_ACCEPTED"
                  eligible = False
                  runner_name = None
                  model = None
                  endpoint = None
              statuses.append({
                  "schema_version":1,
                  "status_type":"android_phone_operational_status",
                  "resource_id":resource_id,
                  "workflow_name":"Android Phone Fleet Worker",
                  "workflow_run_id":os.environ["RUN_ID"],
                  "workflow_conclusion":os.environ["RUN_CONCLUSION"],
                  "source_commit":os.environ["SOURCE_COMMIT"],
                  "workflow_run_updated_at":os.environ["RUN_UPDATED_AT"],
                  "status":status,
                  "eligible":eligible,
                  "runner_name":runner_name,
                  "model":model,
                  "endpoint":endpoint,
                  "scientific_evidence":False,
                  "performance_authorization":False,
                  "candidate_selection":False,
                  "candidate_ranking":False,
                  "promotion":False,
                  "paper_only":True,
                  "live_trading_enabled":False,
                  "orders_enabled":False,
                  "automatic_promotion":False
              })
          target = Path("ops/android_phone_runtime_status")
          target.mkdir(parents=True, exist_ok=True)
          for status in sorted(statuses, key=lambda x:x["resource_id"]):
              path = target / (status["resource_id"].replace("/","_")+".json")
              path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n", encoding="utf-8")
              print(path)
          PY

      - name: Commit canonical Android phone statuses
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git config user.name "trading-agent-android-phone-sync"
          git config user.email "trading-agent-android-phone-sync@users.noreply.github.com"
          git add ops/android_phone_runtime_status
          if git diff --cached --quiet; then
            echo "No Android phone status change."
            exit 0
          fi
          git commit -m "OPS: synchronize Android phone fleet receipts"
          for attempt in 1 2; do
            echo "Android phone receipt sync push attempt ${attempt}/2"
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo "Android phone receipt sync push failed after retry."
          exit 1
