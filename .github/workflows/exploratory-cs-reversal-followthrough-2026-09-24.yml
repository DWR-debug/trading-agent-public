name: Exploratory CS Reversal Follow-through 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/exploratory_cs_reversal_followthrough_2026_09_24.py"
      - "tests/test_exploratory_cs_reversal_followthrough_2026_09_24.py"
      - "docs/exploratory_cs_reversal_followthrough_2026_09_24.md"
      - ".github/workflows/exploratory-cs-reversal-followthrough-2026-09-24.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-exploratory-cs-reversal-followthrough-2026-09-24
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Immutable Validierungsartefakte laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/followthrough/sources
          declare -A artifacts=(
            [validation_1]=10751817990
            [validation_2]=10740188093
            [validation_3]=10745697729
            [validation_4]=10753545703
          )
          for name in "${!artifacts[@]}"; do
            id="${artifacts[$name]}"
            mkdir -p "/tmp/${name}"
            gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/${name}.zip"
            unzip -q "/tmp/${name}.zip" -d "/tmp/followthrough/sources/${name}"
          done
          test -f /tmp/followthrough/sources/validation_1/data/market_data/DIA/1d.csv
          test -f /tmp/followthrough/sources/validation_2/data/market_data/VTI/1d.csv
          test -f /tmp/followthrough/sources/validation_3/data/market_data/MDY/1d.csv
          test -f /tmp/followthrough/sources/validation_4/data/market_data/SCHB/1d.csv
          echo "IMMUTABLE_VALIDATION_ARTIFACTS_READY"
      - name: Explorativer Scope fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path("docs/exploratory_cs_reversal_followthrough_2026_09_24.md").read_text(encoding="utf-8")
          for token in (
              "post-hoc explorativ",
              "2.798",
              "Holdout",
              "keine Schwellenwertsuche",
              "PAPER_ONLY=True",
          ):
              assert token in text
          print("EXPLORATORY_SCOPE_VERIFIED")
          PY
      - name: Folgebewegungsdiagnose ausführen
        run: |
          set -euo pipefail
          python -m automation.exploratory_cs_reversal_followthrough_2026_09_24             --source-root /tmp/followthrough             --output research/exploratory_cs_reversal_followthrough_2026_09_24/report.json
      - name: Ergebnisintegrität und Safety prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("research/exploratory_cs_reversal_followthrough_2026_09_24/report.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          stored=r.pop("diagnostic_fingerprint")
          actual=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert stored==actual
          assert r["scope"]["exploratory_post_hoc"] is True
          assert r["scope"]["holdout_used_for_decision"] is False
          assert r["methodology"]["not_confirmatory"] is True
          assert r["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False}
          assert len(r["cases"])==4
          print("EXPLORATORY_RESULT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          print("REPLICATION_SUMMARY:", r["replication_summary"])
          PY
      - name: Diagnoseartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-cs-reversal-followthrough-2026-09-24-${{ github.run_id }}
          path: research/exploratory_cs_reversal_followthrough_2026_09_24/
          if-no-files-found: error
          retention-days: 30
