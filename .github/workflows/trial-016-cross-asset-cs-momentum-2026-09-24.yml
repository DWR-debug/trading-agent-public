name: Trial 016 Cross Asset CS Momentum Validation 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/trial_016_cross_asset_cs_momentum_2026_09_24.py"
      - "tests/test_trial_016_cross_asset_cs_momentum_2026_09_24.py"
      - "research/asset_universes.py"
      - "docs/trial_016_cross_asset_cs_momentum_preregistration_2026_09_24.md"
      - ".github/workflows/trial-016-cross-asset-cs-momentum-2026-09-24.yml"
      - "automation/prepare_research_data.py"
      - "backtesting/**"
      - "config/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-trial-016
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Trial-016-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_2026_09_24_sixteenth_cross_asset_cs             --output research/trial_016_cross_asset_cs_momentum_2026_09_24/data_manifest.json

      - name: Präregistrierung, Disjunktheit und Manifest fail-closed prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          from research.asset_universes import get_universe, list_universes

          universe_name = "validation_2026_09_24_sixteenth_cross_asset_cs"
          manifest_path = Path(
              "research/trial_016_cross_asset_cs_momentum_2026_09_24/data_manifest.json"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          universe = get_universe(universe_name)

          assert manifest["universe"] == universe_name
          assert manifest["target_count"] == 3500
          assert tuple(x["symbol"] for x in manifest["datasets"]) == universe.symbols
          assert all(x["candle_count"] == 3500 for x in manifest["datasets"])
          assert manifest["calendar_alignment"]["mode"] == "timestamp_intersection_tail"
          assert manifest["calendar_alignment"]["aligned_candle_count"] == 3500
          assert manifest["safety"]["paper_only"] is True
          assert manifest["safety"]["live_trading_enabled"] is False

          current = set(universe.symbols)
          prior = set()
          for item in list_universes():
              if item.name != universe_name:
                  prior.update(item.symbols)
          assert current.isdisjoint(prior)

          prereg = Path(
              "docs/trial_016_cross_asset_cs_momentum_preregistration_2026_09_24.md"
          ).read_text(encoding="utf-8")
          for symbol in universe.symbols:
              assert symbol in prereg

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("TRIAL_016_PREREGISTRATION_VERIFIED")
          print("TRIAL_016_SYMBOL_COUNT:", len(current))
          PY

      - name: Trial 016 ausführen
        run: |
          set -euo pipefail
          python -m automation.trial_016_cross_asset_cs_momentum_2026_09_24             --data-dir data/market_data             --manifest research/trial_016_cross_asset_cs_momentum_2026_09_24/data_manifest.json             --output research/trial_016_cross_asset_cs_momentum_2026_09_24/report.json

      - name: Ergebnisfingerprint und Safety prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/trial_016_cross_asset_cs_momentum_2026_09_24/report.json"
          )
          report = json.loads(path.read_text(encoding="utf-8"))
          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["preregistration"]["selection_after_results"] is False
          assert report["preregistration"]["parameter_optimization"] is False
          assert report["preregistration"]["holdout_selection"] is False
          assert report["source"]["fully_symbol_disjoint_from_master_universes"] is True
          assert report["methodology"]["long_only"] is True
          assert report["methodology"]["leverage"] == 1.0
          assert report["methodology"]["optimization_used"] is False
          assert report["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          print("TRIAL_016_REPORT_AND_SAFETY_VERIFIED")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Validierungsartefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-016-cross-asset-cs-${{ github.run_id }}
          path: |
            research/trial_016_cross_asset_cs_momentum_2026_09_24/
            data/market_data/DBA/
            data/market_data/DBB/
            data/market_data/FXA/
            data/market_data/FXY/
            data/market_data/MUB/
            data/market_data/SHV/
            data/market_data/EMB/
            data/market_data/BWX/
          if-no-files-found: error
          retention-days: 30
