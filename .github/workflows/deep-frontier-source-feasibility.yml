name: Deep Frontier Public Source Feasibility

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths:
      - "automation/q133_q145_source_feasibility.py"
      - "research/frontier/q133_q145_candidate_wave_2026_10_03.json"
      - "research/frontier/q146_q151_candidate_wave_2026_10_03.json"
      - "research/frontier/q152_q165_candidate_wave_2026_10_03.json"
      - "research/frontier/q166_q170_candidate_wave_2026_10_03.json"
      - "research/frontier/q171_q178_candidate_wave_2026_10_03.json"
      - "docs/research_design/PUBLIC_DOMAIN_FRONTIER_Q171_Q178_2026-10-03.md"
      - "docs/research_design/DEEP_PUBLIC_DIGITAL_PHYSICAL_FRONTIER_2026-10-03.md"
      - "docs/research_design/DEEP_PUBLIC_INFORMATION_FRONTIER_2026-10-03.md"
      - "research/governance/research_source_expansion_2026_10_03.json"
      - "tests/test_q133_q145_source_feasibility.py"
      - "automation/q171_q177_pit_readiness.py"
      - "automation/q171_webstate_coverage.py"
      - "automation/q171_webstate_warc_reconstruction.py"
      - "tests/test_q171_webstate_warc_reconstruction.py"
      - "research/governance/q171_issuer_web_url_map_2026_10_03.json"
      - "tests/test_q171_webstate_coverage.py"
      - ".github/workflows/deep-frontier-source-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-deep-frontier-source-feasibility
  cancel-in-progress: true

jobs:
  source_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run public source-feasibility gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/deep_frontier/${GITHUB_RUN_ID}"
          python -m automation.q133_q145_source_feasibility             --output "research/runs/deep_frontier/${GITHUB_RUN_ID}/source_feasibility.json"

      - name: Validate receipt boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("research/runs/deep_frontier") / os.environ["GITHUB_RUN_ID"] / "source_feasibility.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "DISCOVERY_SOURCE_FEASIBILITY_COMPLETED"
          assert data["scientific_boundary"]["performance"] is False
          assert data["scientific_boundary"]["holdout"] is False
          assert data["scientific_boundary"]["selection"] is False
          assert data["scientific_boundary"]["ranking"] is False
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["safety"]["orders_enabled"] is False
          assert data["safety"]["automatic_promotion"] is False
          assert data["synthetic_mutation_checks"]["future_row_invariance"] is True
          assert data["synthetic_mutation_checks"]["no_search_dimension_present"] is True
          print("DEEP_FRONTIER_SOURCE_FEASIBILITY_OK")
          PY

      - name: Run Q171 frozen issuer web-state coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q171_webstate_coverage \
            --output "research/runs/deep_frontier/${GITHUB_RUN_ID}/q171_webstate_coverage.json"

      - name: Run Q171 WARC reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q171_webstate_warc_reconstruction \
            "research/runs/deep_frontier/${GITHUB_RUN_ID}/q171_webstate_coverage.json" \
            --output "research/runs/deep_frontier/${GITHUB_RUN_ID}/q171_warc_reconstruction.json"

      - name: Validate Q171 WARC reconstruction boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/deep_frontier") / os.environ["GITHUB_RUN_ID"] / "q171_warc_reconstruction.json"
          d = json.loads(p.read_text(encoding='utf-8'))
          for result in d['results'].values():
              assert result['status'] in {'WARC_RECONSTRUCTED', 'INFRA_ACCESS_BLOCKED'}
          assert d['summary']['warc_reconstructed'] + d['summary']['blocked'] == d['summary']['capture_candidates']
          assert d['summary'].get('infra_blocked', 0) == sum(r['status'] == 'INFRA_ACCESS_BLOCKED' for r in d['results'].values())
          assert d['scientific_boundary']['performance'] is False
          assert d['scientific_boundary']['holdout'] is False
          assert d['scientific_boundary']['selection'] is False
          assert d['scientific_boundary']['ranking'] is False
          assert d['scientific_boundary']['promotion'] is False
          assert d['scientific_boundary']['live_execution'] is False
          assert d['safety']['paper_only'] is True
          assert d['safety']['live_trading_enabled'] is False
          assert d['safety']['orders_enabled'] is False
          assert d['safety']['automatic_promotion'] is False
          print('Q171_WARC_RECONSTRUCTION_OK')
          PY
      - name: Validate Q171 web-state coverage boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/deep_frontier") / os.environ["GITHUB_RUN_ID"] / "q171_webstate_coverage.json"
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'Q171_WEBSTATE_SOURCE_COVERAGE_COMPLETED'
          assert d['summary']['issuers'] == 8
          for key in ('performance','holdout','selection','ranking','parameter_search','threshold_search','horizon_search','asset_search','variant_search','promotion','live_execution'):
              assert d['scientific_boundary'][key] is False
          assert d['safety']['paper_only'] is True
          assert d['safety']['live_trading_enabled'] is False
          assert d['safety']['orders_enabled'] is False
          assert d['safety']['automatic_promotion'] is False
          print('Q171_WEBSTATE_COVERAGE_OK')
          PY
      - name: Run Q171-Q177 PIT-readiness audit
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q171_q177_pit_readiness \
            --output "research/runs/deep_frontier/${GITHUB_RUN_ID}/q171_q177_pit_readiness.json"

      - name: Validate PIT-readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("research/runs/deep_frontier") / os.environ["GITHUB_RUN_ID"] / "q171_q177_pit_readiness.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "PIT_READINESS_COMPLETED_NO_PERFORMANCE"
          assert data["scientific_boundary"]["performance"] is False
          assert data["scientific_boundary"]["holdout"] is False
          assert data["scientific_boundary"]["ranking"] is False
          assert data["scientific_boundary"]["selection"] is False
          assert data["scientific_boundary"]["promotion"] is False
          assert data["scientific_boundary"]["live_execution"] is False
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["safety"]["orders_enabled"] is False
          assert data["safety"]["automatic_promotion"] is False
          print("Q171_Q177_PIT_READINESS_OK")
          PY

      - name: Upload source-feasibility receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deep-frontier-source-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/deep_frontier/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
