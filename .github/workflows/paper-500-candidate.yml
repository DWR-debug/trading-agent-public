name: Formal Candidate 500 EUR Paper Run

on:
  push:
    branches: [master]
    paths:
      - "research/paper_candidates/**"
      - "automation/paper_candidate_500_gate.py"
      - "automation/paper_30_day_experiment.py"
      - "research/evidence_contract.py"
      - ".github/workflows/paper-500-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-formal-paper-500
  cancel-in-progress: false

jobs:
  candidate_500:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("FORMAL 500 PAPER SAFETY OK")
          PY

      - name: Gate tests
        run: python -m pytest -q tests/test_paper_candidate_500_gate.py

      - name: Resolve single frozen candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find research/paper_candidates -type f -name '*.json' | sort)
          test \${#manifests[@]} -eq 1 || {
            echo "::error::Exactly one frozen 500-EUR candidate manifest is required."
            printf '%s\n' "\${manifests[@]}"
            exit 1
          }
          echo "CANDIDATE_MANIFEST=\${manifests[0]}" >> "$GITHUB_ENV"

      - name: Evidence eligibility gate
        run: |
          set -euo pipefail
          python -m automation.paper_candidate_500_gate \
            --manifest "$CANDIDATE_MANIFEST" \
            | tee "$RUNNER_TEMP/paper_500_gate.json"

      - name: Execute isolated 30-day EUR 500 paper experiment
        run: |
          set -euo pipefail
          candidate_dir="research/runs/paper_500/\${{ github.run_id }}"
          mkdir -p "$candidate_dir"
          evidence_path="$(python -c 'import json,os; print(json.load(open(os.environ["CANDIDATE_MANIFEST"]))["evidence_path"])')"
          returns_path="$(python -c 'import json,os; print(json.load(open(os.environ["CANDIDATE_MANIFEST"]))["returns_path"])')"
          python -m automation.paper_30_day_experiment \
            --evidence "$evidence_path" \
            --returns "$returns_path" \
            --output "$candidate_dir/report.json" \
            --checkpoint "$candidate_dir/checkpoint.json" \
            --initial-capital-eur 500

      - name: Final contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/runs/paper_500")/"\${{ github.run_id }}"
          report=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert report["status"]=="COMPLETED"
          assert report["initial_capital_eur"]==500.0
          assert report["processed_days"]==30
          assert report["evidence_eligibility"]["status"]=="VALIDATED_PASS"
          assert report["evidence_eligibility"]["holdout_used_for_selection"] is False
          assert report["safety"]=={
              "paper_only":True,
              "live_trading_enabled":False,
              "orders_enabled":False,
          }
          assert report["report_fingerprint"]
          print("FORMAL 500 EUR PAPER CONTRACT OK")
          print("FINAL_EQUITY_EUR:", report["final_equity_eur"])
          print("MAX_DD_PERCENT:", report["maximum_drawdown_percent"])
          print("REPORT_FINGERPRINT:", report["report_fingerprint"])
          PY

      - name: Evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paper-500-\${{ github.run_id }}
          path: research/runs/paper_500/\${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
