name: RCCSM-0 Feasibility (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "automation/rccsm_feasibility.py"
      - "tests/test_rccsm_feasibility.py"
      - "docs/research_design/RCCSM_REGIME_CONDITIONAL_CAUSAL_SIGNAL_MESH_2026-09-28.md"
      - ".github/workflows/rccsm-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rccsm-feasibility-pc
  cancel-in-progress: true

jobs:
  feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-rccsm-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-rccsm.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Run RCCSM structural tests
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m pytest -q tests/test_rccsm_feasibility.py || exit /b 1
          endlocal

      - name: Generate RCCSM-0 replay artifact
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          if not exist "research\evidence" mkdir "research\evidence"
          "%PY_EXE%" -c "import json; from pathlib import Path; from automation.rccsm_feasibility import feasibility_manifest,route_mesh; state={'trend_coherence':0.8,'breadth':0.7,'dispersion':0.3,'event_density':0.1}; out={'manifest':feasibility_manifest(),'state_id':'RCCSM-SYNTHETIC-001','routing':route_mesh('RCCSM-SYNTHETIC-001',state)}; Path('research/evidence/rccsm0_feasibility_artifact.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')" || exit /b 1
          endlocal

      - name: Upload RCCSM-0 artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rccsm0-feasibility-pc
          path: |
            research/evidence/rccsm0_feasibility_artifact.json
          if-no-files-found: error
          retention-days: 30
