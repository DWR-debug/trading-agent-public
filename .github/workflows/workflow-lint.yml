name: Workflow Lint

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/actionlint"
          mkdir -p "$tmp"
          curl -L --fail --silent --show-error -o "$tmp/actionlint.tar.gz" https://github.com/rhysd/actionlint/archive/refs/heads/main.tar.gz
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp"
          cd "$tmp"/actionlint-main
          go build -o "$tmp/actionlint" ./cmd/actionlint
          "$tmp/actionlint" -version || true
          echo "$tmp" >> "$GITHUB_PATH"

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -config-file .github/actionlint.yaml -verbose