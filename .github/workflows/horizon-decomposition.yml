name: Horizon Decomposition Control

on:
  push:
    branches:
      - diagnostics/horizon-decomposition-2026-09-22
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-horizon-decomposition
  cancel-in-progress: false

jobs:
  decompose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Horizon-Dekomposition ausführen
        run: |
          set -euo pipefail
          python -m automation.horizon_decomposition             --universe benchmark             --target-count 5000             --output-dir research/horizon_decomposition
      - name: Dekompositionsartefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-decomposition-${{ github.run_id }}
          path: research/horizon_decomposition/
          if-no-files-found: error
          retention-days: 30
