name: Local Research Worker

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbol
        required: true
        default: BTCUSDT
        type: string
      interval:
        description: Intervall
        required: true
        default: 1h
        type: string
      writeback:
        description: Ergebnisse in den Research-Branch schreiben
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trading-agent-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 360

    steps:
      - name: Legacy-Diagnosepfad absichern
        if: ${{ inputs.writeback }}
        run: |
          echo "research-local ist nur noch ein Legacy-Diagnosepfad."
          echo "Writeback ist hier dauerhaft deaktiviert; nutze den zentralen Research-Workflow."
          exit 1

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python-Version prüfen
        run: python --version

      - name: Tests vor Research
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Lokalen Research-Runner ausführen
        run: python -m automation.research_worker --symbol "${{ inputs.symbol }}" --interval "${{ inputs.interval }}"

      - name: Research-Ergebnis validieren
        shell: bash
        run: |
          set -euo pipefail
          result=$(find research/results -maxdepth 1 -type f -name "${{ inputs.symbol }}_${{ inputs.interval }}_*.json" -print | sort | tail -n 1)
          test -n "$result"
          python - "$result" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))

          required = {
              "generated_at",
              "research_type",
              "research_status",
              "safety",
              "protocol",
              "gates",
              "dataset",
              "baseline",
              "walk_forward",
              "rolling_walk_forward",
              "holdout",
              "optimization_top",
          }

          missing = required.difference(data)
          assert not missing, f"Fehlende Felder: {sorted(missing)}"
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["research_type"] == "legacy_local_diagnostic"
          assert data["authoritative"] is False
          assert isinstance(data["result_fingerprint"], str)
          from automation.research_workflow import verify_result_fingerprint

          verify_result_fingerprint(data)
          assert data["research_status"] in {"PASSED", "BLOCKED"}
          assert data["gates"]["status"] == data["research_status"]
          assert data["gates"]["gate_count"] == 7
          assert data["holdout"]["trade_count"] >= 0
          print(f"VALID RESEARCH RESULT: {path}")
          PY

      - name: Research-Ergebnis als Artifact sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: research-result-${{ inputs.symbol }}-${{ inputs.interval }}-${{ github.run_id }}
          path: research/results/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Research-Gates erzwingen
        shell: bash
        run: |
          set -euo pipefail
          result=$(find research/results -maxdepth 1 -type f -name "${{ inputs.symbol }}_${{ inputs.interval }}_*.json" -print | sort | tail -n 1)
          test -n "$result"
          python - "$result" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))

          if data["research_status"] != "PASSED":
              failed = data["gates"].get("failed_gates", [])
              raise SystemExit(
                  "RESEARCH BLOCKED: " + ", ".join(failed)
              )

          print("RESEARCH GATES PASSED")
          PY

      - name: Writeback-Policy abschließend prüfen
        if: ${{ inputs.writeback }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(find research/results -maxdepth 1 -type f -name "${{ inputs.symbol }}_${{ inputs.interval }}_*.json" -print | sort | tail -n 1)
          test -n "$result"
          python - "$result" "${{ github.ref_name }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          from automation.research_policy import writeback_allowed

          path = Path(sys.argv[1])
          current_branch = sys.argv[2]
          data = json.loads(path.read_text(encoding="utf-8"))

          if not writeback_allowed(
              data["research_status"],
              current_branch,
          ):
              raise SystemExit(
                  "WRITEBACK DENIED: Research muss PASSED sein "
                  "und auf research/autonomous-results laufen."
              )

          print("WRITEBACK POLICY OK")
          PY

      - name: Nur validierte Research-Ergebnisse schreiben
        if: ${{ inputs.writeback }}
        run: |
          set -euo pipefail
          git status --short
          if git status --porcelain | grep -v '^?? research/results/'; then
            echo "FEHLER: Unerwartete versionierte Änderungen außerhalb von research/results."
            exit 1
          fi
          git add research/results
          git diff --cached --quiet || git commit -m "Research-Ergebnisse speichern"
          git push origin "HEAD:research/autonomous-results"
