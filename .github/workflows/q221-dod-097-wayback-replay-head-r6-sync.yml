name: Q221 DoD 097 Wayback Replay HEAD Metadata Receipt Persistence (R6)

on:
  workflow_run:
    workflows: ["Q221 DoD 097 Wayback Replay HEAD Metadata Diagnostic (R6)"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: trading-agent-q221-dod-097-wayback-replay-head-r6-sync
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      ${{
        github.event.workflow_run.repository.full_name == 'DWR-debug/trading-agent-public' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Download exact source-run artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/q221-r6-artifact

      - name: Validate fingerprint, frozen lineage, and no-body safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"q221-r6-artifact"
          matches=list(root.rglob("q221-r6-head.json"))
          if len(matches)!=1:
              raise SystemExit(f"R6_ARTIFACT_COUNT_INVALID:{len(matches)}")
          p=matches[0]
          r=json.loads(p.read_text(encoding="utf-8"))
          fp=r.get("receipt_fingerprint")
          if not isinstance(fp,str) or len(fp)!=64:
              raise SystemExit("R6_FINGERPRINT_MISSING")
          payload={k:v for k,v in r.items() if k!="receipt_fingerprint"}
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(",",":"),allow_nan=False).encode("utf-8")
          if hashlib.sha256(canonical).hexdigest()!=fp:
              raise SystemExit("R6_FINGERPRINT_MISMATCH")
          if r.get("record_type")!="q221_dod_097_wayback_replay_head_metadata_diagnostic" or r.get("candidate_id")!="Q221":
              raise SystemExit("R6_IDENTITY_INVALID")
          request=r.get("request",{})
          if request.get("method")!="HEAD" or request.get("url")!="https://web.archive.org/web/20250128184322id_/https://files.usaspending.gov/award_data_archive/FY2025_097_Contracts_Full_20250106.zip":
              raise SystemExit("R6_REQUEST_PIN_MISMATCH")
          lineage=r.get("lineage",{})
          if lineage.get("r3",{}).get("receipt_fingerprint")!="895a6d4e343cb535866df81ce06d6d824e1d05b1c7af114aa3befeb5c5473a5b" or lineage.get("r5",{}).get("receipt_fingerprint")!="a29529db8730d85c3c72a2b773033faa39653ef62a9d69703ce5a60433a9fc9d":
              raise SystemExit("R6_FROZEN_LINEAGE_MISMATCH")
          probe=r.get("source_probe",{})
          count=probe.get("request_count")
          if isinstance(count,bool) or not isinstance(count,int) or count not in (0,1):
              raise SystemExit("R6_REQUEST_COUNT_INVALID")
          if probe.get("archive_endpoint_request_count")!=count or probe.get("archive_replay_get_request_count")!=0:
              raise SystemExit("R6_GET_OR_REQUEST_COUNT_INVALID")
          if probe.get("response_body_read_bytes")!=0 or probe.get("archive_payload_body_read") is not False or probe.get("archive_payload_persisted") is not False:
              raise SystemExit("R6_RESPONSE_BODY_SAFETY_INVALID")
          if len(probe.get("responses",[]))>1:
              raise SystemExit("R6_RESPONSE_LIMIT_INVALID")
          safety=r.get("safety",{})
          if safety.get("paper_only") is not True:
              raise SystemExit("R6_PAPER_ONLY_MISSING")
          for key in ("live_trading_enabled","orders_enabled","scientific_evidence","performance_authorization","holdout_selection","ranking","tuning","promotion","live_execution","archive_replay_get_allowed","archive_payload_download_allowed","archive_payload_persisted","archive_schema_examined","transaction_row_presence_examined"):
              if safety.get(key) is not False:
                  raise SystemExit("R6_SAFETY_GATE_OPEN:"+key)
          if r.get("status")=="Q221_R6_HEAD_METADATA_CAPTURED":
              meta=r.get("http_metadata",{})
              if meta.get("http_status")!=200 or meta.get("response_body_read_bytes")!=0:
                  raise SystemExit("R6_SUCCESS_METADATA_INVALID")
              if any(k not in ["content-length","content-type","content-encoding","transfer-encoding","last-modified","date","server","accept-ranges","content-range","etag"] for k in meta.get("headers",{})):
                  raise SystemExit("R6_HEADER_ALLOWLIST_VIOLATION")
          elif not r.get("errors"):
              raise SystemExit("R6_FAILURE_MISSING_ERROR")
          evidence=Path("research/evidence")
          evidence.mkdir(parents=True,exist_ok=True)
          raw=p.read_bytes()
          attempt=evidence/f"q221_dod_097_wayback_replay_head_r6_attempt_{os.environ['SOURCE_RUN_ID']}.json"
          latest=evidence/"q221_dod_097_wayback_replay_head_r6_latest.json"
          if attempt.exists():
              raise SystemExit("R6_IMMUTABLE_ATTEMPT_ALREADY_EXISTS")
          tmp=attempt.with_suffix(".json.tmp")
          latest_tmp=latest.with_suffix(".json.tmp")
          tmp.write_bytes(raw); latest_tmp.write_bytes(raw)
          tmp.replace(attempt); latest_tmp.replace(latest)
          print("Q221_R6_FP="+fp)
          print("Q221_R6_SOURCE_RUN="+os.environ["SOURCE_RUN_URL"])
          print("Q221_R6_SOURCE_COMMIT="+os.environ["SOURCE_COMMIT"])
          PY

      - name: Publish immutable attempt and latest pointer
        shell: bash
        env:
          PUBLISH_MESSAGE: "EVIDENCE: persist Q221 replay HEAD metadata R6 run ${{ github.event.workflow_run.id }}"
        run: |
          set -euo pipefail
          attempt_file="research/evidence/q221_dod_097_wayback_replay_head_r6_attempt_${SOURCE_RUN_ID}.json"
          latest="research/evidence/q221_dod_097_wayback_replay_head_r6_latest.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py --repository "${GITHUB_REPOSITORY}" --branch master --base-sha "${base_sha}" --file "${attempt_file}=${attempt_file}" --file "${latest}=${latest}"; then exit 0; fi
            sleep "${attempt}"
          done
          echo "::error::R6 receipt publication failed after retries"
          exit 1
