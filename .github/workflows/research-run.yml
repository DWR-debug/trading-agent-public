name: Research Run

on:
  workflow_dispatch:
    inputs:
      target_count:
        description: Historische Candles je Datensatz
        required: true
        default: "10000"
        type: string

permissions:
  contents: read

env:
  TARGET_COUNT: ${{ inputs.target_count || '10000' }}

jobs:
  research:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Tests
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Historische Research-Daten vorbereiten
        run: python -m automation.prepare_research_data --target-count "$TARGET_COUNT"

      - name: Reproduzierbaren Research-Run ausführen
        run: python -m automation.research_workflow

      - name: Research-Ergebnis prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("reports").glob("analysis_*.json"))
          if not reports:
              raise SystemExit("Kein Research-Report gefunden.")

          report = json.loads(reports[-1].read_text(encoding="utf-8"))
          from automation.research_workflow import verify_result_fingerprint

          verify_result_fingerprint(report)
          print("RESEARCH_RESULT_FINGERPRINT: VALID")
          print("RESEARCH_STATUS:", report.get("status"))
          print("RUN_FINGERPRINT:", report["run_manifest"]["run_fingerprint"])

          if report.get("status") != "PASSED":
              raise SystemExit(
                  "Research-Gates nicht bestanden: "
                  + json.dumps(report.get("failed_gates", []))
              )
          PY

      - name: Research-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-run-${{ github.run_id }}
          path: |
            research/data_manifest.json
            research/run_manifest.json
            research/checkpoints/latest.json
            reports/*.json
            data/market_data/**/*.csv
          if-no-files-found: error
          retention-days: 30
