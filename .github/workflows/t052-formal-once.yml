name: T052 Authorized Formal Evaluation Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/t052_formal_execute_once.trigger"

permissions:
  contents: write

concurrency:
  group: trading-agent-t052-formal-once
  cancel-in-progress: false

jobs:
  formal:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact authorized revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Safety and authorization guard
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/t052_formal_execute_once.trigger
          test -f research/authorizations/t052_fixed_core_sleeve_performance_2026_09_27.json
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False

          auth = json.loads(Path("research/authorizations/t052_fixed_core_sleeve_performance_2026_09_27.json").read_text(encoding="utf-8"))
          assert auth["trial_id"] == "T-2026-09-27-052"
          assert auth["authorized"] is True
          assert auth["coverage_execution_authorized"] is True
          assert auth["performance_execution_authorized"] is True
          assert auth["fixed_scope"]["sma_50_200"] == "unchanged"
          assert auth["fixed_scope"]["cs_12_1_top2"] == "unchanged"
          for value in (
              auth["governance"]["parameter_search"],
              auth["governance"]["asset_search"],
              auth["governance"]["asset_selection_by_performance"],
              auth["governance"]["threshold_search"],
              auth["governance"]["horizon_search"],
              auth["governance"]["variant_search"],
              auth["governance"]["holdout_used_for_selection"],
              auth["governance"]["research_gate_changes"],
              auth["governance"]["promotion_decision"],
              auth["governance"]["live_execution"],
              auth["governance"]["automatic_promotion"],
          ):
              assert value is False
          assert auth["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
          }

          prereg = json.loads(Path("research/preregistrations/trial_052_fixed_core_sleeve_performance_2026_09_27.json").read_text(encoding="utf-8"))
          assert prereg["trial_id"] == "T-2026-09-27-052"
          assert prereg["status"] == "PREREGISTERED"
          assert prereg["governance"]["holdout_used_for_selection"] is False
          assert prereg["evaluation"]["selection_between_universes"] is False
          assert prereg["evaluation"]["selection_between_sleeves"] is False
          assert prereg["evaluation"]["holdout_selection"] is False
          assert prereg["evaluation"]["ranking_for_promotion"] is False
          print("T052 AUTHORIZATION AND SAFETY OK")
          PY

      - name: Verify master provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          actual="$(git rev-parse origin/master)"
          if [ "$actual" != "${GITHUB_SHA}" ]; then
            changed="$(git diff --name-only "${GITHUB_SHA}" "$actual")"
            bad="$(printf '%s\n' "$changed" | grep -Ev '^(docs/CURRENT_STATUS\.md|research/evidence/current_operational_state\.json)$' || true)"
            if [ -n "$bad" ]; then
              echo "::error::T052 master moved with non-status changes"
              printf '%s\n' "$changed"
              exit 1
            fi
            echo "MASTER_MOVED_STATUS_ONLY"
            printf '%s\n' "$changed"
          fi
          echo "T052_SOURCE_CODE_SHA=${GITHUB_SHA}"

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0 pypdf

      - name: Full CI suite and project governance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python automation/project_integrity_check.py
          python automation/project_state_freshness_check.py
          python automation/agent_usage.py research/evidence/agent_usage_ledger.json

      - name: Canonical coverage T049
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.coverage_preflight             --preregistration research/preregistrations/trial_049_fixed_candidate_batch_coverage_2026_09_27.json             --output-root research/runs/t052_coverage
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/t052_coverage/T-2026-09-27-049/snapshot_manifest.json").read_text(encoding="utf-8"))
          assert d["status"]=="COVERAGE_PASSED"
          assert d["coverage"]["common_calendar_count"]>=3500
          print("T049_COVERAGE_OK", d["snapshot_fingerprint"])
          PY

      - name: Canonical coverage T050
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.coverage_preflight             --preregistration research/preregistrations/trial_050_fixed_candidate_batch_02_coverage_2026_09_27.json             --output-root research/runs/t052_coverage
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/t052_coverage/T-2026-09-27-050/snapshot_manifest.json").read_text(encoding="utf-8"))
          assert d["status"]=="COVERAGE_PASSED"
          assert d["coverage"]["common_calendar_count"]>=3500
          print("T050_COVERAGE_OK", d["snapshot_fingerprint"])
          PY

      - name: Strategy PIT T049
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.strategy_pit_preflight             --universe-root research/runs/t052_coverage/T-2026-09-27-049/datasets             --output research/runs/t052_pit/T-2026-09-27-049/pit_report.json             --universe validation_2026_09_27_fixed_candidate_batch             --trial-id T-2026-09-27-052

      - name: Strategy PIT T050
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.strategy_pit_preflight             --universe-root research/runs/t052_coverage/T-2026-09-27-050/datasets             --output research/runs/t052_pit/T-2026-09-27-050/pit_report.json             --universe validation_2026_09_27_fixed_candidate_batch_02             --trial-id T-2026-09-27-052

      - name: Validate PIT prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for u in T-2026-09-27-049 T-2026-09-27-050; do
            python - <<PY
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/t052_pit/$u/pit_report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PIT_PASSED"
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          PY
          done
          echo "T052_PIT_READY"

      - name: Focused T052 tests
        run: python -m pytest -q tests/test_fixed_core_sleeve_performance.py

      - name: Formal fixed-rule T052 performance
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.fixed_core_sleeve_performance             --preregistration research/preregistrations/trial_052_fixed_core_sleeve_performance_2026_09_27.json             --t049-manifest research/runs/t052_coverage/T-2026-09-27-049/snapshot_manifest.json             --t050-manifest research/runs/t052_coverage/T-2026-09-27-050/snapshot_manifest.json             --output research/runs/t052_performance/t052_result.json

      - name: Render immutable T052 result document
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/runs/t052_performance/t052_result.json").read_text(encoding="utf-8"))
          lines=[
              "# T052 Fixed-Core Sleeve Performance Result","",
              f"- Trial: {r['trial_id']}",
              f"- Code: {r['code_version']}",
              f"- Report fingerprint: {r['report_fingerprint']}",
              "",
              "All four pre-specified universe/sleeve cells are reported.",
              "No selection or ranking between cells was performed.",
              "",
          ]
          for tid,u in r["universes"].items():
              lines += [f"## {tid} — {u['universe']}",""]
              for key,label in (
                  ("trend_sma_50_200","SMA 50/200 inverse-volatility trend"),
                  ("cs_momentum_12_1_top2","12-1 Top-2 cross-sectional momentum"),
              ):
                  c=u[key]
                  base=c["base"]
                  lines += [
                      f"### {label}",
                      f"- Research return: {base['research']['period_return']:.8f}",
                      f"- Research max drawdown: {base['research']['max_drawdown_percent']:.6f}%",
                      f"- Research profit factor: {base['research']['profit_factor']}",
                      f"- Holdout return: {base['holdout']['period_return']:.8f}",
                      f"- Holdout max drawdown: {base['holdout']['max_drawdown_percent']:.6f}%",
                      f"- Holdout profit factor: {base['holdout']['profit_factor']}",
                      f"- Rolling profitable-window ratio: {base['rolling_profitable_window_ratio']:.6f}",
                      f"- Rolling average drawdown: {base['rolling_average_drawdown_percent']:.6f}%",
                      f"- OOS/IS return ratio: {base['oos_to_is_return_ratio']:.6f}",
                      f"- All fixed gates passed: {c['all_gates_passed']}",
                      "",
                  ]
          Path("research/runs/t052_performance/t052_result.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Publish T052 evidence
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m automation.publish_t052_result             --result research/runs/t052_performance/t052_result.json             --ledger research/evidence/trial_ledger.json             --result-doc research/runs/t052_performance/t052_result.md             --checkpoint research/checkpoints/t052_fixed_core_sleeve_performance_2026_09_27.json             --state research/evidence/project_state.json             --decision research/evidence/decision_basis_latest.json

      - name: Commit canonical T052 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge --ff-only origin/master
          cp research/runs/t052_performance/t052_result.md docs/trial_052_fixed_core_sleeve_performance_result_2026_09_27.md
          git add             research/evidence/trial_ledger.json             research/checkpoints/t052_fixed_core_sleeve_performance_2026_09_27.json             research/evidence/project_state.json             research/evidence/decision_basis_latest.json             docs/trial_052_fixed_core_sleeve_performance_result_2026_09_27.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EVIDENCE: record T052 fixed-core sleeve performance"
          git push origin HEAD:master

      - name: Publish T052 execution artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: t052-formal-once-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/t052_coverage/
            research/runs/t052_pit/
            research/runs/t052_performance/
          if-no-files-found: warn
          retention-days: 30
