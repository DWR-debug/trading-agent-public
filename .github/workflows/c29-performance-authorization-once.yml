name: C29 One-Shot Performance Authorization

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/c29_authorize_and_execute_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c29-one-shot-authorization
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'DWR-debug/trading-agent-public'
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorization request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact one-shot authorization request
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/c29_authorize_and_execute_once.trigger
          grep -Fx "AUTHORIZE_C29_PERFORMANCE=true" research/run_requests/c29_authorize_and_execute_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-C29-PERFORMANCE-01" research/run_requests/c29_authorize_and_execute_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/c29_authorize_and_execute_once.trigger
          echo "C29 AUTHORIZATION REQUEST VERIFIED"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('C29 SAFETY INVARIANTS OK')"

      - name: Verify C29 remains design-only before authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          r=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          assert p["trial_id"]=="T-2026-09-30-C29-PERFORMANCE-01"
          assert p["status"]=="PREREGISTERED_DESIGN_ONLY"
          assert p["governance"]["performance_trial_authorized"] is False
          entry=next(x for x in r["active_trials"] if x.get("code")=="C29P1")
          assert entry["state"]=="PERFORMANCE_READY_FOR_AUTHORIZATION"
          assert entry["performance_authorization_allowed"] is False
          print("C29 DESIGN-ONLY GUARD PASSED")
          PY

      - name: Verify immutable C29 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/c29_performance_2026_09_30.json").read_text(encoding="utf-8"))
          f=json.loads(Path("research/evidence/c29r1_input_freeze_result.json").read_text(encoding="utf-8"))
          assert f["status"]=="INPUT_BUNDLE_FROZEN"
          assert f["performance_evaluation"] is False
          assert f["performance_authorized"] is False
          assert f["bundle_fingerprint"]==p["data_contract"]["input_bundle_fingerprint"]
          assert f["source_coverage_fingerprint"]==p["data_contract"]["coverage_fingerprint"]
          assert f["source_snapshot_fingerprint"]==p["data_contract"]["snapshot_fingerprint"]
          assert p["data_contract"]["pit_result_fingerprint"]=="d88c24271fec55186b5e3aad478d91acc7ebe3b6412193724170365f5b6729c6"
          assert p["data_contract"]["repair_discovery_fingerprint"]=="b7541fee48f01105d47ca0e89b05e1c20d14d73c5dad18dc1d2e876a21c4b05d"
          print("C29 IMMUTABLE PREREQUISITES VERIFIED")
          PY

      - name: Re-run C29 contract tests
        run: python -m pytest -q tests/test_c29_performance.py

      - name: Wait for exact Master CI Gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "C29 T052 attempt=$attempt run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "C29_MASTER_CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "::error::C29 T052 Exact Master CI Gate did not complete successfully."
          exit 1

      - name: Build C29 authorization and performance trigger atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prereg_path=Path("research/preregistrations/c29_performance_2026_09_30.json")
          registry_path=Path("research/governance/active_research_registry.json")
          auth_path=Path("research/authorizations/c29_performance_2026_09_30.json")
          trigger_path=Path("research/run_requests/c29_performance_once.trigger")
          prereg=json.loads(prereg_path.read_text(encoding="utf-8"))
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          assert prereg["trial_id"]=="T-2026-09-30-C29-PERFORMANCE-01"
          assert prereg["status"]=="PREREGISTERED_DESIGN_ONLY"
          assert prereg["governance"]["performance_trial_authorized"] is False
          assert prereg["data_contract"]["input_bundle_fingerprint"]=="743b0a14e646009e7ed5503c4068e399caaebc9719ffcd9e88a5ab40465ab4e9"
          entry=next(x for x in registry["active_trials"] if x.get("code")=="C29P1")
          assert entry["trial_id"]==prereg["trial_id"]
          assert entry["performance_authorization_allowed"] is False
          prereg["status"]="PREREGISTERED_PERFORMANCE"
          prereg["governance"]["performance_trial_authorized"]=True
          prereg["authorization"]={
            "current_status":"AUTHORIZED_ONE_SHOT",
            "performance_trial_authorized":True,
            "authorization_id":"AUTH-C29-2026-09-30-01",
            "master_ci_run_id":int(os.environ["C29_MASTER_CI_RUN_ID"])
          }
          prereg_fp=hashlib.sha256(json.dumps(prereg,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          auth={
            "schema_version":"1.0",
            "authorization_id":"AUTH-C29-2026-09-30-01",
            "trial_id":prereg["trial_id"],
            "authorized":True,
            "performance_execution_authorized":True,
            "one_shot":True,
            "preregistration_fingerprint":prereg_fp,
            "input_bundle_fingerprint":prereg["data_contract"]["input_bundle_fingerprint"],
            "coverage_fingerprint":prereg["data_contract"]["coverage_fingerprint"],
            "pit_result_fingerprint":prereg["data_contract"]["pit_result_fingerprint"],
            "authorization_basis":{
              "master_ci_run_id":int(os.environ["C29_MASTER_CI_RUN_ID"]),
              "requested_by_user":True,
              "selection_used":False,
              "holdout_used_for_selection":False
            },
            "parameter_search":False,
            "threshold_search":False,
            "asset_search":False,
            "horizon_search":False,
            "variant_search":False,
            "family_ranking":False,
            "promotion_decision":False,
            "safety":{
              "paper_only":True,
              "live_trading_enabled":False,
              "orders_enabled":False,
              "automatic_promotion":False
            }
          }
          entry["performance_authorization_allowed"]=True
          entry["state"]="PERFORMANCE_AUTHORIZED"
          entry["authorization_id"]=auth["authorization_id"]
          prereg_path.write_text(json.dumps(prereg,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          auth_path.parent.mkdir(parents=True,exist_ok=True)
          auth_path.write_text(json.dumps(auth,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          registry_path.write_text(json.dumps(registry,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          trigger_path.write_text("RUN_C29_PERFORMANCE_ONCE=true\nTRIAL_ID=T-2026-09-30-C29-PERFORMANCE-01\nONE_SHOT=true\n",encoding="utf-8")
          print("C29 AUTHORIZATION PREPARED")
          print("C29_PREREGISTRATION_FINGERPRINT="+prereg_fp)
          PY
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/preregistrations/c29_performance_2026_09_30.json=research/preregistrations/c29_performance_2026_09_30.json             --file research/authorizations/c29_performance_2026_09_30.json=research/authorizations/c29_performance_2026_09_30.json             --file research/governance/active_research_registry.json=research/governance/active_research_registry.json             --file research/run_requests/c29_performance_once.trigger=research/run_requests/c29_performance_once.trigger

      - name: Upload authorization receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/authorizations/c29_performance_2026_09_30.json
          if-no-files-found: warn
          retention-days: 30
