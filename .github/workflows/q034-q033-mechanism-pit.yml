name: Q034 Q033 Mechanism PIT Preflight

on:
  push:
    branches:
      - master
    paths:
      - research/preregistrations/q034_q033_mechanism_pit_2026_09_27.json
      - research/authorizations/q034_q033_mechanism_pit_2026_09_27.json
      - research/preregistrations/q033_t052_risk_stability_parameter_freeze_2026_09_27.json
      - portfolio/q030_risk_mechanisms.py
      - automation/q034_mechanism_pit_preflight.py
      - automation/coverage_preflight.py
      - automation/candidate_validation_50_50_vol_budget.py
      - automation/cross_asset_trend_replication.py
      - research/asset_universes.py
      - tests/test_q034_mechanism_pit.py
      - .github/workflows/q034-q033-mechanism-pit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trading-agent-q034-mechanism-pit
  cancel-in-progress: false

jobs:
  pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0

      - name: Safety and preregistration guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q034_q033_mechanism_pit_2026_09_27.json").read_text())
          auth=json.loads(Path("research/authorizations/q034_q033_mechanism_pit_2026_09_27.json").read_text())
          design=json.loads(Path("research/preregistrations/q033_t052_risk_stability_parameter_freeze_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True
          assert auth["execution_scope"] == "MECHANISM_PIT_ONLY"
          assert auth["performance_execution_authorized"] is False
          assert spec["governance"]["performance_trial_authorized"] is False
          assert spec["governance"]["performance_evaluation"] is False
          assert spec["governance"]["holdout_evaluation"] is False
          assert design["status"] == "COMPLETED_DESIGN_ONLY"
          assert design["governance"]["parameter_search"] is False
          print("Q034 SAFETY/AUTH/DESIGN OK")
          PY

      - name: Coverage preflight Q031 universe
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q031_q030_risk_stability_coverage_2026_09_27.json --output-root research/runs/q034_coverage

      - name: Mechanism PIT preflight
        run: python -m automation.q034_mechanism_pit_preflight --universe-root research/runs/q034_coverage/T-2026-09-27-053-COVERAGE/datasets --output research/runs/q034_pit/T-2026-09-27-055/mechanism_pit_report.json

      - name: Focused tests
        run: python -m pytest -q tests/test_q034_mechanism_pit.py

      - name: Validate mechanism PIT governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q034_pit/T-2026-09-27-055/mechanism_pit_report.json").read_text())
          assert d["status"]=="PIT_PASSED"
          assert d["checked_decision_points"] >= 20
          assert d["performance_evaluation"] is False
          assert d["selection_used"] is False
          assert d["governance"]["performance_trial_authorized"] is False
          assert d["safety"]=={"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          print("Q034 MECHANISM PIT GOVERNANCE PASS")
          PY

      - name: Publish Q034 run summary
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request
          root=Path("research/runs/q034_pit")
          files=sorted(root.rglob("mechanism_pit_report.json")) if root.exists() else []
          summary={"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"job_status":os.environ["JOB_STATUS"]}
          if files:
              d=json.loads(files[-1].read_text())
              summary.update({"trial_id":d.get("trial_id"),"status":d.get("status"),"report_fingerprint":d.get("report_fingerprint"),"performance_evaluation":d.get("performance_evaluation"),"selection_used":d.get("selection_used"),"safety":d.get("safety")})
          body="Q034 run summary\n\n"+"\n".join(f"- {k}: {v}" for k,v in summary.items())
          payload=json.dumps({"body":body}).encode()
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/343/comments"
          req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              response.read()
          print("Q034 RUN SUMMARY PUBLISHED")

      - name: Publish mechanism PIT evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q034-q033-mechanism-pit-${{ github.run_id }}
          path: |
            research/runs/q034_coverage/
            research/runs/q034_pit/
          if-no-files-found: error
          retention-days: 30
