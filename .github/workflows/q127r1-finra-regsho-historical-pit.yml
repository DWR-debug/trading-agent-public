name: Q127-R1 FINRA Reg-SHO Historical PIT Feasibility

on:
  schedule:
    - cron: "50 */12 * * *"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "automation/q127r1_finra_regsho_historical_pit.py"
      - "tests/test_q127r1_finra_regsho_historical_pit.py"
      - "research/preregistrations/q127r1_finra_regsho_historical_pit_2026_10_03.json"
      - ".github/workflows/q127r1-finra-regsho-historical-pit.yml"
  push:
    branches: [master]
    paths:
      - "automation/q127r1_finra_regsho_historical_pit.py"
      - "tests/test_q127r1_finra_regsho_historical_pit.py"
      - "research/preregistrations/q127r1_finra_regsho_historical_pit_2026_10_03.json"
      - ".github/workflows/q127r1-finra-regsho-historical-pit.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q127r1-finra-regsho-historical-pit
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q127r1_finra_regsho_historical_pit.py
      - name: Run historical source/PIT probe
        run: python -m automation.q127r1_finra_regsho_historical_pit --output research/runs/q127r1_finra_regsho_historical_pit/result.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q127r1_finra_regsho_historical_pit/result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q127R1_SOURCE_PIT_FEASIBILITY_COMPLETED"
          assert p["pit"]["revision_lineage_established"] is False
          assert p["pit"]["same_day_pit_safe"] is False
          assert p["pit"]["formal_security_identity_established"] is False
          for key in ("performance","holdout","ranking","selection","parameter_search","threshold_search","horizon_search","asset_search","variant_search","promotion","live_execution"):
              assert p["scientific_boundary"][key] is False
          assert p["safety"]["paper_only"] is True
          print("Q127R1_BOUNDARY=PASS")
          print("Q127R1_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload source/PIT receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q127r1-finra-regsho-historical-pit-${{ github.run_id }}
          path: research/runs/q127r1_finra_regsho_historical_pit/result.json
          if-no-files-found: error
          retention-days: 30
