name: Q035 T052 Risk Stability Performance

on:
  push:
    branches:
      - master
    paths:
      - research/preregistrations/q035_t052_risk_stability_performance_2026_09_27.json
      - research/authorizations/q035_t052_risk_stability_performance_2026_09_27.json
      - research/preregistrations/q033_t052_risk_stability_parameter_freeze_2026_09_27.json
      - automation/q035_risk_stability_performance.py
      - portfolio/q030_risk_mechanisms.py
      - automation/coverage_preflight.py
      - automation/strategy_pit_preflight.py
      - automation/q034_mechanism_pit_preflight.py
      - automation/candidate_validation_50_50_vol_budget.py
      - automation/cross_asset_trend_replication.py
      - data/canonical_snapshot.py
      - execution/cost_contract.py
      - tests/test_q035_risk_stability_performance.py
      - .github/workflows/q035-t052-risk-stability-performance.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: trading-agent-q035-risk-stability-performance
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0

      - name: Safety and performance authorization guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          spec=json.loads(Path("research/preregistrations/q035_t052_risk_stability_performance_2026_09_27.json").read_text())
          auth=json.loads(Path("research/authorizations/q035_t052_risk_stability_performance_2026_09_27.json").read_text())
          design=json.loads(Path("research/preregistrations/q033_t052_risk_stability_parameter_freeze_2026_09_27.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert auth["authorized"] is True
          assert auth["execution_scope"] == "FIXED_MULTI_ARM_RESEARCH_PERFORMANCE_ONLY"
          assert auth["performance_execution_authorized"] is True
          assert spec["governance"]["performance_evaluation"] is True
          assert spec["governance"]["holdout_used_for_selection"] is False
          assert spec["governance"]["parameter_search"] is False
          assert spec["governance"]["asset_search"] is False
          assert design["status"] == "COMPLETED_DESIGN_ONLY"
          print("Q035 SAFETY/AUTH/DESIGN OK")
          PY

      - name: Fresh coverage preflight
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/q031_q030_risk_stability_coverage_2026_09_27.json --output-root research/runs/q035_coverage

      - name: Core PIT preflight on fresh Q035 coverage
        run: python -m automation.strategy_pit_preflight --universe-root research/runs/q035_coverage/T-2026-09-27-053-COVERAGE/datasets --output research/runs/q035_pit/T-2026-09-27-056/core_pit_report.json --universe validation_2026_09_27_q030_risk_stability_coverage --trial-id T-2026-09-27-056 --expected-assets 7

      - name: Mechanism PIT preflight on fresh Q035 coverage
        run: python -m automation.q034_mechanism_pit_preflight --universe-root research/runs/q035_coverage/T-2026-09-27-053-COVERAGE/datasets --output research/runs/q035_pit/T-2026-09-27-056/mechanism_pit_report.json

      - name: PIT and governance hard gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          core=json.loads(Path("research/runs/q035_pit/T-2026-09-27-056/core_pit_report.json").read_text())
          mech=json.loads(Path("research/runs/q035_pit/T-2026-09-27-056/mechanism_pit_report.json").read_text())
          assert core["status"] == "PIT_PASSED"
          assert mech["status"] == "PIT_PASSED"
          print("Q035 CORE+MECHANISM PIT PASS")
          PY

      - name: Execute T056 performance
        run: python -m automation.q035_risk_stability_performance --preregistration research/preregistrations/q035_t052_risk_stability_performance_2026_09_27.json --coverage-root research/runs/q035_coverage --output research/runs/q035_performance/T-2026-09-27-056/performance_report.json

      - name: Validate performance governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/q035_performance/T-2026-09-27-056/performance_report.json").read_text())
          assert d["trial_id"] == "T-2026-09-27-056"
          assert d["performance_evaluation"] is True
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["family_ranking"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["safety"] == {"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          assert set(d["arms"]) == {"CONTROL","RISK-A","RISK-B","RISK-C","RISK-D"}
          print("Q035 PERFORMANCE GOVERNANCE PASS")
          print("REPORT_FINGERPRINT:",d["report_fingerprint"])
          PY

      - name: Publish Q035 run summary
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          import urllib.request
          root=Path("research/runs/q035_performance")
          files=sorted(root.rglob("performance_report.json")) if root.exists() else []
          summary={"run_id":os.environ["GITHUB_RUN_ID"],"head_sha":os.environ["GITHUB_SHA"],"job_status":os.environ["JOB_STATUS"]}
          if files:
              d=json.loads(files[-1].read_text())
              summary.update({"trial_id":d.get("trial_id"),"status":d.get("status"),"report_fingerprint":d.get("report_fingerprint"),"arms":list(d.get("arms",{})),"selection_used":d.get("selection_used"),"holdout_used_for_selection":d.get("holdout_used_for_selection"),"safety":d.get("safety")})
          body="Q035 run summary\n\n"+"\n".join(f"- {k}: {v}" for k,v in summary.items())
          payload=json.dumps({"body":body}).encode()
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues/343/comments"
          req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response: response.read()
          print("Q035 RUN SUMMARY PUBLISHED")

      - name: Publish Q035 evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q035-t052-risk-stability-performance-${{ github.run_id }}
          path: |
            research/runs/q035_coverage/
            research/runs/q035_pit/
            research/runs/q035_performance/
          if-no-files-found: error
          retention-days: 30
