name: Groq API Key Smoke Test

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/groq-api-key-smoke-test.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-groq-api-key-smoke
  cancel-in-progress: true

jobs:
  key_smoke:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Probe authenticated Groq models endpoint
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo "GROQ_API_KEY_MISSING"; exit 2; }
          response="$(curl -sS --fail-with-body --retry 3 --connect-timeout 15 --max-time 30             -H "Authorization: Bearer ${GROQ_API_KEY}"             -H "Content-Type: application/json"             "https://api.groq.com/openai/v1/models")"
          python - <<'PY' "$response"
          import json, sys
          d=json.loads(sys.argv[1])
          items=d.get("data")
          assert isinstance(items,list) and items, "Groq models response has no model list"
          ids={x.get("id") for x in items if isinstance(x,dict)}
          assert "openai/gpt-oss-20b" in ids, "fixed Groq model is not visible"
          print("GROQ_API_KEY_SMOKE=PASS")
          print("FIXED_MODEL_VISIBLE=PASS")
          PY

      - name: Persist non-sensitive smoke receipt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || exit 2
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          d={
            "schema_version":1,
            "generated_at_utc":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
            "provider":"groq",
            "endpoint":"https://api.groq.com/openai/v1/models",
            "api_key_present":True,
            "authenticated_models_endpoint":"PASS",
            "inference_called":False,
            "fixed_model":"openai/gpt-oss-20b",
            "fixed_model_visible":True,
            "paid_usage_authorized":False,
            "scientific_evidence_created":False,
            "performance_authorized":False
          }
          json.dump(d,open("research/evidence/groq_api_key_smoke_test.json","w",encoding="utf-8"),indent=2)
          with open("research/evidence/groq_api_key_smoke_test.json","a",encoding="utf-8") as f: f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git checkout -B groq-smoke-receipt origin/master
            git add research/evidence/groq_api_key_smoke_test.json
            if git diff --cached --quiet; then
              echo "Receipt already present on current master."
              exit 0
            fi
            git commit -m "OPS: record Groq API key smoke test"
            if git push origin HEAD:master; then
              exit 0
            fi
            git reset --hard origin/master
            sleep "$attempt"
          done
          echo "Could not persist Groq smoke receipt after 5 CAS-style push attempts."
          exit 1
