name: Q072 Candidate Bank Contract

on:
  push:
    branches:
      - research/q072-information-candidate-bank-20260928
    paths:
      - "research/exploration/q072_information_candidate_bank_2026_09_28.json"
      - "docs/research_design/Q072-information-source-candidate-bank-2026-09-28.md"
      - "tests/test_q072_information_source_candidate_bank.py"
      - ".github/workflows/q072-candidate-bank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_q072_information_source_candidate_bank.py
