name: Micro Trading 15m Sidecar — 2026-09-23 — Public

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/microtrading_15m_sidecar_2026_09_23.py"
      - "tests/test_microtrading_15m_sidecar_2026_09_23.py"
      - ".github/workflows/microtrading-15m-sidecar-2026-09-23.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/microtrading_15m_sidecar_2026_09_23.py"
      - "tests/test_microtrading_15m_sidecar_2026_09_23.py"
      - ".github/workflows/microtrading-15m-sidecar-2026-09-23.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-public-microtrading-sidecar-15m
  cancel-in-progress: true

jobs:
  micro_sidecar:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Micro Sidecar ausführen
        run: |
          set -euo pipefail
          python -m automation.microtrading_15m_sidecar_2026_09_23             --data-dir data/micro_market_data             --output research/microtrading_15m_sidecar_2026_09_23.json
      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("research/microtrading_15m_sidecar_2026_09_23.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          stored = result.pop("result_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["interval"] == "15m"
          assert result["scope"]["target_count_per_asset"] == 100000
          assert result["scope"]["research_ratio"] == 0.8
          assert result["hypotheses"]["selection_between_hypotheses"] is False
          assert result["hypotheses"]["parameter_search"] is False
          assert result["interpretation_limits"]["separate_from_daily_etf_candidate"] is True
          assert result["interpretation_limits"]["not_a_production_candidate"] is True
          assert result["interpretation_limits"]["not_an_hft_latency_strategy"] is True
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }

          print("MICRO_SIDECAR_INTEGRITY_OK")
          print("RESULT_FINGERPRINT:", stored)
          PY
      - name: Micro-Sidecar-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microtrading-15m-sidecar-2026-09-23-${{ github.run_id }}
          path: |
            research/microtrading_15m_sidecar_2026_09_23.json
            data/micro_market_data/
          if-no-files-found: error
          retention-days: 30
