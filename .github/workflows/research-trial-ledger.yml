name: Research Trial Ledger Contract

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "research/trial_ledger.py"
      - "research/evidence/trial_ledger.json"
      - "tests/test_trial_ledger.py"
      - "docs/TRIAL_LEDGER.md"
      - ".github/workflows/research-trial-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-research-trial-ledger
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Ledger-Tests ausführen
        run: python -m pytest -q tests/test_trial_ledger.py
      - name: Ledger fail-closed validieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from research.trial_ledger import load_ledger, summarize_trial_families

          ledger = load_ledger(
              Path("research/evidence/trial_ledger.json")
          )
          families = summarize_trial_families(ledger)
          assert ledger["schema_version"] == 1
          assert ledger["policy"]["immutable_history"] is True
          assert ledger["policy"]["unknown_values_are_null"] is True
          assert ledger["policy"]["independent_trial_count_must_be_explicit"] is True
          assert ledger["policy"]["pbo_dsr_do_not_override_existing_gates"] is True
          assert all(
              record["statistical_evidence"]["ready"] is False
              for record in ledger["trials"]
          )
          assert "risk-layer-2026-09" in families
          print("TRIAL_LEDGER_CONTRACT_OK")
          print("TRIAL_COUNT:", len(ledger["trials"]))
          print("FAMILY_COUNT:", len(families))
          PY
      - name: Paper-only-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
