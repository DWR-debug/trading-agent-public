name: Q230 Windows TRACE Connectivity

on:
  push:
    branches: [master]
    paths:
      - "research/candidates/orthogonal_candidate_specs_2026-10-05.json"
      - ".github/workflows/q230-windows-trace-connectivity.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-q230-windows-trace-connectivity
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research, trading-agent-long]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Probe official FINRA TRACE routes from Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force research/runs/q230_windows_trace_connectivity | Out-Null
          $urls = @(
            "https://www.finra.org/filing-reporting/trace",
            "https://www.finra.org/filing-reporting/trace/instructions-ftp-downloading-issue-master-participant-list-dail",
            "https://download.finratraqs.org/DownloadHandler.ashx?action=DOWNLOAD&file=CAMASTER&facility=TRACE"
          )
          $rows = @()
          foreach ($u in $urls) {
            $row = [ordered]@{url=$u;status=$null;ok=$false;bytes=$null;sha256=$null;error=$null}
            try {
              $resp = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 45 -MaximumRedirection 5
              $bytes = [System.Text.Encoding]::UTF8.GetBytes([string]$resp.Content)
              $sha = [System.Security.Cryptography.SHA256]::Create()
              $hex = ([System.BitConverter]::ToString($sha.ComputeHash($bytes))).Replace("-","").ToLowerInvariant()
              $row.status = [int]$resp.StatusCode
              $row.ok = $true
              $row.bytes = $bytes.Length
              $row.sha256 = $hex
            } catch {
              $row.error = $_.Exception.Message
            }
            $rows += [pscustomobject]$row
          }
          $payload = [ordered]@{
            schema_version="1.0"
            task_id="Q-2026-10-05-Q230-WINDOWS-TRACE-CONNECTIVITY"
            generated_at_utc=[DateTime]::UtcNow.ToString("o")
            status="CONNECTIVITY_ONLY"
            scientific_boundary=@{performance=$false;holdout_selection=$false;ranking=$false;tuning=$false;promotion=$false;live_execution=$false}
            results=$rows
            next_gate="free_TRACE_historical_panel_and_security_master_issuer_mapping"
          }
          $json=$payload | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText("research/runs/q230_windows_trace_connectivity/connectivity.json",$json,[Text.UTF8Encoding]::new($false))
          Get-Content research/runs/q230_windows_trace_connectivity/connectivity.json

      - name: Upload connectivity receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q230-windows-trace-connectivity-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q230_windows_trace_connectivity/connectivity.json
          if-no-files-found: error
          retention-days: 30
