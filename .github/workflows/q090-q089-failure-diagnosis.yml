name: Q090 Q089 Failure Mechanism Diagnosis

on:
  push:
    branches:
      - research/q090-q089-failure-diagnosis
    paths:
      - "research/preregistrations/q090_q089_failure_mechanism_diagnosis_2026_09_29.json"
      - "automation/q090_q089_failure_diagnosis.py"
      - "tests/test_q090_q089_failure_diagnosis.py"
      - ".github/workflows/q090-q089-failure-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q090-q089-failure-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Safety and governance guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from config import settings
          from pathlib import Path
          p = json.loads(Path("research/preregistrations/q090_q089_failure_mechanism_diagnosis_2026_09_29.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert p["status"] == "PREREGISTERED_DIAGNOSTIC_ONLY"
          assert p["governance"]["diagnostic_evaluation"] is True
          assert p["governance"]["new_performance_evaluation"] is False
          assert p["governance"]["selection"] is False
          assert p["governance"]["holdout_used_for_selection"] is False
          assert p["data_scope"]["no_new_market_data"] is True
          print("Q090 SAFETY/GOVERNANCE OK")
          PY

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q090_q089_failure_diagnosis.py

      - name: Verify exact Q089 source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum automation/q089_performance.py | cut -d" " -f1)" = "0546bebae018acb0b530f094462b3c9cd79d96aba7ed66c8b17dc720ab13057b"
          test "$(sha256sum automation/q069_candidate_bank.py | cut -d" " -f1)" = "84e008a6152cbea128e5e5f2ac0dfdde0b0172310fe4c510241c60edfd3ff617"

      - name: Execute fixed-result Q090 diagnosis
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m automation.q090_q089_failure_diagnosis             --repo-root .             --output research/evidence/q090_q089_failure_diagnosis_result.json             --markdown research/runs/q090_q089_failure_diagnosis/T-2026-09-29-090/q090_report.md

      - name: Validate exact reconstruction and governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/evidence/q090_q089_failure_diagnosis_result.json")
          d = json.loads(p.read_text())
          assert d["status"] == "COMPLETED_DIAGNOSTIC_ONLY"
          assert d["reconstruction"]["aggregate_reconstruction_exact"] is True
          assert d["reconstruction"]["no_new_market_data"] is True
          assert d["reconstruction"]["no_new_performance_trial"] is True
          assert d["governance"]["new_performance_evaluation"] is False
          assert d["governance"]["selection"] is False
          assert d["governance"]["holdout_used_for_selection"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["safety"]["paper_only"] is True
          print("Q090 RECONSTRUCTION/GOVERNANCE PASS")
          print("Q090_DIAGNOSTIC_FINGERPRINT:", d["diagnostic_fingerprint"])
          PY

      - name: Update trial ledger locally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          ledger_path = Path("research/evidence/trial_ledger.json")
          data = json.loads(ledger_path.read_text())
          key = "entries" if "entries" in data else "trials"
          entries = data.get(key, [])
          if any(x.get("trial_id") == "T-2026-09-29-090" for x in entries):
              raise SystemExit("Q090 ledger entry already exists")
          q = json.loads(Path("research/evidence/q090_q089_failure_diagnosis_result.json").read_text())
          entries.append({
              "trial_id": "T-2026-09-29-090",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "status": "diagnostic_completed_only",
              "research_family": "q090_q089_failure_mechanism_diagnosis",
              "parent_trial_id": "T-2026-09-28-089-PERFORMANCE",
              "parent_report_fingerprint": q["source"]["parent_report_fingerprint"],
              "diagnostic_fingerprint": q["diagnostic_fingerprint"],
              "reconstruction_exact": q["reconstruction"]["aggregate_reconstruction_exact"],
              "no_new_market_data": True,
              "selection": {"selected": False, "holdout_used_for_selection": False},
              "governance": q["governance"],
              "safety": q["safety"]
          })
          data[key] = entries
          ledger_path.write_text(json.dumps(data, indent=2, ensure_ascii=False, allow_nan=False) + "\n")
          PY

      - name: Publish canonical Q090 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(python -c 'import json,os,urllib.request; u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"; req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}); print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])')
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q090_q089_failure_diagnosis_result.json=research/evidence/q090_q089_failure_diagnosis_result.json             --file research/runs/q090_q089_failure_diagnosis/T-2026-09-29-090/q090_report.md=research/runs/q090_q089_failure_diagnosis/T-2026-09-29-090/q090_report.md             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json

      - name: Upload Q090 diagnostic pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q090-q089-failure-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q090_q089_failure_diagnosis_result.json
            research/runs/q090_q089_failure_diagnosis/T-2026-09-29-090/q090_report.md
          if-no-files-found: warn
          retention-days: 30
