name: Convergence Volatility Budget Control

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/convergence_volatility_budget_control.py"
      - "tests/test_convergence_volatility_budget_control.py"
      - ".github/workflows/convergence-volatility-budget-control.yml"
      - "automation/cross_asset_trend_replication.py"
      - "automation/cross_sectional_momentum_replication.py"
      - "automation/prepare_research_data.py"
      - "research/asset_universes.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-convergence-volatility-budget-control
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Cross-Asset-Trenddaten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe cross_asset_trend             --output research/convergence_vol_budget/trend_manifest.json

      - name: Cross-Sectional-Momentumdaten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 1300             --universe liquid_high_volatility             --output research/convergence_vol_budget/cs_manifest.json

      - name: Datenmanifeste verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          trend = json.loads(
              Path("research/convergence_vol_budget/trend_manifest.json")
              .read_text(encoding="utf-8")
          )
          cs = json.loads(
              Path("research/convergence_vol_budget/cs_manifest.json")
              .read_text(encoding="utf-8")
          )

          assert trend["universe"] == "cross_asset_trend"
          assert trend["target_count"] == 3500
          assert len(trend["datasets"]) == 8

          assert cs["universe"] == "liquid_high_volatility"
          assert cs["target_count"] == 1300
          assert len(cs["datasets"]) == 5

          assert trend["safety"]["paper_only"] is True
          assert trend["safety"]["live_trading_enabled"] is False
          assert cs["safety"]["paper_only"] is True
          assert cs["safety"]["live_trading_enabled"] is False

          print("VOL BUDGET MANIFESTS VERIFIED")
          print("TREND_MANIFEST:", trend["manifest_fingerprint"])
          print("CS_MANIFEST:", cs["manifest_fingerprint"])
          PY

      - name: Volatilitätsbudget-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.convergence_volatility_budget_control             --trend-data-dir data/market_data             --trend-manifest research/convergence_vol_budget/trend_manifest.json             --cs-data-dir data/market_data             --cs-manifest research/convergence_vol_budget/cs_manifest.json             --output research/convergence_vol_budget/report.json

      - name: Ergebnis-Fingerprint prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/convergence_vol_budget/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["methodology"]["signals_unchanged"] is True
          assert report["methodology"]["sleeve_weights_unchanged"] is True
          assert report["methodology"]["execution_unchanged"] is True
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["holdout_is_blind_to_selection"] is True

          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Vol-Budget-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-vol-budget-control-${{ github.run_id }}
          path: |
            research/convergence_vol_budget/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
