name: Q169 NOAA SWPC PIT Independent Reproduction R4

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q169_noaa_swpc_archive_pit_reproduction.py"
      - "tests/test_q169_noaa_swpc_archive_pit_reproduction.py"
      - "research/preregistrations/q169_noaa_swpc_archive_pit_r4_2026_10_04.json"
      - ".github/workflows/q169-noaa-swpc-pit-independent-reproduction.yml"

permissions:
  contents: write

concurrency:
  group: q169-noaa-swpc-pit-independent-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_q169_noaa_swpc_archive_pit_reproduction.py
      - name: Run R4 reproduction
        run: |
          set -euo pipefail
          mkdir -p research/runs/q169_noaa_swpc_pit_reproduction
          python -m automation.q169_noaa_swpc_archive_pit_reproduction             --output "research/runs/q169_noaa_swpc_pit_reproduction/${GITHUB_RUN_ID}.json"
      - name: Validate R4 boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("research/runs/q169_noaa_swpc_pit_reproduction")/f"{os.environ['GITHUB_RUN_ID']}.json"
          d=json.loads(p.read_text())
          assert d["status"]=="Q169_R4_INDEPENDENT_REPRODUCTION_COMPLETED"
          assert d["reproduction_boundary"]["independent_parser"] is True
          assert d["reproduction_boundary"]["r3_parsing_functions_reused"] is False
          assert d["reproduction_boundary"]["all_fixed_samples_reproduced"] is True
          assert d["reproduction_boundary"]["candidate_pit_validated"] is False
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          assert all(d["mutation_checks"].values())
          print("Q169_R4_INDEPENDENT_REPRODUCTION_OK")
          PY
      - name: Persist R4 receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: persist Q169 R4 independent reproduction receipt"
        run: |
          set -euo pipefail
          input="research/runs/q169_noaa_swpc_pit_reproduction/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q169_noaa_swpc_archive_pit_r4_latest.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py               --repository "${GITHUB_REPOSITORY}"               --branch master               --base-sha "${base_sha}"               --file "${latest}=${input}"; then
              exit 0
            fi
            sleep "${attempt}"
          done
          exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q169-noaa-swpc-pit-r4-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q169_noaa-swpc_pit_reproduction/
          if-no-files-found: error
          retention-days: 30
