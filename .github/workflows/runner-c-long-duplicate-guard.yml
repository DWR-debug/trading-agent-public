name: Runner C Long Duplicate Guard

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/windows-runner-c-long-research.yml"
      - ".github/workflows/runner-c-prepit-falsification.yml"
      - "research/governance/runner_c_overnight_plan_2026-10-04.json"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  deduplicate:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale duplicate C workpacks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in windows-runner-c-long-research.yml runner-c-prepit-falsification.yml
          do
            runs="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=20" --jq '[.workflow_runs[] | select(.status != "completed")] | sort_by(.created_at) | reverse')"
            keep="$(printf '%s' "$runs" | jq -r '.[0].id // empty')"
            if [ -n "$keep" ]; then
              echo "KEEP workflow=$workflow run=$keep"
            fi
            printf '%s' "$runs" | jq -r '.[1:][]?.id' | while read -r id; do
              [ -n "$id" ] || continue
              echo "CANCEL_DUPLICATE workflow=$workflow run=$id keep=$keep"
              gh api --method POST "/repos/${REPO}/actions/runs/${id}/cancel" >/dev/null || true
            done
          done
