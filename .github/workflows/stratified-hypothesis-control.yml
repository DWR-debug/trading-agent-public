name: Stratified Hypothesis Control

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MATRIX_SOURCE_RUN_ID: "35762937300"
  MATRIX_SOURCE_FINGERPRINT: "9aa88bf691bfcfc94b5e4de5cbabae950a606af1d7a80645e61b3ab8be960f2f"

jobs:
  pull_request_verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Hypothesen-Control-Regressionstests
        run: python -m pytest -q tests/test_stratified_hypothesis_control.py
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

  analyze:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: python -m pip install pytest
      - name: Hypothesen-Control-Regressionstests
        run: python -m pytest -q tests/test_stratified_hypothesis_control.py
      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: Matrix-Quellartefakt laden
        uses: actions/download-artifact@v5
        with:
          name: regime-parameter-failure-matrix
          path: source_matrix
          run-id: ${{ env.MATRIX_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Matrix-Quellartefakt verifizieren
        run: |
          set -euo pipefail
          test -f source_matrix/regime_parameter_failure_matrix.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(
              Path("source_matrix/regime_parameter_failure_matrix.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["analysis_fingerprint"] == os.environ["MATRIX_SOURCE_FINGERPRINT"]
          assert report["diagnostic_type"] == "rolling_regime_parameter_failure_matrix"
          assert report["source_universe"] == "benchmark"
          assert report["source_target_count"] == 5000
          assert report["source_research_candle_count"] == 4500
          assert report["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          print("SOURCE_MATRIX VERIFIED:", report["analysis_fingerprint"])
          PY
      - name: Streng geschichtete Hypothesenanalyse
        run: |
          set -euo pipefail
          python -m automation.stratified_hypothesis_control \
            --input-json source_matrix/regime_parameter_failure_matrix.json \
            --output-dir research/stratified_hypothesis
      - name: Analyse-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: stratified-hypothesis-control
          path: research/stratified_hypothesis/
          if-no-files-found: error
          retention-days: 30
