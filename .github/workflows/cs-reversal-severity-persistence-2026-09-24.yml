name: CS Reversal Severity Persistence 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/cs_reversal_severity_persistence_2026_09_24.py"
      - "tests/test_cs_reversal_severity_persistence_2026_09_24.py"
      - "docs/cs_reversal_severity_persistence_2026_09_24_preregistration.md"
      - ".github/workflows/cs-reversal-severity-persistence-2026-09-24.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-cs-reversal-severity-persistence-2026-09-24
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Vier immutable Validierungsartefakte laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/cs_reversal_sources
          declare -A artifacts=(
            [10751817990]=candidate-validation-50-50-vol-budget-2026-09-23.zip
            [10740188093]=second-validation-2026-09-23.zip
            [10745697729]=third-validation-2026-09-23.zip
            [10753545703]=fourth-independent-validation-2026-09-23.zip
          )
          for artifact_id in "${!artifacts[@]}"; do
            file="/tmp/${artifacts[$artifact_id]}"
            gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               > "$file"
            unzip -q "$file" -d /tmp/cs_reversal_sources
          done
          test -f /tmp/cs_reversal_sources/research/candidate_validation/report.json
          test -f /tmp/cs_reversal_sources/research/independent_validation_2026_09_23/report.json
          test -f /tmp/cs_reversal_sources/research/third_independent_validation_2026_09_23/report.json
          test -f /tmp/cs_reversal_sources/research/fourth_independent_validation_2026_09_23/report.json
          echo "IMMUTABLE_VALIDATION_ARTIFACTS_READY"

      - name: Präregistrierung fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.cs_reversal_severity_persistence_2026_09_24 import (
              CASES,
              CS_REBALANCE_SESSIONS,
              RESEARCH_COUNT,
          )
          assert len(CASES) == 4
          assert RESEARCH_COUNT == 2798
          assert CS_REBALANCE_SESSIONS == 21
          assert [case["artifact_id"] for case in CASES] == [
              10751817990,
              10740188093,
              10745697729,
              10753545703,
          ]
          text = Path(
              "docs/cs_reversal_severity_persistence_2026_09_24_preregistration.md"
          ).read_text(encoding="utf-8")
          for token in (
              "Cross-Sectional-Winner-Reversal",
              "21-Session",
              "schlechtesten 5%",
              ">=3/4",
              "Holdout",
              "PAPER_ONLY=True",
          ):
              assert token in text
          print("PREREGISTRATION_VERIFIED")
          PY

      - name: CS-Reversal-Schweregrad-/Persistenz-Diagnose ausführen
        run: |
          set -euo pipefail
          python -m automation.cs_reversal_severity_persistence_2026_09_24             --source-root /tmp/cs_reversal_sources             --output research/cs_reversal_severity_persistence_2026_09_24/report.json

      - name: Ergebnisintegrität und Research-only-Scope prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/cs_reversal_severity_persistence_2026_09_24/report.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"] == {
              "datasets": 4,
              "research_return_count_per_dataset": 2798,
              "holdout_used_for_decision": False,
              "holdout_metrics_reported": False,
              "new_data_downloads": False,
              "parameter_search": False,
              "asset_selection": False,
              "strategy_mutation": False,
              "gate_changes": False,
              "production_mutation": False,
          }
          assert len(result["cases"]) == 4
          assert len(
              result["cases"]["validation_1"]["analysis"]["rebalance_phase"]
          ) == 21
          assert all(
              case["analysis"]["runs"]["run_count"] >= 1
              for case in result["cases"].values()
          )
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          print("CS_REVERSAL_RESULT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          print("CONSENSUS:", result["consensus"])
          PY

      - name: Diagnoseartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-reversal-severity-persistence-2026-09-24-${{ github.run_id }}
          path: research/cs_reversal_severity_persistence_2026_09_24/
          if-no-files-found: error
          retention-days: 30
