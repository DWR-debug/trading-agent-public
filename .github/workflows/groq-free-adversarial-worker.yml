name: Groq Free Adversarial Research Worker

on:
  workflow_run:
    workflows:
      - Groq Free-Tier Preflight
    types: [completed]
  push:
    branches: [master]
    paths:
      - "ai_requests/AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT.json"
      - "automation/source_readiness_snapshot_guard.py"
      - "automation/orthogonal_pit_next_gate.py"
      - "research/evidence/q185_q186_source_feasibility_latest.json"
      - "research/evidence/q193_q196_source_feasibility_latest.json"
      - "research/evidence/q197_q198_source_feasibility_latest.json"
      - "research/evidence/q199_q201_source_feasibility_latest.json"
      - ".github/workflows/groq-free-adversarial-worker.yml"
      - "ai_requests/AI-2026-10-06-Q218-TOP4-ADVERSARIAL.json"
      - "ai_requests/AI-2026-10-06-Q219-TOP4-ADVERSARIAL.json"
      - "ai_requests/AI-2026-10-06-Q220-TOP4-ADVERSARIAL.json"
      - "ai_requests/AI-2026-10-06-Q221-TOP4-ADVERSARIAL.json"
  workflow_dispatch:
    inputs:
      use_litellm_transport:
        description: "Use the optional fail-closed LiteLLM transport for the Groq worker"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trading-agent-ai-groq-free-global-source-pit
  cancel-in-progress: false

jobs:
  groq_worker:
    if: >-
      ${{ github.repository == 'DWR-debug/trading-agent-public' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success') ||
           github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        task: [Q218,Q219,Q220,Q221]
    concurrency:
      group: trading-agent-ai-groq-top4-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Verify free-only preflight
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODE_CONFIRMED: ${{ secrets.GROQ_FREE_MODE_CONFIRMED }}
          TRADING_AGENT_LITELLM_TRANSPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_litellm_transport == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          p=Path('ops/groq_free_preflight.json')
          if not p.is_file(): raise SystemExit('missing Groq free-tier preflight')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('status') != 'PASS': raise SystemExit('Groq free-tier preflight is not PASS')
          if d.get('free_only') is not True or d.get('paid_usage_allowed') is not False: raise SystemExit('Groq free-only guard failed')
          if not os.environ.get('GROQ_API_KEY','').strip(): raise SystemExit('Groq API key unavailable')
          if os.environ.get('GROQ_FREE_MODE_CONFIRMED','').strip().lower() not in {'1','true','yes','on'}: raise SystemExit('Groq free-mode attestation unavailable')
          print('GROQ_FREE_PREFLIGHT=PASS')
          PY

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Optional LiteLLM transport
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_litellm_transport == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-ai.txt

      - name: Run bounded Groq adversarial worker
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODE_CONFIRMED: ${{ secrets.GROQ_FREE_MODE_CONFIRMED }}
          TRADING_AGENT_LITELLM_TRANSPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_litellm_transport == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          task_id="AI-2026-10-06-${{ matrix.task }}-TOP4-ADVERSARIAL"
          task_path="ai_requests/${task_id}.json"
          test -f "$task_path"
          mkdir -p "$RUNNER_TEMP/groq-worker-output"
          set +e
          python -m automation.ai_worker_fabric --run --provider 'groq_free' --task "$task_path" --output "$RUNNER_TEMP/groq-worker-output/${task_id}-groq_free.json"
          rc=$?
          set -e
          test "$rc" -ne 1

      - name: Publish Groq operational state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_dir='ops/ai_worker_state'
          mkdir -p "$state_dir"
          task_id="AI-2026-10-06-${{ matrix.task }}-TOP4-ADVERSARIAL"
          state_file="$state_dir/${task_id}__groq_free.json"
          output="$RUNNER_TEMP/groq-worker-output/${task_id}-groq_free.json"
          if [ -f "$output" ]; then cp "$output" "$state_file"; else printf '%s\n' '{"schema_version":1,"task_id":"AI-2026-10-04-GLOBAL-ADVERSARIAL-SOURCE-PIT","provider":"groq_free","status":"NO_OUTPUT","worker_output_is_scientific_evidence":false}' > "$state_file"; fi
          payload="$(base64 -w 0 "$state_file")"
          state_url="/repos/$GITHUB_REPOSITORY/contents/${state_file}?ref=master"
          current_sha="$(gh api "$state_url" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Groq free adversarial worker state' -f content="$payload" -f branch='master' -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/${state_file}" -f message='OPS: record Groq free adversarial worker state' -f content="$payload" -f branch='master' >/dev/null
          fi

      - name: Assert fixed Groq free route
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FREE_MODEL = "openai/gpt-oss-20b"' automation/groq_free.py

      - name: Upload Groq worker output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-worker-AI-2026-10-06-${{ matrix.task }}-TOP4-ADVERSARIAL-groq-free-${{ github.run_id }}
          path: "$RUNNER_TEMP/groq-worker-output/"
          if-no-files-found: warn
          retention-days: 14
