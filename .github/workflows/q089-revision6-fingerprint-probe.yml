name: Q089 Revision 6 Fingerprint Probe

on:
  push:
    branches: [fix/q089-prereg-schema-compat-r6]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Compute exact runner and prereg fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          runner=Path("automation/q089_performance.py").read_bytes()
          runner_sha=hashlib.sha256(runner).hexdigest()
          p=Path("research/preregistrations/q089_performance_2026_09_28.json")
          o=json.loads(p.read_text(encoding="utf-8"))
          o["source_contract"]["performance_runner_sha256"]=runner_sha
          o["revision"]=6
          o["supersedes"]="q089_performance_2026_09_28.json@revision-5"
          o["revision_reason"]="Infrastructure-only revision after Q089 attempt 3 reached the fixed-rule performance runner and exposed legacy-omitted top-level selection fields in the preregistration schema. The runner now treats omitted selection_used and holdout_used_for_selection fields as false. No signal, universe, split, data value, cost, gate, holdout, parameter, threshold, asset, horizon, variant, candidate-selection, or performance rule changed."
          o["governance"]["performance_trial_authorized"]=True
          canonical=json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False)
          prereg_sha=hashlib.sha256(canonical.encode()).hexdigest()
          print("Q089_REV6_RUNNER_SHA="+runner_sha)
          print("Q089_REV6_PREREG_FP="+prereg_sha)
          PY
