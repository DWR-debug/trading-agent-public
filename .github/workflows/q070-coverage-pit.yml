name: Q070 Coverage and PIT

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q070_fixed_candidate_validation_2026_09_28.json"
      - "automation/q069_candidate_bank.py"
      - "automation/q070_fresh_coverage.py"
      - "automation/q070_pit.py"
      - ".github/workflows/q070-coverage-pit.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-q070-coverage-pit
  cancel-in-progress: false

jobs:
  q070:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source reference
        shell: cmd
        run: |
          @echo off
          if not defined GITHUB_SHA exit /b 1
          echo Q070_EXACT_SOURCE_SHA=%GITHUB_SHA%

      - name: Bootstrap pinned Python 3.13.15
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q070"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q070.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Frozen safety and design contract
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe" -c "import json; from pathlib import Path; from config import settings; p=json.loads(Path('research/preregistrations/q070_fixed_candidate_validation_2026_09_28.json').read_text(encoding='utf-8')); assert p['status']=='PREREGISTERED_DESIGN_ONLY'; assert p['source_candidate_bank']['definitions_locked'] is True; assert p['governance']['performance_evaluation'] is False; assert p['governance']['selection_used'] is False; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('Q070 DESIGN SAFETY OK')"

      - name: Q070 focused tests
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe" -m pytest -q tests/test_q069_candidate_bank.py tests/test_q070_validation.py tests/test_canonical_snapshot.py || exit /b 1

      - name: Fresh coverage and asset freeze
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe" -m automation.q070_fresh_coverage --output-root research/runs/q070_coverage --result research/evidence/q070_coverage_result.json --discovery research/runs/q070_discovery/discovery.json --asset-freeze research/evidence/q070_asset_freeze.json --performance-prereg research/preregistrations/q070_performance_2026_09_28.json || exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe" -c "import json; from pathlib import Path; d=json.loads(Path('research/evidence/q070_coverage_result.json').read_text(encoding='utf-8')); assert d['status']=='COVERAGE_PASSED'; assert len(d['symbols'])==8; assert d['selection_used'] is False; assert d['performance_trial_authorized'] is False; print('Q070 COVERAGE PASSED',d['symbols'])" || exit /b 1

      - name: PIT mutation validation
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe" -m automation.q070_pit --coverage-root research/runs/q070_coverage/T-2026-09-28-070-COVERAGE --result research/evidence/q070_pit_result.json || exit /b 1

      - name: Persist Q070 preflight evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q070\tools\python.exe"
          set "PUBLISH_MESSAGE=EVIDENCE: record Q070 coverage and PIT preflight"
          "%PY_EXE%" -c "import os,urllib.request,json; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])" > "%RUNNER_TEMP%\\q070_base_sha.txt" || exit /b 1
          set /p BASE_SHA=<"%RUNNER_TEMP%\\q070_base_sha.txt"
          if not defined BASE_SHA exit /b 1
          "%PY_EXE%" "%GITHUB_WORKSPACE%\\automation\\github_contents_publish.py" --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/runs/q070_discovery/discovery.json=research\runs\q070_discovery\discovery.json --file research/evidence/q070_coverage_result.json=research\evidence\q070_coverage_result.json --file research/evidence/q070_asset_freeze.json=research\evidence\q070_asset_freeze.json --file research/preregistrations/q070_performance_2026_09_28.json=research\preregistrations\q070_performance_2026_09_28.json --file research/evidence/q070_pit_result.json=research\evidence\q070_pit_result.json || exit /b 1

      - name: Publish summary
        if: always()
        shell: cmd
        run: |
          @echo off
          if exist research\evidence\q070_coverage_result.json type research\evidence\q070_coverage_result.json
          if exist research\evidence\q070_pit_result.json type research\evidence\q070_pit_result.json
          echo Q070_RUNNER=%RUNNER_NAME%
          echo Q070_SHA=%GITHUB_SHA%
          echo Q070_RUN_ID=%GITHUB_RUN_ID%


      - name: Q070_DISPATCH_ADVANCE
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-dispatch"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-nuget-dispatch.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          set "DISPATCH_URL=https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/q070-autonomous-advance.yml/dispatches"
          "%PY_EXE%" -c "import json,os,urllib.request; u=os.environ['DISPATCH_URL']; req=urllib.request.Request(u,data=json.dumps({'ref':'master'}).encode('utf-8'),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}); urllib.request.urlopen(req,timeout=30).read(); print('Q070_DISPATCH_ADVANCE OK')" || exit /b 1
