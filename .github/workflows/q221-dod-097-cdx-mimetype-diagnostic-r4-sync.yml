name: Q221 DoD 097 CDX MIME Diagnostic Receipt Persistence (R4)

on:
  workflow_run:
    workflows: ["Q221 DoD 097 CDX MIME Diagnostic (R4)"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: trading-agent-q221-dod-097-cdx-mimetype-sync-r4
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      ${{
        github.event.workflow_run.repository.full_name == 'DWR-debug/trading-agent-public' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.conclusion != 'skipped'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Download exact source-run artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/q221-097-r4-artifact

      - name: Validate fingerprint, exact CDX pins, and no-replay safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "q221-097-r4-artifact"
          matches = list(root.rglob("q221-dod-097-cdx-mimetype-diagnostic-r4.json"))
          if len(matches) != 1:
              raise SystemExit(f"R4_RECEIPT_ARTIFACT_COUNT_INVALID:{len(matches)}")
          source = matches[0]
          receipt = json.loads(source.read_text(encoding="utf-8"))
          fingerprint = receipt.get("receipt_fingerprint")
          if not isinstance(fingerprint, str) or len(fingerprint) != 64:
              raise SystemExit("R4_RECEIPT_FINGERPRINT_MISSING")
          payload = {k:v for k,v in receipt.items() if k != "receipt_fingerprint"}
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",",":"), allow_nan=False).encode("utf-8")
          if hashlib.sha256(canonical).hexdigest() != fingerprint:
              raise SystemExit("R4_RECEIPT_FINGERPRINT_MISMATCH")
          if receipt.get("record_type") != "q221_dod_097_cdx_mimetype_diagnostic" or receipt.get("candidate_id") != "Q221":
              raise SystemExit("R4_RECEIPT_IDENTITY_INVALID")
          if receipt.get("request",{}).get("preregistration_path") != "research/preregistrations/q221_dod_097_cdx_mimetype_diagnostic_r4_2026_10_15.json":
              raise SystemExit("R4_PREREG_PATH_INVALID")
          if receipt.get("request",{}).get("request_marker_path") != "research/run_requests/q221_dod_097_cdx_mimetype_diagnostic_r4.trigger":
              raise SystemExit("R4_MARKER_PATH_INVALID")
          if receipt.get("target_count_from_frozen_manifest") != 28:
              raise SystemExit("R4_FROZEN_TARGET_COUNT_INVALID")
          if receipt.get("frozen_source_manifest") != {
              "path":"research/evidence/q221_historical_public_boundary_latest.json",
              "git_blob_sha1":"b78cf6f7b48af3f914ee7c6d06a38f6485b0438f",
              "receipt_fingerprint":"9e738733d369bf4a954e74cd999c4ba462cf0f9a4fa44aa65c74c637cf3b11f4",
              "expected_transaction_count":348,
              "git_blob_sha1_verified":receipt.get("frozen_source_manifest",{}).get("git_blob_sha1_verified"),
          }:
              # Allow the additional verification field only if it equals the same pinned blob.
              manifest=receipt.get("frozen_source_manifest",{})
              if any(manifest.get(k)!=v for k,v in {
                  "path":"research/evidence/q221_historical_public_boundary_latest.json",
                  "git_blob_sha1":"b78cf6f7b48af3f914ee7c6d06a38f6485b0438f",
                  "receipt_fingerprint":"9e738733d369bf4a954e74cd999c4ba462cf0f9a4fa44aa65c74c637cf3b11f4",
                  "expected_transaction_count":348,
              }.items()):
                  raise SystemExit("R4_MANIFEST_PIN_MISMATCH")
          safety = receipt.get("safety",{})
          if safety.get("paper_only") is not True:
              raise SystemExit("R4_PAPER_ONLY_MISSING")
          for key in ("live_trading_enabled","orders_enabled","scientific_evidence","performance_authorization","holdout_selection","ranking","tuning","promotion","live_execution","archive_replay_allowed","archive_payload_persisted","archive_schema_examined","transaction_row_presence_examined"):
              if safety.get(key) is not False:
                  raise SystemExit("R4_SAFETY_GATE_NOT_CLOSED:"+key)
          if receipt.get("target_archive") != {
              "filename":"FY2025_097_Contracts_Full_20250106.zip",
              "original_url":"https://files.usaspending.gov/award_data_archive/FY2025_097_Contracts_Full_20250106.zip",
              "wayback_capture_timestamp":"20250128184322",
              "capture_timestamp_utc":"2025-01-28T18:43:22Z",
              "cdx_sha1_base32":"IYPLEC2VXYNMEA2CUHSSPVKPEJRKBJQB",
              "cdx_length_bytes":13605284,
          }:
              raise SystemExit("R4_ARCHIVE_PIN_MISMATCH")
          probe = receipt.get("source_probe",{})
          count = probe.get("request_count")
          if isinstance(count,bool) or not isinstance(count,int) or not 0 <= count <= 1:
              raise SystemExit("R4_REQUEST_COUNT_INVALID")
          if safety.get("source_requests_made") != count:
              raise SystemExit("R4_REQUEST_COUNT_SAFETY_MISMATCH")
          if probe.get("archive_replay_request_count") != 0 or probe.get("archive_payload_downloaded") is not False:
              raise SystemExit("R4_ARCHIVE_REPLAY_MUST_REMAIN_DISABLED")
          if probe.get("response_bytes",0) > 5000000:
              raise SystemExit("R4_RESPONSE_CAP_VIOLATED")
          if len(probe.get("responses",[])) > 1:
              raise SystemExit("R4_RESPONSE_COUNT_CAP_VIOLATED")
          cdx = receipt.get("cdx_inventory")
          if receipt.get("status") == "Q221_DOD_097_CDX_MIMETYPE_DIAGNOSTIC_COMPLETE":
              if not isinstance(cdx,dict) or cdx.get("target_capture_verified") is not True:
                  raise SystemExit("R4_TARGET_CDX_METADATA_NOT_VERIFIED")
              row = cdx.get("target_capture",{})
              expected = {"timestamp":"20250128184322","original":"https://files.usaspending.gov/award_data_archive/FY2025_097_Contracts_Full_20250106.zip","statuscode":"200","digest":"IYPLEC2VXYNMEA2CUHSSPVKPEJRKBJQB","length":"13605284"}
              if any(row.get(k) != v for k,v in expected.items()) or not row.get("mimetype"):
                  raise SystemExit("R4_TARGET_CDX_ROW_PIN_MISMATCH")
              if receipt.get("interpretation",{}).get("transaction_row_presence_examined") is not False:
                  raise SystemExit("R4_ROW_PRESENCE_MUST_REMAIN_UNEXAMINED")
          elif not receipt.get("errors"):
              raise SystemExit("R4_NONCOMPLETE_RECEIPT_NEEDS_ERROR")
          evidence=Path("research/evidence")
          evidence.mkdir(parents=True, exist_ok=True)
          raw=source.read_bytes()
          attempt=evidence / f"q221_dod_097_cdx_mimetype_diagnostic_attempt_${SOURCE_RUN_ID}.json"
          latest=evidence / "q221_dod_097_cdx_mimetype_diagnostic_latest.json"
          if attempt.exists():
              raise SystemExit("R4_IMMUTABLE_RECEIPT_ALREADY_EXISTS")
          attempt_tmp=attempt.with_suffix(".json.tmp")
          latest_tmp=latest.with_suffix(".json.tmp")
          attempt_tmp.write_bytes(raw)
          latest_tmp.write_bytes(raw)
          attempt_tmp.replace(attempt)
          latest_tmp.replace(latest)
          print("Q221_R4_RECEIPT_FINGERPRINT="+fingerprint)
          print("Q221_R4_SOURCE_RUN="+os.environ["SOURCE_RUN_URL"])
          print("Q221_R4_SOURCE_COMMIT="+os.environ["SOURCE_COMMIT"])
          PY

      - name: Publish immutable attempt receipt and latest pointer with retries
        shell: bash
        env:
          PUBLISH_MESSAGE: "EVIDENCE: persist Q221 CDX MIME diagnostic R4 run ${{ github.event.workflow_run.id }}"
        run: |
          set -euo pipefail
          attempt_file="research/evidence/q221_dod_097_cdx_mimetype_diagnostic_attempt_${SOURCE_RUN_ID}.json"
          latest="research/evidence/q221_dod_097_cdx_mimetype_diagnostic_latest.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py \
              --repository "${GITHUB_REPOSITORY}" --branch master --base-sha "${base_sha}" \
              --file "${attempt_file}=${attempt_file}" --file "${latest}=${latest}"; then exit 0; fi
            sleep "${attempt}"
          done
          echo "::error::R4 receipt publication failed after retries"
          exit 1
