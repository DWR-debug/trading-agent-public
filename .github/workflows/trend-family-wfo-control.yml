name: Trend Family Walk Forward Control

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/trend_family_wfo_control.py"
      - "tests/test_trend_family_wfo_control.py"
      - ".github/workflows/trend-family-wfo-control.yml"
      - "automation/cross_asset_trend_replication.py"
      - "automation/trial_035_trend_family_wfo_2026_09_24.py"
      - "tests/test_trial_035_trend_family_wfo_2026_09_24.py"
      - "docs/trial_035_trend_family_wfo_preregistration_2026_09_24.md"
      - "research/checkpoints/trial_035_trend_family_wfo_preregistration_2026_09_24.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-trend-family-wfo-control
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "35780008533"
  SOURCE_ARTIFACT_NAME: "cross-asset-trend-replication-35780008533"

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Unveränderliches Cross-Asset-Archiv laden
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source_artifact
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archiv-Provenienz prüfen
        run: |
          set -euo pipefail
          test -f source_artifact/research/cross_asset_trend/manifest.json
          test -d source_artifact/data/market_data

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "source_artifact/research/cross_asset_trend/manifest.json"
          )
          manifest = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert manifest["universe"] == "cross_asset_trend"
          assert manifest["target_count"] == 3500
          assert manifest["provenance"]["run_id"] == "35780008533"
          assert manifest["manifest_fingerprint"] == (
              "f07bbc98c8aaac4b0336cd549f9cd632479dbedce81de76bd8467ff06cc056d0"
          )

          print("ARCHIVE VERIFIED")
          print("MANIFEST_FINGERPRINT:", manifest["manifest_fingerprint"])
          PY

      - name: Trend-Family-WFO-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.trend_family_wfo_control             --data-dir source_artifact/data/market_data             --manifest source_artifact/research/cross_asset_trend/manifest.json             --output research/trend_family_wfo_control/report.json

      - name: Ergebnis-Fingerprint und Methodik prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/trend_family_wfo_control/report.json"
          )
          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["parameter_optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["selection_scope"] == "training_only"
          assert report["methodology"]["holdout_is_blind_to_selection"] is True
          assert report["methodology"]["train_size"] == 1400
          assert report["methodology"]["test_size"] == 280
          assert report["methodology"]["research_windows"] == 5
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          print(
              "SELECTION_COUNTS:",
              report["selection"]["selection_counts"],
          )
          print(
              "HOLDOUT_FROZEN_STRATEGY:",
              report["holdout"][
                  "frozen_strategy_from_last_research_window"
              ],
          )
          print(
              "HOLDOUT_BASE_RETURN:",
              report["holdout"]["base"]["period_return"],
          )
          print(
              "HOLDOUT_BASE_PF:",
              report["holdout"]["base"]["profit_factor"],
          )
          print(
              "HOLDOUT_STRESS_RETURN:",
              report["holdout"]["stress_2x_cost"]["period_return"],
          )
          print(
              "HOLDOUT_STRESS_PF:",
              report["holdout"]["stress_2x_cost"]["profit_factor"],
          )
          PY

      - name: Family-WFO-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-family-wfo-control-${{ github.run_id }}
          path: research/trend_family_wfo_control/
          if-no-files-found: error
          retention-days: 30
