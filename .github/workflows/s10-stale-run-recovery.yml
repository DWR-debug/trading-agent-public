name: S10 Stale-Run Recovery

on:
  push:
    paths:
      - ".github/workflows/s10-stale-run-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: trading-agent-s10-stale-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel stale S10 phone runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30"             --jq '.workflow_runs[] | select(.name == "S10 Phone Research Worker" and .status == "in_progress" and .head_branch == "master") | [.id, .updated_at, .head_sha] | @tsv' |
          while IFS=$'	' read -r run_id updated_at head_sha; do
            [ -n "$run_id" ] || continue
            updated_epoch="$(date -d "$updated_at" +%s)"
            age="$((now - updated_epoch))"
            if [ "$age" -ge 1200 ]; then
              echo "Cancelling stale S10 run id=$run_id age_seconds=$age head_sha=$head_sha"
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
            else
              echo "Keeping fresh S10 run id=$run_id age_seconds=$age"
            fi
          done
