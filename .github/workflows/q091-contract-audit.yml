name: Q091 Contract Audit

on:
  push:
    branches: [master, research/q091-performance-framework]
    paths:
      - "automation/q091_contract_audit.py"
      - "tests/test_q091_contract_audit.py"
      - "automation/q091_performance.py"
      - "portfolio/q091_fixed_ensemble.py"
      - "automation/q091_input_freeze.py"
      - "research/preregistrations/q091_fixed_portfolio_architecture_2026_09_29.json"
      - "research/governance/active_research_registry.json"
      - ".github/workflows/q091-contract-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q091-contract-audit
  cancel-in-progress: false

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu
            runs_on: ubuntu-latest
          - lane: self_hosted
            runs_on: '["self-hosted","trading-agent-research"]'
    runs-on: ${{ contains(matrix.lane, 'self') && fromJSON(matrix.runs_on) || matrix.runs_on }}
    timeout-minutes: 12
    steps:
      - name: Checkout exact source (hosted)
        if: matrix.lane == 'ubuntu'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download exact source snapshot (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          if not defined GITHUB_SHA exit /b 1
          set "ROOT=%RUNNER_TEMP%\trading-agent-q091-audit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-q091-audit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%ROOT%" rmdir /s /q "%ROOT%"
          mkdir "%ROOT%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%ROOT%" || exit /b 1
          set "REPO_ROOT="
          for /d %%D in ("%ROOT%\trading-agent-public-*") do set "REPO_ROOT=%%~fD"
          if not defined REPO_ROOT exit /b 1
          echo REPO_ROOT=%REPO_ROOT%>>"%GITHUB_ENV%"
          echo SELF_HOSTED_EXACT_SNAPSHOT_OK %GITHUB_SHA%
          endlocal

      - name: Set up Python (hosted)
        if: matrix.lane == 'ubuntu'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bootstrap pinned Python (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q091-audit"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q091-audit.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          echo %PY_ROOT%\tools>>"%GITHUB_PATH%"
          echo PY_EXE=%PY_EXE%>>"%GITHUB_ENV%"
          endlocal

      - name: Install test dependency (hosted)
        if: matrix.lane == 'ubuntu'
        run: python -m pip install --disable-pip-version-check pytest

      - name: Install test dependency (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Q091 unit tests (hosted)
        if: matrix.lane == 'ubuntu'
        run: python -m pytest -q tests/test_q091_contract_audit.py

      - name: Run Q091 unit tests (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: |
          @echo off
          cd /d "%REPO_ROOT%" || exit /b 1
          "%PY_EXE%" -m pytest -q tests/test_q091_contract_audit.py

      - name: Run read-only Q091 audit (hosted)
        if: matrix.lane == 'ubuntu'
        run: python -m automation.q091_contract_audit > q091-contract-audit.json && cat q091-contract-audit.json

      - name: Run read-only Q091 audit (self-hosted)
        if: matrix.lane == 'self_hosted'
        shell: cmd
        run: |
          @echo off
          cd /d "%REPO_ROOT%" || exit /b 1
          "%PY_EXE%" -m automation.q091_contract_audit > "%GITHUB_WORKSPACE%\q091-contract-audit.json"
          type "%GITHUB_WORKSPACE%\q091-contract-audit.json"

      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q091-contract-audit-${{ matrix.lane }}-${{ github.run_id }}
          path: q091-contract-audit.json
          if-no-files-found: warn
          retention-days: 14
