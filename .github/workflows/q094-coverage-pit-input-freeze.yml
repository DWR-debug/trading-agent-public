name: Q094 Coverage PIT Input Freeze

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json"
      - "automation/q094_coverage_pit.py"
      - "portfolio/q094_monthly_rebalance.py"
      - "tests/test_q094_monthly_rebalance.py"
      - ".github/workflows/q094-coverage-pit-input-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q094-coverage-pit-input-freeze
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact design commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas exchange-calendars statsmodels==0.15.0

      - name: Skip re-preparation when Q094 is already registered for performance
        id: state
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          print(json.load(open("research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json",encoding="utf-8"))["status"])
          PY
          )"
          echo "prereg_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "PREREGISTERED_DESIGN_ONLY" ]; then
            echo "Q094 already progressed beyond design-only preparation; verifying only."
          fi

      - name: Safety and design guard
        if: steps.state.outputs.prereg_status == 'PREREGISTERED_DESIGN_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json").read_text())
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert p["status"] == "PREREGISTERED_DESIGN_ONLY"
          assert p["governance"]["performance_trial_authorized"] is False
          assert p["governance"]["selection"] is False
          assert p["rebalance_contract"]["schedule"] == "first_available_trading_session_of_each_calendar_month"
          print("Q094 SAFETY/DESIGN OK")
          PY

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q094_monthly_rebalance.py tests/test_q092_q091_failure_diagnosis.py

      - name: Run coverage PIT and adjusted-close input freeze
        if: steps.state.outputs.prereg_status == 'PREREGISTERED_DESIGN_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m automation.q094_coverage_pit --mode all

      - name: Validate preparation receipts
        shell: bash
        if: steps.state.outputs.prereg_status == 'PREREGISTERED_DESIGN_ONLY'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path,status in [
              ("research/evidence/q094_coverage_result.json","COVERAGE_PASSED"),
              ("research/evidence/q094_pit_result.json","PIT_PASSED"),
              ("research/evidence/q094_input_freeze_result.json","INPUT_BUNDLE_FROZEN"),
          ]:
            d=json.loads(Path(path).read_text())
            assert d["status"]==status
            assert d["performance_evaluation"] is False
            assert d["selection_used"] is False
            assert d.get("holdout_used_for_selection", False) is False
          print("Q094 PREPARATION RECEIPTS PASS")
          PY

      - name: Freeze Q094 performance preregistration after coverage-only selection
        if: steps.state.outputs.prereg_status == 'PREREGISTERED_DESIGN_ONLY'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prereg_path=Path("research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json")
          p=json.loads(prereg_path.read_text())
          cov=json.loads(Path("research/evidence/q094_coverage_result.json").read_text())
          pit=json.loads(Path("research/evidence/q094_pit_result.json").read_text())
          inp=json.loads(Path("research/evidence/q094_input_freeze_result.json").read_text())
          p["status"]="PREREGISTERED_PERFORMANCE"
          p["data_contract"]["symbols"]=cov["symbols"]
          p["data_contract"]["coverage_trial_id"]=cov["trial_id"]
          p["data_contract"]["coverage_result_fingerprint"]=cov["result_fingerprint"]
          p["data_contract"]["snapshot_fingerprint"]=cov["snapshot_fingerprint"]
          p["data_contract"]["pit_trial_id"]=pit["trial_id"]
          p["data_contract"]["pit_result_fingerprint"]=pit["result_fingerprint"]
          p["data_contract"]["input_bundle_trial_id"]=inp["trial_id"]
          p["data_contract"]["input_bundle_fingerprint"]=inp["bundle_fingerprint"]
          p["governance"]["performance_trial_authorized"]=False
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          p["source_contract"]["performance_runner_sha256"]=sha("automation/q094_performance.py")
          p["source_contract"]["monthly_overlay_sha256"]=sha("portfolio/q094_monthly_rebalance.py")
          p["source_contract"]["cost_contract_sha256"]=sha("execution/cost_contract.py")
          p["source_contract"]["settings_sha256"]=sha("config/settings.py")
          p["source_contract"]["input_freeze_sha256"]=sha("automation/q094_coverage_pit.py")
          p["prepared_from_master_sha"]=os.environ["GITHUB_SHA"]
          prereg_path.write_text(json.dumps(p,ensure_ascii=False,indent=2,allow_nan=False)+chr(10),encoding="utf-8")
          print("Q094 PREREGISTRATION FROZEN FOR PERFORMANCE")
          print("SYMBOLS="+",".join(cov["symbols"]))
          print("COVERAGE_FP="+cov["result_fingerprint"])
          print("PIT_FP="+pit["result_fingerprint"])
          print("INPUT_FP="+inp["bundle_fingerprint"])
          PY

      - name: Publish Q094 preparation artifacts
        if: steps.state.outputs.prereg_status == 'PREREGISTERED_DESIGN_ONLY'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q094_coverage_result.json=research/evidence/q094_coverage_result.json             --file research/evidence/q094_asset_freeze.json=research/evidence/q094_asset_freeze.json             --file research/evidence/q094_pit_result.json=research/evidence/q094_pit_result.json             --file research/evidence/q094_input_freeze_result.json=research/evidence/q094_input_freeze_result.json             --file research/runs/q094_coverage/T-2026-09-29-094-COVERAGE/snapshot_manifest.json=research/runs/q094_coverage/T-2026-09-29-094-COVERAGE/snapshot_manifest.json             --file research/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE/input_bundle_manifest.json=research/runs/q094_input_bundle/T-2026-09-29-094-INPUT-FREEZE/input_bundle_manifest.json             --file research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json=research/preregistrations/q094_monthly_rebalance_q091_low_turnover_2026_09_29.json

      - name: Upload Q094 preparation pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q094-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/q094_coverage_result.json
            research/evidence/q094_asset_freeze.json
            research/evidence/q094_pit_result.json
            research/evidence/q094_input_freeze_result.json
            research/runs/q094_coverage/**
            research/runs/q094_input_bundle/**
          if-no-files-found: warn
          retention-days: 30
