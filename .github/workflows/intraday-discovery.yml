name: Intraday Candidate Discovery

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/microtrading_discovery.trigger"
      - "automation/microtrading_15m_sidecar_2026_09_23.py"
      - "automation/microtrading_turn_candle_5m_2026_09_23.py"
      - ".github/workflows/intraday-discovery.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-intraday-discovery
  cancel-in-progress: false

jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: micro15m
            module: automation.microtrading_15m_sidecar_2026_09_23
            data_dir: research/runs/intraday_discovery/15m/data
            output: research/runs/intraday_discovery/15m/result.json
          - id: turn5m
            module: automation.microtrading_turn_candle_5m_2026_09_23
            data_dir: research/runs/intraday_discovery/5m/data
            output: research/runs/intraday_discovery/5m/result.json
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert float(settings.MAX_LEVERAGE) <= 3.0
          print("INTRADAY DISCOVERY SAFETY OK")
          PY

      - name: Execute fixed exploratory simulation
        shell: bash
        env:
          DATA_DIR: ${{ matrix.data_dir }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR" "$(dirname "$OUTPUT")"
          python -m "${{ matrix.module }}"             --data-dir "$DATA_DIR"             --output "$OUTPUT"

      - name: Assert discovery-only contract
        shell: bash
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["OUTPUT"])
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "COMPLETED"
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          limits=d.get("interpretation_limits")
          if limits is not None:
              assert limits.get("not_a_production_candidate") is True
              assert limits.get("paper_only") is True
              assert limits.get("no_orders") is True
          else:
              limits=d.get("modeling_limits")
              assert limits is not None
              assert limits.get("production_candidate") is False
              assert limits.get("production_integration") is False
              assert limits.get("orders_enabled") is False
          print("DISCOVERY_ONLY_CONTRACT_OK")
          print("RESULT_FINGERPRINT:", d["result_fingerprint"])
          PY

      - name: Upload exploratory result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intraday-discovery-${{ matrix.id }}-${{ github.run_id }}
          path: research/runs/intraday_discovery/
          if-no-files-found: warn
          retention-days: 30
