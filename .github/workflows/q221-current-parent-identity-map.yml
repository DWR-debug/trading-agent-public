name: Q221 Current Parent Identity Lead Map

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q221_current_parent_identity_map_probe.trigger"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: trading-agent-q221-current-parent-identity-map
  cancel-in-progress: false

jobs:
  map:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate prior feasibility run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/38303469112" > "$RUNNER_TEMP/q221-parent-map-feasibility-run.json"
          jq -e '.name == "Q221 Recipient Parent Identity Feasibility Probe" and .status == "completed" and .conclusion == "success" and .head_branch == "master"' "$RUNNER_TEMP/q221-parent-map-feasibility-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/38303469112/artifacts?per_page=100" > "$RUNNER_TEMP/q221-parent-map-feasibility-artifacts.json"
          jq -e '[.artifacts[]? | select(.name == "q221-recipient-parent-identity-probe-38303469112-1" and .expired == false)] | length == 1' "$RUNNER_TEMP/q221-parent-map-feasibility-artifacts.json" >/dev/null
      - name: Download exact feasibility receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q221-parent-map-feasibility"
          gh run download 38303469112 --repo "$GITHUB_REPOSITORY" --name "q221-recipient-parent-identity-probe-38303469112-1" --dir "$RUNNER_TEMP/q221-parent-map-feasibility"
      - name: Validate fixed source and request
        id: guard
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.q221_current_parent_identity_map_probe import read_request, validate_source, validate_feasibility
          read_request(Path("research/run_requests/q221_current_parent_identity_map_probe.trigger"))
          validate_source(Path("research/evidence/q221_historical_public_boundary_latest.json"))
          roots = sorted(Path("$RUNNER_TEMP/q221-parent-map-feasibility").rglob("receipt.json"))
          if len(roots) != 1:
              raise SystemExit("Q221_PARENT_MAP_FEASIBILITY_RECEIPT_COUNT_INVALID")
          validate_feasibility(roots[0])
          print("Q221_PARENT_MAP_FROZEN_INPUTS_VALID=true")
          PY
      - name: Capture current parent metadata for all frozen recipients
        id: probe
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          feasibility_receipt="$(find "$RUNNER_TEMP/q221-parent-map-feasibility" -name receipt.json -type f -print -quit)"
          python -m automation.q221_current_parent_identity_map_probe \
            --request research/run_requests/q221_current_parent_identity_map_probe.trigger \
            --source research/evidence/q221_historical_public_boundary_latest.json \
            --feasibility "$feasibility_receipt" \
            --output "$RUNNER_TEMP/q221-current-parent-identity-map-receipt.json"
      - name: Upload immutable parent identity lead map
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q221-current-parent-identity-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/q221-current-parent-identity-map-receipt.json"
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Fail closed on incomplete parent observations
        if: steps.guard.outcome != 'success' || steps.probe.outcome != 'success'
        run: |
          echo "Q221 current parent map incomplete; historical mapping and public-clock gates remain closed."
          exit 1
