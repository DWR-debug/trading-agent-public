name: Q081-R1 Self-hosted Reproduction

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q081r1_selfhosted_reproduction.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q081r1-selfhosted-reproduction
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 240
    steps:
      - name: Checkout exact authorized master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Bootstrap Python 3.13.15
        shell: cmd
        run: |
          @echo off
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q081-repro"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q081-repro.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pandas pytest || exit /b 1

      - name: Verify Q081R1 authorization, source contract and safety
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081-repro\tools\python.exe"
          "%PY_EXE%" -c "import hashlib,json; from pathlib import Path; from config import settings; r=json.loads(Path('research/governance/active_research_registry.json').read_text(encoding='utf-8')); e=next((x for x in r.get('active_trials',[]) if x.get('code')=='081R1'),None); assert e and e.get('trial_id')=='T-2026-09-28-081R1-PERFORMANCE' and e.get('performance_authorization_allowed') is True, 'Q081R1 not currently authorized by active research registry'; p=json.loads(Path('research/preregistrations/q081r1_performance_2026_09_28.json').read_text(encoding='utf-8')); a=json.loads(Path('research/authorizations/q081r1_performance_2026_09_28.json').read_text(encoding='utf-8')); assert p['trial_id']=='T-2026-09-28-081R1-PERFORMANCE' and a['authorized'] is True and a['performance_execution_authorized'] is True and a['execution_scope']=='Q081R1_FIXED_RULE_PERFORMANCE_ONLY'; expected=p['source_contract']; actual={path:hashlib.sha1(('blob '+str(len(Path(path).read_bytes()))).encode()+bytes([0])+Path(path).read_bytes()).hexdigest() for path in expected}; assert actual==expected; assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False; print('Q081R1 AUTH/BLOB-SOURCE/SAFETY OK')"

      - name: Verify frozen Q079 prerequisites
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081-repro\tools\python.exe"
          "%PY_EXE%" -c "import json; from pathlib import Path; p=json.loads(Path('research/preregistrations/q081r1_performance_2026_09_28.json').read_text()); c=json.loads(Path('research/evidence/q079_coverage_result.json').read_text()); h=json.loads(Path('research/evidence/q079_pit_result.json').read_text()); b=json.loads(Path('research/evidence/q079_input_freeze_result.json').read_text()); i=json.loads(Path('research/evidence/q079_performance_execution_incident.json').read_text()); assert c['status']=='COVERAGE_PASSED' and c['result_fingerprint']==p['data_contract']['coverage_result_fingerprint']; assert c['snapshot_fingerprint']==p['data_contract']['snapshot_fingerprint']; assert h['status']=='PIT_PASSED' and h['result_fingerprint']==p['data_contract']['pit_result_fingerprint']; assert b['status']=='INPUT_BUNDLE_FROZEN' and b['bundle_fingerprint']==p['data_contract']['input_bundle_fingerprint']; assert i['status']=='IMPLEMENTATION_INVALID_NO_SCIENTIFIC_OUTCOME'; print('Q081R1 FROZEN PREREQUISITES OK')"

      - name: Run exact network-free Q081R1 reproduction
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081-repro\tools\python.exe"
          "%PY_EXE%" -m automation.q081r1_corrected_e1_e2_performance --preregistration research/preregistrations/q081r1_performance_2026_09_28.json --repo-root . --output research/runs/self_hosted/q081r1_reproduction_%GITHUB_RUN_ID%/q081r1_performance_result.json

      - name: Validate non-formal reproduction
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q081-repro\tools\python.exe"
          "%PY_EXE%" -c "import json; from pathlib import Path; d=json.loads(Path('research/runs/self_hosted/q081r1_reproduction_%GITHUB_RUN_ID%/q081_performance_result.json').read_text(encoding='utf-8')); assert d['status']=='COMPLETED'; assert d['performance_evaluation'] is True and d['oos_evaluation'] is True and d['holdout_evaluation'] is True; assert d['selection_used'] is False and d['holdout_used_for_selection'] is False; assert d['governance']['promotion_decision'] is False and d['governance']['automatic_promotion'] is False; assert set(d['arms'])=={'CONTROL_6SLEEVE_ENSEMBLE','E1_ALPHA_COMMON_MODE_THROTTLE','E2_TURNOVER_HYSTERESIS'}; assert all(0 <= x['gates_passed'] <= 13 for x in d['arms'].values()); print('Q081R1 SELF-HOSTED REPRODUCTION OK'); [print(k,str(v['gates_passed'])+'/13') for k,v in d['arms'].items()]; print('REPORT_FP',d['report_fingerprint'])"

      - name: Upload non-formal reproduction artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q081r1-selfhosted-reproduction-${{ github.run_id }}
          path: research/runs/self_hosted/q081r1_reproduction_${{ github.run_id }}/q081_performance_result.json
          if-no-files-found: error
          retention-days: 30
