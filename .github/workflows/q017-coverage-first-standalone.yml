name: Q017 Coverage First Standalone

on:
  push:
    branches: [research/execute-q017-g3-coverage-first]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q017-coverage-first
  cancel-in-progress: false

jobs:
  coverage:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.comment.body == '/trading-agent q017-coverage-once'
          )
        )
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded coverage dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas statsmodels==0.15.0 pypdf

      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q017 COVERAGE SAFETY OK")
          PY

      - name: Coverage-first preflight
        run: |
          set -euo pipefail
          mkdir -p research/runs/q017_g3_coverage_first
          python -m automation.q017_coverage_preflight             --output-root research/runs/q017_g3_coverage_first             --universe q017_coverage_first

      - name: Contract verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/runs/q017_g3_coverage_first")
          matches=list(root.rglob("*.json"))
          assert matches, "No Q017 coverage artifact produced"
          reports=[json.loads(p.read_text(encoding="utf-8")) for p in matches]
          primary=next(
              (x for x in reports if x.get("task_id")=="Q-017-G3-COVERAGE-FIRST"),
              max(reports, key=lambda x: str(x.get("status", "")))
          )
          assert primary.get("performance_authorized") is False
          assert primary.get("status") in {"DATA_INSUFFICIENT", "DATA_INVALID"}
          print("Q017 STATUS:", primary.get("status"))
          print("Q017 POINT_IN_TIME_READY:", primary.get("point_in_time_ready"))
          print("Q017 FINGERPRINT:", primary.get("coverage_fingerprint") or primary.get("fingerprint"))
          print("Q017 FAMILY_STATUSES:", json.dumps(primary.get("family_statuses", {}), sort_keys=True))
          print("Q017 PRIMARY:", json.dumps(primary, sort_keys=True))
          PY

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q017-coverage-first-${{ github.run_id }}
          path: research/runs/q017_g3_coverage_first/
          if-no-files-found: error
          retention-days: 30
