name: Micro Trading Holding Horizon 15m — 2026-09-23 — Public

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/microtrading_holding_horizon_15m_2026_09_23.py"
      - "tests/test_microtrading_holding_horizon_15m_2026_09_23.py"
      - ".github/workflows/microtrading-holding-horizon-15m-2026-09-23.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/microtrading_holding_horizon_15m_2026_09_23.py"
      - "tests/test_microtrading_holding_horizon_15m_2026_09_23.py"
      - ".github/workflows/microtrading-holding-horizon-15m-2026-09-23.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-public-microtrading-holding-horizon-15m
  cancel-in-progress: true

jobs:
  micro_holding_horizon:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-Trading-Sicherheit und Forschungsgrenzen prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          from automation.microtrading_holding_horizon_15m_2026_09_23 import (
              HOLDING_HORIZONS,
              LEVERAGE_LEVELS,
          )
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert HOLDING_HORIZONS == (1, 4, 16)
          assert LEVERAGE_LEVELS == (1.0, 2.0, 3.0)
          assert max(LEVERAGE_LEVELS) <= float(settings.MAX_LEVERAGE)
          print("PAPER-ONLY SAFETY OK")
          print("FIXED HORIZONS OK:", HOLDING_HORIZONS)
          print("LEVERAGE GRID OK:", LEVERAGE_LEVELS)
          PY
      - name: Holding-Horizon Sidecar ausführen
        run: |
          set -euo pipefail
          python -m automation.microtrading_holding_horizon_15m_2026_09_23             --data-dir data/micro_holding_horizon_market_data             --output research/microtrading_holding_horizon_15m_2026_09_23.json
      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path("research/microtrading_holding_horizon_15m_2026_09_23.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          stored = result.pop("result_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["interval"] == "15m"
          assert result["scope"]["target_count_per_asset"] == 100000
          assert result["scope"]["symbol_disjoint_from_prior_micro_controls"] is True
          assert result["scope"]["holding_horizons_bars"] == [1, 4, 16]
          assert result["scope"]["holding_horizons_minutes"] == [15, 60, 240]
          assert result["scope"]["leverage_levels"] == [1.0, 2.0, 3.0]
          assert result["hypotheses"]["selection_between_hypotheses"] is False
          assert result["hypotheses"]["parameter_search"] is False
          assert result["modeling_limits"]["short_is_price_return_proxy_not_execution_model"] is True
          assert result["modeling_limits"]["funding_cost_modeled"] is False
          assert result["modeling_limits"]["borrow_cost_modeled"] is False
          assert result["modeling_limits"]["liquidation_model"] is False
          assert result["modeling_limits"]["production_candidate"] is False
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "max_research_leverage": 3.0,
          }
          print("MICRO_HOLDING_HORIZON_INTEGRITY_OK")
          print("RESULT_FINGERPRINT:", stored)
          PY
      - name: Research-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microtrading-holding-horizon-15m-2026-09-23-${{ github.run_id }}
          path: |
            research/microtrading_holding_horizon_15m_2026_09_23.json
            data/micro_holding_horizon_market_data/
          if-no-files-found: error
          retention-days: 30
