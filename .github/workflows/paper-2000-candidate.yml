name: Formal Candidate 2000 EUR Paper Run

on:
  push:
    branches: [master]
    paths:
      - "research/paper_candidates_2000/**"
      - "automation/paper_candidate_2000_gate.py"
      - "automation/paper_30_day_experiment.py"
      - "research/evidence_contract.py"
      - ".github/workflows/paper-2000-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-formal-paper-2000
  cancel-in-progress: false

jobs:
  candidate_2000:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("FORMAL 2000 PAPER SAFETY OK")
          PY

      - name: Gate tests
        run: python -m pytest -q tests/test_paper_candidate_2000_gate.py


      - name: Resolve single frozen candidate manifest
        id: resolve_candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/paper_candidates_2000
          mapfile -t manifests < <(find research/paper_candidates_2000 -type f -name '*.json' | sort)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "NO_ELIGIBLE_2000_EUR_CANDIDATE_MANIFEST"
            echo "The lane is armed but no candidate has reached VALIDATED_PASS yet."
            exit 0
          fi
          if [ ${#manifests[@]} -ne 1 ]; then
            echo "::error::Multiple 2000-EUR candidate manifests would create ambiguous execution."
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_MANIFEST=${manifests[0]}" >> "$GITHUB_ENV"

      - name: Evidence eligibility gate
        if: steps.resolve_candidate.outputs.found == 'true'
        run: |
          set -euo pipefail
          python -m automation.paper_candidate_2000_gate             --manifest "$CANDIDATE_MANIFEST"             | tee "$RUNNER_TEMP/paper_2000_gate.json"

      - name: Execute isolated 30-day EUR 2000 paper experiment
        if: steps.resolve_candidate.outputs.found == 'true'
        run: |
          set -euo pipefail
          candidate_dir="research/runs/paper_2000/${{ github.run_id }}"
          mkdir -p "$candidate_dir"
          evidence_path="$(python -c 'import json,os; print(json.load(open(os.environ["CANDIDATE_MANIFEST"]))["evidence_path"])')"
          returns_path="$(python -c 'import json,os; print(json.load(open(os.environ["CANDIDATE_MANIFEST"]))["returns_path"])')"
          python -m automation.paper_30_day_experiment             --evidence "$evidence_path"             --returns "$returns_path"             --output "$candidate_dir/report.json"             --checkpoint "$candidate_dir/checkpoint.json"             --initial-capital-eur 2000

      - name: Final contract
        if: steps.resolve_candidate.outputs.found == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/runs/paper_2000")/"${{ github.run_id }}"
          report=json.loads((root/"report.json").read_text(encoding="utf-8"))
          assert report["status"]=="COMPLETED"
          assert report["initial_capital_eur"]==2000.0
          assert report["processed_days"]==30
          assert report["evidence_eligibility"]["status"]=="VALIDATED_PASS"
          assert report["evidence_eligibility"]["holdout_used_for_selection"] is False
          assert report["safety"]=={
              "paper_only":True,
              "live_trading_enabled":False,
              "orders_enabled":False,
          }
          assert report["report_fingerprint"]
          print("FORMAL 2000 EUR PAPER CONTRACT OK")
          print("FINAL_EQUITY_EUR:", report["final_equity_eur"])
          print("MAX_DD_PERCENT:", report["maximum_drawdown_percent"])
          print("REPORT_FINGERPRINT:", report["report_fingerprint"])
          PY

      - name: Evidence artifact
        if: always() && steps.resolve_candidate.outputs.found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: paper-2000-${{ github.run_id }}
          path: research/runs/paper_2000/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
