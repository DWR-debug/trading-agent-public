name: Q077-R1 One-Shot Authorization

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q077r1_authorize_once.trigger"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: trading-agent-q077r1-authorization-once
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 694 &&
          !github.event.issue.pull_request &&
          github.event.comment.body == 'RUN_Q077R1_AUTHORIZE_ONCE' &&
          github.event.comment.user.login == github.repository_owner
        )
      )
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorization request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify explicit one-shot authorization request
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q077r1_authorize_once.trigger
          grep -Fx "AUTHORIZE_Q077R1=true" research/run_requests/q077r1_authorize_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-077R1-PERFORMANCE" research/run_requests/q077r1_authorize_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q077r1_authorize_once.trigger
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            test "$GITHUB_EVENT_PATH" != ""
          fi

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pytest exchange-calendars statsmodels==0.15.0 pypdf

      - name: Verify frozen prerequisites and fail-closed safety
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from config import settings
          from automation import q077r1_performance as runner
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          p=load('research/preregistrations/q077r1_performance_2026_09_30.json')
          c=load('research/evidence/q077r1_coverage_result.json')
          h=load('research/evidence/q077r1_pit_result.json')
          f=load('research/evidence/q077r1_input_freeze_result.json')
          m=load('research/runs/q077r1_input_bundle/T-2026-09-28-077R1-INPUT-FREEZE/input_bundle_manifest.json')
          r=load('research/governance/active_research_registry.json')
          assert p['trial_id']=='T-2026-09-30-077R1-PERFORMANCE' and p['status']=='PREREGISTERED_PERFORMANCE'
          assert p['governance']['performance_trial_authorized'] is False
          assert c['status']=='COVERAGE_PASSED' and c['result_fingerprint']==p['data_contract']['coverage_result_fingerprint']
          assert h['status']=='PIT_PASSED' and h['result_fingerprint']==p['data_contract']['pit_result_fingerprint']
          assert f['status']=='INPUT_BUNDLE_FROZEN' and f['bundle_fingerprint']==p['data_contract']['input_bundle_fingerprint']
          assert f['symbols']==p['symbols'] and c['symbols']==p['symbols'] and h['symbols']==p['symbols']
          assert c['performance_evaluation'] is False and h['performance_evaluation'] is False and f['performance_evaluation'] is False
          assert m['bundle_fingerprint']==f['bundle_fingerprint']
          e=next(x for x in r['active_trials'] if str(x.get('code'))=='077R1')
          assert e['trial_id']==p['trial_id'] and e['state']=='PERFORMANCE_READY_FOR_AUTHORIZATION' and e['performance_authorization_allowed'] is False
          assert runner.TRIAL_ID==p['trial_id']
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          for key,path in {'performance_runner_sha256':'automation/q077r1_performance.py','alpha_mechanism_sha256':'automation/q067_alpha_mechanisms.py','cost_contract_sha256':'execution/cost_contract.py','settings_sha256':'config/settings.py','input_freeze_sha256':'automation/q077r1_input_freeze.py'}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==p['source_contract'][key]
          print('Q077R1 AUTH SOURCE/DATA/SAFETY PASS')
          PY

      - name: Contract regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q077r1_identity.py
          python -m py_compile automation/q077r1_performance.py automation/q077r1_reconcile.py
          python automation/project_integrity_check.py

      - name: Wait for exact Master CI Gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "Q077R1 T052 run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Build atomic authorization and performance trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pp=Path('research/preregistrations/q077r1_performance_2026_09_30.json')
          rp=Path('research/governance/active_research_registry.json')
          ap=Path('research/authorizations/q077r1_performance_2026_09_30.json')
          tp=Path('research/run_requests/q077r1_performance_once.trigger')
          p=json.loads(pp.read_text(encoding='utf-8'))
          r=json.loads(rp.read_text(encoding='utf-8'))
          assert p['governance']['performance_trial_authorized'] is False
          entry=next(x for x in r['active_trials'] if str(x.get('code'))=='077R1')
          assert entry['trial_id']==p['trial_id'] and entry['performance_authorization_allowed'] is False and entry['state']=='PERFORMANCE_READY_FOR_AUTHORIZATION'
          p['governance']['performance_trial_authorized']=True
          prereg_fp=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          auth={'schema_version':1,'authorization_id':'AUTH-Q077R1-2026-09-30-'+os.environ['GITHUB_RUN_ID'],'trial_id':p['trial_id'],'authorized':True,'performance_execution_authorized':True,'execution_scope':'Q077R1_FIXED_RULE_PERFORMANCE_ONLY','one_shot':True,'preregistration_fingerprint':prereg_fp,'input_bundle_fingerprint':p['data_contract']['input_bundle_fingerprint'],'authorization_basis':{'authorization_workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'requested_by_user':True},'selection_used':False,'holdout_used_for_selection':False,'parameter_search':False,'threshold_search':False,'asset_search':False,'horizon_search':False,'variant_search':False,'family_ranking':False,'promotion_decision':False,'safety':{'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}}
          entry['performance_authorization_allowed']=True
          entry['state']='PERFORMANCE_AUTHORIZED'
          entry['authorization_id']=auth['authorization_id']
          ap.parent.mkdir(parents=True,exist_ok=True)
          ap.write_text(json.dumps(auth,ensure_ascii=False,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          pp.write_text(json.dumps(p,ensure_ascii=False,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          tp.write_text('RUN_Q077R1_FIXED_RULE_PERFORMANCE_ONCE=true\nTRIAL_ID=T-2026-09-30-077R1-PERFORMANCE\nONE_SHOT=true\n',encoding='utf-8')
          PY
          for attempt in 1 2 3 4 5; do
            echo "Q077R1 publish attempt=$attempt"
            base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test -n "$base_sha"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" --file research/preregistrations/q077r1_performance_2026_09_30.json=research/preregistrations/q077r1_performance_2026_09_30.json --file research/authorizations/q077r1_performance_2026_09_30.json=research/authorizations/q077r1_performance_2026_09_30.json --file research/governance/active_research_registry.json=research/governance/active_research_registry.json --file research/run_requests/q077r1_performance_once.trigger=research/run_requests/q077r1_performance_once.trigger; then
              echo 'Q077R1 authorization persisted'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload authorization receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q077r1-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/authorizations/q077r1_performance_2026_09_30.json
          if-no-files-found: warn
          retention-days: 30
