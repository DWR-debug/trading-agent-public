name: Cross Asset Trend Replication

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/cross_asset_trend_replication.py"
      - "tests/test_cross_asset_trend_replication.py"
      - ".github/workflows/cross-asset-trend-replication.yml"
      - "automation/prepare_research_data.py"
      - "research/asset_universes.py"
      - "automation/literature_strategy_lab.py"
      - "data/yahoo_loader.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-cross-asset-trend-replication
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Unabhängige Cross-Asset-Historie vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe cross_asset_trend             --output research/cross_asset_trend/manifest.json

      - name: Datenmanifest verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/cross_asset_trend/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))

          assert manifest["universe"] == "cross_asset_trend"
          assert manifest["source"] == "yahoo_chart"
          assert manifest["target_count"] == 3500
          assert len(manifest["datasets"]) == 8
          assert all(
              dataset["candle_count"] >= 3000
              for dataset in manifest["datasets"]
          )
          assert manifest["safety"]["paper_only"] is True
          assert manifest["safety"]["live_trading_enabled"] is False
          assert manifest["safety"]["orders_enabled"] is False

          print("CROSS-ASSET MANIFEST VERIFIED")
          print("MANIFEST_FINGERPRINT:", manifest["manifest_fingerprint"])
          for dataset in manifest["datasets"]:
              print(
                  dataset["symbol"],
                  dataset["candle_count"],
                  dataset["data_start"],
                  dataset["data_end"],
              )
          PY

      - name: Cross-Asset-Trend-Replikation ausführen
        run: |
          set -euo pipefail
          python -m automation.cross_asset_trend_replication             --data-dir data/market_data             --manifest research/cross_asset_trend/manifest.json             --output research/cross_asset_trend/report.json

      - name: Ergebnis-Fingerprint und Methodik prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/cross_asset_trend/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["methodology"]["strategy_rules_are_pre_registered"] is True
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["rebalance_frequency"] == "monthly"
          assert report["methodology"]["holdout_is_blind_to_selection"] is True
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Cross-Asset-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-asset-trend-replication-${{ github.run_id }}
          path: |
            research/cross_asset_trend/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
