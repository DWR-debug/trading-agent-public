name: Selection Profile Consensus Analysis

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-selection-profile-consensus
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "35757944587"
      SOURCE_ARTIFACT_ID: "10709300786"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: Source Selection-to-OOS-Artifact laden
        uses: actions/download-artifact@v5
        with:
          name: selection-to-oos-mismatch-analysis
          path: source_artifact
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Source-Control prüfen
        run: |
          set -euo pipefail
          test -f source_artifact/selection_to_oos_control/selection_to_oos_control.json
          test -f source_artifact/selection_to_oos_mismatch/selection_to_oos_mismatch_analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          control = json.loads(Path("source_artifact/selection_to_oos_control/selection_to_oos_control.json").read_text())
          analysis = json.loads(Path("source_artifact/selection_to_oos_mismatch/selection_to_oos_mismatch_analysis.json").read_text())
          assert control["diagnostic_type"] == "rolling_selection_to_oos_control"
          assert analysis["diagnostic_type"] == "rolling_selection_to_oos_mismatch_analysis"
          assert control["diagnostic_fingerprint"] == analysis["source_control_fingerprint"]
          assert analysis["evaluation_count"] == 240
          assert analysis["unique_market_window_count"] == 60
          assert control["safety"]["paper_only"] is True
          assert control["safety"]["live_trading_enabled"] is False
          assert control["safety"]["orders_enabled"] is False
          print("SELECTION-TO-OOS SOURCE VERIFIED")
          PY
      - name: Selection-Profile-Konsistenz analysieren
        run: |
          python -m automation.selection_profile_consensus_analysis \
            --control-json source_artifact/selection_to_oos_control/selection_to_oos_control.json \
            --output-dir research/selection_profile_consensus
      - name: Research-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: selection-profile-consensus-analysis
          path: research/selection_profile_consensus/
          if-no-files-found: error
          retention-days: 30
