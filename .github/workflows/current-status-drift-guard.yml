name: Current Status Drift Guard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-current-status-drift-guard
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Detect status drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          master_sha="$(git rev-parse HEAD)"
          source_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("research/evidence/current_operational_state.json").read_text(encoding="utf-8"))
          print(data.get("source_master_sha",""))
          PY
          )"
          echo "master_sha=$master_sha"
          echo "status_source_sha=$source_sha"

          if [ "$master_sha" = "$source_sha" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$master_sha")
          allowed_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            allowed_only=false
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              docs/CURRENT_STATUS.md|research/evidence/current_operational_state.json) ;;
              *) allowed_only=false ;;
            esac
          done

          if [ "$allowed_only" = "true" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "MASTER_AHEAD_BY_DOCUMENTATION_ONLY_STATUS_COMMIT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "STATUS_DRIFT_DETECTED"
          fi

      - name: Dispatch status synchronizer
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run current-status-sync.yml --ref master
          echo "CURRENT_STATUS_SYNC_DISPATCHED"
