name: Q104 I19 Filing-Date Precedence Review

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q104_i19_filing_date_precedence_review.trigger"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: trading-agent-q104-i19-filing-date-precedence-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate immutable source run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/38304249742" > "$RUNNER_TEMP/source-run.json"
          jq -e '.name == "Q104 I19 Filing-Date-Change Header Probe" and .status == "completed" and .conclusion == "success" and .head_branch == "master"' "$RUNNER_TEMP/source-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/38304249742/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          jq -e '[.artifacts[]? | select(.name == "q104-i19-filing-date-change-header-probe-38304249742-1" and .expired == false)] | length == 1' "$RUNNER_TEMP/source-artifacts.json" >/dev/null
      - name: Download immutable header receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q104-precedence-source"
          gh run download 38304249742 --repo "$GITHUB_REPOSITORY" --name "q104-i19-filing-date-change-header-probe-38304249742-1" --dir "$RUNNER_TEMP/q104-precedence-source"
      - name: Generate review-only proposal receipt
        id: review
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m automation.q104_i19_filing_date_precedence_review \
            --request research/run_requests/q104_i19_filing_date_precedence_review.trigger \
            --source "$RUNNER_TEMP/q104-precedence-source" \
            --output "$RUNNER_TEMP/q104-filing-date-precedence-review-receipt.json"
      - name: Upload immutable proposal receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-filing-date-precedence-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/q104-filing-date-precedence-review-receipt.json"
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Fail closed if evidence does not support proposal
        if: steps.review.outcome != 'success'
        run: |
          echo "Q104 precedence review incomplete; no source precedence or gate changes."
          exit 1
