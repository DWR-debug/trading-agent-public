name: Q076 Fixed Mechanism Performance

on:
  push:
    branches: [master]
    paths:
      - "research/authorizations/q076_performance_2026_09_28.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-q076-performance
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact authorized master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Verify authorization and frozen source
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q076_fresh_e1_e2_replication_2026_09_28.json").read_text())
          a=json.loads(Path("research/authorizations/q076_performance_2026_09_28.json").read_text())
          expected=a["source_contract"]
          actual={path:subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip() for path in expected}
          assert actual==expected
          assert a["authorized"] is True and a["performance_execution_authorized"] is True
          assert a["execution_scope"]=="Q076_FIXED_RULE_PERFORMANCE_ONLY"
          assert p["status"]=="PREREGISTERED_PERFORMANCE"
          assert p["selection_used"] is False and p["holdout_used_for_selection"] is False
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          print("Q076 AUTH/SOURCE/SAFETY OK")
          PY
      - name: Verify immutable prerequisites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q076_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q076_pit_result.json").read_text())
          b=json.loads(Path("research/evidence/q076_input_freeze_result.json").read_text())
          a=json.loads(Path("research/authorizations/q076_performance_2026_09_28.json").read_text())
          assert c["status"]=="COVERAGE_PASSED"
          assert p["status"]=="PIT_PASSED"
          assert b["status"]=="INPUT_BUNDLE_FROZEN"
          assert a["source_receipts"]["coverage_result_fingerprint"]==c["result_fingerprint"]
          assert a["source_receipts"]["pit_result_fingerprint"]==p["result_fingerprint"]
          assert a["source_receipts"]["input_bundle_fingerprint"]==b["bundle_fingerprint"]
          print("Q076 IMMUTABLE PREREQUISITES OK")
          PY
      - name: Verify frozen input bundle paths
        run: |
          python - <<'PY'
          from pathlib import Path
          symbols=["SPG","CCI","EQIX","ESS","ARE","WY","PLD","KIM"]
          assert Path("research/runs/q076_coverage/T-2026-09-28-076-COVERAGE/snapshot_manifest.json").exists()
          assert Path("research/runs/q076_input_bundle/T-2026-09-28-076-INPUT-FREEZE/input_bundle_manifest.json").exists()
          for symbol in symbols:
              assert Path(f"research/runs/q076_coverage/T-2026-09-28-076-COVERAGE/datasets/{symbol}/1d.csv").exists()
              assert Path(f"research/runs/q076_input_bundle/T-2026-09-28-076-INPUT-FREEZE/{symbol}/adjusted_close.csv").exists()
          print("Q076 FROZEN INPUT FILES OK")
          PY
      - name: Run fixed-rule Q076 performance
        run: |
          python automation/q076_e1_e2_performance.py             --repo-root .             --preregistration research/preregistrations/q076_fresh_e1_e2_replication_2026_09_28.json             --authorization research/authorizations/q076_performance_2026_09_28.json             --output research/evidence/q076_performance_result.json
      - name: Validate result governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q076_performance_result.json").read_text())
          assert d["status"]=="COMPLETED"
          assert d["performance_evaluation"] is True and d["oos_evaluation"] is True and d["holdout_evaluation"] is True
          assert d["selection_used"] is False and d["holdout_used_for_selection"] is False
          assert d["governance"]["promotion_decision"] is False and d["governance"]["automatic_promotion"] is False
          assert set(d["arms"])=={"CONTROL_6SLEEVE_ENSEMBLE","E1_ALPHA_COMMON_MODE_THROTTLE","E2_TURNOVER_HYSTERESIS"}
          assert all(0<=arm["gates_passed"]<=13 for arm in d["arms"].values())
          print("Q076 RESULT GOVERNANCE OK")
          [print(k,f"{v['gates_passed']}/{v['gates_total']}") for k,v in d["arms"].items()]
          print("Q076_REPORT_FINGERPRINT:",d["report_fingerprint"])
          PY
      - name: Publish performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python -c 'import json,os,urllib.request; u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"; r=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}); print(json.load(urllib.request.urlopen(r,timeout=30))["object"]["sha"])')"
          export PUBLISH_MESSAGE="EVIDENCE: record Q076 fixed mechanism performance"
          python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$BASE_SHA" --file research/evidence/q076_performance_result.json=research/evidence/q076_performance_result.json
      - name: Upload performance result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q076-fixed-mechanism-performance
          path: research/evidence/q076_performance_result.json
          if-no-files-found: error
          retention-days: 30
