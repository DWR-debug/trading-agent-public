name: Q205 NLRB Source Feasibility

on:
  push:
    branches: [master]
    paths:
      - "research/frontier/q205_nlrb_union_certification_candidate_2026_10_05.json"
      - "docs/research_design/Q205_NLRB_UNION_CERTIFICATION_2026-10-05.md"
      - ".github/workflows/q205-nlrb-source-feasibility.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-q205-nlrb-source-feasibility
  cancel-in-progress: false

jobs:
  source_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Probe official NLRB routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          routes = {
              "recent_results": "https://www.nlrb.gov/reports/graphs-data/recent-election-results",
              "election_reports": "https://www.nlrb.gov/reports/agency-performance/election-reports",
              "historical_page": "https://www.nlrb.gov/reports/graphs-data/recent-election-results/date_issued/desc/100?page=1764",
          }
          out = {}
          for name, url in routes.items():
              req = urllib.request.Request(
                  url, headers={"User-Agent": "trading-agent-public/q205-source-feasibility"}
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  html = body.decode("utf-8", errors="replace")
                  out[name] = {
                      "url": url,
                      "http_status": getattr(resp, "status", 200),
                      "content_sha256": hashlib.sha256(body).hexdigest(),
                      "bytes": len(body),
                      "markers": {
                          "recent_election_results": "Recent Election Results" in html,
                          "election_reports": "Election Reports" in html,
                          "tally_issued_date": "Tally Issued Date" in html,
                          "case_number": "Case Number" in html,
                      },
                  }

          Path("research/runs").mkdir(exist_ok=True)
          receipt = {
              "schema_version": "1.0",
              "receipt_type": "q205_nlrb_source_feasibility",
              "status": "DISCOVERY_SOURCE_FEASIBILITY_COMPLETED",
              "candidate_id": "Q205",
              "routes": out,
              "historical_completeness_proven": False,
              "exact_public_clock_proven": False,
              "employer_to_issuer_mapping_frozen": False,
              "historical_pit_validated": False,
              "performance_authorized": False,
              "promotion_authorized": False,
              "live_execution": False,
              "scientific_boundary": {
                  "performance": False,
                  "holdout_selection": False,
                  "ranking": False,
                  "tuning": False,
                  "promotion": False,
                  "live_execution": False,
              },
              "safety": {
                  "paper_only": True,
                  "PAPER_ONLY": True,
                  "live_trading_enabled": False,
                  "LIVE_TRADING_ENABLED": False,
                  "orders_enabled": False,
                  "ORDERS_ENABLED": False,
                  "automatic_promotion": False,
                  "AUTOMATIC_PROMOTION": False,
              },
          }
          canonical = json.dumps(
              receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode()
          receipt["receipt_fingerprint"] = hashlib.sha256(canonical).hexdigest()
          Path("research/runs/q205_nlrb_source_feasibility_latest.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Persist source receipt
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/evidence
          cp research/runs/q205_nlrb_source_feasibility_latest.json research/evidence/q205_nlrb_source_feasibility_latest.json
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python automation/github_contents_publish.py               --repository "$GITHUB_REPOSITORY"               --branch master               --base-sha "$current_sha"               --file "research/evidence/q205_nlrb_source_feasibility_latest.json=research/evidence/q205_nlrb_source_feasibility_latest.json"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q205-nlrb-source-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q205_nlrb_source_feasibility_latest.json
          if-no-files-found: error
          retention-days: 30
