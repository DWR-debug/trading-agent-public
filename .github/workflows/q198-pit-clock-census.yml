name: Q198 Historical PIT Clock Census

on:
  push:
    branches: [master, "research/q198-pit-clock-census-2026-10-04"]
    paths:
      - "automation/q198_pit_clock_census.py"
      - "tests/test_q198_pit_clock_census.py"
      - ".github/workflows/q198-pit-clock-census.yml"
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trading-agent-q198-pit-clock-census
  cancel-in-progress: true

jobs:
  census:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q198_pit_clock_census.py

      - name: Run frozen historical census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q198_pit_clock_census
          python -m automation.q198_pit_clock_census --output "research/runs/q198_pit_clock_census/${GITHUB_RUN_ID}.json"

      - name: Validate PIT-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ["GITHUB_RUN_ID"]
          p=Path("research/runs/q198_pit_clock_census")/f"{run_id}.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          allowed={"Q198_PIT_CLOCK_CENSUS_COMPLETED","Q198_PIT_CLOCK_CENSUS_BLOCKED_SOURCE_ACCESS"}
          assert d["status"] in allowed
          assert d["frozen_dates"] == ["2020/01/10","2020/04/22","2020/12/16","2026/10/02"]
          assert all(v is False for v in d["scientific_boundary"].values())
          s=d["safety"]
          assert s["paper_only"] is True and s["live_trading_enabled"] is False and s["orders_enabled"] is False and s["automatic_promotion"] is False
          if d["status"] == "Q198_PIT_CLOCK_CENSUS_COMPLETED":
              assert d["aggregate"]["pages_parsed"] >= 3
          else:
              assert d["aggregate"]["pages_parsed"] == 0
              assert d["aggregate"]["pages_access_blocked"] == d["aggregate"]["pages_requested"]
          print("Q198_PIT_CENSUS_BOUNDARY_OK")
          PY

      - name: Persist latest receipt
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input="research/runs/q198_pit_clock_census/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q198_pit_clock_census_latest.json"
          cp "$input" "$latest"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file "$latest=$latest"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q198-pit-clock-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q198_pit_clock_census/
          if-no-files-found: error
          retention-days: 30
