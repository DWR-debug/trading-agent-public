name: Q077-R1 Fixed-Rule Performance Once

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q077r1_performance_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q077r1-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact performance trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q077r1_performance_once.trigger
          grep -Fx "RUN_Q077R1_FIXED_RULE_PERFORMANCE_ONCE=true" research/run_requests/q077r1_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-077R1-PERFORMANCE" research/run_requests/q077r1_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q077r1_performance_once.trigger

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pytest exchange-calendars statsmodels==0.15.0 pypdf

      - name: Fail-closed authorization, source and safety guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from config import settings
          from automation import q077r1_performance as runner
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          p=load('research/preregistrations/q077r1_performance_2026_09_30.json')
          a=load('research/authorizations/q077r1_performance_2026_09_30.json')
          r=load('research/governance/active_research_registry.json')
          c=load('research/evidence/q077r1_coverage_result.json')
          h=load('research/evidence/q077r1_pit_result.json')
          f=load('research/evidence/q077r1_input_freeze_result.json')
          assert p['trial_id']=='T-2026-09-30-077R1-PERFORMANCE' and p['status']=='PREREGISTERED_PERFORMANCE'
          assert p['governance']['performance_trial_authorized'] is True
          assert a['trial_id']==p['trial_id'] and a['authorized'] is True and a['performance_execution_authorized'] is True and a['one_shot'] is True
          assert a['execution_scope']=='Q077R1_FIXED_RULE_PERFORMANCE_ONLY'
          canonical=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert a['preregistration_fingerprint']==canonical
          assert a['input_bundle_fingerprint']==p['data_contract']['input_bundle_fingerprint']
          e=next(x for x in r['active_trials'] if str(x.get('code'))=='077R1')
          assert e['trial_id']==p['trial_id'] and e['state']=='PERFORMANCE_AUTHORIZED' and e['performance_authorization_allowed'] is True
          assert c['status']=='COVERAGE_PASSED' and c['result_fingerprint']==p['data_contract']['coverage_result_fingerprint']
          assert h['status']=='PIT_PASSED' and h['result_fingerprint']==p['data_contract']['pit_result_fingerprint']
          assert f['status']=='INPUT_BUNDLE_FROZEN' and f['bundle_fingerprint']==p['data_contract']['input_bundle_fingerprint']
          assert c['performance_evaluation'] is False and h['performance_evaluation'] is False and f['performance_evaluation'] is False
          assert runner.TRIAL_ID==p['trial_id']
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          for key,path in {'performance_runner_sha256':'automation/q077r1_performance.py','alpha_mechanism_sha256':'automation/q067_alpha_mechanisms.py','cost_contract_sha256':'execution/cost_contract.py','settings_sha256':'config/settings.py','input_freeze_sha256':'automation/q077r1_input_freeze.py'}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==p['source_contract'][key]
          print('Q077R1 AUTH/SOURCE/SAFETY PASS')
          PY

      - name: Wait for exact Master CI Gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "Q077R1 T052 run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Contract regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q077r1_identity.py
          python -m py_compile automation/q077r1_performance.py automation/q077r1_reconcile.py

      - name: Execute Q077-R1 fixed-rule performance exactly once
        env:
          Q077R1_PERFORMANCE_ONCE: "true"
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q077r1_performance --preregistration research/preregistrations/q077r1_performance_2026_09_30.json --repo-root . --output research/evidence/q077r1_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q077r1_reconcile --repo-root . --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish Q077-R1 result, ledger and retired authorization
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
            test -n "$base_sha"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" --file research/evidence/q077r1_performance_result.json=research/evidence/q077r1_performance_result.json --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json --file research/governance/active_research_registry.json=research/governance/active_research_registry.json --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json; then
              echo 'Q077R1 performance result persisted'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload Q077-R1 performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q077r1-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q077r1_performance_result.json
          if-no-files-found: warn
          retention-days: 30
