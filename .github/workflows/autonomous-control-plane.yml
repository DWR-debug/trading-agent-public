name: Autonomous Resource Control Plane

on:
  push:
    branches:
      - master
    paths:
      - "agent_requests/**"
      - ".github/workflows/agent-request-queue.yml"
      - ".github/workflows/autonomous-control-plane.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: read
  pull-requests: read

concurrency:
  group: trading-agent-autonomous-control-plane
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Collect queue and resource state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/control"
          gh api "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > "$RUNNER_TEMP/control/issues.json"
          for lane in 0 1; do
            gh api "/repos/${GITHUB_REPOSITORY}/contents/agent_requests/lane${lane}" > "$RUNNER_TEMP/control/lane${lane}.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/control/lane${lane}.json"
          done
          export CONTROL_DIR="$RUNNER_TEMP/control"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["CONTROL_DIR"])
          requests = []
          for lane in ("0", "1"):
              payload = json.loads((root / f"lane{lane}.json").read_text(encoding="utf-8"))
              requests.extend(
                  {
                      "lane": lane,
                      "task_id": item["name"].removesuffix(".request"),
                      "path": item["path"],
                  }
                  for item in payload
                  if item.get("type") == "file" and item.get("name", "").endswith(".request")
              )
          (root / "requests.json").write_text(json.dumps(requests), encoding="utf-8")
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/" > "$RUNNER_TEMP/control/branches.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=200" > "$RUNNER_TEMP/control/runs.json"

      - name: Build and validate plan
        env:
          OWNER: ${{ github.repository_owner }}
          MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m automation.autonomous_control_plane             --issues "$RUNNER_TEMP/control/issues.json"             --requests "$RUNNER_TEMP/control/requests.json"             --branches "$RUNNER_TEMP/control/branches.json"             --runs "$RUNNER_TEMP/control/runs.json"             --owner "$OWNER"             --master-sha "$MASTER_SHA"             --output "$RUNNER_TEMP/control/plan.json"
          cat "$RUNNER_TEMP/control/plan.json"

      - name: Apply queue mutations
        run: |
          set -euo pipefail
          export CONTROL_DIR="$RUNNER_TEMP/control"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["CONTROL_DIR"])
          plan = json.loads((root / "plan.json").read_text(encoding="utf-8"))
          for item in plan["retire"]:
              p = Path(item["path"])
              if p.exists():
                  p.unlink()
          for item in plan["assign"]:
              p = Path(item["path"])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(
                  json.dumps({"issue_number": item["issue_number"], "task_id": item["task_id"]}) + "\n",
                  encoding="utf-8",
              )
          PY
          if git diff --quiet -- agent_requests && git diff --cached --quiet -- agent_requests && [ -z "$(git ls-files --others --exclude-standard -- agent_requests)" ]; then
            echo "No queue mutation required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_requests
          git commit -m "OPS: autonomous agent queue routing"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              pushed=true
              break
            fi
            echo "Master moved during queue publish; retry ${attempt}/3 after refresh."
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::AUTONOMOUS_CONTROL_PLANE_PUBLISH_RACE_EXHAUSTED"
            exit 1
          fi

      - name: Publish operational snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autonomous-control-plane-${{ github.run_id }}
          path: ${{ runner.temp }}/control/
          if-no-files-found: error
          retention-days: 14
