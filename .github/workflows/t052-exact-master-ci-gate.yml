name: T052 Exact Master CI Gate

on:
  push:
    branches: [master]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t052-exact-master-ci-gate
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.actor == github.repository_owner &&
            github.event.issue.pull_request == null &&
            github.event.comment.body == '/trading-agent t052-ci-once'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install full CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0 pypdf

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("SAFETY INVARIANTS OK")
          PY

      - name: Full test suite
        run: python -m pytest -q

      - name: Project integrity
        run: python automation/project_integrity_check.py

      - name: Project-state freshness
        run: python automation/project_state_freshness_check.py

      - name: Agent usage ledger
        run: python automation/agent_usage.py research/evidence/agent_usage_ledger.json

      - name: Canonical master provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          actual="$(git rev-parse origin/master)"
          if [ "$actual" != "${GITHUB_SHA}" ]; then
            echo "MASTER_MOVED_AFTER_TRIGGER=$actual"
            changed="$(git diff --name-only "${GITHUB_SHA}" "$actual")"
            bad="$(printf '%s\n' "$changed" | grep -Ev '^(docs/(CURRENT_STATUS\.md|PROJECT_CONTEXT\.md|DECISION_BASIS\.md|TRADING_AGENT_CHAT_ENTRYPOINT\.md)|automation/(s10_receipt_sync|sync_current_operational_status)\.py|tests/test_s10_receipt_sync\.py|research/evidence/|research/runs/|research/authorizations/|research/preregistrations/|research/governance/|research/run_requests/|ops/paper_forward(_2000)?/state/|ops/ai_worker_state/|ops/android_phone_runtime_status/|ops/s10_runtime_status\.json)' || true)"
            if [ -n "$bad" ]; then
              echo "MASTER_MOVED_WITH_NON_EVIDENCE_CODE_CHANGES"
              printf '%s\n' "$changed"
              exit 1
            fi
            echo "ONLY_OPERATIONAL_OR_EVIDENCE_DESCENDANT_ALLOWED"
          fi
          echo "EXACT_MASTER_CODE_SHA=${GITHUB_SHA}"

      - name: Report exact gate
        shell: bash
        run: |
          echo "T052_EXACT_MASTER_CI_GATE=PASS"
          echo "SOURCE_SHA=${GITHUB_SHA}"
