name: H06-P2-R1 One-Shot Performance Authorization

on:
  push:
    branches: [master]
    paths:
      - research/run_requests/h06_p2_r1_authorize_once.trigger
      - .github/workflows/h06-p2-r1-performance-authorization-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h06-p2-r1-one-shot-authorization
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          contains(join(github.event.commits.*.modified, ','), 'research/run_requests/h06_p2_r1_authorize_once.trigger')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact authorization request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact one-shot request
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/h06_p2_r1_authorize_once.trigger
          grep -Fx "AUTHORIZE_H06_P2_R1_PERFORMANCE=true" research/run_requests/h06_p2_r1_authorize_once.trigger
          grep -Fx "TRIAL_ID=T-2026-10-01-H06P2R1-PERFORMANCE-01" research/run_requests/h06_p2_r1_authorize_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/h06_p2_r1_authorize_once.trigger

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False"

      - name: Verify design-only state and immutable prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/h06_p2_r1_performance_2026_10_01.json").read_text(encoding="utf-8"))
          f=json.loads(Path("research/evidence/h06_p2_input_freeze_result.json").read_text(encoding="utf-8"))
          pit=json.loads(Path("research/evidence/h06_pit_independent_reproduction_2026_10_01.json").read_text(encoding="utf-8"))
          r=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          assert p["trial_id"]=="T-2026-10-01-H06P2R1-PERFORMANCE-01"
          assert p["status"]=="PREREGISTERED_DESIGN_ONLY"
          assert p["governance"]["performance_trial_authorized"] is False
          assert p["correction"]["prior_trial_id"]=="T-2026-10-01-H06P2-PERFORMANCE-01"
          assert p["correction"]["scientific_scope_changed"] is False
          assert p["input_contract"]["input_bundle_fingerprint"]==f["bundle_fingerprint"]
          assert p["input_contract"]["pit_check_fingerprint"]==pit["reconciliation"]["check_fingerprint"]
          assert pit["status"]=="PIT_REPRODUCED_RECONCILED"
          trials=[x for x in r["active_trials"] if x.get("code")=="H06-P2-R1"]
          designs=[x for x in r.get("active_design_families",[]) if x.get("code")=="H06-P2-R1"]
          assert len(trials)==1
          assert len(designs)==0
          entry=trials[0]
          assert entry["performance_authorization_allowed"] is False
          assert entry["state"]=="DESIGN_ONLY_ACTIVE"
          print("H06P2R1 DESIGN-ONLY GUARD PASS")
          PY

      - name: Contract tests
        run: python -m pytest -q tests/test_h06_p2_readiness.py tests/test_h06_p2_r1_performance.py

      - name: Wait for exact Master CI Gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "H06P2R1 T052 attempt=$attempt run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "H06P2R1_MASTER_CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "::error::H06P2 exact Master CI gate did not complete successfully"
          exit 1

      - name: Build exact one-shot authorization atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def fp(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()

          root=Path(".")
          prereg_path=root/"research/preregistrations/h06_p2_r1_performance_2026_10_01.json"
          auth_path=root/"research/authorizations/h06_p2_r1_performance_2026_10_01.json"
          registry_path=root/"research/governance/active_research_registry.json"
          trigger_path=root/"research/run_requests/h06_p2_r1_performance_once.trigger"
          prereg=json.loads(prereg_path.read_text(encoding="utf-8"))
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          trial="T-2026-10-01-H06P2R1-PERFORMANCE-01"
          assert prereg["trial_id"]==trial and prereg["status"]=="PREREGISTERED_DESIGN_ONLY"
          assert prereg["governance"]["performance_trial_authorized"] is False
          trial_entries=[x for x in registry["active_trials"] if x.get("code")=="H06-P2-R1"]
          design_entries=[x for x in registry.get("active_design_families",[]) if x.get("code")=="H06-P2-R1"]
          assert len(trial_entries)==1 or len(design_entries)==1
          if trial_entries:
              entry=trial_entries[0]
          else:
              source=design_entries[0]
              entry={
                "code":"H06-P2-R1",
                "trial_id":trial,
                "class":source.get("class","sector_residual_global_rank"),
                "state":"DESIGN_ONLY_ACTIVE",
                "parent_code":source.get("parent_code","H06"),
                "preregistration_path":"research/preregistrations/h06_p2_r1_performance_2026_10_01.json",
                "performance_authorization_allowed":False
              }
              registry["active_trials"].append(entry)
              registry["active_design_families"]=[x for x in registry.get("active_design_families",[]) if x.get("code")!="H06-P2"]
          assert entry["state"]=="DESIGN_ONLY_ACTIVE" and entry["performance_authorization_allowed"] is False
          expected_paths={
            "performance_runner_sha256": root/"automation/h06_p2_r1_performance.py",
            "signal_kernel_sha256": root/"automation/h06_p2_signal.py",
            "cost_contract_sha256": root/"execution/cost_contract.py",
            "settings_sha256": root/"config/settings.py",
            "performance_test_sha256": root/"tests/test_h06_p2_r1_performance.py",
          }
          for key,path in expected_paths.items():
              prereg["source_contract"][key]=hashlib.sha256(path.read_bytes()).hexdigest()
          prereg["status"]="PREREGISTERED_PERFORMANCE"
          prereg["governance"]["performance_trial_authorized"]=True
          prereg["authorization"]={
            "current_status":"AUTHORIZED_ONE_SHOT",
            "authorization_id":"AUTH-H06P2R1-2026-10-01-01",
            "master_ci_run_id":int(os.environ["H06P2R1_MASTER_CI_RUN_ID"])
          }
          prereg_fp=fp(prereg)
          auth={
            "schema_version":"1.0","authorization_contract_version":2,
            "authorization_id":"AUTH-H06P2R1-2026-10-01-01","trial_id":trial,
            "authorized":True,"performance_execution_authorized":True,
            "execution_scope":"H06_P2_FIXED_RULE_PERFORMANCE_ONLY","one_shot":True,
            "preregistration_path":"research/preregistrations/h06_p2_r1_performance_2026_10_01.json",
            "preregistration_fingerprint":prereg_fp,
            "input_bundle_fingerprint":prereg["input_contract"]["input_bundle_fingerprint"],
            "source_receipts":{
              "coverage_fingerprint":prereg["input_contract"]["coverage_fingerprint"],
              "snapshot_fingerprint":prereg["input_contract"]["snapshot_fingerprint"],
              "pit_check_fingerprint":prereg["input_contract"]["pit_check_fingerprint"],
              "input_bundle_trial_id":prereg["input_contract"]["input_bundle_trial_id"],
              "input_bundle_fingerprint":prereg["input_contract"]["input_bundle_fingerprint"]
            },
            "source_contract":prereg["source_contract"],
            "authorization_basis":{
              "requested_by_user":True,
              "master_ci_run_id":int(os.environ["H06P2R1_MASTER_CI_RUN_ID"]),
              "selection_used":False,
              "holdout_used_for_selection":False
            },
            "selection":False,"holdout_used_for_selection":False,
            "parameter_search":False,"threshold_search":False,"asset_search":False,
            "horizon_search":False,"variant_search":False,"sector_map_search":False,
            "family_ranking":False,"promotion_decision":False,
            "safety":{"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          }
          entry["state"]="PERFORMANCE_AUTHORIZED"
          entry["performance_authorization_allowed"]=True
          entry["authorization_id"]=auth["authorization_id"]
          prereg_path.write_text(json.dumps(prereg,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          auth_path.parent.mkdir(parents=True,exist_ok=True)
          auth_path.write_text(json.dumps(auth,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          registry_path.write_text(json.dumps(registry,indent=2,ensure_ascii=False,allow_nan=False)+"\n",encoding="utf-8")
          trigger_path.write_text("RUN_H06_P2_R1_PERFORMANCE_ONCE=true\nTRIAL_ID=T-2026-10-01-H06P2R1-PERFORMANCE-01\nONE_SHOT=true\n",encoding="utf-8")
          print("H06P2R1 AUTHORIZATION PREPARED")
          print("H06P2R1_PREREGISTRATION_FINGERPRINT="+prereg_fp)
          PY
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py \
            --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" \
            --file research/preregistrations/h06_p2_r1_performance_2026_10_01.json=research/preregistrations/h06_p2_r1_performance_2026_10_01.json \
            --file research/authorizations/h06_p2_r1_performance_2026_10_01.json=research/authorizations/h06_p2_r1_performance_2026_10_01.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/run_requests/h06_p2_r1_performance_once.trigger=research/run_requests/h06_p2_r1_performance_once.trigger

      - name: Upload authorization receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h06-p2-r1-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/authorizations/h06_p2_r1_performance_2026_10_01.json
          if-no-files-found: warn
          retention-days: 30
