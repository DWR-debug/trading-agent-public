name: Q220 As-Filed SEC-XBRL Population Repair

on:
  push:
    branches: [master]
    paths:
      - "automation/q220_as_filed_xbrl_population_gate.py"
      - "tests/test_q220_as_filed_xbrl_population_gate.py"
      - "automation/q220_population_freshness_gate.py"
      - "tests/test_q220_population_freshness_gate.py"
      - "research/preregistrations/q220_as_filed_xbrl_population_contract_2026_10_06.json"
      - "docs/research_design/Q220_AS_FILED_XBRL_REPAIR_2026-10-06.md"
      - ".github/workflows/q220-as-filed-xbrl-population.yml"
      - "automation/q220_stale_run_retirement.py"
      - "research/run_requests/q220_stale_run_retirement_2026_10_12.json"
      - "tests/test_q220_stale_run_retirement.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force population repair even when the current positive receipt matches code and contract hashes."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  receipt_gate:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_population: ${{ steps.freshness.outputs.run_population }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check population receipt, code hash, contract hash, and safety
        id: freshness
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          set -euo pipefail
          python -m automation.q220_population_freshness_gate --force "$FORCE_REBUILD" --github-output "$GITHUB_OUTPUT"

  route_probe:
    needs: [receipt_gate]
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      needs.receipt_gate.result == 'success' &&
      needs.receipt_gate.outputs.run_population == 'true'
    concurrency:
      group: trading-agent-research-hosted-ubuntu-24.04-slot-1
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run bounded raw-archive route probe
        run: |
          set -euo pipefail
          mkdir -p research/runs/q220/as_filed_route/${{ github.run_id }}
          python -m automation.q220_as_filed_xbrl_population_gate --mode route --output research/runs/q220/as_filed_route/${{ github.run_id }}/receipt.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q220-as-filed-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q220/as_filed_route/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30

  retire_stale_queued_runs:
    needs: [receipt_gate]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'DWR-debug/trading-agent-public' &&
      needs.receipt_gate.result == 'success' &&
      needs.receipt_gate.outputs.run_population == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Retire only the two receipt-stale queued Q220 jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m automation.q220_stale_run_retirement

  population:
    needs: [receipt_gate]
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (needs.receipt_gate.result != 'success' ||
       needs.receipt_gate.outputs.run_population == 'true')
    concurrency:
      group: trading-agent-q220-as-filed-population
      cancel-in-progress: true
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\\python-3.13.15-nuget-q220"
          set "PY_EXE=%PY_ROOT%\\tools\\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\\python.3.13.15-q220.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m ensurepip --upgrade >nul 2>&1
          endlocal
      - name: Run full bounded historical population
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\\python-3.13.15-nuget-q220\\tools\\python.exe"
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          set "PYTHONPATH=%GITHUB_WORKSPACE%"
          if not exist "research\\runs\\q220\\as_filed_population\\%GITHUB_RUN_ID%" mkdir "research\\runs\\q220\\as_filed_population\\%GITHUB_RUN_ID%"
          "%PY_EXE%" -m automation.q220_as_filed_xbrl_population_gate --mode population --output "research\\runs\\q220\\as_filed_population\\%GITHUB_RUN_ID%\\receipt.json"
          endlocal
      - name: Publish population receipt
        if: always()
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\\python-3.13.15-nuget-q220\\tools\\python.exe"
          set "RECEIPT=research\\runs\\q220\\as_filed_population\\%GITHUB_RUN_ID%\\receipt.json"
          if not exist "%RECEIPT%" (
            echo Q220_POPULATION_RECEIPT_MISSING=TRUE
            exit /b 0
          )
          if not exist "%PY_EXE%" exit /b 1
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          rem The publisher resolves master through the authenticated GitHub API itself;
          rem do not depend on a separately installed gh.exe on this Windows runner.
          set "PUBLISH_MESSAGE=EVIDENCE: persist Q220 as-filed XBRL population receipt"
          "%PY_EXE%" automation\\github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha latest --file research/evidence/q220_as_filed_xbrl_population_latest.json="%RECEIPT%"
          if errorlevel 1 exit /b 1
          endlocal
      - name: Enforce positive population receipt
        if: always()
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\\python-3.13.15-nuget-q220\\tools\\python.exe"
          set "RECEIPT=research\\runs\\q220\\as_filed_population\\%GITHUB_RUN_ID%\\receipt.json"
          if not exist "%PY_EXE%" exit /b 1
          if not exist "%RECEIPT%" exit /b 1
          "%PY_EXE%" -c "import json,sys; r=json.load(open(r'%RECEIPT%',encoding='utf-8')); ok=(r.get('candidate_id')=='Q220' and r.get('mode')=='population' and r.get('status')=='Q220_AS_FILED_XBRL_POPULATION_COMPLETED' and int(r.get('failure_count',1))==0); print('Q220_POPULATION_POSITIVE='+str(ok).lower()); sys.exit(0 if ok else 1)"
          if errorlevel 1 exit /b 1
          endlocal
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q220-as-filed-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q220/as_filed_population/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
