name: RCCSM Conflict Transition Diagnostic (parallel)

on:
  push:
    branches: [master]
    paths:
      - "automation/rccsm_transition_diagnostics.py"
      - "tests/test_rccsm_transition_diagnostics.py"
      - "docs/research_design/RCCSM_CONFLICT_TRANSITION_DIAGNOSTIC_2026-09-28.md"
      - "research/runs/q089_coverage/T-2026-09-28-089-COVERAGE/snapshot_manifest.json"
      - "research/evidence/q089_coverage_result.json"
      - ".github/workflows/rccsm-transition-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rccsm-transition-diagnostic
  cancel-in-progress: true

jobs:
  cloud:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Structural tests
        run: python -m pytest -q tests/test_rccsm_transition_diagnostics.py
      - name: Real frozen snapshot diagnostic
        run: python -m automation.rccsm_transition_diagnostics --manifest research/runs/q089_coverage/T-2026-09-28-089-COVERAGE/snapshot_manifest.json --output research/runs/rccsm_transition/q089_conflict_transition.json
      - name: Upload cloud diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rccsm-transition-cloud-${{ github.run_id }}
          path: research/runs/rccsm_transition/q089_conflict_transition.json
          if-no-files-found: error
          retention-days: 30

  self_hosted:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-transition-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-rccsm-transition-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal
      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-transition"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-transition.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal
      - name: Run transition diagnostic
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-transition-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-transition\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m pytest -q tests/test_rccsm_transition_diagnostics.py || exit /b 1
          if not exist "research\runs\rccsm_transition" mkdir "research\runs\rccsm_transition"
          "%PY_EXE%" -m automation.rccsm_transition_diagnostics --manifest "research\runs\q089_coverage\T-2026-09-28-089-COVERAGE\snapshot_manifest.json" --output "research\runs\rccsm_transition\q089_conflict_transition.json" || exit /b 1
          endlocal
      - name: Stage PC diagnostic
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-transition-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not exist "%GITHUB_WORKSPACE%\research\runs\rccsm_transition" mkdir "%GITHUB_WORKSPACE%\research\runs\rccsm_transition"
          copy /Y "%REPO_SRC%\research\runs\rccsm_transition\q089_conflict_transition.json" "%GITHUB_WORKSPACE%\research\runs\rccsm_transition\q089_conflict_transition.json" || exit /b 1
          endlocal
      - name: Upload PC diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rccsm-transition-pc-${{ github.run_id }}
          path: research/runs/rccsm_transition/q089_conflict_transition.json
          if-no-files-found: error
          retention-days: 30
