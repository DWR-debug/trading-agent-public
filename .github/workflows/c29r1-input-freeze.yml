name: C29R1 Input Freeze

on:
  push:
    branches: [master]
    paths:
      - "automation/c29r1_input_freeze.py"
      - "tests/test_c29r1_input_freeze.py"
      - ".github/workflows/c29r1-input-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c29r1-input-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Download exact C29R1 coverage artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11111130029
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36741493347
          path: _c29r1_coverage
          merge-multiple: true

      - name: Verify coverage artifact geometry
        shell: bash
        run: |
          set -euo pipefail
          test -s "_c29r1_coverage/c29r1_coverage/T-2026-09-30-C29R1-COVERAGE-PIT/coverage_preflight_20260930T160439Z.json"
          for symbol in PPG GWW PGR TT ICE KLAC SNA SWK; do
            test -s "_c29r1_coverage/c29r1_coverage/T-2026-09-30-C29R1-COVERAGE-PIT/datasets/$symbol/1d.csv"
          done

      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Input-freeze contract tests
        run: python -m pytest -q tests/test_c29r1_input_freeze.py

      - name: Build immutable input bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.c29r1_input_freeze             --source-root _c29r1_coverage             --output-root research/runs/c29r1_input_bundle             --receipt research/evidence/c29r1_input_freeze_result.json

      - name: Verify frozen bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("research/runs/c29r1_input_bundle/T-2026-09-30-C29R1-INPUT-FREEZE")
          manifest=json.loads((root/"input_bundle_manifest.json").read_text(encoding="utf-8"))
          receipt=json.loads(Path("research/evidence/c29r1_input_freeze_result.json").read_text(encoding="utf-8"))
          assert manifest["trial_id"]=="T-2026-09-30-C29R1-INPUT-FREEZE"
          assert manifest["bundle_fingerprint"]==receipt["bundle_fingerprint"]
          copy=dict(manifest)
          got=copy.pop("bundle_fingerprint")
          calc=hashlib.sha256(json.dumps(copy,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert got==calc
          assert receipt["status"]=="INPUT_BUNDLE_FROZEN"
          assert receipt["performance_evaluation"] is False
          assert receipt["performance_authorized"] is False
          print("C29R1 INPUT FREEZE VERIFIED")
          print("BUNDLE_FINGERPRINT:",got)
          PY

      - name: Publish immutable freeze receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/c29r1_input_freeze_result.json=research/evidence/c29r1_input_freeze_result.json

      - name: Upload immutable input bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29r1-input-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/evidence/c29r1_input_freeze_result.json
            research/runs/c29r1_input_bundle/T-2026-09-30-C29R1-INPUT-FREEZE/
          if-no-files-found: error
          retention-days: 30
