name: Q218 Focused Research Wave
run-name: Q218 Focused Source-PIT \${{ matrix.gate }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused_gate:
    name: Q218 \${{ matrix.gate }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gate:
          - source_multichannel
          - event_pair_lineage
    concurrency:
      group: trading-agent-q218-focused-\${{ matrix.gate }}
      cancel-in-progress: false
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\q218-focused-python-3.13.15"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q218-focused.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas exchange-calendars pypdf || exit /b 1
          set "PYTHONPATH=%GITHUB_WORKSPACE%"
          if /I "\${{ matrix.gate }}"=="source_multichannel" (
            "%PY_EXE%" -m automation.q218_sec_multichannel_source_gate --output "research\runs\q218_focused\%GITHUB_RUN_ID%\source_multichannel\receipt.json" || exit /b 1
            "%PY_EXE%" -m pytest -q tests/test_q218_sec_multichannel_source_gate.py tests/test_q218_q221_candidate_gate_compiler.py || exit /b 1
          )
          if /I "\${{ matrix.gate }}"=="event_pair_lineage" (
            "%PY_EXE%" -m automation.q218_sec_event_pair_lineage_gate --output "research\runs\q218_focused\%GITHUB_RUN_ID%\event_pair_lineage\receipt.json" || exit /b 1
            "%PY_EXE%" -m pytest -q tests/test_q218_sec_event_pair_lineage_gate.py tests/test_q218_q221_candidate_gate_compiler.py || exit /b 1
          )
          endlocal
      - name: Enforce scientific boundary
        shell: cmd
        run: echo Q218_BOUNDARY=PAPER_ONLY_NO_PERFORMANCE_NO_HOLDOUT_NO_RANKING_NO_TUNING_NO_PROMOTION_NO_LIVE_EXECUTION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: q218-focused-\${{ matrix.gate }}-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: research/runs/q218_focused/\${{ github.run_id }}/\${{ matrix.gate }}/
          if-no-files-found: warn
          retention-days: 30

  completion_relay:
    if: \${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    needs: [focused_gate]
    uses: ./.github/workflows/research-completion-relay.yml
    with:
      source_workflow: "Q218 Focused Research Wave"
