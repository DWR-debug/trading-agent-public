name: AI Credit Availability Planner

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "research/governance/ai_provider_credit_policies_2026_10_04.json"
      - "automation/ai_credit_scheduler.py"
      - "tests/test_ai_credit_scheduler.py"
      - "automation/ai_worker_fabric.py"
      - "ops/ai_credit_scheduler_tasks.json"

permissions:
  contents: write

concurrency:
  group: trading-agent-ai-credit-availability-planner
  cancel-in-progress: true

jobs:
  plan:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compute deterministic availability plan
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.ai_credit_scheduler             --tasks ops/ai_credit_scheduler_tasks.json             --output ops/ai_credit_availability_plan.json
      - name: Validate non-authorizing scheduler output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("ops/ai_credit_availability_plan.json").read_text(encoding="utf-8"))
          assert d["policy_is_non_authorizing"] is True
          assert d["paid_usage_allowed"] is False
          assert d["scientific_evidence_created"] is False
          assert all("eligible" in v and "confidence" in v for v in d["provider_availability"].values())
          print("AI_CREDIT_SCHEDULER_OK")
          PY
      - name: Publish deterministic availability plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(base64 -w 0 ops/ai_credit_availability_plan.json)"
          file="ops/ai_credit_availability_plan.json"
          for _ in 1 2 3 4 5; do
            sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$file?ref=master" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$file" -f message='OPS: update AI credit availability plan' -f content="$payload" -f branch='master' -f sha="$sha" >/dev/null; then exit 0; fi
            else
              if gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$file" -f message='OPS: update AI credit availability plan' -f content="$payload" -f branch='master' >/dev/null; then exit 0; fi
            fi
            sleep 2
          done
          echo "unable to publish planner output" >&2
          exit 1
      - name: Upload planner output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-credit-availability-${{ github.run_id }}
          path: ops/ai_credit_availability_plan.json
          if-no-files-found: error
          retention-days: 14
