  push:
    branches: [master]
    paths:
      - "automation/q220_primary_source_vintage_forensics.py"
      - "automation/q220_http_representation_sensitivity.py"
      - "tests/test_q220_http_representation_sensitivity.py"
      - "research/run_requests/q220_http_representation_sensitivity.trigger"
      - "docs/research_design/Q220_HTTP_REPRESENTATION_SENSITIVITY_2026-10-13.md"
      - ".github/workflows/q220-http-representation-sensitivity.yml"
      - "tests/test_q220_primary_source_vintage_forensics.py"
      - "automation/q220_single_feed_boundary_validation.py"
      - "automation/q220_submission_text_provenance.py"
      - "tests/test_q220_submission_text_provenance.py"
      - ".github/workflows/q220-submission-text-provenance.yml"
      - "research/run_requests/q220_submission_text_provenance.trigger"
      - "tests/test_q220_single_feed_boundary_validation.py"
      - "automation/planned_capacity_fast_dispatch.py"
      - "tests/test_planned_capacity_fast_dispatch.py"
      - "tests/test_q104_i19_13f_historical_identity_census.py"
      - "tests/test_q104_i19_historical_identity_census.py"
      - "tests/test_q104_candidate_wave_contract.py"
      - "tests/test_q221_historical_source_vintage_gate.py"
      - "tests/test_q221_usaspending_public_clock_gate.py"
      - "tests/test_q221_historical_award_public_boundary.py"
      - "tests/test_q221_monthly_archive_inventory_probe.py"
      - "research/run_requests/q220_primary_source_vintage_forensics.trigger"
      - "research/run_requests/q220_single_feed_boundary_validation.trigger"
      - "research/run_requests/q221_transaction_parent_uei_probe.trigger"
      - "research/run_requests/q104_i19_filing_date_precedence_review.trigger"
      - "research/run_requests/q104_i19_targeted_acceptance_repair.trigger"
      - "research/run_requests/q221_monthly_archive_inventory.trigger"
      - "automation/wayback_cdx_metadata.py"
      - "automation/q127r2_finra_wayback_metadata.py"
      - "automation/q130r2_wikimedia_wayback_metadata.py"
      - "tests/test_wayback_cdx_metadata.py"
      - "tests/test_q127r2_finra_wayback_metadata.py"
      - "tests/test_q130r2_wikimedia_wayback_metadata.py"
      - "automation/q120r2_cftc_release_exception_inventory.py"
      - "tests/test_q120r2_cftc_release_exception_inventory.py"
      - "research/run_requests/q120r2_cftc_release_exception_inventory.trigger"
      - "research/preregistrations/q120r2_cftc_release_exception_inventory_2026_10_13.json"
      - "docs/research_design/Q120R2_CFTC_RELEASE_EXCEPTION_INVENTORY_2026-10-13.md"
      - ".github/workflows/q120r2-cftc-release-exception-inventory.yml"
      - "automation/q127r3_finra_commoncrawl_metadata.py"
      - "tests/test_q127r3_finra_commoncrawl_metadata.py"
      - "tests/test_q127r4_finra_official_listing_metadata.py"
      - "automation/q127r4_finra_official_listing_metadata.py"
      - "tests/test_q127r4_finra_official_listing_metadata.py"
      - "research/run_requests/q127r4_finra_official_listing_metadata.trigger"
      - "research/preregistrations/q127r4_finra_official_listing_metadata_2026_10_14.json"
      - "docs/research_design/Q127R4_FINRA_OFFICIAL_LISTING_METADATA_2026-10-14.md"
      - ".github/workflows/q127r4-finra-official-listing-metadata.yml"
      - "research/run_requests/q127r3_finra_commoncrawl_metadata.trigger"
      - "research/preregistrations/q127r3_finra_commoncrawl_metadata_2026_10_13.json"
      - "docs/research_design/Q127R3_FINRA_COMMONCRAWL_METADATA_2026-10-13.md"
      - ".github/workflows/q127r3-finra-commoncrawl-metadata.yml"
      - "research/run_requests/q127r2_finra_wayback_metadata.trigger"
      - "research/run_requests/q130r2_wikimedia_wayback_metadata.trigger"
      - ".github/workflows/q127r2-finra-wayback-metadata.yml"
      - ".github/workflows/q130r2-wikimedia-wayback-metadata.yml"
      - "research/preregistrations/q127r2_finra_wayback_metadata_2026_10_13.json"
      - "research/preregistrations/q130r2_wikimedia_wayback_metadata_2026_10_13.json"
      - "docs/research_design/Q127R2_FINRA_WAYBACK_METADATA_2026-10-13.md"
      - "docs/research_design/Q130R2_WIKIMEDIA_WAYBACK_METADATA_2026-10-13.md"
      - ".github/workflows/windows-candidate-gate-regression.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'DWR-debug/trading-agent-public'
    name: Windows bounded regression ${{ matrix.pack }}
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pack: [q220, q104, q221, q120, q127, q130]
    concurrency:
      group: trading-agent-windows-candidate-regression-${{ matrix.pack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Bootstrap pinned Python 3.13 and test dependencies
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-windows-regression"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-windows-regression.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          set "PIP_DEFAULT_TIMEOUT=60"
          set "PIP_RETRIES=5"
          "%PY_EXE%" -m pip install --disable-pip-version-check --retries 5 --timeout 60 pytest pandas exchange-calendars pypdf tzdata==2026.5
          if not errorlevel 1 goto :pip_install_ok
          echo PIP_INSTALL_ATTEMPT_1_FAILED; retrying once after transient index/network errors.
          timeout /t 10 /nobreak >nul
          "%PY_EXE%" -m pip install --disable-pip-version-check --retries 5 --timeout 60 pytest pandas exchange-calendars pypdf tzdata==2026.5
          if not errorlevel 1 goto :pip_install_ok
          echo PIP_INSTALL_ATTEMPT_2_FAILED; retrying final time after transient index/network errors.
          timeout /t 20 /nobreak >nul
          "%PY_EXE%" -m pip install --disable-pip-version-check --retries 5 --timeout 60 pytest pandas exchange-calendars pypdf tzdata==2026.5
          if errorlevel 1 exit /b 1
          :pip_install_ok
          "%PY_EXE%" -m pytest --version || exit /b 1
          endlocal
      - name: Run offline/mocked candidate and orchestrator regression tests
        shell: cmd
        env:
          REGRESSION_PACK: ${{ matrix.pack }}
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-windows-regression\tools\python.exe"
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          set "PYTHONPATH=%GITHUB_WORKSPACE%"
          if /I "%REGRESSION_PACK%"=="q220" (
            "%PY_EXE%" -m pytest -q tests/test_q220_primary_source_vintage_forensics.py tests/test_q220_single_feed_boundary_validation.py tests/test_q220_submission_text_provenance.py tests/test_planned_capacity_fast_dispatch.py tests/test_q220_http_representation_sensitivity.py
            if errorlevel 1 exit /b 1
          ) else if /I "%REGRESSION_PACK%"=="q104" (
            "%PY_EXE%" -m pytest -q tests/test_q104_i19_13f_historical_identity_census.py tests/test_q104_i19_historical_identity_census.py tests/test_q104_candidate_wave_contract.py tests/test_q104_i19_acceptance_repair.py
            if errorlevel 1 exit /b 1
          ) else if /I "%REGRESSION_PACK%"=="q221" (
            "%PY_EXE%" -m pytest -q tests/test_q221_historical_source_vintage_gate.py tests/test_q221_usaspending_public_clock_gate.py tests/test_q221_historical_award_public_boundary.py tests/test_q221_monthly_archive_inventory_probe.py
            if errorlevel 1 exit /b 1
          ) else if /I "%REGRESSION_PACK%"=="q120" (
            "%PY_EXE%" -m pytest -q tests/test_q120_cftc_source_feasibility.py tests/test_q120_cftc_positioning_state.py tests/test_q120r2_cftc_release_exception_inventory.py
            if errorlevel 1 exit /b 1
          ) else if /I "%REGRESSION_PACK%"=="q127" (
            "%PY_EXE%" -m pytest -q tests/test_q127r1_finra_regsho_historical_pit.py tests/test_wayback_cdx_metadata.py tests/test_q127r2_finra_wayback_metadata.py tests/test_q127r3_finra_commoncrawl_metadata.py tests/test_q127r4_finra_official_listing_metadata.py
            if errorlevel 1 exit /b 1
          ) else if /I "%REGRESSION_PACK%"=="q130" (
            "%PY_EXE%" -m pytest -q tests/test_q130r1_wikimedia_attention_source.py tests/test_wayback_cdx_metadata.py tests/test_q130r2_wikimedia_wayback_metadata.py
            if errorlevel 1 exit /b 1
          ) else (
            echo Unknown regression pack: %REGRESSION_PACK%
            exit /b 2
          )
          echo WINDOWS_REGRESSION_PAPER_ONLY_NO_PERFORMANCE_NO_HOLDOUT_NO_RANKING_NO_TUNING_NO_PROMOTION_NO_LIVE_EXECUTION
          endlocal
