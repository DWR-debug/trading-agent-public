name: Q079 Fresh E1 E2 Coverage and PIT

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q079_coverage_pit.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q079-coverage-pit
  cancel-in-progress: true

jobs:
  coverage-pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Verify design and safety
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q079_fresh_e1_e2_validation_2026_09_28.json").read_text())
          assert p["status"]=="PREREGISTERED_PERFORMANCE_DESIGN"
          assert p["symbols"]==["HAL","LRCX","OXY","COF","FIS","FISV","GM","LHX"]
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          print("Q079 DESIGN/SAFETY OK")
          PY
      - name: Fresh coverage
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python automation/q079_fresh_coverage.py             --preregistration research/preregistrations/q079_fresh_e1_e2_validation_2026_09_28.json             --output-root research/runs/q079_coverage             --result research/evidence/q079_coverage_result.json
      - name: PIT mutation validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python automation/q079_pit.py             --coverage-root research/runs/q079_coverage/T-2026-09-28-079-COVERAGE             --result research/evidence/q079_pit_result.json
      - name: Validate prerequisites
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q079_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q079_pit_result.json").read_text())
          assert c["trial_id"]=="T-2026-09-28-079-COVERAGE" and c["status"]=="COVERAGE_PASSED"
          assert p["trial_id"]=="T-2026-09-28-079-PIT" and p["status"]=="PIT_PASSED"
          assert c["performance_trial_authorized"] is False and p["performance_trial_authorized"] is False
          assert c["selection_used"] is False and p["selection_used"] is False
          print("Q079 COVERAGE/PIT OK")
          PY
      - name: Upload immutable Q079 coverage/PIT evidence
        uses: actions/upload-artifact@v6
        with:
          name: q079-coverage-pit
          path: |
            research/evidence/q079_coverage_result.json
            research/evidence/q079_pit_result.json
            research/runs/q079_coverage/T-2026-09-28-079-COVERAGE
          if-no-files-found: error
          retention-days: 30
