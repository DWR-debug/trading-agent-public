name: S10 Phone Research Worker

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/s10-phone-worker.yml"
      - "automation/s10_systemone_bridge.py"
      - "automation/s10_worker.py"
      - "automation/s10_utility_task.py"
      - "automation/evidence_critic_benchmark.py"
      - "automation/s10_runtime.py"
      - "scripts/s10_local_ai_start.sh"
      - "automation/s10_local_stack.py"
      - "automation/s10_acceptance.py"
      - "automation/s10_receipt_sync.py"
      - "tests/test_s10_utility_task.py"
      - "tests/test_s10_receipt_sync.py"
      - "research/governance/persistent_research_acceleration_contract.json"
      - "research/frontier/q126_q132_candidate_wave_2026_10_03.json"
      - "research/governance/critical_research_quality_control.json"
      - "research/frontier/q185_q186_candidate_wave_2026_10_04.json"
      - "research/frontier/q187_q192_candidate_wave_2026_10_04.json"
      - "research/frontier/q193_q196_candidate_wave_2026_10_04.json"
      - "research/frontier/q206_q210_information_dissemination_wave_2026_10_05.json"
      - "docs/research_design/INFORMATION_DISSEMINATION_LITERATURE_2026-10-05.md"
      - "automation/s10_mechanical_research_qa.py"
      - "tests/test_s10_mechanical_research_qa.py"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Bounded S10 task"
        required: false
        default: "mechanical_qa"
        type: choice
        options:
          - mechanical_qa
          - utility_review
          - evidence_critic
          - discovery_only

permissions:
  contents: read

concurrency:
  group: trading-agent-s10-phone
  cancel-in-progress: false

jobs:
  s10_phone:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    env:
      S10_SEED: "271828"
      S10_TASK: ${{ inputs.task || 'mechanical_qa' }}
    runs-on: [self-hosted, s10-phone, linux, ARM64]
    timeout-minutes: 30

    steps:
      - name: Download exact master snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s10-source"
          curl -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/s10-source/repo.tar.gz" \
            "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/s10-source/repo.tar.gz" -C "$RUNNER_TEMP/s10-source"
          echo "REPO_SRC=$(find "$RUNNER_TEMP/s10-source" -maxdepth 1 -type d -name 'trading-agent-public-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Run phone-side S10 discovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          mkdir -p "$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          python3 scripts/s10_termux_discovery.py > "$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID/discovery.json"
          cat "$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID/discovery.json"

      - name: Recover local S10 inference stack
        if: env.S10_TASK != 'discovery_only' && env.S10_TASK != 'mechanical_qa'
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          python3 -m automation.s10_local_stack \
            --repo-root "$REPO_SRC" \
            --descriptor "$HOME/.trading-agent/s10_interface.json" \
            --work-root "$HOME/.cache/trading-agent/s10/runs"

      - name: Verify local S10 inference interface
        if: env.S10_TASK == 'utility_review' || env.S10_TASK == 'evidence_critic'
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          python3 - <<'PY'
          import json
          from automation.s10_runtime import resolve
          d = resolve()
          print(json.dumps({k: d.get(k) for k in ("available","status","base_url","model","protocol_path","path")}, sort_keys=True))
          if not d.get("available"):
              raise SystemExit("S10 interface is not available after bounded recovery")
          PY

      - name: Run deterministic S10 mechanical research QA
        if: env.S10_TASK == 'mechanical_qa'
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          python3 -m automation.s10_mechanical_research_qa \
            --repo-root "$REPO_SRC" \
            --output "$OUT/mechanical_research_qa.json"
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from automation.q186_conservative_citation_visibility import conservative_public_date

          root = Path(__import__("os").environ["REPO_SRC"])

          assert conservative_public_date(
              citing_patent_grant_date=date(2024, 1, 2),
              upstream_patent_grant_date=date(2024, 3, 5),
              citation_present_in_citing_grant_document=True,
          ) == date(2024, 1, 2)
          assert conservative_public_date(
              citing_patent_grant_date=date(2024, 3, 5),
              upstream_patent_grant_date=date(2024, 3, 5),
              citation_present_in_citing_grant_document=True,
          ) is None
          assert conservative_public_date(
              citing_patent_grant_date=date(2024, 4, 1),
              upstream_patent_grant_date=date(2024, 3, 5),
              citation_present_in_citing_grant_document=True,
          ) is None
          assert conservative_public_date(
              citing_patent_grant_date=date(2024, 1, 2),
              upstream_patent_grant_date=date(2024, 3, 5),
              citation_present_in_citing_grant_document=False,
          ) is None

          inv = json.loads(
              (root / "research/frontier/q193_q196_candidate_wave_2026_10_04.json").read_text()
          )
          assert inv["status"] == "DESIGN_INVENTORY_ONLY"
          assert {x["id"] for x in inv["candidates"]} == {"Q193", "Q194", "Q195", "Q196"}
          policy = inv["policy"]
          for key in (
              "performance_authorized",
              "holdout_selection_allowed",
              "parameter_search_allowed",
              "asset_search_allowed",
              "threshold_search_allowed",
              "horizon_search_allowed",
              "variant_search_allowed",
              "family_ranking_allowed",
              "automatic_promotion",
          ):
              assert policy[key] is False, (key, policy[key])
          q193 = next(x for x in inv["candidates"] if x["id"] == "Q193")
          assert q193["priority"] == "C_GATED"
          assert q193["robustness_contract"]["no_composition_before_component_pit"] is True
          print("S10 embedded deterministic contract checks: PASS")
          PY
          cat "$OUT/mechanical_research_qa.json"

      - name: Run bounded S10 utility review
        if: env.S10_TASK == 'utility_review'
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          (
            set +e
            while true; do
              if ! curl -fsS --max-time 3 "http://127.0.0.1:8765/health" >/dev/null 2>&1; then
                python3 -m automation.s10_local_stack \
                  --repo-root "$REPO_SRC" \
                  --descriptor "$HOME/.trading-agent/s10_interface.json" \
                  --work-root "$HOME/.cache/trading-agent/s10/runs" || true
              fi
              sleep 5
            done
          ) &
          WATCHDOG_PID=$!
          cleanup() {
            kill "$WATCHDOG_PID" >/dev/null 2>&1 || true
            wait "$WATCHDOG_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 -m automation.s10_utility_task \
            --repo-root "$REPO_SRC" \
            --output "$OUT/utility_task.json"
          cat "$OUT/utility_task.json"

      - name: Run isolated S10 Evidence-Critic benchmark
        if: env.S10_TASK == 'evidence_critic'
        shell: bash
        env:
          S10_INTERFACE_PATH: "~/.trading-agent/s10_interface.json"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd "$REPO_SRC"
          OUT="$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          (
            set +e
            while true; do
              if ! curl -fsS --max-time 3 "http://127.0.0.1:8765/health" >/dev/null 2>&1; then
                echo "S10 watchdog: endpoint unavailable; attempting bounded local-stack recovery."
                python3 -m automation.s10_local_stack \
                  --repo-root "$REPO_SRC" \
                  --descriptor "$HOME/.trading-agent/s10_interface.json" \
                  --work-root "$HOME/.cache/trading-agent/s10/runs" || true
              fi
              sleep 5
            done
          ) &
          WATCHDOG_PID=$!
          cleanup() {
            kill "$WATCHDOG_PID" >/dev/null 2>&1 || true
            wait "$WATCHDOG_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 -m automation.s10_worker --output "$OUT/evidence_critic.json"
          cat "$OUT/evidence_critic.json"

      - name: Build S10 utility acceptance receipt after explicit benchmark
        if: env.S10_TASK == 'evidence_critic'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          RESULT="$OUT/evidence_critic.json"
          RECEIPT="$OUT/s10_acceptance_receipt.json"
          cd "$REPO_SRC"
          if [ ! -f "$RESULT" ]; then
            echo "No Evidence-Critic result was produced."
            exit 1
          fi
          python3 -m automation.s10_acceptance --result "$RESULT" --output "$RECEIPT"
          cat "$RECEIPT"

      - name: Create safe provenance receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$GITHUB_WORKSPACE/research/runs/s10_phone/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          files = []
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  files.append({
                      "path": str(p.relative_to(root)),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      "bytes": p.stat().st_size,
                  })
          receipt = {
              "schema_version": 1,
              "receipt_type": "s10_phone_run",
              "source_commit": os.environ.get("GITHUB_SHA"),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "s10_seed": os.environ.get("S10_SEED"),
              "task": os.environ.get("S10_TASK"),
              "files": files,
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
              "automatic_promotion": False,
              "formal_evidence_allowed": False,
              "scientific_evidence": False,
              "performance_authorization": False,
              "candidate_selection": False,
              "candidate_ranking": False,
              "promotion": False,
          }
          (root / "provenance_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload S10 phone receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: s10-phone-${{ github.run_id }}
          path: research/runs/s10_phone/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
