name: Q221 SAM.gov API Credential Preflight

on:
  push:
    branches: [master]
    paths: ["research/run_requests/q221_sam_api_credential_preflight.trigger"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'DWR-debug/trading-agent-public' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check whether the protected SAM.gov API key is configured
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q221_sam_api_credential_preflight \
            --output "$RUNNER_TEMP/q221_sam_api_credential_preflight.json"
          cat "$RUNNER_TEMP/q221_sam_api_credential_preflight.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the non-network preflight receipt
        uses: actions/upload-artifact@v6
        with:
          name: q221-sam-api-credential-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/q221_sam_api_credential_preflight.json
          if-no-files-found: error
          retention-days: 14
