name: Q068 Coverage and PIT
# OPS: retrigger after Windows evidence publisher SHA-capture hardening

on:
  push:
    branches: [master]
    paths:
      - "research/preregistrations/q068_fixed_mechanism_freeze_2026_09_28.json"
      - ".github/workflows/q068-coverage-pit.yml"
      - "automation/github_contents_publish.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q068-coverage-pit
  cancel-in-progress: false

jobs:
  q068:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 90
    steps:
      - name: Checkout frozen Q068 master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact source reference
        shell: cmd
        run: |
          @echo off
          echo Q068_EXACT_SOURCE_SHA=%GITHUB_SHA%
          if not defined GITHUB_SHA exit /b 1

      - name: Bootstrap pinned Python 3.13.15
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q068"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q068.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas || exit /b 1
          endlocal

      - name: Frozen identity and safety
        shell: cmd
        run: |
          @echo off
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          if /I not "%GITHUB_REF%"=="refs/heads/master" exit /b 1
          if not defined GITHUB_SHA exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; from config import settings; p=json.loads(Path('research/preregistrations/q068_fixed_mechanism_freeze_2026_09_28.json').read_text(encoding='utf-8')); assert p['status']=='PREREGISTERED_DESIGN_ONLY_FROZEN'; assert p['symbols']==['ETR','PPL','WEC','FE','D','EXR','PSA','O']; assert p['target_common_candles']==3500; assert p['governance']['performance_trial_authorized'] is False; assert p['governance']['holdout_used_for_selection'] is False; assert p['safety']=={'paper_only':True,'live_trading_enabled':False,'orders_enabled':False,'automatic_promotion':False}; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('Q068 FROZEN SAFETY OK')"

      - name: Q068 focused tests
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -m pytest -q tests/test_q068_e1_e2_validation.py tests/test_canonical_snapshot.py || exit /b 1

      - name: Fresh coverage
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -m automation.q068_fresh_coverage --preregistration research/preregistrations/q068_fixed_mechanism_freeze_2026_09_28.json --output-root research/runs/q068_coverage --result research/evidence/q068_coverage_result.json || exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; d=json.loads(Path('research/evidence/q068_coverage_result.json').read_text(encoding='utf-8')); assert d['trial_id']=='T-2026-09-28-068-COVERAGE'; assert d['status']=='COVERAGE_PASSED'; assert d['performance_trial_authorized'] is False; assert d['selection_used'] is False; print('Q068 COVERAGE PASSED'); print('Q068_COVERAGE_FINGERPRINT:',d['result_fingerprint']); print('Q068_SNAPSHOT_FINGERPRINT:',d['snapshot_fingerprint'])" || exit /b 1

      - name: PIT mutation validation
        shell: cmd
        run: |
          @echo off
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -m automation.q068_pit --coverage-root research/runs/q068_coverage/T-2026-09-28-068-COVERAGE --result research/evidence/q068_pit_result.json || exit /b 1
          "%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe" -c "import json; from pathlib import Path; d=json.loads(Path('research/evidence/q068_pit_result.json').read_text(encoding='utf-8')); assert d['trial_id']=='T-2026-09-28-068-PIT'; assert d['status']=='PIT_PASSED'; assert d['performance_trial_authorized'] is False; assert d['selection_used'] is False; assert d['future_mutation_checks_passed'] is True; assert d['next_session_mutation_checks_passed'] is True; print('Q068 PIT PASSED'); print('Q068_PIT_FINGERPRINT:',d['result_fingerprint'])" || exit /b 1

      - name: Persist Q068 preflight evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-q068\tools\python.exe"
          if not exist "%PY_EXE%" exit /b 1
          set "PUBLISH_MESSAGE=EVIDENCE: record Q068 coverage and PIT preflight"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r))['object']['sha'])" > "%RUNNER_TEMP%\\q068_base_sha.txt" || exit /b 1
          set /p BASE_SHA=<"%RUNNER_TEMP%\\q068_base_sha.txt"
          if not defined BASE_SHA exit /b 1
          "%PY_EXE%" "%GITHUB_WORKSPACE%\automation\github_contents_publish.py" --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/evidence/q068_coverage_result.json=research\evidence\q068_coverage_result.json --file research/evidence/q068_pit_result.json=research\evidence\q068_pit_result.json
          if errorlevel 1 exit /b 1
          endlocal

      - name: Publish Q068 summary
        if: always()
        shell: cmd
        run: |
          @echo off
          if exist research\evidence\q068_coverage_result.json type research\evidence\q068_coverage_result.json
          if exist research\evidence\q068_pit_result.json type research\evidence\q068_pit_result.json
          echo Q068_RUNNER=%RUNNER_NAME%
          echo Q068_SHA=%GITHUB_SHA%
          echo Q068_RUN_ID=%GITHUB_RUN_ID%
