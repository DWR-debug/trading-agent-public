name: Q081-R3 Fixed-Rule Performance Once

on:
  # Historical/completed execution path: manual dispatch only. Automatic re-triggering is retired.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q081r3-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 693 &&
          !github.event.issue.pull_request &&
          github.event.comment.body == 'RUN_Q081R3_FIXED_RULE_PERFORMANCE_ONCE' &&
          github.event.comment.user.login == github.repository_owner
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact Q081R3 trigger and dispatch intent
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q081r3_performance_once.trigger
          grep -Fx "RUN_Q081R3_FIXED_RULE_PERFORMANCE_ONCE=true" research/run_requests/q081r3_performance_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-30-081R3-PERFORMANCE" research/run_requests/q081r3_performance_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q081r3_performance_once.trigger
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            test "$GITHUB_EVENT_PATH" != ""
          fi

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pytest exchange-calendars statsmodels==0.15.0

      - name: Fail-closed authorization and source contract guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from config import settings
          import automation.q081r3_python_literal_fix_performance as runner
          prereg=json.loads(Path("research/preregistrations/q081r3_python_literal_fix_2026_09_30.json").read_text(encoding="utf-8"))
          auth=json.loads(Path("research/authorizations/q081r3_python_literal_fix_2026_09_30.json").read_text(encoding="utf-8"))
          registry=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          assert prereg["trial_id"]=="T-2026-09-30-081R3-PERFORMANCE"
          assert prereg["governance"]["performance_trial_authorized"] is True
          assert auth["trial_id"]==prereg["trial_id"] and auth["authorized"] is True and auth["performance_execution_authorized"] is True and auth["one_shot"] is True
          assert auth["execution_scope"]=="Q081R3_FIXED_RULE_PERFORMANCE_ONLY"
          assert auth["preregistration_fingerprint"]==hashlib.sha256(json.dumps(prereg,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          entry=next(x for x in registry["active_trials"] if x.get("code")=="081R3")
          assert entry["trial_id"]==prereg["trial_id"] and entry["performance_authorization_allowed"] is True and entry["state"]=="PERFORMANCE_AUTHORIZED"
          assert runner.TRIAL_ID==prereg["trial_id"]
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          for path, expected in prereg["source_contract"].items():
              raw=Path(path).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              assert actual==expected,(path,actual,expected)
          print("Q081R3 AUTHORIZATION/SOURCE/SAFETY PASS")
          PY

      - name: Verify frozen preparation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q081r3_python_literal_fix_2026_09_30.json").read_text(encoding="utf-8"))
          c=json.loads(Path("research/evidence/q079_coverage_result.json").read_text(encoding="utf-8"))
          h=json.loads(Path("research/evidence/q079_pit_result.json").read_text(encoding="utf-8"))
          b=json.loads(Path("research/evidence/q079_input_freeze_result.json").read_text(encoding="utf-8"))
          i=json.loads(Path("research/evidence/q079_performance_execution_incident.json").read_text(encoding="utf-8"))
          dc=p["data_contract"]
          assert c["status"]=="COVERAGE_PASSED" and c["result_fingerprint"]==dc["coverage_result_fingerprint"] and c["snapshot_fingerprint"]==dc["snapshot_fingerprint"]
          assert h["status"]=="PIT_PASSED" and h["result_fingerprint"]==dc["pit_result_fingerprint"]
          assert b["status"]=="INPUT_BUNDLE_FROZEN" and b["bundle_fingerprint"]==dc["input_bundle_fingerprint"]
          assert i["status"]=="IMPLEMENTATION_INVALID_NO_SCIENTIFIC_OUTCOME"
          assert c["performance_evaluation"] is False and h["performance_evaluation"] is False and b["performance_evaluation"] is False
          print("Q081R3 FROZEN DATA/PIT/INPUT PASS")
          PY

      - name: Structural regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q081_execution_envelope.py tests/test_q081r3_identity.py tests/test_research_governance_audit.py
          python -m py_compile automation/q081r3_python_literal_fix_performance.py automation/q081r3_reconcile.py

      - name: Execute Q081R3 fixed-rule performance exactly once
        shell: bash
        env:
          Q081R3_PERFORMANCE_ONCE: "true"
        run: |
          set -euo pipefail
          python -m automation.q081r3_python_literal_fix_performance --preregistration research/preregistrations/q081r3_python_literal_fix_2026_09_30.json --repo-root . --output research/evidence/q081r3_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q081r3_reconcile --repo-root . --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish Q081R3 result, ledger and retired authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" \
            --file research/evidence/q081r3_performance_result.json=research/evidence/q081r3_performance_result.json \
            --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload Q081R3 performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q081r3-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q081r3_performance_result.json
          if-no-files-found: warn
          retention-days: 30
