name: Q121-R5 SEC Dual Index Population Reconciliation

on:
  pull_request:
    branches: [master]
    paths:
      - automation/q121r5_sec_dual_index_population_reconciliation.py
      - tests/test_q121r5_sec_dual_index_population_reconciliation.py
      - research/preregistrations/q121r5_sec_dual_index_population_reconciliation_2026_10_03.json
      - .github/workflows/q121r5-sec-dual-index-reconciliation.yml
  push:
    branches: [master]
    paths:
      - automation/q121r5_sec_dual_index_population_reconciliation.py
      - tests/test_q121r5_sec_dual_index_population_reconciliation.py
      - research/preregistrations/q121r5_sec_dual_index_population_reconciliation_2026_10_03.json
      - .github/workflows/q121r5-sec-dual-index-reconciliation.yml

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q121r5_sec_dual_index_population_reconciliation.py
      - name: Run Q121-R5
        run: python -m automation.q121r5_sec_dual_index_population_reconciliation --output research/runs/q121r5_sec_dual_index_reconciliation/result.json
      - name: Scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q121r5_sec_dual_index_reconciliation/result.json").read_text())
          assert p["status"] == "Q121R5_DUAL_INDEX_POPULATION_RECONCILIATION_COMPLETED"
          assert p["comparison"]["exact_row_multiset_equal"] is True
          assert p["comparison"]["left_only_key_count"] == 0
          assert p["comparison"]["right_only_key_count"] == 0
          assert p["interpretation"]["same_day_pit_safe"] is False
          assert all(v is False for v in p["governance"].values())
          assert p["safety"]["paper_only"] and not p["safety"]["live_trading_enabled"] and not p["safety"]["orders_enabled"]
          print("Q121R5_BOUNDARY=PASS")
          print("Q121R5_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q121r5-sec-dual-index-reconciliation-${{ github.run_id }}
          path: research/runs/q121r5_sec_dual_index_reconciliation/result.json
          if-no-files-found: error
          retention-days: 30
