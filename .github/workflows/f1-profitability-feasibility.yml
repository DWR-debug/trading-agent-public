name: F1 SEC Gross Profitability Source/PIT Feasibility

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/f1_profitability_feasibility.trigger"
      - "automation/f1_profitability_feasibility.py"
      - "tests/test_f1_profitability_feasibility.py"
      - ".github/workflows/f1-profitability-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-f1-profitability-feasibility
  cancel-in-progress: true

jobs:
  feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 60
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Bootstrap Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-f1"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-f1.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Run focused F1 tests
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-f1\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_f1_profitability_feasibility.py || exit /b 1

      - name: Verify research safety
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-f1\tools\python.exe"
          "%PY_EXE%" -c "from config import settings; assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False; print('F1 SAFETY OK')" || exit /b 1

      - name: Run source and PIT feasibility
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-f1\tools\python.exe"
          set "OUT=research\runs\f1_profitability\f1_source_pit_feasibility.json"
          "%PY_EXE%" automation\f1_profitability_feasibility.py --output "%OUT%" || exit /b 1

      - name: Persist deterministic feasibility receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-f1\tools\python.exe"
          set "BASE_SHA_FILE=%RUNNER_TEMP%\f1_base_sha.txt"
          "%PY_EXE%" -c "import json,os,urllib.request; u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/master'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); print(json.load(urllib.request.urlopen(r,timeout=30))['object']['sha'])" > "%BASE_SHA_FILE%" || exit /b 1
          set /p BASE_SHA=<"%BASE_SHA_FILE%"
          "%PY_EXE%" automation\github_contents_publish.py --repository "%GITHUB_REPOSITORY%" --branch master --base-sha "%BASE_SHA%" --file research/runs/f1_profitability/f1_source_pit_feasibility.json=research\runs\f1_profitability\f1_source_pit_feasibility.json || exit /b 1
          endlocal

      - name: Upload F1 feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f1-profitability-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/f1_profitability/f1_source_pit_feasibility.json
          if-no-files-found: warn
          retention-days: 30