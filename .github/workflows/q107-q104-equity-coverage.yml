name: Q107 Q104 Fresh Equity Coverage

on:
  push:
    branches: [master]
    paths:
      - "research/asset_universes.py"
      - "research/preregistrations/q107_q104_fresh_equity_coverage_2026_10_01.json"
      - "automation/coverage_preflight.py"
      - "data/canonical_snapshot.py"
      - "data/yahoo_loader.py"
      - "config/settings.py"
      - ".github/workflows/q107-q104-equity-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q107-q104-fresh-equity-coverage
  cancel-in-progress: true

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pandas

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Q107 coverage preflight
        run: |
          python -m automation.coverage_preflight \
            --preregistration research/preregistrations/q107_q104_fresh_equity_coverage_2026_10_01.json \
            --output-root research/runs/q107_coverage

      - name: Upload coverage receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q107-q104-equity-coverage-${{ matrix.runner }}-${{ github.run_id }}
          path: research/runs/q107_coverage/T-2026-10-01-107-Q104-COVERAGE
          if-no-files-found: error
          retention-days: 30
