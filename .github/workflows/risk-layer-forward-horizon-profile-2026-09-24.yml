name: Risk Layer Forward Horizon Profile 2026-09-24

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]
    paths:
      - "automation/risk_layer_forward_horizon_profile_2026_09_24.py"
      - "tests/test_risk_layer_forward_horizon_profile_2026_09_24.py"
      - "docs/risk_layer_forward_horizon_profile_2026_09_24_preregistration.md"
      - ".github/workflows/risk-layer-forward-horizon-profile-2026-09-24.yml"
      - "automation/candidate_validation_50_50_vol_budget.py"
      - "automation/risk_layer_drawdown_onset_2026_09_23.py"
      - "automation/risk_layer_forward_horizon_profile_2026_09_24.py"
      - "tests/test_risk_layer_forward_horizon_profile_2026_09_24.py"
      - "docs/risk_layer_forward_horizon_profile_2026_09_24_preregistration.md"
      - ".github/workflows/risk-layer-forward-horizon-profile-2026-09-24.yml"
      - "automation/candidate_validation_50_50_vol_budget.py"
      - "automation/risk_layer_drawdown_onset_2026_09_23.py"
      - "data/**"
      - "research/**"
      - "validation/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-risk-layer-forward-horizon-profile-2026-09-24
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Vier immutable Validierungsartefakte laden
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward_horizon_sources
          declare -A artifacts=(
            [10751817990]=candidate-validation-50-50-vol-budget-2026-09-23.zip
            [10740188093]=second-validation-2026-09-23.zip
            [10745697729]=third-validation-2026-09-23.zip
            [10753545703]=fourth-independent-validation-2026-09-23.zip
          )
          for artifact_id in "${!artifacts[@]}"; do
            file="/tmp/${artifacts[$artifact_id]}"
            gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"               > "$file"
            unzip -q "$file" -d /tmp/forward_horizon_sources
          done
          test -f /tmp/forward_horizon_sources/research/candidate_validation/report.json
          test -f /tmp/forward_horizon_sources/research/independent_validation_2026_09_23/report.json
          test -f /tmp/forward_horizon_sources/research/third_independent_validation_2026_09_23/report.json
          test -f /tmp/forward_horizon_sources/research/fourth_independent_validation_2026_09_23/report.json
          echo "IMMUTABLE_VALIDATION_ARTIFACTS_READY"

      - name: Preregistration fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.risk_layer_forward_horizon_profile_2026_09_24 import (
              CASES,
              HORIZONS,
              RESEARCH_COUNT,
          )
          assert RESEARCH_COUNT == 2798
          assert HORIZONS == (1, 5, 20, 60)
          assert [case["artifact_id"] for case in CASES] == [
              10751817990,
              10740188093,
              10745697729,
              10753545703,
          ]
          prereg = Path(
              "docs/risk_layer_forward_horizon_profile_2026_09_24_preregistration.md"
          )
          text = prereg.read_text(encoding="utf-8")
          for token in (
              "1 Research-Periode",
              "5 Research-Perioden",
              "20 Research-Perioden",
              "60 Research-Perioden",
              "unskalierte",
              "Holdout",
              ">=3/4",
              "PAPER_ONLY=True",
          ):
              assert token in text
          print("FORWARD_HORIZON_PREREGISTRATION_VERIFIED")
          PY

      - name: Forward-Horizon Diagnose ausführen
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from automation.risk_layer_forward_horizon_profile_2026_09_24 import analyze
          import json

          result = analyze(Path("/tmp/forward_horizon_sources"))
          output = Path(
              "research/risk_layer_forward_horizon_profile_2026_09_24/report.json"
          )
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(result, indent=2, ensure_ascii=False, allow_nan=False),
              encoding="utf-8",
          )
          print("FORWARD_HORIZON_PROFILE_STATUS:", result["status"])
          print("CONSENSUS:", result["consensus"])
          print("DIAGNOSTIC_FINGERPRINT:", result["diagnostic_fingerprint"])
          PY

      - name: Ergebnisintegrität und Research-only-Scope prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "research/risk_layer_forward_horizon_profile_2026_09_24/report.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          stored = result.pop("diagnostic_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  result,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert result["status"] == "COMPLETED"
          assert result["scope"]["holdout_used_for_decision"] is False
          assert result["scope"]["holdout_metrics_reported"] is False
          assert result["scope"]["parameter_search"] is False
          assert result["scope"]["strategy_mutation"] is False
          assert result["scope"]["asset_selection"] is False
          assert result["scope"]["gate_changes"] is False
          assert result["scope"]["production_mutation"] is False
          assert result["scope"]["new_data_downloads"] is False
          assert tuple(result["methodology"]["horizons_research_periods"]) == (
              1,
              5,
              20,
              60,
          )
          assert result["methodology"]["descriptive_not_causal"] is True
          assert result["safety"] == {
              "paper_only": True,
              "live_trading_enabled": False,
              "orders_enabled": False,
          }
          assert len(result["cases"]) == 4
          assert all(
              case["research_only_assertion"] is True
              for case in result["cases"].values()
          )
          print("FORWARD_HORIZON_RESULT_INTEGRITY_OK")
          print("DIAGNOSTIC_FINGERPRINT:", stored)
          print("CONSENSUS:", result["consensus"])
          PY

      - name: Diagnoseartefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-layer-forward-horizon-profile-2026-09-24-${{ github.run_id }}
          path: research/risk_layer_forward_horizon_profile_2026_09_24/
          if-no-files-found: error
          retention-days: 30
