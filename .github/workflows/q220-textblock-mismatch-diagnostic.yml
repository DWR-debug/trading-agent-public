name: Q220 TextBlock Differential Diagnostic

on:
  push:
    branches: [master]
    paths:
      - "automation/q220_textblock_mismatch_diagnostic.py"
      - "tests/test_q220_textblock_mismatch_diagnostic.py"
      - ".github/workflows/q220-textblock-mismatch-diagnostic.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q220-textblock-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test diagnostic primitives
        run: python -m pytest -q tests/test_q220_textblock_mismatch_diagnostic.py

      - name: Compare independent and compiler TextBlock text on three frozen mismatches
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.q220_textblock_mismatch_diagnostic \
            --output research/evidence/q220_textblock_mismatch_diagnostic_latest.json

      - name: Publish bounded diagnostic receipt, including fail-closed outcomes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="research/evidence/q220_textblock_mismatch_diagnostic_latest.json"
          test -s "$receipt"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$current_sha" \
              --file "$receipt=$receipt"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload immutable diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q220-textblock-mismatch-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q220_textblock_mismatch_diagnostic_latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate diagnostic-only safety boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("research/evidence/q220_textblock_mismatch_diagnostic_latest.json").read_text(encoding="utf-8"))
          print("Q220_TEXTBLOCK_DIAGNOSTIC_STATUS=" + str(receipt.get("status")))
          print("Q220_TEXTBLOCK_DIAGNOSTIC_RECORDS=" + str(receipt.get("records_checked", 0)))
          if receipt.get("diagnostic_only") is not True:
              raise SystemExit("Q220_DIAGNOSTIC_AUTHORITY_FLAG_MISSING")
          if receipt.get("gate_positive") is not False:
              raise SystemExit("Q220_DIAGNOSTIC_MUST_NOT_OPEN_GATE")
          if receipt.get("scientific_evidence") is not False:
              raise SystemExit("Q220_DIAGNOSTIC_SCIENTIFIC_BOUNDARY_FAILED")
          if receipt.get("performance_authorization") is not False:
              raise SystemExit("Q220_DIAGNOSTIC_PERFORMANCE_BOUNDARY_FAILED")
          safety = receipt.get("safety", {})
          if safety.get("paper_only") is not True:
              raise SystemExit("Q220_PAPER_ONLY_INVARIANT_FAILED")
          if safety.get("live_trading_enabled") is not False:
              raise SystemExit("Q220_LIVE_TRADING_INVARIANT_FAILED")
          if safety.get("orders_enabled") is not False:
              raise SystemExit("Q220_ORDERS_INVARIANT_FAILED")
          if safety.get("automatic_promotion") is not False:
              raise SystemExit("Q220_AUTOMATIC_PROMOTION_INVARIANT_FAILED")
          if receipt.get("status") != "Q220_TEXTBLOCK_DIAGNOSTIC_CAPTURED":
              raise SystemExit("Q220_TEXTBLOCK_DIAGNOSTIC_NOT_CAPTURED")
          PY
