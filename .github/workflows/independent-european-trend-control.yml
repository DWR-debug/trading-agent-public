name: Independent European Trend Control

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
    paths:
      - "automation/independent_european_trend_control.py"
      - "tests/test_independent_european_trend_control.py"
      - ".github/workflows/independent-european-trend-control.yml"
      - "automation/prepare_research_data.py"
      - "automation/literature_strategy_lab.py"
      - "research/asset_universes.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-independent-european-trend-control
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings

          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Europäische Research-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data \
            --target-count 2500 \
            --universe european_volatile \
            --output research/european_trend_manifest.json

      - name: Datenmanifest prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/european_trend_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))

          assert manifest["universe"] == "european_volatile"
          assert manifest["source"] == "yahoo_chart"
          assert len(manifest["datasets"]) == 4
          assert all(
              dataset["candle_count"] >= 1000
              for dataset in manifest["datasets"]
          )
          assert manifest["safety"]["paper_only"] is True
          assert manifest["safety"]["live_trading_enabled"] is False
          assert manifest["safety"]["orders_enabled"] is False

          print("EUROPEAN DATA MANIFEST VERIFIED")
          print("MANIFEST_FINGERPRINT:", manifest["manifest_fingerprint"])
          for dataset in manifest["datasets"]:
              print(
                  dataset["symbol"],
                  dataset["candle_count"],
                  dataset["data_start"],
                  dataset["data_end"],
              )
          PY

      - name: Unabhängigen Europa-Trend-Control ausführen
        run: |
          set -euo pipefail
          python -m automation.independent_european_trend_control \
            --data-dir data/market_data \
            --manifest research/european_trend_manifest.json \
            --output research/independent_european_trend_control/report.json

      - name: Ergebnis-Fingerprint prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/independent_european_trend_control/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["methodology"]["optimization_used"] is False
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["holdout_is_blind_to_selection"] is True
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          PY

      - name: Europa-Control-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-european-trend-control-${{ github.run_id }}
          path: |
            research/european_trend_manifest.json
            research/independent_european_trend_control/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
