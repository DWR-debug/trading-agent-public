name: Q071 Source Feasibility

on:
  push:
    branches:
      - research/q071-information-source-feasibility-20260928
    paths:
      - "research/exploration/q071_information_source_feasibility_2026_09_28.json"
      - "automation/q071_source_feasibility.py"
      - "tests/test_q071_information_source_feasibility.py"
      - ".github/workflows/q071-source-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Focused tests
        run: python -m pytest -q tests/test_q071_information_source_feasibility.py

      - name: Source feasibility sweep
        run: python automation/q071_source_feasibility.py

      - name: Publish source-feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q071-source-feasibility
          path: research/runs/q071_source_feasibility/source_feasibility.json
          if-no-files-found: error
          retention-days: 30
