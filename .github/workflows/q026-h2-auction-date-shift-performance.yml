name: Q026 H2 Treasury Auction-Date Shift Performance

on:
  push:
    branches:
      - research/execute-q026-h2-performance
    paths:
      - automation/q026_h2_treasury_auction_date_shift_performance.py
      - research/preregistrations/q026_h2_treasury_auction_date_shift_performance_2026_09_27.json
      - research/authorizations/q026_h2_treasury_auction_date_shift_performance_2026_09_27.json
      - tests/test_q026_h2_treasury_auction_date_shift_performance.py
      - .github/workflows/q026-h2-auction-date-shift-performance.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: q026-h2-auction-date-shift-performance
  cancel-in-progress: false

jobs:
  performance:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 150
    steps:
      - name: Checkout exact snapshot
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          set "RUN_KEY=%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "WORK=%RUNNER_TEMP%\q026-h2-perf-%RUN_KEY%"
          set "ARCHIVE=%RUNNER_TEMP%\q026-h2-perf-%RUN_KEY%.tar.gz"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-%RUN_KEY%"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-%RUN_KEY%.nupkg"
          set "SITE=%RUNNER_TEMP%\python-site-q026-h2-perf-%RUN_KEY%"
          set "OUT=%GITHUB_WORKSPACE%\research\runs\q026_h2_performance"

          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          cd /d "%REPO_SRC%" || exit /b 1

          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          if exist "%SITE%" rmdir /s /q "%SITE%"
          mkdir "%SITE%" || exit /b 1
          "%PY_EXE%" -m pip install --disable-pip-version-check --target "%SITE%" pytest pandas exchange-calendars statsmodels==0.15.0 || exit /b 1
          set "PYTHONPATH=%SITE%;%REPO_SRC%"

          "%PY_EXE%" -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False" || exit /b 1
          "%PY_EXE%" -m pytest -q tests/test_q026_h2_treasury_auction_date_shift_performance.py || exit /b 1

          set "AUTH=%REPO_SRC%\research\authorizations\q026_h2_treasury_auction_date_shift_performance_2026_09_27.json"
          "%PY_EXE%" -c "import json; a=json.load(open(r'%AUTH%',encoding='utf-8')); assert a['performance_execution_authorized'] is True and a['execution_scope']=='PERFORMANCE'; assert a['coverage_workflow_run_id'] and a['coverage_artifact_id'] and a['snapshot_fingerprint']" || exit /b 1

          set "DL=%RUNNER_TEMP%\q026-h2-perf-download-%RUN_KEY%"
          if exist "%DL%" rmdir /s /q "%DL%"
          mkdir "%DL%" || exit /b 1

          set "COVERAGE_RUN="
          for /f "delims=" %%R in ('"%PY_EXE%" -c "import json; print(json.load(open(r'%AUTH%',encoding='utf-8'))['coverage_workflow_run_id'])"') do set "COVERAGE_RUN=%%R"
          if not defined COVERAGE_RUN exit /b 1

          gh run download "%COVERAGE_RUN%" --repo "%GITHUB_REPOSITORY%" --dir "%DL%\q026" || exit /b 1
          gh run download 36238205065 --repo "%GITHUB_REPOSITORY%" --name q019-treasury-contract --dir "%DL%\q019" || exit /b 1

          set "MANIFEST="
          for /r "%DL%\q026" %%F in (coverage_preflight_*.json) do if not defined MANIFEST set "MANIFEST=%%F"
          if not defined MANIFEST exit /b 1

          set "DATA_DIR="
          for /r "%DL%\q026" %%D in (.) do if exist "%%~fD\datasets" set "DATA_DIR=%%~fD\datasets"
          if not defined DATA_DIR (
            for /d %%D in ("%DL%\q026\*datasets" "%DL%\q026\datasets") do if exist "%%D" set "DATA_DIR=%%~fD"
          )
          if not defined DATA_DIR exit /b 1

          "%PY_EXE%" -m automation.q026_h2_treasury_auction_date_shift_performance --manifest "%MANIFEST%" --data-dir "%DATA_DIR%" --authorization "%AUTH%" --output "%OUT%\T-2026-09-27-048-PERFORMANCE\result.json" || exit /b 1
          echo Q026_H2_PERFORMANCE_COMPLETE
          endlocal

      - name: Publish performance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q026-h2-auction-date-shift-performance-${{ github.run_id }}
          path: research/runs/q026_h2_performance/
          if-no-files-found: warn
          retention-days: 30
