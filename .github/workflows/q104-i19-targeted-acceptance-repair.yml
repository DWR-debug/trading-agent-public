name: Q104 I19 Targeted Acceptance Header Repair

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed source census run holding the frozen page and hosted shard receipts"
        required: true
        type: string
      shard_recovery_run_id:
        description: "Run holding the missing shard receipts; use source_run_id when none were missing"
        required: true
        type: string
      recovered_shards:
        description: "Comma-separated shard IDs whose receipts must be downloaded from shard_recovery_run_id"
        required: false
        default: ""
        type: string
      prior_repair_run_id:
        description: "Completed bounded Q104 repair run whose repaired receipts are reused; empty means original receipts"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      source_run_id:
        description: "Completed source census run holding the frozen page and hosted shard receipts"
        required: true
        type: string
      shard_recovery_run_id:
        description: "Run holding missing shard receipts; use source_run_id when none were missing"
        required: true
        type: string
      recovered_shards:
        description: "Comma-separated shard IDs whose receipts must be downloaded from shard_recovery_run_id"
        required: false
        default: ""
        type: string
      prior_repair_run_id:
        description: "Completed bounded Q104 repair run whose repaired receipts are reused; empty means original receipts"
        required: false
        default: ""
        type: string
permissions:
  actions: write
  contents: write

concurrency:
  group: trading-agent-q104-i19-targeted-acceptance-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate terminal run identities and frozen artifact completeness
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SHARD_RECOVERY_RUN_ID: ${{ inputs.shard_recovery_run_id }}
          RECOVERED_SHARDS: ${{ inputs.recovered_shards }}
          PRIOR_REPAIR_RUN_ID: ${{ inputs.prior_repair_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "INVALID_I19_SOURCE_RUN_ID"; exit 2; }
          [[ "$SHARD_RECOVERY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "INVALID_I19_SHARD_RECOVERY_RUN_ID"; exit 2; }
          [[ -z "$PRIOR_REPAIR_RUN_ID" || "$PRIOR_REPAIR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "INVALID_I19_PRIOR_REPAIR_RUN_ID"; exit 2; }
          IFS=',' read -r -a recovered <<< "$RECOVERED_SHARDS"
          allowed=",2013-2016,2017-2018,2019-2020,2021-2022,2023,2024-2025-09,"
          for shard in "${recovered[@]}"; do
            [[ -z "$shard" ]] && continue
            case "$allowed" in *,"$shard",*) ;; *) echo "INVALID_I19_RECOVERED_SHARD:$shard"; exit 2 ;; esac
          done

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/i19-source-run.json"
          jq -e '
            .name == "Q104 I19 Historical 13F Identity Census"
            and .status == "completed"
            and .head_branch == "master"
            and (.conclusion == "failure" or .conclusion == "cancelled")
          ' "$RUNNER_TEMP/i19-source-run.json" >/dev/null || {
            echo "I19_SOURCE_RUN_NOT_A_COMPLETED_FAILED_MASTER_CENSUS"; exit 2;
          }

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SHARD_RECOVERY_RUN_ID" > "$RUNNER_TEMP/i19-recovery-run.json"
          jq -e '
            .status == "completed"
            and .head_branch == "master"
            and (
              .name == "Q104 I19 Historical 13F Identity Census"
              or .name == "Q104 I19 Missing Shard Receipt Recovery"
            )
          ' "$RUNNER_TEMP/i19-recovery-run.json" >/dev/null || {
            echo "I19_RECOVERY_RUN_NOT_A_TERMINAL_ALLOWED_MASTER_RUN"; exit 2;
          }

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/i19-source-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SHARD_RECOVERY_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/i19-recovery-artifacts.json"
          if [[ -n "$PRIOR_REPAIR_RUN_ID" ]]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REPAIR_RUN_ID" > "$RUNNER_TEMP/i19-prior-repair-run.json"
            jq -e '.name == "Q104 I19 Receipt-Gated Targeted Acceptance Repair Request" and .status == "completed" and .conclusion == "failure" and .head_branch == "master"' "$RUNNER_TEMP/i19-prior-repair-run.json" >/dev/null || { echo "I19_PRIOR_REPAIR_RUN_INVALID"; exit 2; }
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REPAIR_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/i19-prior-repair-artifacts.json"
            prior_prefix="q104-i19-targeted-acceptance-repair-$SOURCE_RUN_ID-$PRIOR_REPAIR_RUN_ID-"
            jq -e --arg prefix "$prior_prefix" '[.artifacts[]? | select((.name | startswith($prefix)) and .expired == false)] | length == 1' "$RUNNER_TEMP/i19-prior-repair-artifacts.json" >/dev/null || { echo "I19_PRIOR_REPAIR_ARTIFACT_MISSING_OR_EXPIRED"; exit 2; }
          fi
          snapshot="q104-i19-sec-source-snapshot-$SOURCE_RUN_ID"
          jq -e --arg n "$snapshot" '[.artifacts[]? | select(.name == $n and .expired == false)] | length == 1' \
            "$RUNNER_TEMP/i19-source-artifacts.json" >/dev/null || {
              echo "I19_FROZEN_SOURCE_SNAPSHOT_ARTIFACT_MISSING_OR_EXPIRED"; exit 2;
            }

          for shard in 2013-2016 2017-2018 2019-2020 2021-2022 2023 2024-2025-09; do
            artifact="q104-i19-census-$shard-$SOURCE_RUN_ID"
            artifact_json="$RUNNER_TEMP/i19-source-artifacts.json"
            case ",$RECOVERED_SHARDS," in
              *,"$shard",*) artifact="q104-i19-census-$shard-$SHARD_RECOVERY_RUN_ID"; artifact_json="$RUNNER_TEMP/i19-recovery-artifacts.json" ;;
            esac
            jq -e --arg n "$artifact" '[.artifacts[]? | select(.name == $n and .expired == false)] | length == 1' \
              "$artifact_json" >/dev/null || {
                echo "I19_REQUIRED_SHARD_ARTIFACT_MISSING_OR_EXPIRED:$artifact"; exit 2;
              }
          done

          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "shard_recovery_run_id=$SHARD_RECOVERY_RUN_ID"
            echo "recovered_shards=$RECOVERED_SHARDS"
          } >> "$GITHUB_OUTPUT"
          echo "I19_TARGETED_REPAIR_INPUTS_VALIDATED=true"

      - name: Download the frozen source snapshot and six receipts
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_REPAIR_RUN_ID: ${{ inputs.prior_repair_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ steps.select.outputs.source_run_id }}"
          recovery_run_id="${{ steps.select.outputs.shard_recovery_run_id }}"
          recovered_shards=",${{ steps.select.outputs.recovered_shards }},"
          root="research/runs/q104_i19_acceptance_repair/$source_run_id"
          mkdir -p "$root/input" "$root/source_snapshot" "$root/repaired"
          gh run download "$source_run_id" --repo "$GITHUB_REPOSITORY" \
            --name "q104-i19-sec-source-snapshot-$source_run_id" --dir "$root/source_snapshot"
          for shard in 2013-2016 2017-2018 2019-2020 2021-2022 2023 2024-2025-09; do
            artifact="q104-i19-census-$shard-$source_run_id"
            case "$recovered_shards" in
              *,"$shard",*) artifact_run="$recovery_run_id" ;;
              *) artifact_run="$source_run_id" ;;
            esac
            gh run download "$artifact_run" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$root/input/$shard"
          done
          echo "I19_SIX_SHARD_RECEIPTS_FETCHED=true"
          echo "I19_SOURCE_RUN_ID=$source_run_id"
          echo "I19_SHARD_RECOVERY_RUN_ID=$recovery_run_id"
          echo "I19_RECOVERED_SHARDS=${{ steps.select.outputs.recovered_shards }}"
          repair_input_dir="$root/input"
          prior_recovery_receipt=""
          if [[ -n "$PRIOR_REPAIR_RUN_ID" ]]; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_REPAIR_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/i19-prior-repair-artifacts.json"
            prior_prefix="q104-i19-targeted-acceptance-repair-$source_run_id-$PRIOR_REPAIR_RUN_ID-"
            prior_artifact="$(jq -r --arg prefix "$prior_prefix" '[.artifacts[]? | select((.name | startswith($prefix)) and .expired == false)][0].name' "$RUNNER_TEMP/i19-prior-repair-artifacts.json")"
            mkdir -p "$RUNNER_TEMP/i19-prior-repair"
            gh run download "$PRIOR_REPAIR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$prior_artifact" --dir "$RUNNER_TEMP/i19-prior-repair"
            mapfile -t prior_receipts < <(find "$RUNNER_TEMP/i19-prior-repair" -type f -name targeted_recovery_receipt.json)
            [[ "${#prior_receipts[@]}" == "1" ]] || { echo "I19_PRIOR_RECOVERY_RECEIPT_COUNT_INVALID"; exit 2; }
            prior_recovery_receipt="${prior_receipts[0]}"
            prior_root="$(dirname "$prior_recovery_receipt")"
            jq -e --arg source "$source_run_id" '.record_type == "q104_i19_targeted_acceptance_header_recovery" and .source_run_id == $source and .status == "RECOVERY_INCOMPLETE" and .safety.paper_only == true and .safety.live_trading_enabled == false and .scientific_boundary.performance_authorized == false and .scientific_boundary.live_execution_allowed == false' "$prior_recovery_receipt" >/dev/null || { echo "I19_PRIOR_RECOVERY_RECEIPT_LINEAGE_OR_SAFETY_INVALID"; exit 2; }
            repair_input_dir="$prior_root/repaired"
            [[ -d "$repair_input_dir" ]] || { echo "I19_PRIOR_REPAIRED_SHARD_DIR_MISSING"; exit 2; }
            shard_receipt_count="$(find "$repair_input_dir" -type f -name shard_receipt.json | wc -l | tr -d ' ')"
            [[ "$shard_receipt_count" == "6" ]] || { echo "I19_PRIOR_REPAIRED_SHARD_COUNT_INVALID:$shard_receipt_count"; exit 2; }
          fi
          {
            echo "repair_input_dir=$repair_input_dir"
            echo "prior_recovery_receipt=$prior_recovery_receipt"
          } >> "$GITHUB_OUTPUT"

      - name: Repair only unresolved frozen acceptance accessions
        env:
          PRIOR_REPAIR_RUN_ID: ${{ inputs.prior_repair_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ steps.select.outputs.source_run_id }}"
          recovery_run_id="${{ steps.select.outputs.shard_recovery_run_id }}"
          repair_input_dir="${{ steps.download.outputs.repair_input_dir }}"
          prior_recovery_receipt="${{ steps.download.outputs.prior_recovery_receipt }}"
          root="research/runs/q104_i19_acceptance_repair/$source_run_id"
          args=(
            --input-dir "$repair_input_dir"
            --source-snapshot-dir "$root/source_snapshot"
            --output-dir "$root/repaired"
            --receipt-output "$root/targeted_recovery_receipt.json"
            --source-run-id "$source_run_id"
            --shard-recovery-run-id "$recovery_run_id"
          )
          if [[ -n "$PRIOR_REPAIR_RUN_ID" ]]; then
            args+=(--prior-recovery-run-id "$PRIOR_REPAIR_RUN_ID" --prior-recovery-receipt "$prior_recovery_receipt")
          fi
          python -m automation.q104_i19_acceptance_repair "${args[@]}"

      - name: Strict six-shard merge
        shell: bash
        run: |
          set -euo pipefail
          source_run_id="${{ steps.select.outputs.source_run_id }}"
          root="research/runs/q104_i19_acceptance_repair/$source_run_id"
          python automation/q104_i19_13f_historical_identity_census_merge.py \
            --input-dir "$root/repaired" \
            --output "$root/q104_i19_13f_historical_identity_census_latest.json"
          cp "$root/q104_i19_13f_historical_identity_census_latest.json" \
            research/evidence/q104_i19_13f_historical_identity_census_latest.json

      - name: Publish the validated source/PIT receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python3 automation/github_contents_publish.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch master \
              --base-sha "$current_sha" \
              --file "research/evidence/q104_i19_13f_historical_identity_census_latest.json=research/evidence/q104_i19_13f_historical_identity_census_latest.json"; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1

      - name: Upload immutable targeted recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q104-i19-targeted-acceptance-repair-${{ steps.select.outputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q104_i19_acceptance_repair/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  completion_relay:
    if: ${{ always() && github.repository == 'DWR-debug/trading-agent-public' }}
    needs: [repair]
    uses: ./.github/workflows/research-completion-relay.yml
    with:
      source_workflow: "Q104 I19 Targeted Acceptance Header Repair"
