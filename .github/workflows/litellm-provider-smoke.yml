name: LiteLLM Free Provider Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Exactly one already-attested free provider"
        required: true
        type: choice
        options:
          - openrouter_free
          - groq_free
          - mistral_api
      confirm_real_request:
        description: "Send one bounded non-scientific inference request"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' && github.event.inputs.confirm_real_request == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned LiteLLM
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai.txt

      - name: Run exactly one provider smoke request
        shell: bash
        env:
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODE_CONFIRMED: ${{ secrets.GROQ_FREE_MODE_CONFIRMED }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_FREE_MODE_CONFIRMED: ${{ secrets.MISTRAL_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from automation.litellm_free import admission, call_litellm_free

          provider = os.environ.get("PROVIDER_INPUT", "")
          PY
        env:
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
