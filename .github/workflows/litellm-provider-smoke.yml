name: LiteLLM Free Provider Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Exactly one already-attested free provider"
        required: true
        type: choice
        options:
          - openrouter_free
          - groq_free
          - mistral_api
      confirm_real_request:
        description: "Send one bounded non-scientific inference request"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.repository == 'DWR-debug/trading-agent-public' && github.event.inputs.confirm_real_request == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned LiteLLM
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai.txt

      - name: Run exactly one provider smoke request
        shell: bash
        env:
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
          AI_EXTERNAL_PROVIDER_ALLOWLIST: ${{ secrets.AI_EXTERNAL_PROVIDER_ALLOWLIST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODE_CONFIRMED: ${{ secrets.GROQ_FREE_MODE_CONFIRMED }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_FREE_MODE_CONFIRMED: ${{ secrets.MISTRAL_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          from automation.litellm_free import admission, call_litellm_free

          provider = os.environ["PROVIDER_INPUT"].strip()
          key_env = {
              "openrouter_free": "OPENROUTER_API_KEY",
              "groq_free": "GROQ_API_KEY",
              "mistral_api": "MISTRAL_API_KEY",
          }[provider]

          admitted = admission(provider, os.environ)
          print(json.dumps({
              "provider": provider,
              "eligible": admitted["eligible"],
              "litellm_model": admitted["litellm_model"],
              "api_model": admitted["api_model"],
              "free_only": admitted["free_only"],
              "paid_usage_allowed": admitted["paid_usage_allowed"],
              "paid_fallback_allowed": admitted["paid_fallback_allowed"],
              "retries_allowed": admitted["retries_allowed"],
              "reasons": admitted["reasons"],
          }, sort_keys=True))

          if not admitted["eligible"]:
              raise SystemExit("provider is not admitted by the existing free-only gate")

          result = call_litellm_free(
              provider,
              "Compatibility smoke only. Return the single word PASS. "
              "This request creates no scientific evidence and must not perform "
              "research selection, validation, tuning, promotion, or live execution.",
              api_key=os.environ.get(key_env, ""),
              timeout_seconds=30,
          )
          print(json.dumps({
              "provider": provider,
              "status": result["status"],
              "returncode": result["returncode"],
              "response_id": result.get("response_id"),
              "response_model": result.get("response_model"),
              "usage": result.get("usage"),
          }, sort_keys=True))

          if result["status"] != "SUCCESS":
              raise SystemExit("LiteLLM provider smoke failed")
          PY
