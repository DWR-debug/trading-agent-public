name: Self-hosted Capacity Autostart and Probe

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/self-hosted-capacity-autostart.yml"
      - "automation/self_hosted_capacity.py"
      - "tests/test_self_hosted_capacity.py"

permissions:
  contents: read

concurrency:
  group: trading-agent-self-hosted-capacity-autostart
  cancel-in-progress: true

jobs:
  arm:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 8
    steps:
      - name: Snapshot master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-capacity"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-capacity.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%"
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          endlocal

      - name: Run capacity autostart
        shell: cmd
        run: |
          @echo off
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-capacity\tools\python.exe"
          "%PY_EXE%" -m automation.self_hosted_capacity > "%RUNNER_TEMP%\self-hosted-capacity.json"
          if errorlevel 1 exit /b 1
          type "%RUNNER_TEMP%\self-hosted-capacity.json"

      - name: Publish capacity result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-hosted-capacity-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\self-hosted-capacity.json
          if-no-files-found: warn
          retention-days: 14

  probe:
    if: always() && github.repository == 'DWR-debug/trading-agent-public'
    needs: arm
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 5
    steps:
      - name: Verify assigned runner
        shell: cmd
        run: |
          @echo off
          if /I not "%GITHUB_REPOSITORY%"=="DWR-debug/trading-agent-public" exit /b 1
          echo CAPACITY_PROBE_SLOT=${{ matrix.slot }}
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo GITHUB_SHA=%GITHUB_SHA%
