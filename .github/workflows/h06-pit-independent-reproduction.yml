name: H06 PIT Independent Reproduction (self-hosted)

on:
  workflow_run:
    workflows: ["H06 Master Coverage Repair"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-h06-pit-independent-reproduction
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 45
    steps:
      - name: Checkout exact H06 run source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-h06-pit-repro"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-h06-pit-repro.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Download canonical H06 artifact
        uses: actions/download-artifact@v8
        with:
          name: h06-master-coverage-${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/h06-master-coverage-artifact-${{ github.event.workflow_run.id }}

      - name: Verify canonical H06 artifact
        shell: cmd
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          @echo off
          setlocal
          set "ARTIFACT_ROOT=%RUNNER_TEMP%\h06-master-coverage-artifact-%UPSTREAM_RUN_ID%"
          if not exist "%ARTIFACT_ROOT%\h06_sector_neutral_residual_momentum_repair_coverage.json" exit /b 1
          if not exist "%ARTIFACT_ROOT%\h06_repair_datasets\snapshot_manifest.json" exit /b 1
          echo H06_CANONICAL_ARTIFACT_STRUCTURE=PASS
          endlocal
      - name: H06 PIT structural tests
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-h06-pit-repro\tools\python.exe"
          "%PY_EXE%" -m pytest -q tests/test_h06_sector_neutral_residual_momentum_pit.py || exit /b 1
          endlocal

      - name: Re-run H06 PIT on frozen artifact
        shell: cmd
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-h06-pit-repro\tools\python.exe"
          set "ARTIFACT_ROOT=%RUNNER_TEMP%\h06-master-coverage-artifact-%UPSTREAM_RUN_ID%"
          if not exist "%GITHUB_WORKSPACE%\research\runs\h06_pit_independent" mkdir "%GITHUB_WORKSPACE%\research\runs\h06_pit_independent"
          "%PY_EXE%" -m automation.h06_sector_neutral_residual_momentum_pit --universe-root "%ARTIFACT_ROOT%\h06_repair_datasets" --coverage-result "%ARTIFACT_ROOT%\h06_sector_neutral_residual_momentum_repair_coverage.json" --authorization "research\authorizations\h06_sector_neutral_residual_momentum_pit_2026_10_01.json" --output "%GITHUB_WORKSPACE%\research\runs\h06_pit_independent\reproduced_pit.json" || exit /b 1
          endlocal

      - name: Reconcile PIT fingerprints
        shell: cmd
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          @echo off
          setlocal
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-h06-pit-repro\tools\python.exe"
          set "ARTIFACT_ROOT=%RUNNER_TEMP%\h06-master-coverage-artifact-%UPSTREAM_RUN_ID%"
          "%PY_EXE%" -c "import json,os; from pathlib import Path; a=Path(os.environ['ARTIFACT_ROOT']); c=json.loads((a/'h06_sector_neutral_residual_momentum_pit.json').read_text(encoding='utf-8')); r=json.loads((Path(os.environ['GITHUB_WORKSPACE'])/'research/runs/h06_pit_independent/reproduced_pit.json').read_text(encoding='utf-8')); assert c.get('status')=='PIT_PASSED' and r.get('status')=='PIT_PASSED', 'H06 PIT did not pass'; assert c.get('trial_id')==r.get('trial_id'), 'trial id mismatch'; assert c.get('universe')==r.get('universe'), 'universe mismatch'; assert c.get('symbols')==r.get('symbols'), 'symbol set/order mismatch'; assert c.get('research_candles')==r.get('research_candles'), 'research candle count mismatch'; assert c.get('target_common_candles')==r.get('target_common_candles'), 'target candle count mismatch'; assert c.get('checked_decision_points')==r.get('checked_decision_points'), 'decision point count mismatch'; assert c.get('signal_definition')==r.get('signal_definition'), 'signal definition mismatch'; assert c.get('checks')==r.get('checks'), 'PIT check set mismatch'; assert c.get('check_fingerprint')==r.get('check_fingerprint'), 'PIT check fingerprint mismatch'; assert c.get('coverage_input',{}).get('coverage_fingerprint')==r.get('coverage_input',{}).get('coverage_fingerprint'), 'coverage fingerprint mismatch'; assert c.get('coverage_input',{}).get('snapshot_fingerprint')==r.get('coverage_input',{}).get('snapshot_fingerprint'), 'snapshot fingerprint mismatch'; assert c.get('governance',{}).get('performance_trial_authorized') is False and r.get('governance',{}).get('performance_trial_authorized') is False, 'performance authorization invariant failed'; assert c.get('safety')==r.get('safety'), 'safety mismatch'; print('H06_INDEPENDENT_PIT_RECONCILIATION=PASS'); print('H06_PIT_CHECK_FINGERPRINT='+str(r.get('check_fingerprint'))); print('H06_PIT_CHECKED_DECISION_POINTS='+str(r.get('checked_decision_points')))" || exit /b 1
          endlocal
      - name: Upload independent PIT receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: h06-pit-independent-reproduction-${{ github.run_id }}
          path: research/runs/h06_pit_independent/reproduced_pit.json
          if-no-files-found: error
          retention-days: 30
