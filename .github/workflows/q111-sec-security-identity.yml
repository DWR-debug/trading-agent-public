name: Q111 SEC Security Identity Contract

on:
  push:
    branches: [master]
    paths:
      - "automation/q111_security_identity_contract.py"
      - "tests/test_q111_security_identity_contract.py"
      - "research/preregistrations/q111_sec_security_identity_2026_10_01.json"
      - ".github/workflows/q111-sec-security-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q111-sec-security-identity
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Safety invariants
        run: |
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: Q111 contract tests
        run: python -m pytest -q tests/test_q111_security_identity_contract.py

      - name: Q111 structural contract
        run: |
          python -m automation.q111_security_identity_contract

