name: Candidate Validation 50/50 Vol Budget

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-candidate-validation-50-50-vol-budget
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Vollständige Testsuite
        run: python -m pytest -q

      - name: Paper-Trading-Sicherheit prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY

      - name: Unabhängige Trend-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_trend             --output research/candidate_validation/data_trend_manifest.json

      - name: Unabhängige Cross-Sectional-Daten vorbereiten
        run: |
          set -euo pipefail
          python -m automation.prepare_research_data             --target-count 3500             --universe validation_cs             --output research/candidate_validation/data_cs_manifest.json

      - name: Manifeste fail-closed verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.asset_universes import get_universe

          checks = (
              ("validation_trend", Path("research/candidate_validation/data_trend_manifest.json")),
              ("validation_cs", Path("research/candidate_validation/data_cs_manifest.json")),
          )
          fingerprints = []
          for universe_name, path in checks:
              manifest = json.loads(path.read_text(encoding="utf-8"))
              universe = get_universe(universe_name)
              assert manifest["universe"] == universe_name
              assert manifest["target_count"] == 3500
              assert tuple(item["symbol"] for item in manifest["datasets"]) == tuple(universe.symbols)
              assert all(item["candle_count"] == 3500 for item in manifest["datasets"])
              assert manifest["safety"]["paper_only"] is True
              assert manifest["safety"]["live_trading_enabled"] is False
              fingerprints.append((universe_name, manifest["manifest_fingerprint"]))

          trend = get_universe("validation_trend")
          cs = get_universe("validation_cs")
          assert set(trend.symbols).isdisjoint(cs.symbols)
          print("VALIDATION_MANIFESTS_VERIFIED")
          for universe, fingerprint in fingerprints:
              print(f"{universe.upper()}_MANIFEST: {fingerprint}")
          PY

      - name: Fixed Candidate Validation ausführen
        run: |
          set -euo pipefail
          python -m automation.candidate_validation_50_50_vol_budget             --trend-data-dir data/market_data             --trend-manifest research/candidate_validation/data_trend_manifest.json             --cs-data-dir data/market_data             --cs-manifest research/candidate_validation/data_cs_manifest.json             --output research/candidate_validation/report.json

      - name: Ergebnisintegrität und Safety verifizieren
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("research/candidate_validation/report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          stored = report.pop("report_fingerprint")
          actual = hashlib.sha256(
              json.dumps(
                  report,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()

          assert stored == actual
          assert report["status"] == "COMPLETED"
          assert report["source"]["independent_asset_universes"] is True
          assert report["source"]["out_of_time_validation"] is False
          assert report["methodology"]["optimization_used"] is False

          archive_path = Path("research/candidate_validation/adjusted_close_archive.json")
          archive = json.loads(archive_path.read_text(encoding="utf-8"))
          archive_stored = archive.pop("archive_fingerprint")
          archive_actual = hashlib.sha256(
              json.dumps(
                  archive,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          assert archive_stored == archive_actual
          assert archive_stored == report["source"]["adjusted_close_archive_fingerprint"]
          expected_fingerprints = report["source"]["adjusted_close_fingerprints"]
          for symbol, values in archive["datasets"].items():
              assert len(values) == 3500
              actual_fingerprint = hashlib.sha256(
                  json.dumps(
                      values,
                      sort_keys=True,
                      separators=(",", ":"),
                      ensure_ascii=True,
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()
              assert actual_fingerprint == expected_fingerprints[symbol]
          assert report["methodology"]["selection_profile_used"] is False
          assert report["methodology"]["signal_parameters_changed"] is False
          assert report["methodology"]["sleeve_weights_changed"] is False
          assert report["methodology"]["production_strategy_changed"] is False
          assert report["methodology"]["orders_enabled"] is False
          assert report["safety"]["paper_only"] is True
          assert report["safety"]["live_trading_enabled"] is False
          assert report["safety"]["orders_enabled"] is False

          print("REPORT_FINGERPRINT: VALID")
          print("REPORT_FINGERPRINT:", stored)
          print("CANDIDATE_STATUS:", report["candidate_status"])
          print("ALL_RELEVANT_CHECKS_PASSED:", report["gate_contract"]["all_relevant_checks_passed"])
          print("BASE_HOLDOUT_RETURN:", report["scenarios"]["base"]["vol_budget_10pct"]["price_only"]["holdout"]["period_return"])
          print("BASE_HOLDOUT_DD:", report["scenarios"]["base"]["vol_budget_10pct"]["price_only"]["holdout"]["max_drawdown_percent"])
          print("BASE_HOLDOUT_PF:", report["scenarios"]["base"]["vol_budget_10pct"]["price_only"]["holdout"]["profit_factor"])
          print("OOS_IS_RATIO:", report["scenarios"]["base"]["vol_budget_10pct"]["price_only"]["oos_to_is_return_ratio"])
          print("TOTAL_RETURN_HOLDOUT_DELTA_PP:", report["total_return_sensitivity_delta"]["holdout_return_delta_percentage_points"])
          PY

      - name: Kandidatenvalidierungs-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-validation-50-50-vol-budget-${{ github.run_id }}
          path: |
            research/candidate_validation/
            data/market_data/
          if-no-files-found: error
          retention-days: 30
