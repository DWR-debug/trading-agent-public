name: Q091 Fixed Portfolio Performance Once

on:
  # Historical/completed execution path: manual dispatch only. Automatic re-triggering is retired.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-agent-q091-fixed-portfolio-performance-once
  cancel-in-progress: false

jobs:
  perform:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check pandas exchange-calendars pytest statsmodels==0.15.0 pypdf

      - name: Fail-closed active registry guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path("research/governance/active_research_registry.json").read_text())
          entry=next((x for x in registry.get("active_trials", []) if x.get("code")=="091"), None)
          if entry is None:
              raise SystemExit("Q091 active registry entry missing")
          if entry.get("trial_id") != "T-2026-09-29-091":
              raise SystemExit("Q091 active registry trial identity mismatch")
          if entry.get("performance_authorization_allowed") is not True:
              raise SystemExit("Q091 performance authorization is not active; refusing execution")
          print("Q091 ACTIVE AUTHORIZATION GUARD PASSED")
          PY

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          print("Q091 SAFETY INVARIANTS OK")
          PY

      - name: Governance preflight
        run: python -m automation.research_governance_audit --repo-root .

      - name: Q091 structural and regression tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_q091_fixed_ensemble.py             tests/test_q091_input_freeze.py             tests/test_q091_contract_audit.py             tests/test_q089_validation.py             tests/test_q089_performance_envelope.py

      - name: Execute Q091 fixed-rule performance exactly once
        shell: bash
        run: |
          set -euo pipefail
          test -f research/authorizations/q091_performance_2026_09_29.json
          python -m automation.q091_performance             --repo-root .             --output research/evidence/q091_performance_result.json

      - name: Reconcile immutable result and consume authorization
        shell: bash
        env:
          Q091_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m automation.q091_reconcile             --repo-root .             --workflow-run-id "$Q091_WORKFLOW_RUN_ID"

      - name: Publish deterministic result, ledger and registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MESSAGE: "EVIDENCE: reconcile Q091 fixed portfolio performance"
        run: |
          set -euo pipefail
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$base_sha"             --file research/evidence/q091_performance_result.json=research/evidence/q091_performance_result.json             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json             --file research/governance/active_research_registry.json=research/governance/active_research_registry.json             --file research/governance/retired_authorizations.json=research/governance/retired_authorizations.json

      - name: Upload Q091 evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q091-fixed-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/evidence/q091_performance_result.json
          if-no-files-found: warn
          retention-days: 30
