name: C29 Fresh Coverage and PIT

on:
  push:
    branches: [master]
    paths:
      - "research/asset_universes.py"
      - "research/preregistrations/c29_fresh_coverage_pit_2026_09_30.json"
      - "research/run_requests/c29_fresh_coverage_pit.trigger"
      - "automation/coverage_preflight.py"
      - "automation/c29_fresh_pit.py"
      - "automation/frontier_feasibility.py"
      - "tests/test_c29_fresh_pit.py"
      - ".github/workflows/c29-fresh-coverage-pit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c29-fresh-coverage-pit
  cancel-in-progress: true

jobs:
  coverage_and_pit:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas

      - name: Safety invariants
        run: python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')"

      - name: C29 contract tests
        run: python -m pytest -q tests/test_frontier_feasibility.py tests/test_c29_fresh_pit.py

      - name: Fresh C29 coverage preflight
        run: python -m automation.coverage_preflight --preregistration research/preregistrations/c29_fresh_coverage_pit_2026_09_30.json --output-root research/runs/c29_coverage

      - name: C29 PIT mutation validation
        run: python -m automation.c29_fresh_pit --universe-root research/runs/c29_coverage/T-2026-09-30-C29-COVERAGE-PIT/datasets --symbols PPG GWW ROP TT IR KLAC SNA SWK --output research/runs/c29_pit/T-2026-09-30-C29-COVERAGE-PIT/pit_report.json

      - name: Validate no-performance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/runs/c29_pit/T-2026-09-30-C29-COVERAGE-PIT/pit_report.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "PIT_PASSED_NO_PERFORMANCE_EVIDENCE"
          assert d["performance_evaluation"] is False
          assert d["holdout_evaluation"] is False
          assert d["candidate_selection"] is False
          assert d["candidate_ranking"] is False
          assert d["performance_authorized"] is False
          print("C29 PIT NO-PERFORMANCE CONTRACT OK")
          PY

      - name: Upload C29 feasibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c29-fresh-coverage-pit-${{ github.run_id }}
          path: |
            research/runs/c29_coverage/T-2026-09-30-C29-COVERAGE-PIT/
            research/runs/c29_pit/T-2026-09-30-C29-COVERAGE-PIT/pit_report.json
          if-no-files-found: warn
          retention-days: 14
