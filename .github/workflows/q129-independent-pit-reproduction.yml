name: Q129 Independent Options PIT Reproduction

on:
  push:
    branches: [master]
    paths:
      - "automation/q129_options_pit_reproduction.py"
      - "tests/test_q129_options_pit_reproduction.py"
      - "research/governance/q129_options_source_contract_2026_10_03.json"
      - ".github/workflows/q129-independent-pit-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q129-independent-pit
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install independent PIT tools
        run: python -m pip install --disable-pip-version-check duckdb pyarrow exchange-calendars

      - name: Reproduce pinned options source independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q129-pit-reproduction/${GITHUB_RUN_ID}"
          python -m automation.q129_options_pit_reproduction \
            --workdir "$RUNNER_TEMP/q129-independent-assets" \
            --output "research/runs/q129-pit-reproduction/${GITHUB_RUN_ID}/pit_receipt.json"

      - name: Enforce Q129 independent PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/q129-pit-reproduction") / os.environ["GITHUB_RUN_ID"] / "pit_receipt.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "Q129_INDEPENDENT_PIT_REPRODUCED"
          assert data["information_boundary"]["same_day_decision_use_allowed"] is False
          assert data["independent_method"]["logic_is_distinct_from_source_feasibility_verifier"] is True
          assert data["scientific_boundary"]["performance"] is False
          assert data["scientific_boundary"]["candidate_selection"] is False
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["safety"]["orders_enabled"] is False
          assert data["safety"]["automatic_promotion"] is False
          print("Q129_INDEPENDENT_PIT_SAFE")
          PY

      - name: Upload independent PIT receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q129-independent-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q129-pit-reproduction/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
