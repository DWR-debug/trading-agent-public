name: Q070 Hosted Deterministic Fallback

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q070_hosted_fallback.trigger"
      - ".github/workflows/q070-hosted-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-agent-q070-coverage-pit
  cancel-in-progress: true

jobs:
  fallback:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Verify frozen Q070 design and safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from config import settings
          p=json.loads(Path("research/preregistrations/q070_fixed_candidate_validation_2026_09_28.json").read_text())
          assert p["status"]=="PREREGISTERED_DESIGN_ONLY"
          assert p["source_candidate_bank"]["definitions_locked"] is True
          assert p["governance"]["performance_evaluation"] is False
          assert p["governance"]["selection_used"] is False
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          assert settings.ORDERS_ENABLED is False
          assert settings.AUTOMATIC_PROMOTION is False
          assert not Path("research/evidence/q070_performance_result.json").exists()
          assert not Path("research/authorizations/q070_performance_2026_09_28.json").exists()
          print("Q070 HOSTED FALLBACK DESIGN/SAFETY OK")
          PY

      - name: Focused Q070 tests
        run: python -m pytest -q tests/test_q069_candidate_bank.py tests/test_q070_validation.py tests/test_canonical_snapshot.py

      - name: Fresh Q070 coverage and PIT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m automation.q070_fresh_coverage             --output-root research/runs/q070_coverage             --result research/evidence/q070_coverage_result.json             --discovery research/runs/q070_discovery/discovery.json             --asset-freeze research/evidence/q070_asset_freeze.json             --performance-prereg research/preregistrations/q070_performance_2026_09_28.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q070_coverage_result.json").read_text())
          assert d["trial_id"]=="T-2026-09-28-070-COVERAGE"
          assert d["status"]=="COVERAGE_PASSED"
          assert d["selection_used"] is False
          assert d["performance_trial_authorized"] is False
          assert len(d["symbols"])==8
          print("Q070 COVERAGE PASSED",d["symbols"])
          PY
          python -m automation.q070_pit             --coverage-root research/runs/q070_coverage/T-2026-09-28-070-COVERAGE             --result research/evidence/q070_pit_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q070_pit_result.json").read_text())
          assert d["trial_id"]=="T-2026-09-28-070-PIT"
          assert d["status"]=="PIT_PASSED"
          assert d["selection_used"] is False
          assert d["performance_trial_authorized"] is False
          print("Q070 PIT PASSED")
          PY

      - name: Publish Q070 preflight evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python - <<'PY'
          import json, os, urllib.request
          u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"
          req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])
          PY
          )"
          test -n "$BASE_SHA"
          PUBLISH_MESSAGE="EVIDENCE: record Q070 hosted deterministic coverage and PIT"
          export PUBLISH_MESSAGE
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY"             --branch master             --base-sha "$BASE_SHA"             --file research/runs/q070_discovery/discovery.json=research/runs/q070_discovery/discovery.json             --file research/evidence/q070_coverage_result.json=research/evidence/q070_coverage_result.json             --file research/evidence/q070_asset_freeze.json=research/evidence/q070_asset_freeze.json             --file research/preregistrations/q070_performance_2026_09_28.json=research/preregistrations/q070_performance_2026_09_28.json             --file research/evidence/q070_pit_result.json=research/evidence/q070_pit_result.json

      - name: Create and publish Q070 one-shot authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("research/evidence/q070_coverage_result.json").read_text())
          p=json.loads(Path("research/evidence/q070_pit_result.json").read_text())
          f=json.loads(Path("research/evidence/q070_asset_freeze.json").read_text())
          prereg=json.loads(Path("research/preregistrations/q070_performance_2026_09_28.json").read_text())
          import hashlib
          fp=lambda v: hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          assert prereg["asset_freeze_fingerprint"]==fp(f)
          auth={
            "schema_version":"1.0",
            "authorization_id":"Q070-PERFORMANCE-HOSTED-FALLBACK-2026-09-28",
            "authorized":True,
            "performance_execution_authorized":True,
            "execution_scope":"Q070_FIXED_CANDIDATE_PERFORMANCE_ONLY",
            "authorization_basis":"Fresh immutable Q070 coverage and PIT passed on the public GitHub-hosted deterministic runner because self-hosted capacity is unavailable.",
            "required_prerequisites":["T-2026-09-28-070-COVERAGE status=COVERAGE_PASSED","T-2026-09-28-070-PIT status=PIT_PASSED"],
            "source_receipts":{"coverage_result_fingerprint":c["result_fingerprint"],"pit_result_fingerprint":p["result_fingerprint"],"asset_freeze_fingerprint":fp(f)},
            "prohibited":["parameter selection","threshold selection","asset selection after coverage","family ranking","holdout selection","promotion","live execution"],
            "safety":{"PAPER_ONLY":True,"LIVE_TRADING_ENABLED":False,"ORDERS_ENABLED":False,"AUTOMATIC_PROMOTION":False}
          }
          Path("research/authorizations").mkdir(parents=True,exist_ok=True)
          Path("research/authorizations/q070_performance_2026_09_28.json").write_text(json.dumps(auth,indent=2)+"\n")
          PY
          BASE_SHA="$(python - <<'PY'
          import json, os, urllib.request
          u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"
          req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])
          PY
          )"
          test -n "$BASE_SHA"
          PUBLISH_MESSAGE="OPS: authorize Q070 hosted deterministic fallback"
          export PUBLISH_MESSAGE
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$BASE_SHA"             --file research/authorizations/q070_performance_2026_09_28.json=research/authorizations/q070_performance_2026_09_28.json

      - name: Run exact frozen Q070 performance locally
        run: |
          set -euo pipefail
          python -m automation.q070_performance --repo-root . --output research/evidence/q070_performance_result.json

      - name: Validate Q070 performance result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/evidence/q070_performance_result.json").read_text())
          assert d["status"]=="COMPLETED"
          assert d["performance_evaluation"] is True
          assert d["oos_evaluation"] is True
          assert d["holdout_evaluation"] is True
          assert d["selection_used"] is False
          assert d["holdout_used_for_selection"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["governance"]["automatic_promotion"] is False
          assert set(d["arms"])=={"C7_LOW_MAX_21","C8_LOW_IDIO_VOL_273","C9_LONG_TERM_REVERSAL_756","C10_TREND_EFFICIENCY_63","C11_VOLUME_CONFIRMED_TREND_126"}
          assert all(0 <= x["gates_passed"] <= 13 for x in d["arms"].values())
          print("Q070 HOSTED PERFORMANCE RESULT OK")
          [print(k, f"{v['gates_passed']}/{v['gates_total']}") for k,v in d["arms"].items()]
          PY

      - name: Publish Q070 performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python - <<'PY'
          import json, os, urllib.request
          u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"
          req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])
          PY
          )"
          test -n "$BASE_SHA"
          PUBLISH_MESSAGE="EVIDENCE: record Q070 hosted deterministic performance"
          export PUBLISH_MESSAGE
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$BASE_SHA"             --file research/evidence/q070_performance_result.json=research/evidence/q070_performance_result.json

      - name: Reconcile Q070 ledger locally
        run: python -m automation.q070_reconcile --repo-root .

      - name: Publish Q070 ledger reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python - <<'PY'
          import json, os, urllib.request
          u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/ref/heads/master"
          req=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          print(json.load(urllib.request.urlopen(req,timeout=30))["object"]["sha"])
          PY
          )"
          test -n "$BASE_SHA"
          PUBLISH_MESSAGE="EVIDENCE: reconcile Q070 hosted deterministic performance"
          export PUBLISH_MESSAGE
          python automation/github_contents_publish.py             --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$BASE_SHA"             --file research/evidence/trial_ledger.json=research/evidence/trial_ledger.json

      - name: Dispatch canonical status sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          u="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/workflows/current-status-sync.yml/dispatches"
          req=urllib.request.Request(u,data=json.dumps({"ref":"master"}).encode(),method="POST",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
          urllib.request.urlopen(req,timeout=30).read()
          print("Q070 STATUS SYNC DISPATCHED")
          PY

      - name: Upload Q070 result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q070-hosted-deterministic-performance
          path: research/evidence/q070_performance_result.json
          if-no-files-found: error
          retention-days: 30
