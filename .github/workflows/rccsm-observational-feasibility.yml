name: RCCSM Observational Feasibility (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "automation/rccsm_observational_feasibility.py"
      - "tests/test_rccsm_observational_feasibility.py"
      - "docs/research_design/RCCSM_OBSERVATIONAL_FEASIBILITY_2026-09-28.md"
      - "research/evidence/q089_coverage_result.json"
      - "research/runs/q089_coverage/T-2026-09-28-089-COVERAGE/snapshot_manifest.json"
      - ".github/workflows/rccsm-observational-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rccsm-observational-pc
  cancel-in-progress: true

jobs:
  observational:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 45
    steps:
      - name: Download exact source
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-observational-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-rccsm-observational-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          endlocal
      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm-observational"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-rccsm-observational.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal
      - name: Structural tests
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-observational-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm-observational\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%PY_EXE%" -m pytest -q tests/test_rccsm_observational_feasibility.py tests/test_rccsm_state_topology.py || exit /b 1
          endlocal
      - name: Run observational feasibility
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-observational-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_EXE=%RUNNER_TEMP%\python-3.13.15-nuget-rccsm-observational\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          if not exist "research\runs\rccsm_observational" mkdir "research\runs\rccsm_observational"
          "%PY_EXE%" automation\rccsm_observational_feasibility.py --output research\runs\rccsm_observational\q089_rccsm_observational_feasibility.json || exit /b 1
          endlocal
      - name: Stage observational artifact
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-rccsm-observational-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not exist "%GITHUB_WORKSPACE%\research\runs\rccsm_observational" mkdir "%GITHUB_WORKSPACE%\research\runs\rccsm_observational"
          copy /Y "%REPO_SRC%\research\runs\rccsm_observational\q089_rccsm_observational_feasibility.json" "%GITHUB_WORKSPACE%\research\runs\rccsm_observational\q089_rccsm_observational_feasibility.json" || exit /b 1
          endlocal
      - name: Upload observational artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rccsm-observational-pc-${{ github.run_id }}
          path: research/runs/rccsm_observational/q089_rccsm_observational_feasibility.json
          if-no-files-found: error
          retention-days: 30
