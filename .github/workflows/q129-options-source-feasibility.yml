name: Q129 Historical Options Source Feasibility

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q129_options_source_feasibility.py"
      - "research/governance/q129_options_source_contract_2026_10_03.json"
      - "tests/test_q129_options_source_feasibility.py"
      - ".github/workflows/q129-options-source-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q129-source-feasibility
  cancel-in-progress: true

jobs:
  source_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install parquet verifier
        shell: bash
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Verify pinned options assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "research/runs/q129-source/${GITHUB_RUN_ID}"
          python -m automation.q129_options_source_feasibility \
            --workdir "$RUNNER_TEMP/q129-assets" \
            --output "research/runs/q129-source/${GITHUB_RUN_ID}/source_receipt.json"

      - name: Enforce Q129 source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("research/runs/q129-source") / os.environ["GITHUB_RUN_ID"] / "source_receipt.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "Q129_SOURCE_ASSETS_VERIFIED"
          assert data["same_day_decision_use_allowed"] is False
          assert data["scientific_boundary"]["performance"] is False
          assert data["scientific_boundary"]["parameter_search"] is False
          assert data["scientific_boundary"]["promotion"] is False
          assert data["safety"]["paper_only"] is True
          assert data["safety"]["live_trading_enabled"] is False
          assert data["safety"]["orders_enabled"] is False
          assert data["safety"]["automatic_promotion"] is False
          print("Q129_SOURCE_FEASIBILITY_SAFE")
          PY

      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q129-source-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q129-source/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
