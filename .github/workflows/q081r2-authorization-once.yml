name: Q081-R2 One-Shot Authorization

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q081r2_authorize_once.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-q081r2-authorization-once
  cancel-in-progress: false

jobs:
  authorize:
    if: github.repository == 'DWR-debug/trading-agent-public'
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact authorization request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify explicit one-shot authorization request
        shell: bash
        run: |
          set -euo pipefail
          test -f research/run_requests/q081r2_authorize_once.trigger
          grep -Fx "AUTHORIZE_Q081R2=true" research/run_requests/q081r2_authorize_once.trigger
          grep -Fx "TRIAL_ID=T-2026-09-28-081R2-PERFORMANCE" research/run_requests/q081r2_authorize_once.trigger
          grep -Fx "ONE_SHOT=true" research/run_requests/q081r2_authorize_once.trigger

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas pytest exchange-calendars statsmodels==0.15.0

      - name: Safety and source-contract gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from config import settings
          import automation.q081r2_corrected_e1_e2_performance as runner
          prereg=json.loads(Path("research/preregistrations/q081r2_performance_2026_09_28.json").read_text(encoding="utf-8"))
          registry=json.loads(Path("research/governance/active_research_registry.json").read_text(encoding="utf-8"))
          assert prereg["trial_id"]=="T-2026-09-28-081R2-PERFORMANCE"
          assert prereg["status"]=="PREREGISTERED_PERFORMANCE"
          assert prereg["governance"]["performance_trial_authorized"] is False
          entry=next(x for x in registry["active_trials"] if x.get("code")=="081R2")
          assert entry["trial_id"]==prereg["trial_id"]
          assert entry["performance_authorization_allowed"] is False
          assert runner.TRIAL_ID==prereg["trial_id"]
          assert prereg["correction"]["new_parameters"] is False
          assert prereg["correction"]["new_thresholds"] is False
          assert prereg["correction"]["asset_selection"] is False
          assert prereg["correction"]["direction_reversal"] is False
          assert settings.PAPER_ONLY is True and settings.LIVE_TRADING_ENABLED is False and settings.ORDERS_ENABLED is False and settings.AUTOMATIC_PROMOTION is False
          checks={path:prereg["source_contract"][path] for path in (
            "automation/q079_e1_e2_performance.py",
            "automation/q067_alpha_mechanisms.py",
            "data/canonical_snapshot.py",
            "execution/cost_contract.py",
            "config/settings.py",
            "automation/q081r2_corrected_e1_e2_performance.py",
          )}
          for path,expected in checks.items():
              raw=Path(path).read_bytes()
              actual=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              assert actual==expected,(path,actual,expected)
          print("Q081R2 AUTH SOURCE/SAFETY OK")
          PY

      - name: Verify frozen Q079 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/preregistrations/q081r2_performance_2026_09_28.json").read_text(encoding="utf-8"))
          c=json.loads(Path("research/evidence/q079_coverage_result.json").read_text(encoding="utf-8"))
          h=json.loads(Path("research/evidence/q079_pit_result.json").read_text(encoding="utf-8"))
          b=json.loads(Path("research/evidence/q079_input_freeze_result.json").read_text(encoding="utf-8"))
          i=json.loads(Path("research/evidence/q079_performance_execution_incident.json").read_text(encoding="utf-8"))
          dc=p["data_contract"]
          assert c["status"]=="COVERAGE_PASSED" and c["result_fingerprint"]==dc["coverage_result_fingerprint"] and c["snapshot_fingerprint"]==dc["snapshot_fingerprint"]
          assert h["status"]=="PIT_PASSED" and h["result_fingerprint"]==dc["pit_result_fingerprint"]
          assert b["status"]=="INPUT_BUNDLE_FROZEN" and b["bundle_fingerprint"]==dc["input_bundle_fingerprint"]
          assert i["status"]=="IMPLEMENTATION_INVALID_NO_SCIENTIFIC_OUTCOME"
          for obj in (c,h,b):
              assert obj.get("performance_evaluation") is False
              assert obj.get("selection_used") is False
          print("Q081R2 FROZEN PREREQUISITES OK")
          PY

      - name: Contract regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_q081_execution_envelope.py tests/test_q081r2_identity.py tests/test_research_governance_audit.py
          python -m py_compile automation/q081r2_corrected_e1_e2_performance.py automation/q081r2_reconcile.py
          python -m automation.research_governance_audit

      - name: Wait for exact Master CI Gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            echo "Q081R2 T052 poll attempt=$attempt"
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ".github/workflows/t052-exact-master-ci-gate.yml" --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv' || true)"
            run_id="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            echo "T052 run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "Q081R2_MASTER_CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "::error::T052 Exact Master CI Gate did not complete successfully within authorization window."
          exit 1

      - name: Build atomic authorization and performance trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prereg_path=Path("research/preregistrations/q081r2_performance_2026_09_28.json")
          registry_path=Path("research/governance/active_research_registry.json")
          auth_path=Path("research/authorizations/q081r2_performance_2026_09_28.json")
          trigger_path=Path("research/run_requests/q081r2_performance_once.trigger")
          prereg=json.loads(prereg_path.read_text(encoding="utf-8"))
          registry=json.loads(registry_path.read_text(encoding="utf-8"))
          assert prereg["governance"]["performance_trial_authorized"] is False
          entry=next(x for x in registry["active_trials"] if x.get("code")=="081R2")
          assert entry["performance_authorization_allowed"] is False and entry["trial_id"]==prereg["trial_id"]
          prereg["governance"]["performance_trial_authorized"]=True
          prereg_fp=hashlib.sha256(json.dumps(prereg,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          auth={
            "schema_version":1,
            "authorization_id":"AUTH-Q081R2-2026-09-30-"+os.environ["GITHUB_RUN_ID"],
            "trial_id":prereg["trial_id"],
            "authorized":True,
            "performance_execution_authorized":True,
            "execution_scope":"Q081R2_FIXED_RULE_PERFORMANCE_ONLY",
            "one_shot":True,
            "preregistration_fingerprint":prereg_fp,
            "input_bundle_fingerprint":prereg["data_contract"]["input_bundle_fingerprint"],
            "authorization_basis":{
              "authorization_workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "master_ci_run_id":int(os.environ["Q081R2_MASTER_CI_RUN_ID"]),
              "requested_by_user":True
            },
            "selection_used":False,
            "holdout_used_for_selection":False,
            "parameter_search":False,
            "threshold_search":False,
            "asset_search":False,
            "horizon_search":False,
            "variant_search":False,
            "family_ranking":False,
            "promotion_decision":False,
            "safety":{"paper_only":True,"live_trading_enabled":False,"orders_enabled":False,"automatic_promotion":False}
          }
          entry["performance_authorization_allowed"]=True
          entry["state"]="PERFORMANCE_AUTHORIZED"
          entry["authorization_id"]=auth["authorization_id"]
          auth_path.parent.mkdir(parents=True,exist_ok=True)
          auth_path.write_text(json.dumps(auth,ensure_ascii=False,indent=2,allow_nan=False)+"\n",encoding="utf-8")
          registry_path.write_text(json.dumps(registry,ensure_ascii=False,indent=2,allow_nan=False)+"\n",encoding="utf-8")
          prereg_path.write_text(json.dumps(prereg,ensure_ascii=False,indent=2,allow_nan=False)+"\n",encoding="utf-8")
          trigger_path.write_text("RUN_Q081R2_FIXED_RULE_PERFORMANCE_ONCE=true\nTRIAL_ID=T-2026-09-28-081R2-PERFORMANCE\nONE_SHOT=true\n",encoding="utf-8")
          print("Q081R2 AUTHORIZATION PREPARED")
          print("Q081R2_PREREGISTRATION_FINGERPRINT="+prereg_fp)
          PY
          base_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$base_sha"
          python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" \
            --file research/preregistrations/q081r2_performance_2026_09_28.json=research/preregistrations/q081r2_performance_2026_09_28.json \
            --file research/authorizations/q081r2_performance_2026_09_28.json=research/authorizations/q081r2_performance_2026_09_28.json \
            --file research/governance/active_research_registry.json=research/governance/active_research_registry.json \
            --file research/run_requests/q081r2_performance_once.trigger=research/run_requests/q081r2_performance_once.trigger

      - name: Upload authorization receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q081r2-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/authorizations/q081r2_performance_2026_09_28.json
          if-no-files-found: warn
          retention-days: 30
