name: Unified Research Orchestrator

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Beobachtung, Coverage-Preflight, Coverage-Discovery oder expliziter formaler Research-Lauf
        required: true
        default: observe
        type: choice
        options:
          - observe
          - preflight
          - discover_coverage
          - diagnose_failure
          - diagnose_history
          - research
          - research_t041
      universe:
        description: Research-Universum
        required: true
        default: benchmark
        type: choice
        options:
          - small_cap_high_volatility
          - liquid_high_volatility
          - european_volatile
          - benchmark
          - cross_asset_trend
          - validation_2026_09_24_network_momentum_t039
          - validation_2026_09_24_network_momentum_t040
          - validation_2026_09_24_portfolio_risk_control_trend
          - validation_2026_09_24_portfolio_risk_control_cs
  push:
    branches:
      - master
      - research/execute-t041-frozen
    paths:
      - "automation/research_orchestrator.py"
      - "automation/live_market_observer.py"
      - "automation/one_command_research.py"
      - "automation/research_workflow.py"
      - "automation/network_momentum_lab.py"
      - "automation/coverage_candidate_discovery.py"
      - "automation/coverage_preflight.py"
      - "automation/adversarial_failure_diagnosis.py"
      - "automation/cross_trial_failure_diagnosis.py"
      - "tests/test_cross_trial_failure_diagnosis.py"
      - "docs/cross_trial_failure_diagnosis_2026_09_24.md"
      - "research/evidence/cross_trial_failure_diagnosis_2026_09_24.json"
      - "tests/test_adversarial_failure_diagnosis.py"
      - "docs/t040_failure_diagnosis_2026_09_24.md"
      - "research/evidence/t040_failure_diagnosis_2026_09_24.json"
      - "research/**"
      - "docs/preregistration_trial_039_network_momentum_2026_09_24.md"
      - "docs/preregistration_trial_040_network_momentum_repair_2026_09_24.md"
      - "research/preregistrations/trial_040_network_momentum_2026_09_24.json"
      - "validation/**"
      - "backtesting/**"
      - "optimization/**"
      - "data/**"

permissions:
  contents: read
  actions: read
  actions: read

concurrency:
  group: trading-agent-unified-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: T041 frozen coverage run id
        if: github.ref == 'refs/heads/research/execute-t041-frozen'
        run: |
          set -euo pipefail
          run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t041_coverage_pass_2026_09_24.json").read_text(encoding="utf-8"))["workflow"]["run_id"])')
          test -n "$run_id"
          echo "T041_COVERAGE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Unified Orchestrator
        env:
          ORCHESTRATOR_MODE: ${{ inputs.mode || 'observe' }}
          ORCHESTRATOR_UNIVERSE: ${{ inputs.universe || 'benchmark' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$ORCHESTRATOR_MODE" = "research_t041" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test -n "$T041_COVERAGE_RUN_ID"
            gh run download "$T041_COVERAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "unified-research-$T041_COVERAGE_RUN_ID" --dir /tmp/t041-frozen
            test -f /tmp/t041-frozen/coverage_preflight/T-2026-09-24-041/coverage_preflight_20260924T214018Z.json
            test -f /tmp/t041-frozen/coverage_preflight/T-2026-09-24-041/coverage_preflight_20260924T214019Z.json
            mkdir -p research/runs
            cp -R /tmp/t041-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t041 \
              --universe benchmark
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python -m automation.research_orchestrator \
              --mode observe \
              --universe benchmark
            python -m automation.research_orchestrator \
              --mode preflight \
              --universe validation_2026_09_24_portfolio_risk_control_trend
            python -m automation.research_orchestrator \
              --mode preflight \
              --universe validation_2026_09_24_portfolio_risk_control_cs
          else
            python -m automation.research_orchestrator \
              --mode "$ORCHESTRATOR_MODE" \
              --universe "$ORCHESTRATOR_UNIVERSE"
          fi
      - name: Ergebnis und Snapshot sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unified-research-${{ github.run_id }}
          path: research/runs/
          if-no-files-found: warn
          retention-days: 30
