name: Unified Research Orchestrator

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Beobachtung, Coverage-Preflight, Coverage-Discovery oder expliziter formaler Research-Lauf
        required: true
        default: observe
        type: choice
        options:
          - observe
          - preflight
          - discover_information_alpha
          - discover_information_alpha_stability
          - discover_coverage
          - diagnose_failure
          - diagnose_history
          - diagnose_current
          - research
          - research_t041
          - research_t042
          - research_t043
          - research_t044
          - research_t045
      universe:
        description: Research-Universum
        required: true
        default: benchmark
        type: choice
        options:
          - small_cap_high_volatility
          - liquid_high_volatility
          - european_volatile
          - benchmark
          - cross_asset_trend
          - validation_2026_09_24_volatility_managed_tsm
          - validation_2026_09_25_tsm_signal_consensus
          - validation_2026_09_25_tsm_signal_consensus_repair
          - validation_2026_09_25_position_lifecycle_exit
          - validation_2026_09_24_network_momentum_t039
          - validation_2026_09_24_network_momentum_t040
          - validation_2026_09_24_portfolio_risk_control_trend
          - validation_2026_09_24_portfolio_risk_control_cs
  push:
    branches:
      - master
      - research/execute-t042-coverage
      - research/execute-t042-coverage-repair
      - research/execute-t042-formal
      - research/execute-t043-coverage
      - research/execute-t043-formal
      - research/execute-t044-coverage
      - research/execute-t044-formal
      - research/execute-t045-coverage
      - research/execute-t045-formal
      - research/execute-q010-diagnosis
      - research/execute-q011-discovery
      - research/execute-q012-stability
      - research/execute-q013-redundancy
    paths:
      - "automation/research_orchestrator.py"
      - "automation/live_market_observer.py"
      - "automation/one_command_research.py"
      - "automation/research_workflow.py"
      - "automation/network_momentum_lab.py"
      - "automation/coverage_candidate_discovery.py"
      - "automation/coverage_preflight.py"
      - "automation/adversarial_failure_diagnosis.py"
      - "automation/cross_trial_failure_diagnosis.py"
      - ".github/workflows/research-orchestrator.yml"
      - "tests/test_cross_trial_failure_diagnosis.py"
      - "docs/cross_trial_failure_diagnosis_2026_09_24.md"
      - "research/evidence/cross_trial_failure_diagnosis_2026_09_24.json"
      - "tests/test_adversarial_failure_diagnosis.py"
      - "docs/t040_failure_diagnosis_2026_09_24.md"
      - "research/evidence/t040_failure_diagnosis_2026_09_24.json"
      - "research/**"
      - "docs/preregistration_trial_039_network_momentum_2026_09_24.md"
      - "docs/preregistration_trial_040_network_momentum_repair_2026_09_24.md"
      - "research/preregistrations/trial_040_network_momentum_2026_09_24.json"
      - "validation/**"
      - "backtesting/**"
      - "optimization/**"
      - "data/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-agent-unified-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest statsmodels==0.15.0
      - name: Vollständige Testsuite
        run: python -m pytest -q
      - name: Paper-only-Safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from config import settings
          assert settings.PAPER_ONLY is True
          assert settings.LIVE_TRADING_ENABLED is False
          print("PAPER-ONLY SAFETY OK")
          PY
      - name: T042 frozen coverage run id
        if: github.ref == 'refs/heads/research/execute-t042-formal'
        run: |
          set -euo pipefail
          run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t042_coverage_pass_2026_09_24.json").read_text(encoding="utf-8"))["workflow_run_id"])')
          test -n "$run_id"
          echo "T042_COVERAGE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: T041 frozen coverage run id
        if: inputs.mode == 'research_t041'
        run: |
          set -euo pipefail
          run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t041_coverage_pass_2026_09_24.json").read_text(encoding="utf-8"))["workflow"]["run_id"])')
          test -n "$run_id"
          echo "T041_COVERAGE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Unified Orchestrator
        env:
          ORCHESTRATOR_MODE: ${{ inputs.mode || 'observe' }}
          ORCHESTRATOR_UNIVERSE: ${{ inputs.universe || 'benchmark' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/research/execute-t042-formal" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(git log -1 --pretty=%s)" = "Research authorization: execute T042 formal performance"
            test -n "$T042_COVERAGE_RUN_ID"
            gh run download "$T042_COVERAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "unified-research-$T042_COVERAGE_RUN_ID" --dir /tmp/t042-frozen
            test -f /tmp/t042-frozen/coverage_preflight/T-2026-09-24-042/coverage_preflight_20260924T221913Z.json
            mkdir -p research/runs
            cp -R /tmp/t042-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t042 \
              --universe validation_2026_09_24_volatility_managed_tsm
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t043-formal" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(git log -1 --pretty=%s)" = "Research authorization: execute T043 formal performance"
            run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t043_coverage_pass_2026_09_25.json").read_text(encoding="utf-8"))["workflow_run_id"])')
            test -n "$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "unified-research-$run_id" --dir /tmp/t043-frozen
            mkdir -p research/runs
            cp -R /tmp/t043-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t043 \
              --universe validation_2026_09_25_tsm_signal_consensus
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t044-formal" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(git log -1 --pretty=%s)" = "Research authorization: execute T044 formal performance"
            run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t044_coverage_pass_2026_09_25.json").read_text(encoding="utf-8"))["workflow_run_id"])')
            test -n "$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "unified-research-$run_id" --dir /tmp/t044-frozen
            mkdir -p research/runs
            cp -R /tmp/t044-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t044 \
              --universe validation_2026_09_25_tsm_signal_consensus_repair
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t045-formal" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(git log -1 --pretty=%s)" = "Research authorization: execute T045 formal performance"
            run_id=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("research/evidence/t045_coverage_pass_2026_09_25.json").read_text(encoding="utf-8"))["workflow_run_id"])')
            test -n "$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "unified-research-$run_id" --dir /tmp/t045-frozen
            mkdir -p research/runs
            cp -R /tmp/t045-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t045 \
              --universe validation_2026_09_25_position_lifecycle_exit
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t045-coverage" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute T045 coverage" ]; then
              python -m automation.research_orchestrator \
                --mode preflight \
                --universe validation_2026_09_25_position_lifecycle_exit
            else
              echo "T045 coverage branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-q010-diagnosis" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute Q010 diagnosis" ]; then
              python -m automation.research_orchestrator \
                --mode diagnose_current \
                --universe benchmark
            else
              echo "Q010 diagnosis branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-q011-discovery" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute Q011 discovery" ]; then
              python -m automation.research_orchestrator \
                --mode discover_information_alpha \
                --universe benchmark
            else
              echo "Q011 discovery branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-q012-stability" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute Q012 stability discovery" ]; then
              python -m automation.research_orchestrator \
                --mode discover_information_alpha_stability \
                --universe benchmark
            else
              echo "Q012 stability branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-q013-redundancy" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute Q013 redundancy diagnostic" ]; then
              python -m automation.research_orchestrator \
                --mode discover_information_alpha_redundancy \
                --universe benchmark
            else
              echo "Q013 redundancy branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t044-coverage" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute T044 coverage" ]; then
              python -m automation.research_orchestrator \
                --mode preflight \
                --universe validation_2026_09_25_tsm_signal_consensus_repair
            else
              echo "T044 coverage branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t043-coverage" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            if [ "$(git log -1 --pretty=%s)" = "Research authorization: execute T043 coverage" ]; then
              python -m automation.research_orchestrator \
                --mode preflight \
                --universe validation_2026_09_25_tsm_signal_consensus
            else
              echo "T043 coverage branch: no authorization marker on this maintenance commit; research execution skipped."
            fi
          elif [ "$GITHUB_REF" = "refs/heads/research/execute-t042-coverage" ] || [ "$GITHUB_REF" = "refs/heads/research/execute-t042-coverage-repair" ]; then
            test "$GITHUB_EVENT_NAME" = "push"
            test "$(git log -1 --pretty=%s)" = "Research authorization: execute T042 coverage"
            python -m automation.research_orchestrator \
              --mode preflight \
              --universe validation_2026_09_24_volatility_managed_tsm
          elif [ "$ORCHESTRATOR_MODE" = "research_t041" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test -n "$T041_COVERAGE_RUN_ID"
            gh run download "$T041_COVERAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "unified-research-$T041_COVERAGE_RUN_ID" --dir /tmp/t041-frozen
            test -f /tmp/t041-frozen/coverage_preflight/T-2026-09-24-041/coverage_preflight_20260924T214018Z.json
            test -f /tmp/t041-frozen/coverage_preflight/T-2026-09-24-041/coverage_preflight_20260924T214019Z.json
            mkdir -p research/runs
            cp -R /tmp/t041-frozen/coverage_preflight research/runs/
            python -m automation.research_orchestrator \
              --mode research_t041 \
              --universe benchmark
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python -m automation.research_orchestrator \
              --mode observe \
              --universe benchmark
            python -m automation.research_orchestrator \
              --mode observe \
              --universe cross_asset_trend
            python -m automation.research_orchestrator \
              --mode preflight \
              --universe validation_2026_09_24_portfolio_risk_control_trend
            python -m automation.research_orchestrator \
              --mode preflight \
              --universe validation_2026_09_24_portfolio_risk_control_cs
          else
            python -m automation.research_orchestrator \
              --mode "$ORCHESTRATOR_MODE" \
              --universe "$ORCHESTRATOR_UNIVERSE"
          fi
      - name: Ergebnis und Snapshot sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unified-research-${{ github.run_id }}
          path: research/runs/
          if-no-files-found: warn
          retention-days: 30
