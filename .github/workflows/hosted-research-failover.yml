name: Hosted Research Failover

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/hosted-research-failover.yml"
      - "automation/hosted_fallback_guard.py"
      - "tests/test_hosted_fallback_guard.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trading-agent-hosted-failover
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      run_fallback: ${{ steps.guard.outputs.run_fallback }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Record self-hosted availability assumption
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/failover"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/permanent-pc-research-loop.yml/runs?branch=master&per_page=10" > "$RUNNER_TEMP/failover/self_hosted_runs.json"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from automation.hosted_fallback_guard import decide_fallback

          path = os.path.join(os.environ["RUNNER_TEMP"], "failover", "self_hosted_runs.json")
          payload = json.loads(open(path, encoding="utf-8").read())
          decision = decide_fallback(payload.get("workflow_runs", []), now=datetime.now(timezone.utc))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_fallback={str(decision["run_fallback"]).lower()}\n")
              out.write(f"reason={decision["reason"]}\n")
          print(json.dumps(decision, ensure_ascii=False))
          PY

      - name: Upload failover decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-failover-guard-${{ github.run_id }}
          path: ${{ runner.temp }}/failover/
          retention-days: 14

  fallback:
    needs: guard
    if: ${{ needs.guard.outputs.run_fallback == 'true' }}
    # The deterministic frontier now has its own permanent hosted loop.
    # Automatic heartbeat failover is intentionally disabled under the always-available
  # self-hosted capacity contract. Manual dispatch remains available for explicit recovery.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: governance_reproduction
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bounded dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pandas pypdf statsmodels==0.15.0

      - name: Run hosted failover lane
        shell: bash
        run: |
          set -euo pipefail
          out="research/runs/hosted_fallback/${GITHUB_RUN_ID}/${{ matrix.lane }}"
          mkdir -p "$out"
          python -m automation.hosted_fallback_worker --lane "${{ matrix.lane }}" --output-dir "$out"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/runs/hosted_fallback") / Path(__import__("os").environ["GITHUB_RUN_ID"]) / "${{ matrix.lane }}" / "run_manifest.json"
          m = json.loads(p.read_text(encoding="utf-8"))
          assert m["fallback_only"] is True
          assert m["formal_evidence_allowed"] is False
          assert m["formal_research_evidence"] is False
          assert m["paper_only"] is True
          assert m["live_trading_enabled"] is False
          assert m["orders_enabled"] is False
          assert m["automatic_promotion"] is False
          print("HOSTED_FAILOVER_SAFETY_OK")
          PY

      - name: Upload hosted failover evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-failover-${{ matrix.lane }}-${{ github.run_id }}
          path: research/runs/hosted_fallback/${{ github.run_id }}/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14