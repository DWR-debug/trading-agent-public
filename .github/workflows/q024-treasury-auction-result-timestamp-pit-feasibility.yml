name: Q024 Treasury Auction Result Timestamp PIT Feasibility

on:
  pull_request:
    branches: [master]
    paths:
      - "automation/q024_treasury_auction_result_timestamp_pit_feasibility.py"
      - "tests/test_q024_treasury_auction_result_timestamp_pit_feasibility.py"
      - "research/preregistrations/q024_treasury_auction_result_timestamp_pit_feasibility_2026_09_27.json"
      - ".github/workflows/q024-treasury-auction-result-timestamp-pit-feasibility.yml"
  push:
    branches:
      - research/q024-auction-result-timestamp-pit-feasibility-2026-09-27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q024-result-timestamp
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest pypdf
      - name: Regression tests
        run: python -m pytest -q tests/test_q024_treasury_auction_result_timestamp_pit_feasibility.py
      - name: Q024 source/PIT feasibility
        run: |
          set -euo pipefail
          python -m automation.q024_treasury_auction_result_timestamp_pit_feasibility             --output research/runs/source_feasibility/q024_treasury_auction_result_timestamp_pit_feasibility.json
      - name: Governance and safety gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/runs/source_feasibility/q024_treasury_auction_result_timestamp_pit_feasibility.json").read_text(encoding="utf-8"))
          assert d["governance"]["source_feasibility_only"] is True
          assert d["governance"]["performance_evaluation"] is False
          assert d["governance"]["pnl_evaluation"] is False
          assert d["governance"]["holdout_used"] is False
          assert d["governance"]["candidate_ranking"] is False
          assert d["governance"]["parameter_search"] is False
          assert d["governance"]["asset_search"] is False
          assert d["governance"]["threshold_search"] is False
          assert d["governance"]["horizon_search"] is False
          assert d["governance"]["variant_search"] is False
          assert d["governance"]["research_gate_changes"] is False
          assert d["governance"]["promotion_decision"] is False
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print(json.dumps({
              "status":d["status"],
              "events":d["fixed_population"]["total_events"],
              "rss_items":d["rss_item_count"],
              "timestamp_validated_events":d["coverage"]["timestamp_validated_events"],
              "coverage_ratio":d["coverage"]["timestamp_coverage_ratio"],
              "fingerprint":d["fingerprint"],
          }, sort_keys=True))
          PY
      - name: Evidence artifact
        uses: actions/upload-artifact@v6
        with:
          name: q024-treasury-result-timestamp-${{ github.run_id }}
          path: research/runs/source_feasibility/q024_treasury_auction_result_timestamp_pit_feasibility.json
          if-no-files-found: error
          retention-days: 30
