name: Q193-Q196 Source Feasibility

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "automation/q193_q196_source_feasibility.py"
      - "research/frontier/q193_q196_candidate_wave_2026_10_04.json"
      - "docs/research_design/Q193_Q196_DEEP_LITERATURE_AND_CANDIDATE_WAVE_2026-10-04.md"
      - ".github/workflows/q193-q196-source-feasibility.yml"
      - "tests/test_q193_q196_source_feasibility.py"

permissions:
  contents: write

concurrency:
  group: trading-agent-q193-q196-source-feasibility
  cancel-in-progress: true

jobs:
  source_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run Q193-Q196 source feasibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q193_q196_source_feasibility
          python -m automation.q193_q196_source_feasibility --output "research/runs/q193_q196_source_feasibility/${GITHUB_RUN_ID}.json"
      - name: Explicit governance boundary
        shell: bash
        run: |
          echo 'performance=false'
          echo 'holdout_selection=false'
          echo 'ranking=false'
          echo 'parameter_search=false'
          echo 'automatic_promotion=false'
          echo 'live_execution=false'

      - name: Validate non-authorizing boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('research/runs/q193_q196_source_feasibility')/f"{os.environ['GITHUB_RUN_ID']}.json"
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='DISCOVERY_SOURCE_FEASIBILITY_COMPLETED'
          assert len(d['candidate_results'])==4
          assert all(v is False for v in d['scientific_boundary'].values())
          assert d['candidate_results'][3]['status']=='DEPENDENCY_PIT_GATED'
          assert d['synthetic_mutation_checks']['future_row_prefix_invariant'] is True
          assert d['synthetic_mutation_checks']['reordering_future_row_cannot_change_prefix'] is True
          assert d['safety']['paper_only'] is True and d['safety']['live_trading_enabled'] is False and d['safety']['orders_enabled'] is False and d['safety']['automatic_promotion'] is False
          print('Q193_Q196_SOURCE_FEASIBILITY_OK')
          PY
      - name: Persist latest receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input=research/runs/q193_q196_source_feasibility/${GITHUB_RUN_ID}.json
          latest=research/evidence/q193_q196_source_feasibility_latest.json
          cp "$input" "$latest"
          for attempt in 1 2 3 4 5; do
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$current_sha" --file "$latest=$latest"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "evidence publish retries exhausted" >&2
          exit 1
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q193-q196-source-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q193_q196_source_feasibility/
          if-no-files-found: error
          retention-days: 30