name: Groq Free-Tier Preflight

on:
  schedule:
    - cron: '11 */6 * * *'
  push:
    branches: [master]
    paths:
      - "research/evidence/q187_q192_source_feasibility_latest.json"
      - "ai_requests/AI-2026-10-04-Q187-Q192-GROQ-ADVERSARIAL.json"
      - ".github/workflows/groq-free-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent-groq-free-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
      - name: Record non-inference free-only preflight
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_MODE_CONFIRMED: ${{ secrets.GROQ_FREE_MODE_CONFIRMED }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          key=bool(os.environ.get('GROQ_API_KEY','').strip())
          att=os.environ.get('GROQ_FREE_MODE_CONFIRMED','').strip().lower() in {'1','true','yes','on'}
          d={
            'schema_version':1,
            'generated_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'provider':'groq_free',
            'status':'PASS' if key and att else 'NOT_CONFIGURED',
            'api_key_present':key,
            'free_mode_attested':att,
            'inference_called':False,
            'fixed_model':'openai/gpt-oss-20b',
            'free_only':True,
            'paid_usage_allowed':False,
            'scientific_evidence_created':False,
            'performance_authorized':False
          }
          with open('ops/groq_free_preflight.json','w',encoding='utf-8') as f: json.dump(d,f,indent=2,ensure_ascii=False); f.write('\n')
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY
      - name: Persist preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/groq_free_preflight.json
          git diff --cached --quiet && exit 0
          git commit -m 'OPS: record Groq free-tier preflight'
          git push origin HEAD:master