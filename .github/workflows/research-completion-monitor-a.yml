name: Research Completion Monitor A

on:
  workflow_run:
    workflows:
      - "Q*"
      - "Top-4*"
      - "*PIT*"
      - "*Source*"
      - "*Census*"
      - "*Frontier*"
      - "*Identity*"
      - "*Reproduction*"
      - "*AI Worker*"
      - "*Literature*"
      - "Evidence Graph*"
      - "Temporal Identity*"
      - "Wide Search*"
      - "H06-P2*"
      - "Permanent Windows Local Research Loop"
    types: [completed]
  workflow_dispatch: {}


permissions:
  actions: write
  contents: read

concurrency:
  group: trading-agent-research-completion-monitor
  cancel-in-progress: true

jobs:
  wake:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.name != 'Planned Capacity Fast Dispatch' &&
      github.event.workflow_run.name != 'Resource Dashboard Update' &&
      github.event.workflow_run.name != 'Current Operational Status Synchronizer' &&
      github.event.workflow_run.name != 'Current Status Drift Guard' &&
      github.event.workflow_run.name != 'Spine Next-Gate Autonomous Router' &&
      github.event.workflow_run.name != 'Workflow Lint' &&
      github.event.workflow_run.name != 'CI' &&
      github.event.workflow_run.name != 'Full Suite Verification' &&
      github.event.workflow_run.name != 'T052 Exact Master CI Gate' &&
      github.event.workflow_run.name != 'Unified Research Orchestrator' &&
      github.event.workflow_run.name != 'Research Completion Monitor A' &&
      github.event.workflow_run.name != 'Research Completion Monitor B'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Wake bounded capacity dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "RESEARCH_COMPLETION=${{ github.event.workflow_run.name }}"
          echo "RESEARCH_COMPLETION_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
          gh workflow run planned-capacity-fast-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "CAPACITY_DISPATCH_WAKE=SUCCESS"
