name: S10 Receipt Sync

on:
  workflow_run:
    workflows: ["S10 Phone Research Worker"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.repository.full_name == 'DWR-debug/trading-agent-public' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Download S10 phone artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/s10-artifact"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          artifact_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/actions/artifacts?name=s10-phone-$RUN_ID")"
          artifact_id="$(printf '%s' "$artifact_json" | jq -r '.artifacts[0].id // empty')"
          artifact_digest="$(printf '%s' "$artifact_json" | jq -r '.artifacts[0].digest // empty')"
          if [ -n "$artifact_id" ]; then
            gh api -H 'Accept: application/vnd.github+json' "/repos/$REPO/actions/artifacts/$artifact_id/zip" > "$ROOT/artifact.zip"
            unzip -q "$ROOT/artifact.zip" -d "$ROOT/unpacked"
            {
              echo "artifact_id=$artifact_id"
              echo "artifact_digest=$artifact_digest"
              echo "artifact_root=$ROOT/unpacked"
            } >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$ROOT/unpacked"
            {
              echo "artifact_id="
              echo "artifact_digest="
              echo "artifact_root=$ROOT/unpacked"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build canonical S10 operational status
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.artifact_root }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python -m automation.s10_receipt_sync             --artifact-root "$ARTIFACT_ROOT"             --workflow-run-id "$RUN_ID"             --workflow-conclusion "$RUN_CONCLUSION"             --source-commit "$SOURCE_COMMIT"             --artifact-id "$ARTIFACT_ID"             --artifact-digest "$ARTIFACT_DIGEST"             --workflow-updated-at "$WORKFLOW_UPDATED_AT"             --output "$GITHUB_WORKSPACE/ops/s10_runtime_status.json"
          cat "$GITHUB_WORKSPACE/ops/s10_runtime_status.json"

      - name: Commit canonical S10 status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trading-agent-s10-sync"
          git config user.email "trading-agent-s10-sync@users.noreply.github.com"
          git add ops/s10_runtime_status.json
          if git diff --cached --quiet; then
            echo "No S10 operational status change."
            exit 0
          fi
          git commit -m "OPS: synchronize S10 phone runtime status"
          for attempt in 1 2; do
            echo "S10 receipt sync push attempt $attempt"
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
          done
          echo "S10 receipt sync push failed after retry."
          exit 1
