name: Q185-Q186 A-Priority Source and PIT Readiness

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths:
      - "automation/q185_q186_source_feasibility.py"
      - "automation/q185_q186_pit_readiness_r1.py"
      - "automation/q186_pit_readiness_r2.py"
      - "tests/test_q186_pit_readiness_r2.py"
      - "research/frontier/q185_q186_candidate_wave_2026_10_04.json"
      - ".github/workflows/q185-q186-source-feasibility.yml"
      - "tests/test_q185_q186_frontier.py"

permissions:
  contents: write

concurrency:
  group: trading-agent-q185-q186-frontier
  cancel-in-progress: true

jobs:
  source_feasibility:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run Q185-Q186 source feasibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q185_q186_source_feasibility
          python -m automation.q185_q186_source_feasibility --output "research/runs/q185_q186_source_feasibility/${GITHUB_RUN_ID}.json"
      - name: Validate source boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/q185_q186_source_feasibility") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "DISCOVERY_SOURCE_FEASIBILITY_COMPLETED"
          assert {x["candidate_id"] for x in d["candidate_results"]} == {"Q185", "Q186"}
          assert all(d["synthetic_mutation_checks"].values())
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["paper_only"] is True
          assert d["safety"]["live_trading_enabled"] is False
          assert d["safety"]["orders_enabled"] is False
          assert d["safety"]["automatic_promotion"] is False
          print("Q185_Q186_SOURCE_FEASIBILITY_OK")
          PY
      - name: Persist latest source receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input="research/runs/q185_q186_source_feasibility/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q185_q186_source_feasibility_latest.json"
          cp "$input" "$latest"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" --file "$latest=$latest"; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Q185-Q186 source receipt publication failed"
          exit 1
      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q185-q186-source-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q185_q186_source_feasibility/
          if-no-files-found: error
          retention-days: 30

  pit_readiness:
    needs: source_feasibility
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.source_feasibility.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate PIT readiness R1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q185_q186_pit_readiness research/runs/q185_q186_source_feasibility
          python -m automation.q185_q186_source_feasibility --output "research/runs/q185_q186_source_feasibility/${GITHUB_RUN_ID}.json"
          python -m automation.q185_q186_pit_readiness_r1 --source-receipt "research/runs/q185_q186_source_feasibility/${GITHUB_RUN_ID}.json" --output "research/runs/q185_q186_pit_readiness/${GITHUB_RUN_ID}.json"
      - name: Validate PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/q185_q186_pit_readiness") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "PIT_READINESS_R1_COMPLETED_NO_PERFORMANCE"
          assert {x["candidate_id"] for x in d["candidate_results"]} == {"Q185", "Q186"}
          assert all(d["synthetic_mutation_checks"].values())
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          print("Q185_Q186_PIT_READINESS_R1_OK")
          PY
      - name: Persist latest PIT receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input="research/runs/q185_q186_pit_readiness/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q185_q186_pit_readiness_r1_latest.json"
          cp "$input" "$latest"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" --file "$latest=$latest"; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Q185-Q186 PIT receipt publication failed"
          exit 1
      - name: Upload PIT receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q185-q186-pit-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q185_q186_pit_readiness/
          if-no-files-found: error
          retention-days: 30

  q186_pit_r2:
    needs: pit_readiness
    if: github.repository == 'DWR-debug/trading-agent-public' && needs.pit_readiness.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run Q186 PIT-R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/runs/q186_pit_readiness_r2
          python -m automation.q186_pit_readiness_r2 --output "research/runs/q186_pit_readiness_r2/${GITHUB_RUN_ID}.json"
      - name: Validate R2 scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("research/runs/q186_pit_readiness_r2") / f"{os.environ['GITHUB_RUN_ID']}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "Q186_PIT_R2_CLOCK_ARCHIVE_COMPLETED_NO_PERFORMANCE"
          assert d["candidate_id"] == "Q186"
          assert d["pit_boundary"]["grant_issue_clock_proven"] is True
          assert d["pit_boundary"]["citation_publication_ordering_proven"] is False
          assert all(d["mutation_checks"].values())
          assert all(v is False for v in d["scientific_boundary"].values())
          assert d["safety"]["PAPER_ONLY"] is True
          assert d["safety"]["LIVE_TRADING_ENABLED"] is False
          assert d["safety"]["ORDERS_ENABLED"] is False
          assert d["safety"]["AUTOMATIC_PROMOTION"] is False
          print("Q186_PIT_R2_OK")
          PY
      - name: Persist latest Q186 R2 receipt
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input="research/runs/q186_pit_readiness_r2/${GITHUB_RUN_ID}.json"
          latest="research/evidence/q186_pit_readiness_r2_latest.json"
          cp "$input" "$latest"
          for attempt in 1 2 3 4 5; do
            git fetch origin master --quiet
            base_sha="$(git rev-parse origin/master)"
            if python automation/github_contents_publish.py --repository "$GITHUB_REPOSITORY" --branch master --base-sha "$base_sha" --file "$latest=$latest"; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Q186 PIT-R2 receipt publication failed"
          exit 1
      - name: Upload Q186 R2 receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q186-pit-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/runs/q186_pit_readiness_r2/
          if-no-files-found: error
          retention-days: 30
