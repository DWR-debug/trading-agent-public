name: Paper Forward Self-hosted Validation

on:
  push:
    branches:
      - feature/paper-forward-autonomous-loop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper_forward_smoke:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Bootstrap pinned Python 3.13.15
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-paper-forward"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-paper-forward.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            if not exist "%PY_ROOT%" mkdir "%PY_ROOT%" || exit /b 1
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip --version || exit /b 1
          endlocal & set "PY_EXE=%PY_EXE%"

      - name: Install focused dependencies
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "SITE=%RUNNER_TEMP%\python-site-paper-forward"
          if exist "%SITE%" rmdir /s /q "%SITE%"
          mkdir "%SITE%" || exit /b 1
          "%PY_EXE%" -m pip install --disable-pip-version-check --target "%SITE%" pytest pandas exchange-calendars statsmodels==0.15.0 || exit /b 1
          endlocal & set "SITE=%SITE%"

      - name: Safety invariants
        shell: cmd
        run: |
          @echo off
          "%PY_EXE%" -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')" || exit /b 1

      - name: Static compile
        shell: cmd
        run: |
          @echo off
          "%PY_EXE%" -m py_compile automation\paper_forward_shadow.py automation\paper_forward_market_feed.py automation\paper_forward_loop.py || exit /b 1

      - name: Focused paper-forward tests
        shell: cmd
        run: |
          @echo off
          set "PYTHONPATH=%SITE%;%GITHUB_WORKSPACE%"
          "%PY_EXE%" -m pytest -q tests\test_paper_forward_shadow.py tests\test_paper_forward_market_feed.py tests\test_paper_forward_loop.py tests\test_paper_forward_mtm.py || exit /b 1

      - name: Report
        if: always()
        shell: cmd
        run: |
          @echo off
          echo PAPER_FORWARD_VALIDATION_SHA=%GITHUB_SHA%
          echo PAPER_FORWARD_VALIDATION_RUN=%GITHUB_RUN_ID%
          echo PAPER_FORWARD_VALIDATION_RUNNER=%RUNNER_NAME%
