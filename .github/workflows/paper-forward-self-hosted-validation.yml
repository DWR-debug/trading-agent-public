name: Paper Forward Self-hosted Validation

on:
  push:
    branches:
      - feature/paper-forward-autonomous-loop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper_forward_smoke:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Safety invariants
        shell: cmd
        run: |
          @echo off
          python -c "from config import settings; assert settings.PAPER_ONLY is True; assert settings.LIVE_TRADING_ENABLED is False; assert settings.ORDERS_ENABLED is False; assert settings.AUTOMATIC_PROMOTION is False; print('SAFETY INVARIANTS OK')" || exit /b 1

      - name: Static compile
        shell: cmd
        run: |
          @echo off
          python -m py_compile automation\paper_forward_shadow.py automation\paper_forward_market_feed.py automation\paper_forward_loop.py || exit /b 1

      - name: Focused paper-forward tests
        shell: cmd
        run: |
          @echo off
          python -m pytest -q tests\test_paper_forward_shadow.py tests\test_paper_forward_market_feed.py tests\test_paper_forward_loop.py tests\test_paper_forward_mtm.py || exit /b 1

      - name: Report
        if: always()
        shell: cmd
        run: |
          @echo off
          echo PAPER_FORWARD_VALIDATION_SHA=%GITHUB_SHA%
          echo PAPER_FORWARD_VALIDATION_RUN=%GITHUB_RUN_ID%
          echo PAPER_FORWARD_VALIDATION_RUNNER=%RUNNER_NAME%
