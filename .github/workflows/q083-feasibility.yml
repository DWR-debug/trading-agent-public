name: Q083 Candidate Feasibility (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - "research/run_requests/q083_feasibility.trigger"
      - "research/preregistrations/q083_design_2026_09_28.json"
      - "automation/q083_candidate_feasibility.py"
      - "tests/test_q083_candidate_feasibility.py"
      - ".github/workflows/q083-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-q083-feasibility
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 35
    steps:
      - name: Download exact source snapshot
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "WORK=%RUNNER_TEMP%\trading-agent-q083-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "ARCHIVE=%RUNNER_TEMP%\trading-agent-q083-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%.tar.gz"
          if exist "%WORK%" rmdir /s /q "%WORK%"
          mkdir "%WORK%" || exit /b 1
          curl.exe -L --fail --silent --show-error -o "%ARCHIVE%" "https://codeload.github.com/DWR-debug/trading-agent-public/tar.gz/%GITHUB_SHA%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          cd /d "%REPO_SRC%" || exit /b 1
          echo Q083_SOURCE=%GITHUB_SHA%
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        run: |
          @echo off
          setlocal
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q083"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          set "PY_PKG=%RUNNER_TEMP%\python.3.13.15-q083.nupkg"
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest || exit /b 1
          endlocal

      - name: Run governance and PIT tests
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q083-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          set "PY_ROOT=%RUNNER_TEMP%\python-3.13.15-nuget-q083"
          set "PY_EXE=%PY_ROOT%\tools\python.exe"
          cd /d "%REPO_SRC%" || exit /b 1
          "%PY_EXE%" -m pytest -q tests/test_q083_candidate_feasibility.py || exit /b 1
          "%PY_EXE%" automation/q083_candidate_feasibility.py || exit /b 1
          endlocal

      - name: Persist feasibility provenance
        if: always()
        shell: cmd
        run: |
          @echo off
          setlocal
          set "WORK=%RUNNER_TEMP%\trading-agent-q083-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          set "REPO_SRC="
          for /d %%D in ("%WORK%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          cd /d "%REPO_SRC%" || exit /b 1
          powershell.exe -NoProfile -NonInteractive -Command "$p='research/runs/q083_feasibility'; New-Item -ItemType Directory -Force -Path $p | Out-Null; [ordered]@{schema_version=1;task_id='Q-2026-09-28-083-FEASIBILITY';run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;source_commit=$env:GITHUB_SHA;runner_name=$env:RUNNER_NAME;runner_os=$env:RUNNER_OS;runner_arch=$env:RUNNER_ARCH;paper_only=$true;live_trading_enabled=$false;orders_enabled=$false;automatic_promotion=$false;formal_scientific_evidence=$false} | ConvertTo-Json | Set-Content -Encoding UTF8 ($p + '/runner_manifest.json')"
          set "PUBLISH=%GITHUB_WORKSPACE%\research\runs\q083_feasibility"
          if exist "%PUBLISH%" rmdir /s /q "%PUBLISH%"
          mkdir "%PUBLISH%" || exit /b 1
          copy /Y "%REPO_SRC%\research\runs\q083_feasibility\result.json" "%PUBLISH%\result.json" || exit /b 1
          copy /Y "%REPO_SRC%\research\runs\q083_feasibility\runner_manifest.json" "%PUBLISH%\runner_manifest.json" || exit /b 1
          if not exist "%PUBLISH%\result.json" exit /b 1
          if not exist "%PUBLISH%\runner_manifest.json" exit /b 1
          endlocal

      - name: Upload feasibility artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q083-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/runs/q083_feasibility/
          if-no-files-found: error
          retention-days: 14
