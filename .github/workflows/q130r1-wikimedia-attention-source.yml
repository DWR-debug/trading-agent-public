name: Q130-R1 Wikimedia Attention Source Feasibility

on:
  schedule:
    - cron: "55 */12 * * *"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "automation/q130r1_wikimedia_attention_source.py"
      - "tests/test_q130r1_wikimedia_attention_source.py"
      - "research/preregistrations/q130r1_wikimedia_attention_source_2026_10_03.json"
      - ".github/workflows/q130r1-wikimedia-attention-source.yml"
  push:
    branches: [master]
    paths:
      - "automation/q130r1_wikimedia_attention_source.py"
      - "tests/test_q130r1_wikimedia_attention_source.py"
      - "research/preregistrations/q130r1_wikimedia_attention_source_2026_10_03.json"
      - ".github/workflows/q130r1-wikimedia-attention-source.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-q130r1-wikimedia-attention-source
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Contract tests
        run: python -m pytest -q tests/test_q130r1_wikimedia_attention_source.py
      - name: Run public historical source probe
        run: python -m automation.q130r1_wikimedia_attention_source --output research/runs/q130r1_wikimedia_attention_source/result.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/runs/q130r1_wikimedia_attention_source/result.json").read_text(encoding="utf-8"))
          assert p["status"] == "Q130R1_SOURCE_FEASIBILITY_COMPLETED"
          assert p["pit"]["exact_first_publication_time_proven"] is False
          assert p["pit"]["revision_lineage_proven"] is False
          assert p["pit"]["same_day_formal_use_allowed"] is False
          for key in ("performance","holdout","ranking","selection","parameter_search","threshold_search","horizon_search","asset_search","variant_search","promotion","live_execution"):
              assert p["scientific_boundary"][key] is False
          assert p["safety"]["paper_only"] is True
          print("Q130R1_BOUNDARY=PASS")
          print("Q130R1_RECEIPT=", p["receipt_fingerprint"])
          PY
      - name: Upload source/PIT receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q130r1-wikimedia-attention-source-${{ github.run_id }}
          path: research/runs/q130r1_wikimedia_attention_source/result.json
          if-no-files-found: error
          retention-days: 30
