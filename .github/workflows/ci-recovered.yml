name: CI Matrix Smoke

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      ${{
        github.repository == 'DWR-debug/trading-agent-public' &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.issue.title == 'OPS: CI matrix smoke'
      }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Matrix smoke
        run: echo CI_MATRIX_SMOKE=${{ matrix.runner }}
