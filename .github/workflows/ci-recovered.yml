name: CI Recovered Smoke

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Smoke
        run: |
          echo CI_RECOVERED_SMOKE=RUNNER_REACHED
          echo SHA=${GITHUB_SHA}
          echo RUN_ID=${GITHUB_RUN_ID}
