name: RCCSM Observational Feasibility (cloud)

on:
  push:
    branches: [master]
    paths:
      - "automation/rccsm_observational_feasibility.py"
      - "tests/test_rccsm_observational_feasibility.py"
      - "docs/research_design/RCCSM_OBSERVATIONAL_FEASIBILITY_2026-09-28.md"
      - "research/evidence/q089_coverage_result.json"
      - "research/runs/q089_coverage/T-2026-09-28-089-COVERAGE/snapshot_manifest.json"
      - ".github/workflows/rccsm-observational-feasibility-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-agent-rccsm-observational-cloud
  cancel-in-progress: true

jobs:
  structural:
    if: github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Structural tests
        run: python -m pytest -q tests/test_rccsm_observational_feasibility.py tests/test_rccsm_state_topology.py
      - name: Execute Q089 observational feasibility
        run: python -m automation.rccsm_observational_feasibility --output research/runs/rccsm_observational/q089_rccsm_observational_feasibility.json
