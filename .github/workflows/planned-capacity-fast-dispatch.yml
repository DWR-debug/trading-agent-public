name: Planned Capacity Fast Dispatch

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "Q*"
      - "Top-4*"
      - "*Research*"
      - "*PIT*"
      - "*Source*"
      - "*Census*"
      - "*Frontier*"
      - "*Identity*"
      - "*Capacity*"
      - "*Reproduction*"
      - "*AI Worker*"
      - "*Literature*"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-planned-capacity-fast-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public' &&
      (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        !contains(
          fromJSON('["CI","Full Suite Verification","T052 Exact Master CI Gate","Workflow Lint","Current Operational Status Synchronizer","Current Status Drift Guard","Resource Dashboard Update","Spine Next-Gate Autonomous Router","Unified Research Orchestrator","Planned Capacity Fast Dispatch"]'),
          github.event.workflow_run.name
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Snapshot current bounded plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=200" > "$RUNNER_TEMP/current_runs.json"

      - name: Dispatch executable ready capacity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m automation.planned_capacity_fast_dispatch             --snapshot docs/dashboard/dashboard_data.json             --runs "$RUNNER_TEMP/current_runs.json"             --output "$RUNNER_TEMP/planned_capacity_fast_dispatch.json"             --repo "$GITHUB_REPOSITORY"             --max-dispatches 6

          cat "$RUNNER_TEMP/planned_capacity_fast_dispatch.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dispatch decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: planned-capacity-fast-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/planned_capacity_fast_dispatch.json"
          if-no-files-found: error
          retention-days: 14
