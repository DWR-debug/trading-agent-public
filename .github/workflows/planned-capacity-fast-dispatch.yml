name: Planned Capacity Fast Dispatch

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "Top-4 Candidate Slot Research"
      - "Top-4 Candidate Research Capacity"
      - "Q104 I19 Historical 13F Identity Census"
      - "Q089 Contract Audit"
      - "Q185-Q186 Windows Bounded Reproduction"
      - "H06 PIT Independent Reproduction (self-hosted)"
      - "Free AI Worker Fabric"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-agent-planned-capacity-fast-dispatch
  # Keep an active dispatch pulse intact; only one newest pending pulse may wait behind it.
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'DWR-debug/trading-agent-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Snapshot current bounded plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/generate_resource_dashboard.py
          recent="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=200")"
          in_progress="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100")"
          queued="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100")"
          waiting="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=waiting&per_page=100")"
          pending="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=pending&per_page=100")"
          jq -s '
            [ .[] | .workflow_runs[]? ]
            | map(select(.id != null))
            | unique_by(.id)
          ' <(printf '%s\n' "$recent") <(printf '%s\n' "$in_progress") <(printf '%s\n' "$queued") <(printf '%s\n' "$waiting") <(printf '%s\n' "$pending") > "$RUNNER_TEMP/current_runs.json"

      - name: Dispatch executable ready capacity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m automation.planned_capacity_fast_dispatch             --snapshot docs/dashboard/dashboard_data.json             --runs "$RUNNER_TEMP/current_runs.json"             --output "$RUNNER_TEMP/planned_capacity_fast_dispatch.json"             --repo "$GITHUB_REPOSITORY"             --max-dispatches 6

          cat "$RUNNER_TEMP/planned_capacity_fast_dispatch.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dispatch decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: planned-capacity-fast-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: "${{ runner.temp }}/planned_capacity_fast_dispatch.json"
          if-no-files-found: error
          retention-days: 14
