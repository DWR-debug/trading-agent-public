name: Q185-Q186 Windows Bounded Reproduction

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/q185-q186-windows-reproduction.yml"
      - "automation/q185_q186_source_feasibility.py"
      - "automation/q185_q186_pit_readiness_r1.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: trading-agent-q185-q186-windows
  cancel-in-progress: true

jobs:
  windows_reproduction:
    if: >
      github.repository == 'DWR-debug/trading-agent-public' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        lane: [local_reproduction, data_qa]
    runs-on: [self-hosted, trading-agent-research]
    timeout-minutes: 15
    steps:
      - name: Download exact source without checkout action
        shell: cmd
        env:
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WORK_DIR: ${{ runner.temp }}\q185-q186-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if exist "%WORK_DIR%" rmdir /s /q "%WORK_DIR%"
          mkdir "%WORK_DIR%" || exit /b 1
          set "ARCHIVE=%RUNNER_TEMP%\q185-q186-source-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-%GITHUB_JOB%-%RUNNER_NAME%.tar.gz"
          curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%ARCHIVE%" "https://codeload.github.com/%GITHUB_REPOSITORY%/tar.gz/%TARGET_REF%" || exit /b 1
          tar.exe -xzf "%ARCHIVE%" -C "%WORK_DIR%" || exit /b 1
          set "REPO_SRC="
          for /d %%D in ("%WORK_DIR%\trading-agent-public-*") do set "REPO_SRC=%%~fD"
          if not defined REPO_SRC exit /b 1
          echo REPO_SRC=!REPO_SRC!>>"%GITHUB_ENV%"
          echo Q185_Q186_SOURCE_SHA=!TARGET_REF!>>"%GITHUB_ENV%"
          endlocal

      - name: Bootstrap pinned Python
        shell: cmd
        env:
          PY_ROOT: ${{ runner.temp }}\python-3.13.15-nuget-q185-q186
          PY_EXE: ${{ runner.temp }}\python-3.13.15-nuget-q185-q186\tools\python.exe
          PY_PKG: ${{ runner.temp }}\python.3.13.15-q185-q186.nupkg
        run: |
          @echo off
          setlocal
          if not exist "%PY_EXE%" (
            curl.exe -L --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o "%PY_PKG%" "https://api.nuget.org/v3-flatcontainer/python/3.13.15/python.3.13.15.nupkg" || exit /b 1
            mkdir "%PY_ROOT%" 2>nul
            tar.exe -xf "%PY_PKG%" -C "%PY_ROOT%" || exit /b 1
          )
          "%PY_EXE%" --version || exit /b 1
          "%PY_EXE%" -m pip --version >nul 2>&1
          if errorlevel 1 "%PY_EXE%" -m ensurepip --upgrade
          "%PY_EXE%" -m pip install --disable-pip-version-check pytest pandas exchange-calendars || exit /b 1
          echo Q185_Q186_PY_EXE=%PY_EXE%>>"%GITHUB_ENV%"
          endlocal

      - name: Run bounded Windows reproduction
        shell: cmd
        env:
          PAPER_ONLY: "True"
          LIVE_TRADING_ENABLED: "False"
          ORDERS_ENABLED: "False"
          AUTOMATIC_PROMOTION: "False"
        run: |
          @echo off
          setlocal EnableExtensions
          cd /d "%REPO_SRC%" || exit /b 1
          set "PYTHONPATH=%REPO_SRC%"
          "%Q185_Q186_PY_EXE%" --version || exit /b 1
          "%Q185_Q186_PY_EXE%" -m automation.q185_q186_source_feasibility --output "%RUNNER_TEMP%\q185-q186-source-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-%GITHUB_JOB%.json" || exit /b 1
          "%Q185_Q186_PY_EXE%" -m automation.q185_q186_pit_readiness_r1 --source-receipt "%RUNNER_TEMP%\q185-q186-source-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-%GITHUB_JOB%.json" --output "%RUNNER_TEMP%\q185-q186-pit-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%-%GITHUB_JOB%.json" || exit /b 1
          endlocal

      - name: Upload bounded Windows receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: q185-q186-windows-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\q185-q186-*-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json
          if-no-files-found: warn
          retention-days: 14
